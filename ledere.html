<style>
/* Samplet fra founders egne Canva-dokumenter 14.10.2026, ikke oppfunnet:
   kjerneblaa #006EFD, gradient som lysner mot hvitt, svart display-serif.
   Lys er standard - merkevaren er hvit-dominert (31-45 % av pikslene).
   Variabelnavnene er beholdt fra den moerke paletten, saa de ~90
   bruksstedene ikke maatte roeres. Kontrasttall i kommentar per linje. */
:root{
  --ink:#EBF1FB;            /* sideflate: rolig blaa, ikke hvit            */
  --ink-deep:#FFFFFF;       /* kortene loefter seg til hvitt mot den blaa   */
  --ink-raise:#FFFFFF;      /* kort som baerer egen kantlinje              */
  --gold:#006EFD;           /* FLATEfarge: knapp, aktiv fane, 2px-marg     */
  --gold-soft:#064492;      /* TEKSTfarge for blaatt: 9,33:1 mot hvitt     */
  --gold-deep:#064492;
  --lime:#0F7A4A; --red:#C0392B;
  --chalk:#0A1A2F;          /* overskrifter og broedtekst: 17,48:1         */
  --chalk-dim:#49596E;      /* all guidetekst bruker denne - moerknet da   */
                            /* grunnen ble blaa og 5,66 falt til 4,98      */
  --rule:#C9D8EF;           /* hairlines - moerknet for aa synes paa blaa   */
  --edge-ui:#7E90A6;        /* kant paa felt og knapper som MAA ses        */
  --ember:#C24F15;          /* den sparsomme oransjen: risiko, «etterpaa»  */
  --gold-metal:#E8B84B;     /* FLATE: markoerer og stegtall - «se her»     */
  --gold-ink:#7A5410;       /* TEKST-gull naar det trengs: 7,0:1 mot hvitt */
  --jet:#0C1118;            /* ekte svart til kontroller, ikke blaasvart   */
  --jet-on:#FFFFFF;         /* tekst PAA jet - maa snu i moerk modus       */
  --v1:#006EFD; --v2:#2B87FD; --v3:#57A0FE; --v4:#80B7FE;
  --grad:linear-gradient(118deg,#1B4FD8 0%,#15D8C4 33%,#C21FBF 68%,#FBE16B 100%);
  /* Samme familie, men uten de to trinnene som forsvinner paa hvitt:
     #15D8C4 gir 1,9:1 og #FBE16B gir 1,3:1 mot hvit flate. */
  --grad-ink:linear-gradient(118deg,#1B4FD8 0%,#0A5BD8 38%,#C21FBF 100%);
  --measure:36rem;
  --face:"Montserrat",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --display:"Archivo","Montserrat",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --ink:#071A31; --ink-deep:#0B2341; --ink-raise:#123055;
  --gold:#2B87FD; --gold-soft:#80B7FE; --gold-deep:#57A0FE;
  --chalk:#F2F6FC; --chalk-dim:#9DB0C9; --rule:#1E3D66;
  --edge-ui:#6E86A4; --ember:#E8833A;
  --v1:#80B7FE; --v2:#57A0FE; --v3:#2B87FD; --v4:#006EFD;
  --gold-metal:#E8B84B; --gold-ink:#F3CE78; --jet:#F2F6FC; --jet-on:#071A31;
  --grad-ink:var(--grad);
}
html[data-font="deva"]{ --face:"Noto Sans Devanagari","Montserrat",sans-serif }
html[data-font="nastaliq"]{ --face:"Noto Nastaliq Urdu","Montserrat",serif }
html[data-font="naskh"]{ --face:"Noto Naskh Arabic","Montserrat",serif }

/* «Himmelen over bruksanvisningen». Merkevarens egen gradient som et fast
   lag bak innholdet, saa siden har noe aa staa under i stedet for et moerkt
   lokk over seg. Driver bare MENS du scroller: animation-timeline gjoer at
   den har posisjon, ikke tid, saa det tegnes ingen ramme naar siden ligger
   stille. Kun transform animeres - laget males én gang, GPU-en flytter
   teksturen. Ingen background-attachment:fixed (jank i Android Chrome) og
   ingen backdrop-filter (dyr paa Mali/Adreno). ~0,3 KB gzipet. */
.sky{position:fixed;inset-block-start:0;inset-inline:0;height:46vh;z-index:-1;
  pointer-events:none;transform:translate3d(0,0,0);
  background:
    radial-gradient(120% 86% at 16% -12%, #2B87FD 0%, rgba(87,160,254,.55) 34%, rgba(128,183,254,0) 68%),
    linear-gradient(180deg, rgba(241,247,255,.75) 0%, rgba(235,241,251,0) 100%)}
html[dir="rtl"] .sky{background:
    radial-gradient(120% 86% at 84% -12%, #2B87FD 0%, rgba(87,160,254,.55) 34%, rgba(128,183,254,0) 68%),
    linear-gradient(180deg, rgba(241,247,255,.75) 0%, rgba(235,241,251,0) 100%)}
:root[data-theme="dark"] .sky{background:
    radial-gradient(120% 86% at 16% -12%, rgba(6,68,146,.55) 0%, rgba(11,35,65,.35) 40%, rgba(11,35,65,0) 72%),
    linear-gradient(180deg, rgba(11,35,65,.85) 0%, rgba(7,26,49,0) 100%)}
:root[data-theme="dark"][dir="rtl"] .sky{background:
    radial-gradient(120% 86% at 84% -12%, rgba(6,68,146,.55) 0%, rgba(11,35,65,.35) 40%, rgba(11,35,65,0) 72%),
    linear-gradient(180deg, rgba(11,35,65,.85) 0%, rgba(7,26,49,0) 100%)}
@keyframes drift{
  from{transform:translate3d(-2%,0,0) scale(1.04)}
  to{transform:translate3d(2%,-1.5%,0) scale(1.12)}}
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline:scroll()){
    .sky{animation:drift 1s linear both;animation-timeline:scroll(root block)}}}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--face);
  font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* Nastaliq stabler bokstavformer vertikalt INNE i linja, saa 14px nastaliq
   har omtrent samme detaljnivaa som 10px latinsk. Maalt foer endring:
   guidetekst 15,2px, markoerforklaringer 14,08px — saa vidt lesbart.
   Roten loeftes per skriftsystem, og alle rem-verdier foelger med. */
html[data-font="nastaliq"]{font-size:18px}
html[data-font="naskh"]{font-size:18px}
html[data-font="deva"]{font-size:17.5px}
html[data-font="nastaliq"] body{line-height:1.9}
html[data-font="naskh"] body{line-height:1.9}
html[data-font="deva"] body{line-height:1.8}
/* Noto Nastaliq Urdu finnes i 400 og 700. Ber vi om 800 eller 900, lager
   nettleseren syntetisk fet — og paa en skrift der strekene allerede
   overlapper, smoerer det teksten ut i stedet for aa framheve den. */
html[data-font="nastaliq"] h1,html[data-font="nastaliq"] h2,
html[data-font="nastaliq"] h3,html[data-font="nastaliq"] .t{font-weight:500}
html[data-font="nastaliq"] strong,html[data-font="nastaliq"] b,
html[data-font="nastaliq"] .wm{font-weight:700}
/* Overskriftene skal IKKE foelge den loeftede roten - da blir de vegger.
   Egne tak, i em av seg selv, saa brodteksten kan vaere lesbar uten at
   titlene roper. */
html[data-font="nastaliq"] .sec > h2{font-size:1.16rem;line-height:1.5}
html[data-font="nastaliq"] .plate .t{font-size:1.04rem;line-height:1.55}
html[data-font="nastaliq"] .plate[data-cat="start"] .t{font-size:1.12rem}
html[data-font="nastaliq"] .plate .d{font-size:.92rem;line-height:1.85}
.shell{max-width:46rem;margin:0 auto;padding:0 clamp(18px,5vw,40px) 72px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
[hidden]{display:none !important}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:26px 0 0;border-bottom:1px solid var(--rule)}
.wordmark{display:flex;align-items:center;gap:11px;padding-bottom:12px}
.mono{width:40px;height:40px;flex:0 0 auto;display:block}
.wordmark .wm{display:block;font-family:var(--display);font-weight:800;font-size:18px;
  font-variation-settings:"wdth" 94;letter-spacing:.11em;text-transform:uppercase;
  line-height:1;color:var(--chalk)}
/* «AIM» er fortsatt poenget i navnet, men det baeres av vekt, ikke av en
   andre farge. Ett ordmerke skal ha én farge naar det staar inntil en
   gradient - ellers konkurrerer de. */
.wordmark .wm em{font-style:normal;font-weight:500;color:inherit}
.wordmark .tag{display:block;margin-top:5px;font-size:10px;letter-spacing:.22em;
  color:var(--chalk-dim);font-weight:600;font-family:var(--display);text-transform:uppercase}
/* Alle fem skal paa én linje ogsaa paa 360px, ellers havner urdu til
   venstre paa linje to - stikk motsatt av hensikten med aa sette den sist. */
.switch{display:flex;gap:4px;padding-bottom:8px;align-items:center}
.switch button{background:var(--ink-deep);border:1px solid var(--rule);border-radius:999px;
  color:var(--chalk);font:inherit;font-size:13px;font-weight:700;
  padding:7px clamp(8px,2.6vw,14px);
  cursor:pointer;font-family:var(--display);min-height:38px;line-height:1;
  white-space:nowrap;transition:none}
.switch button:hover{border-color:var(--gold)}
/* Aktivt spraak: svart flate med gull understrek. Svart baerer kontrasten,
   gullet sier hvilken. Begge deler leses paa en billig skjerm i dagslys. */
.switch button[aria-pressed="true"]{background:var(--jet);border-color:var(--jet);
  color:var(--jet-on);box-shadow:inset 0 -3px 0 0 var(--gold-metal)}
/* Lys/moerk er en KONTROLL, ikke et spraak - den skilles ut. */
.switch .thm{font-size:15px;margin-inline-start:auto;padding:7px 11px;
  border-style:dashed;color:var(--chalk-dim);flex:0 0 auto}
.switch .thm:hover{color:var(--chalk);border-color:var(--gold-metal)}

/* hero */
.hero{padding:52px 0 40px}
.hero h1{margin:0;font-family:var(--display);font-weight:800;
  font-variation-settings:"wdth" 88;
  font-size:clamp(2.5rem,10.5vw,4.6rem);line-height:.94;letter-spacing:-.028em;
  text-transform:none;text-wrap:balance}
html[data-font="deva"] .hero h1,html[data-font="nastaliq"] .hero h1,html[data-font="naskh"] .hero h1{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.3;
  font-size:clamp(2rem,8vw,3.4rem)}
/* Maa staa ETTER den felles regelen over - samme spesifisitet, saa det er
   rekkefoelgen som avgjoer. Foerste forsoek laa foran og ble overstyrt:
   maalt 36px i stedet for 28,8. */
html[data-font="nastaliq"] .hero h1{font-size:clamp(1.6rem,6.4vw,2.5rem);line-height:1.42}
.hero h1 span{display:block}
/* Gradienten bor i logoen og i regelstreken under hver h2. Paa overskriften
   ble den dekorasjon — og halvt usynlig paa hvitt. Dyp blaa i stedet: 9,33:1,
   og to toner leser som ett utsagn i stedet for to. */
.hero h1 span:last-child{color:var(--gold-soft)}
.hero p{margin:26px 0 0;max-width:var(--measure);color:var(--chalk-dim);font-size:1.02rem}
@media (prefers-reduced-motion:no-preference){
  .hero h1 span{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
  .hero h1 span:nth-child(2){animation-delay:.07s}
}
@keyframes rise{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}

/* sections */
.sec{padding:50px 0 0}
.sec > h2{margin:0 0 22px;font-size:1.42rem;font-weight:700;letter-spacing:-.015em;
  color:var(--chalk);font-family:var(--display);font-variation-settings:"wdth" 92}
html[data-font="deva"] .sec > h2,html[data-font="nastaliq"] .sec > h2,html[data-font="naskh"] .sec > h2{
  font-family:var(--face);letter-spacing:0}
.sec > h2 b{display:block;width:46px;height:3px;background:var(--grad);margin-top:11px}
.lede{max-width:var(--measure);color:var(--chalk-dim);margin:0 0 26px}

/* sponsor */
.spon{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin:30px 0 0;
  padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:.86rem;color:var(--chalk-dim)}
.spon strong{color:var(--chalk);font-weight:700}
.spon .fp{font-family:var(--mono);font-size:.82rem;color:var(--gold-soft);font-weight:700;
  letter-spacing:.04em;background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:4px;padding:2px 7px}
.guide > li::before,.rail > li::before,.pin,.keys li::before{font-variant-numeric:tabular-nums}
.spon button{background:none;border:0;color:var(--gold-soft);font:inherit;font-size:.86rem;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* primary action */
.slab{display:block;background:var(--grad);color:#071A31;text-decoration:none;
  border-radius:2px;
  padding:22px 24px;margin:0 0 2px;border:0}
.slab .t{display:block;font-family:"Montserrat",sans-serif;font-weight:900;font-size:1.4rem;
  letter-spacing:.01em;line-height:1.12;text-transform:uppercase}
html[data-font="deva"] .slab .t,html[data-font="nastaliq"] .slab .t,html[data-font="naskh"] .slab .t{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.7}
.slab .s{display:block;margin-top:5px;font-size:.9rem;opacity:.72;font-weight:600}
.slab:hover,.slab:focus-visible{filter:brightness(1.12)}

/* ruled link rows */
/* Rader paa blaa grunn saa ut som tekst. Naa er de et hvitt kort med
   egne rader, tittelen i lenkefargen og et stoerre, tydeligere maal. */
.rows{background:var(--ink-deep);border:1px solid var(--rule);border-radius:8px;
  overflow:hidden}
/* Tittel OVER undertekst, som en listerad i en app. Side om side presset
   underteksten ned i en smal soeyle med ett ord per linje paa mobil. */
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t go" "s go";
  column-gap:12px;row-gap:2px;align-items:center;padding:14px 16px;
  border-top:1px solid var(--rule);text-decoration:none;color:inherit;min-height:60px}
.row.ico{grid-template-columns:30px 1fr auto;grid-template-areas:"ico t go" "ico s go"}
.row:first-child{border-top:0}
.row .ri{grid-area:ico;width:30px;height:30px;border-radius:8px;object-fit:cover}
.row .t{grid-area:t;font-weight:700;font-size:1.04rem;letter-spacing:-.01em;color:var(--gold-soft)}
.row .s{grid-area:s;color:var(--chalk-dim);font-size:.88rem;line-height:1.4}
.row:hover,.row:focus-visible{background:#F3F8FF}
.row .go{color:var(--gold);font-weight:800;font-size:1.25rem;font-family:var(--display);
  grid-area:go;line-height:1}
html[dir="rtl"] .row .go{transform:scaleX(-1)}
:root[data-theme="dark"] .row:hover,:root[data-theme="dark"] .row:focus-visible{
  background:var(--ink-raise)}

/* short list */
.rail{list-style:none;margin:0;padding:0;position:relative;counter-reset:n}
.rail::before{content:"";position:absolute;inset-block:14px;inset-inline-start:13px;
  width:1px;background:var(--rule)}
.rail > li{position:relative;padding:0 0 26px;padding-inline-start:46px;max-width:var(--measure)}
.rail > li:last-child{padding-bottom:0}
.rail > li::before{content:counter(n);counter-increment:n;position:absolute;inset-inline-start:0;
  top:-1px;width:27px;height:27px;border:1px solid var(--rule);border-radius:50%;
  background:var(--ink);color:var(--chalk-dim);display:grid;place-items:center;
  font-size:.8rem;font-weight:700;font-family:"Montserrat",sans-serif}

/* step-by-step guide */
.guide{list-style:none;counter-reset:g;margin:0;padding:0;position:relative}
.guide::before{content:"";position:absolute;inset-block:16px;inset-inline-start:15px;
  width:1px;background:var(--rule)}
.guide > li{counter-increment:g;position:relative;padding:0 0 26px;padding-inline-start:52px;
  max-width:var(--measure)}
.guide > li:last-child{padding-bottom:0}
/* Stegtallet ER avhukingen. Ett trykk, stort nok maal, og ingressen sitt
   loefte om aa «stoppe etter hvert steg og komme tilbake» blir ekte. */
.tick{position:absolute;inset-inline-start:0;top:-2px;width:33px;height:33px;
  border-radius:50%;background:var(--gold-metal);border:1.5px solid var(--jet);
  color:var(--jet);display:grid;place-items:center;font:800 .85rem/1 var(--display);
  font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.tick[aria-pressed="true"]{background:var(--jet);color:var(--gold-metal)}
/* Dimming av avhukede steg var feil paa to maater: paa nastaliq og naskh
   blir allerede fine streker uleselige ved 50 % opasitet, og man maa kunne
   lese om igjen et steg man har gjort. Fullfoeringen vises paa sirkelen
   alene — teksten staar i full styrke. */
.guide > li.done h3{color:var(--chalk-dim)}
.tick[aria-pressed="true"]::after{content:"";position:absolute;inset:0;
  border-radius:50%;box-shadow:0 0 0 3px var(--gold-metal)}
.tick{position:absolute}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 20px;
  font-family:var(--mono);font-size:.82rem;color:var(--chalk-dim)}
.prog .bar{flex:1 1 120px;height:4px;background:var(--rule);border-radius:999px;
  overflow:hidden;min-width:90px}
.prog .bar i{display:block;height:100%;background:var(--gold-metal);
  transition:width .18s linear}
.prog button{background:none;border:0;color:var(--gold-soft);font:inherit;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* Koder som maa skrives EKSAKT hoerer ikke hjemme i loepende tekst. */
.codes{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 0}
.codes button{display:inline-flex;align-items:center;gap:9px;background:var(--ink-deep);
  border:1px solid var(--rule);border-radius:6px;padding:9px 12px;cursor:pointer;
  font:inherit;font-size:.84rem;color:var(--chalk);text-align:start}
.codes button:hover{border-color:var(--gold-metal)}
.codes .k{color:var(--chalk-dim);font-size:.78rem}
/* «#Aitech» begynner med et noeytralt tegn. I en RTL-setning flyttes
   «#» til hoeyre for de latinske bokstavene og koden VISES som «Aitech#»,
   selv om verdien som kopieres er riktig. Isolering laaser visningen. */
.codes .v{font-family:var(--mono);font-weight:700;letter-spacing:.03em;
  direction:ltr;unicode-bidi:isolate;display:inline-block}
.codes .c{color:var(--gold-soft);font-size:.74rem;font-family:var(--face)}

/* Riktig app, riktig plattform. To store maal - ingen gjetting. */
.apps{display:flex;gap:8px;margin:13px 0 0;flex-wrap:wrap}
.apps a{flex:1 1 130px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--jet);color:var(--jet-on);border:1px solid var(--jet);border-radius:6px;
  padding:13px 14px;text-decoration:none;font-weight:700;font-size:.92rem;
  font-family:var(--display);min-height:46px}
.apps a:hover,.apps a:focus-visible{filter:brightness(1.25)}
.joinbtn{display:block;margin:9px 0 0;background:var(--grad);color:#071A31;
  text-decoration:none;padding:15px 16px;border-radius:6px;text-align:center;
  font-weight:800;font-size:1rem;font-family:var(--display);min-height:50px}
.joinbtn:hover,.joinbtn:focus-visible{filter:brightness(1.12)}

/* Ordlista. Lukket til man trykker, saa den som bare vil la Sonic gaa
   slipper aa scrolle forbi tolv begreper. */
.learn{display:grid;gap:2px}
.learn details{background:var(--ink-deep);border:1px solid var(--rule);border-radius:6px}
.learn summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:1rem;
  font-family:var(--display);list-style:none;display:flex;align-items:center;gap:10px;
  min-height:52px}
.learn summary::-webkit-details-marker{display:none}
.learn summary::after{content:"+";margin-inline-start:auto;color:var(--gold-soft);
  font-weight:800;font-size:1.2rem;line-height:1}
.learn details[open] summary::after{content:"\2212"}
.learn details[open] summary{border-bottom:1px solid var(--rule)}
.learn .body{padding:4px 16px 16px}
.learn .one{margin:10px 0 0;color:var(--chalk);font-size:.95rem}
.learn dl{margin:12px 0 0;display:grid;gap:3px}
.learn dt{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--chalk-dim);font-family:var(--display);font-weight:700}
.learn dd{margin:0 0 9px;font-size:.9rem;color:var(--chalk-dim)}
.learn dd.ex{font-family:var(--mono);font-size:.84rem;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);border-radius:5px;padding:9px 11px;
  direction:ltr;unicode-bidi:isolate;text-align:start}
/* Formelen er regelen de kan bruke selv. Den skiller seg fra eksempelet
   med gullkant, saa den leses som «dette er verktoeyet». */
.learn dd.fx{font-family:var(--mono);font-size:.84rem;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);
  border-inline-start:3px solid var(--gold-metal);border-radius:0 5px 5px 0;
  padding:9px 11px;direction:ltr;unicode-bidi:isolate;text-align:start}
html[dir="rtl"] .learn dd.fx{border-radius:5px 0 0 5px}
.learn .lfig{margin:13px 0 4px}
.learn .lfig svg{display:block;width:100%;height:auto}
.guide h3{margin:0 0 5px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.guide p{margin:0;color:var(--chalk-dim);font-size:.95rem}

/* language chips for the partner's own videos */
/* «Husk dette» skal leses foer broedteksten rundt, ikke etter. Gul kant
   og hvit flate loefter den ut, og den staar i full tekstfarge — ikke
   dempet, slik den gjorde foer. */
/* «Slik vet du at det gikk riktig». Groenn kant fordi den betyr
   fullfoert — her er det faktisk riktig bruk av groenn. */
.chk{margin:13px 0 0;padding:12px 15px;background:var(--ink-deep);
  border:1px solid var(--rule);border-inline-start:4px solid #0F7A4A;
  border-radius:0 6px 6px 0;font-size:.89rem;color:var(--chalk)}
html[dir="rtl"] .chk{border-radius:6px 0 0 6px}
.chk b{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  color:#0F7A4A;font-family:var(--display);margin-bottom:5px}
:root[data-theme="dark"] .chk{border-inline-start-color:#4ADE80}
:root[data-theme="dark"] .chk b{color:#4ADE80}

.vnote{margin:13px 0 0;padding:13px 15px;background:var(--ink-deep);
  border:1px solid var(--rule);border-inline-start:4px solid var(--gold-metal);
  border-radius:0 6px 6px 0;font-size:.9rem;color:var(--chalk);font-weight:500}
html[dir="rtl"] .vnote{border-radius:6px 0 0 6px}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.langs a{display:inline-block;padding:7px 12px;border:1px solid var(--rule);border-radius:999px;
  font-size:.82rem;font-weight:600;text-decoration:none;color:var(--chalk-dim);
  font-family:"Montserrat",sans-serif;background:var(--ink-deep)}
.langs a:hover,.langs a:focus-visible{border-color:var(--gold);color:var(--gold)}
.soon{margin:12px 0 0;font-size:.86rem;color:var(--chalk-dim);font-style:italic}

/* annotated screenshot */
.shot{margin:14px 0 0;position:relative;max-width:300px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:6px}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--gold-metal);
  color:var(--jet);font:800 12px/1 var(--display);display:grid;place-items:center;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--ink);pointer-events:none}
html[dir="rtl"] .pin{transform:translate(50%,-50%)}
.keys{list-style:none;margin:12px 0 0;padding:0;counter-reset:k}
.keys li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:.88rem;
  color:var(--chalk-dim)}
.keys li::before{content:counter(k);counter-increment:k;flex:0 0 auto;width:20px;height:20px;
  border-radius:50%;background:var(--gold-metal);color:var(--jet);display:grid;place-items:center;
  font:800 11px/1 var(--display);margin-top:2px}

/* earnings */
.earn{margin:0;padding:0;list-style:none}
.earn > li{padding:0 0 22px;max-width:var(--measure);position:relative;padding-inline-start:20px}
.earn > li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;
  width:8px;height:8px;background:var(--gold)}
.earn h3{margin:0 0 3px;font-size:1.04rem;font-weight:700;letter-spacing:-.01em}
.earn p{margin:0;color:var(--chalk-dim);font-size:.93rem}
.warn{max-width:var(--measure);margin:10px 0 0;padding:18px 20px;background:#FFF4EC;
  border:1px solid #F0D3BE;border-inline-start:4px solid var(--ember);
  border-radius:0 6px 6px 0;font-size:.93rem;color:var(--chalk)}
html[dir="rtl"] .warn{border-radius:6px 0 0 6px}
:root[data-theme="dark"] .warn{background:var(--ink-raise);border-color:var(--rule);
  border-inline-start-color:var(--ember)}

/* values — tiers that widen */
.tiers{margin:0;padding:0;list-style:none}
.tiers > li{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;margin-bottom:3px;
  background:var(--ink-raise);border-inline-start:3px solid var(--gold)}
.tiers > li:nth-child(1){width:76%;border-inline-start-color:var(--v1)}
.tiers > li:nth-child(2){width:84%;border-inline-start-color:var(--v2)}
.tiers > li:nth-child(3){width:92%;border-inline-start-color:var(--v3)}
.tiers > li:nth-child(4){width:100%;border-inline-start-color:var(--v4)}
@media (max-width:560px){ .tiers > li{width:100% !important} }
/* The whole word is the display type now — founder saw one 2rem Montserrat Black
   letter in four bright colours and said it read like a primary-school alphabet
   chart. Geometric/technical face per BRAND.md §1, medium weight instead of
   Black, sentence case instead of shouting caps, and the AIMPIRE acronym is
   carried by the initial in the logo gradient rather than by four flat brights. */
.tiers h3{margin:0 0 6px;font-family:var(--display);font-weight:700;
  font-variation-settings:"wdth" 90;
  font-size:clamp(1.5rem,5.6vw,2.05rem);line-height:1.04;letter-spacing:-.022em;
  text-transform:none;color:var(--chalk)}
.tiers h3 .ini{color:var(--gold-soft);
  box-shadow:inset 0 -.085em 0 0 var(--gold);padding-bottom:.03em}
html[data-font="deva"] .tiers h3,html[data-font="nastaliq"] .tiers h3,html[data-font="naskh"] .tiers h3{
  font-family:var(--display)}
.tiers p{margin:0;color:var(--chalk-dim);font-size:.92rem}

/* tre steder, tre navn */
.places{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.places > li{padding:15px 18px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold)}
.places h3{margin:0 0 3px;font-size:.95rem;font-weight:800;
  font-family:"Montserrat",sans-serif;letter-spacing:.01em}
.places p{margin:0;color:var(--chalk-dim);font-size:.9rem}
@media (min-width:620px){ .places{grid-template-columns:repeat(3,1fr)} }
/* Amplify staar i én kolonne ogsaa paa bred skjerm — fire punkter som maa
   leses i rekkefoelge, ikke tre kort som kan skumleses. */
.places.amp{grid-template-columns:1fr !important;gap:3px;max-width:var(--measure)}
.places.amp > li{border-inline-start-color:var(--ember);padding:16px 18px}
.places.amp p{color:var(--chalk);font-size:.93rem}

/* IB-seksjonen. Staar nederst fordi den er valgfri. */
.ib{display:grid;gap:3px;max-width:var(--measure)}
.ib > section{background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:6px;padding:17px 19px}
.ib h3{margin:0 0 7px;font-family:var(--display);font-weight:700;
  font-size:1.06rem;letter-spacing:-.015em}
.ib p{margin:0;color:var(--chalk);font-size:.93rem}
.ib .fig{margin:15px 0 0}
.ib .cap{margin:8px 0 0;font-size:.8rem;color:var(--chalk-dim);
  font-family:var(--mono);direction:ltr;unicode-bidi:isolate;text-align:start}
.ib .flag{margin:14px 0 0;padding:11px 13px;background:#FFF4EC;
  border:1px solid #F0D3BE;border-inline-start:4px solid var(--ember);
  border-radius:0 5px 5px 0;font-size:.85rem;color:var(--chalk)}
html[dir="rtl"] .ib .flag{border-radius:5px 0 0 5px}
:root[data-theme="dark"] .ib .flag{background:var(--ink-raise);border-color:var(--rule)}
.ib svg{display:block;width:100%;height:auto}

/* notices */
.notice{max-width:var(--measure);padding:22px 24px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold)}
.notice.alert{border-inline-start-color:var(--ember);background:#FFF4EC}
:root[data-theme="dark"] .notice.alert{background:var(--ink-raise)}
.notice h3{margin:0 0 8px;font-size:1.1rem;font-weight:700}
.notice p{margin:0 0 10px;color:var(--chalk-dim);font-size:.94rem}
.notice p:last-child{margin-bottom:0}
.notice .foot{font-size:.85rem;padding-top:12px;margin-top:14px;border-top:1px solid var(--rule)}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.choice button{flex:1 1 150px;padding:13px;border:1px solid var(--rule);background:none;
  color:var(--chalk);font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
  font-family:"Montserrat",sans-serif}
.choice button:first-child{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* leader tool */
.tool{max-width:var(--measure)}
.tool p{color:var(--chalk-dim);font-size:.94rem;margin:0 0 16px}
.tool input{width:100%;background:var(--ink-deep);border:1px solid var(--rule);color:var(--chalk);
  padding:14px 15px;font:inherit;font-size:.95rem;font-family:"Montserrat",sans-serif;
  margin-bottom:8px}
.tool input:focus{border-color:var(--gold);outline:none}
.tool .hint{font-size:.82rem;color:var(--chalk-dim);margin:0 0 14px}
.spon .who{color:var(--chalk);font-weight:800}
.tool button{width:100%;background:var(--chalk);color:var(--ink);border:0;padding:15px;
  font:inherit;font-weight:700;font-size:.98rem;cursor:pointer;font-family:"Montserrat",sans-serif}
.out{margin-top:14px;padding:14px 15px;background:var(--ink-deep);border:1px solid var(--rule);
  font-size:.8rem;word-break:break-all;line-height:1.7}
.out b{display:block;color:var(--gold-soft);margin-bottom:6px;font-size:.85rem}
.out.bad b{color:var(--gold-soft)}

.risk{max-width:var(--measure);margin:56px 0 0;padding-top:20px;border-top:1px solid var(--rule);
  color:var(--chalk-dim);font-size:.85rem}
.sig{margin:30px 0 0;font-size:.8rem;color:var(--chalk-dim);font-family:"Montserrat",sans-serif}

/* Overskrifter i ikke-latinsk skrift bruker spraakets egen skrift. */
html[data-font="nastaliq"] .sec h3,html[data-font="naskh"] .sec h3,
html[data-font="deva"] .sec h3,html[data-font="nastaliq"] .notice h3,
html[data-font="naskh"] .notice h3,html[data-font="deva"] .notice h3{font-family:var(--face);letter-spacing:0}
/* Lange forklaringer deles i avsnitt med tomme linjer i innholdet. */
.sec p{white-space:pre-line}
/* Skriftvalg under spraakraden: lite, men tydelig nok til aa oppdages. */
.script{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.script[hidden]{display:none}
.script button{font:600 .82rem/1.2 Montserrat,system-ui,sans-serif;padding:7px 13px;border-radius:999px;
  border:1px solid var(--rule);background:none;color:var(--chalk-dim);cursor:pointer}
.script button[dir=rtl]{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;font-weight:400}
.script button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
/* ---------- visninger ----------
   Kategorien er et attributt paa .shell. `hidden` (render sin) vinner alltid. */
.shell[data-view] .sec[data-cat]{display:none}
.shell[data-view="start"] .sec[data-cat="start"],
.shell[data-view="learn"] .sec[data-cat="learn"],
.shell[data-view="earn"]  .sec[data-cat="earn"],
.shell[data-view="tools"] .sec[data-cat="tools"],
.shell[data-view="faq"]   .sec[data-cat="faq"]{display:block}
/* Inne i en kategori er «Start her» allerede lest. Sponsorlinja blir staaende:
   den sier hvem lenka tilhoerer, og det gjelder paa hver side. */
.shell[data-view]:not([data-view="menu"]) .hero h1,
.shell[data-view]:not([data-view="menu"]) .hero > p{display:none}
.shell[data-view]:not([data-view="menu"]) .hero{padding:18px 0 0}
/* Varslene hoerer hjemme der beslutningen tas: forsiden og «Kom i gang». */
.shell[data-view]:not([data-view="menu"]):not([data-view="start"]) .notices{display:none}
/* Paa forsiden er «ingen sponsorlenke» bare overskriften - ellers fyller den
   hele foerste skjerm og menyen havner under bretten. Hele forklaringen staar
   i «Kom i gang». Konflikt-valget beholdes helt: det krever et svar. */
.shell[data-view="menu"] #notice-none p{display:none}
.shell[data-view="menu"] #notice-none{padding-block:14px}
.shell[data-view="menu"] #notice-none h3{margin:0}
.sec[hidden],.menu[hidden],.back[hidden]{display:none !important}
/* ---------- hovedmeny ---------- */
.menu{display:grid;gap:10px;padding:6px 0 0}
.menu .mlede{margin:0 0 16px;max-width:var(--measure);color:var(--chalk-dim);font-size:1.02rem}
.plate{display:grid;grid-template-columns:5px 1fr 30px;align-items:center;gap:0 18px;
  width:100%;text-align:start;font:inherit;color:inherit;background:var(--ink-deep);
  border:1px solid var(--rule);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;
  transition:border-color .18s ease,box-shadow .18s ease,transform .12s ease}
.plate > .stripe{align-self:stretch;min-height:94px;background:var(--rule)}
.plate > .bd{padding:19px 0}
.plate > .go{justify-self:end;margin-inline-end:18px;width:10px;height:10px;
  color:var(--gold-soft);transition:transform .18s ease}
/* Tegnet, ikke et tegn: Nastaliq tegner U+203A som en parentes. */
.plate > .go::before{content:"";display:block;width:8px;height:8px;
  border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg)}
[dir=rtl] .plate > .go{transform:scaleX(-1)}
.plate:hover{border-color:var(--gold-soft);box-shadow:0 6px 22px rgba(6,68,146,.09)}
.plate:hover > .go{transform:translateX(3px)}
[dir=rtl] .plate:hover > .go{transform:scaleX(-1) translateX(3px)}
.plate:active{transform:translateY(1px)}
:root[data-theme="dark"] .plate[data-cat="start"]{border-color:#2B5A93}
:root[data-theme="dark"] .plate:hover{box-shadow:0 6px 22px rgba(0,0,0,.35)}
.plate .t{display:block;margin:0 0 6px;font-family:var(--display);font-weight:700;
  font-variation-settings:"wdth" 92;font-size:1.2rem;letter-spacing:-.012em;color:var(--chalk)}
.plate .d{display:block;margin:0;color:var(--chalk-dim);font-size:.95rem;line-height:1.52;
  max-width:34rem}
.plate[data-cat="start"]{border-color:#B9CEEE}
.plate[data-cat="start"] .t{font-size:1.32rem}
.plate[data-cat="start"] > .stripe{background:var(--grad-ink)}
.plate[data-cat="learn"] > .stripe{background:var(--gold)}
.plate[data-cat="earn"]  > .stripe{background:var(--gold-metal)}
.plate[data-cat="tools"] > .stripe{background:var(--edge-ui)}
html[data-font="deva"] .plate .t,html[data-font="nastaliq"] .plate .t,
html[data-font="naskh"] .plate .t{font-family:var(--face);letter-spacing:0}
/* Framdrift paa foerste plate. Ekte tall fra stegene som er huket av,
   ikke pynt - den er grunnen til aa komme tilbake. */
.plate .pg{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:.85rem;
  color:var(--gold-soft);font-variant-numeric:tabular-nums}
.plate .pg i{display:block;flex:0 0 80px;height:4px;border-radius:2px;background:var(--rule)}
.plate .pg i > b{display:block;height:100%;border-radius:2px;background:var(--gold)}
/* ---------- opptak ---------- */
.clipf,.clip{display:block;margin:14px 0 0;aspect-ratio:720/1558;height:min(62vh,520px);
  width:auto;max-width:100%;border-radius:14px;border:1px solid var(--rule);background:#000}
.clipf{position:relative;padding:0;overflow:hidden;cursor:pointer}
.clipf img{display:block;width:100%;height:100%;object-fit:cover;opacity:.55}
.clipf .play{position:absolute;inset-inline:10px;bottom:12px;display:flex;align-items:center;
  gap:10px;padding:11px 14px;border-radius:999px;background:rgba(7,26,49,.86);color:#F2F6FC;
  font:600 .9rem/1.3 var(--face);text-align:start}
.clipf .play::before{content:"";flex:0 0 0;border-style:solid;border-width:7px 0 7px 12px;
  border-color:transparent transparent transparent #E8B84B}
[dir=rtl] .clipf .play::before{border-width:7px 12px 7px 0;border-color:transparent #E8B84B transparent transparent}
.clipf:hover img{opacity:.7}
/* ---------- avkryssing ---------- */
.markd{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:11px 16px;
  min-height:46px;width:100%;max-width:22rem;background:none;font:inherit;font-weight:600;
  color:var(--chalk);border:1.5px dashed var(--edge-ui);border-radius:10px;cursor:pointer;
  text-align:start;transition:background .15s,border-color .15s}
.markd::before{content:"";flex:0 0 20px;height:20px;border-radius:5px;
  border:2px solid var(--edge-ui);box-sizing:border-box}
.markd:hover{border-color:var(--gold-soft)}
.markd[aria-pressed="true"]{border-style:solid;border-color:var(--gold-metal);
  color:var(--chalk-dim);font-weight:500}
.markd[aria-pressed="true"]::before{content:"\2713";display:grid;place-items:center;
  background:var(--gold-metal);border-color:var(--gold-metal);color:#0C1118;font-size:.8rem;font-weight:800}
.progn{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.progn .alld{color:var(--chalk);font-family:var(--face);font-size:.95rem;font-weight:600}
.nextb{background:none;border:1px solid var(--rule);border-radius:999px;padding:7px 14px;
  font:inherit;font-family:var(--face);font-size:.88rem;color:var(--gold-soft);cursor:pointer}
.nextb:hover{border-color:var(--gold-soft)}
.guide > li{scroll-margin-top:70px}
/* ---------- apper ---------- */
.appc{background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;
  padding:18px 18px 18px;margin:0 0 12px}
.appc h3{margin:0 0 6px;font-family:var(--display);font-size:1.12rem;color:var(--chalk)}
html[data-font="nastaliq"] .appc h3,html[data-font="naskh"] .appc h3,
html[data-font="deva"] .appc h3{font-family:Montserrat,system-ui,sans-serif}
.appc p{margin:0;color:var(--chalk-dim)}
.appc .ah{display:flex;align-items:center;gap:13px;margin:0 0 10px}
.appc .ah h3{margin:0}
.appc .ah img{flex:0 0 48px;width:48px;height:48px;border-radius:11px;
  box-shadow:0 0 0 1px rgba(10,26,47,.08)}
.stepapps{margin:14px 0 0}
.stepapps .appc{margin:0 0 10px}
/* ---------- kalkulator ---------- */
.calc{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 16px;max-width:var(--measure)}
.cin{display:grid;gap:6px;font-size:.86rem;color:var(--chalk-dim);flex:1 1 150px}
.cin input{font:700 1.2rem/1.2 var(--display);padding:11px 14px;border-radius:10px;border:1px solid var(--edge-ui);
  background:var(--ink-deep);color:var(--chalk);width:100%;font-variant-numeric:tabular-nums}
.cper{display:flex;flex-wrap:wrap;gap:6px}
.cper button{font:inherit;font-size:.86rem;padding:9px 12px;border-radius:999px;border:1px solid var(--rule);
  background:none;color:var(--chalk-dim);cursor:pointer}
.cper button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.cbig{display:grid;gap:4px;background:var(--ink-deep);border:1px solid var(--rule);border-radius:14px;
  padding:14px 16px;margin:0 0 12px;max-width:var(--measure)}
.cbig span{font-size:.86rem;color:var(--chalk-dim)}
.cbig strong{font:800 1.7rem/1.1 var(--display);color:var(--chalk);font-variant-numeric:tabular-nums}
.cbig small{font-size:.84rem;color:var(--chalk-dim)}
.crisk{border:1px solid var(--ember);border-radius:14px;padding:12px 16px;margin:0 0 12px;max-width:var(--measure)}
.crisk h3{margin:0 0 8px;font-size:1rem;color:var(--ember)}
.crisk ul{margin:0;padding-inline-start:18px;color:var(--chalk)}
.crisk li{margin:0 0 6px}
/* ---------- resultater ---------- */
.rsfig{max-width:var(--measure);margin:6px 0 4px}
.rsfig svg{display:block;width:100%;height:auto}
.rsleg{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:.86rem;color:var(--chalk-dim);margin:0 0 16px}
.rsleg i{display:inline-block;width:12px;height:12px;border-radius:3px}
.rsleg span{margin-inline-end:12px}
.rsstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:0 0 18px;max-width:var(--measure)}
.rsstat div{background:var(--ink-deep);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.rsstat dt{font-size:.78rem;color:var(--chalk-dim);margin:0 0 3px}
.rsstat dd{margin:0;font:700 1.08rem/1.2 var(--display);color:var(--chalk);font-variant-numeric:tabular-nums}
.rsnotes{max-width:var(--measure);margin:0 0 14px;padding-inline-start:18px;color:var(--chalk-dim)}
.rsnotes li{margin:0 0 8px}
.rstab{max-width:var(--measure);margin:12px 0 0}
.rstab summary{cursor:pointer;color:var(--gold-soft);font-weight:600}
.rstab table{width:100%;border-collapse:collapse;margin:10px 0 0;font-size:.86rem;font-variant-numeric:tabular-nums}
.rstab th,.rstab td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:end}
.rstab th:first-child,.rstab td:first-child{text-align:start}
.rsrc{font-size:.88rem;color:var(--chalk-dim)}
.rsrc a{color:var(--gold-soft);font-weight:600}
/* ---------- spoersmaal og svar ---------- */
.faqs{display:block;width:100%;max-width:var(--measure);margin:0 0 16px;padding:13px 16px;
  font:inherit;color:var(--chalk);background:var(--ink-deep);border:1px solid var(--edge-ui);
  border-radius:12px}
.faqs::placeholder{color:var(--chalk-dim)}
.faql{max-width:var(--measure)}
.qa{border:1px solid var(--rule);border-radius:12px;background:var(--ink-deep);margin:0 0 8px}
.qa[hidden]{display:none}
.qa summary{list-style:none;cursor:pointer;padding:15px 44px 15px 16px;position:relative;
  font-weight:600;color:var(--chalk);line-height:1.45}
[dir=rtl] .qa summary{padding:15px 16px 15px 44px}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+";position:absolute;inset-inline-end:16px;top:12px;font-size:1.3rem;
  color:var(--gold-soft);font-weight:400}
.qa[open] summary::after{content:"\2212"}
.qa p{margin:0;padding:0 16px 16px;color:var(--chalk-dim)}
html[data-font="nastaliq"] .qa summary{font-weight:400}
/* ---------- tilbake til menyen ---------- */
/* Toppstripa klistrer seg: «Kom i gang» er ni steg langt, veien tilbake skal
   ikke ligge ni steg unna, og hvor langt man er kommet skal alltid synes. */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
  justify-content:space-between;margin:14px 0 0;padding:10px 0;background:var(--ink)}
.topbar[hidden]{display:none !important}
.minip{display:flex;align-items:center;gap:9px;font-size:.86rem;color:var(--gold-soft);
  font-variant-numeric:tabular-nums;font-weight:700}
.minip i{display:block;width:70px;height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.minip b{display:block;height:100%;background:var(--gold-metal);transition:width .2s}
.shell:not([data-view="start"]) .minip{display:none}
.back{display:inline-flex;align-items:center;gap:9px;
  margin:0;padding:9px 17px;background:var(--ink);
  border:1px solid var(--rule);border-radius:999px;font:inherit;
  font-size:.94rem;color:var(--gold-soft);cursor:pointer;transition:border-color .18s}
.back:hover{border-color:var(--gold-soft)}
.back::before{content:"\2190";font-size:1.05em}
[dir=rtl] .back::before{content:"\2192"}
@media (prefers-reduced-motion:no-preference){
  .plate{animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
  .plate:nth-of-type(2){animation-delay:.05s}
  .plate:nth-of-type(3){animation-delay:.10s}
  .plate:nth-of-type(4){animation-delay:.15s}
}
</style>

ading","راقب حسابك في MetaTrader 5","انضم إلى المجموعة"],"ar_rm":["Istakhdim rabit al-sponsor al-khass bik","Anshi' hisabak","Urbut hisab al-broker — hadhihi al-khutwa muhimma","Akkid hawiyatak","Intazir al-muwafaqa","Thabbit al-tatbiqayn","Awdi3 al-mal","Urbut hisabak bi Sonic copy trading","Raqib hisabak fi MetaTrader 5","Indamm ila al-majmu3a"],"ur_rm":["Apne sponsor ka link istemal karein","Apna account banayein","Apna broker account jorein — yeh marhala aham hai","Apni shanakht ki tasdeeq karein","Manzoori ka intezar karein","Dono apps install karein","Account mein paise daalein","Sonic copy trading se judein","Apna account MetaTrader 5 mein dekhein","Group mein shamil hon"]},"earn":{"en":{"intro":"Four ways, and one warning. Your real numbers are only ever in your IB Portal — never in a chat message.","items":[["Rebate per lot","Part of the trading cost comes back on every lot your team trades. Paid on activity. No trading, no rebate."],["Profit share","When a strategy closes a winning trade, the profit is split. The person whose money is in the account keeps the largest share."],["Team bonus","As people you introduced start trading, more levels of the structure can open. Your IB Portal shows which are open and which are still locked — the numbers on that screen are the ones that count."],["Pools and campaigns","Leader pools and seasonal campaigns come and go. Read the current terms before you count on one."]],"warning":"Trading involves real risk, and most retail accounts lose money. What you earn here depends on actual activity — there is no guaranteed income, and it can be nothing. We would rather be honest with you about that from the start."},"ur":{"intro":"کمائی کے چار راستے، اور ایک warning۔ آپ کے اصل اعداد و شمار صرف آپ کے IB Portal میں ہوتے ہیں — کسی chat میں نہیں۔","items":[["Rebate per lot","آپ کی ٹیم کے ہر lot پر trading cost کا ایک حصہ واپس آتا ہے۔ یہ سرگرمی پر ملتا ہے، وعدوں پر نہیں — trading نہیں تو rebate نہیں۔"],["Profit share","جب کوئی strategy نفع کے ساتھ trade بند کرتی ہے تو profit تقسیم ہوتا ہے۔ سب سے بڑا حصہ اُس کا رہتا ہے جس کا پیسہ account میں ہے۔"],["Team bonus","جن لوگوں کو آپ لائے ہیں، جیسے جیسے وہ trading شروع کرتے ہیں، structure کے مزید levels کھل سکتے ہیں۔ آپ کے IB Portal میں دکھتا ہے کہ کون سے levels کھل چکے ہیں اور کون سے ابھی lock ہیں — اصل اعداد وہی ہیں جو اُس screen پر ہیں۔"],["Pools and campaigns","Leader pools اور کچھ عرصے کے لیے چلنے والی campaigns آتی جاتی رہتی ہیں۔ اس لیے اِن پر بھروسہ کرنے سے پہلے IB Portal میں موجودہ شرائط ضرور پڑھ لیں۔"]],"warning":"Trading میں اصل خطرہ ہوتا ہے، اور زیادہ تر retail accounts نقصان میں رہتے ہیں۔ یہاں آپ کی کمائی اس پر ہے کہ اصل میں کتنی trading ہوتی ہے — کسی آمدنی کی ضمانت نہیں، اور یہ صفر بھی ہو سکتی ہے۔ ہم چاہتے ہیں کہ آپ یہ شروع ہی سے صاف جان لیں۔"},"no":{"intro":"Fire måter, og én advarsel. De virkelige tallene dine finnes bare i IB-portalen — aldri i en chatmelding.","items":[["Rebate per lot","En del av handelskostnaden kommer tilbake for hver lot teamet ditt handler. Utbetales etter aktivitet. Ingen handel, ingen rebate."],["Profit share","Når en strategi lukker en handel med gevinst, deles profitten. Den som har pengene sine på kontoen, beholder den største delen."],["Team bonus","Etter hvert som de du har introdusert, begynner å handle, kan flere nivåer i strukturen åpnes. IB-portalen din viser hvilke som er åpne og hvilke som fortsatt er låst — det er tallene der som gjelder."],["Pools and campaigns","Lederpotter og sesongkampanjer kommer og går. Les gjeldende vilkår før du regner med noe derfra."]],"warning":"Trading innebærer reell risiko, og de fleste privatkontoer taper penger. Det du tjener her avhenger av faktisk aktivitet — ingen inntekt er garantert, og den kan bli null. Vi vil heller være ærlige om det fra starten."},"hi":{"intro":"कमाई के चार रास्ते, और एक चेतावनी। आपके असली आँकड़े सिर्फ़ आपके IB Portal में होते हैं — किसी चैट संदेश में नहीं।","items":[["Rebate per lot","आपकी टीम जितने lot trade करती है, हर lot पर trading cost का एक हिस्सा वापस आता है। यह गतिविधि पर मिलता है। Trading नहीं, तो rebate नहीं।"],["Profit share","जब कोई strategy मुनाफ़े के साथ trade बंद करती है तो profit बँटता है। सबसे बड़ा हिस्सा उसका रहता है जिसका पैसा account में है।"],["Team bonus","जैसे-जैसे आपके जोड़े हुए लोग trading शुरू करते हैं, structure के और levels खुल सकते हैं। आपका IB Portal दिखाता है कि कौन-से levels खुले हैं और कौन-से अभी बंद — असली आँकड़े वही हैं जो उस स्क्रीन पर हैं।"],["Pools and campaigns","Leader pools और मौसमी campaigns आते-जाते रहते हैं। किसी के भरोसे रहने से पहले उसकी मौजूदा शर्तें पढ़ें।"]],"warning":"Trading में असली जोखिम है, और ज़्यादातर retail accounts नुक़सान उठाते हैं। यहाँ आपकी कमाई असल गतिविधि पर निर्भर करती है — आमदनी की कोई गारंटी नहीं, और यह शून्य भी हो सकती है। हम चाहते हैं कि आप यह शुरू से ही साफ़ जान लें।"},"ar":{"intro":"أربع طرق، وتنبيه واحد. أرقامك الحقيقية موجودة في IB Portal وحده — وليست في رسالة chat.","items":[["Rebate per lot","يعود إليك جزء من الـ trading cost عن كل lot يتداوله فريقك. ويُدفع مقابل النشاط الفعلي: بلا trading لا يوجد rebate."],["Profit share","عندما تُغلق إحدى الـ strategies صفقة رابحة، يُقسَّم الـ profit. ويبقى النصيب الأكبر لصاحب المال الموجود في الحساب."],["Team bonus","كلما بدأ مَن عرّفتهم بالـ trading، قد تُفتح مستويات أكثر من الهيكل. ويُظهر لك IB Portal أيُّها مفتوح وأيُّها ما زال مقفلاً — والأرقام التي تُظهرها تلك الشاشة هي التي يُعتدّ بها."],["Pools and campaigns","الـ leader pools والـ campaigns الموسمية تتغيّر من فترة إلى أخرى. اقرأ الشروط الحالية قبل أن تعتمد على أيٍّ منها."]],"warning":"في الـ trading خطر حقيقي، وأكثر الـ retail accounts تخسر أموالها. وما تكسبه هنا يعتمد على نشاط فعلي — لا دخل مضمون، وقد يكون صفراً. نفضّل أن نكون صريحين معك في هذا منذ البداية."},"ar_rm":{"intro":"Arba3 turuq, w tanbih wahid. Arqamak al-haqiqiya mawjuda fi IB Portal wahdah — w laysat fi risalat chat.","items":[["Rebate per lot","Ya3ud ilayk juz' min al-trading cost 3an kull lot yatadawaluh fariqak. W yudfa3 muqabil al-nashat al-fi3li: bila trading la yujad rebate."],["Profit share","3indama tughliq ihda al-strategies safqa rabiha, yuqassam al-profit. W yabqa al-nasib al-akbar li-sahib al-mal al-mawjud fil-hisab."],["Team bonus","Kullama bada' man 3arraftahum bil-trading, qad tuftah mustawayat akthar min al-haykal. W yuzhir lak IB Portal ayyuha maftuh w ayyuha ma zal muqfalan — w al-arqam allati tuzhiruha tilka al-shasha hiya allati yu3tadd biha."],["Pools and campaigns","Al-leader pools w al-campaigns al-mawsimiya tataghayyar min fatra ila ukhra. Iqra' al-shurut al-haliya qabl an ta3tamid 3ala ayy minha."]],"warning":"Fil-trading khatar haqiqi, w akthar al-retail accounts takhsar amwalaha. W ma taksibuh huna ya3tamid 3ala nashat fi3li — la dakhl madmun, w qad yakun sifran. Nufaddil an nakun sarihin ma3ak fi hadha mundhu al-bidaya."},"ur_rm":{"intro":"Kamaai ke chaar raste, aur ek warning. Aap ke asal adaad o shumar sirf aap ke IB Portal mein hote hain — kisi chat mein nahi.","items":[["Rebate per lot","Aap ki team ke har lot par trading cost ka ek hissa wapas aata hai. Yeh sargarmi par milta hai, waadon par nahi — trading nahi to rebate nahi."],["Profit share","Jab koi strategy nafa ke saath trade band karti hai to profit taqseem hota hai. Sab se bara hissa us ka rehta hai jis ka paisa account mein hai."],["Team bonus","Jin logon ko aap laaye hain, jaise jaise woh trading shuru karte hain, structure ke mazeed levels khul sakte hain. Aap ke IB Portal mein dikhta hai keh kaun se levels khul chuke hain aur kaun se abhi lock hain — asal adaad wohi hain jo us screen par hain."],["Pools and campaigns","Leader pools aur kuch arsay ke liye chalne wali campaigns aati jati rehti hain. Is liye in par bharosa karne se pehle IB Portal mein mojooda sharait zaroor parh lein."]],"warning":"Trading mein asal khatra hota hai, aur zyada tar retail accounts nuqsan mein rehte hain. Yahan aap ki kamaai is par hai keh asal mein kitni trading hoti hai — kisi aamdani ki zamanat nahi, aur yeh sifar bhi ho sakti hai. Hum chahte hain keh aap yeh shuru hi se saaf jaan lein."}},"values":{"en":[["A","Aspire","Dream big and go after it. Ambition is the starting point, not the reward."],["I","Inspire","Share what you learn, including what went wrong. Lift the person next to you."],["M","Meritocracy","Work and skill get recognised. Where you come from does not decide what you can become."],["E","Empire","Built together, or not at all. Everyone belongs and everyone contributes."]],"ur":[["A","Aspire","خواب بڑا رکھیں، پھر اُس پر کام بھی کریں۔ صرف چاہنا شروعات ہے، انعام نہیں۔"],["I","Inspire","جو سیکھیں وہ آگے بتائیں — جو غلط ہوا، وہ بھی۔ ساتھ والے کو ساتھ لے کر چلیں۔"],["M","Meritocracy","محنت اور مہارت کی قدر ہوتی ہے۔ آپ کہاں سے آئے، یہ طے نہیں کرتا کہ آپ کیا بن سکتے ہیں۔"],["E","Empire","یہ مل کر ہی بنے گا، اکیلے نہیں۔ ہر کوئی اپنا ہے، اور ہر کوئی اپنا حصہ ڈالتا ہے۔"]],"no":[["A","Aspire","Drøm stort — og gjør noe med det. Ambisjon er utgangspunktet, ikke belønningen."],["I","Inspire","Del det du lærer, også det som gikk galt. Løft den som står ved siden av deg."],["M","Meritocracy","Innsats og dyktighet teller. Hvor du kommer fra, avgjør ikke hva du kan bli."],["E","Empire","Vi bygger det sammen, ellers blir det ikke bygd. Alle hører til, og alle bidrar."]],"hi":[["A","Aspire","बड़ा सपना देखें और उसे पाने में जुट जाएँ। महत्वाकांक्षा यहाँ शुरुआत है, इनाम नहीं।"],["I","Inspire","जो सीखें वह बाँटें, जो ग़लत हुआ वह भी। अपने साथी को ऊपर उठाएँ।"],["M","Meritocracy","मेहनत और हुनर की क़द्र होती है। आप कहाँ से आए, यह तय नहीं करता कि आप क्या बन सकते हैं।"],["E","Empire","मिलकर बनेगा, वरना नहीं। हर कोई अपना है और हर कोई योगदान देता है।"]],"ar":[["A","Aspire","اطمح إلى ما هو أكبر، واسعَ إليه. الطموح نقطة البداية، لا الجائزة."],["I","Inspire","شارك ما تتعلمه، وأخطاءك أيضاً. وخُذ بيد من بجانبك."],["M","Meritocracy","التقدير هنا للعمل والمهارة. ومن أين أتيت لا يحدد إلى أين تصل."],["E","Empire","نبنيه معاً، أو لا يُبنى. لكلِّ واحد مكانه فيه، ولكلِّ واحد دوره."]],"ar_rm":[["A","Aspire","Itmah ila ma huwa akbar, w is3a ilayh. Al-tumuh nuqtat al-bidaya, la al-ja'iza."],["I","Inspire","Sharik ma tata3allamuh, w akhta'ak aydan. W khudh bi-yad man bijanbik."],["M","Meritocracy","Al-taqdir huna lil-3amal w al-mahara. W min ayn atayt la yuhaddid ila ayn tasil."],["E","Empire","Nabnih ma3an, aw la yubna. Li-kull wahid makanuh fih, w li-kull wahid dawruh."]],"ur_rm":[["A","Aspire","Khwab bara rakhein, phir us par kaam bhi karein. Sirf chahna shuruaat hai, inaam nahi."],["I","Inspire","Jo seekhein woh aage batayein — jo ghalat hua, woh bhi. Saath wale ko saath le kar chalein."],["M","Meritocracy","Mehnat aur maharat ki qadar hoti hai. Aap kahan se aaye, yeh tay nahi karta keh aap kya ban sakte hain."],["E","Empire","Yeh mil kar hi banega, akele nahi. Har koi apna hai, aur har koi apna hissa daalta hai."]]},"leaders":{"en":{"title":"Turn your IB link into an Aimpire page","body":"Open the IB Portal, go to Profile, and copy your Partner or SonicFunnel link. Paste it here. You get one link that shows this whole page in every language, with you attached as the contact for anyone who opens it.","placeholder":"Paste your invite link","button":"Make my link","ok":"Copied. Share this one.","bad":"That is not a recognised invite link. It must start with https:// and come from your IB Portal profile.","name_hint":"Add your first name and the people you invite will see who sent them."},"ur":{"title":"اپنے invite link کو Aimpire link بنائیں","body":"IB Portal کھولیں، Profile میں جائیں، اور اپنا Partner یا SonicFunnel link کاپی کریں۔ اسے یہاں پیسٹ کریں۔ آپ کو ایک ہی link ملے گا جو یہ صفحہ ہر زبان میں دکھاتا ہے، اور جو بھی اسے کھولے، اُس کے لیے رابطہ آپ ہوں گے۔","placeholder":"اپنا invite link پیسٹ کریں","button":"میرا لنک بنائیں","ok":"کاپی ہو گیا۔ یہی شیئر کریں۔","bad":"یہ link پہچانا نہیں گیا۔ یہ https:// سے شروع ہونا چاہیے اور آپ کے IB Portal کے Profile سے آنا چاہیے۔","name_hint":"اپنا پہلا نام شامل کریں، تو جنہیں آپ مدعو کریں گے وہ دیکھ سکیں گے کہ کس نے بھیجا۔"},"no":{"title":"Gjør invitasjonslenken din Anshi' rabiti","ok":"Tamm al-naskh. Sharik hadha al-rabit.","bad":"Hadha laysa rabit da3wa ma3rufan. Yajib an yabda' bi https:// w an yakun ma'khudhan min safhat Profile fi IB Portal.","name_hint":"Adif ismak al-awwal li-ya3rif al-mad3uwwun man arsal ilayhim al-rabit."},"ur_rm":{"title":"Apne invite link ko Aimpire link banayein","body":"IB Portal kholein, Profile mein jaayein, aur apna Partner ya SonicFunnel link copy karein. Ise yahan paste karein. Aap ko ek hi link milega jo yeh safha har zabaan mein dikhata hai, aur jo bhi ise khole, us ke liye raabta aap honge.","placeholder":"Apna invite link paste karein","button":"Mera link banayein","ok":"Copy ho gaya. Yehi share karein.","bad":"Yeh link pehchana nahi gaya. Yeh https:// se shuru hona chahiye aur aap ke IB Portal ke Profile se aana chahiye.","name_hint":"Apna pehla naam shamil karein, to jinhein aap invite karenge woh dekh sakenge keh kis ne bheja."}},"risk":{"en":"Trading involves risk and you can lose the money you put in. Nothing here is financial advice, and no income is promised. Use only money you can afford to lose, and check the rules that apply where you live.","ur":"Trading میں خطرہ ہے اور آپ اپنی لگائی ہوئی رقم کھو سکتے ہیں۔ یہاں کچھ بھی financial advice نہیں، اور کسی آمدنی کا وعدہ نہیں۔ صرف وہی رقم لگائیں جس کا نقصان آپ سہہ سکیں، اور اپنے ملک کے قوانین دیکھیں۔","no":"Trading innebærer risiko, og du kan tape pengene du setter inn. Ingenting her er finansiell rådgivning, og ingen inntekt er lovet. Bruk bare penger du kan tåle å tape, og sjekk reglene der du bor.","hi":"Trading में जोखिम है और आप अपनी लगाई रक़म खो सकते हैं। यहाँ कुछ भी financial advice नहीं, और किसी आमदनी का वादा नहीं। केवल वही रक़म लगाएँ जिसका नुक़सान आप सह सकें, और अपने देश के नियम देखें।","ar":"في الـ trading خطر، ويمكن أن تخسر المال الذي تودعه. ولا شيء هنا يُعدّ financial advice، ولا وعد بأي دخل. ولا تستخدم إلا مالاً تحتمل خسارته، وراجع القوانين السارية في بلد إقامتك.","ar_rm":"Fil-trading khatar, w yumkin an takhsar al-mal alla who invited you — sent you. It must be their own link, not one from a group. At the top of this page there is a line reading “You will be connected to …” ending in six letters and numbers. That code identifies them. If you do not see that line at all, you opened a plain link: the broker will not know who introduced you, and you will not have anyone attached to help. Ask them to send you theirs.",{"check":"The line at the top shows a name, or a domain and six characters. No line at all means no sponsor is attached — go back and open their link."}],["Create your account","Scroll back UP to the big button at the top that says “Open your account” and tap it. It opens CopyX in a new tab — you will see a black COPY-X logo. Use your real name and details: they have to match the ID you upload later. Choose a password you do not use anywhere else. Important: the country box starts on Albania for everyone — change it to where you actually live, because the phone code follows it. Then tick both boxes, wait for the small grey “Verifying…” box at the bottom to finish, and press Sign Up. Tapping it before the check finishes does nothing.",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"Your real name. It must match the ID you upload later, or verification fails."},{"n":2,"x":24,"y":45,"t":"A password you use nowhere else. Not your email password."},{"n":3,"x":9,"y":66,"t":"Tick both. Read them first — they say you can lose money."},{"n":4,"x":50,"y":87,"t":"If you see this yellow box, your link was missing the invite code. Go back and open your sponsor's link instead."},{"n":5,"x":24,"y":56,"t":"This starts on Albania for everyone. Change it — the phone code follows it."}],"check":"You land inside the portal and see your own name, not the sign-up form again."}],["Link your broker account — this step matters","Once you are inside the portal, find the Login to CopyX button and use that to create your Tag Markets account. Do not create the Tag Markets account any other way, such as directly on CopyX or on the broker's own site. An account made that way is not synchronised, and nothing will track correctly afterwards.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Watch this step"},"note":"The portal says it plainly: register your Tag Markets account exclusively using that button.","img":"assets/shot-copyx-register.jpg","alt":"The CopyX Registration panel in the IB Portal","marks":[{"n":1,"x":34,"y":37,"t":"Read this line. It tells you to create the broker account from here, not anywhere else."},{"n":2,"x":13,"y":71,"t":"This is the button. It says Login to CopyX — use it even the first time."},{"n":3,"x":50,"y":90,"t":"The warning in yellow: a Tag Markets account made directly on CopyX will not be linked."}],"check":"The Tag Markets account appears inside the portal. If you had to log in somewhere separately to find it, it is not linked."}],["Verify your identity","You will need your ID card or passport, and the broker also asks for a face scan. Photograph the document in good light with all four corners visible. A blurry photo is the most common reason for rejection — it is rarely anything more serious.",{"img":"assets/shot-kyc.jpg","alt":"The Upload Documents panel","marks":[{"n":1,"x":50,"y":44,"t":"Pick the document type here first. Nothing uploads until you do."},{"n":2,"x":50,"y":75,"t":"This yellow line is normal before you upload. It is not an error."},{"n":3,"x":90,"y":5,"t":"Validate means the broker has not checked your documents yet."}],"check":"The yellow «upload» line is gone and each document shows as submitted. «Validate» still showing means the broker has not looked yet, which is normal."}],["Wait for approval","Verification usually takes a short while. Until it is approved, the broker will not let you add money — you will see this notice on the wallet page. That is normal, not an error.",{"img":"assets/shot-wallet-kyc.jpg","alt":"The wallet page showing that KYC must be completed first","marks":[{"n":1,"x":50,"y":30,"t":"This pink line means verification is still pending. It disappears once your documents are approved."}],"check":"The pink line on the wallet page is gone and the Deposit button is clickable."}],["While you wait: install the two apps","Approval can take a while, so use the time. Later you will need two apps: MetaTrader 5 to see your account (step 9) and Element X for the Aimpire group (step 10). Install both now, from the official stores only — the buttons below go straight there.\n\nTag Markets, CopyX and the IB Portal need no app; they run in your browser. If anyone sends you an app file or a «Tag Markets app», do not install it.",{"appcards":true,"check":"Both apps open on your phone. You do not need to log in to either yet — that comes in steps 9 and 10."}],["Put money in","In the portal press Deposit, pick the amount — the minimum is $10 — and choose the crypto you actually hold. The portal then shows you an address, a QR code, a network, and a countdown of about fifteen minutes. Open your own wallet, whether that is Binance, RedotPay or anything else, and send from there. Before it sends, your wallet may ask you to confirm it is you — with a passkey, Face ID or a code sent to your email. That is your wallet's own check, not something Aimpire or the broker asks for. If the countdown runs out before you send, go back and get a fresh address instead of reusing the old one.\n\nAfter you send, your wallet shows a status list: submission successful, pending review, wallet processing, expected to arrive within 24 hours. Seeing «pending» is not a problem. It is the normal state for most of that window.",{"note":"Use exactly the network the portal names on its payment page — the same one on both sides. Picking the wrong one does not delay the money, it loses it. The broker accepts deposits on Ethereum (ERC20), Polygon, Tron (TRC20), BNB (BEP20), Bitcoin, Polkadot and Solana; money sent on a network that is not on that list — Arbitrum, for example — will not arrive, even if your wallet offers it. Networks also cost different amounts: sending 25 USDC over Ethereum cost 1.00 USDC in fees, four percent, so check the fee before you send.","check":"The amount shows on the wallet page in the portal. If it does not arrive, check the transaction in your OWN wallet first — the portal cannot show what never reached it.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71}}],["Connect to Sonic copy trading","This is the step that actually starts the copying. Until you do it, money can sit in the account and nothing will trade. Go to Tag Markets, open CopyX from the menu, find SONIC and press Details. The card shows the terms you are agreeing to: a 30 % performance fee, a minimum period of one month, no management fee and no joining fee.\n\nPress Connect. Enter the amount you want to start with (minimum $10) and choose the account type Amplify. Under Community Token, type #Aitech and press Verify; a Hash field appears — enter 000000 and press Submit. Tick the two boxes — the follower agreement, and that the traders are not Tag Markets — then press Copy Now (some screens call it Join to Copytrade).",{"note":"Account type: Sonic runs on an Amplify account, and the token takes it to 24× — in our own test, $109 became a trading balance of $2,616. With the token the account closes at a 5 % loss instead of 10 %. Put in only an amount you could lose completely.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"A box says «CopyX Account Created» — press Continue. SONIC then shows on your dashboard, and further down you find MT5 Credentials, which step 9 uses. If the amount shows as $0, the Submit did not go through.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["See your account in MetaTrader 5","This is where you watch the account day to day. Install MetaTrader 5, then open the portal and find MT5 Credentials — it gives you an account number, a Master Password and an Investor Password. In the app choose to add an existing account, search for T.M. Financials Ltd, and pick the server TMFinancials-Server. Your login is the account number. After that you will see Balance, Equity and Free Margin.",{"note":"The Master Password can place trades on your account. The Investor Password can only look. Never send anyone your Master Password — not a leader, not support, not anyone who asks for it. If you want someone to check your results, give them the Investor Password instead.","apps":{"lede":"Install MetaTrader 5 for your phone:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance shows the same number as the portal — and with the token, that number is 24 times what you put in. Our $109 showed as $2,616. Equity and Free Margin change once Sonic has a trade open; that is normal. If your Balance is not 24 times, stop and ask your sponsor before you do anything else.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["Join the group","The group is where questions get answered — nobody there started out knowing anything either. If you add more money later, add a little at a time.",{"apps":{"lede":"Install Element X — that exact app, not Element Classic and not another chat app. Make an account, any username. Then come back here and tap Join the Aimpire group.","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Join the Aimpire group"},"check":"You can read messages in the group, not just see its name."}]]},"ur":{"lede":"پہلے چار steps میں تقریباً پندرہ منٹ لگتے ہیں، اور آپ کے پاس اپنا شناختی کارڈ یا پاسپورٹ ہونا چاہیے۔ پھر approval کا انتظار، جو آپ کے ہاتھ میں نہیں۔ پیسے ڈالنا اور باقی سب اُس کے بعد، جب آپ کو مناسب لگے۔ آپ کسی بھی step کے بعد رک کر واپس آ سکتے ہیں — صفحہ یاد رکھتا ہے آپ کہاں تھے۔","steps":[["اپنے sponsor کا link استعمال کریں","وہی link کھولیں جو آپ کو بلانے والے نے بھیجا ہے — اُن کا اپنا link، کسی group میں پڑا ہوا نہیں۔ اس صفحے کے اوپر ایک سطر ہے — «آپ کی رجسٹریشن یہاں جائے گی: …» — جو چھ حروف اور نمبروں پر ختم ہوتی ہے۔\n\nاسی code سے پتہ چلتا ہے کہ آپ کو کون لایا ہے۔ اگر وہ سطر نظر ہی نہ آئے تو آپ نے بغیر code والا link کھولا ہے: broker کو پتا نہیں چلے گا کہ آپ کو کون لایا، اور مدد کے لیے کوئی آپ کے ساتھ جُڑا نہیں ہوگا۔ اُن سے اُن کا link مانگ لیں۔",{"check":"اوپر والی لائن میں نام نظر آئے، یا domain اور چھ حروف۔ لائن بالکل نہ ہو تو کوئی sponsor منسلک نہیں — واپس جا کر اُن کا link کھولیں۔"}],["اپنا اکاؤنٹ بنائیں","اوپر scroll کر کے سب سے اوپر والے بڑے button “اپنا اکاؤنٹ کھولیں” پر جائیں اور دبائیں۔ یہ CopyX کو نئے tab میں کھولتا ہے — آپ کو کالا COPY-X لوگو نظر آئے گا۔ اصل نام اور معلومات دیں: یہ اُس ID سے ملنی چاہیے جو آپ بعد میں اپ لوڈ کریں گے۔ ایسا password چنیں جو کہیں اور استعمال نہ کرتے ہوں۔\n\nاہم: country کا خانہ سب کے لیے پہلے سے Albania پر ہوتا ہے — اسے اپنے اصل ملک پر بدلیں، کیونکہ phone کا code اسی سے آتا ہے۔ پھر دونوں boxes پر نشان لگائیں، نیچے کا چھوٹا سرمئی “Verifying…” box مکمل ہونے دیں، اور Sign Up دبائیں۔ جانچ مکمل ہونے سے پہلے دبانے پر کچھ نہیں ہوتا۔",{"img":"assets/shot-register.jpg","alt":"CopyX کا سائن اپ فارم","marks":[{"n":1,"x":24,"y":32,"t":"اپنا اصل نام۔ یہ اُس شناختی کارڈ سے ملنا چاہیے جو آگے اپ لوڈ کریں گے، ورنہ تصدیق ناکام ہوگی۔"},{"n":2,"x":24,"y":45,"t":"ایسا پاس ورڈ جو آپ کہیں اور استعمال نہیں کرتے۔ ای میل کا پاس ورڈ نہیں۔"},{"n":3,"x":9,"y":66,"t":"دونوں پر نشان لگائیں۔ پہلے پڑھیں — ان میں لکھا ہے کہ آپ رقم کھو سکتے ہیں۔"},{"n":4,"x":50,"y":87,"t":"یہ پیلا box نظر آئے تو آپ کے link میں invite code نہیں تھا۔ واپس جا کر اپنے sponsor کا link کھولیں۔"},{"n":5,"x":24,"y":56,"t":"یہ سب کے لیے پہلے سے Albania پر ہوتا ہے۔ اسے بدلیں — phone کا code اسی سے آتا ہے۔"}],"check":"آپ portal کے اندر پہنچتے ہیں اور اپنا نام دیکھتے ہیں، دوبارہ sign-up form نہیں۔"}],["اپنا broker account جوڑیں — یہ مرحلہ اہم ہے","IB Portal میں login کرنے کے بعد Login to CopyX کا بٹن تلاش کریں اور اسی سے اپنا Tag Markets اکاؤنٹ بنائیں۔ Tag Markets اکاؤنٹ کسی اور طریقے سے نہ بنائیں، مثلاً سیدھا CopyX پر یا broker کی اپنی website پر۔ اس طرح بنایا گیا اکاؤنٹ آپ کے portal سے نہیں جُڑتا، اور بعد میں کچھ بھی ٹھیک سے track نہیں ہوگا۔",{"note":"پورٹل خود صاف لکھتا ہے: اپنا Tag Markets اکاؤنٹ صرف اُسی بٹن سے بنائیں۔","soon":"اردو ویڈیو ابھی تیار کی جا رہی ہے۔ تب تک کوئی بات سمجھ نہ آئے تو اپنے سپانسر سے پوچھ لیں — وہ اسی لیے ہیں۔","img":"assets/shot-copyx-register.jpg","alt":"IB Portal میں CopyX رجسٹریشن پینل","marks":[{"n":1,"x":34,"y":37,"t":"یہ سطر پڑھیں۔ یہ بتاتی ہے کہ بروکر اکاؤنٹ یہیں سے بنانا ہے، کہیں اور سے نہیں۔"},{"n":2,"x":13,"y":71,"t":"یہی بٹن ہے۔ اس پر Login to CopyX لکھا ہے — پہلی بار بھی یہی استعمال کریں۔"},{"n":3,"x":50,"y":90,"t":"پیلی تنبیہ: سیدھا CopyX پر بنایا گیا Tag Markets اکاؤنٹ منسلک نہیں ہوگا۔"}],"check":"Tag Markets account portal کے اندر نظر آتا ہے۔ اگر اُسے ڈھونڈنے کے لیے کہیں الگ سے login کرنا پڑا، تو وہ جڑا ہوا نہیں۔"}],["اپنی شناخت کی تصدیق کریں","آپ کو شناختی کارڈ یا پاسپورٹ چاہیے، اور broker ایک face scan بھی مانگتا ہے۔ دستاویز کی تصویر اچھی روشنی میں لیں، چاروں کونے نظر آئیں۔ دھندلی تصویر ہی سب سے عام وجہ ہے جس سے درخواست مسترد ہوتی ہے — اِس سے زیادہ سنگین وجہ کم ہی ہوتی ہے۔",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents پینل","marks":[{"n":1,"x":50,"y":44,"t":"پہلے یہاں دستاویز کی قسم چنیں۔ اس سے پہلے کچھ اپ لوڈ نہیں ہوگا۔"},{"n":2,"x":50,"y":75,"t":"اپ لوڈ سے پہلے یہ پیلی سطر معمول کی بات ہے۔ یہ خرابی نہیں۔"},{"n":3,"x":90,"y":5,"t":"Validate کا مطلب ہے بروکر نے ابھی آپ کی دستاویزات نہیں دیکھیں۔"}],"check":"پیلی «upload» لائن چلی گئی اور ہر document جمع شدہ دکھتا ہے۔ «Validate» اب بھی نظر آئے تو broker نے ابھی دیکھا نہیں — یہ معمول ہے۔"}],["منظوری کا انتظار کریں","تصدیق میں عموماً تھوڑا وقت لگتا ہے۔ جب تک یہ مکمل نہ ہو، broker آپ کو رقم ڈالنے نہیں دے گا — wallet صفحے پر آپ کو یہ اطلاع نظر آئے گی۔ یہ معمول کی بات ہے، کوئی خرابی نہیں۔",{"img":"assets/shot-wallet-kyc.jpg","alt":"wallet صفحہ جو بتاتا ہے کہ پہلے KYC مکمل کرنا ہے","marks":[{"n":1,"x":50,"y":30,"t":"یہ گلابی سطر بتاتی ہے کہ تصدیق ابھی باقی ہے۔ دستاویزات منظور ہوتے ہی یہ ہٹ جاتی ہے۔"}],"check":"Wallet page کی گلابی لائن چلی گئی اور Deposit کا بٹن دب سکتا ہے۔"}],["انتظار کے دوران: دونوں apps install کریں","Approval میں کچھ وقت لگ سکتا ہے، تو اُسے کام میں لائیں۔ آگے آپ کو دو apps چاہییں: اپنا account دیکھنے کے لیے MetaTrader 5 (step 9) اور Aimpire group کے لیے Element X (step 10)۔ دونوں ابھی install کر لیں، صرف official stores سے — نیچے کے buttons سیدھے وہیں لے جاتے ہیں۔\n\nTag Markets، CopyX اور IB Portal کے لیے کوئی app نہیں چاہیے؛ وہ browser میں چلتے ہیں۔ کوئی آپ کو app کی file یا «Tag Markets app» بھیجے تو install نہ کریں۔",{"appcards":true,"check":"دونوں apps آپ کے phone پر کھلتی ہیں۔ ابھی کسی میں login کی ضرورت نہیں — وہ steps 9 اور 10 میں آئے گا۔"}],["Account میں پیسے ڈالیں","Portal میں Deposit دبائیں، رقم چنیں — کم سے کم $10 — اور وہی crypto چنیں جو واقعی آپ کے پاس ہے۔ اس کے بعد portal آپ کو ایک address، ایک QR code، ایک network اور تقریباً پندرہ منٹ کا countdown دکھاتا ہے۔ اپنا wallet کھولیں، چاہے وہ Binance ہو، RedotPay ہو یا کوئی اور، اور وہیں سے بھیجیں۔ بھیجنے سے پہلے آپ کا wallet پوچھ سکتا ہے کہ یہ آپ ہی ہیں — passkey، Face ID یا آپ کی email پر آنے والے code سے۔ یہ آپ کے wallet کی اپنی جانچ ہے، Aimpire یا broker کی نہیں۔ بھیجنے سے پہلے countdown ختم ہو جائے تو پرانا address دوبارہ استعمال نہ کریں، نیا لے لیں۔\n\nبھیجنے کے بعد wallet ایک status فہرست دکھاتا ہے: submission successful، pending review، wallet processing، 24 گھنٹوں کے اندر پہنچنے کی توقع۔ «pending» نظر آنا کوئی مسئلہ نہیں — اُس دوران زیادہ تر وقت یہی status رہتا ہے۔",{"note":"بالکل وہی network استعمال کریں جو portal اپنے payment page پر بتاتا ہے — دونوں طرف ایک ہی۔ غلط network چُنا تو پیسہ دیر سے نہیں پہنچے گا، سیدھا ضائع ہو جائے گا۔ Broker اِن networks پر deposit لیتا ہے: Ethereum (ERC20)، Polygon، Tron (TRC20)، BNB (BEP20)، Bitcoin، Polkadot اور Solana؛ آپ کا wallet کوئی ایسا network دکھائے جو اِس فہرست میں نہیں — جیسے Arbitrum — تو پیسہ نہیں پہنچے گا۔ Networks کی fee بھی الگ ہے: Ethereum سے 25 USDC بھیجنے پر 1.00 USDC fee لگی، یعنی چار فیصد، اِس لیے بھیجنے سے پہلے fee دیکھ لیں۔","check":"رقم portal کے wallet صفحے پر نظر آتی ہے۔ نہ پہنچے تو پہلے اپنے ہی wallet میں transaction دیکھیں — portal وہ نہیں دکھا سکتا جو اُس تک پہنچا ہی نہیں۔","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71}}],["Sonic copy trading سے جُڑیں","یہی وہ step ہے جو اصل میں copying شروع کرتا ہے۔ اِس کے بغیر پیسہ account میں پڑا رہ سکتا ہے اور کوئی trade نہیں ہوگی۔ Tag Markets پر جائیں، menu سے CopyX کھولیں، SONIC ڈھونڈیں اور Details دبائیں۔ Card پر وہ شرطیں ہیں جن پر آپ ہاں کہہ رہے ہیں: 30 % performance fee، کم از کم ایک مہینہ، نہ management fee نہ joining fee۔\n\nConnect دبائیں۔ شروع کی رقم لکھیں (کم از کم $10) اور account type میں Amplify چنیں۔ Community Token میں #Aitech لکھیں اور Verify دبائیں؛ ایک Hash کا خانہ آئے گا — اُس میں 000000 لکھیں اور Submit دبائیں۔\n\nدونوں boxes پر tick کریں — follower agreement، اور یہ کہ traders، Tag Markets نہیں ہیں — پھر Copy Now دبائیں (کچھ screens پر اِس کا نام Join to Copytrade ہے)۔",{"note":"Account type: Sonic ایک Amplify account پر چلتا ہے، اور token اُسے 24× کر دیتا ہے — ہمارے اپنے test میں $109 سے $2,616 کا trading balance بنا۔ Token کے ساتھ account 10% کی بجائے 5% نقصان پر بند ہو جاتا ہے۔ صرف اُتنی رقم ڈالیں جسے پورا کھونا آپ برداشت کر سکیں۔","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"ایک box میں «CopyX Account Created» لکھا آئے گا — Continue دبائیں۔ پھر آپ کے dashboard پر SONIC نظر آئے گا، اور نیچے MT5 Credentials ملیں گے، جو step 9 م roid.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Aimpire گروپ میں شامل ہوں"},"check":"آپ group میں پیغامات پڑھ سکتے ہیں، صرف اُس کا نام نہیں دیکھتے۔"}]]},"no":{"lede":"De fire første stegene tar rundt et kvarter. Ha klar ID-kortet eller passet ditt. Så venter du på godkjenning, og det har du ikke selv kontroll over. Innskudd og resten kommer etterpå, når det passer deg. Du kan stoppe etter et hvilket som helst steg og komme tilbake — siden husker hvor du var.","steps":[["Bruk sponsorens lenke","Åpne lenken fra den som inviterte deg — vedkommendes egen, ikke en fra en gruppe. Øverst på denne siden står en linje med «Du blir koblet til …», som ender med seks bokstaver og tall. Den koden viser hvem som inviterte deg. Ser du ikke den linjen i det hele tatt, har du åpnet en lenke uten sponsorkode: megleren vet da ikke hvem som introduserte deg, og du har ingen knyttet til deg som kan hjelpe. Be vedkommende sende deg sin egen lenke.",{"check":"Linjen øverst viser et navn, eller et domene og seks tegn. Står det ingen linje der i det hele tatt, er ingen sponsor knyttet til deg — gå tilbake og åpne sponsorens lenke."}],["Opprett kontoen","Bla OPP igjen til den store knappen øverst, «Åpne kontoen din», og trykk på den. Den åpner CopyX i en ny fane — du ser en sort COPY-X-logo. Bruk ekte navn og opplysninger: de må stemme med ID-en du laster opp senere. Velg et passord du ikke bruker noe annet sted. Viktig: landfeltet står på Albania for alle — endre det til der du faktisk bor, fordi landkoden for telefonnummeret følger landet du velger. Kryss så av begge boksene, vent til den lille grå «Verifying…»-boksen nederst er ferdig, og trykk Sign Up. Trykker du før sjekken er ferdig, skjer ingenting.",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"Ditt ekte navn. Det må stemme med ID-en du laster opp etterpå, ellers går ikke verifiseringen gjennom."},{"n":2,"x":24,"y":45,"t":"Et passord du ikke bruker noe annet sted. Ikke e-postpassordet ditt."},{"n":3,"x":9,"y":66,"t":"Huk av begge. Les dem først — de sier at du kan tape penger."},{"n":4,"x":50,"y":87,"t":"Ser du denne gule boksen, manglet lenken invitasjonskoden. Gå tilbake og åpne sponsorens lenke i stedet."},{"n":5,"x":24,"y":56,"t":"Denne står på Albania for alle. Endre den — landkoden for telefonnummeret følger landet du velger."}],"check":"Du havner inne i portalen og ser ditt eget navn, ikke registreringsskjemaet på nytt."}],["Koble til meglerkontoen — dette steget er viktig","Når du er inne i portalen, finn knappen Login to CopyX og bruk den til å opprette Tag Markets-kontoen. Ikke opprett Tag Markets-kontoen på noen annen måte, for eksempel direkte på CopyX eller på meglerens egen nettside. En konto laget slik blir ikke synkronisert, og ingenting spores riktig etterpå.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Se dette steget (på engelsk)"},"note":"Portalen sier det rett ut: opprett Tag Markets-kontoen kun med den knappen.","img":"assets/shot-copyx-register.jpg","alt":"CopyX Registration-panelet i IB-portalen","marks":[{"n":1,"x":34,"y":37,"t":"Les denne linjen. Den sier at meglerkontoen opprettes herfra, ikke andre steder."},{"n":2,"x":13,"y":71,"t":"Dette er knappen. Den heter Login to CopyX — bruk den også første gang."},{"n":3,"x":50,"y":90,"t":"Advarselen i gult: en Tag Markets-konto laget direkte på CopyX blir ikke koblet."}],"check":"Tag Markets-kontoen dukker opp inne i portalen. Måtte du logge inn et annet sted for å finne den, er den ikke koblet."}],["Bekreft identiteten din","Du trenger ID-kort eller pass, og megleren ber også om en ansiktsskanning. Fotografer dokumentet i godt lys med alle fire hjørner synlige. Et uskarpt bilde er den vanligste grunnen til avslag — det er sjelden noe mer alvorlig.",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents-panelet","marks":[{"n":1,"x":50,"y":44,"t":"Velg dokumenttype her først. Ingenting lastes opp før du har gjort det."},{"n":2,"x":50,"y":75,"t":"Den gule linjen er normal før du laster opp. Det er ikke en feil."},{"n":3,"x":90,"y":5,"t":"Validate betyr at megleren ennå ikke har sjekket dokumentene dine."}],"check":"Den gule «upload»-linjen er borte, og hvert dokument står som innsendt. Står «Validate» fortsatt, har ikke megleren sett på det ennå — det er normalt."}],["Vent på godkjenning","Verifiseringen tar vanligvis ikke lang tid. Fram til den er på plass, lar ikke megleren deg sette inn penger — du ser denne meldingen på wallet-siden. Det er normalt, ikke en feil.",{"img":"assets/shot-wallet-kyc.jpg","alt":"Wallet-siden som viser at KYC må fullføres først","marks":[{"n":1,"x":50,"y":30,"t":"Den rosa linjen betyr at verifiseringen fortsatt pågår. Den forsvinner når dokumentene er godkjent."}],"check":"Den rosa linjen på wallet-siden er borte, og Deposit-knappen kan trykkes."}],["Mens du venter: installer de to appene","Godkjenningen kan ta litt tid, så bruk ventetiden. Senere trenger du to apper: MetaTrader 5 for å se kontoen din (steg 9) og Element X for Aimpire-gruppa (steg 10). Installer begge nå, kun fra de offisielle butikkene — knappene under går rett dit.\n\nTag Markets, CopyX og IB-portalen trenger ingen app; de kjører i nettleseren. Sender noen deg en appfil eller en «Tag Markets-app», ikke installer den.",{"appcards":true,"check":"Begge appene åpner seg på telefonen. Du trenger ikke logge inn i noen av dem ennå — det kommer i steg 9 og 10."}],["Sett inn penger","Trykk Deposit i portalen, velg beløpet — minimum er $10 — og velg den kryptoen du faktisk har. Portalen viser deg så en adresse, en QR-kode, et nettverk og en nedtelling på rundt femten minutter. Åpne din egen lommebok, enten det er Binance, RedotPay eller noe annet, og send derfra. Før lommeboka sender, kan den be deg bekrefte at det er deg — med passkey, Face ID eller en kode sendt til e-posten din. Det er lo
