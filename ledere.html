 malak.","Al-leverage al-a3la la yuqallil al-khatar. Kull ma yaf3aluh annahu yuharrir juz'an min al-margin, fayusmah lak bi-fath al-mazid.","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Al-balance mal al-safaqat al-mughlaqa. W al-equity huwa dhalik, za'idan aw naqisan kull ma zal maftuhan.","Balance $100, w safqa wahida khasira 40 pip 3ind 0.01 lot (−$4) → equity $96.","Al-balance huwa al-madi. W al-equity huwa mawqi3ak al-fi3li al-an. W al-khasara al-3a'ima khasara haqiqiya lam tuqayyad ba3d.","equity = balance + open profit − open loss",""],["Margin call and stop out","Hin yahbit al-equity bima yakfi muqaranatan bil-margin alladhi tatatallabuh safaqatak, yughliquha al-broker niyabatan 3ank.","Hisab bi $100 yahmil khasara 3a'ima $60 yatabaqqa lah $40 min al-equity.","3ind al-stop out la takhtar anta lahzat al-khuruj. Tuthabbat al-khasara hinaha, w ghaliban 3ind aswa' nuqta.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","Amr qa'im bil-ighlaq 3ind si3r ikhtartah musbaqan, fatatawaqqaf al-khasara 3an al-numuw.","Shira' 3ind 1.0850 ma3 stop 3ind 1.0830 yusawi 20 pip. W 3ind 0.01 lot fadhalik $2 tukhatir biha — qarrartaha qabl al-dukhul.","Min dunih yatahaddad hajm khasaratak bi-miqdar ma tahtamil al-nazar ilayha.","risk = stop in pips × pip value",""],["Limit and stop orders","Al-limit yantazir si3ran afdal. W al-stop la yunaffadh illa ba3d an yakhtariq al-si3r mustawan mu3ayyanan.","Al-si3r 1.0850. Buy Limit 3ind 1.0830 yunaffadh in habat al-si3r. W Buy Stop 3ind 1.0870 yunaffadh in sa3id.","Al-isharat tunshar bi-hadha al-ikhtisar: Buy Limit w Buy Stop w Sell Limit w Sell Stop. W ikhtiyar al-naw3 al-khati' min bayn al-arba3a ya3ni imma alla yunaffadh al-amr abadan, w imma an tuftah safqatak fil-lahza al-khati'a."],["Risk per trade","Al-mablagh — la al-pips — alladhi taqbal khasaratah fi safqa wahida.","Hisab $100, w 0.01 lot, w stop bi 20 pip = $2 tukhatir biha. Ay 2 bil-mi'a.","3ala hisab bi $100 fa'inna asghar hajm qabil lil-tadawul yukhatir aslan bi-3iddat bil-mi'a fil-safqa. W nasihat «khatir bi-wahid bil-mi'a» la tunasib ba3d.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Miqdar hubut al-equity 3an a3la nuqta balaghaha, bil-nisba al-mi'awiya.","Min $100 ila $60 hubut 40 bil-mi'a. W al-3awda ila $100 tahtaj ribhan 67 bil-mi'a, la 40.","Al-khasara w al-ta3wid laysa mutanazirayn. W silsila min al-khasa'ir al-saghira qad tatrukak bi-haja ila 3a'id lam tuhaqqiqh yawman.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","Tark al-arbah fil-hisab, fayanmu hajm al-safqa ma3 al-rasid badal an yabqa thabitan.","$100 bi-nisbat 5 bil-mi'a shahriyan ma3 tark al-ribh tasir nahwa $180 ba3d sana, la $160.","Hiya al-hujja al-sadiqa lil-sabr 3ala hisab saghir — w hiya aydan muharrik kull khutta ghayr waqi3iya satu3rad 3alayk.","final = start × (1 + rate)^periods",""]],"ur_rm":[["Pip","Woh unit jis mein price harkat karti hai — zyada tar pairs mein ashariya ke baad chautha hindsa.","EUR/USD par 1.0850 se 1.0851 tak jaana ek pip hai. 0.01 lot par yeh $0.10 banta hai.","Har target aur nateeja pips mein bataya jaata hai — aur pips ki tadaad ka koi matlab nahi jab tak peeche ka lot size maloom na ho.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","Pip ka daswan hissa. Kuch platforms points mein batate hain.","EUR/USD par «+500 points» yaani 50 pips. 0.01 lot par $5, $500 nahi.","Yahi gadbad hai jo ek maamooli nateeje ko das guna bada dikhati hai. Kisi se muwazna karne se pehle unit dekh lein.","pips = points ÷ 10",""],["Spread","Khareedne aur bechne ki qeemat ka farq. Yeh aap trade kholte hi ada karte hain.","Buy 1.08515, sell 1.08500 yaani 1.5 pips. 0.01 lot par har trade par $0.15.","Har trade spread jitni peeche se shuru hoti hai, chale ya na chale. Chhote account par din mein das trades asal kharcha hai.","spread cost = spread in pips × pip value","spread"],["Lot size","Aap kitna trade karte hain. Yahi tay karta hai keh ek harkat kitne ki hai — aur yeh har instrument par ek hi adad nahi hota.","EUR/USD: 1.00 lot ≈ $10 fi pip, 0.01 ≈ $0.10. Sona (XAUUSD): 1.00 lot = 100 ounce, yaani $1 ki harkat $100.","Yahi woh ek adad hai jo tay karta hai keh ek aam harkat bas thori pareshani hai ya account ka khaatma — aur yeh har instrument par alag hai. Sonic ka apna record sone mein hai, kisi currency pair mein nahi. Size tay karne se pehle asal value dekhein: MT5 mein symbol ki Specification kholein (computer par symbol par right-click kar ke).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage yaani aap kitni badi position rakh sakte hain. Margin aap ka woh paisa hai jo position khuli rehne tak ruka rehta hai.","0.01 lot EUR/USD ki position taqreeban $1,085 ki hai. 1:300 par is mein aap ke taqreeban $3.60 rukte hain.","Zyada leverage khatra kam nahi karti. Woh sirf margin khaali karti hai taakeh aap mazeed khol sakein.","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance band ho chuki trades ka paisa hai. Equity wohi balance hai, jis mein abhi khuli trades ka nafa ya nuqsan bhi shamil ho.","Balance $100, ek trade 0.01 lot par 40 pips nuqsan mein (−$4), yaani equity $96.","Balance guzra hua hisaab hai. Equity batati hai aap asal mein kahan khade hain. Khula nuqsan asli nuqsan hai, bas abhi likha nahi gaya.","equity = balance + open profit − open loss",""],["Margin call and stop out","Jab equity us margin ke muqable kaafi gir jaaye jo aap ki trades maangti hain, broker unhein khud band kar deta hai.","$100 ke account par $60 ka khula nuqsan ho to $40 equity bachti hai.","Stop out par nikalne ka waqt aap nahi chunte. Nuqsan usi lamhe pakka ho jaata hai, aksar badtareen mod par.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","Pehle se lagaya hua order keh trade aap ki chuni hui qeemat par band ho jaaye, taakeh nuqsan badhna ruk jaaye.","1.0850 par buy aur 1.0830 par stop yaani 20 pips. 0.01 lot par $2 khatre mein — daakhil hone se pehle tay.","Is ke baghair nuqsan ka hajm is baat se tay hota hai keh aap use kitni der dekh sakte hain.","risk = stop in pips × pip value",""],["Limit and stop orders","Limit behtar qeemat ka intezar karti hai. Stop tabhi chalti hai jab price koi level paar kare.","Price 1.0850. Buy Limit 1.0830 tab chalegi jab qeemat gire. Buy Stop 1.0870 tab chalegi jab qeemat chadhe.","Signals isi mukhtasar shakl mein aate hain: Buy Limit, Buy Stop, Sell Limit, Sell Stop. Chaar mein se ghalat wala chuna to ya to woh kabhi chalta nahi, ya aap ki trade ghalat waqt par khol deta hai."],["Risk per trade","Woh raqam — pips nahi — jo aap ek trade par khona qubool karte hain.","$100 account, 0.01 lot, 20 pips stop = $2 khatra. Yaani 2 feesad.","$100 ke account par sab se chhoti size bhi har trade par kai feesad khatre mein daalti hai. «1 feesad khatra» wala mashwara abhi theek nahi baithta.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Equity apni buland tareen satah se kitni giri, feesad mein.","$100 se $60 yaani 40 feesad neeche. Wapas $100 par aane ke liye 67 feesad chahiye, 40 nahi.","Nuqsan aur bharpaai barabar nahi hote. Lagataar chhote nuqsanaat ke baad aap ko itne return ki zaroorat pad sakti hai jitna aap ne kabhi kamaya hi nahi.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","Nafa account mein chhodna, taakeh position size balance ke saath badhe, ek jagah khadi na rahe.","$100 par mahine ke 5 feesad, nafa chhoda hua, saal bhar mein taqreeban $180 — $160 nahi.","Chhote account par sabr ki imandar daleel yahi hai — aur aap ko jo bhi ghair haqeeqi plan dikhaya jaayega, use bhi yahi chalata hai.","final = start × (1 + rate)^periods",""]]}},"amplify":{"items":{"en":[["The Aimpire token: #Aitech, then 000000","The community token field is where Aimpire's token goes. Type #Aitech, press Verify, then enter 000000 in the Hash field that appears. Without a valid token the account opens at 12× with the 10 % line, instead of 24× with the 5 % line. Check that the tick shows before you press Copy Now."],["Sonic runs on Amplify — and the token takes it from 12× to 24×","The Sonic strategy runs on an Amplify account; its own sign-up form says so. Amplify is a funded account: you trade a multiple of what you put in, and it is real money.\n\nThe broker's standard multiple is 12×. The Aimpire token — #Aitech and 000000 — takes it to 24×. In our own test, $109 became a trading balance of $2,616. The multiple works on losses exactly as it does on gains."],["The decision that is actually yours: how much","Connecting Sonic means trading amplified — the form says the strategy runs on Amplify, so there is no smaller version of it to start with. The choice that protects you is the amount.\n\nThree questions, and if any answer is yes, put in less: Would losing all of it change your month? Would this be the first time you watch a trade go against you and feel it? Is this your first trading account?\n\nStart with an amount you could lose completely, and watch it for a few weeks. If you add money later, know that an upgrade restarts the 30-day clock on your deposit."],["The liquidation rule, in the platform's own words","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nWith the token, the form adds a second line: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» Twice the size, half the room for loss: a loss of 5 % closes the account.\n\nIn money: your $109 trades as $2,616. A fall of 1 ÷ 24 = 4.2 % in that balance is $109 — your whole deposit, gone before the 5 % line even closes the account.\n\nIt is a hard trigger, not a warning. You cannot wait for prices to come back."],["What the platform says about who is responsible","Before you can submit, you tick a box that says trades on CopyX are provided by traders unaffiliated with Tag Markets, and that Tag Markets bears no responsibility or liability for the trades or their outcomes. Read it before you tick it. It means the broker holding your money is not answerable for what the strategy does with it."],["What you keep when it makes money","The presentation gives the split as 70 / 5 / 25, marked «per trade»: you keep 70 % of the profit, 5 % goes to the developers who run the system, and 25 % goes to what the presentation calls «the team» — «How the bonus model is drawn» shows how that is split. On the Sonic strategy card it shows as a 30 % performance fee, with no management fee and no joining fee.\n\nSo $100 of profit is about $70 to you. One thing is not shown anywhere: whether the fee is settled on each winning trade or on the net result over a period — the card says «Schedule 1 Week». If it is charged per winning trade, losing trades are not set off against it, and you keep less than 70 % of the overall result. Ask your sponsor which applies.\n\nThis matters when you read any published result, Myfxbook included: those curves are before the fee, not after."],["The rules, from the broker's own help centre","You can withdraw profits at any time, any hour, any day; the broker says the payout then takes 1–3 working days. Your original deposit is different: it can only be taken out 30 days after your first trade — not 30 days after you paid in — and taking it out closes the account immediately. If you upgrade the account, that 30-day clock starts again. There is no daily loss limit, only the 10 % one, and you may hold as many of these accounts as you want. With the community token, that 10 % line becomes 5 %."],["Commission and leverage, measured on your own money","Commission on an amplified account is $10 per lot on forex and metals, charged when the trade closes. The broker's own articles disagree about indices and crypto.\n\nThe form shows leverage 1:30, but it applies to the multiplied balance. Measured against your own deposit, 24 × 30 = 720:1 — more than the 1:500 of a standard account, not less. At 12× it is 360:1."]],"no":[["Aimpire-tokenet: #Aitech, så 000000","Community token-feltet er der Aimpire-tokenet skal inn. Skriv #Aitech, trykk Verify, og skriv så 000000 i Hash-feltet som dukker opp. Uten et gyldig token åpnes kontoen med 12× og 10 %-grensen, i stedet for 24× og 5 %-grensen. Sjekk at haken vises før du trykker Copy Now."],["Sonic kjører på Amplify — og tokenet tar det fra 12× til 24×","Sonic-strategien kjører på en Amplify-konto; det står i strategiens eget registreringsskjema. Amplify er en finansiert konto: du handler med et multiplum av det du setter inn, og det er ekte penger.\n\nMeglerens standard er 12×. Aimpire-tokenet — #Aitech og 000000 — tar det til 24×. I vår egen test ble $109 til en handelssaldo på $2 616. Multiplumet virker på tap nøyaktig som på gevinst."],["Valget som faktisk er ditt: hvor mye","Å koble til Sonic betyr å handle forsterket — skjemaet sier at strategien kjører på Amplify, så det finnes ingen mindre utgave å begynne med. Valget som beskytter deg, er beløpet.\n\nTre spørsmål, og er svaret ja på ett av dem, sett inn mindre: Ville det endret måneden din å tape alt? Blir dette første gang du ser en handel gå imot deg og kjenner på det? Er dette din første handelskonto?\n\nBegynn med et beløp du kan tape helt, og følg med på det i noen uker. Setter du inn mer senere, må du vite at en oppgradering starter 30-dagersklokka for innskuddet ditt på nytt."],["Likvideringsregelen, med plattformens egne ord","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nMed tokenet legger skjemaet til en linje til: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» Dobbelt så stort, halvparten så mye rom for tap: et tap på 5 % stenger kontoen.\n\nI penger: dine $109 handler som $2 616. Et fall på 1 ÷ 24 = 4,2 % i den saldoen er $109 — hele innskuddet ditt, borte før 5 %-grensen i det hele tatt stenger kontoen.\n\nDet er en hard utløser, ikke en advarsel. Du kan ikke vente på at prisene henter seg inn igjen."],["Hva plattformen selv sier om ansvar","Før du kan sende inn, huker du av en boks som sier at handlene på CopyX utføres av tradere uten tilknytning til Tag Markets, og at Tag Markets ikke bærer noe ansvar for handlene eller utfallet av dem. Les den før du huker av. Den betyr at megleren som holder pengene dine, ikke svarer for hva strategien gjør med dem."],["Hva du beholder når det går i pluss","Presentasjonen oppgir delingen som 70 / 5 / 25, merket «per trade»: du beholder 70 % av profitten, 5 % går til utviklerne som drifter systemet, og 25 % går til det presentasjonen kaller «the team» — «Slik er bonusmodellen tegnet» viser hvordan det fordeles. På Sonic-strategikortet står det som et resultathonorar (performance fee) på 30 %, uten forvaltningsavgift og uten innmeldingsavgift.\n\n$100 i profitt er altså rundt $70 til deg. Én ting vises ingen steder: om honoraret gjøres opp på hver vinnende handel eller på nettoresultatet over en periode — kortet sier «Schedule 1 Week». Trekkes det per vinnende handel, blir tapende handler ikke motregnet, og du sitter igjen med mindre enn 70 % av det samlede resultatet. Spør sponsoren din hva som gjelder.\n\nDette er viktig når du leser et publisert resultat, Myfxbook inkludert: de kurvene er før honoraret, ikke etter."],["Reglene, fra meglerens eget hjelpesenter","Gevinst kan tas ut når som helst, hele døgnet, alle dager; megleren oppgir at utbetalingen da tar 1–3 virkedager. Innskuddet ditt er noe annet: det kan først tas ut 30 dager etter din første handel — ikke 30 dager etter at du betalte inn — og tar du det ut, lukkes kontoen med det samme. Oppgraderer du kontoen, starter de 30 dagene på nytt. Det finnes ingen daglig tapsgrense, bare 10 %-grensen, og du kan ha så mange slike kontoer du vil. Med community-tokenet blir den 10 %-grensen 5 %."],["Kurtasje og leverage, målt på dine egne penger","Kurtasjen på en Amplify-konto er $10 per lot på forex og metaller, og trekkes når handelen lukkes. Meglerens egne artikler motsier hverandre om indekser og krypto.\n\nSkjemaet viser leverage 1:30, men den gjelder den multipliserte saldoen. Målt mot ditt eget innskudd blir det 24 × 30 = 720:1 — mer enn 1:500 på en vanlig konto, ikke mindre. Med 12× er det 360:1."]],"hi":[["Aimpire token: #Aitech, फिर 000000","Community token वाले field में Aimpire का token डाला जाता है। #Aitech लिखें, Verify दबाएँ, फिर जो Hash field आए, उसमें 000000 लिखें। सही token के बिना account 12× पर 10 % वाली सीमा के साथ खुलता है, 24× पर 5 % वाली सीमा के साथ नहीं। Copy Now दबाने से पहले देख लें कि tick का निशान दिख रहा है।"],["Sonic, Amplify पर चलता है — और token उसे 12× से 24× कर देता है","Sonic strategy एक Amplify account पर चलती है; उसका अपना sign-up form यही कहता है। Amplify एक funded account है: आप जितना डालते हैं उसके कई गुना से trade करते हैं, और पैसा असली है।\n\nBroker का standard 12× है। Aimpire token — #Aitech और 000000 — इसे 24× कर देता है। हमारे अपने test में $109 से $2,616 का trading balance बना। यह गुणा नुक़सान पर भी ठीक उतना ही लगता है जितना फ़ायदे पर।"],["जो फ़ैसला सच में आपका है: कितना","Sonic से जुड़ने का मतलब है amplified trading — form कहता है कि strategy Amplify पर चलती है, तो शुरुआत के लिए इसका कोई छोटा रूप नहीं है। जो चुनाव आपकी हिफ़ाज़त करता है, वह है रक़म।\n\nतीन सवाल, और अगर किसी का भी जवाब हाँ है, तो कम डालें: क्या यह पूरी रक़म खो देने से आपके महीने का हिसाब बिगड़ जाएगा? क्या किसी trade को अपने ख़िलाफ़ जाते देखना और उसकी चुभन महसूस करना आपके लिए पहली बार होगा? क्या यह आपका पहला trading account है?\n\nउतनी रक़म से शुरू करें जिसे पूरा खोना आप सह सकें, और कुछ हफ़्ते देखें। बाद में बढ़ाएँ तो जान लें: upgrade करने से आपकी जमा रक़म की 30 दिन वाली घड़ी फिर से शुरू हो जाती है।"],["Liquidation का नियम, platform के अपने शब्दों में","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nToken के साथ form एक और पंक्ति जोड़ता है: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» आकार दोगुना, नुक़सान की गुंजाइश आधी: 5% का नुक़सान account बंद कर देता है।\n\nपैसों में: आपके $109, $2,616 की तरह trade करते हैं। उस balance में 1 ÷ 24 = 4.2 % की गिरावट $109 है — यानी आपकी पूरी जमा रक़म, 5 % वाली सीमा पर account बंद होने से पहले ही ख़त्म।\n\nयह चेतावनी नहीं, सीधा trigger है। आप क़ीमतों के लौटने का इंतज़ार नहीं कर सकते।"],["ज़िम्मेदारी के बारे में platform ख़ुद क्या कहता है","Submit से पहले आप एक box पर टिक करते हैं जिसमें लिखा है कि CopyX पर trades वे traders करते हैं जिनका Tag Markets से कोई संबंध नहीं, और Tag Markets इन trades या उनके नतीजों की कोई ज़िम्मेदारी या देनदारी नहीं लेता। टिक करने से पहले पढ़ें। मतलब यह कि जो broker आपका पैसा रखता है, वह इसका जवाबदेह नहीं कि strategy उसका क्या करती है।"],["जब फ़ायदा हो, तो आपके पास क्या बचता है","Presentation में split 70 / 5 / 25 बताया गया है, और साथ में «per trade» लिखा है: profit का 70 % आपका, 5 % system चलाने वाले developers को, और 25 % उसे जाता है जिसे presentation «the team» कहता है — «Bonus model कैसे बनाया गया है» में दिखाया गया है कि वह कैसे बँटता है। Sonic strategy के card पर यह 30 % performance fee के रूप में दिखता है, और कोई management fee या joining fee नहीं।\n\nयानी $100 के profit में से क़रीब $70 आपके। एक बात कहीं नहीं दिखाई गई: fee हर जीतने वाली trade पर कटती है या किसी अवधि के net नतीजे पर — card पर लिखा है «Schedule 1 Week»। अगर यह हर जीतने वाली trade पर कटती है, तो fee का हिसाब लगाते समय घाटे वाली trades को घटाया नहीं जाता, और कुल नतीजे का 70 % से कम आपके पास रहता है। अपने sponsor से पूछें कि इनमें से कौन-सा तरीक़ा लागू होता है।\n\nMyfxbook समेत किसी भी published नतीजे को पढ़ते समय यह बात मायने रखती है: वे curves fee से पहले के हैं, बाद के नहीं।"],["नियम, broker के अपने help centre से","फ़ायदा किसी भी समय, किसी भी घड़ी, किसी भी दिन निकाला जा सकता है; broker के मुताबिक़ उसके बाद भुगतान में 1–3 कामकाजी दिन लगते हैं। आपका जमा किया पैसा अलग बात है: वह पहली trade के 30 दिन बाद ही निकल सकता है — पैसा डालने के 30 दिन बाद नहीं — और उसे निकालते ही account तुरंत बंद हो जाता है। Account upgrade किया तो वे 30 दिन फिर से शुरू। रोज़ के नुक़सान की कोई सीमा नहीं, सिर्फ़ 10 % वाली, और ऐसे जितने चाहें account रख सकते हैं। Community token के साथ यह 10 % की सीमा 5 % हो जाती है।"],["Commission और leverage, आपके अपने पैसे के हिसाब से","Amplified account में forex और metals (धातुएँ) पर commission $10 प्रति lot है, जो trade बंद होने पर लगता है। Indices (सूचकांक) और crypto के बारे में broker के अपने articles आपस में अलग-अलग बातें कहते हैं।\n\nForm पर leverage 1:30 दिखती है, लेकिन यह बढ़े हुए balance पर लगती है। आपकी अपनी जमा रक़म के हिसाब से 24 × 30 = 720:1 — यानी सामान्य account के 1:500 से ज़्यादा, कम नहीं। 12× पर यह 360:1 है।"]],"ur":[["Aimpire کا token: #Aitech، پھر 000000","Community token کا خانہ وہ جگہ ہے جہاں Aimpire کا token ڈالا جاتا ہے۔ #Aitech لکھیں، Verify دبائیں، پھر آنے والے Hash خانے میں 000000 لکھیں۔ درست token کے بغیر account 12× پر 10 % والی حد کے ساتھ کھلتا ہے، 24× پر 5 % والی حد کے ساتھ نہیں۔ Copy Now دبانے سے پہلے دیکھ لیں کہ tick کا نشان نظر آ رہا ہے۔"],["Sonic، Amplify پر چلتا ہے — اور token اُسے 12× سے 24× کر دیتا ہے","Sonic strategy ایک Amplify account پر چلتی ہے؛ اُس کا اپنا sign-up form یہی کہتا ہے۔ Amplify ایک funded account ہے: آپ جتنا ڈالتے ہیں، اُس کے کئی گنا سے trade کرتے ہیں، اور پیسہ اصلی ہے۔\n\nBroker کا standard 12× ہے۔ Aimpire token — #Aitech اور 000000 — اِسے 24× کر دیتا ہے۔ ہمارے اپنے test میں $109 سے $2,616 کا trading balance بنا۔ یہ گُنا نقصان پر بھی بالکل اُتنا ہی لگتا ہے جتنا نفع پر۔"],["جو فیصلہ واقعی آپ کا ہے: کتنا","Sonic سے جُڑنے کا مطلب ہے amplified trading — form کہتا ہے کہ strategy Amplify پر چلتی ہے، تو شروع کرنے کے لیے اِس کا کوئی چھوٹا روپ نہیں۔ جو انتخاب آپ کو بچاتا ہے، وہ رقم ہے۔\n\nتین سوال، اور کسی ایک کا جواب بھی ہاں ہو تو کم ڈالیں: کیا یہ ساری رقم چلی جائے تو آپ کے مہینے کا بجٹ بگڑ جائے گا؟ کیا کسی trade کو اپنے خلاف جاتے دیکھنا اور اُس کا دباؤ محسوس کرنا آپ کے لیے نیا ہوگا؟ کیا یہ آپ کا پہلا trading account ہے؟\n\nاُتنی رقم سے شروع کریں جسے پورا کھونا آپ برداشت کر سکیں، اور چند ہفتے دیکھیں۔ بعد میں بڑھائیں تو یاد رکھیں: upgrade سے آپ کے deposit کی 30 دن والی گنتی پھر سے شروع ہو جاتی ہے۔"],["Liquidation کا اصول، platform کے اپنے الفاظ میں","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nToken کے ساتھ form ایک اور سطر جوڑتا ہے: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» سائز دُگنا، نقصان کی گنجائش آدھی: 5% کا نقصان account بند کر دیتا ہے۔\n\nپیسوں میں: آپ کے $109 پر $2,616 کی trading ہوتی ہے۔ اُس balance میں 1 ÷ 24 = 4.2 % کی کمی $109 کے برابر ہے — یعنی آپ کا پورا deposit ختم، اور یہ 5 % والی حد پر account بند ہونے سے بھی پہلے ہو جاتا ہے۔\n\nیہ وارننگ نہیں، سیدھا trigger ہے۔ آپ قیمتوں کے واپس آنے کا انتظار نہیں کر سکتے۔"],["ذمہ داری کے بارے میں platform خود کیا کہتا ہے","Submit سے پہلے آپ ایک box پر ٹک کرتے ہیں جس میں لکھا ہے کہ CopyX پر trades وہ traders کرتے ہیں جن کا Tag Markets سے کوئی تعلق نہیں، اور Tag Markets اِن trades یا اُن کے نتائج کی کوئی ذمہ داری نہیں لیتا۔\n\nٹک کرنے سے پہلے پڑھ لیں۔ مطلب یہ کہ جو broker آپ کا پیسہ رکھتا ہے، وہ اس کا جواب دہ نہیں کہ strategy اُس کا کیا کرتی ہے۔"],["جب فائدہ ہو، تو آپ کے پاس کیا بچتا ہے","Presentation میں split 70 / 5 / 25 بتایا گیا ہے، اور ساتھ «per trade» لکھا ہے: profit کا 70 % آپ کا، 5 % system چلانے والے developers کا، اور 25 % اُسے جاتا ہے جسے presentation «the team» کہتا ہے — «Bonus model کیسے بنایا گیا ہے» میں دکھایا گیا ہے کہ وہ کیسے بٹتا ہے۔ Sonic strategy کے card پر یہ 30 % performance fee کی صورت میں نظر آتا ہے، نہ کوئی management fee ہے، نہ joining fee۔\n\nیعنی $100 کے profit میں سے تقریباً $70 آپ کے۔ ایک بات کہیں نہیں دکھائی گئی: fee ہر جیتنے والی trade پر کٹتی ہے یا کسی مدت کے net نتیجے پر — card پر لکھا ہے «Schedule 1 Week»۔ اگر یہ ہر جیتنے والی trade پر کٹتی ہے تو fee کا حساب لگاتے وقت نقصان والی trades نہیں گھٹائی جاتیں، اور کُل نتیجے کا 70 % سے کم آپ کے پاس رہتا ہے۔ اپنے sponsor سے پوچھیں کہ اِن میں سے کون سا طریقہ لاگو ہوتا ہے۔\n\nMyfxbook سمیت کوئی بھی published نتیجہ دیکھتے وقت یہ یاد رکھیں: وہ curves fee کٹنے سے پہلے کے ہیں، بعد کے نہیں۔"],["قواعد، broker کے اپنے help centre سے","نفع کسی بھی وقت، کسی بھی گھڑی، کسی بھی دن نکالا جا سکتا ہے؛ broker کے مطابق اُس کے بعد ادائیگی میں 1–3 کاروباری دن لگتے ہیں۔ آپ کی جمع کرائی رقم الگ بات ہے: وہ پہلی trade کے 30 دن بعد ہی نکل سکتی ہے — رقم ڈالنے کے 30 دن بعد نہیں — اور اُسے نکالتے ہی account فوراً بند ہو جاتا ہے۔ Account اپ گریڈ کیا تو وہ 30 دن دوبارہ شروع۔ کوئی روزانہ نقصان کی حد نہیں، صرف 10% والی، اور ایسے جتنے چاہیں account رکھ سکتے ہیں۔ Community token کے ساتھ یہ 10 % کی حد 5 % ہو جاتی ہے۔"],["Commission اور leverage، آپ کے اپنے پیسے کے حساب سے","Amplified account میں forex اور metals (دھاتیں) پر commission $10 فی lot ہے، جو trade بند ہونے پر لگتی ہے۔ Indices اور crypto کے بارے میں broker کے اپنے articles آپس میں مختلف باتیں کہتے ہیں۔\n\nForm پر leverage 1:30 لکھی ہے، لیکن یہ بڑھے ہوئے balance پر لگتی ہے۔ آپ کے اپنے deposit کے حساب سے دیکھیں تو 24 × 30 = 720:1 — یعنی عام account کے 1:500 سے زیادہ، کم نہیں۔ 12× پر یہ 360:1 ہے۔"]],"ar":[["الـ token الخاص بـ Aimpire: ‎#Aitech، ثم 000000","خانة الـ community token هي المكان الذي يُكتب فيه الـ token الخاص بـ Aimpire. اكتب ‎#Aitech، واضغط Verify، ثم اكتب 000000 في خانة الـ Hash التي تظهر. ومن دون token صالح يُفتح الحساب بـ 12× مع حدّ الـ 10 %، بدلاً من 24× مع حدّ الـ 5 %. وتأكّد من ظهور علامة الصحّ قبل أن تضغط Copy Now."],["Sonic يعمل على Amplify — والـ token يرفعه من 12× إلى 24×","تعمل استراتيجية Sonic على حساب Amplify؛ هذا ما يقوله نموذج التسجيل نفسه. والـ Amplify حساب مموَّل: تتداول بمضاعَف لما تودعه، والمال حقيقي.\n\nالمضاعِف المعتاد لدى الـ broker هو 12×. والـ token الخاص بـ Aimpire — ‎#Aitech و000000 — يرفعه إلى 24×. في تجربتنا نحن صار مبلغ $109 رصيد تداول قدره $2,616. والمضاعِف يعمل على الخسارة تماماً كما يعمل على الربح."],["القرار الذي هو لك فعلاً: كم تضع","الربط بـ Sonic يعني تداولاً مضخَّماً — فالنموذج يقول إن الاستراتيجية تعمل على Amplify، ولا توجد نسخة أصغر منها تبدأ بها. والاختيار الذي يحميك هو المبلغ.\n\nثلاثة أسئلة، وإن كانت الإجابة عن أيٍّ منها بنعم فضع مبلغاً أقل: هل ستُربك خسارةُ المبلغ كله ميزانيتك هذا الشهر؟ هل هذه أول مرة ستشاهد فيها صفقة تسير ضدك وتشعر بوقعها؟ هل هذا أول حساب تداول لك؟\n\nابدأ بمبلغ تستطيع خسارته كاملاً، وراقبه بضعة أسابيع. وإن أضفت مبلغاً لاحقاً، فاعلم أن الـ upgrade يعيد مهلة الثلاثين يوماً الخاصة بإيداعك إلى بدايتها."],["قاعدة التصفية، بكلمات المنصّة نفسها","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nومع الـ token يضيف النموذج سطراً ثانياً: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» ضعف الحجم، ونصف المساحة المسموح بها للخسارة: خسارة 5% تُغلق الحساب.\n\nبالأرقام: مبلغك البالغ $109 يُتداوَل كأنه $2,616. وهبوط بنسبة 1 ÷ 24 = 4.2 % في ذلك الرصيد يساوي $109 — إيداعك كله، يذهب قبل أن يُغلق حدّ الـ 5 % الحساب أصلاً.\n\nإنها قاعدة تُنفَّذ تلقائياً، لا مجرّد تحذير. ولا مجال لأن تنتظر حتى يتعافى الحساب."],["ماذا تقول المنصّة عن المسؤولية","قبل أن ترسل، تضع علامة في مربّع يقول إنّ الصفقات على CopyX ينفّذها متداولون لا صلة لهم بـ Tag Markets، وإنّ Tag Markets لا تتحمّل أي مسؤولية عن الصفقات ولا عن نتائجها. اقرأه قبل أن تعلّم عليه. ومعناه أنّ الـ broker الذي يحتفظ بمالك ليس مسؤولاً عمّا تفعله الاستراتيجية به."],["ما يبقى لك عندما يربح","يذكر العرض التقديمي أن التوزيع 70 / 5 / 25، مع عبارة «per trade»: تحتفظ بـ 70 % من الربح، و5 % للمطوّرين الذين يشغّلون النظام، و25 % تذهب إلى ما يسمّيه العرض «the team» — ويبيّن قسم «كيف رُسم نموذج المكافآت» كيف تُوزَّع. وعلى بطاقة استراتيجية Sonic يظهر ذلك في صورة رسم أداء (performance fee) قدره 30 %، من دون رسوم إدارة ولا رسوم انضمام.\n\nأي أن ربحاً قدره $100 يعني نحو $70 لك. لكن أمراً واحداً لا يظهر في أي مكان: هل يُسوّى الرسم على كل صفقة رابحة، أم على صافي النتيجة خلال فترة — فالبطاقة تقول «Schedule 1 Week». فإن كان يُفرض على كل صفقة رابحة، فلا تُخصم الصفقات الخاسرة منه، ويبقى لك أقل من 70 % من النتيجة الإجمالية. اسأل الـ sponsor الخاص بك أيّهما المعمول به.\n\nوهذا مهم حين تقرأ أي نتيجة منشورة، بما فيها Myfxbook: تلك المنحنيات محسوبة قبل خصم الرسم لا بعده."],["القواعد، من مركز مساعدة الـ broker نفسه","يمكنك سحب الأرباح في أي وقت، في أي ساعة وأي يوم؛ ويذكر الـ broker أن الدفعة تستغرق بعد ذلك من 1 إلى 3 أيام عمل. أما إيداعك الأصلي فأمر آخر: لا يُسحب إلا بعد 30 يوماً من أول صفقة لك — لا بعد 30 يوماً من الإيداع — وسحبه يُغلق الحساب فوراً. وإن أجريت upgrade للحساب، بدأت مدة الـ 30 يوماً من جديد. ولا يوجد حدّ خسارة يومي، بل حدّ الـ 10 % فقط، ويمكنك الاحتفاظ بما شئت من هذه الحسابات. ومع الـ community token يصبح حدّ الـ 10 % هذا 5 %."],["العمولة والـ leverage بالقياس إلى مالك أنت","العمولة على الحساب المضاعَف هي $10 لكل lot على الـ forex والـ metals (المعادن)، وتُحتسب عند إغلاق الصفقة. أما الـ indices (المؤشرات) والـ crypto، فمقالات الـ broker نفسه تتضارب بشأنها.\n\nيُظهر النموذج أن الـ leverage هو 1:30، لكنه يُطبَّق على الرصيد المضاعَف. وبالقياس إلى إيداعك أنت: 24 × 30 = 720:1 — أي أكثر من الـ 1:500 في الحساب العادي، لا أقل. وعند 12× يكون 360:1."]],"ar_rm":[["Al-token al-khass bi Aimpire: #Aitech, thumma 000000","Khanat al-community token hiya al-makan alladhi yuktab fih al-token al-khass bi Aimpire. Uktub #Aitech, w idghat Verify, thumma uktub 000000 fi khanat al-Hash allati tazhar. W min dun token salih yuftah al-hisab bi 12× ma3 hadd al-10 %, badalan min 24× ma3 hadd al-5 %. W ta'akkad min zuhur 3alamat al-sahh qabl an tadghat Copy Now."],["Sonic ya3mal 3ala Amplify — w al-token yarfa3uh min 12× ila 24×","Ta3mal istratijiyat Sonic 3ala hisab Amplify; hadha ma yaquluh namudhaj al-tasjil nafsuh. W al-Amplify hisab mumawwal: tatadawal bi-muda3af lima tudi3uh, w al-mal haqiqi.\n\nAl-muda3if al-mu3tad lada al-broker huwa 12×. W al-token al-khass bi Aimpire — #Aitech w 000000 — yarfa3uh ila 24×. Fi tajribatina nahnu sar mablagh $109 rasid tadawul qadruh $2,616. W al-muda3if ya3mal 3ala al-khasara tamaman kama ya3mal 3ala al-ribh."],["Al-qarar alladhi huwa lak fi3lan: kam tada3","Al-rabt bi Sonic ya3ni tadawulan mudakhkhaman — fal-namudhaj yaqul inna al-istratijiya ta3mal 3ala Amplify, w la tujad nuskha asghar minha tabda' biha. W al-ikhtiyar alladhi yahmik huwa al-mablagh.\n\nThalathat as'ila, w in kanat al-ijaba 3an ayy minha bi-na3am fada3 mablaghan aqall: hal saturbik khasarat al-mablagh kulluh mizaniyatak hadha al-shahr? Hal hadhihi awwal marra satushahid fiha safqa tasir diddak w tash3ur bi-waq3iha? Hal hadha awwal hisab tadawul lak?\n\nIbda' bi-mablagh tastati3 khasaratah kamilan, w raqibh bid3at asabi3. W in adaft mablaghan lahiqan, fa3lam anna al-upgrade yu3id muhlat al-thalathin yawman al-khassa bi-ida3ak ila bidayatiha."],["Qa3idat al-tasfiya, bi-kalimat al-minassa nafsiha","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nW ma3 al-token yudif al-namudhaj satran thaniyan: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» Di3f al-hajm, w nisf al-masaha al-masmuh biha lil-khasara: khasarat 5% tughliq al-hisab.\n\nBil-arqam: mablaghak al-baligh $109 yutadawal ka'annahu $2,616. W hubut bi-nisbat 1 ÷ 24 = 4.2 % fi dhalik al-rasid yusawi $109 — ida3ak kulluh, yadhhab qabl an yughliq hadd al-5 % al-hisab aslan.\n\nInnaha qa3ida tunaffadh tilqa'iyan, la mujarrad tahdhir. W la majal li-an tantazir hatta yata3afa al-hisab."],["Madha taqul al-minassa 3an al-mas'uliya","Qabl an tursil, tada3 3alama fi murabba3 yaqul inna al-safaqat 3ala CopyX yunaffidhuha mutadawilun la silata lahum bi Tag Markets, w inna Tag Markets la tatahammal ayy mas'uliya 3an al-safaqat w la 3an nata'ijiha. Iqra'h qabl an tu3allim 3alayh. W ma3nah anna al-broker alladhi yahtafiz bi-malak laysa mas'ulan 3amma taf3aluh al-istratijiya bih."],["Ma yabqa lak 3indama yarbah","Yadhkur al-3ard al-taqdimi anna al-tawzi3 70 / 5 / 25, ma3 3ibarat «per trade»: tahtafiz bi 70 % min al-ribh, w 5 % lil-mutawwirin alladhina yushaghghilun al-nizam, w 25 % tadhhab ila ma yusammih al-3ard «the team» — w yubayyin qism «Kayf rusim namudhaj al-mukafa'at» kayf tuwazza3. W 3ala bitaqat istratijiyat Sonic yazhar dhalik fi surat rasm ada' (performance fee) qadruh 30 %, min dun rusum idara w la rusum indimam.\n\nAy anna ribhan qadruh $100 ya3ni nahwa $70 lak. Lakin amran wahidan la yazhar fi ayy makan: hal yusawwa al-rasm 3ala kull safqa rabiha, am 3ala safi al-natija khilal fatra — fal-bitaqa taqul «Schedule 1 Week». Fa'in kan yufrad 3ala kull safqa rabiha, fala tukhsam al-safaqat al-khasira minh, w yabqa lak aqall min 70 % min al-natija al-ijmaliya. Is'al al-sponsor al-khass bik ayyuhuma al-ma3mul bih.\n\nW hadha muhimm hin taqra' ayy natija manshura, bima fiha Myfxbook: tilka al-munhanayat mahsuba qabl khasm al-rasm la ba3dah."],["Al-qawa3id, min markaz musa3adat al-broker nafsuh","Yumkinuk sahb al-arbah fi ayy waqt, fi ayy sa3a w ayy yawm; w yadhkur al-broker anna al-daf3a tastaghriq ba3d dhalik min 1 ila 3 ayyam 3amal. Amma ida3ak al-asli fa'amr akhar: la yushab illa ba3d 30 yawman min awwal safqa lak — la ba3d 30 yawman min al-ida3 — w sahbuh yughliq al-hisab fawran. W in ajrayt upgrade lil-hisab, bada'at muddat al-30 yawman min jadid. W la yujad hadd khasara yawmi, bal hadd al-10 % faqat, w yumkinuk al-ihtifaz bima shi't min hadhihi al-hisabat. W ma3 al-community token yusbih hadd al-10 % hadha 5 %."],["Al-3umula w al-leverage bil-qiyas ila malak anta","Al-3umula 3ala al-hisab al-muda3af hiya $10 li-kull lot 3ala al-forex w al-metals (al-ma3adin), w tuhtasab 3ind ighlaq al-safqa. Amma al-indices (al-mu'ashshirat) w al-crypto, famaqalat al-broker nafsuh tatadarab bi-sha'niha.\n\nYuzhir al-namudhaj anna al-leverage huwa 1:30, lakinnahu yutabbaq 3ala al-rasid al-muda3af. W bil-qiyas ila ida3ak anta: 24 × 30 = 720:1 — ay akthar min al-1:500 fil-hisab al-3adi, la aqall. W 3ind 12× yakun 360:1."]],"ur_rm":[["Aimpire ka token: #Aitech, phir 000000","Community token ka khana woh jagah hai jahan Aimpire ka token daala jaata hai. #Aitech likhein, Verify dabayein, phir aane wale Hash khane mein 000000 likhein. Durust token ke baghair account 12× par 10 % wali had ke saath khulta hai, 24× par 5 % wali had ke saath nahi. Copy Now dabane se pehle dekh lein keh tick ka nishan nazar aa raha hai."],["Sonic, Amplify par chalta hai — aur token use 12× se 24× kar deta hai","Sonic strategy ek Amplify account par chalti hai; us ka apna sign-up form yahi kehta hai. Amplify ek funded account hai: aap jitna daalte hain, us ke kai guna se trade karte hain, aur paisa asli hai.\n\nBroker ka standard 12× hai. Aimpire token — #Aitech aur 000000 — ise 24× kar deta hai. Hamare apne test mein $109 se $2,616 ka trading balance bana. Yeh guna nuqsan par bhi bilkul utna hi lagta hai jitna nafe par."],["Jo faisla waqai aap ka hai: kitna","Sonic se judne ka matlab hai amplified trading — form kehta hai keh strategy Amplify par chalti hai, to shuru karne ke liye is ka koi chhota roop nahi. Jo intekhab aap ko bachata hai, woh raqam hai.\n\nTeen sawal, aur kisi ek ka jawab bhi haan ho to kam daalein: Kya yeh saari raqam chali jaaye to aap ke mahine ka budget bigad jaayega? Kya kisi trade ko apne khilaaf jaate dekhna aur us ka dabaao mehsoos karna aap ke liye naya hoga? Kya yeh aap ka pehla trading account hai?\n\nUtni raqam se shuru karein jise poora khona aap bardasht kar sakein, aur chand hafte dekhein. Baad mein badhayein to yaad rakhein: upgrade se aap ke deposit ki 30 din wali ginti phir se shuru ho jaati hai."],["Liquidation ka usool, platform ke apne alfaaz mein","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nToken ke saath form ek aur satar jodta hai: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» Size dugna, nuqsan ki gunjaish aadhi: 5% ka nuqsan account band kar deta hai.\n\nPaison mein: aap ke $109 par $2,616 ki trading hoti hai. Us balance mein 1 ÷ 24 = 4.2 % ki kami $109 ke barabar hai — yaani aap ka poora deposit khatam, aur yeh 5 % wali had par account band hone se bhi pehle ho jaata hai.\n\nYeh warning nahi, seedha trigger hai. Aap qeematon ke wapas aane ka intezar nahi kar sakte."],["Zimmedari ke baare mein platform khud kya kehta hai","Submit se pehle aap ek box par tick karte hain jis mein likha hai keh CopyX par trades woh traders karte hain jin ka Tag Markets se koi taalluq nahi, aur Tag Markets in trades ya un ke nataij ki koi zimmedari nahi leta.\n\nTick karne se pehle parh lein. Matlab yeh keh jo broker aap ka paisa rakhta hai, woh is ka jawabdeh nahi keh strategy us ka kya karti hai."],["Jab faida ho, to aap ke paas kya bachta hai","Presentation mein split 70 / 5 / 25 bataya gaya hai, aur saath «per trade» likha hai: profit ka 70 % aap ka, 5 % system chalane wale developers ka, aur 25 % use jaata hai jise presentation «the team» kehta hai — «Bonus model kaise banaya gaya hai» mein dikhaya gaya hai keh woh kaise batta hai. Sonic strategy ke card par yeh 30 % performance fee ki soorat mein nazar aata hai, na koi management fee hai, na joining fee.\n\nYaani $100 ke profit mein se taqreeban $70 aap ke. Ek baat kahin nahi dikhayi gayi: fee har jeetne wali trade par katti hai ya kisi muddat ke net nateeje par — card par likha hai «Schedule 1 Week». Agar yeh har jeetne wali trade par katti hai to fee ka hisaab lagate waqt nuqsan wali trades nahi ghatayi jaatin, aur kul nateeje ka 70 % se kam aap ke paas rehta hai. Apne sponsor se poochein keh in mein se kaun sa tareeqa laagu hota hai.\n\nMyfxbook samet koi bhi published nateeja dekhte waqt yeh yaad rakhein: woh curves fee katne se pehle ke hain, baad ke nahi."],["Qawaid, broker ke apne help centre se","Nafa kisi bhi waqt, kisi bhi ghari, kisi bhi din nikala ja sakta hai; broker ke mutabiq us ke baad adaigi mein 1–3 karobari din lagte hain. Aap ki jama karayi raqam alag baat hai: woh pehli trade ke 30 din baad hi nikal sakti hai — raqam daalne ke 30 din baad nahi — aur use nikalte hi account fauran band ho jaata hai. Account upgrade kiya to woh 30 din dobara shuru. Koi rozana nuqsan ki had nahi, sirf 10% wali, aur aise jitne chahein account rakh sakte hain. Community token ke saath yeh 10 % ki had 5 % ho jaati hai."],["Commission aur leverage, aap ke apne paise ke hisaab se","Amplified account mein forex aur metals (dhaatein) par commission $10 fi lot hai, jo trade band hone par lagti hai. Indices aur crypto ke baare mein broker ke apne articles aapas mein mukhtalif baatein kehte hain.\n\nForm par leverage 1:30 likhi hai, lekin yeh badhe hue balance par lagti hai. Aap ke apne deposit ke hisaab se dekhein to 24 × 30 = 720:1 — yaani aam account ke 1:500 se zyada, kam nahi. 12× par yeh 360:1 hai."]]}},"ib":{"en":{"lede":"This part is optional. You can open an account, let Sonic run, and never introduce a single person. Nothing on the platform requires it. It is here because people ask how it works, and because half-explained money is how communities go wrong.","blocks":[["What an IB actually is","The broker already charges a spread and a commission on every trade, whether you introduced anyone or not. An Introducing Broker gets a share of what the broker earns. That is the usual mechanism across the industry, and it is not a separate fee on the person you introduced. On Sonic there is one more thing to know: part of what the people above you earn comes from the member's own 30 % performance fee. The fee is the same either way, but it is the member who pays it."],["The lock nobody explains","The plan has ten generations. They start locked. Your IB Portal shows two lines that decide everything: «# of Directs with active Trading account» and «Generations unlocked». Generations open only when your directs — the people you introduced yourself — have active trading accounts. Until then, the streams exist but pay nothing.","lock"],["What that looks like in real numbers","Figures from the founder's own portal on 13 October 2026: five people introduced, $43 deposited across all of them, nine income streams listed by name — and $0.00 earned. Not because anything was broken. Because 0 of 10 generations were unlocked. This is the single most useful thing to understand before you start."],["What the broker's own help centre says per lot","For amplified accounts the broker documents three levels, not ten: $3.00 to the person who introduced you directly, $1.20 on the second level, $0.60 on the third. Their reasoning is that a 12× account opens bigger lots, so a smaller rate still adds up. A different ten-level table circulates publicly for the AiTech side. The two do not match, and nobody should quote either as settled until your own agreement is checked. One more rule from the same help centre: a trade only counts for commission if it stays open for at least 3 minutes.","ladder"],["How the bonus model is drawn","The official presentation draws it in four parts. Profit sharing: of a member's trading profit, 70 % stays with the member, 5 % goes to the developers and 25 % goes to what it calls «the team». Profit sharing at the first level: 2.5 %, up to 22.5 % as a volume bonus — the slide does not say whether that is a share of the profit or of the 25 %. Per lot: $2 at the first level, up to $6.50 with volume. A general bonus: $2.00 per lot plus a bonus payment. And «additional incentives».\n\nWhat the presentation does not show is how much volume each step needs. Ask your sponsor to show it to you in the IB Portal before you count on any of it. The presentation also marks the programme «subject to local restrictions» and «only available to professional Influencer»."],["A worked example — and why the account type changes it","Suppose twenty members on Amplify accounts trade 20 lots between them in a month. At the broker's published rate for amplified accounts — $3.00 per lot at the first level — that would be $60. Which rate table applies to an Aimpire sponsor is still not settled, so read this as the arithmetic, not as a rate you will be paid. How many lots they trade depends on the strategy's position sizes, not on anything you control.\n\nLeverage only sets the ceiling. On a standard account, 1:500 lets $10 control up to 0.05 lot. On Amplify the leverage is 1:30, but it applies to the multiplied balance: $10 at 24× is $240, which can control up to about 0.07 lot, and at 12× about half that. Run the number for the account you actually have, not the one in someone's screenshot."],["The formula, so you can put your own numbers in","monthly rebate ≈ members × trades each × lots per trade × rate per lot. Every part after the ≈ sign is yours to check: the lot size depends on your leverage, and the rate depends on which programme your agreement is under. Put in your own numbers and the answer is yours, not someone else's claim."],["The nine streams, by name","So you recognise them in the portal rather than in a chat message: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 and 2, Sonic Pool, Profit Pool, NeoFX Pool and Super Sonic Bonus. «CPA» stands for cost per acquisition; the portal does not show what qualifies. Payouts are made in USDT."],["What is not promised","No income is guaranteed and it can be zero. Everything above depends on other people depositing and trading, which depends on them choosing to, which you do not control. Treat it as a share of activity that may happen, not as a plan."]],"unverified":"Two different tables exist for two different programmes, and they disagree. Ask the partner in writing which one is on your signed agreement before you repeat a number to anyone.","lock_cap":"Ten generations. Zero open until directs with active accounts unlock them.","ladder_cap":"Broker help centre: $3.00 · $1.20 · $0.60 across three levels"},"no":{"lede":"Denne delen er valgfri. Du kan åpne konto, la Sonic gå og aldri introdusere et eneste menneske. Ingenting på plattformen krever det. Den ligger her fordi folk spør hvordan det virker — og fordi det er når pengene bare er halvveis forklart, at fellesskap går i stykker.","blocks":[["Hva en IB faktisk er","Megleren tar allerede spread og kurtasje på hver handel, enten du har introdusert noen eller ikke. En Introducing Broker får en andel av det megleren tjener. Det er den vanlige mekanismen i bransjen, og det er ikke et eget gebyr på den du introduserte. På Sonic er det én ting til du bør kjenne til: en del av det de over deg tjener, kommer fra medlemmets eget resultathonorar på 30 %. Honoraret er det samme uansett, men det er medlemmet som betaler det."],["Låsen ingen forklarer","Planen har ti generasjoner. De starter låst. IB-portalen viser to linjer som avgjør alt: «# of Directs with active Trading account» og «Generations unlocked». Generasjoner åpnes bare når dine directs — de du selv har introdusert — har aktive handelskontoer. Fram til da finnes strømmene, men de betaler ingenting.","lock"],["Hvordan det ser ut i ekte tall","Tall fra grunnleggerens egen portal 13. oktober 2026: fem personer introdusert, $43 innskutt til sammen, ni inntektsstrømmer listet med navn — og $0,00 opptjent. Ikke fordi noe var ødelagt. Fordi 0 av 10 generasjoner var låst opp. Dette er det mest nyttige å forstå før du begynner."],["Hva meglerens eget hjelpesenter sier per lot","For amplifiserte kontoer dokumenterer megleren tre nivåer, ikke ti: $3,00 til den som introduserte deg direkte, $1,20 på andre nivå, $0,60 på tredje. Begrunnelsen deres er at en 12×-konto åpner større lot, så en lavere sats likevel summerer seg. En annen tabell med ti nivåer sirkulerer offentlig for AiTech-siden. De to stemmer ikke overens, og ingen bør sitere noen av dem som avgjort før din egen avtale er sjekket. Én regel til fra det samme hjelpesenteret: en handel teller bare for provisjon hvis den står åpen i minst 3 minutter.","ladder"],["Slik er bonusmodellen tegnet","Den offisielle presentasjonen tegner den i fire deler. Profittdeling: av et medlems handelsprofitt blir 70 % hos medlemmet, 5 % går til utviklerne og 25 % går til det den kaller «the team». Profittdeling på første nivå: 2,5 %, opptil 22,5 % som volumbonus — siden sier ikke om det er en andel av profitten eller av de 25 %. Per lot: $2 på første nivå, opptil $6,50 med volum. En generell bonus: $2,00 per lot pluss en bonusutbetaling. Og «additional incentives».\n\nDet presentasjonen ikke viser, er hvor mye volum hvert trinn krever. Be sponsoren din vise deg det i IB-portalen før du regner med noe av det. Presentasjonen merker også programmet «subject to local restrictions» og «only available to professional Influencer»."],["Et regnestykke — og hvorfor kontotypen endrer det","La oss si at tjue medlemmer på Amplify-kontoer til sammen handler 20 lot i løpet av en måned. Med meglerens publiserte sats for Amplify-kontoer — $3,00 per lot på første nivå — ville det blitt $60. Hvilken satstabell som gjelder for en Aimpire-sponsor, er fortsatt ikke avklart, så les dette som et regnestykke, ikke som en sats du vil få utbetalt. Hvor mange lot de handler, avhenger av strategiens posisjonsstørrelser, ikke av noe du styrer.\n\nGiringen setter bare taket. På en vanlig konto kan $10 styre opptil 0,05 lot med 1:500. På Amplify er giringen 1:30, men den gjelder den multipliserte saldoen: $10 med 24× er $240, som kan styre opptil rundt 0,07 lot, og med 12× omtrent halvparten. Regn ut for kontoen du faktisk har, ikke den som står i noens skjermbilde."],["Formelen, så du kan sette inn dine egne tall","månedlig rebate ≈ medlemmer × handler hver × lot per handel × sats per lot. Alt på høyre side kan du sjekke selv: lot-størrelsen avhenger av giringen din, og satsen av hvilket program avtalen din hører under. Setter du inn dine egne tall, er svaret ditt eget, ikke en annens påstand."],["De ni strømmene, med navn","Så du kjenner dem igjen i portalen og ikke i en chat: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 og 2, Sonic Pool, Profit Pool, NeoFX Pool og Super Sonic Bonus. «CPA» står for cost per acquisition; portalen viser ikke hva som gir rett til den. Utbetaling skjer i USDT."],["Hva som ikke er lovet","Ingen inntekt er garantert, og den kan bli null. Alt ovenfor avhenger لجواب جوابك أنت لا ادّعاء غيرك."],["المصادر التسعة بالاسم","لتعرفها في الـ portal لا في رسالة chat: Lot Commissions، وProfit Share، وCPA Earnings، وLeader Pool 1 و2، وSonic Pool، وProfit Pool، وNeoFX Pool، وSuper Sonic Bonus. و«CPA» اختصار لـ cost per acquisition، ولا يُظهر الـ portal ما الشروط المؤهِّلة له. والدفع يتم بـ USDT."],["ما لا نعدك به","لا دخل مضمون، وقد يكون صفراً. وكل ما سبق يتوقّف على إيداع الآخرين وتداولهم، وهو يتوقّف على اختيارهم، وأنت لا تتحكّم فيه. اعتبره حصّة من نشاط قد يحدث، لا خطة."]],"unverified":"ثمّة جدولان مختلفان لبرنامجين مختلفين، وهما لا يتفقان. اسأل الشريك كتابةً أيّهما في اتفاقك الموقّع قبل أن تنقل رقماً لأحد.","lock_cap":"عشرة أجيال، ولا شيء منها مفتوح إلى أن يفتحها مَن عرّفتهم مباشرةً ولديهم حسابات نشطة.","ladder_cap":"مركز مساعدة الـ broker: ‏$3.00 · $1.20 · $0.60 على ثلاثة مستويات"},"ar_rm":{"lede":"Hadha al-juz' ikhtiyari. Yumkinuk fath hisab, w tark Sonic ya3mal, dun an tu3arrif ahadan 3ala al-itlaq. W la shay' fil-minassa yafrid dhalik. W huwa huna li-anna al-nas yas'alun kayf ya3mal — w li-anna ansaf al-shuruh fi umur al-mal hiya ma yufsid al-mujtama3at.","blocks":[["Ma huwa al-IB fi3lan","Al-broker ya'khudh aslan al-spread w al-3umula 3ala kull safqa, 3arraft ahadan am la. W al-Introducing Broker ya'khudh hissa mimma yaksibuh al-broker. Hadhihi hiya al-aliya al-mu3tada fil-qita3, w hiya laysat rasman munfasilan 3ala man 3arraftah. W fi Sonic amr akhar yanbaghi an ta3rifah: juz' mimma yaksibuh man hum fawqak ya'ti min rasm al-ada' al-khass bil-3udw nafsuh, w qadruh 30 %. W al-rasm huwa nafsuh fil-halatayn, lakin al-3udw huwa man yadfa3uh."],["Al-qufl alladhi la yashrahuh ahad","Fil-khutta 3asharat ajyal, w kulluha tabda' muqfala. W ya3rid al-IB Portal satrayn yuhaddidan kull shay': «# of Directs with active Trading account» w «Generations unlocked». W la tuftah al-ajyal illa 3indama takun lada al-directs al-khassin bik — ay man 3arraftahum anta binafsak — hisabat tadawul nashita. W ila dhalik al-hin tabqa masadir al-dakhl mawjuda — lakinnaha la tadfa3 shay'an.","lock"],["Kayf yabdu dhalik bi-arqam haqiqiya","Arqam min al-portal al-khass bil-mu'assis nafsuh fi 13 uktubar 2026: khamsat ashkhas 3arrafahum, w ida3atuhum mujtami3atan $43, w tis3at masadir dakhl madhkura bil-ism — w $0.00 muktasaba. La li-anna shay'an kan mu3attalan, bal li-anna 0 min 10 ajyal kanat maftuha. W hadha anfa3 ma tafhamuh qabl an tabda'."],["Madha yaqul markaz musa3adat al-broker nafsuh 3an kull lot","Lil-hisabat al-muda3afa yuwaththiq al-broker thalathat mustawayat la 3ashara: $3.00 li-man 3arrafak mubasharatan, w $1.20 fil-mustawa al-thani, w $0.60 fil-thalith. W hujjatuhum anna hisab 12× yaftah lots akbar, fal-si3r al-aqall yatarakam raghm dhalik. W thammata jadwal akhar bi-3asharat mustawayat yatadawaluh al-nas 3an janib AiTech. W al-ithnan la yatatabaqan, w la yanbaghi li-ahad an yuqaddim ayyan minhuma 3ala annahu amr mahsum qabl muraja3at al-ittifaq al-khass bik. W thammata qa3ida ukhra min markaz al-musa3ada nafsuh: la tuhtasab al-safqa fil-3umula illa idha baqiyat maftuha 3 daqa'iq 3ala al-aqall.","ladder"],["Kayf rusim namudhaj al-mukafa'at","Yarsumuh al-3ard al-rasmi fi arba3at ajza'. Taqasum al-arbah: min ribh tadawul al-3udw tabqa 70 % lil-3udw, w 5 % lil-mutawwirin, w 25 % tadhhab ila ma yusammih «the team». Taqasum al-arbah fil-mustawa al-awwal: 2.5 %, w hatta 22.5 % ka-mukafa'at hajm — w la tuwaddih al-shariha hal hadhihi hissa min al-ribh am min al-25 %. Li-kull lot: $2 fil-mustawa al-awwal, w hatta $6.50 ma3 al-hajm. Mukafa'a 3amma: $2.00 li-kull lot ma3 daf3at mukafa'a. Thumma «additional incentives».\n\nMa la yuzhiruh al-3ard huwa hajm al-tadawul alladhi tatatallabuh kull daraja. Utlub min al-sponsor an yuriyak dhalik fil-IB Portal qabl an ta3tamid 3ala ayy shay' minh. W yasif al-3ard al-barnamaj aydan bi-annahu «subject to local restrictions» w «only available to professional Influencer»."],["Mithal 3amali — w limadha yughayyiruh naw3 al-hisab","Li-nafturid anna 3ishrin 3udwan 3ala hisabat Amplify yatadawalun fima baynahum 20 lot fi shahr. W bil-si3r alladhi yanshuruh al-broker lil-hisabat al-muda3afa — $3.00 li-kull lot fil-mustawa al-awwal — sayakun dhalik $60. Amma ayy jadwal as3ar yantabiq 3ala sponsor tabi3 li Aimpire falam yuhsam ba3d, lidha iqra' hadha ka-3amaliya hisabiya, la ka-si3r sayudfa3 lak. Amma 3adad al-lots allati yatadawalunaha fayatawaqqaf 3ala ahjam safaqat al-istratijiya, la 3ala ayy shay' tatahakkam fih anta.\n\nAl-leverage yuhaddid al-saqf faqat. 3ala hisab 3adi, yasmah 1:500 li-mablagh $10 bi-tahrik ma yasil ila 0.05 lot. Amma 3ala Amplify fal-leverage huwa 1:30, lakinnahu yutabbaq 3ala al-rasid al-muda3af: $10 3ind 24× tusbih $240, w yumkinuha tahrik ma yasil ila nahwa 0.07 lot, w 3ind 12× nahwa nisf dhalik. Ihsib 3ala al-hisab alladhi tamlikuh anta, la 3ala al-hisab al-zahir fi laqtat shashat ahadihim."],["Al-mu3adala, li-tahsub bi-arqamak anta","Al-rebate al-shahri ≈ al-a3da' × safaqat kull minhum × al-lots li-kull safqa × al-si3r li-kull lot. W kull al-3awamil fil-taraf al-akhar min al-mu3adala tastati3 al-tahaqquq minha binafsak: hajm al-lot yatba3 al-leverage ladayk, w al-si3r yatba3 al-barnamaj alladhi yandarij tahtah ittifaqak. Da3 arqamak anta, fayasir al-jawab jawabak anta la iddi3a' ghayrik."],["Al-masadir al-tis3a bil-ism","Li-ta3rifaha fil-portal la fi risalat chat: Lot Commissions, w Profit Share, w CPA Earnings, w Leader Pool 1 w 2, w Sonic Pool, w Profit Pool, w NeoFX Pool, w Super Sonic Bonus. W «CPA» ikhtisar li cost per acquisition, w la yuzhir al-portal ma al-shurut al-mu'ahhila lah. W al-daf3 yatimm bi USDT."],["Ma la na3idak bih","La dakhl madmun, w qad yakun sifran. W kull ma sabaq yatawaqqaf 3ala ida3 al-akharin w tadawulihim, w huwa yatawaqqaf 3ala ikhtiyarihim, w anta la tatahakkam fih. I3tabirh hissa min nashat qad yahduth, la khutta."]],"unverified":"Thammata jadwalan mukhtalifan li-barnamajayn mukhtalifayn, w huma la yattafiqan. Is'al al-sharik kitabatan ayyuhuma fi ittifaqak al-muwaqqa3 qabl an tanqul raqman li-ahad.","lock_cap":"3asharat ajyal, w la shay' minha maftuh ila an yaftahaha man 3arraftahum mubasharatan w ladayhim hisabat nashita.","ladder_cap":"Markaz musa3adat al-broker: $3.00 · $1.20 · $0.60 3ala thalathat mustawayat"},"ur_rm":{"lede":"Yeh hissa ikhtiyari hai. Aap account khol sakte hain, Sonic ko chalne de sakte hain, aur kisi ek shakhs ko bhi bulaye baghair yeh sab kar sakte hain. Platform par aisa koi taqaza nahi. Yeh yahan is liye hai keh log poochte hain keh kaam kaise hota hai — aur is liye keh jab paise ki baat aadhi adhoori samjhai jaaye to community isi se bigadti hai.","blocks":[["IB asal mein hai kya","Broker har trade par spread aur commission pehle se leta hai, chahe aap ne kisi ko bulaya ho ya na. Introducing Broker ko broker ki kamaai ka ek hissa milta hai. Poori industry mein yahi aam nizaam hai, aur yeh us shakhs par koi alag fee nahi jise aap ne bulaya. Sonic par ek aur baat jaanna zaroori hai: aap se upar wale log jo kamate hain, us ka ek hissa member ki apni 30 % performance fee se aata hai. Fee dono soorton mein utni hi rehti hai, lekin use member hi ada karta hai."],["Woh lock jise koi nahi samjhata","Plan mein das generations hain. Woh shuru mein band hoti hain. Aap ka IB Portal do lines dikhata hai jo sab tay karti hain: «# of Directs with active Trading account» aur «Generations unlocked». Generations tabhi khulti hain jab aap ke directs — yaani woh log jinhein aap ne khud bulaya — ke active trading accounts hon. Tab tak streams maujood to hain — magar kuch nahi deteen.","lock"],["Asal adaad mein yeh kaisa lagta hai","13 October 2026 ko founder ke apne portal ke adaad: paanch log bulaye gaye, sab ka mil kar $43 jama, nau income streams naam se darj — aur kamaai $0.00. Is liye nahi keh kuch kharab tha. Is liye keh 10 mein se 0 generations khuli thein. Shuru karne se pehle samajhne ke laaiq sab se aham baat yahi hai."],["Broker ke apne help centre mein fi lot kya likha hai","Amplified accounts ke liye broker teen levels batata hai, das nahi: jis ne aap ko baraah-e-raast joda use $3.00, doosre level par $1.20, teesre par $0.60. Un ki daleel yeh hai keh 12× account bade lots kholta hai, to kam sharah bhi jama ho jaati hai. AiTech ki taraf ke liye das levels wali ek alag jadwal awaami taur par gardish karti hai. Dono aapas mein mel nahi khaateen, aur apni apni agreement dekhe baghair kisi ko bhi tay shuda samajh kar na dohrayein. Usi help centre ka ek aur usool: koi trade commission ke liye tabhi gini jaati hai jab woh kam az kam 3 minute khuli rahe.","ladder"],["Bonus model kaise banaya gaya hai","Official presentation ise chaar hisson mein dikhata hai. Profit sharing: kisi member ke trading profit ka 70 % member ke paas rehta hai, 5 % developers ko jaata hai aur 25 % use jaata hai jise woh «the team» kehta hai. Pehle level par profit sharing: 2.5 %, volume bonus ke taur par 22.5 % tak — slide yeh nahi batata keh yeh profit ka hissa hai ya un 25 % ka. Per lot: pehle level par $2, volume ke saath $6.50 tak. Ek general bonus: $2.00 fi lot aur ek bonus payment. Aur «additional incentives».\n\nPresentation yeh nahi dikhata keh har qadam ke liye kitna volume chahiye. Is mein se kisi par bhi bharosa karne se pehle apne sponsor se kahein keh IB Portal mein aap ko dikhaye. Presentation mein programme ke liye yeh bhi likha hai «subject to local restrictions» aur «only available to professional Influencer»."],["Ek hisaab — aur account type use kyun badalta hai","Farz karein Amplify accounts wale bees members mil kar ek mahine mein 20 lots trade karte hain. Amplified accounts ke liye broker ki shaye ki hui sharah — pehle level par $3.00 fi lot — ke hisaab se yeh $60 honge. Kisi Aimpire sponsor par sharhon ka kaun sa jadwal laagu hota hai, yeh abhi tay nahi hua, is liye ise sirf ek hisaab samjhein, aisi sharah nahi jo aap ko milegi. Woh kitne lots trade karte hain, yeh strategy ke position sizes par munhasir hai, kisi aisi cheez par nahi jo aap ke ikhtiyar mein ho.\n\nLeverage sirf upri had tay karti hai. Aam account par 1:500 ke saath $10 zyada se zyada 0.05 lot chala sakta hai. Amplify par leverage 1:30 hai, lekin yeh badhe hue balance par lagti hai: 24× par $10 ka matlab $240 hai, jo taqreeban 0.07 lot tak chala sakta hai, aur 12× par us ka taqreeban aadha. Usi account par hisaab lagayein jo aap ke paas hai, kisi ke screenshot wale par nahi."],["Formula, taakeh aap apne adaad daal sakein","Mahana rebate ≈ members × har ek ki trades × lots fi trade × sharah fi lot. In chaaron cheezon ko aap khud jaanch sakte hain: lot size aap ki leverage par munhasir hai, aur sharah is par keh aap ki agreement kis programme ke tehat hai. Apne adaad daalein, aur jawab aap ka hoga, kisi aur ka daawa nahi."],["Nau streams, naam ke saath","Taakeh aap unhein portal mein pehchanein, kisi chat mein nahi: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 aur 2, Sonic Pool, Profit Pool, NeoFX Pool aur Super Sonic Bonus. «CPA» ka matlab hai cost per acquisition; portal yeh nahi dikhata keh yeh kin sharton par milta hai. Adaigi USDT mein hoti hai."],["Kis baat ka waada nahi","Kisi aamdani ki zamanat nahi aur woh sifar bhi ho sakti hai. Upar sab kuch is par munhasir hai keh doosre paise jama karayein aur trade karein, jo is par munhasir hai keh woh aisa chunein — aur woh aap ke ikhtiyar mein nahi. Ise aisi sargarmi ka hissa samjhein jo shayad ho, kisi plan ki tarah nahi."]],"unverified":"Do mukhtalif programmes ke liye do mukhtalif jadwalein maujood hain, aur woh aapas mein nahi miltein. Kisi ko koi adad dohrane se pehle partner se tehreeri taur par poochein keh aap ki signed agreement par kaun si hai.","lock_cap":"Das generations. Jab tak active account wale directs inhein na kholein, ek bhi nahi khulti.","ladder_cap":"Broker help centre: $3.00 · $1.20 · $0.60, teen levels"}},"menu":{"en":{"lede":"Pick the part you need now — the rest stays here.","back":"All sections","items":[["start","Get set up","Ten steps from a link to an account that works."],["tools","Tools","Results, the
