mmebokas egen sjekk, ikke noe Aimpire eller megleren ber om. Går nedtellingen ut før du rekker å sende, hent en ny adresse i stedet for å bruke den gamle om igjen.\n\nEtter at du har sendt, viser lommeboka en statusliste: innsendt, til gjennomgang (pending review), under behandling, forventet framme innen 24 timer. At det står «pending», er ikke noe problem — det er den normale statusen i mesteparten av den tiden.",{"note":"Bruk nøyaktig det nettverket portalen oppgir på betalingssiden — det samme på begge sider. Feil nettverk fører ikke til at pengene blir forsinket — de går tapt. Megleren tar imot innskudd på Ethereum (ERC20), Polygon, Tron (TRC20), BNB (BEP20), Bitcoin, Polkadot og Solana; penger sendt på et nettverk som lommeboka di tilbyr, men som ikke står på den lista — for eksempel Arbitrum — kommer ikke fram. Nettverkene koster også ulikt: å sende 25 USDC via Ethereum kostet 1,00 USDC i gebyr, altså fire prosent, så sjekk gebyret før du sender.","check":"Beløpet vises på wallet-siden i portalen. Kommer det ikke fram, sjekk transaksjonen i DIN EGEN lommebok først — portalen kan ikke vise noe som aldri nådde fram til den.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71}}],["Koble til kopihandel med Sonic","Dette er steget som faktisk starter kopieringen. Før du gjør det, kan pengene stå på kontoen uten at noe handles. Gå til Tag Markets, åpne CopyX fra menyen, finn SONIC og trykk Details. Kortet viser vilkårene du sier ja til: 30 % resultathonorar, en minimumsperiode på én måned, ingen forvaltningsavgift og ingen innmeldingsavgift.\n\nTrykk Connect. Skriv inn beløpet du vil starte med (minst $10) og velg kontotypen Amplify. Under Community Token skriver du #Aitech og trykker Verify; et Hash-felt dukker opp — skriv 000000 og trykk Submit. Kryss av de to boksene — følgeravtalen, og at traderne ikke er Tag Markets — og trykk Copy Now (på noen skjermer heter den Join to Copytrade).",{"note":"Kontotype: Sonic kjører på en Amplify-konto, og tokenet tar den til 24× — i vår egen test ble $109 til en handelssaldo på $2 616. Med tokenet stenges kontoen ved 5 % tap i stedet for 10 %. Sett bare inn et beløp du kan tape helt.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"Det dukker opp en boks med «CopyX Account Created» — trykk Continue. SONIC vises da på dashbordet ditt, og lenger ned finner du MT5 Credentials, som steg 9 bruker. Står beløpet som $0, gikk ikke Submit gjennom.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["Se kontoen din i MetaTrader 5","Det er her du følger kontoen fra dag til dag. Installer MetaTrader 5, åpne så portalen og finn MT5 Credentials — der får du et kontonummer, et Master Password og et Investor Password. I appen velger du å legge til en eksisterende konto, søker opp T.M. Financials Ltd og velger serveren TMFinancials-Server. Innloggingen er kontonummeret. Etterpå ser du Balance, Equity og Free Margin.",{"note":"Master Password kan handle på kontoen din. Investor Password kan bare se. Send aldri Master Password til noen — ikke til en leder, ikke til support, ikke til noen som ber om det. Vil du at noen skal se på resultatene dine, gi dem Investor Password i stedet.","apps":{"lede":"Installer MetaTrader 5 på telefonen din:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance viser samme tall som portalen — og med tokenet er tallet 24 ganger det du satte inn. Våre $109 ble vist som $2 616. Equity og Free Margin endrer seg når Sonic har en handel åpen; det er normalt. Er Balance ikke 24 ganger så høy, stopp og spør sponsoren din før du gjør noe annet.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["Bli med i gruppa","Det er i gruppa spørsmål blir besvart — ingen der kunne noe da de begynte heller. Setter du inn mer penger senere, gjør det litt om gangen.",{"apps":{"lede":"Installer Element X — akkurat den appen, ikke Element Classic og ikke en annen chat-app. Lag en konto, brukernavnet kan være hva som helst. Kom så tilbake hit og trykk på knappen Bli med i Aimpire-gruppa.","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Bli med i Aimpire-gruppa"},"check":"Du kan lese meldinger i gruppa, ikke bare se navnet på den."}]]},"hi":{"lede":"पहले चार steps में क़रीब पंद्रह मिनट लगते हैं, और आपके पास अपना पहचान पत्र या पासपोर्ट होना चाहिए। फिर approval का इंतज़ार, जो आपके हाथ में नहीं। पैसे डालना और बाक़ी सब उसके बाद, जब आपको ठीक लगे। आप किसी भी step के बाद रुककर लौट सकते हैं — page याद रखता है आप कहाँ थे।","steps":[["अपने sponsor का link इस्तेमाल करें","वही link खोलें जो आपको आमंत्रित करने वाले व्यक्ति ने भेजा है — उन्हीं का, किसी group वाला नहीं। इस पेज के सबसे ऊपर “आप इनसे जुड़ेंगे …” वाली एक पंक्ति है, जिसके अंत में छह अक्षर-अंक होते हैं। यही code उनकी पहचान है। अगर यह पंक्ति दिखे ही नहीं, तो आपने सादा link खोला है: broker को पता नहीं चलेगा कि आपको किसने जोड़ा, और मदद के लिए कोई आपसे जुड़ा नहीं होगा। उनसे उनका link माँगें।",{"check":"ऊपर वाली पंक्ति में कोई नाम दिखता है, या domain और छह अक्षर-अंक। पंक्ति बिलकुल न हो, तो कोई sponsor जुड़ा नहीं है — वापस जाकर उनका link खोलें।"}],["अपना account बनाएँ","वापस ऊपर scroll करें और सबसे ऊपर वाला बड़ा button “अपना account खोलें” दबाएँ। यह CopyX को नए tab में खोलता है — आपको काला COPY-X logo दिखेगा। अपना असली नाम और असली जानकारी दें: इनका उस पहचान पत्र से मेल खाना ज़रूरी है जो आप बाद में अपलोड करेंगे। ऐसा password चुनें जो आप कहीं और इस्तेमाल न करते हों। ज़रूरी: country वाले box में सबके लिए पहले से Albania चुना होता है — इसे उस देश पर बदलें जहाँ आप सच में रहते हैं, क्योंकि phone का code उसी के हिसाब से आता है। फिर दोनों boxes पर टिक करें, नीचे वाला छोटा ग्रे “Verifying…” box पूरा होने दें, और Sign Up दबाएँ। जाँच पूरी होने से पहले दबाने पर कुछ नहीं होता।",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"आपका असली नाम। यह उस ID से मेल खाना चाहिए जो आप आगे अपलोड करेंगे, वरना verification पूरा नहीं होगा।"},{"n":2,"x":24,"y":45,"t":"ऐसा password जो आप कहीं और इस्तेमाल न करते हों। अपने email का password नहीं।"},{"n":3,"x":9,"y":66,"t":"दोनों पर टिक करें। पहले पढ़ें — उनमें लिखा है कि आप पैसे खो सकते हैं।"},{"n":4,"x":50,"y":87,"t":"यह पीला box दिखे तो आपके link में invite code नहीं था। वापस जाकर अपने sponsor का link खोलें।"},{"n":5,"x":24,"y":56,"t":"इसमें सबके लिए पहले से Albania चुना होता है। इसे बदलें — phone का code इसी के हिसाब से आता है।"}],"check":"आप portal के अंदर पहुँचते हैं और अपना नाम देखते हैं, दोबारा sign-up form नहीं।"}],["अपना broker account जोड़ें — यह step महत्वपूर्ण है","Portal में पहुँचने के बाद Login to CopyX बटन ढूँढें और उसी से अपना Tag Markets account बनाएँ। Tag Markets account किसी और तरीक़े से न बनाएँ, जैसे सीधे CopyX पर या broker की अपनी website पर। इस तरह बना account sync नहीं होता, और बाद में कुछ भी ठीक से track नहीं होगा।",{"video":{"url":"https://drive.google.com/file/d/1yvnfW9R7T930XvONOniniyG01_NZ8oV3/view","label":"यह step देखें"},"note":"Portal साफ़ कहता है: अपना Tag Markets account केवल उसी बटन से बनाएँ।","img":"assets/shot-copyx-register.jpg","alt":"IB Portal में CopyX Registration पैनल","marks":[{"n":1,"x":34,"y":37,"t":"यह पंक्ति पढ़ें। यह बताती है कि broker account यहीं से बनाना है, कहीं और से नहीं।"},{"n":2,"x":13,"y":71,"t":"यही बटन है। इस पर Login to CopyX लिखा है — पहली बार भी यही इस्तेमाल करें।"},{"n":3,"x":50,"y":90,"t":"पीली चेतावनी: सीधे CopyX पर बनाया गया Tag Markets account जुड़ेगा नहीं।"}],"check":"Tag Markets account portal के अंदर दिखता है। अगर उसे ढूँढने के लिए कहीं अलग से login करना पड़ा, तो वह जुड़ा नहीं है।"}],["अपनी पहचान सत्यापित करें","आपको पहचान पत्र या पासपोर्ट चाहिए, और broker एक face scan भी माँगता है। Document की तस्वीर अच्छी रोशनी में लें, चारों कोने दिखें। लोग ज़्यादातर धुँधली तस्वीर की वजह से reject होते हैं — इससे ज़्यादा गंभीर वजह कम ही होती है।",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents पैनल","marks":[{"n":1,"x":50,"y":44,"t":"पहले यहाँ दस्तावेज़ का प्रकार चुनें। उससे पहले कुछ अपलोड नहीं होगा।"},{"n":2,"x":50,"y":75,"t":"अपलोड से पहले यह पीली पंक्ति सामान्य है। यह त्रुटि नहीं है।"},{"n":3,"x":90,"y":5,"t":"Validate का मतलब है कि broker ने अभी आपके दस्तावेज़ नहीं जाँचे हैं।"}],"check":"पीली «upload» पंक्ति हट गई है और हर document submitted दिखता है। «Validate» अब भी दिखे, तो इसका मतलब है broker ने अभी देखा नहीं — यह सामान्य है।"}],["मंज़ूरी का इंतज़ार करें","सत्यापन में आमतौर पर थोड़ा समय लगता है। जब तक यह पूरा न हो, broker आपको पैसे डालने नहीं देगा — wallet पेज पर आपको यह सूचना दिखेगी। यह सामान्य है, कोई त्रुटि नहीं।",{"img":"assets/shot-wallet-kyc.jpg","alt":"wallet पेज जो दिखाता है कि पहले KYC पूरा करना है","marks":[{"n":1,"x":50,"y":30,"t":"यह गुलाबी पंक्ति बताती है कि सत्यापन अभी बाक़ी है। दस्तावेज़ मंज़ूर होते ही यह हट जाती है।"}],"check":"Wallet page की गुलाबी पंक्ति हट गई है और Deposit button दबाया जा सकता है।"}],["इंतज़ार के दौरान: दोनों apps install करें","Approval में थोड़ा समय लग सकता है, तो उसका इस्तेमाल करें। आगे आपको दो apps चाहिए: अपना account देखने के लिए MetaTrader 5 (step 9) और Aimpire group के लिए Element X (step 10)। दोनों अभी install कर लें, सिर्फ़ official stores से — नीचे के buttons सीधे वहीं ले जाते हैं।\n\nTag Markets, CopyX और IB Portal के लिए कोई app नहीं चाहिए; वे browser में चलते हैं। कोई आपको app की file या «Tag Markets app» भेजे तो install न करें।",{"appcards":true,"check":"दोनों apps आपके phone पर खुलते हैं। अभी किसी में login की ज़रूरत नहीं — वह steps 9 और 10 में आएगा।"}],["पैसे डालें","Portal में Deposit दबाएँ, रक़म चुनें — कम से कम $10 — और वही crypto चुनें जो सच में आपके पास है। Portal फिर एक address, एक QR code, एक network और क़रीब पंद्रह मिनट का countdown दिखाता है। अपना wallet खोलें, चाहे वह Binance हो, RedotPay हो या कोई और, और वहीं से भेजें। भेजने से पहले आपका wallet यह पक्का करने को कह सकता है कि भेजने वाले आप ही हैं — passkey, Face ID या आपके email पर आए code से। यह आपके wallet की अपनी जाँच है, Aimpire या broker की नहीं। अगर भेजने से पहले countdown ख़त्म हो जाए, तो पुराना address दोबारा इस्तेमाल न करें — वापस जाकर नया address लें।\n\nभेजने के बाद wallet एक status सूची दिखाता है: submission successful, pending review, wallet processing, 24 घंटे के भीतर पहुँचने की उम्मीद। «pending» दिखना कोई समस्या नहीं। उस समय के ज़्यादातर हिस्से में यही सामान्य स्थिति रहती है।",{"note":"ठीक वही network इस्तेमाल करें जिसका नाम portal अपने payment page पर देता है — भेजने और लेने, दोनों तरफ़ एक ही network। ग़लत network चुनने से पैसा देर से नहीं पहुँचता, बल्कि डूब जाता है। Broker इन networks पर deposit लेता है: Ethereum (ERC20), Polygon, Tron (TRC20), BNB (BEP20), Bitcoin, Polkadot और Solana। आपका wallet ऐसे network भी दिखा सकता है जो इस सूची में नहीं हैं — जैसे Arbitrum — उनसे भेजा गया पैसा नहीं पहुँचेगा। हर network की fee भी अलग होती है: Ethereum से 25 USDC भेजने पर 1.00 USDC fee लगी, यानी चार प्रतिशत — इसलिए भेजने से पहले fee देख लें।","check":"रक़म portal के wallet पेज पर दिखती है। न पहुँचे तो पहले अपने ही wallet में transaction देखें — portal वह नहीं दिखा सकता जो उस तक पहुँचा ही नहीं।","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71}}],["Sonic copy trading से जुड़ें","यही वह step है जो असल में copying शुरू करता है। इसके बिना पैसा account में पड़ा रह सकता है और कोई trade नहीं होगी। Tag Markets पर जाएँ, menu से CopyX खोलें, SONIC ढूँढें और Details दबाएँ। Card पर वे शर्तें हैं जिन पर आप हाँ कह रहे हैं: 30 % performance fee, कम से कम एक महीना, कोई management fee नहीं और कोई joining fee नहीं।\n\nConnect दबाएँ। शुरुआती रक़म लिखें (कम से कम $10) और account type Amplify चुनें। Community Token में #Aitech लिखें और Verify दबाएँ; एक Hash field आएगा — उसमें 000000 लिखें और Submit दबाएँ। दोनों boxes पर tick करें — follower agreement, और यह कि traders Tag Markets के नहीं हैं — फिर Copy Now दबाएँ (कुछ screens पर इसका नाम Join to Copytrade है)।",{"note":"Account type: Sonic एक Amplify account पर चलता है, और token उसे 24× कर देता है — हमारे अपने test में $109 से $2,616 का trading balance बना। Token के साथ account 10% की जगह 5% नुक़सान पर बंद हो जाता है। सिर्फ़ उतनी रक़म डालें जिसे पूरा खोना आप सह सकें।","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"एक box में «CopyX Account Created» लिखा आएगा — Continue दबाएँ। फिर आपके dashboard पर SONIC दिखेगा, और नीचे MT5 Credentials मिलेंगे, जो step 9 में काम आएँगे। अगर रक़म $0 दिखे, तो Submit नहीं हुआ।","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["अपना account MetaTrader 5 में देखें","रोज़मर्रा में account यहीं से देखा जाता है। MetaTrader 5 install करें, फिर portal खोलकर MT5 Credentials ढूँढें — वहाँ account number, एक Master Password और एक Investor Password मिलते हैं। App में existing account जोड़ना चुनें, T.M. Financials Ltd खोजें और server TMFinancials-Server चुनें। Login वही account number है। उसके बाद आपको Balance, Equity और Free Margin दिखेंगे।",{"note":"Master Password से आपके account पर trade की जा सकती है। Investor Password से सिर्फ़ देखा जा सकता है। अपना Master Password किसी को न भेजें — न किसी leader को, न support को, न किसी को जो माँगे। कोई आपके नतीजे देखना चाहे तो उसे Investor Password दें।","apps":{"lede":"अपने phone के लिए MetaTrader 5 install करें:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance में वही आँकड़ा दिखता है जो portal में है — और token के साथ यह आँकड़ा आपकी डाली रक़म का 24 गुना होता है। हमारे $109 वहाँ $2,616 दिखे। Sonic की कोई trade खुलते ही Equity और Free Margin बदलते हैं; यह सामान्य है। अगर आपका Balance 24 गुना नहीं है, तो रुकें और कुछ भी करने से पहले अपने sponsor से पूछें।","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["ग्रुप में शामिल हों","सवालों के जवाब group में मिलते हैं — वहाँ भी हर कोई शुरुआत में कुछ नहीं जानता था। बाद में अगर आप और पैसे डालें, तो थोड़ा-थोड़ा करके डालें।",{"apps":{"lede":"Element X install करें — बिलकुल यही app, Element Classic नहीं और कोई दूसरा chat app नहीं। एक account बनाएँ, username कुछ भी चल जाएगा। फिर यहाँ वापस आकर “Aimpire ग्रुप में शामिल हों” दबाएँ।","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Aimpire ग्रुप में शामिल हों"},"check":"आप group में messages पढ़ सकते हैं, सिर्फ़ उसका नाम नहीं देखते।"}]]},"ar":{"lede":"تستغرق الخطوات الأربع الأولى نحو خمس عشرة دقيقة، وتحتاج خلالها إلى أن تكون بطاقة هويتك أو جواز سفرك في متناول يدك. ثم تنتظر الموافقة، وهذا أمر خارج عن إرادتك. أما الإيداع وبقية الخطوات فتأتي بعد ذلك، متى ناسبك. ويمكنك التوقف بعد أي خطوة والعودة لاحقاً — فالصفحة تتذكّر أين توقفت.","steps":[["استخدم رابط الـ sponsor الخاص بك","افتح الرابط الذي أرسله لك الشخص الذي دعاك — رابطه هو، لا رابطاً منشوراً في مجموعة. في أعلى هذه الصفحة سطرٌ يقول «ستكون مرتبطاً بـ …» وينتهي برمز من ستة أحرف وأرقام، وهذا الرمز يدلّ عليه. وإن لم تَرَ ذلك السطر إطلاقاً، فقد فتحت رابطاً عادياً: لن يعرف الـ broker مَن عرّفك، ولن يكون هناك شخص مرتبط بك ليساعدك. اطلب منه أن يرسل لك رابطه.",{"check":"يظهر في السطر العلوي اسمٌ، أو نطاقٌ وستة أحرف وأرقام. وإن لم يظهر السطر إطلاقاً، فهذا يعني أنه لا يوجد sponsor مرتبط بك — ارجع وافتح رابطه."}],["أنشئ حسابك","مرّر إلى أعلى الصفحة واضغط الزر الكبير في الأعلى المكتوب عليه «افتح حسابك». يفتح CopyX في تبويب جديد — وسترى شعار COPY-X الأسود. استخدم اسمك وبياناتك الحقيقية: يجب أن تطابق الهوية التي ترفعها لاحقاً. اختر password لا تستخدمه في أي مكان آخر. مهم: خانة الدولة تأتي محدَّدة على ألبانيا عند الجميع — غيّرها إلى بلد إقامتك الفعلي، لأن مفتاح الهاتف يتغيّر معها. ثم ضع علامة في المربعين، وانتظر حتى ينتهي مربع «Verifying…» الرمادي الصغير في الأسفل، واضغط Sign Up. والضغط عليه قبل انتهاء التحقق لا يفعل شيئاً.",{"img":"assets/shot-register.jpg","alt":"استمارة التسجيل في CopyX","marks":[{"n":1,"x":24,"y":32,"t":"اسمك الحقيقي. يجب أن يطابق الهوية التي ترفعها لاحقاً، وإلا فسيفشل التحقق."},{"n":2,"x":24,"y":45,"t":"اختر password لا تستخدمه في أي مكان آخر — ولا تستخدم نفس password بريدك الإلكتروني."},{"n":3,"x":9,"y":66,"t":"علّم المربعين. اقرأهما أولاً — فهما ينصّان على أنك قد تخسر مالك."},{"n":4,"x":50,"y":87,"t":"إذا رأيت هذا المربع الأصفر، فرابطك كان ينقصه رمز الدعوة. ارجع وافتح رابط الـ sponsor بدلاً منه."},{"n":5,"x":24,"y":56,"t":"هذه الخانة تأتي محدَّدة على ألبانيا عند الجميع. غيّرها — فمفتاح الهاتف يتغيّر معها."}],"check":"تصل إلى داخل الـ portal وترى اسمك أنت، لا استمارة التسجيل من جديد."}],["اربط حساب الـ broker — هذه الخطوة مهمة","بعد أن تدخل إلى الـ portal، ابحث عن زر Login to CopyX واستخدمه لإنشاء حساب Tag Markets الخاص بك. ولا تُنشئ حساب Tag Markets بأي طريقة أخرى، كأن تُنشئه مباشرةً على CopyX أو على موقع الـ broker نفسه: فالحساب الذي يُنشأ بهذه الطريقة لا تتمّ مزامنته، ولن يعمل التتبّع بشكل صحيح بعد ذلك.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"شاهد هذه الخطوة"},"note":"النص في الـ portal صريح: سجّل حساب Tag Markets الخاص بك عبر ذلك الزر حصراً.","img":"assets/shot-copyx-register.jpg","alt":"لوحة تسجيل CopyX داخل الـ IB Portal","marks":[{"n":1,"x":34,"y":37,"t":"اقرأ هذا السطر. فهو يطلب منك أن تُنشئ حساب الـ broker من هنا، لا من أي مكان آخر."},{"n":2,"x":13,"y":71,"t":"هذا هو الزر. مكتوب عليه Login to CopyX — استخدمه حتى في المرة الأولى."},{"n":3,"x":50,"y":90,"t":"التحذير بالأصفر: حساب Tag Markets الذي يُنشأ مباشرةً على CopyX لن يكون مرتبطاً بحسابك هنا."}],"check":"يظهر حساب Tag Markets داخل الـ portal. وإن اضطُررت إلى تسجيل دخول منفصل لتجده، فهو غير مرتبط."}],["أكّد هويتك","ستحتاج إلى بطاقة هويتك أو جواز سفرك، ويطلب الـ broker أيضاً مسحاً للوجه. صوّر المستند في ضوء جيد بحيث تظهر زواياه الأربع كاملة. والصورة غير الواضحة هي السبب الأكثر شيوعاً للرفض، ونادراً ما يكون السبب شيئاً أخطر من ذلك.",{"img":"assets/shot-kyc.jpg","alt":"لوحة رفع المستندات","marks":[{"n":1,"x":50,"y":44,"t":"اختر نوع المستند من هنا أولاً. لا يُرفع شيء قبل ذلك."},{"n":2,"x":50,"y":75,"t":"هذا السطر الأصفر طبيعي قبل الرفع. وهو ليس خطأً."},{"n":3,"x":90,"y":5,"t":"كلمة Validate تعني أن الـ broker لم يفحص مستنداتك بعد."}],"check":"اختفى السطر الأصفر «upload» وصار كل مستند مُرسَلاً. وبقاء «Validate» يعني أنّ الـ broker لم ينظر بعد، وهذا طبيعي."}],["انتظر الموافقة","التحقق يستغرق عادةً وقتاً قصيراً. وإلى أن يكتمل، لن يسمح لك الـ broker بإيداع المال — وسترى هذا التنبيه في صفحة الـ wallet. وهذا طبيعي، وليس خطأً.",{"img":"assets/shot-wallet-kyc.jpg","alt":"صفحة الـ wallet تُظهر وجوب إكمال KYC أولاً","marks":[{"n":1,"x":50,"y":30,"t":"هذا السطر الزهري يعني أن التحقق ما زال قيد الانتظار. ويختفي بعد الموافقة على مستنداتك."}],"check":"اختفى السطر الزهري في صفحة الـ wallet وصار زر Deposit قابلاً للضغط."}],["أثناء الانتظار: ثبّت التطبيقين","قد تستغرق الموافقة بعض الوقت، فاستفد منه. ستحتاج لاحقاً إلى تطبيقين: MetaTrader 5 لترى حسابك (الخطوة 9)، وElement X لمجموعة Aimpire (الخطوة 10). ثبّت الاثنين الآن، من المتاجر الرسمية فقط — الأزرار أدناه تأخذك إليها مباشرة.\n\nلا يحتاج Tag Markets وCopyX والـ IB Portal إلى تطبيق؛ فهي تعمل في المتصفح. وإن أرسل لك أحدهم ملف تطبيق أو «Tag Markets app» فلا تثبّته.",{"appcards":true,"check":"يُفتح كلا التطبيقين على هاتفك. لا حاجة إلى تسجيل الدخول في أيٍّ منهما بعد — هذا يأتي في الخطوتين 9 و10."}],["أودع المال","في الـ portal اضغط Deposit، واختر المبلغ — الحد الأدنى $10 — ثم اختر العملة الرقمية التي تملكها فعلاً. بعدها يعرض لك الـ portal عنواناً ورمز QR وشبكة وعدّاً تنازلياً مدته نحو خمس عشرة دقيقة. افتح محفظتك أنت، سواء كانت Binance أو RedotPay أو غيرهما، وأرسل من هناك. قبل الإرسال قد تطلب محفظتك تأكيد هويتك — بمفتاح المرور أو Face ID أو رمز يصل إلى بريدك. هذا تحقّق خاص بمحفظتك، وليس أمراً يطلبه Aimpire أو الـ broker. وإن انتهى العدّ قبل أن ترسل، فاطلب عنواناً جديداً بدل إعادة استخدام القديم.\n\nبعد الإرسال تعرض المحفظة قائمة حالة: تمّ الإرسال، قيد المراجعة، قيد المعالجة، ويُتوقَّع الوصول خلال 24 ساعة. وظهور «pending» ليس مشكلة، بل هذه هي الحالة الطبيعية في معظم تلك المدة.",{"note":"استخدم بالضبط الشبكة التي يذكرها الـ portal في صفحة الدفع — الشبكة نفسها في الطرفين. الشبكة الخاطئة لا تؤخّر المال بل تُضيّعه. يقبل الـ broker الإيداع على Ethereum (ERC20) وPolygon وTron (TRC20) وBNB (BEP20) وBitcoin وPolkadot وSolana؛ وأي شبكة تعرضها محفظتك وليست في هذه القائمة — Arbitrum مثلاً — لن يصل المال عبرها. وتختلف الشبكات في الكلفة أيضاً: إرسال 25 USDC عبر Ethereum كلّف 1.00 USDC رسوماً، أي أربعة في المئة، فتحقّق من الرسوم قبل الإرسال.","check":"يظهر المبلغ في صفحة الـ wallet داخل الـ portal. وإن لم يصل، فتحقّق من العملية في محفظتك أنت أولاً — فالـ portal لا يعرض ما لم يصله أصلاً.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71}}],["اربط حسابك بـ Sonic copy trading","هذه هي الخطوة التي تبدأ النسخ فعلاً. قبلها قد يبقى المال في الحساب دون أي تداول. اذهب إلى Tag Markets، وافتح CopyX من القائمة، وابحث عن SONIC واضغط Details. تعرض البطاقة الشروط التي توافق عليها: رسم أداء 30 %، ومدة لا تقلّ عن شهر واحد، ولا رسوم إدارة ولا رسوم انضمام.\n\nاضغط Connect. اكتب المبلغ الذي تريد أن تبدأ به ($10 على الأقل) واختر نوع الحساب Amplify. في Community Token اكتب ‎#Aitech واضغط Verify؛ سيظهر حقل Hash — اكتب فيه 000000 واضغط Submit. علّم المربّعين — اتفاقية المتابِع، والإقرار بأنّ الـ traders لا يتبعون Tag Markets — ثم اضغط Copy Now (يسمّى في بعض الشاشات Join to Copytrade).",{"note":"نوع الحساب: يعمل Sonic على حساب Amplify، والـ token يرفعه إلى 24× — في تجربتنا صار مبلغ $109 رصيد تداول قدره $2,616. ومع الـ token يُغلق الحساب عند خسارة 5% بدل 10%. لا تضع إلا مبلغاً تستطيع خسارته كاملاً.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"يظهر مربّع يقول «CopyX Account Created» — اضغط Continue. بعدها يظهر SONIC في لوحتك، وتجد أسفلها MT5 Credentials التي تستخدمها الخطوة 9. وإن ظهر المبلغ $0، فهذا يعني أنّ الضغط على Submit لم يكتمل.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["راقب حسابك في MetaTrader 5","من هنا تتابع الحساب يوماً بيوم. ثبّت MetaTrader 5، ثم افتح الـ portal وابحث عن MT5 Credentials — تجد فيه رقم حساب، وMaster Password، وInvestor Password. في التطبيق اختر إضافة حساب موجود، وابحث عن T.M. Financials Ltd، واختر الخادم TMFinancials-Server. واسم الدخول هو رقم الحساب. بعدها سترى Balance وEquity وFree Margin.",{"note":"الـ Master Password يتيح تنفيذ صفقات على حسابك، أما الـ Investor Password فيتيح المشاهدة فقط. لا ترسل الـ Master Password إلى أحد — لا إلى قائد، ولا إلى الدعم، ولا إلى أي شخص يطلبه منك. وإن أردت أن يطّلع أحد على نتائجك، فأعطه الـ Investor Password بدلاً منه.","apps":{"lede":"ثبّت MetaTrader 5 على هاتفك:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"يُظهر Balance الرقم نفسه الذي في الـ portal — ومع الـ token يكون هذا الرقم 24 ضعف ما أودعته. مبلغنا البالغ $109 ظهر بقيمة $2,616. وتتغيّر Equity وFree Margin بمجرّد أن تكون لدى Sonic صفقة مفتوحة؛ وهذا طبيعي. وإن لم يكن الـ Balance لديك 24 ضعفاً، فتوقّف واسأل الـ sponsor الخاص بك قبل أي خطوة أخرى.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["انضم إلى المجموعة","في المجموعة تجد الإجابات عن أسئلتك — فلا أحد هناك بدأ وهو يعرف شيئاً، مثلك تماماً. وإن أضفت مزيداً من المال لاحقاً، فأضِفه على دفعات صغيرة.",{"apps":{"lede":"ثبّت Element X — هذا التطبيق بالذات، لا Element Classic ولا أي تطبيق محادثة آخر. أنشئ حساباً بأي اسم مستخدم. ثم عُد إلى هنا واضغط «انضم إلى مجموعة Aimpire».","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"انضم إلى مجموعة Aimpire"},"check":"تستطيع قراءة الرسائل في المجموعة، لا رؤية اسمها فقط."}]]},"ar_rm":{"lede":"Tastaghriq al-khutuwat al-arba3 al-ula nahwa khams 3ashrata daqiqa, w tahtaj khilalaha ila an takun bitaqat hawiyatak aw jawaz safarak fi mutanawal yadak. Thumma tantazir al-muwafaqa, w hadha amr kharij 3an iradatak. Amma al-ida3 w baqiyat al-khutuwat fata'ti ba3d dhalik, mata nasabak. W yumkinuk al-tawaqquf ba3d ayy khutwa w al-3awda lahiqan — fal-safha tatadhakkar ayn tawaqqaft.","steps":[["Istakhdim rabit al-sponsor al-khass bik","Iftah al-rabit alladhi arsalah lak al-shakhs alladhi da3ak — rabituh huwa, la rabitan manshuran fi majmu3a. Fi a3la hadhihi al-safha satrun yaqul «Satakun murtabitan bi- …» w yantahi bi-ramz min sitta ahruf w arqam, w hadha al-ramz yadull 3alayh. W in lam tara dhalik al-satr itlaqan, faqad fataht rabitan 3adiyan: lan ya3rif al-broker man 3arrafak, w lan yakun hunak shakhs murtabit bik li-yusa3idak. Utlub minh an yursil lak rabitah.",{"check":"Yazhar fil-satr al-3ulwi ismun, aw nitaqun w sitta ahruf w arqam. W in lam yazhar al-satr itlaqan, fahadha ya3ni annahu la yujad sponsor murtabit bik — irja3 w iftah rabitah."}],["Anshi' hisabak","Marrir ila a3la al-safha w idghat al-zirr al-kabir fil-a3la al-maktub 3alayh «Iftah hisabak». Yaftah CopyX fi tabwib jadid — w satara shi3ar COPY-X al-aswad. Istakhdim ismak w bayanatak al-haqiqiya: yajib an tutabiq al-hawiya allati tarfa3uha lahiqan. Ikhtar password la tastakhdimuh fi ayy makan akhar. Muhimm: khanat al-dawla ta'ti muhaddada 3ala Albania 3ind al-jami3 — ghayyirha ila balad iqamatak al-fi3li, li-ann miftah al-hatif yataghayyar ma3aha. Thumma da3 3alama fil-murabba3ayn, w intazir hatta yantahi murabba3 «Verifying…» al-ramadi al-saghir fil-asfal, w idghat Sign Up. W al-daght 3alayh qabl intiha' al-tahaqquq la yaf3al shay'an.",{"img":"assets/shot-register.jpg","alt":"Istimarat al-tasjil fi CopyX","marks":[{"n":1,"x":24,"y":32,"t":"Ismak al-haqiqi. Yajib an yutabiq al-hawiya allati tarfa3uha lahiqan, w illa fasayafshal al-tahaqquq."},{"n":2,"x":24,"y":45,"t":"Ikhtar password la tastakhdimuh fi ayy makan akhar — w la tastakhdim nafs password baridak al-iliktruni."},{"n":3,"x":9,"y":66,"t":"3allim al-murabba3ayn. Iqra'huma awwalan — fahuma yanussan 3ala annak qad takhsar malak."},{"n":4,"x":50,"y":87,"t":"Idha ra'ayt hadha al-murabba3 al-asfar, farabitak kan yanqusuh ramz al-da3wa. Irja3 w iftah rabit al-sponsor badalan minh."},{"n":5,"x":24,"y":56,"t":"Hadhihi al-khana ta'ti muhaddada 3ala Albania 3ind al-jami3. Ghayyirha — famiftah al-hatif yataghayyar ma3aha."}],"check":"Tasil ila dakhil al-portal w tara ismak anta, la istimarat al-tasjil min jadid."}],["Urbut hisab al-broker — hadhihi al-khutwa muhimma","Ba3d an tadkhul ila al-portal, ibhath 3an zirr Login to CopyX w istakhdimh li-insha' hisab Tag Markets al-khass bik. W la tunshi' hisab Tag Markets bi-ayy tariqa ukhra, ka-an tunshi'ah mubasharatan 3ala CopyX aw 3ala mawqi3 al-broker nafsuh: fal-hisab alladhi yunsha' bi-hadhihi al-tariqa la tatimm muzamanatuh, w lan ya3mal al-tatabbu3 bi-shakl sahih ba3d dhalik.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Shahid hadhihi al-khutwa"},"note":"Al-nass fil-portal sarih: sajjil hisab Tag Markets al-khass bik 3abr dhalik al-zirr hasran.","img":"assets/shot-copyx-register.jpg","alt":"Lawhat tasjil CopyX dakhil al-IB Portal","marks":[{"n":1,"x":34,"y":37,"t":"Iqra' hadha al-satr. Fahuwa yatlub minnak an tunshi' hisab al-broker min huna, la min ayy makan akhar."},{"n":2,"x":13,"y":71,"t":"Hadha huwa al-zirr. Maktub 3alayh Login to CopyX — istakhdimh hatta fil-marra al-ula."},{"n":3,"x":50,"y":90,"t":"Al-tahdhir bil-asfar: hisab Tag Markets alladhi yunsha' mubasharatan 3ala CopyX lan yakun murtabitan bi-hisabak huna."}],"check":"Yazhar hisab Tag Markets dakhil al-portal. W in udturirt ila tasjil dukhul munfasil li-tajidah, fahuwa ghayr murtabit."}],["Akkid hawiyatak","Satahtaj ila bitaqat hawiyatak aw jawaz safarak, w yatlub al-broker aydan mashan lil-wajh. Sawwir al-mustanad fi daw' jayyid bihaythu tazhar zawayah al-arba3 kamila. W al-sura ghayr al-wadiha hiya al-sabab al-akthar shuyu3an lil-rafd, w nadiran ma yakun al-sabab shay'an akhtar min dhalik.",{"img":"assets/shot-kyc.jpg","alt":"Lawhat raf3 al-mustanadat","marks":[{"n":1,"x":50,"y":44,"t":"Ikhtar naw3 al-mustanad min huna awwalan. La yurfa3 shay' qabl dhalik."},{"n":2,"x":50,"y":75,"t":"Hadha al-satr al-asfar tabi3i qabl al-raf3. W huwa laysa khata'an."},{"n":3,"x":90,"y":5,"t":"Kalimat Validate ta3ni ann al-broker lam yafhas mustanadatak ba3d."}],"check":"Ikhtafa al-satr al-asfar «upload» w sar kull mustanad mursalan. W baqa' «Validate» ya3ni anna al-broker lam yanzur ba3d, w hadha tabi3i."}],["Intazir al-muwafaqa","Al-tahaqquq yastaghriq 3adatan waqtan qasiran. W ila an yaktamil, lan yasmah lak al-broker bi-ida3 al-mal — w satara hadha al-tanbih fi safhat al-wallet. W hadha tabi3i, w laysa khata'an.",{"img":"assets/shot-wallet-kyc.jpg","alt":"Safhat al-wallet tuzhir wujub ikmal KYC awwalan","marks":[{"n":1,"x":50,"y":30,"t":"Hadha al-satr al-zahri ya3ni ann al-tahaqquq ma zal qayd al-intizar. W yakhtafi ba3d al-muwafaqa 3ala mustanadatak."}],"check":"Ikhtafa al-satr al-zahri fi safhat al-wallet w sar zirr Deposit qabilan lil-daght."}],["Athna' al-intizar: thabbit al-tatbiqayn","Qad tastaghriq al-muwafaqa ba3d al-waqt, fastafid minh. Satahtaj lahiqan ila tatbiqayn: MetaTrader 5 li-tara hisabak (al-khutwa 9), w Element X li-majmu3at Aimpire (al-khutwa 10). Thabbit al-ithnayn al-an, min al-matajir al-rasmiya faqat — al-azrar adnah ta'khudhak ilayha mubashara.\n\nLa yahtaj Tag Markets w CopyX w al-IB Portal ila tatbiq; fahiya ta3mal fil-mutasaffih. W in arsal lak ahaduhum milaff tatbiq aw «Tag Markets app» fala tuthabbituh.",{"appcards":true,"check":"Yuftah kila al-tatbiqayn 3ala hatifak. La haja ila tasjil al-dukhul fi ayy minhuma ba3d — hadha ya'ti fil-khutwatayn 9 w 10."}],["Awdi3 al-mal","Fil-portal idghat Deposit, w ikhtar al-mablagh — al-hadd al-adna $10 — thumma ikhtar al-3umla al-raqmiya allati tamlikuha fi3lan. Ba3daha ya3rid lak al-portal 3unwanan w ramz QR w shabaka w 3addan tanazuliyan muddatuh nahwa khams 3ashrata daqiqa. Iftah mihfazatak anta, sawa' kanat Binance aw RedotPay aw ghayrahuma, w arsil min hunak. Qabl al-irsal qad tatlub mihfazatak ta'kid hawiyatak — bi-miftah al-murur aw Face ID aw ramz yasil ila baridak. Hadha tahaqquq khass bi-mihfazatak, w laysa amran yatlubuh Aimpire aw al-broker. W in intaha al-3add qabl an tursil, fatlub 3unwanan jadidan badal i3adat istikhdam al-qadim.\n\nBa3d al-irsal ta3rid al-mihfaza qa'imat hala: tamm al-irsal, qayd al-muraja3a, qayd al-mu3alaja, w yutawaqqa3 al-wusul khilal 24 sa3a. W zuhur «pending» laysa mushkila, bal hadhihi hiya al-hala al-tabi3iya fi mu3zam tilka al-mudda.",{"note":"Istakhdim bil-dabt al-shabaka allati yadhkuruha al-portal fi safhat al-daf3 — al-shabaka nafsuha fil-tarafayn. Al-shabaka al-khati'a la tu'akhkhir al-mal bal tudayyi3uh. Yaqbal al-broker al-ida3 3ala Ethereum (ERC20) w Polygon w Tron (TRC20) w BNB (BEP20) w Bitcoin w Polkadot w Solana; w ayy shabaka ta3riduha mihfazatak w laysat fi hadhihi al-qa'ima — Arbitrum mathalan — lan yasil al-mal 3abraha. W takhtalif al-shabakat fil-kulfa aydan: irsal 25 USDC 3abr Ethereum kallaf 1.00 USDC rusuman, ay arba3a fil-mi'a, fatahaqqaq min al-rusum qabl al-irsal.","check":"Yazhar al-mablagh fi safhat al-wallet dakhil al-portal. W in lam yasil, fatahaqqaq min al-3amaliya fi mihfazatak anta awwalan — fal-portal la ya3rid ma lam yasiluh aslan.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71}}],["Urbut hisabak bi Sonic copy trading","Hadhihi hiya al-khutwa allati tabda' al-naskh fi3lan. Qablaha qad yabqa al-mal fil-hisab dun ayy tadawul. Idhhab ila Tag Markets, w iftah CopyX min al-qa'ima, w ibhath 3an SONIC w idghat Details. Ta3rid al-bitaqa al-shurut allati tuwafiq 3alayha: rasm ada' 30 %, w mudda la taqill 3an shahr wahid, w la rusum idara w la rusum indimam.\n\nIdghat Connect. Uktub al-mablagh alladhi turid an tabda' bih ($10 3ala al-aqall) w ikhtar naw3 al-hisab Amplify. Fi Community Token uktub #Aitech w idghat Verify; sayazhar haql Hash — uktub fih 000000 w idghat Submit. 3allim al-murabba3ayn — ittifaqiyat al-mutabi3, w al-iqrar bi-anna al-traders la yatba3un Tag Markets — thumma idghat Copy Now (yusamma fi ba3d al-shashat Join to Copytrade).",{"note":"Naw3 al-hisab: ya3mal Sonic 3ala hisab Amplify, w al-token yarfa3uh ila 24× — fi tajribatina sar mablagh $109 rasid tadawul qadruh $2,616. W ma3 al-token yughlaq al-hisab 3ind khasarat 5% badal 10%. La tada3 illa mablaghan tastati3 khasaratah kamilan.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"Yazhar murabba3 yaqul «CopyX Account Created» — idghat Continue. Ba3daha yazhar SONIC fi lawhatak, w tajid asfalaha MT5 Credentials allati tastakhdimuha al-khutwa 9. W in zahar al-mablagh $0, fahadha ya3ni anna al-daght 3ala Submit lam yaktamil.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["Raqib hisabak fi MetaTrader 5","Min huna tutabi3 al-hisab yawman bi-yawm. Thabbit MetaTrader 5, thumma iftah al-portal w ibhath 3an MT5 Credentials — tajid fih raqm hisab, w Master Password, w Investor Password. Fil-tatbiq ikhtar idafat hisab mawjud, w ibhath 3an T.M. Financials Ltd, w ikhtar al-khadim TMFinancials-Server. W ism al-dukhul huwa raqm al-hisab. Ba3daha satara Balance w Equity w Free Margin.",{"note":"Al-Master Password yutih tanfidh safaqat 3ala hisabak, amma al-Investor Password fayutih al-mushahada faqat. La tursil al-Master Password ila ahad — la ila qa'id, w la ila al-da3m, w la ila ayy shakhs yatlubuh minnak. W in aradt an yattali3 ahad 3ala nata'ijak, fa'a3tih al-Investor Password badalan minh.","apps":{"lede":"Thabbit MetaTrader 5 3ala hatifak:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Yuzhir Balance al-raqm nafsuh alladhi fil-portal — w ma3 al-token yakun hadha al-raqm 24 di3f ma awda3tah. Mablaghuna al-baligh $109 zahar bi-qimat $2,616. W tataghayyar Equity w Free Margin bi-mujarrad an takun lada Sonic safqa maftuha; w hadha tabi3i. W in lam yakun al-Balance ladayk 24 di3fan, fatawaqqaf w is'al al-sponsor al-khass bik qabl ayy khutwa ukhra.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["Indamm ila al-majmu3a","Fil-majmu3a tajid al-ijabat 3an as'ilatak — fala ahad hunak bada' w huwa ya3rif shay'an, mithlak tamaman. W in adaft mazidan min al-mal lahiqan, fa'adifh 3ala dafa3at saghira.",{"apps":{"lede":"Thabbit Element X — hadha al-tatbiq bil-dhat, la Element Classic w la ayy tatbiq muhadatha akhar. Anshi' hisaban bi-ayy ism mustakhdim. Thumma 3ud ila huna w idghat «Indamm ila majmu3at Aimpire».","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Indamm ila majmu3at Aimpire"},"check":"Tastati3 qira'at al-rasa'il fil-majmu3a, la ru'yat ismiha faqat."}]]},"ur_rm":{"lede":"Pehle chaar steps mein taqreeban pandrah minute lagte hain, aur aap ke paas apna shanakhti card ya passport hona chahiye. Phir approval ka intezar, jo aap ke haath mein nahi. Paise daalna aur baqi sab us ke baad, jab aap ko munasib lage. Aap kisi bhi step ke baad ruk kar wapas aa sakte hain — safha yaad rakhta hai aap kahan the.","steps":[["Apne sponsor ka link istemal karein","Wohi link kholein jo aap ko bulane wale ne bheja hai — un ka apna link, kisi group mein para hua nahi. Is safhe ke upar ek satar hai — «Aap ki registration yahan jayegi: …» — jo chhe huroof aur numbers par khatam hoti hai.\n\nIsi code se pata chalta hai keh aap ko kaun laya hai. Agar woh satar nazar hi na aaye to aap ne baghair code wala link khola hai: broker ko pata nahi chalega keh aap ko kaun laya, aur madad ke liye koi aap ke saath jura nahi hoga. Un se un ka link maang lein.",{"check":"Upar wali line mein naam nazar aaye, ya domain aur chhe huroof. Line bilkul na ho to koi sponsor munsalik nahi — wapas ja kar unka link kholein."}],["Apna account banayein","Upar scroll kar ke sab se upar wale bade button “Apna account kholein” par jaayein aur dabayein. Yeh CopyX ko naye tab mein kholta hai — aap ko kaala COPY-X logo nazar aayega. Asal naam aur maloomat dein: yeh us ID se milni chahiye jo aap baad mein upload karenge. Aisa password chunein jo kahin aur istemal na karte hon.\n\nAham: country ka khana sab ke liye pehle se Albania par hota hai — ise apne asal mulk par badlein, kyunkeh phone ka code isi se aata hai. Phir dono boxes par nishan lagayein, neeche ka chhota surmai “Verifying…” box mukammal hone dein, aur Sign Up dabayein. Jaanch mukammal hone se pehle dabane par kuch nahi hota.",{"img":"assets/shot-register.jpg","alt":"CopyX ka sign up form","marks":[{"n":1,"x":24,"y":32,"t":"Apna asal naam. Yeh us shanakhti card se milna chahiye jo aage upload karenge, warna tasdeeq nakaam hogi."},{"n":2,"x":24,"y":45,"t":"Aisa password jo aap kahin aur istemal nahi karte. Email ka password nahi."},{"n":3,"x":9,"y":66,"t":"Dono par nishan lagayein. Pehle parhein — in mein likha hai keh aap raqam kho sakte hain."},{"n":4,"x":50,"y":87,"t":"Yeh peela box nazar aaye to aap ke link mein invite code nahi tha. Wapas ja kar apne sponsor ka link kholein."},{"n":5,"x":24,"y":56,"t":"Yeh sab ke liye pehle se Albania par hota hai. Ise badlein — phone ka code isi se aata hai."}],"check":"Aap portal ke andar pahunchte hain aur apna naam dekhte hain, dobara sign-up form nahi."}],["Apna broker account jorein — yeh marhala aham hai","IB Portal mein login karne ke baad Login to CopyX ka button talaash karein aur isi se apna Tag Markets account banayein. Tag Markets account kisi aur tareeqe se na banayein, masalan seedha CopyX par ya broker ki apni website par. Is tarah banaya gaya account aap ke portal se nahi jurta, aur baad mein kuch bhi theek se track nahi hoga.",{"note":"Portal khud saaf likhta hai: apna Tag Markets account sirf usi button se banayein.","soon":"Urdu video abhi tayyar ki ja rahi hai. Tab tak koi baat samajh na aaye to apne sponsor se pooch lein — woh isi liye hain.","img":"assets/shot-copyx-register.jpg","alt":"IB Portal mein CopyX registration panel","marks":[{"n":1,"x":34,"y":37,"t":"Yeh satar parhein. Yeh batati hai keh broker account yahin se banana hai, kahin aur se nahi."},{"n":2,"x":13,"y":71,"t":"Yehi button hai. Is par Login to CopyX likha hai — pehli baar bhi yehi istemal karein."},{"n":3,"x":50,"y":90,"t":"Peeli tanbeeh: seedha CopyX par banaya gaya Tag Markets account munsalik nahi hoga."}],"check":"Tag Markets account portal ke andar nazar aata hai. Agar use dhoondne ke liye kahin alag se login karna pada, to woh jura hua nahi."}],["Apni shanakht ki tasdeeq karein","Aap ko shanakhti card ya passport chahiye, aur broker ek face scan bhi maangta hai. Dastavez ki tasveer achi roshni mein lein, charon konay nazar aayein. Dhundli tasveer hi sab se aam wajah hai jis se darkhwast mustarad hoti hai — is se zyada sangeen wajah kam hi hoti hai.",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents panel","marks":[{"n":1,"x":50,"y":44,"t":"Pehle yahan dastavez ki qisam chunein. Is se pehle kuch upload nahi hoga."},{"n":2,"x":50,"y":75,"t":"Upload se pehle yeh peeli satar maamool ki baat hai. Yeh kharabi nahi."},{"n":3,"x":90,"y":5,"t":"Validate ka matlab hai broker ne abhi aap ki dastavezaat nahi dekhin."}],"check":"Peeli «upload» line chali gayi aur har document jama shuda dikhta hai. «Validate» ab bhi nazar aaye to broker ne abhi dekha nahi — yeh maamool hai."}],["Manzoori ka intezar karein","Tasdeeq mein umooman thora waqt lagta hai. Jab tak yeh mukammal na ho, broker aap ko raqam daalne nahi dega — wallet safhe par aap ko yeh ittila nazar aayegi. Yeh maamool ki baat hai, koi kharabi nahi.",{"img":"assets/shot-wallet-kyc.jpg","alt":"wallet safha jo batata hai keh pehle KYC mukammal karna hai","marks":[{"n":1,"x":50,"y":30,"t":"Yeh gulabi satar batati hai keh tasdeeq abhi baqi hai. Dastavezaat manzoor hote hi yeh hat jati hai."}],"check":"Wallet page ki gulabi line chali gayi aur Deposit ka button dab sakta hai."}],["Intezar ke dauran: dono apps install karein","Approval mein kuch waqt lag sakta hai, to use kaam mein laayein. Aage aap ko do apps chahiyein: apna account dekhne ke liye MetaTrader 5 (step 9) aur Aimpire group ke liye Element X (step 10). Dono abhi install kar lein, sirf official stores se — neeche ke buttons seedhe wahin le jaate hain.\n\nTag Markets, CopyX aur IB Portal ke liye koi app nahi chahiye; woh browser mein chalte hain. Koi aap ko app ki file ya «Tag Markets app» bheje to install na karein.",{"appcards":true,"check":"Dono apps aap ke phone par khulti hain. Abhi kisi mein login ki zaroorat nahi — woh steps 9 aur 10 mein aayega."}],["Account mein paise daalein","Portal mein Deposit dabayein, raqam chunein — kam se kam $10 — aur wohi crypto chunein jo waqai aap ke paas hai. Is ke baad portal aap ko ek address, ek QR code, ek network aur taqreeban pandrah minute ka countdown dikhata hai. Apna wallet kholein, chahe woh Binance ho, RedotPay ho ya koi aur, aur wahin se bhejein. Bhejne se pehle aap ka wallet pooch sakta hai keh yeh aap hi hain — passkey, Face ID ya aap ki email par aane wale code se. Yeh aap ke wallet ki apni jaanch hai, Aimpire ya broker ki nahi. Bhejne se pehle countdown khatam ho jaaye to purana address dobara istemal na karein, naya le lein.\n\nBhejne ke baad wallet ek status fehrist dikhata hai: submission successful, pending review, wallet processing, 24 ghanton ke andar pahunchne ki tawaqqo. «Pending» nazar aana koi masla nahi — us dauran zyada tar waqt yahi status rehta hai.",{"note":"Bilkul wohi network istemal karein jo portal apne payment page par batata hai — dono taraf ek hi. Ghalat network chuna to paisa der se nahi pahunchega, seedha zaya ho jaayega. Broker in networks par deposit leta hai: Ethereum (ERC20), Polygon, Tron (TRC20), BNB (BEP20), Bitcoin, Polkadot aur Solana; aap ka wallet koi aisa network dikhaye jo is fehrist mein nahi — jaise Arbitrum — to paisa nahi pahunchega. Networks ki fee bhi alag hai: Ethereum se 25 USDC bhejne par 1.00 USDC fee lagi, yaani chaar feesad, is liye bhejne se pehle fee dekh lein.","check":"Raqam portal ke wallet safhe par nazar aati hai. Na pahunche to pehle apne hi wallet mein transaction dekhein — portal woh nahi dikha sakta jo us tak pahuncha hi nahi.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71}}],["Sonic copy trading se judein","Yahi woh step hai jo asal mein copying shuru karta hai. Is ke baghair paisa account mein pada reh sakta hai aur koi trade nahi hogi. Tag Markets par jaayein, menu se CopyX kholein, SONIC dhoondein aur Details dabayein. Card par woh shartein hain jin par aap haan keh rahe hain: 30 % performance fee, kam az kam ek mahina, na management fee na joining fee.\n\nConnect dabayein. Shuru ki raqam likhein (kam az kam $10) aur account type mein Amplify chunein. Community Token mein #Aitech likhein aur Verify dabayein; ek Hash ka khana aayega — us mein 000000 likhein aur Submit dabayein.\n\nDono boxes par tick karein — follower agreement, aur yeh keh traders, Tag Markets nahi hain — phir Copy Now dabayein (kuch screens par is ka naam Join to Copytrade hai).",{"note":"Account type: Sonic ek Amplify account par chalta hai, aur token use 24× kar deta hai — hamare apne test mein $109 se $2,616 ka trading balance bana. Token ke saath account 10% ki bajaye 5% nuqsan par band ho jaata hai. Sirf utni raqam daalein jise poora khona aap bardasht kar sakein.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"Ek box mein «CopyX Account Created» likha aayega — Continue dabayein. Phir aap ke dashboard par SONIC nazar aayega, aur neeche MT5 Credentials milenge, jo step 9 mein kaam aayenge. Agar raqam $0 dikhe to Submit nahi hua.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["Apna account MetaTrader 5 mein dekhein","Rozmarra mein account yahin se dekha jaata hai. MetaTrader 5 install karein, phir portal khol kar MT5 Credentials talaash karein — wahan ek account number, ek Master Password aur ek Investor Password milta hai.\n\nApp mein maujooda account shamil karna chunein, T.M. Financials Ltd talaash karein aur server TMFinancials-Server muntakhib karein. Login wohi account number hai. Is ke baad aap ko Balance, Equity aur Free Margin nazar aayenge.",{"note":"Master Password se aap ke account par trade ho sakti hai. Investor Password se sirf dekha ja sakta hai. Apna Master Password kisi ko na bhejein — na kisi leader ko, na support ko, na use jo maange. Koi aap ke nataij dekhna chahe to use Investor Password de dein.","apps":{"lede":"Apne phone ke liye MetaTrader 5 install karein:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance mein wohi adad nazar aata hai jo portal mein hai — aur token ke saath woh adad aap ki daali hui raqam ka 24 guna hota hai. Hamare test mein $109 ki jagah $2,616 nazar aaye. Sonic ki koi trade khulte hi Equity aur Free Margin badalte hain; yeh maamool ki baat hai. Agar aap ka Balance 24 guna nahi hai to ruk jaayein aur kuch bhi karne se pehle apne sponsor se poochein.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["Group mein shamil hon","Sawalaat ke jawab group mein milte hain — wahan bhi har koi sifar se shuru hua tha. Baad mein agar aap mazeed paise daalein to thode thode kar ke daalein.",{"apps":{"lede":"Element X install karein — bilkul yahi app, Element Classic nahi aur koi aur chat app nahi. Ek account banayein, username kuch bhi ho sakta hai. Phir yahan wapas aa kar “Aimpire group mein shamil hon” dabayein.","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Aimpire group mein shamil hon"},"check":"Aap group mein paighamaat parh sakte hain, sirf us ka naam nahi dekhte."}]]}},"langs":[{"code":"en","label":"English","dir":"ltr","font":"latin"},{"code":"no","label":"Norsk","dir":"ltr","font":"latin"},{"code":"hi","label":"हिन्दी","dir":"ltr","font":"deva"},{"code":"ar","label":"العربية","dir":"rtl","font":"naskh"},{"code":"ur","label":"اردو","dir":"rtl","font":"nastaliq"},{"code":"ar_rm","label":"Roman Arabic","dir":"ltr","font":"latin","bcp":"ar-Latn","roman_of":"ar"},{"code":"ur_rm","label":"Roman Urdu","dir":"ltr","font":"latin","bcp":"ur-Latn","roman_of":"ur"}],"earn_shot":{"img":"assets/shot-commission.jpg","alt":{"en":"The commissions overview in the IB Portal","no":"Provisjonsoversikten i IB Portal","hi":"IB Portal में commissions का अवलोकन","ur":"IB Portal میں commissions کا جائزہ","ar":"نظرة عامة على العمولات في IB Portal","ar_rm":"Nazra 3amma 3ala al-3umulat fi IB Portal","ur_rm":"IB Portal mein commissions ka jaiza"},"marks":{"en":[{"n":1,"x":22,"y":55,"t":"This is where your real numbers live. If a figure in a chat message does not match this screen, this screen is right."}],"no":[{"n":1,"x":22,"y":55,"t":"Her står dine virkelige tall. Hvis et tall i en chat ikke stemmer med denne skjermen, er det denne som gjelder."}],"hi":[{"n":1,"x":22,"y":55,"t":"आपके असली आँकड़े यहीं हैं। किसी चैट का आँकड़ा इस स्क्रीन से मेल न खाए, तो यही स्क्रीन सही है।"}],"ur":[{"n":1,"x":22,"y":55,"t":"آپ کے اصل اعداد و شمار یہیں ہوتے ہیں۔ کسی chat میں بتائی گئی رقم اس screen سے میل نہ کھائے، تو درست یہی screen ہے۔"}],"ar":[{"n":1,"x":22,"y":55,"t":"هنا توجد أرقامك الحقيقية. وإذا اختلف رقم في رسالة على الـ chat عمّا تراه في هذه الشاشة، فالشاشة هي الصحيحة."}],"ar_rm":[{"n":1,"x":22,"y":55,"t":"Huna tujad arqamak al-haqiqiya. W idha ikhtalaf raqm fi risala 3ala al-chat 3amma tarah fi hadhihi al-shasha, fal-shasha hiya al-sahiha."}],"ur_rm":[{"n":1,"x":22,"y":55,"t":"Aap ke asal adaad o shumar yahin hote hain. Kisi chat mein batai gayi raqam is screen se mail na khaye, to durust yehi screen hai."}]}},"places":{"title":{"en":"Three places, three names","no":"Tre steder, tre navn","hi":"तीन जगहें, तीन नाम","ur":"تین جگہیں، تین نام","ar":"ثلاثة أماكن، ثلاثة أسماء","ar_rm":"Thalathat amakin, thalathat asma'","ur_rm":"Teen jagahein, teen naam"},"lede":{"en":"You will end up with two logins. Knowing which is which saves most of the confusion.","no":"Du får to innlogginger. Vet du hvilken som er hvilken, slipper du det meste av forvirringen.","hi":"आपके पास दो logins होंगे। कौन-सा login किस चीज़ का है, यह जान लेने से ज़्यादातर उलझन से बचा जा सकता है।","ur":"آپ کے پاس دو logins ہوں گے۔ کون سا کیا ہے، یہ ایک بار سمجھ لیں تو بعد کی زیادہ تر الجھن ختم ہو جاتی ہے۔","ar":"سيكون لديك حسابان تسجّل بهما الدخول. ومعرفة الفرق بينهما تُجنّبك معظم الالتباس.","ar_rm":"Sayakun ladayk hisaban tusajjil bihima al-dukhul. W ma3rifat al-farq baynahuma tujannibak mu3zam al-iltibas.","ur_rm":"Aap ke paas do logins honge. Kaun sa kya hai, yeh ek baar samajh lein to baad ki zyada tar uljhan khatam ho jati hai."},"items":{"en":[["CopyX","The platform that copies the traders. You create this first, in step 2."],["IB Portal","Where your team and your numbers live. Same login as CopyX."],["Tag Markets","The broker — the company that actually holds your money. You create this from inside the portal, in step 3."]],"no":[["CopyX","Plattformen som kopierer traderne. Denne oppretter du først, i steg 2."],["IB Portal","Der teamet ditt og tallene dine ligger. Samme innlogging som CopyX."],["Tag Markets","Megleren — selskapet som faktisk holder pengene dine. Denne oppretter du inne fra portalen, i steg 3."]],"hi":[["CopyX","वह platform जो traders को copy करता है। यह आप सबसे पहले बनाते हैं, step 2 में।"],["IB Portal","जहाँ आपकी team और आपके आँकड़े रहते हैं। CopyX वाला ही login।"],["Tag Markets","Broker — वह कंपनी जो असल में आपका पैसा रखती है। यह आप portal के अंदर से बनाते हैं, step 3 में।"]],"ur":[["CopyX","وہ platform جو traders کو copy کرتا ہے۔ یہ آپ سب سے پہلے بناتے ہیں، step 2 میں۔"],["IB Portal","جہاں آپ کی team اور آپ کے اعداد و شمار ہوتے ہیں۔ Login وہی ہے جو CopyX کا ہے۔"],["Tag Markets","Broker — وہ کمپنی جو اصل میں آپ کا پیسہ رکھتی ہے۔ یہ آپ portal کے اندر سے بناتے ہیں، step 3 میں۔"]],"ar":[["CopyX","المنصة التي تنسخ صفقات الـ traders. تنشئ حسابك فيها أولاً، في الخطوة 2."],["IB Portal","حيث تجد فريقك وأرقامك. وتدخل إليه بنفس بيانات الدخول إلى CopyX."],["Tag Markets","الـ broker — الشركة التي تحتفظ بمالك فعلاً. تنشئ حسابك فيها من داخل الـ portal، في الخطوة 3."]],"ar_rm":[["CopyX","Al-minassa allati tansakh safaqat al-traders. Tunshi' hisabak fiha awwalan, fil-khutwa 2."],["IB Portal","Haythu tajid fariqak w arqamak. W tadkhul ilayh bi-nafs bayanat al-dukhul ila CopyX."],["Tag Markets","Al-broker — al-sharika allati tahtafiz bi-malak fi3lan. Tunshi' hisabak fiha min dakhil al-portal, fil-khutwa 3."]],"ur_rm":[["CopyX","Woh platform jo traders ko copy karta hai. Yeh aap sab se pehle banate hain, step 2 mein."],["IB Portal","Jahan aap ki team aur aap ke adaad o shumar hote hain. Login wohi hai jo CopyX ka hai."],["Tag Markets","Broker — woh company jo asal mein aap ka paisa rakhti hai. Yeh aap portal ke andar se banate hain, step 3 mein."]]}},"guide_ui":{"en":{"copy":"Copy","copied":"Copied","progress":"{done} of {total} steps done","reset":"Clear","check":"You know it worked when","mark":"Mark this step done","marked":"Done — tap to undo","left":"{n} left","next":"Next: {t}","all_done":"All {total} steps done. You are set up.","all_done_go":"Next: how Sonic works","watch":"See it on screen — {s} seconds"},"no":{"copy":"Kopier","copied":"Kopiert","progress":"{done} av {total} steg gjort","reset":"Nullstill","check":"Du vet at det virket når","mark":"Merk steget som gjort","marked":"Gjort — trykk for å angre","left":"{n} igjen","next":"Neste: {t}","all_done":"Alle de {total} stegene er gjort. Du er i gang.","all_done_go":"Videre: hvordan Sonic virker","watch":"Se det på skjermen — {s} sekunder"},"hi":{"copy":"कॉपी करें","copied":"कॉपी हो गया","progress":"{total} में से {done} steps पूरे","reset":"रीसेट","check":"कैसे पता चलेगा कि काम हो गया","mark":"इस step को पूरा मार्क करें","marked":"हो गया — वापस लेने के लिए दबाएँ","left":"{n} बाक़ी","next":"अगला: {t}","all_done":"सभी {total} steps पूरे। आप तैयार हैं।","all_done_go":"आगे: Sonic कैसे काम करता है","watch":"स्क्रीन पर देखें — {s} सेकंड"},"ur":{"copy":"کاپی کریں","copied":"کاپی ہو گیا","progress":"{total} میں سے {done} steps مکمل","reset":"صاف کریں","check":"کیسے پتا چلے کہ ٹھیک ہوا","mark":"یہ step مکمل ہو گیا","marked":"ہو گیا — واپس لینے کے لیے دبائیں","left":"{n} باقی","next":"اگلا: {t}","all_done":"تمام {total} steps مکمل۔ آپ تیار ہیں۔","all_done_go":"آگے: Sonic کیسے کام کرتا ہے","watch":"اسکرین پر دیکھیں — {s} سیکنڈ"},"ar":{"copy":"نسخ","copied":"تم النسخ","progress":"{done} من {total} خطوات مكتملة","reset":"مسح","check":"تعرف أنّها نجحت حين","mark":"علّم هذه الخطوة على أنها مُنجزة","marked":"تمّت — اضغط للتراجع","left":"{n} متبقية","next":"التالي: {t}","all_done":"أُنجزت الخطوات الـ {total} كلها. أنت جاهز.","all_done_go":"التالي: كيف يعمل Sonic","watch":"شاهده على الشاشة — {s} ثانية"},"ar_rm":{"copy":"Naskh","copied":"Tamm al-naskh","progress":"{done} min {total} khutuwat muktamila","reset":"Mash","check":"Ta3rif annaha najahat hin","mark":"3allim hadhihi al-khutwa 3ala annaha munjaza","marked":"Tammat — idghat lil-tarajju3","left":"{n} mutabaqqiya","next":"Al-tali: {t}","all_done":"Unjizat al-khutuwat al-{total} kulluha. Anta jahiz.","all_done_go":"Al-tali: kayf ya3mal Sonic","watch":"Shahidh 3ala al-shasha — {s} thaniya"},"ur_rm":{"copy":"Copy karein","copied":"Copy ho gaya","progress":"{total} mein se {done} steps mukammal","reset":"Saaf karein","check":"Kaise pata chale keh theek hua","mark":"Yeh step mukammal ho gaya","marked":"Ho gaya — wapas lene ke liye dabayein","left":"{n} baqi","next":"Agla: {t}","all_done":"Tamaam {total} steps mukammal. Aap tayyar hain.","all_done_go":"Aage: Sonic kaise kaam karta hai","watch":"Screen par dekhein — {s} second"}},"learn":{"intro":{"en":"You do not need any of this to let Sonic run. It is here for when you want to understand what you are looking at. Tap any word to open it.","no":"Du trenger ikke noe av dette for å la Sonic gå. Det er her når du vil forstå hva du ser på. Trykk på et ord for å åpne det.","hi":"Sonic को चलने देने के लिए इसमें से कुछ भी जानना ज़रूरी नहीं है। यह तब के लिए है जब आप समझना चाहें कि आप क्या देख रहे हैं। किसी भी शब्द को खोलने के लिए उस पर दबाएँ।","ur":"Sonic چلانے کے لیے اس میں سے کچھ بھی ضروری نہیں۔ یہ اُس وقت کے لیے ہے جب آپ سمجھنا چاہیں کہ آپ کیا دیکھ رہے ہیں۔ کسی بھی لفظ پر دبائیں۔","ar":"لا تحتاج إلى شيء من هذا لتترك Sonic يعمل. هو هنا لتعود إليه حين تريد أن تفهم ما تنظر إليه. اضغط على أي كلمة لتفتحها.","ar_rm":"La tahtaj ila shay' min hadha li-tatruk Sonic ya3mal. Huwa huna li-ta3ud ilayh hin turid an tafham ma tanzur ilayh. Idghat 3ala ayy kalima li-taftahaha.","ur_rm":"Sonic chalane ke liye is mein se kuch bhi zaroori nahi. Yeh us waqt ke liye hai jab aap samajhna chahein keh aap kya dekh rahe hain. Kisi bhi lafz par dabayein."},"labels":{"en":["Example","Why it matters","Formula"],"no":["Eksempel","Hvorfor det er viktig","Formel"],"hi":["उदाहरण","यह क्यों मायने रखता है","सूत्र"],"ur":["مثال","یہ کیوں اہم ہے","فارمولا"],"ar":["مثال","لماذا يهمّك","المعادلة"],"ar_rm":["Mithal","Limadha yahummak","Al-mu3adala"],"ur_rm":["Misaal","Yeh kyun aham hai","Formula"]},"terms":{"en":[["Pip","The unit a price moves in — the fourth decimal on most pairs.","On EUR/USD, 1.0850 → 1.0851 is one pip. At 0.01 lots that is $0.10.","Every target and result you hear is quoted in pips, and a number of pips means nothing until you know the lot size behind it.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","A tenth of a pip. Some platforms quote points instead.","«+500 points» on EUR/USD is 50 pips. At 0.01 lots that is $5, not $500.","This is the mix-up that makes a modest result look ten times bigger. Check the unit before you compare your numbers to anyone's.","pips = points ÷ 10",""],["Spread","The gap between the buy price and the sell price. You pay it the moment you enter.","Buy 1.08515, sell 1.08500 is 1.5 pips. At 0.01 lots, $0.15 per trade.","Every trade starts behind by the spread, win or lose. Ten trades a day on a small account is a real cost.","spread cost = spread in pips × pip value","spread"],["Lot size","How much you trade. This decides what one move is worth — and it is not the same number on every instrument.","EUR/USD: 1.00 lot ≈ $10 per pip, 0.01 ≈ $0.10. Gold (XAUUSD): 1.00 lot = 100 oz, so a $1 move is $100.","This is the one number that decides whether an ordinary move is an irritation or the end of the account — and the figure differs per instrument. Sonic's own record shows it trades gold, not a currency pair. Before you size anything, check the real value: in MT5, open the symbol's Specification (on a computer, right-click the symbol).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage is how big a position you may hold. Margin is the part of your money locked while it is open.","A 0.01 lot EUR/USD position is about $1,085 of currency. At 1:300 that ties up roughly $3.60 of yours.","Higher leverage does not reduce risk. It only frees margin so you are allowed to open more.","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance is money from trades already closed. Equity is that plus or minus everything still open.","Balance $100, one trade 40 pips against you at 0.01 lots (−$4) → equity $96.","Balance is history. Equity is where you actually stand. A floating loss is a real loss not yet written down.","equity = balance + open profit − open loss",""],["Margin call and stop out","When equity falls far enough against the margin your trades need, the broker closes them for you.","$100 account carrying a $60 floating loss has $40 of equity left.","At a stop out you do not choose the exit. The loss is locked in at that moment, often at the worst point.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","A standing instruction to close at a price you picked in advance, so the loss stops growing.","Buy at 1.0850 with a stop at 1.0830 is 20 pips. At 0.01 lots, $2 at risk — decided before you entered.","Without one, the size of your loss is set by how long you can stand to look at it.","risk = stop in pips × pip value",""],["Limit and stop orders","A limit waits for a better price. A stop only triggers once price pushes through a level.","Price 1.0850. Buy Limit 1.0830 fills if price falls. Buy Stop 1.0870 fills if price rises.","Signals are posted in this shorthand: Buy Limit, Buy Stop, Sell Limit, Sell Stop. Pick the wrong one of the four and it either never triggers, or opens your trade at the wrong moment."],["Risk per trade","The money — not the pips — you accept losing on one trade.","$100 account, 0.01 lots, 20-pip stop = $2 at risk. That is 2 percent.","On a $100 account the smallest tradable size already risks several percent per trade. The «risk 1 percent» advice does not fit yet.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","How far equity has fallen from its highest point, in percent.","$100 down to $60 is 40 percent down. Getting back to $100 needs a 67 percent gain, not 40.","Losses and recoveries are not symmetrical. A run of small losses can leave you needing a return you have never produced.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","Leaving gains in, so position size grows with the balance instead of staying fixed.","$100 at 5 percent a month, profit left in, is about $180 after a year rather than $160.","It is the honest argument for patience on a small account — and the engine of every unrealistic plan you will be shown.","final = start × (1 + rate)^periods",""]],"no":[["Pip","Enheten en pris beveger seg i — fjerde desimal på de fleste par.","På EUR/USD er 1,0850 → 1,0851 én pip. Ved 0,01 lot er det $0,10.","Alle mål og resultater du hører, oppgis i pips — og et antall pips sier ingenting før du vet lot-størrelsen bak.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","En tidel av en pip. Noen plattformer oppgir points i stedet.","«+500 points» på EUR/USD er 50 pips. Ved 0,01 lot er det $5, ikke $500.","Dette er forvekslingen som får et nøkternt resultat til å se ti ganger større ut. Sjekk enheten før du sammenligner tallene dine med andres.","pips = points ÷ 10",""],["Spread","Avstanden mellom kjøpsprisen og salgsprisen. Du betaler den idet du går inn.","Kjøp 1,08515, salg 1,08500 er 1,5 pips. Ved 0,01 lot er det $0,15 per handel.","Hver handel starter i minus med spreaden, enten den ender i gevinst eller tap. Ti handler om dagen på en liten konto er en reell kostnad.","spread cost = spread in pips × pip value","spread"],["Lot size","Hvor mye du handler. Det avgjør hva én bevegelse er verdt — og det er ikke samme tall på alle instrumenter.","EUR/USD: 1,00 lot ≈ $10 per pip, 0,01 ≈ $0,10. Gull (XAUUSD): 1,00 lot = 100 unser, så en bevegelse på $1 er $100.","Dette er det ene tallet som avgjør om en helt vanlig bevegelse er en irritasjon eller slutten på kontoen — og tallet er ulikt fra instrument til instrument. I Sonics egen historikk handles gull, ikke et valutapar. Før du bestemmer størrelsen på noe, sjekk den faktiske verdien: åpne symbolets Specification i MT5 (på en datamaskin høyreklikker du symbolet).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage (giring) er hvor stor posisjon du får holde. Margin er den delen av pengene dine som er låst mens den står åpen.","En posisjon på 0,01 lot EUR/USD er rundt $1 085 i valuta. Ved 1:300 binder det omtrent $3,60 av dine.","Høyere leverage reduserer ikke risiko. Den frigjør bare margin, så du får lov til å åpne mer.","margin = lots × 100 000 × pris ÷ leverage",""],["Balance and equity","Balance er penger fra handler som alt er lukket. Equity er det, pluss eller minus alt som fortsatt står åpent.","Balance $100, én handel 40 pips i minus ved 0,01 lot (−$4) → equity $96.","Balance er historie. Equity er der du faktisk står. Et flytende tap er et ekte tap som ennå ikke er bokført.","equity = balance + open profit − open loss",""],["Margin call and stop out","Når equity faller langt nok i forhold til marginen handlene dine krever, lukker megleren dem for deg.","En konto på $100 med $60 i flytende tap har $40 igjen i equity.","Ved et stop out velger ikke du utgangen. Tapet låses der og da, ofte på det verste punktet.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","En stående ordre om å lukke på en pris du valgte på forhånd, så tapet slutter å vokse.","Kjøp på 1,0850 med stopp på 1,0830 er 20 pips. Ved 0,01 lot er $2 i risiko — bestemt før du gikk inn.","Uten den avgjøres tapets størrelse av hvor lenge du orker å se på det.","risk = stop in pips × pip value",""],["Limit and stop orders","En limit venter på en bedre pris. En stop utløses først når prisen bryter gjennom et nivå.","Pris 1,0850. Buy Limit 1,0830 blir utført hvis prisen faller. Buy Stop 1,0870 blir utført hvis den stiger.","Signaler legges ut med denne kortformen: Buy Limit, Buy Stop, Sell Limit, Sell Stop. Velger du feil av de fire, blir ordren enten aldri utløst, eller den åpner handelen din på feil tidspunkt."],["Risk per trade","Pengene — ikke pipsene — du godtar å tape på én handel.","Konto $100, 0,01 lot, 20 pips stopp = $2 i risiko. Det er 2 prosent.","På en $100-konto risikerer den minste handelbare størrelsen alt flere prosent per handel. Rådet om «risiker 1 prosent» passer ikke ennå.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Hvor langt equity har falt fra toppen, i prosent.","$100 ned til $60 er 40 prosent ned. Tilbake til $100 krever 67 prosent opp, ikke 40.","Tap og gjenhenting er ikke symmetriske. En rekke små tap kan gjøre at du trenger en avkastning du aldri har oppnådd.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","Å la gevinsten stå, så posisjonsstørrelsen vokser med saldoen i stedet for å stå fast.","$100 med 5 prosent i måneden, med gevinsten stående i kontoen, er rundt $180 etter et år i stedet for $160.","Det er det ærlige argumentet for tålmodighet på en liten konto — og motoren i alle de urealistiske planene du kommer til å få se.","final = start × (1 + rate)^periods",""]],"hi":[["Pip","वह unit जिसमें price ऊपर-नीचे होती है — ज़्यादातर pairs में दशमलव के बाद चौथा अंक।","EUR/USD पर 1.0850 → 1.0851 एक pip है। 0.01 lot पर यह $0.10 है।","हर target और result pips में बताया जाता है — और pips की गिनती का कोई मतलब नहीं जब तक पीछे का lot size न पता हो।","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","Pip का दसवाँ हिस्सा। कुछ platforms points में बताते हैं।","EUR/USD पर «+500 points» यानी 50 pips। 0.01 lot पर $5, $500 नहीं।","यही गड़बड़ है जो एक मामूली result को दस गुना बड़ा दिखाती है। किसी से तुलना करने से पहले unit देखें।","pips = points ÷ 10",""],["Spread","ख़रीद और बिक्री के दाम का फ़र्क़। यह आप trade खोलते ही चुकाते हैं।","Buy 1.08515, sell 1.08500 यानी 1.5 pips। 0.01 lot पर $0.15 प्रति trade।","हर trade spread जितना पीछे से शुरू होती है, चाहे फ़ायदा हो या नुक़सान। छोटे account पर दिन में दस trades का मतलब असली ख़र्च है।","spread cost = spread in pips × pip value","spread"],["Lot size","आप कितना trade करते हैं। यही तय करता है कि एक हरकत कितने की है — और यह हर instrument पर एक ही संख्या नहीं होती।","EUR/USD: 1.00 lot ≈ $10 प्रति pip, 0.01 ≈ $0.10। सोना (XAUUSD): 1.00 lot = 100 औंस, यानी $1 की हरकत $100।","यही वह एक नंबर है जो तय करता है कि आम हरकत खीझ है या account का अंत — और यह हर instrument पर अलग है। Sonic का अपना record सोने में है, किसी currency pair में नहीं। size तय करने से पहले असली मान देखें: MT5 में symbol का Specification खोलें (computer पर symbol पर right-click करके)।","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage यानी कितनी बड़ी position रख सकते हैं। Margin यानी आपका वह पैसा जो खुली रहने तक रुका रहता है।","0.01 lot EUR/USD की position लगभग $1,085 की है। 1:300 पर इसमें आपके क़रीब $3.60 रुकते हैं।","ज़्यादा leverage risk कम नहीं करती। वह सिर्फ़ margin खाली करती है ताकि आप और खोल सकें।","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance बंद हो चुकी trades का पैसा है। Equity वही balance है, जिसमें अब भी खुली trades का फ़ायदा जोड़ा या नुक़सान घटाया जाता है।","Balance $100, एक trade 0.01 lot पर 40 pips घाटे में (−$4) → equity $96।","Balance इतिहास है। Equity बताती है आप असल में कहाँ हैं। खुला घाटा असली घाटा है, बस लिखा नहीं गया।","equity = balance + open profit − open loss",""],["Margin call and stop out","जब equity उस margin के मुक़ाबले काफ़ी गिर जाए जो आपकी trades माँगती हैं, broker उन्हें ख़ुद बंद कर देता है।","$100 के account पर $60 का खुला घाटा हो, तो $40 equity बचती है।","Stop out पर exit आप नहीं चुनते। घाटा उसी वक़्त पक्का हो जाता है, अक्सर सबसे बुरे मोड़ पर।","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","एक तयशुदा आदेश, जो trade को आपके पहले से चुने दाम पर बंद कर देता है, ताकि घाटा और न बढ़े।","1.0850 पर buy और 1.0830 पर stop यानी 20 pips। 0.01 lot पर $2 का risk — trade खोलने से पहले ही तय।","इसके बिना घाटे का आकार इस बात से तय होता है कि आप उसे कितनी देर तक देखते रहना बर्दाश्त कर सकते हैं।","risk = stop in pips × pip value",""],["Limit and stop orders","Limit बेहतर दाम का इंतज़ार करती है। Stop तभी चलती है जब price किसी level को पार करे।","Price 1.0850। Buy Limit 1.0830 तब भरेगी जब दाम गिरे। Buy Stop 1.0870 तब जब चढ़े।","Signals इसी शॉर्टहैंड में आते हैं: Buy Limit, Buy Stop, Sell Limit, Sell Stop। चारों में से ग़लत वाला चुना, तो वह या तो कभी चलता ही नहीं, या आपकी trade ग़लत समय पर खोल देता है।"],["Risk per trade","वह पैसा — pips नहीं — जो आप एक trade पर खोना मंज़ूर करते हैं।","$100 account, 0.01 lot, 20 pips stop = $2 risk। यानी 2 प्रतिशत।","$100 के account पर सबसे छोटी size भी हर trade पर कई प्रतिशत जोखिम में डालती है। «1 प्रतिशत risk» वाली सलाह अभी फिट नहीं बैठती।","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Equity अपने सबसे ऊँचे बिंदु से कितनी गिरी, प्रतिशत में।","$100 से $60 यानी 40 प्रतिशत नीचे। वापस $100 पर आने के लिए 67 प्रतिशत चाहिए, 40 नहीं।","घाटा और भरपाई बराबर नहीं होते। छोटे-छोटे घाटों की एक लड़ी आपसे ऐसे return की माँग कर सकती है जो आपने कभी कमाया ही नहीं।","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","फ़ायदा account में छोड़ना, ताकि position size एक जैसा न रहे, बल्कि balance के साथ बढ़े।","$100 पर महीने के 5 प्रतिशत, फ़ायदा छोड़ा हुआ, साल भर में क़रीब $180 — $160 नहीं।","छोटे account पर सब्र का ईमानदार तर्क यही है — और हर ग़ैर-हक़ीक़ी plan का इंजन भी यही है।","final = start × (1 + rate)^periods",""]],"ur":[["Pip","وہ unit جس میں price حرکت کرتی ہے — زیادہ تر pairs میں اعشاریہ کے بعد چوتھا ہندسہ۔","EUR/USD پر 1.0850 سے 1.0851 تک جانا ایک pip ہے۔ 0.01 lot پر یہ $0.10 بنتا ہے۔","ہر target اور نتیجہ pips میں بتایا جاتا ہے — اور pips کی تعداد کا کوئی مطلب نہیں جب تک پیچھے کا lot size معلوم نہ ہو۔","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","Pip کا دسواں حصہ۔ کچھ platforms points میں بتاتے ہیں۔","EUR/USD پر «+500 points» یعنی 50 pips۔ 0.01 lot پر $5، $500 نہیں۔","یہی گڑبڑ ہے جو ایک معمولی نتیجے کو دس گنا بڑا دکھاتی ہے۔ کسی سے موازنہ کرنے سے پہلے unit دیکھ لیں۔","pips = points ÷ 10",""],["Spread","خریدنے اور بیچنے کی قیمت کا فرق۔ یہ آپ trade کھولتے ہی ادا کرتے ہیں۔","Buy 1.08515، sell 1.08500 یعنی 1.5 pips۔ 0.01 lot پر ہر trade پر $0.15۔","ہر trade spread جتنی پیچھے سے شروع ہوتی ہے، چلے یا نہ چلے۔ چھوٹے account پر دن میں دس trades اصل خرچ ہے۔","spread cost = spread in pips × pip value","spread"],["Lot size","آپ کتنا trade کرتے ہیں۔ یہی طے کرتا ہے کہ ایک حرکت کتنے کی ہے — اور یہ ہر instrument پر ایک ہی عدد نہیں ہوتا۔","EUR/USD: 1.00 lot ≈ $10 فی pip، 0.01 ≈ $0.10۔ سونا (XAUUSD): 1.00 lot = 100 اونس، یعنی $1 کی حرکت $100۔","یہی وہ ایک عدد ہے جو طے کرتا ہے کہ ایک عام حرکت بس تھوڑی پریشانی ہے یا account کا خاتمہ — اور یہ ہر instrument پر الگ ہے۔ Sonic کا اپنا record سونے میں ہے، کسی currency pair میں نہیں۔ size طے کرنے سے پہلے اصل value دیکھیں: MT5 میں symbol کی Specification کھولیں (computer پر symbol پر right-click کر کے)۔","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage یعنی آپ کتنی بڑی position رکھ سکتے ہیں۔ Margin آپ کا وہ پیسہ ہے جو position کھلی رہنے تک رُکا رہتا ہے۔","0.01 lot EUR/USD کی position تقریباً $1,085 کی ہے۔ 1:300 پر اس میں آپ کے تقریباً $3.60 رُکتے ہیں۔","زیادہ leverage خطرہ کم نہیں کرتی۔ وہ صرف margin خالی کرتی ہے تاکہ آپ مزید کھول سکیں۔","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance بند ہو چکی trades کا پیسہ ہے۔ Equity وہی balance ہے، جس میں ابھی کھلی trades کا نفع یا نقصان بھی شامل ہو۔","Balance $100، ایک trade 0.01 lot پر 40 pips نقصان میں (−$4)، یعنی equity $96۔","Balance گزرا ہوا حساب ہے۔ Equity بتاتی ہے آپ اصل میں کہاں کھڑے ہیں۔ کھلا نقصان اصلی نقصان ہے، بس ابھی لکھا نہیں گیا۔","equity = balance + open profit − open loss",""],["Margin call and stop out","جب equity اُس margin کے مقابلے کافی گر جائے جو آپ کی trades مانگتی ہیں، broker اُنہیں خود بند کر دیتا ہے۔","$100 کے account پر $60 کا کھلا نقصان ہو تو $40 equity بچتی ہے۔","Stop out پر نکلنے کا وقت آپ نہیں چنتے۔ نقصان اُسی لمحے پکا ہو جاتا ہے، اکثر بدترین موڑ پر۔","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","پہلے سے لگایا ہوا order کہ trade آپ کی چُنی ہوئی قیمت پر بند ہو جائے، تاکہ نقصان بڑھنا رُک جائے۔","1.0850 پر buy اور 1.0830 پر stop یعنی 20 pips۔ 0.01 lot پر $2 خطرے میں — داخل ہونے سے پہلے طے۔","اس کے بغیر نقصان کا حجم اس بات سے طے ہوتا ہے کہ آپ اُسے کتنی دیر دیکھ سکتے ہیں۔","risk = stop in pips × pip value",""],["Limit and stop orders","Limit بہتر قیمت کا انتظار کرتی ہے۔ Stop تبھی چلتی ہے جب price کوئی level پار کرے۔","Price 1.0850۔ Buy Limit 1.0830 تب چلے گی جب قیمت گرے۔ Buy Stop 1.0870 تب چلے گی جب قیمت چڑھے۔","Signals اسی مختصر شکل میں آتے ہیں: Buy Limit، Buy Stop، Sell Limit، Sell Stop۔ چار میں سے غلط والا چُنا تو یا تو وہ کبھی چلتا نہیں، یا آپ کی trade غلط وقت پر کھول دیتا ہے۔"],["Risk per trade","وہ رقم — pips نہیں — جو آپ ایک trade پر کھونا قبول کرتے ہیں۔","$100 account، 0.01 lot، 20 pips stop = $2 خطرہ۔ یعنی 2 فیصد۔","$100 کے account پر سب سے چھوٹی size بھی ہر trade پر کئی فیصد خطرے میں ڈالتی ہے۔ «1 فیصد خطرہ» والا مشورہ ابھی ٹھیک نہیں بیٹھتا۔","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Equity اپنی بلند ترین سطح سے کتنی گری، فیصد میں۔","$100 سے $60 یعنی 40 فیصد نیچے۔ واپس $100 پر آنے کے لیے 67 فیصد چاہیے، 40 نہیں۔","نقصان اور بھرپائی برابر نہیں ہوتے۔ لگاتار چھوٹے نقصانات کے بعد آپ کو اِتنے return کی ضرورت پڑ سکتی ہے جتنا آپ نے کبھی کمایا ہی نہیں۔","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","نفع account میں چھوڑنا، تاکہ position size balance کے ساتھ بڑھے، ایک جگہ کھڑی نہ رہے۔","$100 پر مہینے کے 5 فیصد، نفع چھوڑا ہوا، سال بھر میں تقریباً $180 — $160 نہیں۔","چھوٹے account پر صبر کی ایماندار دلیل یہی ہے — اور آپ کو جو بھی غیر حقیقی plan دکھایا جائے گا، اُسے بھی یہی چلاتا ہے۔","final = start × (1 + rate)^periods",""]],"ar":[["Pip","الوحدة التي يتحرّك بها السعر — الخانة العشرية الرابعة في معظم الأزواج.","على EUR/USD، 1.0850 ← 1.0851 تساوي pip واحدة. وعند 0.01 lot تساوي $0.10.","كل هدف ونتيجة تسمعها تُذكر بالـ pips — وعدد الـ pips لا يعني شيئاً حتى تعرف الـ lot size خلفه.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","عُشر الـ pip. وبعض المنصّات تعرض الـ points بدلاً منها.","«+500 points» على EUR/USD تعني 50 pips. وعند 0.01 lot فهي $5، لا $500.","هذا هو الخلط الذي يجعل نتيجة متواضعة تبدو أكبر عشر مرات. تحقّق من الوحدة قبل أن تقارن أرقامك بأرقام أي شخص آخر.","pips = points ÷ 10",""],["Spread","الفارق بين سعر الشراء وسعر البيع. تدفعه لحظة الدخول.","شراء 1.08515 وبيع 1.08500 يساوي 1.5 pip. وعند 0.01 lot فذلك $0.15 لكل صفقة.","كل صفقة تبدأ متأخرة بمقدار الـ spread، ربحت أم خسرت. وعشر صفقات يومياً على حساب صغير تكلفة حقيقية.","spread cost = spread in pips × pip value","spread"],["Lot size","حجم ما تتداوله. وهو يحدّد قيمة الحركة الواحدة — وليس الرقم نفسه على كل أداة.","EUR/USD: ‏1.00 lot ≈ $10 لكل pip، و0.01 ≈ $0.10. والذهب (XAUUSD): ‏1.00 lot = 100 أونصة، فحركة بـ $1 تساوي $100.","هو الرقم الوحيد الذي يقرّر إن كانت حركة عادية مجرّد إزعاج أم نهاية الحساب — وهو يختلف بين أداة وأخرى. وسجل Sonic نفسه على الذهب، لا على زوج عملات. فقبل أن تحدّد الحجم، تحقّق من القيمة الحقيقية: في MT5 افتح Specification الخاصة بالرمز (على الكمبيوتر: اضغط بالزر الأيمن على الرمز).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","الـ leverage هو حجم الصفقة المسموح لك بفتحها. والـ margin هو الجزء المحجوز من مالك ما دامت مفتوحة.","صفقة 0.01 lot على EUR/USD تساوي نحو $1,085. وعند 1:300 يُحجز لها نحو $3.60 من مالك.","الـ leverage الأعلى لا يقلّل الخطر. كل ما يفعله أنه يحرّر جزءاً من الـ margin، فيُسمح لك بفتح المزيد.","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","الـ balance مال الصفقات المغلقة. والـ equity هو ذلك، زائداً أو ناقصاً كل ما زال مفتوحاً.","Balance ‏$100، وصفقة واحدة خاسرة 40 pip عند 0.01 lot (−$4) ← equity ‏$96.","الـ balance هو الماضي. والـ equity هو موقعك الفعلي الآن. والخسارة العائمة خسارة حقيقية لم تُقيَّد بعد.","equity = balance + open profit − open loss",""],["Margin call and stop out","حين يهبط الـ equity بما يكفي مقارنةً بالـ margin الذي تتطلّبه صفقاتك، يغلقها الـ broker نيابةً عنك.","حساب بـ $100 يحمل خسارة عائمة $60 يتبقّى له $40 من الـ equity.","عند الـ stop out لا تختار أنت لحظة الخروج. تُثبَّت الخسارة حينها، وغالباً عند أسوأ نقطة.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","أمر قائم بالإغلاق عند سعر اخترته مسبقاً، فتتوقّف الخسارة عن النمو.","شراء عند 1.0850 مع stop عند 1.0830 يساوي 20 pip. وعند 0.01 lot فذلك $2 تخاطر بها — قرّرتها قبل الدخول.","من دونه يتحدّد حجم خسارتك بمقدار ما تحتمل النظر إليها.","risk = stop in pips × pip value",""],["Limit and stop orders","الـ limit ينتظر سعراً أفضل. والـ stop لا يُنفَّذ إلا بعد أن يخترق السعر مستوى معيّناً.","السعر 1.0850. Buy Limit عند 1.0830 يُنفَّذ إن هبط السعر. وBuy Stop عند 1.0870 يُنفَّذ إن صعد.","الإشارات تُنشر بهذا الاختصار: Buy Limit وBuy Stop وSell Limit وSell Stop. واختيار النوع الخاطئ من بين الأربعة يعني إمّا ألّا يُنفَّذ الأمر أبداً، وإمّا أن تُفتح صفقتك في اللحظة الخاطئة."],["Risk per trade","المبلغ — لا الـ pips — الذي تقبل خسارته في صفقة واحدة.","حساب $100، و0.01 lot، وstop بـ 20 pip = $2 تخاطر بها. أي 2 بالمئة.","على حساب بـ $100 فإن أصغر حجم قابل للتداول يخاطر أصلاً بعدّة بالمئة في الصفقة. ونصيحة «خاطر بواحد بالمئة» لا تناسب بعد.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","مقدار هبوط الـ equity عن أعلى نقطة بلغها، بالنسبة المئوية.","من $100 إلى $60 هبوط 40 بالمئة. والعودة إلى $100 تحتاج ربحاً 67 بالمئة، لا 40.","الخسارة والتعويض ليسا متناظرين. وسلسلة من الخسائر الصغيرة قد تتركك بحاجة إلى عائد لم تحقّقه يوماً.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","ترك الأرباح في الحساب، فينمو حجم الصفقة مع الرصيد بدل أن يبقى ثابتاً.","‏$100 بنسبة 5 بالمئة شهرياً مع ترك الربح تصير نحو $180 بعد سنة، لا $160.","هي الحجّة الصادقة للصبر على حساب صغير — وهي أيضاً محرّك كل خطة غير واقعية ستُعرض عليك.","final = start × (1 + rate)^periods",""]],"ar_rm":[["Pip","Al-wahda allati yataharrak biha al-si3r — al-khana al-3ushriya al-rabi3a fi mu3zam al-azwaj.","3ala EUR/USD, 1.0850 → 1.0851 tusawi pip wahida. W 3ind 0.01 lot tusawi $0.10.","Kull hadaf w natija tasma3uha tudhkar bil-pips — w 3adad al-pips la ya3ni shay'an hatta ta3rif al-lot size khalfah.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","3ushr al-pip. W ba3d al-minassat ta3rid al-points badalan minha.","«+500 points» 3ala EUR/USD ta3ni 50 pips. W 3ind 0.01 lot fahiya $5, la $500.","Hadha huwa al-khalt alladhi yaj3al natija mutawadi3a tabdu akbar 3ashr marrat. Tahaqqaq min al-wahda qabl an tuqarin arqamak bi-arqam ayy shakhs akhar.","pips = points ÷ 10",""],["Spread","Al-fariq bayn si3r al-shira' w si3r al-bay3. Tadfa3uh lahzat al-dukhul.","Shira' 1.08515 w bay3 1.08500 yusawi 1.5 pip. W 3ind 0.01 lot fadhalik $0.15 li-kull safqa.","Kull safqa tabda' muta'akhkhira bi-miqdar al-spread, rabihat am khasirat. W 3ashr safaqat yawmiyan 3ala hisab saghir taklifa haqiqiya.","spread cost = spread in pips × pip value","spread"],["Lot size","Hajm ma tatadawaluh. W huwa yuhaddid qimat al-haraka al-wahida — w laysa al-raqm nafsuh 3ala kull adah.","EUR/USD: 1.00 lot ≈ $10 li-kull pip, w 0.01 ≈ $0.10. W al-dhahab (XAUUSD): 1.00 lot = 100 unsa, faharaka bi $1 tusawi $100.","Huwa al-raqm al-wahid alladhi yuqarrir in kanat haraka 3adiya mujarrad iz3aj am nihayat al-hisab — w huwa yakhtalif bayn adah w ukhra. W sijill Sonic nafsuh 3ala al-dhahab, la 3ala zawj 3umlat. Faqabl an tuhaddid al-hajm, tahaqqaq min al-qima al-haqiqiya: fi MT5 iftah Specification al-khassa bil-ramz (3ala al-kumbyutar: idghat bil-zirr al-ayman 3ala al-ramz).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Al-leverage huwa hajm al-safqa al-masmuh lak bi-fathiha. W al-margin huwa al-juz' al-mahjuz min malak ma damat maftuha.","Safqat 0.01 lot 3ala EUR/USD tusawi nahwa $1,085. W 3ind 1:300 yuhjaz laha nahwa $3.60 min
