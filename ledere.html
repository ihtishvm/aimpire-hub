"لوگ عام طور پر جو پوچھتے ہیں، اُن کے مختصر جواب۔"]]},"ar_rm":{"lede":"Ikhtar al-juz' alladhi tahtajuh al-an — w al-baqi yabqa huna.","back":"Kull al-aqsam","items":[["start","Ibda' al-i3dad","3ashr khutuwat min al-rabit ila hisab ya3mal."],["tools","Adawat","Al-nata'ij, w ruznamat al-akhbar, w al-dardasha — w al-tatbiqat."],["earn","Sonic, w ma taksibuh","Kayf ya3mal al-copy trading, w namudhaj al-mukafa'at."],["learn","Ta3allam al-asas","Al-pip w al-lot w al-spread — ma3 al-mu3adalat."],["faq","As'ila w ajwiba","Ajwiba qasira 3amma yas'al 3anh al-nas 3adatan."]]},"ur_rm":{"lede":"Abhi jis hisse ki zaroorat hai, wohi chunein — baqi yahin rahega.","back":"Saare hisse","items":[["start","Shuru karein","Link se chalte account tak, das steps."],["tools","Tools","Nataij, news calendar, chat — aur apps."],["earn","Sonic, aur aap ki kamaai","Copy trading kaise kaam karti hai, aur bonus model."],["learn","Bunyaad seekhein","Pip, lot aur spread — formulas ke saath."],["faq","Sawal aur jawab","Log aam taur par jo poochte hain, un ke mukhtasar jawab."]]}},"apps_page":{"list":[{"key":"mt5","name":"MetaTrader 5","android":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5","ios":"https://apps.apple.com/app/metatrader-5/id413251709","icon":"assets/app-mt5.jpg"},{"key":"element","name":"Element X","android":"https://play.google.com/store/apps/details?id=io.element.android.x","ios":"https://apps.apple.com/app/element-x/id1631335820","join":"https://matrix.to/#/%23aimpire:matrix.org","icon":"assets/app-element.jpg"}],"en":{"lede":"Two apps, both free. You can install them now — the guide tells you when you need each one.","mt5":"Shows your account and every trade Sonic opens for you. You log in with the details from step 9.","element":"The chat app the Aimpire group uses. Install it before you press the join link in step 10 — the link opens inside the app.","browser":"Tag Markets, CopyX and the IB Portal run in your browser. There is no app to install for them.","warn":"Install only from Google Play or the App Store, through these links. If anyone sends you an app file or a «Tag Markets app», do not install it — fake apps are a common way people lose their login and their money.","join_note":"Installed it? Then join:","join":"Join the Aimpire group"},"no":{"lede":"To apper, begge gratis. Du kan installere dem nå — guiden sier når hver av dem trengs.","mt5":"Viser kontoen din og hver handel Sonic åpner for deg. Du logger inn med opplysningene fra steg 9.","element":"Chat-appen Aimpire-gruppa bruker. Installer den før du trykker på invitasjonslenken i steg 10 — lenken åpnes inne i appen.","browser":"Tag Markets, CopyX og IB-portalen kjører i nettleseren. Det finnes ingen app å installere for dem.","warn":"Installer bare fra Google Play eller App Store, via disse lenkene. Sender noen deg en appfil eller en «Tag Markets-app», ikke installer den — falske apper er en vanlig måte folk mister innlogging og penger på.","join_note":"Installert? Da kan du bli med:","join":"Bli med i Aimpire-gruppa"},"hi":{"lede":"दो apps, दोनों मुफ़्त। आप इन्हें अभी install कर सकते हैं — guide बताएगी कि कौन-सा कब काम आता है।","mt5":"आपका account और Sonic की खोली हर trade दिखाता है। Step 9 की details से login करें।","element":"वह chat app जिसे Aimpire group इस्तेमाल करता है। Step 10 का join link दबाने से पहले इसे install कर लें — link app के अंदर ही खुलता है।","browser":"Tag Markets, CopyX और IB Portal आपके browser में चलते हैं। इनके लिए कोई app install करने की ज़रूरत नहीं।","warn":"सिर्फ़ Google Play या App Store से, इन्हीं links से install करें। कोई आपको app की file या «Tag Markets app» भेजे तो install न करें — नक़ली apps से लोग अक्सर अपना login और पैसा गँवाते हैं।","join_note":"Install हो गया? तो अब join करें:","join":"Aimpire ग्रुप में शामिल हों"},"ar":{"lede":"تطبيقان، وكلاهما مجاني. يمكنك تثبيتهما الآن — والدليل يخبرك متى يأتي دور كلٍّ منهما.","mt5":"يعرض حسابك وكل صفقة يفتحها Sonic لك. تسجّل الدخول ببيانات الخطوة 9.","element":"تطبيق الدردشة الذي تستخدمه مجموعة Aimpire. ثبّته قبل أن تضغط رابط الانضمام في الخطوة 10 — فالرابط يُفتح داخل التطبيق.","browser":"Tag Markets وCopyX والـ IB Portal تعمل في المتصفح، ولا تحتاج إلى تثبيت أي تطبيق لها.","warn":"لا تثبّت إلا من Google Play أو App Store، وعبر هذه الروابط. وإن أرسل لك أحدهم ملف تطبيق أو «تطبيق Tag Markets» فلا تثبّته — التطبيقات المزيّفة طريقة شائعة لفقدان بيانات الدخول والمال.","join_note":"ثبّتَّه؟ انضمّ الآن:","join":"انضم إلى مجموعة Aimpire"},"ur":{"lede":"دو apps، دونوں مفت۔ آپ اِنہیں ابھی install کر سکتے ہیں — guide بتائے گی کہ کون سی کب کام آتی ہے۔","mt5":"آپ کا account اور Sonic کی کھولی ہر trade دکھاتا ہے۔ Step 9 کی details سے login کریں۔","element":"وہ chat app جو Aimpire group استعمال کرتا ہے۔ Step 10 کا join link دبانے سے پہلے اِسے install کر لیں — link app کے اندر ہی کھلتا ہے۔","browser":"Tag Markets، CopyX اور IB Portal آپ کے browser میں چلتے ہیں۔ اِن کے لیے کوئی app install نہیں کرنی۔","warn":"صرف Google Play یا App Store سے، اِنہی links سے install کریں۔ کوئی آپ کو app کی file یا «Tag Markets app» بھیجے تو install نہ کریں — نقلی apps سے لوگ اکثر اپنا login اور پیسہ گنواتے ہیں۔","join_note":"Install ہو گئی؟ تو اب join کریں:","join":"Aimpire گروپ میں شامل ہوں"},"ar_rm":{"lede":"Tatbiqan, w kilahuma majjani. Yumkinuk tathbituhuma al-an — w al-dalil yukhbirak mata ya'ti dawr kull minhuma.","mt5":"Ya3rid hisabak w kull safqa yaftahuha Sonic lak. Tusajjil al-dukhul bi-bayanat al-khutwa 9.","element":"Tatbiq al-dardasha alladhi tastakhdimuh majmu3at Aimpire. Thabbituh qabl an tadghat rabit al-indimam fil-khutwa 10 — fal-rabit yuftah dakhil al-tatbiq.","browser":"Tag Markets w CopyX w al-IB Portal ta3mal fil-mutasaffih, w la tahtaj ila tathbit ayy tatbiq laha.","warn":"La tuthabbit illa min Google Play aw App Store, w 3abr hadhihi al-rawabit. W in arsal lak ahaduhum milaff tatbiq aw «Tatbiq Tag Markets» fala tuthabbituh — al-tatbiqat al-muzayyafa tariqa sha'i3a li-fuqdan bayanat al-dukhul w al-mal.","join_note":"Thabbattah? Indamm al-an:","join":"Indamm ila majmu3at Aimpire"},"ur_rm":{"lede":"Do apps, dono muft. Aap inhein abhi install kar sakte hain — guide batayegi keh kaun si kab kaam aati hai.","mt5":"Aap ka account aur Sonic ki kholi har trade dikhata hai. Step 9 ki details se login karein.","element":"Woh chat app jo Aimpire group istemal karta hai. Step 10 ka join link dabane se pehle ise install kar lein — link app ke andar hi khulta hai.","browser":"Tag Markets, CopyX aur IB Portal aap ke browser mein chalte hain. Inke liye koi app install nahi karni.","warn":"Sirf Google Play ya App Store se, inhi links se install karein. Koi aap ko app ki file ya «Tag Markets app» bheje to install na karein — naqli apps se log aksar apna login aur paisa ganwaate hain.","join_note":"Install ho gayi? To ab join karein:","join":"Aimpire group mein shamil hon"}},"faq":{"en":{"lede":"Short answers to what people usually ask. Answers about rules come from the broker's or the platform's own words, which the other sections show in full.","search":"Search the questions","none":"No question matches that. Ask in the Aimpire group — someone has usually wondered the same.","items":[["Is this a scam?","It is a fair question, and you should ask it about anything involving money. Here is what we know, the good and the bad.\n\nWhat you can check yourself: your money sits with the broker, never with Aimpire or your sponsor; profit can be withdrawn whenever you ask; and the rules on this page are quoted from the broker's and the platform's own pages.\n\nWhat you should also know: financial regulators in the Netherlands (AFM), Austria (FMA) and Québec (AMF) have published warnings about Tag Markets, and Norway's Finanstilsynet lists the Dutch one. The licence number on the broker's regulation page, GB21026474, was issued to Pure North Markets Ltd, and the Financial Services Commission of Mauritius announced in March 2024 that it had been terminated. You can look all of this up on the regulators' own websites.\n\nSo put in only what you can afford to lose completely. Nobody can promise you that the strategy keeps making money."],["Who holds my money?","The broker, Tag Markets — not Aimpire and not your sponsor. Never send money to a person, and only deposit from inside your own portal."],["How much do I need to start?","The minimum is $10, both for the deposit and for connecting Sonic. Start with an amount you could lose completely, and watch it for a few weeks before you decide on more."],["Is this allowed in my country?","Rules differ between countries and change, so check your own before you deposit — we cannot give legal advice. Two separate things matter.\n\nThe broker's list: it publishes a list of countries it does not serve. Pakistan is not on that list. The United Arab Emirates is on it, so the broker does not serve people living there. Its website also says it is not intended for residents of the European Union.\n\nYour own country's rules: these are about you, not the broker. In Pakistan, the State Bank's EPD Circular Letter No. 08 of 2022 says sending money abroad to offshore forex, margin or CFD platforms is not permitted. The broker's list says nothing about that."],["Which apps do I need?","Two, both free: MetaTrader 5 to see your account, and Element X for the Aimpire group. Install them from the official stores only. Tag Markets, CopyX and the IB Portal run in your browser."],["How long does approval take?","The broker says verification «just takes a few minutes», with delays when demand is high or documents are incomplete. You need an ID document and a face scan. If it is rejected, the reason comes by email from SumSub. Use any waiting time for step 6, the apps."],["What does 24× mean for me?","With the Aimpire token your money trades 24 times larger: in our own test, $109 became a trading balance of $2,616. Gains and losses are both 24 times larger. A fall of 4.2 % in that balance is your whole deposit, and the account closes at 5 %."],["What does it cost?","The Sonic strategy takes a 30 % performance fee on profit, so you keep about 70 % of the profit — the Amplify section explains why it can be less. There is no management fee and no joining fee. On Amplify accounts the broker also charges $10 per lot in commission on forex and metals. Then there are the costs any trade has: the spread, swap on positions held overnight, and network fees when you deposit or withdraw crypto."],["Can I withdraw my money?","Profits: yes, you can withdraw them at any time, any day. Your deposit: only 30 days after your first trade, and taking it out closes the account immediately. An upgrade starts those 30 days again. The broker says payouts take 1–3 working days. The steps are under «Sonic, and what you earn» → «Taking money out»."],["Is there a daily loss limit?","No daily limit. There is one total limit: 10 % of the starting balance, or 5 % with the Aimpire token. Reach it and the account is closed automatically."],["Is the profit guaranteed?","No. Nothing here is guaranteed. Published results — Myfxbook included — are past results before the 30 % fee, not a forecast."],["How do I know the token worked?","Look at the balance in MetaTrader 5: with the token it is 24 times what you put in. If it is not, stop and ask your sponsor before you do anything else."],["Someone says I need eCredits, or must send crypto, to get 24×.","Not through Aimpire. Our token is #Aitech with the code 000000, and you send nothing for it. The platform also has an «#eCredits» route: there you send as many eCredits as you invest to a wallet address, so $100 means 100 eCredits on top of your deposit.\n\nIf anyone asks you to send money or crypto anywhere other than your own deposit page, stop and ask your sponsor."],["Can I have more than one account?","Yes. The broker says you may hold as many as you want, as long as each one follows the rules."],["My deposit has not arrived.","Check the transaction in your own wallet first — the portal cannot show money that never reached it. «Pending» is normal for up to 24 hours. After that, send your sponsor the transaction ID, never a screenshot of your login."],["I chose the wrong network.","Unfortunately the wrong network does not delay the money, it loses it. Contact your wallet's own support with the transaction ID straight away. Nobody in Aimpire can reverse a crypto transfer."],["Someone says they are support and asks for my password.","Do not give it — not to support, not to a leader, not to anyone. Aimpire will never ask for it. If someone needs to see your results, give them the Investor Password: it can only look, not trade."],["I forgot my password.","The broker has its own guide for changing it, under «Get set up» → «Guides that already exist». Never ask anyone in a chat to reset it for you."],["Do I have to invite other people?","No. You can open an account, let Sonic run and never introduce anyone. Earning as an introducing broker is optional, and nothing on the platform requires it."],["Where do I get help?","First this page. Then your sponsor — the person who invited you — for anything about your account. If money does not arrive or something seems wrong, your sponsor takes it further. And ask in the Aimpire group: someone has usually had the same question."]]},"no":{"lede":"Korte svar på det folk som regel lurer på. Svar om regler bygger på meglerens eller plattformens egne ord, som de andre delene viser i sin helhet.","search":"Søk i spørsmålene","none":"Ingen spørsmål passer. Spør i Aimpire-gruppa — noen har som regel lurt på det samme.","items":[["Er dette svindel?","Det er et rimelig spørsmål, og du bør stille det om alt som har med penger å gjøre. Her er det vi vet, både det gode og det dårlige.\n\nDette kan du sjekke selv: pengene dine står hos megleren, aldri hos Aimpire eller sponsoren din; profitt kan tas ut når du ber om det; og reglene på denne siden er sitert fra meglerens og plattformens egne sider.\n\nDette bør du også vite: finanstilsynene i Nederland (AFM), Østerrike (FMA) og Québec (AMF) har publisert advarsler om Tag Markets, og Finanstilsynet i Norge har den nederlandske advarselen på listen sin. Lisensnummeret på meglerens side om regulering, GB21026474, ble utstedt til Pure North Markets Ltd, og Financial Services Commission of Mauritius kunngjorde i mars 2024 at lisensen var avsluttet. Du kan sjekke alt dette på tilsynenes egne nettsider.\n\nSå sett bare inn det du har råd til å tape helt. Ingen kan love deg at strategien fortsetter å tjene penger."],["Hvem holder pengene mine?","Megleren, Tag Markets — ikke Aimpire og ikke sponsoren din. Send aldri penger til en person, og sett bare inn fra din egen portal."],["Hvor mye trenger jeg for å starte?","Minstebeløpet er $10, både for innskuddet og for å koble til Sonic. Begynn med et beløp du kan tape helt, og følg med på det i noen uker før du bestemmer deg for mer."],["Er dette lov i mitt land?","Reglene er ulike fra land til land og endrer seg, så sjekk reglene i ditt eget land før du setter inn — vi kan ikke gi juridiske råd. To ulike ting har betydning.\n\nMeglerens liste: megleren publiserer en liste over land den ikke betjener. Pakistan står ikke på den listen. De forente arabiske emirater står på den, så megleren betjener ikke folk som bor der. Meglerens nettside sier også at tjenesten ikke er ment for personer bosatt i EU.\n\nReglene i ditt eget land: de handler om deg, ikke om megleren. I Pakistan sier State Bank i EPD Circular Letter No. 08 of 2022 at det ikke er tillatt å sende penger til utlandet til offshore-plattformer for forex, margin eller CFD. Meglerens liste sier ingenting om det."],["Hvilke apper trenger jeg?","To, begge gratis: MetaTrader 5 for å se kontoen din, og Element X for Aimpire-gruppa. Installer dem bare fra de offisielle butikkene. Tag Markets, CopyX og IB-portalen kjører i nettleseren."],["Hvor lang tid tar godkjenningen?","Megleren sier at verifiseringen «just takes a few minutes» (tar bare noen minutter), med forsinkelser når pågangen er stor eller dokumentene er ufullstendige. Du trenger et ID-dokument og en ansiktsskanning. Blir den avvist, kommer grunnen på e-post fra SumSub. Bruk eventuell ventetid på steg 6, appene."],["Hva betyr 24× for meg?","Med Aimpire-tokenet handler du med 24 ganger så mye som du setter inn: i vår egen test ble $109 til en handelssaldo på $2 616. Både gevinst og tap blir 24 ganger så store. Et fall på 4,2 % i den saldoen er hele innskuddet ditt, og kontoen stenges ved 5 %."],["Hva koster det?","Sonic-strategien tar et resultathonorar på 30 % av profitten, så du beholder rundt 70 % av profitten — Amplify-delen forklarer hvorfor det kan bli mindre. Det er ingen forvaltningsavgift og ingen innmeldingsavgift. På Amplify-kontoer tar megleren i tillegg $10 per lot i kurtasje på forex og metaller. Dessuten kommer kostnadene enhver handel har: spread, swap på posisjoner som holdes over natten, og nettverksgebyrer når du setter inn eller tar ut krypto."],["Kan jeg ta ut pengene mine?","Uttak av profitt: ja, når som helst, hvilken som helst dag. Innskuddet: først 30 dager etter første handel, og uttak av det stenger kontoen umiddelbart. En oppgradering starter de 30 dagene på nytt. Megleren oppgir at utbetalinger tar 1–3 virkedager. Stegene står under «Sonic, og hva du tjener» → «Slik tar du ut penger»."],["Finnes det en daglig tapsgrense?","Ingen daglig grense. Det er én samlet grense: 10 % av startsaldoen, eller 5 % med Aimpire-tokenet. Nås den, stenges kontoen automatisk."],["Er profitten garantert?","Nei. Ingenting her er garantert. Publiserte resultater — Myfxbook inkludert — er tidligere resultater før honoraret på 30 %, ikke en prognose."],["Hvordan vet jeg at tokenet virket?","Se på saldoen i MetaTrader 5: med tokenet er den 24 ganger det du satte inn. Er den ikke det, stopp og spør sponsoren din før du gjør noe annet."],["Noen sier at jeg trenger eCredits, eller må sende krypto, for å få 24×.","Ikke gjennom Aimpire. Tokenet vårt er #Aitech med koden 000000, og du sender ingenting for det. Plattformen har også en vei via «#eCredits»: der sender du like mange eCredits som du investerer, til en wallet-adresse, så $100 betyr 100 eCredits i tillegg til innskuddet ditt.\n\nBer noen deg sende penger eller krypto noe annet sted enn til din egen innskuddsside, så stopp og spør sponsoren din."],["Kan jeg ha mer enn én konto?","Ja. Megleren sier du kan ha så mange du vil, så lenge hver av dem følger reglene."],["Innskuddet mitt har ikke kommet.","Sjekk transaksjonen i din egen lommebok først — portalen kan ikke vise penger som aldri kom fram. «Pending» er normalt i opptil 24 timer. Etter det sender du sponsoren din transaksjons-ID-en, aldri et skjermbilde av innloggingen din."],["Jeg valgte feil nettverk.","Dessverre fører feil nettverk ikke til at pengene blir forsinket — de går tapt. Kontakt lommebokas egen support med transaksjons-ID-en med en gang. Ingen i Aimpire kan reversere en kryptooverføring."],["Noen sier de er support og ber om passordet mitt.","Ikke gi det — ikke til support, ikke til en leder, ikke til noen. Aimpire ber aldri om det. Trenger noen å se resultatene dine, gir du dem Investor Password: det kan bare se, ikke handle."],["Jeg har glemt passordet.","Megleren har sin egen guide for å bytte det, under «Kom i gang» → «Guider som allerede finnes». Be aldri noen i en chat om å nullstille det for deg."],["Må jeg invitere andre?","Nei. Du kan åpne en konto, la Sonic gå og aldri introdusere noen. Å tjene som introducing broker er valgfritt, og ingenting på plattformen krever det."],["Hvor får jeg hjelp?","Først denne siden. Så sponsoren din — personen som inviterte deg — for alt som gjelder kontoen din. Kommer ikke pengene fram, eller virker noe feil, tar sponsoren det videre. Og spør i Aimpire-gruppa: noen har som regel hatt det samme spørsmålet."]]},"hi":{"lede":"लोग आमतौर पर जो पूछते हैं, उनके छोटे जवाब। नियमों से जुड़े जवाब broker या platform के अपने शब्दों से हैं, जो बाक़ी हिस्सों में पूरे दिखाए गए हैं।","search":"सवालों में खोजें","none":"इससे मेल खाता कोई सवाल नहीं मिला। Aimpire group में पूछें — अक्सर किसी और ने भी यही सोचा होता है।","items":[["क्या यह धोखा है?","सवाल वाजिब है, और पैसे से जुड़ी हर चीज़ के बारे में पूछना चाहिए। हम जो जानते हैं, वह यहाँ है — अच्छा भी और बुरा भी।\n\nजो आप ख़ुद जाँच सकते हैं: आपका पैसा broker के पास रहता है, कभी Aimpire या आपके sponsor के पास नहीं; profit जब आप माँगें तब निकाला जा सकता है; और इस page के नियम broker और platform के अपने pages से शब्दशः लिए गए हैं।\n\nयह भी जानना ज़रूरी है: नीदरलैंड (AFM), ऑस्ट्रिया (FMA) और क्यूबेक (AMF) के वित्तीय नियामकों ने Tag Markets के बारे में चेतावनियाँ प्रकाशित की हैं, और नॉर्वे का Finanstilsynet नीदरलैंड वाली चेतावनी को अपनी सूची में दिखाता है। Broker के regulation page पर दिया गया लाइसेंस नंबर, GB21026474, Pure North Markets Ltd को जारी किया गया था, और Financial Services Commission of Mauritius ने मार्च 2024 में घोषणा की कि वह लाइसेंस समाप्त कर दिया गया था। यह सब आप नियामकों की अपनी websites पर देख सकते हैं।\n\nइसलिए सिर्फ़ उतना ही डालें जितना पूरा खोना आप सह सकें। कोई यह वादा नहीं कर सकता कि strategy कमाती रहेगी।"],["मेरा पैसा किसके पास रहता है?","Broker, Tag Markets के पास — न Aimpire के पास, न आपके sponsor के। किसी व्यक्ति को कभी पैसा न भेजें, और सिर्फ़ अपने portal के अंदर से जमा करें।"],["शुरू करने के लिए कितना चाहिए?","कम से कम $10, जमा के लिए भी और Sonic से जुड़ने के लिए भी। उतनी रक़म से शुरू करें जिसे पूरा खोना आप सह सकें, और ज़्यादा का फ़ैसला करने से पहले कुछ हफ़्ते देखें।"],["क्या मेरे देश में इसकी इजाज़त है?","हर देश के नियम अलग हैं और बदलते रहते हैं, इसलिए जमा करने से पहले अपने देश के नियम जाँचें — हम क़ानूनी सलाह नहीं दे सकते। दो अलग बातें मायने रखती हैं।\n\nBroker की सूची: broker उन देशों की सूची जारी करता है जिन्हें वह सेवा नहीं देता। पाकिस्तान उस सूची में नहीं है। संयुक्त अरब अमीरात उसमें है, इसलिए broker वहाँ रहने वाले लोगों को सेवा नहीं देता। उसकी website यह भी कहती है कि वह यूरोपीय संघ के निवासियों के लिए नहीं है।\n\nआपके अपने देश के नियम: ये आपके बारे में हैं, broker के बारे में नहीं। पाकिस्तान में State Bank का EPD Circular Letter No. 08 of 2022 कहता है कि offshore forex, margin या CFD platforms को विदेश पैसा भेजने की अनुमति नहीं है। Broker की सूची इस बारे में कुछ नहीं कहती।"],["मुझे कौन-से apps चाहिए?","दो, दोनों मुफ़्त: अपना account देखने के लिए MetaTrader 5, और Aimpire group के लिए Element X। सिर्फ़ official stores से install करें। Tag Markets, CopyX और IB Portal browser में चलते हैं।"],["Approval में कितना समय लगता है?","Broker के मुताबिक़ verification «just takes a few minutes» (बस कुछ मिनट लेता है), लेकिन ज़्यादा भीड़ होने पर या documents अधूरे हों, तो देर हो सकती है। आपको एक ID document और face scan चाहिए। Reject हो जाए तो उसकी वजह SumSub की email में आती है। इंतज़ार का समय step 6, यानी apps के लिए इस्तेमाल करें।"],["मेरे लिए 24× का क्या मतलब है?","Aimpire token के साथ आपका पैसा 24 गुना बड़ा trade करता है: हमारे अपने test में $109 से $2,616 का trading balance बना। फ़ायदा और नुक़सान दोनों 24 गुना बड़े। उस balance में 4.2 % की गिरावट आपकी पूरी जमा रक़म है, और account 5 % पर बंद हो जाता है।"],["इसकी क़ीमत क्या है?","Sonic strategy profit पर 30 % performance fee लेती है, यानी profit का क़रीब 70 % आपका — यह कम क्यों हो सकता है, यह Amplify वाले हिस्से में समझाया गया है। कोई management fee नहीं और कोई joining fee नहीं। Amplify accounts पर broker इसके अलावा forex और metals पर $10 प्रति lot commission लेता है। फिर वे लागतें हैं जो हर trade में होती हैं: spread, रात भर खुली रखी positions पर swap, और crypto जमा करने या निकालने पर network fees।"],["क्या मैं अपना पैसा निकाल सकता हूँ?","Profit: हाँ, कभी भी, किसी भी दिन। आपकी जमा रक़म: पहली trade के 30 दिन बाद ही, और उसे निकालते ही account तुरंत बंद हो जाता है। Upgrade करने से वे 30 दिन फिर से शुरू होते हैं। Broker के मुताबिक़ payout में 1–3 कामकाजी दिन लगते हैं। Steps «Sonic, और आपकी कमाई» → «पैसा कैसे निकालें» में हैं।"],["क्या रोज़ के नुक़सान की कोई सीमा है?","रोज़ की कोई सीमा नहीं। एक कुल सीमा है: starting balance का 10 %, या Aimpire token के साथ 5 %। वहाँ पहुँचते ही account अपने-आप बंद हो जाता है।"],["क्या profit की गारंटी है?","नहीं। यहाँ किसी चीज़ की गारंटी नहीं। प्रकाशित नतीजे — Myfxbook भी — 30 % fee से पहले के पिछले नतीजे हैं, कोई भविष्यवाणी नहीं।"],["मुझे कैसे पता चलेगा कि token ने काम किया?","MetaTrader 5 में balance देखें: token के साथ वह आपकी डाली रक़म का 24 गुना होता है। अगर नहीं है, तो रुकें और कुछ भी करने से पहले अपने sponsor से पूछें।"],["कोई कहता है कि 24× पाने के लिए मुझे eCredits चाहिए, या crypto भेजना होगा।","Aimpire के ज़रिए नहीं। हमारा token #Aitech है, code 000000 के साथ, और इसके लिए आप कुछ नहीं भेजते। Platform पर «#eCredits» वाला एक रास्ता भी है: उसमें आप जितनी रक़म invest करते हैं, उतने ही eCredits एक wallet address पर भेजते हैं, यानी $100 का मतलब है आपकी जमा रक़म के ऊपर 100 eCredits।\n\nअगर कोई आपसे अपने deposit page के अलावा कहीं और पैसा या crypto भेजने को कहे, तो रुकें और अपने sponsor से पूछें।"],["क्या मेरे एक से ज़्यादा accounts हो सकते हैं?","हाँ। Broker कहता है कि आप जितने चाहें रख सकते हैं, बशर्ते हर account नियमों का पालन करे।"],["मेरी जमा रक़म नहीं पहुँची।","पहले अपने wallet में transaction देखें — portal वह पैसा नहीं दिखा सकता जो उस तक पहुँचा ही नहीं। 24 घंटे तक «Pending» सामान्य है। उसके बाद अपने sponsor को transaction ID भेजें, कभी अपने login का screenshot नहीं।"],["मैंने ग़लत network चुन लिया।","अफ़सोस, ग़लत network चुनने से पैसा देर से नहीं पहुँचता, बल्कि डूब जाता है। तुरंत अपने wallet के support से transaction ID के साथ संपर्क करें। Aimpire में कोई भी crypto transfer वापस नहीं कर सकता।"],["कोई ख़ुद को support बताकर मेरा password माँग रहा है।","न दें — न support को, न किसी leader को, न किसी को भी। Aimpire कभी नहीं माँगेगा। अगर किसी को आपके नतीजे देखने हों, तो उसे Investor Password दें: उससे सिर्फ़ देखा जा सकता है, trade नहीं।"],["मैं password भूल गया।","Broker के पास उसे बदलने की अपनी guide है, «शुरू करें» → «पहले से मौजूद गाइड» में। Chat में किसी से कभी reset करने को न कहें।"],["क्या मुझे दूसरों को बुलाना ज़रूरी है?","नहीं। आप account खोल सकते हैं, Sonic को चलने दे सकते हैं, और कभी किसी को जोड़े बिना रह सकते हैं। Introducing broker बनकर कमाना वैकल्पिक है, और platform पर कुछ भी इसकी माँग नहीं करता।"],["मदद कहाँ मिलेगी?","पहले यह page। फिर account से जुड़ी हर बात के लिए आपका sponsor — जिसने आपको बुलाया। अगर पैसा न पहुँचे या कुछ ग़लत लगे, तो आपका sponsor उसे आगे ले जाता है। और Aimpire group में पूछें: अक्सर किसी और का भी यही सवाल रहा होता है।"]]},"ar":{"lede":"أجوبة قصيرة عمّا يسأل عنه الناس عادةً. الأجوبة المتعلّقة بالقواعد مأخوذة من كلام الـ broker أو المنصّة نفسها، وهو كلام تعرضه الأقسام الأخرى كاملاً.","search":"ابحث في الأسئلة","none":"لا يطابق ذلك أي سؤال. اسأل في مجموعة Aimpire — غالباً سأل أحدهم الشيء نفسه.","items":[["هل هذا احتيال؟","سؤال في محلّه، وينبغي أن تطرحه عن أي شيء يتعلّق بالمال. إليك ما نعرفه، الجيد منه والسيئ.\n\nما تستطيع التحقّق منه بنفسك: مالك عند الـ broker، لا عند Aimpire ولا عند الـ sponsor الخاص بك أبداً؛ ويمكن سحب الربح متى طلبت ذلك؛ والقواعد في هذه الصفحة منقولة من صفحات الـ broker والمنصّة نفسها.\n\nوما ينبغي أن تعرفه أيضاً: نشرت الجهات الرقابية المالية في هولندا (AFM) والنمسا (FMA) وكيبيك (AMF) تحذيرات بشأن Tag Markets، وتُدرج هيئة Finanstilsynet النرويجية التحذير الهولندي. ورقم الترخيص المذكور في صفحة التنظيم لدى الـ broker، GB21026474، صدر باسم Pure North Markets Ltd، وقد أعلنت Financial Services Commission of Mauritius في مارس 2024 أن هذا الترخيص قد أُنهي. ويمكنك التحقّق من ذلك كله على المواقع الرسمية للجهات الرقابية نفسها.\n\nلذلك لا تضع إلا ما تستطيع خسارته كاملاً. لا أحد يستطيع أن يعدك بأن تستمر الاستراتيجية في الربح."],["مَن يحتفظ بمالي؟","الـ broker، أي Tag Markets — لا Aimpire ولا الـ sponsor الخاص بك. لا ترسل المال إلى أي شخص أبداً، ولا تودِع إلا من داخل الـ portal الخاص بك."],["كم أحتاج لأبدأ؟","الحدّ الأدنى $10، للإيداع وللربط بـ Sonic. ابدأ بمبلغ تستطيع خسارته كاملاً، وراقبه بضعة أسابيع قبل أن تقرّر وضع المزيد."],["هل هذا مسموح في بلدي؟","تختلف القواعد من بلد لآخر وتتغيّر، فتحقّق من قواعد بلدك قبل الإيداع — لا نستطيع تقديم استشارة قانونية. هناك أمران منفصلان يهمّان.\n\nقائمة الـ broker: ينشر الـ broker قائمة بالبلدان التي لا يخدمها. باكستان ليست في تلك القائمة. أما الإمارات العربية المتحدة ففيها، لذلك لا يخدم الـ broker المقيمين فيها. ويذكر موقعه أيضاً أنه غير موجّه للمقيمين في الاتحاد الأوروبي.\n\nقواعد بلدك أنت: هذه تخصّك أنت، لا الـ broker. في باكستان، ينصّ EPD Circular Letter No. 08 of 2022 الصادر عن State Bank على أن إرسال الأموال إلى الخارج لمنصّات الـ forex أو الـ margin أو الـ CFD الخارجية (offshore) غير مسموح به. وقائمة الـ broker لا تقول شيئاً عن ذلك."],["ما التطبيقات التي أحتاجها؟","اثنان، وكلاهما مجاني: MetaTrader 5 لترى حسابك، وElement X لمجموعة Aimpire. ثبّتهما من المتاجر الرسمية فقط. أما Tag Markets وCopyX والـ IB Portal فتعمل في المتصفح."],["كم تستغرق الموافقة؟","يقول الـ broker إن التحقّق «just takes a few minutes» (أي لا يستغرق سوى بضع دقائق)، مع تأخير عند كثرة الطلب أو نقص المستندات. تحتاج إلى وثيقة هوية ومسح للوجه. وإن رُفض فسيصلك السبب برسالة بريد إلكتروني من SumSub. استغلّ أي وقت انتظار للخطوة 6، أي التطبيقين."],["ماذا يعني 24× بالنسبة إليّ؟","مع الـ token الخاص بـ Aimpire يتداول مالك بحجم أكبر 24 مرة: في تجربتنا صار مبلغ $109 رصيد تداول قدره $2,616. الربح والخسارة كلاهما أكبر 24 مرة. وهبوط بنسبة 4.2 % في ذلك الرصيد يعادل إيداعك كله، ويُغلق الحساب عند 5 %."],["كم يكلّف ذلك؟","تأخذ استراتيجية Sonic رسم أداء قدره 30 % من الربح، فيبقى لك نحو 70 % من الربح — ويشرح قسم Amplify لماذا قد يكون أقل. لا رسوم إدارة ولا رسوم انضمام. وعلى حسابات Amplify يأخذ الـ broker أيضاً عمولة $10 لكل lot على الـ forex والـ metals. ثم هناك التكاليف التي تصاحب أي صفقة: الـ spread، والـ swap على المراكز المفتوحة خلال الليل، ورسوم الشبكة عند إيداع العملات الرقمية أو سحبها."],["هل أستطيع سحب مالي؟","الأرباح: نعم، في أي وقت وأي يوم. الإيداع: بعد 30 يوماً من أول صفقة فقط، وسحبه يُغلق الحساب فوراً. والترقية تعيد احتساب الثلاثين يوماً من البداية. ويذكر الـ broker أن الدفعات تستغرق من 1 إلى 3 أيام عمل. الخطوات في «Sonic، وما تكسبه» ← «كيف تسحب المال»."],["هل هناك حدّ يومي للخسارة؟","لا حدّ يومياً. هناك حدّ إجمالي واحد: 10 % من الرصيد الابتدائي، أو 5 % مع الـ token الخاص بـ Aimpire. إذا بلغته أُغلق الحساب تلقائياً."],["هل الربح مضمون؟","لا. لا شيء هنا مضمون. والنتائج المنشورة — ومنها Myfxbook — نتائج سابقة قبل رسم الـ 30 %، وليست توقّعاً."],["كيف أعرف أنّ الـ token نجح؟","انظر إلى الرصيد في MetaTrader 5: مع الـ token يكون 24 ضعف ما أودعته. وإن لم يكن كذلك، فتوقّف واسأل الـ sponsor الخاص بك قبل أي خطوة أخرى."],["يقول لي أحدهم إنني أحتاج إلى eCredits، أو إنّ عليّ إرسال عملة رقمية، لأحصل على 24×.","ليس عن طريق Aimpire. الـ token الخاص بنا هو ‎#Aitech مع الرمز 000000، ولا ترسل مقابله أي شيء. وفي المنصّة أيضاً مسار «#eCredits»: فيه ترسل إلى عنوان wallet عدداً من الـ eCredits يساوي ما تستثمره، فمبلغ $100 يعني 100 eCredits فوق إيداعك.\n\nوإن طلب منك أحد أن ترسل مالاً أو عملة رقمية إلى أي مكان غير صفحة الإيداع الخاصة بك، فتوقّف واسأل الـ sponsor الخاص بك."],["هل يمكنني امتلاك أكثر من حساب؟","نعم. يقول الـ broker إنك تستطيع امتلاك ما تشاء من الحسابات، ما دام كل منها يلتزم بالقواعد."],["لم يصل إيداعي.","تحقّق أولاً من المعاملة في محفظتك أنت — فالـ portal لا يستطيع إظهار مال لم يصله أصلاً. حالة «Pending» طبيعية حتى 24 ساعة. بعدها أرسل إلى الـ sponsor الخاص بك رقم المعاملة (transaction ID)، ولا ترسل أبداً لقطة شاشة لتسجيل دخولك."],["اخترت الشبكة الخاطئة.","للأسف، الشبكة الخاطئة لا تؤخّر المال بل تُضيّعه. تواصل فوراً مع دعم محفظتك ومعك رقم المعاملة. لا أحد في Aimpire يستطيع إلغاء تحويل عملات رقمية."],["شخص يقول إنه من الدعم ويطلب كلمة مروري.","لا تعطها — لا للدعم ولا لقائد ولا لأي أحد. Aimpire لن يطلبها أبداً. وإن احتاج أحدهم أن يرى نتائجك فأعطه Investor Password: إنها تتيح المشاهدة فقط، لا التداول."],["نسيت كلمة المرور.","لدى الـ broker دليله الخاص لتغييرها، في «ابدأ الإعداد» ← «أدلة موجودة بالفعل». لا تطلب أبداً من أحد في محادثة أن يعيد ضبطها لك."],["هل عليّ دعوة آخرين؟","لا. تستطيع فتح حساب وترك Sonic يعمل دون أن تعرّف أحداً أبداً. الكسب بصفتك introducing broker اختياري، ولا شيء في المنصّة يفرضه."],["أين أجد المساعدة؟","أولاً هذه الصفحة. ثم الـ sponsor الخاص بك — الشخص الذي دعاك — في كل ما يخصّ حسابك. وإن لم يصل المال أو بدا لك أنّ شيئاً ليس على ما يرام، فالـ sponsor هو من يتابع الأمر ويرفعه إلى الجهة المعنية. واسأل أيضاً في مجموعة Aimpire: غالباً مرّ أحدهم بالسؤال نفسه."]]},"ur":{"lede":"لوگ عام طور پر جو پوچھتے ہیں، اُن کے مختصر جواب۔ اصولوں سے متعلق جواب broker یا platform کے اپنے الفاظ سے ہیں، جو باقی حصوں میں پورے دکھائے گئے ہیں۔","search":"سوالوں میں تلاش کریں","none":"کوئی سوال نہیں ملا۔ Aimpire group میں پوچھیں — اکثر کسی اور نے بھی یہی سوچا ہوتا ہے۔","items":[["کیا یہ دھوکا ہے؟","سوال جائز ہے، اور پیسے سے جُڑی ہر چیز کے بارے میں پوچھنا چاہیے۔ ہم جو جانتے ہیں، وہ یہ ہے — اچھا بھی اور بُرا بھی۔\n\nجو آپ خود جانچ سکتے ہیں: آپ کا پیسہ broker کے پاس رہتا ہے، کبھی Aimpire یا آپ کے sponsor کے پاس نہیں؛ profit جب آپ کہیں نکالا جا سکتا ہے؛ اور اِس صفحے کے اصول broker اور platform کے اپنے صفحات سے نقل کیے گئے ہیں۔\n\nیہ بھی جان لیں: نیدرلینڈز (AFM)، آسٹریا (FMA) اور کیوبیک (AMF) کے مالیاتی ریگولیٹرز نے Tag Markets کے بارے میں وارننگز شائع کی ہیں، اور ناروے کا Finanstilsynet نیدرلینڈز والی وارننگ کو اپنی فہرست میں دکھاتا ہے۔ Broker کے regulation page پر دیا گیا لائسنس نمبر، GB21026474، Pure North Markets Ltd کو جاری کیا گیا تھا، اور Financial Services Commission of Mauritius نے مارچ 2024 میں اعلان کیا کہ وہ لائسنس ختم کر دیا گیا تھا۔ یہ سب آپ ریگولیٹرز کی اپنی websites پر دیکھ سکتے ہیں۔\n\nاِس لیے صرف اُتنا ہی ڈالیں جسے پورا کھونا آپ برداشت کر سکیں۔ کوئی یہ وعدہ نہیں کر سکتا کہ strategy کماتی رہے گی۔"],["میرا پیسہ کس کے پاس رہتا ہے؟","Broker، یعنی Tag Markets کے پاس — نہ Aimpire کے پاس، نہ آپ کے sponsor کے۔ کسی شخص کو کبھی پیسہ نہ بھیجیں، اور صرف اپنے portal کے اندر سے جمع کریں۔"],["شروع کرنے کے لیے کتنا چاہیے؟","کم از کم $10، deposit کے لیے بھی اور Sonic سے جُڑنے کے لیے بھی۔ اُتنی رقم سے شروع کریں جسے پورا کھونا آپ برداشت کر سکیں، اور زیادہ کا فیصلہ کرنے سے پہلے چند ہفتے دیکھیں۔"],["کیا میرے ملک میں اِس کی اجازت ہے؟","ہر ملک کے اصول الگ ہیں اور بدلتے رہتے ہیں، اِس لیے جمع کرنے سے پہلے اپنے ملک کے اصول دیکھ لیں — ہم قانونی مشورہ نہیں دے سکتے۔ دو الگ باتیں اہم ہیں۔\n\nBroker کی فہرست: broker اُن ملکوں کی فہرست شائع کرتا ہے جنہیں وہ سروس نہیں دیتا۔ پاکستان اُس فہرست میں نہیں ہے۔ متحدہ عرب امارات اُس میں ہے، اِس لیے broker وہاں رہنے والے لوگوں کو سروس نہیں دیتا۔ اُس کی website یہ بھی کہتی ہے کہ وہ یورپی یونین کے رہائشیوں کے لیے نہیں ہے۔\n\nآپ کے اپنے ملک کے اصول: یہ آپ کے بارے میں ہیں، broker کے بارے میں نہیں۔ پاکستان میں State Bank کا EPD Circular Letter No. 08 of 2022 کہتا ہے کہ offshore forex، margin یا CFD platforms کو بیرونِ ملک پیسہ بھیجنے کی اجازت نہیں۔ Broker کی فہرست اِس بارے میں کچھ نہیں کہتی۔"],["مجھے کون سی apps چاہییں؟","دو، دونوں مفت: اپنا account دیکھنے کے لیے MetaTrader 5، اور Aimpire group کے لیے Element X۔ صرف official stores سے install کریں۔ Tag Markets، CopyX اور IB Portal browser میں چلتے ہیں۔"],["Approval میں کتنا وقت لگتا ہے؟","Broker کے مطابق verification «just takes a few minutes» (یعنی بس چند منٹ لیتی ہے)، زیادہ رش یا ادھوری دستاویزات پر دیر ہو سکتی ہے۔ آپ کو ایک ID document اور face scan چاہیے۔ Reject ہو جائے تو وجہ SumSub کی email میں آتی ہے۔ انتظار کا وقت step 6، یعنی apps کے لیے استعمال کریں۔"],["میرے لیے 24× کا کیا مطلب ہے؟","Aimpire token کے ساتھ آپ کا پیسہ 24 گنا بڑا trade کرتا ہے: ہمارے اپنے test میں $109 سے $2,616 کا trading balance بنا۔ نفع اور نقصان دونوں 24 گنا بڑے۔ اُس balance میں 4.2 % کی کمی آپ کا پورا deposit ہے، اور account 5 % پر بند ہو جاتا ہے۔"],["اِس کی قیمت کیا ہے؟","Sonic strategy profit پر 30 % performance fee لیتی ہے، یعنی profit کا تقریباً 70 % آپ کا — یہ کم کیوں ہو سکتا ہے، یہ Amplify والے حصے میں بتایا گیا ہے۔ نہ کوئی management fee ہے نہ joining fee۔ Amplify accounts پر broker اِس کے علاوہ forex اور metals پر $10 فی lot commission لیتا ہے۔ پھر وہ لاگتیں ہیں جو ہر trade میں ہوتی ہیں: spread، رات بھر کھلی رکھی گئی positions پر swap، اور crypto جمع کرانے یا نکالنے پر network fees۔"],["کیا میں اپنا پیسہ نکال سکتا ہوں؟","Profit: ہاں، کسی بھی وقت، کسی بھی دن۔ آپ کا deposit: پہلی trade کے 30 دن بعد ہی، اور اُسے نکالتے ہی account فوراً بند ہو جاتا ہے۔ Upgrade سے وہ 30 دن پھر سے شروع ہوتے ہیں۔ Broker کے مطابق payout میں 1–3 کاروباری دن لگتے ہیں۔ Steps «Sonic، اور آپ کی کمائی» ← «پیسہ کیسے نکالیں» میں ہیں۔"],["کیا روزانہ نقصان کی کوئی حد ہے؟","روزانہ کی کوئی حد نہیں۔ ایک کُل حد ہے: starting balance کا 10 %، یا Aimpire token کے ساتھ 5 %۔ وہاں پہنچتے ہی account خود بخود بند ہو جاتا ہے۔"],["کیا profit کی ضمانت ہے؟","نہیں۔ یہاں کسی چیز کی ضمانت نہیں۔ شائع شدہ نتائج — Myfxbook بھی — 30 % fee سے پہلے کے پرانے نتائج ہیں، کوئی پیشگوئی نہیں۔"],["مجھے کیسے پتا چلے گا کہ token نے کام کیا؟","MetaTrader 5 میں balance دیکھیں: token کے ساتھ وہ آپ کی ڈالی ہوئی رقم کا 24 گنا ہوتا ہے۔ اگر نہیں ہے تو رُک جائیں اور کچھ بھی کرنے سے پہلے اپنے sponsor سے پوچھیں۔"],["کوئی کہتا ہے کہ 24× کے لیے مجھے eCredits چاہییں، یا crypto بھیجنا ہوگا۔","Aimpire کے ذریعے نہیں۔ ہمارا token #Aitech ہے، code 000000 کے ساتھ، اور اِس کے لیے آپ کچھ نہیں بھیجتے۔ Platform پر «#eCredits» والا ایک راستہ بھی ہے: اُس میں آپ جتنی رقم invest کرتے ہیں، اُتنے ہی eCredits ایک wallet address پر بھیجتے ہیں، یعنی $100 کا مطلب ہے آپ کے deposit کے اوپر 100 eCredits۔\n\nاگر کوئی آپ سے اپنے deposit page کے علاوہ کہیں اور پیسے یا crypto بھیجنے کو کہے تو رُک جائیں اور اپنے sponsor سے پوچھیں۔"],["کیا میرے ایک سے زیادہ accounts ہو سکتے ہیں؟","ہاں۔ Broker کہتا ہے کہ آپ جتنے چاہیں رکھ سکتے ہیں، بشرطیکہ ہر account اصولوں پر چلے۔"],["میرا deposit نہیں پہنچا۔","پہلے اپنے wallet میں transaction دیکھیں — portal وہ پیسہ نہیں دکھا سکتا جو اُس تک پہنچا ہی نہیں۔ 24 گھنٹے تک «Pending» معمول ہے۔ اُس کے بعد اپنے sponsor کو transaction ID بھیجیں، کبھی اپنے login کا screenshot نہیں۔"],["میں نے غلط network چُن لیا۔","افسوس، غلط network پر بھیجا گیا پیسہ دیر سے نہیں آتا، سیدھا ضائع ہو جاتا ہے۔ فوراً اپنے wallet کی support سے transaction ID کے ساتھ رابطہ کریں۔ Aimpire میں کوئی بھی crypto transfer واپس نہیں کر سکتا۔"],["کوئی خود کو support بتا کر میرا password مانگ رہا ہے۔","نہ دیں — نہ support کو، نہ کسی leader کو، نہ کسی اور کو۔ Aimpire کبھی نہیں مانگے گا۔ کسی کو آپ کے نتائج دیکھنے ہوں تو اُسے Investor Password دیں: اُس سے صرف دیکھا جا سکتا ہے، trade نہیں۔"],["میں password بھول گیا۔","Broker کے پاس اُسے بدلنے کی اپنی guide ہے، «شروع کریں» ← «پہلے سے موجود رہنمائی» میں۔ Chat میں کسی سے کبھی reset کرنے کو نہ کہیں۔"],["کیا مجھے دوسروں کو بُلانا ضروری ہے؟","نہیں۔ آپ account کھول سکتے ہیں، Sonic کو چلنے دے سکتے ہیں، اور کسی کو بھی جوڑے بغیر یہ سب کر سکتے ہیں۔ Introducing broker بن کر کمانا اختیاری ہے، اور platform پر کچھ بھی اِس کا تقاضا نہیں کرتا۔"],["مدد کہاں ملے گی؟","پہلے یہ صفحہ۔ پھر account سے جُڑی ہر بات کے لیے آپ کا sponsor — جس نے آپ کو بُلایا۔ اگر پیسہ نہ پہنچے یا کچھ غلط لگے تو آپ کا sponsor بات آگے پہنچاتا ہے۔ اور Aimpire group میں پوچھیں: اکثر کسی اور کا بھی یہی سوال رہا ہوتا ہے۔"]]},"ar_rm":{"lede":"Ajwiba qasira 3amma yas'al 3anh al-nas 3adatan. Al-ajwiba al-muta3alliqa bil-qawa3id ma'khudha min kalam al-broker aw al-minassa nafsiha, w huwa kalam ta3riduh al-aqsam al-ukhra kamilan.","search":"Ibhath fil-as'ila","none":"La yutabiq dhalik ayy su'al. Is'al fi majmu3at Aimpire — ghaliban sa'al ahaduhum al-shay' nafsuh.","items":[["Hal hadha ihtiyal?","Su'al fi mahallih, w yanbaghi an tatrahah 3an ayy shay' yata3allaq bil-mal. Ilayk ma na3rifuh, al-jayyid minh w al-sayyi'.\n\nMa tastati3 al-tahaqquq minh binafsak: malak 3ind al-broker, la 3ind Aimpire w la 3ind al-sponsor al-khass bik abadan; w yumkin sahb al-ribh mata talabt dhalik; w al-qawa3id fi hadhihi al-safha manqula min safahat al-broker w al-minassa nafsiha.\n\nW ma yanbaghi an ta3rifah aydan: nasharat al-jihat al-raqabiya al-maliya fi Hulanda (AFM) w al-Nimsa (FMA) w Quebec (AMF) tahdhirat bi-sha'n Tag Markets, w tudrij hay'at Finanstilsynet al-narwijiya al-tahdhir al-hulandi. W raqm al-tarkhis al-madhkur fi safhat al-tanzim lada al-broker, GB21026474, sadar bi-ism Pure North Markets Ltd, w qad a3lanat Financial Services Commission of Mauritius fi maris 2024 anna hadha al-tarkhis qad unhi. W yumkinuk al-tahaqquq min dhalik kulluh 3ala al-mawaqi3 al-rasmiya lil-jihat al-raqabiya nafsiha.\n\nLidhalik la tada3 illa ma tastati3 khasaratah kamilan. La ahad yastati3 an ya3idak bi-an tastamirr al-istratijiya fil-ribh."],["Man yahtafiz bi-mali?","Al-broker, ay Tag Markets — la Aimpire w la al-sponsor al-khass bik. La tursil al-mal ila ayy shakhs abadan, w la tudi3 illa min dakhil al-portal al-khass bik."],["Kam ahtaj li-abda'?","Al-hadd al-adna $10, lil-ida3 w lil-rabt bi Sonic. Ibda' bi-mablagh tastati3 khasaratah kamilan, w raqibh bid3at asabi3 qabl an tuqarrir wad3 al-mazid."],["Hal hadha masmuh fi baladi?","Takhtalif al-qawa3id min balad li-akhar w tataghayyar, fatahaqqaq min qawa3id baladak qabl al-ida3 — la nastati3 taqdim istishara qanuniya. Hunak amran munfasilan yahumman.\n\nQa'imat al-broker: yanshur al-broker qa'ima bil-buldan allati la yakhdimuha. Pakistan laysat fi tilka al-qa'ima. Amma al-Imarat al-3arabiya al-muttahida fafiha, lidhalik la yakhdim al-broker al-muqimin fiha. W yadhkur mawqi3uh aydan annahu ghayr muwajjah lil-muqimin fil-ittihad al-urubbi.\n\nQawa3id baladak anta: hadhihi takhussak anta, la al-broker. Fi Pakistan, yanuss EPD Circular Letter No. 08 of 2022 al-sadir 3an State Bank 3ala anna irsal al-amwal ila al-kharij li-minassat al-forex aw al-margin aw al-CFD al-kharijiya (offshore) ghayr masmuh bih. W qa'imat al-broker la taqul shay'an 3an dhalik."],["Ma al-tatbiqat allati ahtajuha?","Ithnan, w kilahuma majjani: MetaTrader 5 li-tara hisabak, w Element X li-majmu3at Aimpire. Thabbithuma min al-matajir al-rasmiya faqat. Amma Tag Markets w CopyX w al-IB Portal fata3mal fil-mutasaffih."],["Kam tastaghriq al-muwafaqa?","Yaqul al-broker inna al-tahaqquq «just takes a few minutes» (ay la yastaghriq siwa bid3 daqa'iq), ma3 ta'khir 3ind kathrat al-talab aw naqs al-mustanadat. Tahtaj ila wathiqat hawiya w mash lil-wajh. W in rufid fasayasilak al-sabab bi-risalat barid iliktruni min SumSub. Istaghill ayy waqt intizar lil-khutwa 6, ay al-tatbiqayn."],["Madha ya3ni 24× bil-nisba ilayy?","Ma3 al-token al-khass bi Aimpire yatadawal malak bi-hajm akbar 24 marra: fi tajribatina sar mablagh $109 rasid tadawul qadruh $2,616. Al-ribh w al-khasara kilahuma akbar 24 marra. W hubut bi-nisbat 4.2 % fi dhalik al-rasid yu3adil ida3ak kulluh, w yughlaq al-hisab 3ind 5 %."],["Kam yukallif dhalik?","Ta'khudh istratijiyat Sonic rasm ada' qadruh 30 % min al-ribh, fayabqa lak nahwa 70 % min al-ribh — w yashrah qism Amplify limadha qad yakun aqall. La rusum idara w la rusum indimam. W 3ala hisabat Amplify ya'khudh al-broker aydan 3umulat $10 li-kull lot 3ala al-forex w al-metals. Thumma hunak al-takalif allati tusahib ayy safqa: al-spread, w al-swap 3ala al-marakiz al-maftuha khilal al-layl, w rusum al-shabaka 3ind ida3 al-3umlat al-raqmiya aw sahbiha."],["Hal astati3 sahb mali?","Al-arbah: na3am, fi ayy waqt w ayy yawm. Al-ida3: ba3d 30 yawman min awwal safqa faqat, w sahbuh yughliq al-hisab fawran. W al-tarqiya tu3id ihtisab al-thalathin yawman min al-bidaya. W yadhkur al-broker anna al-daf3at tastaghriq min 1 ila 3 ayyam 3amal. Al-khutuwat fi «Sonic, w ma taksibuh» → «Kayf tashab al-mal»."],["Hal hunak hadd yawmi lil-khasara?","La hadd yawmiyan. Hunak hadd ijmali wahid: 10 % min al-rasid al-ibtida'i, aw 5 % ma3 al-token al-khass bi Aimpire. Idha balaghtah ughliq al-hisab tilqa'iyan."],["Hal al-ribh madmun?","La. La shay' huna madmun. W al-nata'ij al-manshura — w minha Myfxbook — nata'ij sabiqa qabl rasm al-30 %, w laysat tawaqqu3an."],["Kayf a3rif anna al-token najah?","Unzur ila al-rasid fi MetaTrader 5: ma3 al-token yakun 24 di3f ma awda3tah. W in lam yakun kadhalik, fatawaqqaf w is'al al-sponsor al-khass bik qabl ayy khutwa ukhra."],["Yaqul li ahaduhum innani ahtaj ila eCredits, aw inna 3alayya irsal 3umla raqmiya, li-ahsul 3ala 24×.","Laysa 3an tariq Aimpire. Al-token al-khass bina huwa #Aitech ma3 al-ramz 000000, w la tursil muqabilah ayy shay'. W fil-minassa aydan masar «#eCredits»: fih tursil ila 3unwan wallet 3adadan min al-eCredits yusawi ma tastathmiruh, famablagh $100 ya3ni 100 eCredits fawq ida3ak.\n\nW in talab minnak ahad an tursil malan aw 3umla raqmiya ila ayy makan ghayr safhat al-ida3 al-khassa bik, fatawaqqaf w is'al al-sponsor al-khass bik."],["Hal yumkinuni imtilak akthar min hisab?","Na3am. Yaqul al-broker innak tastati3 imtilak ma tasha' min al-hisabat, ma dam kull minha yaltazim bil-qawa3id."],["Lam yasil ida3i.","Tahaqqaq awwalan min al-mu3amala fi mihfazatak anta — fal-portal la yastati3 izhar mal lam yasiluh aslan. Halat «Pending» tabi3iya hatta 24 sa3a. Ba3daha arsil ila al-sponsor al-khass bik raqm al-mu3amala (transaction ID), w la tursil abadan laqtat shasha li-tasjil dukhulak."],["Ikhtart al-shabaka al-khati'a.","Lil-asaf, al-shabaka al-khati'a la tu'akhkhir al-mal bal tudayyi3uh. Tawasal fawran ma3 da3m mihfazatak w ma3ak raqm al-mu3amala. La ahad fi Aimpire yastati3 ilgha' tahwil 3umlat raqmiya."],["Shakhs yaqul innahu min al-da3m w yatlub kalimat mururi.","La tu3tiha — la lil-da3m w la li-qa'id w la li-ayy ahad. Aimpire lan yatlubaha abadan. W in ihtaj ahaduhum an yara nata'ijak fa'a3tih Investor Password: innaha tutih al-mushahada faqat, la al-tadawul."],["Nasit kalimat al-murur.","Lada al-broker daliluh al-khass li-taghyiriha, fi «Ibda' al-i3dad» → «Adilla mawjuda bil-fi3l». La tatlub abadan min ahad fi muhadatha an yu3id dabtaha lak."],["Hal 3alayya da3wat akharin?","La. Tastati3 fath hisab w tark Sonic ya3mal dun an tu3arrif ahadan abadan. Al-kasb bi-sifatak introducing broker ikhtiyari, w la shay' fil-minassa yafriduh."],["Ayn ajid al-musa3ada?","Awwalan hadhihi al-safha. Thumma al-sponsor al-khass bik — al-shakhs alladhi da3ak — fi kull ma yakhuss hisabak. W in lam yasil al-mal aw bada lak anna shay'an laysa 3ala ma yuram, fal-sponsor huwa man yutabi3 al-amr w yarfa3uh ila al-jiha al-ma3niya. W is'al aydan fi majmu3at Aimpire: ghaliban marr ahaduhum bil-su'al nafsuh."]]},"ur_rm":{"lede":"Log aam taur par jo poochte hain, un ke mukhtasar jawab. Usoolon se mutaliq jawab broker ya platform ke apne alfaaz se hain, jo baqi hisson mein poore dikhaye gaye hain.","search":"Sawalon mein talaash karein","none":"Koi sawal nahi mila. Aimpire group mein poochein — aksar kisi aur ne bhi yahi socha hota hai.","items":[["Kya yeh dhoka hai?","Sawal jaaiz hai, aur paise se judi har cheez ke baare mein poochna chahiye. Hum jo jaante hain, woh yeh hai — achha bhi aur bura bhi.\n\nJo aap khud jaanch sakte hain: aap ka paisa broker ke paas rehta hai, kabhi Aimpire ya aap ke sponsor ke paas nahi; profit jab aap kahein nikala ja sakta hai; aur is safhe ke usool broker aur platform ke apne safhaat se naqal kiye gaye hain.\n\nYeh bhi jaan lein: Netherlands (AFM), Austria (FMA) aur Quebec (AMF) ke maaliyati regulators ne Tag Markets ke baare mein warnings shaye ki hain, aur Norway ka Finanstilsynet Netherlands wali warning ko apni fehrist mein dikhata hai. Broker ke regulation page par diya gaya license number, GB21026474, Pure North Markets Ltd ko jaari kiya gaya tha, aur Financial Services Commission of Mauritius ne March 2024 mein elaan kiya keh woh license khatam kar diya gaya tha. Yeh sab aap regulators ki apni websites par dekh sakte hain.\n\nIs liye sirf utna hi daalein jise poora khona aap bardasht kar sakein. Koi yeh waada nahi kar sakta keh strategy kamati rahegi."],["Mera paisa kis ke paas rehta hai?","Broker, yaani Tag Markets ke paas — na Aimpire ke paas, na aap ke sponsor ke. Kisi shakhs ko kabhi paisa na bhejein, aur sirf apne portal ke andar se jama karein."],["Shuru karne ke liye kitna chahiye?","Kam az kam $10, deposit ke liye bhi aur Sonic se judne ke liye bhi. Utni raqam se shuru karein jise poora khona aap bardasht kar sakein, aur zyada ka faisla karne se pehle chand hafte dekhein."],["Kya mere mulk mein is ki ijazat hai?","Har mulk ke usool alag hain aur badalte rehte hain, is liye jama karne se pehle apne mulk ke usool dekh lein — hum qanooni mashwara nahi de sakte. Do alag baatein aham hain.\n\nBroker ki fehrist: broker un mulkon ki fehrist shaye karta hai jinhein woh service nahi deta. Pakistan us fehrist mein nahi hai. Muttahida Arab Emaraat us mein hai, is liye broker wahan rehne wale logon ko service nahi deta. Us ki website yeh bhi kehti hai keh woh Europi Union ke rehaishiyon ke liye nahi hai.\n\nAap ke apne mulk ke usool: yeh aap ke baare mein hain, broker ke baare mein nahi. Pakistan mein State Bank ka EPD Circular Letter No. 08 of 2022 kehta hai keh offshore forex, margin ya CFD platforms ko bairoon-e-mulk paisa bhejne ki ijazat nahi. Broker ki fehrist is baare mein kuch nahi kehti."],["Mujhe kaun si apps chahiyein?","Do, dono muft: apna account dekhne ke liye MetaTrader 5, aur Aimpire group ke liye Element X. Sirf official stores se install karein. Tag Markets, CopyX aur IB Portal browser mein chalte hain."],["Approval mein kitna waqt lagta hai?","Broker ke mutabiq verification «just takes a few minutes» (yaani bas chand minute leti hai), zyada rush ya adhoori dastavezaat par der ho sakti hai. Aap ko ek ID document aur face scan chahiye. Reject ho jaaye to wajah SumSub ki email mein aati hai. Intezar ka waqt step 6, yaani apps ke liye istemal karein."],["Mere liye 24× ka kya matlab hai?","Aimpire token ke saath aap ka paisa 24 guna bada trade karta hai: hamare apne test mein $109 se $2,616 ka trading balance bana. Nafa aur nuqsan dono 24 guna bade. Us balance mein 4.2 % ki kami aap ka poora deposit hai, aur account 5 % par band ho jaata hai."],["Is ki qeemat kya hai?","Sonic strategy profit par 30 % performance fee leti hai, yaani profit ka taqreeban 70 % aap ka — yeh kam kyun ho sakta hai, yeh Amplify wale hisse mein bataya gaya hai. Na koi management fee hai na joining fee. Amplify accounts par broker is ke ilawa forex aur metals par $10 fi lot commission leta hai. Phir woh laagatein hain jo har trade mein hoti hain: spread, raat bhar khuli rakhi gayi positions par swap, aur crypto jama karane ya nikalne par network fees."],["Kya main apna paisa nikal sakta hoon?","Profit: haan, kisi bhi waqt, kisi bhi din. Aap ka deposit: pehli trade ke 30 din baad hi, aur use nikalte hi account fauran band ho jaata hai. Upgrade se woh 30 din phir se shuru hote hain. Broker ke mutabiq payout mein 1–3 karobari din lagte hain. Steps «Sonic, aur aap ki kamaai» → «Paisa kaise nikalein» mein hain."],["Kya rozana nuqsan ki koi had hai?","Rozana ki koi had nahi. Ek kul had hai: starting balance ka 10 %, ya Aimpire token ke saath 5 %. Wahan pahunchte hi account khud ba khud band ho jaata hai."],["Kya profit ki zamanat hai?","Nahi. Yahan kisi cheez ki zamanat nahi. Shaye shuda nataij — Myfxbook bhi — 30 % fee se pehle ke purane nataij hain, koi peshgoi nahi."],["Mujhe kaise pata chalega keh token ne kaam kiya?","MetaTrader 5 mein balance dekhein: token ke saath woh aap ki daali hui raqam ka 24 guna hota hai. Agar nahi hai to ruk jaayein aur kuch bhi karne se pehle apne sponsor se poochein."],["Koi kehta hai keh 24× ke liye mujhe eCredits chahiyein, ya crypto bhejna hoga.","Aimpire ke zariye nahi. Hamara token #Aitech hai, code 000000 ke saath, aur is ke liye aap kuch nahi bhejte. Platform par «#eCredits» wala ek rasta bhi hai: us mein aap jitni raqam invest karte hain, utne hi eCredits ek wallet address par bhejte hain, yaani $100 ka matlab hai aap ke deposit ke upar 100 eCredits.\n\nAgar koi aap se apne deposit page ke ilawa kahin aur paise ya crypto bhejne ko kahe to ruk jaayein aur apne sponsor se poochein."],["Kya mere ek se zyada accounts ho sakte hain?","Haan. Broker kehta hai keh aap jitne chahein rakh sakte hain, basharte har account usoolon par chale."],["Mera deposit nahi pahuncha.","Pehle apne wallet mein transaction dekhein — portal woh paisa nahi dikha sakta jo us tak pahuncha hi nahi. 24 ghante tak «Pending» maamool hai. Us ke baad apne sponsor ko transaction ID bhejein, kabhi apne login ka screenshot nahi."],["Main ne ghalat network chun liya.","Afsos, ghalat network par bheja gaya paisa der se nahi aata, seedha zaya ho jaata hai. Fauran apne wallet ki support se transaction ID ke saath raabta karein. Aimpire mein koi bhi crypto transfer wapas nahi kar sakta."],["Koi khud ko support bata kar mera password maang raha hai.","Na dein — na support ko, na kisi leader ko, na kisi aur ko. Aimpire kabhi nahi maangega. Kisi ko aap ke nataij dekhne hon to use Investor Password dein: us se sirf dekha ja sakta hai, trade nahi."],["Main password bhool gaya.","Broker ke paas use badalne ki apni guide hai, «Shuru karein» → «Pehle se mojood rehnumai» mein. Chat mein kisi se kabhi reset karne ko na kahein."],["Kya mujhe doosron ko bulana zaroori hai?","Nahi. Aap account khol sakte hain, Sonic ko chalne de sakte hain, aur kisi ko bhi jode baghair yeh sab kar sakte hain. Introducing broker ban kar kamana ikhtiyari hai, aur platform par kuch bhi is ka taqaza nahi karta."],["Madad kahan milegi?","Pehle yeh safha. Phir account se judi har baat ke liye aap ka sponsor — jis ne aap ko bulaya. Agar paisa na pahunche ya kuch ghalat lage to aap ka sponsor baat aage pahunchata hai. Aur Aimpire group mein poochein: aksar kisi aur ka bhi yahi sawal raha hota hai."]]}},"withdraw":{"en":{"lede":"Profit can come out any time; the deposit only 30 days after your first trade, and taking it out closes the account. The path has three parts, and the middle one is only needed the first time. Do it once early, with a small amount, so you know it works before you rely on it.","parts":[["From Amplify to your Tag wallet","On the Dashboard, open AMPLIFY. Profit you can take out is shown under AVAILABLE. Press WITHDRAW, enter the amount, press WITHDRAW again, then CONTINUE. The back office reviews it, so it can take a while to appear in your Tag Markets Wallet — refresh the page."],["First time only: add your own wallet","Open TAG WALLET → YOUR CRYPTO WALLETS → ADD A CRYPTO WALLET. Fill in the owner's name, choose CRYPTO, add your billing details and the address of your own wallet, enter your dashboard password and press SUBMIT CRYPTO WALLET. It shows PENDING VALIDATION — usually 5 to 45 minutes, up to 24 hours."],["From your Tag wallet to your own wallet","TAG WALLET → WITHDRAWALS. Enter the amount and press SUBMIT REQUEST, tick the box, press «Your attention is required. Please click here», enter the wallet you verified, and choose CRYPTOCHILL — without it the withdrawal is not processed and you have to start again. Check the details and press WITHDRAW."]],"facts":"The broker's minimum withdrawal is $10 on Ethereum (ETH), BNB (BSC) and Bitcoin (BTC), and $50 on Tron (TRX). A network fee is deducted, and it depends on the network — so what arrives is roughly the amount minus the network fee. The broker says Amplify payouts take 1–3 working days."},"no":{"lede":"Profitt kan tas ut når som helst; innskuddet først 30 dager etter din første handel, og å ta det ut stenger kontoen. Veien har tre deler, og den midterste trengs bare første gang. Gjør det én gang tidlig, med et lite beløp, så du vet at det virker før du stoler på det.","parts":[["Fra Amplify til Tag-lommeboka","Åpne AMPLIFY på dashbordet. Profitt du kan ta ut, står under AVAILABLE. Trykk WITHDRAW, skriv beløpet, trykk WITHDRAW igjen og så CONTINUE. Backoffice går gjennom det, så det kan ta litt tid før det dukker opp i Tag Markets Wallet — oppdater siden."],["Bare første gang: legg til din egen lommebok","Åpne TAG WALLET → YOUR CRYPTO WALLETS → ADD A CRYPTO WALLET. Fyll inn eierens navn, velg CRYPTO, legg inn fakturaopplysninger og adressen til din egen lommebok, skriv passordet du logger inn på dashbordet med, og trykk SUBMIT CRYPTO WALLET. Den viser PENDING VALIDATION — vanligvis 5 til 45 minutter, opptil 24 timer."],["Fra Tag-lommeboka til din egen lommebok","TAG WALLET → WITHDRAWALS. Skriv beløpet og trykk SUBMIT REQUEST, kryss av i boksen, trykk «Your attention is required. Please click here», skriv inn lommeboka du verifiserte, og velg CRYPTOCHILL — uten den blir uttaket ikke behandlet, og du må begynne på nytt. Sjekk opplysningene og trykk WITHDRAW."]],"facts":"Meglerens minstebeløp for uttak er $10 på Ethereum (ETH), BNB (BSC) og Bitcoin (BTC), og $50 på Tron (TRX). Et nettverksgebyr trekkes fra, og det avhenger av nettverket — så det som kommer fram, er omtrent beløpet minus nettverksgebyret. Megleren oppgir at utbetalinger fra Amplify tar 1–3 virkedager."},"hi":{"lede":"Profit कभी भी निकल सकता है; जमा रक़म पहली trade के सिर्फ़ 30 दिन बाद, और उसे निकालने से account बंद हो जाता है। रास्ते के तीन हिस्से हैं, और बीच वाला सिर्फ़ पहली बार चाहिए। शुरू में ही एक बार, छोटी रक़म से करके देख लें, ताकि इस पर निर्भर होने से पहले आपको पता हो कि यह काम करता है।","parts":[["Amplify से आपके Tag wallet तक","Dashboard पर AMPLIFY खोलें। जो profit निकाला जा सकता है, वह AVAILABLE में दिखता है। WITHDRAW दबाएँ, रक़म लिखें, फिर WITHDRAW, और फिर CONTINUE। Back office इसकी जाँच करता है, इसलिए Tag Markets Wallet में आने में थोड़ा समय लग सकता है — page refresh करें।"],["सिर्फ़ पहली बार: अपना wallet जोड़ें","TAG WALLET → YOUR CRYPTO WALLETS → ADD A CRYPTO WALLET खोलें। मालिक का नाम भरें, CRYPTO चुनें, billing details और अपने wallet का address डालें, dashboard का login password लिखें और SUBMIT CRYPTO WALLET दबाएँ। यह PENDING VALIDATION दिखाता है — आमतौर पर 5 से 45 मिनट, ज़्यादा से ज़्यादा 24 घंटे।"],["Tag wallet से अपने wallet तक","TAG WALLET → WITHDRAWALS। रक़म लिखें और SUBMIT REQUEST दबाएँ, box पर tick करें, «Your attention is required. Please click here» दबाएँ, verify किया हुआ wallet डालें, और CRYPTOCHILL चुनें — इसके बिना withdrawal process नहीं होगा और फिर से शुरू करना पड़ेगा। Details जाँचें और WITHDRAW दबाएँ।"]],"facts":"Broker की न्यूनतम withdrawal सीमा Ethereum (ETH), BNB (BSC) और Bitcoin (BTC) पर $10 है, और Tron (TRX) पर $50। Network fee काटी जाती है, जो network पर निर्भर है — यानी जो पहुँचता है, वह लगभग रक़म माइनस network fee होता है। Broker के मुताबिक़ Amplify payouts में 1–3 कामकाजी दिन लगते हैं।"},"ar":{"lede":"يمكن سحب الربح في أي وقت؛ أما الإيداع فلا يُسحب إلا بعد 30 يوماً من أول صفقة لك، وسحبه يُغلق الحساب. وتمرّ العملية بثلاث مراحل، والوسطى منها لا تلزم إلا في المرة الأولى. جرّبها مرة مبكراً بمبلغ صغير، لتتأكّد أنها تعمل قبل أن تعتمد عليها.","parts":[["من Amplify إلى محفظة Tag","في لوحة التحكم افتح AMPLIFY. الربح القابل للسحب يظهر تحت AVAILABLE. اضغط WITHDRAW، واكتب المبلغ، ثم WITHDRAW مرة أخرى، ثم CONTINUE. يراجعه الـ back office، فقد يستغرق ظهوره في Tag Markets Wallet بعض الوقت — حدّث الصفحة."],["في المرة الأولى فقط: أضف محفظتك","افتح TAG WALLET → YOUR CRYPTO WALLETS → ADD A CRYPTO WALLET. املأ اسم المالك، واختر CRYPTO، وأضف بيانات الفوترة وعنوان محفظتك أنت، واكتب كلمة مرور لوحة التحكم، ثم اضغط SUBMIT CRYPTO WALLET. ستظهر PENDING VALIDATION — عادةً من 5 إلى 45 دقيقة، وحتى 24 ساعة."],["من محفظة Tag إلى محفظتك","TAG WALLET → WITHDRAWALS. اكتب المبلغ واضغط SUBMIT REQUEST، وعلّم المربّع، واضغط «Your attention is required. Please click here»، وأدخل المحفظة التي تحقّقت منها، واختر CRYPTOCHILL — من دونه لا يُعالَج السحب وعليك البدء من جديد. راجع التفاصيل واضغط WITHDRAW."]],"facts":"الحدّ الأدنى للسحب لدى الـ broker هو $10 على Ethereum (ETH) وBNB (BSC) وBitcoin (BTC)، و$50 على Tron (TRX). ويُخصم رسم شبكة يتوقّف على الشبكة — أي أن ما يصل هو تقريباً المبلغ ناقص رسم الشبكة. ويذكر الـ broker أن دفعات Amplify تستغرق من 1 إلى 3 أيام عمل."},"ur":{"lede":"Profit کسی بھی وقت نکل سکتا ہے؛ deposit پہلی trade کے صرف 30 دن بعد، اور اُسے نکالنے سے account بند ہو جاتا ہے۔ راستے کے تین حصے ہیں، اور درمیان والا صرف پہلی بار چاہیے۔ شروع میں ہی ایک بار، چھوٹی رقم کے ساتھ کر کے دیکھ لیں، تاکہ بھروسہ کرنے سے پہلے پتا ہو کہ یہ چلتا ہے۔","parts":[["Amplify سے آپ کے Tag wallet تک","Dashboard پر AMPLIFY کھولیں۔ جو profit نکالا جا سکتا ہے وہ AVAILABLE میں دکھتا ہے۔ WITHDRAW دبائیں، رقم لکھیں، پھر WITHDRAW، اور پھر CONTINUE۔ Back office اِس کی جانچ کرتا ہے، اِس لیے Tag Markets Wallet میں آنے میں کچھ وقت لگ سکتا ہے — page refresh کریں۔"],["صرف پہلی بار: اپنا wallet جوڑیں","TAG WALLET → YOUR CRYPTO WALLETS → ADD A CRYPTO WALLET کھولیں۔ مالک کا نام بھریں، CRYPTO چنیں، billing details اور اپنے wallet کا address ڈالیں، dashboard کا login password لکھیں اور SUBMIT CRYPTO WALLET دبائیں۔ یہ PENDING VALIDATION دکھاتا ہے — عام طور پر 5 سے 45 منٹ، زیادہ سے زیادہ 24 گھنٹے۔"],["Tag wallet سے اپنے wallet تک","TAG WALLET → WITHDRAWALS۔ رقم لکھیں اور SUBMIT REQUEST دبائیں، box پر tick کریں، «Your attention is required. Please click here» دبائیں، verify کیا ہوا wallet ڈالیں، اور CRYPTOCHILL چنیں — اِس کے بغیر withdrawal process نہیں ہوگا اور پھر سے شروع کرنا پڑے گا۔ Details دیکھیں اور WITHDRAW دبائیں۔"]],"facts":"Broker کی کم از کم withdrawal حد Ethereum (ETH)، BNB (BSC) اور Bitcoin (BTC) پر $10، اور Tron (TRX) پر $50 ہے۔ Network fee کاٹی جاتی ہے، جو network پر منحصر ہے — یعنی جو پہنچتا ہے، وہ تقریباً رقم میں سے network fee کم کر کے ہوتا ہے۔ Broker کے مطابق Amplify payouts میں 1–3 کاروباری دن لگتے ہیں۔"},"ar_rm":{"lede":"Yumkin sahb al-ribh fi ayy waqt; amma al-ida3 fala yushab illa ba3d 30 yawman min awwal safqa lak, w sahbuh yughliq al-hisab. W tamurr al-3amaliya bi-thalath marahil, w al-wusta minha la talzam illa fil-marra al-ula. Jarribha marra mubakkiran bi-mablagh saghir, li-tata'akkad annaha ta3mal qabl an ta3tamid 3alayha.","parts":[["Min Amplify ila mihfazat Tag","Fi lawhat al-tahakkum iftah AMPLIFY. Al-ribh al-qabil lil-sahb yazhar taht AVAILABLE. Idghat WITHDRAW, w uktub al-mablagh, thumma WITHDRAW marra ukhra, thumma CONTINUE. Yuraji3uh al-back office, faqad yastaghriq zuhuruh fi Tag Markets Wallet ba3d al-waqt — haddith al-safha."],["Fil-marra al-ula faqat: adif mihfazatak","Iftah TAG WALLET → YOUR CRYPTO WALLETS → ADD A CRYPTO WALLET. Imla' ism al-malik, w ikhtar CRYPTO, w adif bayanat al-fawtara w 3unwan mihfazatak anta, w uktub kalimat murur lawhat al-tahakkum, thumma idghat SUBMIT CRYPTO WALLET. Satazhar PENDING VALIDATION — 3adatan min 5 ila 45 daqiqa, w hatta 24 sa3a."],["Min mihfazat Tag ila mihfazatak","TAG WALLET → WITHDRAWALS. Uktub al-mablagh w idghat SUBMIT REQUEST, w 3allim al-murabba3, w idghat «Your attention is required. Please click here», w adkhil al-mihfaza allati tahaqqaqt minha, w ikhtar CRYPTOCHILL — min dunih la yu3alaj al-sahb w 3alayk al-bad' min jadid. Raji3 al-tafasil w idghat WITHDRAW."]],"facts":"Al-hadd al-adna lil-sahb lada al-broker huwa $10 3ala Ethereum (ETH) w BNB (BSC) w Bitcoin (BTC), w $50 3ala Tron (TRX). W yukhsam rasm shabaka yatawaqqaf 3ala al-shabaka — ay anna ma yasil huwa taqriban al-mablagh naqis rasm al-shabaka. W yadhkur al-broker anna daf3at Amplify tastaghriq min 1 ila 3 ayyam 3amal."},"ur_rm":{"lede":"Profit kisi bhi waqt nikal sakta hai; deposit pehli trade ke sirf 30 din baad, aur use nikalne se account band ho jaata hai. Raste ke teen hisse hain, aur darmiyan wala sirf pehli baar chahiye. Shuru mein hi ek baar, chhoti raqam ke saath kar ke dekh lein, taakeh bharosa karne se pehle pata ho keh yeh chalta hai.","parts":[["Amplify se aap ke Tag wallet tak","Dashboard par AMPLIFY kholein. Jo profit nikala ja sakta hai woh AVAILABLE mein dikhta hai. WITHDRAW dabayein, raqam likhein, phir WITHDRAW, aur phir CONTINUE. Back office is ki jaanch karta hai, is liye Tag Markets Wallet mein aane mein kuch waqt lag sakta hai — page refresh karein."],["Sirf pehli baar: apna wallet jodein","TAG WALLET → YOUR CRYPTO WALLETS → ADD A CRYPTO WALLET kholein. Malik ka naam bharein, CRYPTO chunein, billing details aur apne wallet ka address daalein, dashboard ka login password likhein aur SUBMIT CRYPTO WALLET dabayein. Yeh PENDING VALIDATION dikhata hai — aam taur par 5 se 45 minute, zyada se zyada 24 ghante."],["Tag wallet se apne wallet tak","TAG WALLET → WITHDRAWALS. Raqam likhein aur SUBMIT REQUEST dabayein, box par tick karein, «Your attention is required. Please click here» dabayein, verify kiya hua wallet daalein, aur CRYPTOCHILL chunein — is ke baghair withdrawal process nahi hoga aur phir se shuru karna padega. Details dekhein aur WITHDRAW dabayein."]],"facts":"Broker ki kam az kam withdrawal had Ethereum (ETH), BNB (BSC) aur Bitcoin (BTC) par $10, aur Tron (TRX) par $50 hai. Network fee kaati jaati hai, jo network par munhasir hai — yaani jo pahunchta hai, woh taqreeban raqam mein se network fee kam kar ke hota hai. Broker ke mutabiq Amplify payouts mein 1–3 karobari din lagte hain."}},"results":{"source":"https://www.myfxbook.com/members/SonicExperts/sonic-ai/12076857","months":[["2024-11",1.12,0.13],["2024-12",1.18,0.15],["2025-01",1.23,0.17],["2025-02",1.25,0.1],["2025-03",1.06,0.21],["2025-04",1.26,0.81],["2025-05",1.78,0.6],["2025-06",1.18,0.71],["2025-07",1.45,0.5],["2025-08",1.61,0.42],["2025-09",1.63,0.15],["2025-10",1.17,0.0],["2025-11",0.91,0.03],["2025-12",1.16,0.0],["2026-01",0.61,0.0],["2026-02",0.55,0.03],["2026-03",0.8,0.0],["2026-04",1.26,0.0],["2026-05",1.09,0.0],["2026-06",1.06,0.01],["2026-07",1.17,0.02],["2026-08",0.88,0.0],["2026-09",1.04,0.0],["2026-10",0.42,0.01]],"stats":["+30.58 %","+1.13 %","−0.86 %","634","82–83 %"],"en":{"lede":"From the strategy's own Myfxbook record — a standard Tag Markets account at 1:500 — from 3 November 2024 to 14 October 2026. Each bar is one month's gain; the mark below it is that month's largest dip. Before the 30 % fee. Past results, not a forecast.","stats":["In total","Average month","Largest dip","Trades","Win rate"],"legend":["gain","largest dip"],"notes":["No losing month in 24 — which also means this record has not yet been tested by one.","Losing days happen: 49 of the 427 daily readings. The worst, 3 June 2025, was −0.64 %. At 24× that is about −15 % of your deposit in one day; the deepest dip, −0.86 %, is about −21 %. The record has one gap, 20 August to 12 September 2025, which counts as a single reading.","The average loss ($134.97) is bigger than the average win ($93.37). The high win rate carries the result, so a run of losses costs more than a run of wins earns.","The account closes at 5 %. The record's deepest dip, 0.86 %, is about a sixth of that distance.","Dips here are measured on each day's closing balance; inside a day they can go deeper.","The strategy card inside CopyX shows a Max DD of 0.26 %. We use Myfxbook's deeper 0.86 %, because the card does not say how its figure is measured."],"formula":"Effect on your deposit = the account's fall in % × 24.","link":"Check it yourself on Myfxbook","read":"Figures read on 15 October 2026.","table":"Show the numbers"},"no":{"lede":"Fra strategiens egen Myfxbook-historikk — en vanlig Tag Markets-konto med 1:500 — fra 3. november 2024 til 14. oktober 2026. Hver søyle er én måneds gevinst; streken under er månedens største dupp. Før honoraret på 30 %. Tidligere resultater, ikke en prognose.","stats":["Totalt","Snittmåned","Største dupp","Handler","Treffprosent"],"legend":["gevinst","største dupp"],"notes":["Ingen tapsmåned på 24 måneder — noe som også betyr at historikken ennå ikke er satt på prøve av en tapsmåned.","Tapsdager skjer: 49 av de 427 daglige avlesningene. Den verste, 3. juni 2025, var −0,64 %. Med 24× er det rundt −15 % av innskuddet ditt på én dag; den dypeste duppen, −0,86 %, er rundt −21 %. Historikken har ett hull, 20. august til 12. september 2025, som teller som én avlesning.","Snittapet ($134,97) er større enn snittgevinsten ($93,37). Den høye treffprosenten bærer resultatet, så en rekke tap koster mer enn en rekke gevinster tjener.","Kontoen stenges ved 5 %. Historikkens dypeste dupp, 0,86 %, er rundt en sjettedel av den avstanden.","Duppene her er målt på hver dags sluttsaldo; i løpet av en dag kan de gå dypere.","Strategikortet i CopyX viser en Max DD (største dupp) på 0,26 %. Vi bruker Myfxbooks dypere 0,86 %, fordi kortet ikke sier hvordan tallet er målt."],"formula":"Virkning på innskuddet ditt = kontoens fall i % × 24.","link":"Sjekk det selv på Myfxbook","read":"Avlest 15. oktober 2026.","table":"Vis tallene"},"hi":{"lede":"Strategy के अपने Myfxbook record से — Tag Markets का एक सामान्य account, 1:500 — 3 नवंबर 2024 से 14 अक्टूबर 2026 तक। हर bar एक महीने का फ़ायदा है; उसके नीचे का निशान उस महीने की सबसे बड़ी गिरावट है। 30 % fee से पहले। पिछले नतीजे, भविष्यवाणी नहीं।","stats":["कुल","औसत महीना","सबसे बड़ी गिरावट","Trades","जीत की दर"],"legend":["फ़ायदा","सबसे बड़ी गिरावट"],"notes":["24 में एक भी घाटे वाला महीना नहीं — इसका मतलब यह भी है कि यह record अभी ऐसे महीने से गुज़रा ही नहीं।","घ  بطاقة الاستراتيجية داخل CopyX قيمة Max DD (أعمق هبوط) قدرها 0.26 %. ونحن نعتمد رقم Myfxbook الأعمق، 0.86 %، لأن البطاقة لا توضّح كيف يُقاس رقمها."],"formula":"الأثر على إيداعك = هبوط الحساب بالنسبة المئوية × 24.","link":"تحقّق بنفسك على Myfxbook","read":"تاريخ القراءة: 15 أكتوبر 2026.","table":"اعرض الأرقام"},"ur":{"lede":"Strategy کے اپنے Myfxbook record سے — Tag Markets کا ایک عام account، 1:500 — 3 نومبر 2024 سے 14 اکتوبر 2026 تک۔ ہر bar ایک مہینے کا نفع ہے؛ اُس کے نیچے کا نشان اُس مہینے کی سب سے بڑی کمی ہے۔ 30 % fee سے پہلے۔ پرانے نتائج، کوئی پیشگوئی نہیں۔","stats":["کُل","اوسط مہینہ","سب سے بڑی کمی","Trades","جیت کی شرح"],"legend":["نفع","سب سے بڑی کمی"],"notes":["24 مہینوں میں ایک بھی نقصان والا مہینہ نہیں — اِس کا مطلب یہ بھی ہے کہ یہ record ابھی ایسے مہینے سے گزرا ہی نہیں۔","نقصان والے دن آتے ہیں: روزانہ کی 427 readings میں سے 49۔ سب سے بُرا، 3 جون 2025، −0.64 % تھا۔ 24× پر یہ آپ کے deposit کا تقریباً −15 % ہے، ایک دن میں؛ سب سے گہری کمی، −0.86 %، تقریباً −21 % ہے۔ Record میں ایک gap ہے، 20 اگست سے 12 ستمبر 2025 تک، جسے ایک ہی reading گنا جاتا ہے۔","اوسط نقصان ($134.97) اوسط نفع ($93.37) سے بڑا ہے۔ نتیجہ جیت کی اونچی شرح کی وجہ سے اچھا ہے، اِس لیے لگاتار نقصانات میں جتنا جاتا ہے، لگاتار جیت میں اُتنا واپس نہیں آتا۔","Account 5 % پر بند ہوتا ہے۔ Record کی سب سے گہری کمی، 0.86 %، اُس فاصلے کا تقریباً چھٹا حصہ ہے۔","یہاں کمی ہر دن کے closing balance پر ناپی گئی ہے؛ دن کے اندر وہ اور گہری ہو سکتی ہے۔","CopyX کے اندر strategy card پر Max DD (سب سے گہری کمی) 0.26 % دکھایا گیا ہے۔ ہم Myfxbook کا زیادہ گہرا 0.86 % استعمال کرتے ہیں، کیونکہ card یہ نہیں بتاتا کہ اُس کا عدد کیسے ناپا گیا ہے۔"],"formula":"آپ کے deposit پر اثر = account کی کمی % × 24۔","link":"Myfxbook پر خود دیکھیں","read":"15 اکتوبر 2026 کو پڑھا گیا۔","table":"اعداد دکھائیں"},"ar_rm":{"lede":"Min sijill al-istratijiya nafsiha 3ala Myfxbook — hisab Tag Markets 3adi bi leverage qadruh 1:500 — min 3 nufambar 2024 ila 14 uktubar 2026. Kull 3amud ribh shahr wahid; w al-3alama tahtah akbar hubut fi dhalik a /* «member» eller «leaders». Samme fil, samme CSS, to adresser: medlemmene
   skal ikke se lederverktoeyet i det hele tatt, og lederne trenger ikke
   scrolle gjennom guiden for aa finne det. */
const PAGE = "leaders";

/* An IB's sign-up link carries an opaque token (?e=...), not their IB number,
   so the whole link travels as ?ref= and only these hosts are accepted. */
const REF_ALLOWED_HOSTS = ["aitech.sonicpilot.io","copyxapp.com","www.copyxapp.com",
                           "aitech.ibportal.io","portal.tagmarkets.com","tagmarkets.com"];
const REF_HOUSE = "";

let lang = C.langs[0].code, sponsorUrl = null, pendingRef = null, sponsorName = "";
const $ = id => document.getElementById(id);
const conf = code => C.langs.find(l => l.code === code) || C.langs[0];
function store(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* Nothing becomes an href unless it is plain http(s). */
function safeUrl(u){
  try{ const p = new URL(String(u), location.href).protocol;
       return p === "https:" || p === "http:"; }catch(e){ return false; }
}
/* Images belong to this page. Anything off-origin is skipped. */
function sameOrigin(u){
  try{ return new URL(String(u), location.href).origin === location.origin; }catch(e){ return false; }
}
function validRef(raw){
  if(!raw) return null;
  let u;
  try{ u = new URL(String(raw).trim()); }catch(e){ return null; }
  if(u.protocol !== "https:") return null;
  return REF_ALLOWED_HOSTS.indexOf(u.hostname) !== -1 ? u : null;
}
/* «by» kommer fra URL-en og er dermed kontrollert av den som laget lenka.
   Den settes alltid med textContent, aldri innerHTML — men den filtreres
   ogsaa: bare bokstaver i et hvilket som helst skriftsystem, mellomrom,
   bindestrek og apostrof, og maks 24 tegn. Da kan et «navn» verken bli
   markup, en URL eller et avsnitt. */
function cleanName(raw){
  if(!raw) return "";
  let t = String(raw).trim().slice(0, 48);
  try{ t = t.replace(/[^\p{L}\p{M} '\-]/gu, ""); }
  catch(e){ t = t.replace(/[^A-Za-zÀ-ÿ '\-]/g, ""); }
  t = t.replace(/\s+/g, " ").trim().slice(0, 24);
  return t;
}
const urlName  = () => cleanName(new URLSearchParams(location.search).get("by"));
const urlRef    = () => validRef(new URLSearchParams(location.search).get("ref"));
const storedRef = () => validRef(load("aimpire.ref"));
function fingerprint(u){
  const t = u.searchParams.get("e") || u.search || u.pathname;
  return String(t).replace(/[^A-Za-z0-9]/g,"").slice(-6).toUpperCase();
}

/* Decided once, on load. Rendering never writes. A different link does not
   silently replace a remembered sponsor — that would let anyone re-tag
   someone else's lead just by having them open a page. We ask. */
function initSponsor(){
  const fromUrl = urlRef(), remembered = storedRef();
  if(!fromUrl){
    sponsorUrl = remembered;
    sponsorName = cleanName(load("aimpire.by"));
    return;
  }
  if(!remembered){
    store("aimpire.ref", fromUrl.href);
    sponsorName = urlName(); store("aimpire.by", sponsorName || null);
    sponsorUrl = fromUrl;
  }
  else if(remembered.href === fromUrl.href){
    sponsorUrl = remembered;
    sponsorName = urlName() || cleanName(load("aimpire.by"));
    store("aimpire.by", sponsorName || null);
  }
  else { sponsorUrl = remembered; sponsorName = cleanName(load("aimpire.by")); pendingRef = fromUrl; }
}
/* Hvilke steg som er gjort. Lagres lokalt per leser - aldri sendt noe sted. */
function doneSet(){
  /* Steg 6 (appene) kom inn 15.10. Avkryssing lagret foer det, for steg 6-9,
     flyttes ett hakk, saa ingen ser feil steg som gjort. Kjoeres én gang. */
  if(load("aimpire.done.v") !== "2"){
    const gml = (load("aimpire.done") || "").split(",").filter(function(x){ return x !== ""; });
    store("aimpire.done", gml.map(function(x){ const n = +x; return String(n >= 5 ? n + 1 : n); }).join(",") || null);
    store("aimpire.done.v", "2");
  }
  const raw = load("aimpire.done") || "";
  return new Set(raw.split(",").filter(function(x){ return x !== ""; }));
}
function toggleStep(i){
  const set = doneSet(), k = String(i);
  if(set.has(k)) set.delete(k); else set.add(k);
  store("aimpire.done", Array.from(set).join(","));
  render();
}
function clearSteps(){ store("aimpire.done", null); render(); }

function copyCode(btn, value, label){
  function done(){
    const tag = btn.querySelector(".c");
    if(tag) tag.textContent = (C.guide_ui[lang] || C.guide_ui.en).copied;
  }
  try{
    navigator.clipboard.writeText(value).then(done, function(){ fallback(); });
  }catch(e){ fallback(); }
  function fallback(){
    try{
      const t = document.createElement("textarea");
      t.value = value; t.setAttribute("readonly","");
      t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      document.execCommand("copy"); document.body.removeChild(t); done();
    }catch(e2){}
  }
}

function keepSponsor(){ pendingRef = null; render(); }
function switchSponsor(){
  if(pendingRef){
    store("aimpire.ref", pendingRef.href); sponsorUrl = pendingRef;
    sponsorName = urlName(); store("aimpire.by", sponsorName || null);
    pendingRef = null;
  }
  render();
}
function changeSponsor(){
  store("aimpire.ref", null); store("aimpire.by", null);
  sponsorUrl = null; sponsorName = ""; pendingRef = null;
  if(location.search) history.replaceState(null,"",location.pathname);
  render();
}
function destination(){
  return sponsorUrl
    ? { url:sponsorUrl.href, host:sponsorUrl.hostname, fp:fingerprint(sponsorUrl) }
    : { url:REF_HOUSE, host:null, fp:null };
}

function makeLink(){
  const u = validRef($("ld-in").value), out = $("ld-out"), L = C.leaders[lang] || C.leaders.en;
  out.hidden = false; out.textContent = "";
  const b = document.createElement("b");
  if(!u){ out.className = "out bad"; b.textContent = L.bad; out.appendChild(b); return; }
  out.className = "out";
  b.textContent = L.ok; out.appendChild(b);
  const nm = cleanName($("ld-name").value);
  let link = location.origin + location.pathname + "?ref=" + encodeURIComponent(u.href);
  if(nm) link += "&by=" + encodeURIComponent(nm);
  out.appendChild(document.createTextNode(link));
  try{ navigator.clipboard.writeText(link); }catch(e){}
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined) n.textContent = text;
  return n;
}

function rowsFor(items, dest){
  const frag = document.createDocumentFragment();
  const list = el("div","rows");
  let any = false;
  items.forEach(function(i){
    const href = i.url === "__REF__" ? dest.url : i.url;
    if(!href || !safeUrl(href)) return;
    const pair = i[lang] || i.en;
    any = true;
    const a = el("a", i.primary ? "slab" : "row");
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    /* Tjenestens eget ikon, saa man kjenner igjen hvor man havner. */
    if(i.icon && sameOrigin(i.icon) && !i.primary){
      const im = el("img","ri"); im.src = i.icon; im.alt = ""; im.width = 30; im.height = 30;
      im.loading = "lazy"; im.decoding = "async"; a.appendChild(im); a.classList.add("ico");
    }
    a.appendChild(el("span","t",pair[0]));
    a.appendChild(el("span","s",pair[1]));
    if(i.primary){ frag.appendChild(a); }
    else { a.appendChild(el("span","go","›")); list.appendChild(a); }
  });
  if(list.children.length) frag.appendChild(list);
  return any ? frag : null;
}

/* Tall med tegn i hoeyre-til-venstre-tekst. $, x, % og : er «svake» tegn i
   Unicode-bidi og havner paa feil side av tallet: $109 ble vist som 109$, 12x
   som x12 - og 1:30 kan bli 30:1, som snur betydningen. Hver slik bit pakkes
   i usynlige isolater (LRI ... PDI) saa den alltid leses venstre-til-hoeyre.
   Kjoeres paa hver render, saa nytt innhold dekkes uten at noen husker det. */
const FIGURE_RX = new RegExp([
  "\\d[\\d,.]*(?::\\d+)?(?:\\s?[\\u00f7\\u00d7=]\\s?\\d[\\d,.]*(?::\\d+)?)+(?:\\s?%)?",  // 1 / 24 = 4.2 %, 24 x 30 = 720:1 (hele formelen)
  "\\$\\s?\\d[\\d,.]*",                 // $109  $2,616  $0.60
  "\\d[\\d,.]*\\s?\\u00d7",              // 12x  24x
  "\\u00d7\\s?\\d[\\d,.]*",              // x 0.70
  "\\d[\\d,.]*\\s?%",                    // 10%  5 %
  "\\d+(?:\\s?/\\s?\\d+)+",              // 70 / 5 / 25
  "\\d+:\\d+",                           // 1:30  1:500
  "#[A-Za-z][A-Za-z0-9]*",                 // #Aitech
  "@[A-Za-z0-9_][A-Za-z0-9_.]*[A-Za-z0-9_]"  // @aim.pire
].join("|"), "g");
function isolateFigures(){
  if(document.documentElement.dir !== "rtl") return;
  const root = document.querySelector(".shell");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      const p = n.parentNode;
      if(!p || p.closest("svg, script, style, [dir=ltr]")) return NodeFilter.FILTER_REJECT;
      if(n.data.indexOf("\u2066") !== -1) return NodeFilter.FILTER_REJECT;
      FIGURE_RX.lastIndex = 0;
      return FIGURE_RX.test(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(n){
    n.data = n.data.replace(FIGURE_RX, function(m){ return "\u2066" + m + "\u2069"; });
  });
}
