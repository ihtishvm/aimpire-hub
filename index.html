idan la tu3add tawaqqu3an."],"method":"Al-tariqa: kull shahr = al-mablagh × 24 × (ribh dhalik al-shahr − al-3umula − al-rasm). W al-3umula muqaddara min al-lots allati yuzhiruha Myfxbook, 3ala hisab qimatuh $130,000; w in kan hisab al-istratijiya yadfa3 al-3umula nafsaha aslan, fal-taklifa al-fi3liya aqall. Al-mabaligh al-saghira la yumkin naskhuha bi-diqqa: bi-waqi3 nahwa 0.17 lot li-kull safqa 3ala $130,000, fa'inna ida3an aqall min nahwa $330 3ind 24× sayahtaj ila safaqat asghar min 0.01 lot, w huwa al-hadd al-adna al-mu3tad. Amma kayf yata3amal CopyX ma3 dhalik faghayr manshur.","disclaimer":"Nata'ij sabiqa mutabbaqa 3ala mablaghak. Laysat tawaqqu3an w la damanan w la nasiha. La tada3 illa ma tastati3 khasaratah kamilan.","rows":["Qabl al-takalif","Al-3umula, $10 li-kull lot","Rasm al-ada', 30 %","Ma yabqa lak"],"range":"Raqaman, li-anna ahadan la yanshur kayf yusawwa rasm al-30 %. Fa'in suwwiya usbu3iyan 3ala safi al-natija, yabqa lak al-raqam al-a3la. W in suwwiya 3ala kull yawm rabih, yabqa lak al-raqam al-adna. W in suwwiya 3ala kull safqa, faqad yabqa lak aqall min dhalik aydan."},"ur_rm":{"lede":"Ek raqam aur ek muddat daalein. Yeh record ke asal mahinon ko aap ke paise par 24× se laagu karta hai, $10 fi lot ka commission aur 30 % fee kaatta hai, aur yeh maan kar chalta hai keh aap har mahine profit nikal lete hain. Yaani pichhla record aap ki raqam par laga kar dikhaya gaya hai — na peshgoi, na waada.","amount":"Aap ki daali hui raqam ($)","period":"Muddat","periods":["Pichhle 6 mahine","Pichhle 12 mahine","Saare 23 mahine"],"total":"Aap ke paas jo bachta, poori muddat mein","months":"Aap ka sab se achha aur sab se bura mahina","risk":"Wohi 24×, neeche jaate hue","risks":["Trading balance mein 4.2 % ki kami poore {A} le jaati hai; account 5 % par band hota hai.","Record ka sab se bura din (−0.64 %) aap ke {A} mein se {D} ek din mein le jaata.","Record mein koi nuqsan wala mahina nahi, is liye yeh calculator aap ko aisa mahina dikha hi nahi sakta. Isi wajah se yeh peshgoi nahi hai."],"method":"Tareeqa: har mahina = raqam × 24 × (us mahine ka nafa − commission − fee). Commission ka andaza Myfxbook mein dikhaye gaye lots se lagaya gaya hai, $130,000 ke account par; agar strategy account pehle hi yahi commission ada karta hai to asal laagat kam hai. Chhoti raqamein theek theek copy nahi ho saktin: $130,000 par fi trade taqreeban 0.17 lot ke hisaab se, 24× par taqreeban $330 se kam ke deposit ko 0.01 lot se chhoti trades darkaar hongi, jo aam taur par kam az kam had hai. CopyX ise kaise sambhalta hai, yeh shaye nahi kiya gaya.","disclaimer":"Purane nataij aap ki raqam par laagu. Na peshgoi, na zamanat, na mashwara. Sirf utna daalein jise poora khona aap bardasht kar sakein.","rows":["Laagat se pehle","Commission, $10 fi lot","Performance fee, 30 %","Aap ke paas jo bachta hai"],"range":"Do raqamein, kyunkeh koi yeh shaye nahi karta keh 30 % fee kis tarah katti hai. Agar yeh har hafte net nateeje par kate to aap ke paas zyada wali raqam bachti hai. Agar jeetne wale har din par kate to aap ke paas kam wali raqam bachti hai. Har trade par kate to is se bhi kam bach sakta hai."}},"bonuses":{"en":{"lede":"What the programme offers, with what each part asks of you — so you can see the whole picture. Most of these need a team volume very few people ever reach; they are listed here as information, not as a goal. Figures from AiTech's presentation of 3 October 2026, the IB Portal and the CopyX app, read on 15 October 2026; the rule for opening levels comes from a presentation other teams use.","labels":["What you get","What it takes"],"items":[["Profit sharing","2.5 % of each trade's profit, on each of ten levels. Paid weekly, in USDT.","At least $250 in trading yourself, which opens the first three levels. Levels four to ten open as people you introduced directly each have $250 in trading — up to ten of them. This rule is from a presentation other teams use; the portal itself only shows directs and unlocked levels."],["Lot commission","Per lot traded: $2.00, $1.50, $1.00, $1.00, then $0.50 on levels five to ten — up to $8.50 per lot. Paid weekly.","The same open levels as profit sharing. The broker's help centre adds that a trade only counts for commission if it stays open for at least 3 minutes."],["CPA Earnings","A monthly percentage of the new money deposited in your network: 1 %, 2 %, 3.5 %, 5 %, and on up to 7.5 %.","$10,000 of new deposits in a month for 1 % (from your direct level), then $50,000, $200,000 and $1,000,000, up to $100,000,000 for 7.5 %. Counted after the 50 % rule, and paid as the difference to anyone below you who qualifies too."],["Leader Pool 1","A share of a monthly pool. The presentation gives an ambassador rate of $2.00 per lot.","$500,000 of team volume in a month after the 50 % rule — no more than $250,000 of it from your strongest line."],["Leader Pool 2","A share of a second monthly pool.","$1,000,000 of team volume in a month after the 50 % rule — no more than $500,000 per share from your strongest line."],["General bonus (European programme)","$2.00 per lot plus a bonus payment.","Steps at $10,000, $50,000, $200,000 and $500,000 of team volume, after the 50 % rule. Shown in the CopyX app."],["October prize draw (Sonic Referral Challenge)","Prizes of $10,000 each, drawn from tickets. The poster names 200 winners and $3 million in total — those two figures do not add up.","One ticket for every 2 new people you introduce directly in October who each reach at least $250. No cap on tickets."],["Travel voucher","A $2,000 travel voucher or the same in USDT, once a year.","$50,000 of new monthly active balance in your whole network, three months in a row, counted 50/50 and without your directs' own deposits."],["Watch up to $15,000","A luxury watch worth up to $15,000.","Qualify for Leader Pool 1 two months in a row."],["Watch up to $25,000","A luxury watch worth up to $25,000.","Qualify for Leader Pool 2 two months in a row."],["Home up to $1,200,000","A home worth up to $1,200,000.","Qualify for Leader Pool 2 with at least three shares of $1,000,000 each, six months in a row."],["Sonic Pool, Profit Pool, NeoFX Pool, Super Sonic Bonus","Listed by name in the IB Portal.","Their conditions are not shown in the portal or the presentation. Ask your sponsor before you count on any of them."]],"note":"Cash payouts are made in USDT, only to accounts that qualify, and the programme is marked «subject to local restrictions». The international programme applies outside Europe. None of this is income you can count on."},"no":{"lede":"Det programmet tilbyr, med hva hver del krever av deg — så du kan se hele bildet. De fleste av disse krever et teamvolum svært få noen gang når; de står her som informasjon, ikke som et mål. Tall fra AiTechs presentasjon 3. oktober 2026, IB-portalen og CopyX-appen, lest 15. oktober 2026; regelen for å åpne nivåer kommer fra en presentasjon som andre team bruker.","labels":["Hva du får","Hva det krever"],"items":[["Profittdeling","2,5 % av profitten på hver handel, på hvert av ti nivåer. Betales ukentlig, i USDT.","Minst $250 i trading selv, som åpner de tre første nivåene. Nivå fire til ti åpnes etter hvert som personer du har introdusert direkte, har $250 i trading hver — opptil ti av dem. Denne regelen kommer fra en presentasjon som andre team bruker; portalen selv viser bare directs og opplåste nivåer."],["Provisjon per lot","Per lot som handles: $2,00, $1,50, $1,00, $1,00, så $0,50 på nivå fem til ti — opptil $8,50 per lot. Betales ukentlig.","De samme åpne nivåene som for profittdelingen. Meglerens hjelpesenter legger til at en handel bare teller for provisjon hvis den står åpen i minst 3 minutter."],["CPA Earnings","En månedlig prosentandel av de nye pengene som settes inn i nettverket ditt: 1 %, 2 %, 3,5 %, 5 % og videre opp til 7,5 %.","$10 000 i nye innskudd i løpet av en måned for 1 % (fra ditt direkte nivå), deretter $50 000, $200 000 og $1 000 000, opp til $100 000 000 for 7,5 %. Regnes etter 50 %-regelen, og utbetales som differansen mot alle under deg som også kvalifiserer."],["Leader Pool 1","En andel av en månedlig pool. Presentasjonen oppgir en ambassadørsats på $2,00 per lot.","$500 000 i teamvolum i løpet av en måned etter 50 %-regelen — høyst $250 000 av det fra din sterkeste linje."],["Leader Pool 2","En andel av en annen månedlig pool.","$1 000 000 i teamvolum i løpet av en måned etter 50 %-regelen — høyst $500 000 per andel fra din sterkeste linje."],["Generell bonus (det europeiske programmet)","$2,00 per lot pluss en bonusutbetaling.","Trinn ved $10 000, $50 000, $200 000 og $500 000 i teamvolum, etter 50 %-regelen. Vises i CopyX-appen."],["Premietrekning i oktober (Sonic Referral Challenge)","Premier på $10 000 hver, trukket blant lodd. Plakaten oppgir 200 vinnere og $3 millioner til sammen — de to tallene går ikke opp.","Ett lodd for hver 2 nye personer du introduserer direkte i oktober, og som hver når minst $250. Ingen grense for antall lodd."],["Reisegavekort","Et reisegavekort på $2 000 eller det samme i USDT, én gang i året.","$50 000 i ny månedlig aktiv saldo i hele nettverket ditt, tre måneder på rad, regnet 50/50 og uten innskuddene dine directs selv har gjort."],["Klokke verdt opptil $15 000","En luksusklokke verdt opptil $15 000.","Kvalifiser for Leader Pool 1 to måneder på rad."],["Klokke verdt opptil $25 000","En luksusklokke verdt opptil $25 000.","Kvalifiser for Leader Pool 2 to måneder på rad."],["Bolig verdt opptil $1 200 000","En bolig verdt opptil $1 200 000.","Kvalifiser for Leader Pool 2 med minst tre andeler på $1 000 000 hver, seks måneder på rad."],["Sonic Pool, Profit Pool, NeoFX Pool og Super Sonic Bonus","Listet med navn i IB-portalen.","Vilkårene deres vises verken i portalen eller i presentasjonen. Spør sponsoren din før du regner med noen av dem."]],"note":"Kontantutbetalinger skjer i USDT, bare til kontoer som kvalifiserer, og programmet er merket «subject to local restrictions». Det internasjonale programmet gjelder utenfor Europa. Ingenting av dette er inntekt du kan regne med."},"hi":{"lede":"Programme जो देता है, और उसका हर हिस्सा आपसे क्या माँगता है — ताकि आप पूरी तस्वीर देख सकें। इनमें से ज़्यादातर के लिए इतना team volume चाहिए जितने तक बहुत कम लोग कभी पहुँचते हैं; इन्हें यहाँ जानकारी के तौर पर दिया गया है, लक्ष्य के तौर पर नहीं। आँकड़े AiTech के 3 अक्टूबर 2026 के presentation, IB Portal और CopyX app से हैं, जिन्हें 15 अक्टूबर 2026 को पढ़ा गया; levels खुलने का नियम एक ऐसे presentation से है जिसे दूसरी teams इस्तेमाल करती हैं।","labels":["आपको क्या मिलता है","इसके लिए क्या चाहिए"],"items":[["Profit sharing","हर trade के profit का 2.5 %, दस levels में से हर एक पर। भुगतान हर हफ़्ते, USDT में।","ख़ुद आपके कम से कम $250 trading में, जिससे पहले तीन levels खुलते हैं। Levels चार से दस, जैसे-जैसे आपके सीधे जोड़े हुए लोगों में से हर एक के $250 trading में होते हैं, वैसे-वैसे खुलते हैं — ऐसे दस लोगों तक। यह नियम एक ऐसे presentation से है जिसे दूसरी teams इस्तेमाल करती हैं; portal ख़ुद सिर्फ़ directs और खुले हुए levels दिखाता है।"],["Lot commission","Trade हुए हर lot पर: $2.00, $1.50, $1.00, $1.00, फिर levels पाँच से दस पर $0.50 — प्रति lot $8.50 तक। भुगतान हर हफ़्ते।","वही खुले levels जो profit sharing के लिए हैं। Broker का help centre यह भी बताता है कि कोई trade commission के लिए तभी गिनी जाती है जब वह कम से कम 3 मिनट खुली रहे।"],["CPA Earnings","आपके network में जमा हुए नए पैसे का मासिक प्रतिशत: 1 %, 2 %, 3.5 %, 5 %, और आगे 7.5 % तक।","1 % के लिए एक महीने में $10,000 की नई जमा (आपके direct level से), फिर $50,000, $200,000 और $1,000,000, और 7.5 % के लिए $100,000,000 तक। 50 % rule के बाद गिना जाता है, और भुगतान अंतर के रूप में होता है, आपके नीचे के उन सबके मुक़ाबले जो ख़ुद भी qualify करते हैं।"],["Leader Pool 1","एक मासिक pool का हिस्सा। Presentation में $2.00 प्रति lot की एम्बेसडर दर बताई गई है।","50 % rule के बाद एक महीने में $500,000 का team volume — इसमें से $250,000 से ज़्यादा आपकी सबसे मज़बूत line से नहीं।"],["Leader Pool 2","एक दूसरे मासिक pool का हिस्सा।","50 % rule के बाद एक महीने में $1,000,000 का team volume — हर हिस्से के लिए $500,000 से ज़्यादा आपकी सबसे मज़बूत line से नहीं।"],["General bonus (यूरोप वाला programme)","$2.00 प्रति lot और एक bonus payment।","50 % rule के बाद $10,000, $50,000, $200,000 और $500,000 के team volume पर क़दम। ये CopyX app में दिखते हैं।"],["अक्टूबर का इनामी ड्रॉ (Sonic Referral Challenge)","इनाम, हर एक $10,000 का, टिकटों के ड्रॉ से निकलते हैं। Poster पर 200 विजेता और कुल $3 मिलियन लिखे हैं — ये दोनों आँकड़े आपस में मेल नहीं खाते।","अक्टूबर में आप जिन नए लोगों को सीधे जोड़ते हैं, उनमें से हर 2 पर एक टिकट — बशर्ते उनमें से हर एक कम से कम $250 तक पहुँचे। टिकटों की कोई सीमा नहीं।"],["ट्रैवल वाउचर","$2,000 का ट्रैवल वाउचर या उतना ही USDT में, साल में एक बार।","आपके पूरे network में $50,000 का नया मासिक active balance, लगातार तीन महीने, 50/50 के हिसाब से गिना हुआ और आपके directs की अपनी जमा रक़म के बिना।"],["$15,000 तक की घड़ी","$15,000 तक की क़ीमत वाली एक लग्ज़री घड़ी।","लगातार दो महीने Leader Pool 1 के लिए qualify करें।"],["$25,000 तक की घड़ी","$25,000 तक की क़ीमत वाली एक लग्ज़री घड़ी।","लगातार दो महीने Leader Pool 2 के लिए qualify करें।"],["$1,200,000 तक का घर","$1,200,000 तक की क़ीमत वाला एक घर।","लगातार छह महीने Leader Pool 2 के लिए qualify करें, कम से कम तीन हिस्सों के साथ, हर एक $1,000,000 का।"],["Sonic Pool, Profit Pool, NeoFX Pool और Super Sonic Bonus","IB Portal में नाम से दर्ज।","इनकी शर्तें न portal में दिखाई गई हैं, न presentation में। इनमें से किसी पर भी भरोसा करने से पहले अपने sponsor से पूछें।"]],"note":"नक़द भुगतान USDT में किए जाते हैं, सिर्फ़ उन accounts को जो qualify करते हैं, और programme पर लिखा है «subject to local restrictions»। अंतरराष्ट्रीय programme यूरोप से बाहर लागू होता है। इसमें से कुछ भी ऐसी आमदनी नहीं जिस पर आप भरोसा कर सकें।"},"ar":{"lede":"ما يقدّمه البرنامج، مع ما يتطلّبه منك كل جزء — لترى الصورة كاملة. معظمها يحتاج إلى حجم تداول للفريق لا يبلغه إلا قلّة قليلة؛ وهي مذكورة هنا للعلم، لا كهدف. الأرقام من عرض AiTech بتاريخ 3 أكتوبر 2026 ومن الـ IB Portal وتطبيق CopyX، كما قُرئت في 15 أكتوبر 2026؛ أما قاعدة فتح المستويات فمصدرها عرض تستخدمه فِرق أخرى.","labels":["ما تحصل عليه","ما يتطلّبه"],"items":[["تقاسم الأرباح","2.5 % من ربح كل صفقة، في كل مستوى من المستويات العشرة. يُدفع أسبوعياً بـ USDT.","أن يكون لديك أنت $250 على الأقل في التداول، وهذا يفتح المستويات الثلاثة الأولى. وتُفتح المستويات من الرابع إلى العاشر كلما أصبح لدى كلٍّ من الأشخاص الذين عرّفتهم مباشرةً $250 في التداول — حتى عشرة منهم. هذه القاعدة مصدرها عرض تستخدمه فِرق أخرى؛ أما الـ portal نفسه فلا يُظهر إلا الـ directs والمستويات المفتوحة."],["عمولة الـ lot","لكل lot يُتداوَل: ‏$2.00 و$1.50 و$1.00 و$1.00، ثم $0.50 في المستويات من الخامس إلى العاشر — حتى $8.50 لكل lot. تُدفع أسبوعياً.","المستويات المفتوحة نفسها كما في تقاسم الأرباح. ويضيف مركز مساعدة الـ broker أن الصفقة لا تُحتسب في العمولة إلا إذا بقيت مفتوحة 3 دقائق على الأقل."],["CPA Earnings","نسبة شهرية من المال الجديد المودَع في شبكتك: 1 % و2 % و3.5 % و5 %، وصولاً إلى 7.5 %.","إيداعات جديدة قدرها $10,000 في شهر واحد للحصول على 1 % (من مستواك المباشر)، ثم $50,000 و$200,000 و$1,000,000، وحتى $100,000,000 للحصول على 7.5 %. تُحتسب بعد تطبيق قاعدة الـ 50 %، وتُدفع على شكل الفرق بينك وبين كل من تحتك ممن يتأهّل هو أيضاً."],["Leader Pool 1","حصّة من pool شهري. ويذكر العرض سعراً للسفير قدره $2.00 لكل lot.","حجم تداول للفريق قدره $500,000 في شهر واحد بعد تطبيق قاعدة الـ 50 % — على ألّا يأتي أكثر من $250,000 منه من أقوى خطّ لديك."],["Leader Pool 2","حصّة من pool شهري ثانٍ.","حجم تداول للفريق قدره $1,000,000 في شهر واحد بعد تطبيق قاعدة الـ 50 % — على ألّا يأتي أكثر من $500,000 لكل حصّة من أقوى خطّ لديك."],["المكافأة العامة (البرنامج الأوروبي)","مبلغ $2.00 لكل lot مع دفعة مكافأة.","درجات عند $10,000 و$50,000 و$200,000 و$500,000 من حجم تداول الفريق، بعد تطبيق قاعدة الـ 50 %. وتظهر في تطبيق CopyX."],["قرعة جوائز أكتوبر (Sonic Referral Challenge)","جوائز قيمة كلٍّ منها $10,000، توزَّع بالقرعة بين التذاكر. ويذكر الملصق 200 فائز و$3 ملايين إجمالاً — وهذان الرقمان لا يتوافقان حسابياً.","تذكرة واحدة عن كل 2 من الأشخاص الجدد الذين تعرّفهم مباشرةً في أكتوبر ويبلغ كلٌّ منهم $250 على الأقل. ولا حدّ لعدد التذاكر."],["قسيمة سفر","قسيمة سفر بقيمة $2,000 أو ما يعادلها بـ USDT، مرة واحدة في السنة.","رصيد نشط شهري جديد قدره $50,000 في شبكتك كلها، لثلاثة أشهر متتالية، يُحتسب بنسبة 50/50 ومن دون إيداعات الـ directs الخاصين بك أنفسهم."],["ساعة بقيمة تصل إلى $15,000","ساعة فاخرة تصل قيمتها إلى $15,000.","أن تتأهّل لـ Leader Pool 1 شهرين متتاليين."],["ساعة بقيمة تصل إلى $25,000","ساعة فاخرة تصل قيمتها إلى $25,000.","أن تتأهّل لـ Leader Pool 2 شهرين متتاليين."],["منزل بقيمة تصل إلى $1,200,000","منزل تصل قيمته إلى $1,200,000.","أن تتأهّل لـ Leader Pool 2 بثلاث حصص على الأقل، قيمة كلٍّ منها $1,000,000، ستة أشهر متتالية."],["Sonic Pool وProfit Pool وNeoFX Pool وSuper Sonic Bonus","مذكورة بالاسم في الـ IB Portal.","لا تظهر شروطها في الـ portal ولا في العرض. اسأل الـ sponsor قبل أن تعتمد على أيٍّ منها."]],"note":"تُصرف المدفوعات النقدية بـ USDT، وللحسابات المؤهَّلة فقط، والبرنامج موصوف بأنه «subject to local restrictions». والبرنامج الدولي ينطبق خارج أوروبا. ولا شيء من هذا دخلٌ يمكنك الاعتماد عليه."},"ur":{"lede":"Programme جو دیتا ہے، اور اُس کا ہر حصہ آپ سے کیا مانگتا ہے — تاکہ آپ پوری تصویر دیکھ سکیں۔ اِن میں سے زیادہ تر کے لیے اِتنا team volume چاہیے جس تک بہت کم لوگ کبھی پہنچتے ہیں؛ یہ یہاں معلومات کے طور پر دیے گئے ہیں، ہدف کے طور پر نہیں۔ اعداد AiTech کے 3 اکتوبر 2026 کے presentation، IB Portal اور CopyX app سے ہیں، جو 15 اکتوبر 2026 کو پڑھے گئے؛ levels کھلنے کا اصول ایک ایسے presentation سے ہے جسے دوسری teams استعمال کرتی ہیں۔","labels":["آپ کو کیا ملتا ہے","اِس کے لیے کیا چاہیے"],"items":[["Profit sharing","ہر trade کے profit کا 2.5 %، دس levels میں سے ہر ایک پر۔ ادائیگی ہر ہفتے، USDT میں۔","خود آپ کے کم از کم $250 trading میں، جس سے پہلے تین levels کھلتے ہیں۔ Levels چار سے دس، جیسے جیسے آپ کے براہِ راست بلائے ہوئے لوگوں میں سے ہر ایک کے $250 trading میں ہوں، ویسے ویسے کھلتے ہیں — ایسے دس لوگوں تک۔ یہ اصول ایک ایسے presentation سے ہے جسے دوسری teams استعمال کرتی ہیں؛ portal خود صرف directs اور کھلے ہوئے levels  आप USDT ख़रीदना चाहते हैं।","अपनी पसंद का पेमेंट तरीक़ा चुनें। उदाहरण के लिए, अगर मर्चेंट सपोर्ट करता हो तो आप Easypaisa या JazzCash इस्तेमाल कर सकते हैं।","Binance आपको आपकी रक़म और पेमेंट के तरीक़े के हिसाब से उपलब्ध मर्चेंट दिखाएगा।"]],["मर्चेंट के रिव्यूज़ चेक करें",["मर्चेंट चुनने से पहले उसके रिव्यूज़ और रेटिंग्स अच्छी तरह चेक करें।","यह पक्का करें कि मर्चेंट वेरिफ़ाइड हो और उसकी ट्रांज़ैक्शन हिस्ट्री अच्छी हो।","उसके पूरे हो चुके ट्रांज़ैक्शन की संख्या और ऑर्डर कम्प्लीशन रेट भी चेक करें।"]],["मर्चेंट से संपर्क करें",["अपनी पसंद का वेरिफ़ाइड मर्चेंट चुनें।","उसके चैट ऑप्शन में जाकर मैसेज करें और पूछें कि क्या वह इस समय उपलब्ध है या नहीं।","ट्रांज़ैक्शन आगे बढ़ाने से पहले मर्चेंट के जवाब का इंतज़ार करें।"]],["पेमेंट ट्रांसफ़र करें",["मर्चेंट की ओर से उपलब्धता की पुष्टि के बाद, ऑर्डर में दी गई अकाउंट जानकारी के अनुसार पेमेंट ट्रांसफ़र करें।","यह पक्का करें कि पाने वाले के अकाउंट का नाम वही हो जो Binance P2P ऑर्डर में दर्ज है।","सिर्फ़ वही पेमेंट तरीक़ा इस्तेमाल करें जिस पर ऑर्डर में सहमति हुई हो।","अगर आप P2P पर नए हैं तो छोटी रक़म से ट्रांज़ैक्शन शुरू करें और Binance की तय की गई सीमाओं और नियमों का पालन करें।"]],["USDT के ट्रांज़ैक्शन की पुष्टि करें",["पेमेंट करने के बाद, ऑर्डर में Paid का ऑप्शन सिर्फ़ तभी चुनें जब आप सच में पेमेंट ट्रांसफ़र कर चुके हों।","मर्चेंट की ओर से USDT रिलीज़ किए जाने का इंतज़ार करें।","जब USDT आपके Binance अकाउंट में आ जाए तो चेक करें कि पूरी और सही रक़म मिली है।"]],["ज़रूरी सुरक्षा सावधानियाँ",["हमेशा ऐसा वेरिफ़ाइड मर्चेंट चुनें जिसके रिव्यूज़ अच्छे हों और ट्रांज़ैक्शन हिस्ट्री मज़बूत हो।","अगर अकाउंट का नाम ऑर्डर में दी गई जानकारी से अलग हो तो पेमेंट ट्रांसफ़र न करें।","अगर आप USDT बेच रहे हैं तो अपने अकाउंट में पेमेंट मिलने की ख़ुद पुष्टि किए बिना कभी भी USDT रिलीज़ न करें।","सारी बातचीत और ट्रांज़ैक्शन की जानकारी Binance के ऑफ़िशियल P2P चैट और ऑर्डर सिस्टम में सुरक्षित रखें।","सिर्फ़ वेरिफ़ाइड बैज देखकर मर्चेंट पर पूरा भरोसा न करें; उसकी ट्रांज़ैक्शन हिस्ट्री भी चेक करें और Binance की सिक्योरिटी गाइडलाइंस का पालन करें।"]]]},"ur_rm":{"title":"Binance P2P ke zariye USDT khareedne ka marhala waar tareeqa","steps":[["Binance kholein aur P2P muntakhib karein",["Sab se pehle Binance app kholein aur is mein P2P ka option muntakhib karein.","Hamesha aise merchant ka intikhab karein jo verified ho aur jis ki saakh achi ho."]],["Express ka option muntakhib karein",["P2P mein ja kar Express ka option muntakhib karein.","Woh raqam darj karein jis ke ewaz aap USDT khareedna chahte hain.","Apni pasand ka payment tareeqa muntakhib karein. Misaal ke taur par, agar merchant support karta ho to aap Easypaisa ya JazzCash istemal kar sakte hain.","Binance aap ko aap ki raqam aur payment ke tareeqe ke mutabiq dastiyab merchants dikhayega."]],["Merchant ke reviews check karein",["Merchant muntakhib karne se pehle is ke reviews aur ratings achi tarah check karein.","Is baat ko yaqeeni banayein keh merchant verified ho aur is ki transaction history achi ho.","Is ki mukammal hone wali transactions ki tadaad aur order completion rate bhi check karein."]],["Merchant se rabta karein",["Apni pasand ke verified merchant ko muntakhib karein.","Is ke chat option mein ja kar message karein aur poochein keh aaya woh is waqt dastiyab hai ya nahi.","Transaction aage barhane se pehle merchant ke jawab ka intezar karein."]],["Payment transfer karein",["Merchant ki janib se dastiyabi ki tasdeeq ke baad, order mein di gayi account tafseelat ke mutabiq payment transfer karein.","Is baat ko yaqeeni banayein keh wusool kunindah ke account ka naam wohi ho jo Binance P2P order mein darj hai.","Sirf wohi payment tareeqa istemal karein jis par order mein ittefaq kiya gaya ho.","Agar aap P2P par naye hain to chhoti raqam se transaction shuru karein aur Binance ki muqarrar karda hudood aur qawaid par amal karein."]],["USDT ki transaction ki tasdeeq karein",["Payment karne ke baad, order mein Paid ka option sirf usi waqt muntakhib karein jab aap waqai payment transfer kar chuke hon.","Merchant ki janib se USDT release karne ka intezar karein.","Jab USDT aap ke Binance account mein aa jaaye to check karein keh poori aur durust raqam mausool hui hai."]],["Aham hifazati ehtiyatein",["Hamesha aise verified merchant ka intikhab karein jis ke reviews ache hon aur transaction history mazboot ho.","Agar account ka naam order mein di gayi tafseelat se mukhtalif ho to payment transfer na karein.","Agar aap USDT farokht kar rahe hain to apne account mein payment mausool hone ki khud tasdeeq kiye baghair kabhi bhi USDT release na karein.","Tamam guftagu aur transaction ki tafseelat Binance ke official P2P chat aur order system mein mehfooz rakhein.","Sirf verified badge dekh kar merchant par mukammal bharosa na karein; is ki transaction history bhi check karein aur Binance ki security guidelines par amal karein."]]],"lede":"Abhi USDT nahi hai? Yahan dekhein keh Binance P2P par ise mehfooz tareeqe se kaise khareedein — ek video, aur Aimpire ki apni marhala waar guide.","watch":"YouTube par video dekhein"}},"jump":{"en":{"results":"Track record","calc":"Calculator","withdraw":"Withdrawals","ib":"IB & bonuses","sonic":"Sonic"},"no":{"results":"Historikk","calc":"Kalkulator","withdraw":"Uttak","ib":"IB og bonuser","sonic":"Sonic"},"hi":{"results":"Record","calc":"कैलकुलेटर","withdraw":"Withdrawal","ib":"IB और बोनस","sonic":"Sonic"},"ar":{"results":"السجلّ","calc":"الحاسبة","withdraw":"السحب","ib":"IB والمكافآت","sonic":"Sonic"},"ur":{"results":"Record","calc":"کیلکولیٹر","withdraw":"Withdrawal","ib":"IB اور بونس","sonic":"Sonic"},"ar_rm":{"results":"Al-sijill","calc":"Al-hasiba","withdraw":"Al-sahb","ib":"IB wal-mukafa'at","sonic":"Sonic"},"ur_rm":{"results":"Record","calc":"Calculator","withdraw":"Withdrawal","ib":"IB aur bonus","sonic":"Sonic"}}};

/* Images belong to this page. Anything off-origin is skipped. */
function sameOrigin(u){
  try{ return new URL(String(u), location.href).origin === location.origin; }catch(e){ return false; }
}
function validRef(raw){
  if(!raw) return null;
  let u;
  try{ u = new URL(String(raw).trim()); }catch(e){ return null; }
  if(u.protocol !== "https:") return null;
  return REF_ALLOWED_HOSTS.indexOf(u.hostname) !== -1 ? u : null;
}
/* «by» kommer fra URL-en og er dermed kontrollert av den som laget lenka.
   Den settes alltid med textContent, aldri innerHTML — men den filtreres
   ogsaa: bare bokstaver i et hvilket som helst skriftsystem, mellomrom,
   bindestrek og apostrof, og maks 24 tegn. Da kan et «navn» verken bli
   markup, en URL eller et avsnitt. */
function cleanName(raw){
  if(!raw) return "";
  let t = String(raw).trim().slice(0, 48);
  try{ t = t.replace(/[^\p{L}\p{M} '\-]/gu, ""); }
  catch(e){ t = t.replace(/[^A-Za-zÀ-ÿ '\-]/g, ""); }
  t = t.replace(/\s+/g, " ").trim().slice(0, 24);
  return t;
}
const urlName  = () => cleanName(new URLSearchParams(location.search).get("by"));
const urlRef    = () => validRef(new URLSearchParams(location.search).get("ref"));
const storedRef = () => validRef(load("aimpire.ref"));
function fingerprint(u){
  const t = u.searchParams.get("e") || u.search || u.pathname;
  return String(t).replace(/[^A-Za-z0-9]/g,"").slice(-6).toUpperCase();
}

/* Decided once, on load. Rendering never writes. A different link does not
   silently replace a remembered sponsor — that would let anyone re-tag
   someone else's lead just by having them open a page. We ask. */
function initSponsor(){
  const fromUrl = urlRef(), remembered = storedRef();
  if(!fromUrl){
    sponsorUrl = remembered;
    sponsorName = cleanName(load("aimpire.by"));
    return;
  }
  if(!remembered){
    store("aimpire.ref", fromUrl.href);
    sponsorName = urlName(); store("aimpire.by", sponsorName || null);
    sponsorUrl = fromUrl;
  }
  else if(remembered.href === fromUrl.href){
    sponsorUrl = remembered;
    sponsorName = urlName() || cleanName(load("aimpire.by"));
    store("aimpire.by", sponsorName || null);
  }
  else { sponsorUrl = remembered; sponsorName = cleanName(load("aimpire.by")); pendingRef = fromUrl; }
}
/* Hvilke steg som er gjort. Lagres lokalt per leser - aldri sendt noe sted. */
function doneSet(){
  /* Steg 6 (appene) kom inn 15.10. Avkryssing lagret foer det, for steg 6-9,
     flyttes ett hakk, saa ingen ser feil steg som gjort. Kjoeres én gang. */
  if(load("aimpire.done.v") !== "2"){
    const gml = (load("aimpire.done") || "").split(",").filter(function(x){ return x !== ""; });
    store("aimpire.done", gml.map(function(x){ const n = +x; return String(n >= 5 ? n + 1 : n); }).join(",") || null);
    store("aimpire.done.v", "2");
  }
  const raw = load("aimpire.done") || "";
  return new Set(raw.split(",").filter(function(x){ return x !== ""; }));
}
function toggleStep(i){
  const set = doneSet(), k = String(i);
  if(set.has(k)) set.delete(k); else set.add(k);
  store("aimpire.done", Array.from(set).join(","));
  render();
}
function clearSteps(){ store("aimpire.done", null); render(); }

function copyCode(btn, value, label){
  function done(){
    const tag = btn.querySelector(".c");
    if(tag) tag.textContent = (C.guide_ui[lang] || C.guide_ui.en).copied;
  }
  try{
    navigator.clipboard.writeText(value).then(done, function(){ fallback(); });
  }catch(e){ fallback(); }
  function fallback(){
    try{
      const t = document.createElement("textarea");
      t.value = value; t.setAttribute("readonly","");
      t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      document.execCommand("copy"); document.body.removeChild(t); done();
    }catch(e2){}
  }
}

function keepSponsor(){ pendingRef = null; render(); }
function switchSponsor(){
  if(pendingRef){
    store("aimpire.ref", pendingRef.href); sponsorUrl = pendingRef;
    sponsorName = urlName(); store("aimpire.by", sponsorName || null);
    pendingRef = null;
  }
  render();
}
function changeSponsor(){
  store("aimpire.ref", null); store("aimpire.by", null);
  sponsorUrl = null; sponsorName = ""; pendingRef = null;
  if(location.search) history.replaceState(null,"",location.pathname);
  render();
}
function destination(){
  return sponsorUrl
    ? { url:sponsorUrl.href, host:sponsorUrl.hostname, fp:fingerprint(sponsorUrl) }
    : { url:REF_HOUSE, host:null, fp:null };
}

function makeLink(){
  const u = validRef($("ld-in").value), out = $("ld-out"), L = C.leaders[lang] || C.leaders.en;
  out.hidden = false; out.textContent = "";
  const b = document.createElement("b");
  if(!u){ out.className = "out bad"; b.textContent = L.bad; out.appendChild(b); return; }
  out.className = "out";
  b.textContent = L.ok; out.appendChild(b);
  const nm = cleanName($("ld-name").value);
  /* Lenken skal alltid til MEDLEMSSIDEN, ogsaa naar den lages paa ledere.html. */
  const base = location.pathname.replace(/ledere\.html$/, "").replace(/index\.html$/, "");
  let link = location.origin + base + "?ref=" + encodeURIComponent(u.href);
  if(nm) link += "&by=" + encodeURIComponent(nm);
  out.appendChild(document.createTextNode(link));
  try{ navigator.clipboard.writeText(link); }catch(e){}
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined) n.textContent = text;
  return n;
}

function rowsFor(items, dest){
  const frag = document.createDocumentFragment();
  const list = el("div","rows");
  let any = false;
  items.forEach(function(i){
    const href = i.url === "__REF__" ? dest.url : i.url;
    if(!href || !safeUrl(href)) return;
    const pair = i[lang] || i.en;
    any = true;
    const a = el("a", i.primary ? "slab" : "row");
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    /* Tjenestens eget ikon, saa man kjenner igjen hvor man havner. */
    if(i.icon && sameOrigin(i.icon) && !i.primary){
      const im = el("img","ri"); im.src = i.icon; im.alt = ""; im.width = 30; im.height = 30;
      im.loading = "lazy"; im.decoding = "async"; a.appendChild(im); a.classList.add("ico");
    }
    a.appendChild(el("span","t",pair[0]));
    a.appendChild(el("span","s",pair[1]));
    if(i.primary){ frag.appendChild(a); }
    else { a.appendChild(el("span","go","›")); list.appendChild(a); }
  });
  if(list.children.length) frag.appendChild(list);
  return any ? frag : null;
}

    }
    if(kind === "lot"){
      const rows=[["1.00","$10.00",100],["0.10","$1.00",34],["0.01","$0.10",12]];
      const g=S("svg",{viewBox:"0 0 320 "+(rows.length*24+4),role:"img","aria-label":"Lot size decides pip value"});

/* Tall med tegn i hoeyre-til-venstre-tekst. $, x, % og : er «svake» tegn i
   Unicode-bidi og havner paa feil side av tallet: $109 ble vist som 109$, 12x
   som x12 - og 1:30 kan bli 30:1, som snur betydningen. Hver slik bit pakkes
   i usynlige isolater (LRI ... PDI) saa den alltid leses venstre-til-hoeyre.
   Kjoeres paa hver render, saa nytt innhold dekkes uten at noen husker det. */
const FIGURE_RX = new RegExp([
  "\\d[\\d,.]*(?::\\d+)?(?:\\s?[\\u00f7\\u00d7=]\\s?\\d[\\d,.]*(?::\\d+)?)+(?:\\s?%)?",  // 1 / 24 = 4.2 %, 24 x 30 = 720:1 (hele formelen)
  "\\$\\s?\\d[\\d,.]*",                 // $109  $2,616  $0.60
  "\\d[\\d,.]*\\s?\\u00d7",              // 12x  24x
  "\\u00d7\\s?\\d[\\d,.]*",              // x 0.70
  "\\d[\\d,.]*\\s?%",                    // 10%  5 %
  "\\d+(?:\\s?/\\s?\\d+)+",              // 70 / 5 / 25
  "\\d+:\\d+",                           // 1:30  1:500
  "#[A-Za-z][A-Za-z0-9]*",                 // #Aitech
  "@[A-Za-z0-9_][A-Za-z0-9_.]*[A-Za-z0-9_]"  // @aim.pire
].join("|"), "g");
function isolateFigures(){
  if(document.documentElement.dir !== "rtl") return;
  const root = document.querySelector(".shell");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      const p = n.parentNode;
      if(!p || p.closest("svg, script, style, [dir=ltr]")) return NodeFilter.FILTER_REJECT;
      if(n.data.indexOf("\u2066") !== -1) return NodeFilter.FILTER_REJECT;
      FIGURE_RX.lastIndex = 0;
      return FIGURE_RX.test(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function(n){
    n.data = n.data.replace(FIGURE_RX, function(m){ return "\u2066" + m + "\u2069"; });
  });
}

/* Kalkulatoren legger historikkens EKTE maaneder paa medlemmets beloep:
   beholdt = beloep x 24 x maanedens gevinst x 0,70, profitten tatt ut hver
   maaned (ingen renters rente). Nedsiden staar like stort ved siden av, og
   den sier selv hvorfor den ikke er en prognose. Vises bare naar founder
   har slaatt den paa (calculator.live) - compliance-porten i CLAUDE.md. */
let calcPeriod = 12;
function renderCalc(){
  const K = C.calculator, sec = $("s-calc");
  if(!K || !sec || !C.results) return;
  sec.hidden = !K.live;
  if(!K.live) return;
  const T = K[lang] || K.en;
  $("cc-lede").textContent = T.lede;
  $("cc-amount-l").textContent = T.amount;
  $("cc-total-l").textContent = T.total;
  $("cc-risk-t").textContent = T.risk;
  $("cc-method").textContent = T.method;
  $("cc-disc").textContent = T.disclaimer;
  const usd = function(n){ return "$" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}); };
  const per = $("cc-per"); per.textContent = "";
  K.periods.forEach(function(n, i){
    const b = el("button", null, T.periods[i]); b.type = "button";
    b.setAttribute("aria-pressed", String(n === calcPeriod));
    b.onclick = function(){ calcPeriod = n; renderCalc(); };
    per.appendChild(b);
  });
  const inp = $("cc-amount"), sl = $("cc-slide");
  $("cc-range").textContent = T.range || K.en.range;
  const pre = $("cc-pre"); pre.textContent = "";
  [50, 100, 250, 500, 1000].forEach(function(v){
    const b = el("button", null, "$" + v.toLocaleString("en-US")); b.type = "button"; b.dir = "ltr";
    b.onclick = function(){ inp.value = v; sl.value = v; calc(); };
    pre.appendChild(b);
  });
  sl.oninput = function(){ inp.value = sl.value; calc(); };
  /* Hver maaned: [maaned, brutto %, kurtasje %, fee ukentlig netto %, fee per vinnerdag %]
     paa strategikontoen. Ganges med 24 og beloepet. Ingen rentes rente: gevinsten tas ut. */
  function calc(){
    const A = Math.max(0, parseFloat(inp.value) || 0), f = A * K.multiple / 100;
    const ms = K.costs.slice(-calcPeriod);
    const sum = function(i){ return ms.reduce(function(s, m){ return s + m[i]; }, 0) * f; };
    const G = sum(1), Cm = sum(2), Fw = sum(3), Fd = sum(4);
    const hi = G - Cm - Fw, lo = G - Cm - Fd;
    if(String(sl.value) !== String(Math.min(2000, Math.max(10, A)))) sl.value = Math.min(2000, Math.max(10, A));
    /* Stolpen: hvor bruttoen blir av. Beholdt (lav) + det ekstra du kan beholde
       ved ukentlig oppgjoer + avgift + kurtasje = brutto. */
    const pct = function(x){ return G > 0 ? Math.max(0, x / G * 100).toFixed(2) + "%" : "0%"; };
    const bar = $("cc-bar").children;
    bar[0].style.width = pct(lo); bar[1].style.width = pct(hi - lo); bar[2].style.width = pct(Fw); bar[3].style.width = pct(Cm);
    $("cc-total").textContent = usd(lo) + " \u2013 " + usd(hi);
    const kept = ms.map(function(m){ return [m[0], (m[1] - m[2] - m[3]) * f]; });
    const best = kept.reduce(function(a, b){ return b[1] > a[1] ? b : a; });
    const worst = kept.reduce(function(a, b){ return b[1] < a[1] ? b : a; });
    $("cc-months").textContent = T.months + ": " + best[0] + " " + usd(best[1]) + " \u00b7 " + worst[0] + " " + usd(worst[1]);
    const R = T.rows || K.en.rows, tab = $("cc-tab"); tab.textContent = "";
    [[R[0], usd(G)], [R[1], "\u2212" + usd(Cm)], [R[2], "\u2212" + usd(Fw) + " \u2013 \u2212" + usd(Fd)], [R[3], usd(lo) + " \u2013 " + usd(hi)]]
      .forEach(function(r){ tab.appendChild(el("dt", null, r[0])); const dd = el("dd", null, r[1]); dd.dir = "ltr"; tab.appendChild(dd); });
    const ul = $("cc-risks"); ul.textContent = "";
    T.risks.forEach(function(r){
      ul.appendChild(el("li", null, r.replace(/\{A\}/g, usd(A)).replace(/\{D\}/g, usd(A * K.multiple * K.worst_day / 100))));
    });
    isolateFigures();
  }
  inp.oninput = calc; calc();
}

}
/* Spoersmaal og svar. Soeket filtrerer paa spoersmaal OG svar, saa «uttak»
   finner «Kan jeg ta ut pengene mine?». Soeketeksten overlever spraakbytte. */
function renderFaq(){
  const F = C.faq && (C.faq[lang] || C.faq.en), host = $("faq-list");
  if(!F || !host) return;
  $("faq-lede").textContent = F.lede;
  const q = $("faq-q"); q.placeholder = F.search; q.setAttribute("aria-label", F.search);
  host.textContent = "";
  F.items.forEach(function(it){
    const dt = el("details","qa");
    dt.appendChild(el("summary", null, it[0]));
    dt.appendChild(el("p", null, it[1]));
    host.appendChild(dt);
  });
  const none = $("faq-none"); none.textContent = F.none;
  function filter(){
    const v = q.value.trim().toLowerCase(); let vis = 0;
    host.querySelectorAll(".qa").forEach(function(dt){
      const hit = !v || dt.textContent.toLowerCase().indexOf(v) !== -1;
      dt.hidden = !hit; if(hit) vis++;
      if(v && hit) dt.open = true;
    });
    none.hidden = vis > 0;
  }
  q.oninput = filter; filter();
}
/* App-kortene bygges ett sted. I onboardingen (steg 6) uten bli-med-knappen:
   gruppa hoerer hjemme i siste steg, etter at appen er installert. */
function appCards(host, withJoin){
  const A = C.apps_page; if(!A || !host) return;
  const T = A[lang] || A.en;
  A.list.forEach(function(app){
    const card = el("div","appc");
    /* Samme ikon som i butikken, saa medlemmet kan se at det er den ekte
       appen. Navnet staar rett ved, derfor tom alt-tekst. */
    const head = el("div","ah");
    if(app.icon && sameOrigin(app.icon)){
      const im = el("img");
      im.src = app.icon; im.alt = ""; im.width = 48; im.height = 48;
      im.loading = "lazy"; im.decoding = "async";
      head.appendChild(im);
    }
    head.appendChild(el("h3", null, app.name));
    card.appendChild(head);
    card.appendChild(el("p", null, T[app.key] || ""));
    const row = el("div","apps");
    [["Android", app.android], ["iPhone", app.ios]].forEach(function(s){
      if(!safeUrl(s[1])) return;
      const a = el("a", null, s[0]);
      a.href = s[1]; a.target = "_blank"; a.rel = "noopener noreferrer";
      row.appendChild(a);
    });
    if(row.children.length) card.appendChild(row);
    /* Bli-med-knappen staar UNDER nedlastingen: lenka aapnes inne i appen,
       saa den virker foerst naar appen finnes. Samme lenke og samme navn
       som i steg 9. */
    if(withJoin && app.join && safeUrl(app.join) && T.join){
      card.appendChild(el("p","vnote", T.join_note));
      const j = el("a","joinbtn", T.join);
      j.href = app.join; j.target = "_blank"; j.rel = "noopener noreferrer";
      card.appendChild(j);
    }
    host.appendChild(card);
  });
}
function renderApps(){
  const A = C.apps_page, host = $("apps-list");
  if(!A || !host) return;
  const T = A[lang] || A.en;
  $("apps-lede").textContent = T.lede;
  host.textContent = "";
  appCards(host, true);
  $("apps-browser").textContent = T.browser;
  $("apps-warn").textContent = T.warn;
}

/* ---------- hovedmeny og visninger ---------- */
let view = "menu";
const CATS = ["start","tools","earn","learn","faq"];
/* Gamle lenker til #apps lander der appene bor naa. */
const ALIAS = { apps: "tools", calc: "earn" };
/* Menykort som hopper til en bestemt del av en fane. */
const JUMPTO = { calc: "s-calc" };

function renderMenu(){
  const nav = $("menu"); if(!nav) return;
  const M = C.menu && (C.menu[lang] || C.menu.en);
  if(!M){ nav.hidden = true; return; }
  nav.textContent = "";
  nav.appendChild(el("p","mlede", M.lede));
  const done = doneSet(), steps = (C.guide[lang] || C.guide.en).steps.length;
  M.items.forEach(function(it){
    const cat = it[0];
    const b = el("button","plate");
    b.type = "button";
    b.setAttribute("data-cat", cat);
    b.appendChild(el("span","stripe"));
    const bd = el("span","bd");
    bd.appendChild(el("span","t", it[1]));
    bd.appendChild(el("span","d", it[2]));
    /* Framdriften er ekte: den teller stegene medlemmet selv har huket av. */
    if(cat === "start" && done.size){
      const pg = el("span","pg");
      const bar = el("i"); const fill = el("b");
      fill.style.width = Math.round(Math.min(1, done.size / steps) * 100) + "%";
      bar.appendChild(fill);
      pg.appendChild(bar);
      pg.appendChild(el("span", null, done.size + " / " + steps));
      bd.appendChild(pg);
    }
    b.appendChild(bd);
    const go = el("span","go");
    go.setAttribute("aria-hidden","true");
    b.appendChild(go);
    b.onclick = JUMPTO[cat] ? function(){ location.hash = "#" + cat; } : function(){ if(TABS[cat]) tab = TABS[cat][0]; setView(cat); };
    nav.appendChild(b);
  });
  const bk = $("back");
  if(bk){ bk.textContent = M.back; bk.onclick = function(){ setView("menu"); }; }
}

/* Visningen er ren CSS: data-view paa .shell bestemmer hvilken kategori
   som vises. `hidden` eies av render() alene og vinner alltid. */
/* Inntektsfanen er delt i faner (founder: «del opp inntjening i flere faner»).
   Raden øverst er fanene; bare én del vises om gangen. */
const TABS = { earn: ["sonic", "results", "calc", "withdraw", "ib"] };
let tab = "sonic";
function setTab(tb, scroll){
  tab = tb;
  const sh = document.querySelector(".shell"); if(sh) sh.setAttribute("data-tab", tb);
  [...document.querySelectorAll("#jump button")].forEach(function(b){
    const on = b.dataset.tab === tb; b.setAttribute("aria-selected", String(on));
    if(on && b.parentNode.scrollWidth > b.parentNode.clientWidth){
      const r = b.parentNode.getBoundingClientRect();
      if(r.top >= 0 && r.bottom <= innerHeight) b.scrollIntoView({block: "nearest", inline: "nearest"});
    }
  });
  if(scroll) window.scrollTo(0, 0);
}
function renderJump(){
  const j = $("jump"); if(!j) return;
  const J = C.jump && (C.jump[lang] || C.jump.en);
  j.textContent = "";
  const order = TABS[view];
  if(!J || !order){ j.hidden = true; const sh = document.querySelector(".shell"); if(sh) sh.removeAttribute("data-tab"); return; }
  j.setAttribute("role", "tablist");
  order.forEach(function(tb){
    const b = el("button", null, J[tb] || tb); b.type = "button"; b.dataset.tab = tb; b.setAttribute("role", "tab");
    b.onclick = function(){ setTab(tb, true); };
    j.appendChild(b);
  });
  j.hidden = false;
  setTab(tab, false);
}
function applyView(){
  const sh = document.querySelector(".shell"), nav = $("menu"), bk = $("topbar");
  if(PAGE === "leaders"){
    sh.removeAttribute("data-view");
    const nt = $("notices"); if(nt) nt.hidden = true;
    if(nav) nav.hidden = true;
    if(bk) bk.hidden = true;
    return;
  }
  sh.setAttribute("data-view", view);
  if(nav) nav.hidden = view !== "menu";
  if(bk) bk.hidden = view === "menu";
  renderJump();
}

function setView(v, fraHash){
  view = CATS.indexOf(v) === -1 ? "menu" : v;
  if(!fraHash){
    const h = view === "menu" ? " " : "#" + view;
    try{ history.pushState(null, "", h); }catch(e){ location.hash = view === "menu" ? "" : view; }
    window.scrollTo(0, 0);
  }
  applyView();
}

function viewFromHash(){
  let h = (location.hash || "").replace(/^#/, "");
  const raw = h;
  h = ALIAS[h] || h;
  setView(CATS.indexOf(h) === -1 ? "menu" : h, true);
  if(raw === "calc"){ setTab("calc", true); }
}
window.addEventListener("hashchange", viewFromHash);
window.addEventListener("popstate", viewFromHash);

/* Romanisert urdu/arabisk er et eget spraakspor (ur_rm, ar_rm), men ikke en
   egen knapp i hovedraden: det er et skriftvalg under spraaket. */
const baseOf = code => conf(code).roman_of || code;
function buildSwitch(){
  const nav = $("switch"); nav.textContent = "";
  C.langs.filter(function(L){ return !L.roman_of; }).forEach(function(L){
    const b = el("button",null,L.label);
    b.id = "L-" + L.code;
    b.setAttribute("aria-pressed", String(L.code === baseOf(lang)));
    /* Tilbake til et spraak man har valgt Roman for, husker Roman. */
    b.onclick = function(){
      const pref = load("aimpire.script." + L.code);
      setLang(pref && conf(pref).roman_of === L.code ? pref : L.code);
    };
    nav.appendChild(b);
  });
  const th = el("button","thm","◐");
  th.setAttribute("aria-label","Light or dark");
  th.onclick = toggleTheme;
  nav.appendChild(th);
}

function setLang(code){
  const L = conf(code);
  lang = L.code;
  document.documentElement.lang = L.bcp || L.code;
  document.documentElement.dir = L.dir;
  document.documentElement.setAttribute("data-font", L.font);
  C.langs.forEach(function(x){
    const b = $("L-" + x.code);
    if(b) b.setAttribute("aria-pressed", String(x.code === baseOf(lang)));
  });
  /* Skriftvalg: bare naar spraaket har en romanisert variant. */
  const sc = $("script"), base = baseOf(lang);
  const rom = C.langs.find(function(x){ return x.roman_of === base; });
  if(sc){
    sc.textContent = "";
    sc.hidden = !rom;
    if(rom){
      [conf(base), rom].forEach(function(x){
        const b = el("button", null, x.label);
        b.type = "button";
        b.setAttribute("aria-pressed", String(x.code === lang));
        if(x.dir === "rtl") b.dir = "rtl";
        b.onclick = function(){ store("aimpire.script." + base, x.code); setLang(x.code); };
        sc.appendChild(b);
      });
    }
  }
  store("aimpire.lang", lang);
  render();
}
function toggleTheme(){
  /* Moerk er standard (founder 15.10): foerste trykk gaar til lys. */
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store("aimpire.theme.v2", next);
}
(function(){
  const th = load("aimpire.theme.v2");
  if(th) document.documentElement.setAttribute("data-theme", th);
  let l = load("aimpire.lang");
  if(!C.langs.some(function(x){ return x.code === l; })){
    const nav = ((navigator.language || "") + " " + (navigator.languages || []).join(" ")).toLowerCase();
    const hit = C.langs.find(function(x){ return new RegExp("\\b" + x.code + "\\b|" + x.code + "-").test(nav); });
    l = hit ? hit.code : C.langs[0].code;
  }
  initSponsor();
  buildSwitch();
  let h0 = (location.hash || "").replace(/^#/, "");
  h0 = ALIAS[h0] || h0;
  if(CATS.indexOf(h0) !== -1) view = h0;
  setLang(l);
})();
</script>
