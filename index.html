","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance band ho chuki trades ka paisa hai. Equity wohi balance hai, jis mein abhi khuli trades ka nafa ya nuqsan bhi shamil ho.","Balance $100, ek trade 0.01 lot par 40 pips nuqsan mein (−$4), yaani equity $96.","Balance guzra hua hisaab hai. Equity batati hai aap asal mein kahan khade hain. Khula nuqsan asli nuqsan hai, bas abhi likha nahi gaya.","equity = balance + open profit − open loss",""],["Margin call and stop out","Jab equity us margin ke muqable kaafi gir jaaye jo aap ki trades maangti hain, broker unhein khud band kar deta hai.","$100 ke account par $60 ka khula nuqsan ho to $40 equity bachti hai.","Stop out par nikalne ka waqt aap nahi chunte. Nuqsan usi lamhe pakka ho jaata hai, aksar badtareen mod par.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","Pehle se lagaya hua order keh trade aap ki chuni hui qeemat par band ho jaaye, taakeh nuqsan badhna ruk jaaye.","1.0850 par buy aur 1.0830 par stop yaani 20 pips. 0.01 lot par $2 khatre mein — daakhil hone se pehle tay.","Is ke baghair nuqsan ka hajm is baat se tay hota hai keh aap use kitni der dekh sakte hain.","risk = stop in pips × pip value",""],["Limit and stop orders","Limit behtar qeemat ka intezar karti hai. Stop tabhi chalti hai jab price koi level paar kare.","Price 1.0850. Buy Limit 1.0830 tab chalegi jab qeemat gire. Buy Stop 1.0870 tab chalegi jab qeemat chadhe.","Signals isi mukhtasar shakl mein aate hain: Buy Limit, Buy Stop, Sell Limit, Sell Stop. Chaar mein se ghalat wala chuna to ya to woh kabhi chalta nahi, ya aap ki trade ghalat waqt par khol deta hai."],["Risk per trade","Woh raqam — pips nahi — jo aap ek trade par khona qubool karte hain.","$100 account, 0.01 lot, 20 pips stop = $2 khatra. Yaani 2 feesad.","$100 ke account par sab se chhoti size bhi har trade par kai feesad khatre mein daalti hai. «1 feesad khatra» wala mashwara abhi theek nahi baithta.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Equity apni buland tareen satah se kitni giri, feesad mein.","$100 se $60 yaani 40 feesad neeche. Wapas $100 par aane ke liye 67 feesad chahiye, 40 nahi.","Nuqsan aur bharpaai barabar nahi hote. Lagataar chhote nuqsanaat ke baad aap ko itne return ki zaroorat pad sakti hai jitna aap ne kabhi kamaya hi nahi.","gain needed = loss ÷ (1 − loss)   →   40 % nuqsaan ke baad 67 % waapsi darkaar","dd"],["Compounding","Nafa account mein chhodna, taakeh position size balance ke saath badhe, ek jagah khadi na rahe.","$100 par mahine ke 5 feesad, nafa chhoda hua, saal bhar mein taqreeban $180 — $160 nahi.","Chhote account par sabr ki imandar daleel yahi hai — aur aap ko jo bhi ghair haqeeqi plan dikhaya jaayega, use bhi yahi chalata hai.","final = start × (1 + rate)^periods",""]]}},"amplify":{"items":{"en":[["The Aimpire token: #Aitech, then 000000","The community token field is where Aimpire's token goes. Type #Aitech, press Verify, then enter 000000 in the Hash field that appears. Without a valid token the account opens at 12× with the 10 % line, instead of 24× with the 5 % line. Check that the tick shows before you press Copy Now."],["Sonic runs on Amplify — and the token takes it from 12× to 24×","The Sonic strategy runs on an Amplify account; its own sign-up form says so. Amplify is a funded account: you trade a multiple of what you put in, and it is real money.\n\nThe broker's standard multiple is 12×. The Aimpire token — #Aitech and 000000 — takes it to 24×. In our own test, $109 became a trading balance of $2,616. The multiple works on losses exactly as it does on gains."],["The decision that is actually yours: how much","Connecting Sonic means trading amplified — the form says the strategy runs on Amplify, so there is no smaller version of it to start with. The choice that protects you is the amount.\n\nThree questions, and if any answer is yes, put in less: Would losing all of it change your month? Would this be the first time you watch a trade go against you and feel it? Is this your first trading account?\n\nStart with an amount you could lose completely, and watch it for a few weeks. If you add money later, know that an upgrade restarts the 30-day clock on your deposit."],["The liquidation rule, in the platform's own words","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nWith the token, the form adds a second line: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» Twice the size, half the room for loss: a loss of 5 % closes the account.\n\nIn money: your $109 trades as $2,616. A fall of 1 ÷ 24 = 4.2 % in that balance is $109 — your whole deposit, gone before the 5 % line even closes the account.\n\nIt is a hard trigger, not a warning. You cannot wait for prices to come back."],["What the platform says about who is responsible","Before you can submit, you tick a box that says trades on CopyX are provided by traders unaffiliated with Tag Markets, and that Tag Markets bears no responsibility or liability for the trades or their outcomes. Read it before you tick it. It means the broker holding your money is not answerable for what the strategy does with it."],["What you keep when it makes money","The presentation gives the split as 70 / 5 / 25, marked «per trade»: you keep 70 % of the profit, 5 % goes to the developers who run the system, and 25 % goes to what the presentation calls «the team» — «How the bonus model is drawn» shows how that is split. On the Sonic strategy card it shows as a 30 % performance fee, with no management fee and no joining fee.\n\nSo $100 of profit is about $70 to you. One thing is not shown anywhere: whether the fee is settled on each winning trade or on the net result over a period — the card says «Schedule 1 Week». If it is charged per winning trade, losing trades are not set off against it, and you keep less than 70 % of the overall result. Ask your sponsor which applies.\n\nThis matters when you read any published result, Myfxbook included: Myfxbook shows the strategy's own account, and the 30 % fee is charged to followers like you — so it is not taken out of those curves."],["The rules, from the broker's own help centre","You can withdraw profits at any time, any hour, any day; the broker says the payout then takes 1–3 working days. Your original deposit is different: it can only be taken out 30 days after your first trade — not 30 days after you paid in — and taking it out closes the account immediately. If you upgrade the account, that 30-day clock starts again. There is no daily loss limit, only the 10 % one, and you may hold as many of these accounts as you want. With the community token, that 10 % line becomes 5 %."],["Commission and leverage, measured on your own money","Commission on an amplified account is $10 per lot on forex and metals, charged when the trade closes. The broker's own articles disagree about indices and crypto.\n\nThe form shows leverage 1:30, but it applies to the multiplied balance. Measured against your own deposit, 24 × 30 = 720:1 — more than the 1:500 of a standard account, not less. At 12× it is 360:1."]],"no":[["Aimpire-tokenet: #Aitech, så 000000","Community token-feltet er der Aimpire-tokenet skal inn. Skriv #Aitech, trykk Verify, og skriv så 000000 i Hash-feltet som dukker opp. Uten et gyldig token åpnes kontoen med 12× og 10 %-grensen, i stedet for 24× og 5 %-grensen. Sjekk at haken vises før du trykker Copy Now."],["Sonic kjører på Amplify — og tokenet tar det fra 12× til 24×","Sonic-strategien kjører på en Amplify-konto; det står i strategiens eget registreringsskjema. Amplify er en finansiert konto: du handler med et multiplum av det du setter inn, og det er ekte penger.\n\nMeglerens standard er 12×. Aimpire-tokenet — #Aitech og 000000 — tar det til 24×. I vår egen test ble $109 til en handelssaldo på $2 616. Multiplumet virker på tap nøyaktig som på gevinst."],["Valget som faktisk er ditt: hvor mye","Å koble til Sonic betyr å handle forsterket — skjemaet sier at strategien kjører på Amplify, så det finnes ingen mindre utgave å begynne med. Valget som beskytter deg, er beløpet.\n\nTre spørsmål, og er svaret ja på ett av dem, sett inn mindre: Ville det endret måneden din å tape alt? Blir dette første gang du ser en handel gå imot deg og kjenner på det? Er dette din første handelskonto?\n\nBegynn med et beløp du kan tape helt, og følg med på det i noen uker. Setter du inn mer senere, må du vite at en oppgradering starter 30-dagersklokka for innskuddet ditt på nytt."],["Likvideringsregelen, med plattformens egne ord","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nMed tokenet legger skjemaet til en linje til: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» Dobbelt så stort, halvparten så mye rom for tap: et tap på 5 % stenger kontoen.\n\nI penger: dine $109 handler som $2 616. Et fall på 1 ÷ 24 = 4,2 % i den saldoen er $109 — hele innskuddet ditt, borte før 5 %-grensen i det hele tatt stenger kontoen.\n\nDet er en hard utløser, ikke en advarsel. Du kan ikke vente på at prisene henter seg inn igjen."],["Hva plattformen selv sier om ansvar","Før du kan sende inn, huker du av en boks som sier at handlene på CopyX utføres av tradere uten tilknytning til Tag Markets, og at Tag Markets ikke bærer noe ansvar for handlene eller utfallet av dem. Les den før du huker av. Den betyr at megleren som holder pengene dine, ikke svarer for hva strategien gjør med dem."],["Hva du beholder når det går i pluss","Presentasjonen oppgir delingen som 70 / 5 / 25, merket «per trade»: du beholder 70 % av profitten, 5 % går til utviklerne som drifter systemet, og 25 % går til det presentasjonen kaller «the team» — «Slik er bonusmodellen tegnet» viser hvordan det fordeles. På Sonic-strategikortet står det som et resultathonorar (performance fee) på 30 %, uten forvaltningsavgift og uten innmeldingsavgift.\n\n$100 i profitt er altså rundt $70 til deg. Én ting vises ingen steder: om honoraret gjøres opp på hver vinnende handel eller på nettoresultatet over en periode — kortet sier «Schedule 1 Week». Trekkes det per vinnende handel, blir tapende handler ikke motregnet, og du sitter igjen med mindre enn 70 % av det samlede resultatet. Spør sponsoren din hva som gjelder.\n\nDette er viktig når du leser et publisert resultat, Myfxbook inkludert: Myfxbook viser strategiens egen konto, og honoraret på 30 % belastes følgere som deg — så det er ikke trukket fra i de kurvene."],["Reglene, fra meglerens eget hjelpesenter","Gevinst kan tas ut når som helst, hele døgnet, alle dager; megleren oppgir at utbetalingen da tar 1–3 virkedager. Innskuddet ditt er noe annet: det kan først tas ut 30 dager etter din første handel — ikke 30 dager etter at du betalte inn — og tar du det ut, lukkes kontoen med det samme. Oppgraderer du kontoen, starter de 30 dagene på nytt. Det finnes ingen daglig tapsgrense, bare 10 %-grensen, og du kan ha så mange slike kontoer du vil. Med community-tokenet blir den 10 %-grensen 5 %."],["Kurtasje og leverage, målt på dine egne penger","Kurtasjen på en Amplify-konto er $10 per lot på forex og metaller, og trekkes når handelen lukkes. Meglerens egne artikler motsier hverandre om indekser og krypto.\n\nSkjemaet viser leverage 1:30, men den gjelder den multipliserte saldoen. Målt mot ditt eget innskudd blir det 24 × 30 = 720:1 — mer enn 1:500 på en vanlig konto, ikke mindre. Med 12× er det 360:1."]],"hi":[["Aimpire token: #Aitech, फिर 000000","Community token वाले field में Aimpire का token डाला जाता है। #Aitech लिखें, Verify दबाएँ, फिर जो Hash field आए, उसमें 000000 लिखें। सही token के बिना account 12× पर 10 % वाली सीमा के साथ खुलता है, 24× पर 5 % वाली सीमा के साथ नहीं। Copy Now दबाने से पहले देख लें कि tick का निशान दिख रहा है।"],["Sonic, Amplify पर चलता है — और token उसे 12× से 24× कर देता है","Sonic strategy एक Amplify account पर चलती है; उसका अपना sign-up form यही कहता है। Amplify एक funded account है: आप जितना डालते हैं उसके कई गुना से trade करते हैं, और पैसा असली है।\n\nBroker का standard 12× है। Aimpire token — #Aitech और 000000 — इसे 24× कर देता है। हमारे अपने test में $109 से $2,616 का trading balance बना। यह गुणा नुक़सान पर भी ठीक उतना ही लगता है जितना फ़ायदे पर।"],["जो फ़ैसला सच में आपका है: कितना","Sonic से जुड़ने का मतलब है amplified trading — form कहता है कि strategy Amplify पर चलती है, तो शुरुआत के लिए इसका कोई छोटा रूप नहीं है। जो चुनाव आपकी हिफ़ाज़त करता है, वह है रक़म।\n\nतीन सवाल, और अगर किसी का भी जवाब हाँ है, तो कम डालें: क्या यह पूरी रक़म खो देने से आपके महीने का हिसाब बिगड़ जाएगा? क्या किसी trade को अपने ख़िलाफ़ जाते देखना और उसकी चुभन महसूस करना आपके लिए पहली बार होगा? क्या यह आपका पहला trading account है?\n\nउतनी रक़म से शुरू करें जिसे पूरा खोना आप सह सकें, और कुछ हफ़्ते देखें। बाद में बढ़ाएँ तो जान लें: upgrade करने से आपकी जमा रक़म की 30 दिन वाली घड़ी फिर से शुरू हो जाती है।"],["Liquidation का नियम, platform के अपने शब्दों में","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nToken के साथ form एक और पंक्ति जोड़ता है: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» आकार दोगुना, नुक़सान की गुंजाइश आधी: 5% का नुक़सान account बंद कर देता है।\n\nपैसों में: आपके $109, $2,616 की तरह trade करते हैं। उस balance में 1 ÷ 24 = 4.2 % की गिरावट $109 है — यानी आपकी पूरी जमा रक़म, 5 % वाली सीमा पर account बंद होने से पहले ही ख़त्म।\n\nयह चेतावनी नहीं, सीधा trigger है। आप क़ीमतों के लौटने का इंतज़ार नहीं कर सकते।"],["ज़िम्मेदारी के बारे में platform ख़ुद क्या कहता है","Submit से पहले आप एक box पर टिक करते हैं जिसमें लिखा है कि CopyX पर trades वे traders करते हैं जिनका Tag Markets से कोई संबंध नहीं, और Tag Markets इन trades या उनके नतीजों की कोई ज़िम्मेदारी या देनदारी नहीं लेता। टिक करने से पहले पढ़ें। मतलब यह कि जो broker आपका पैसा रखता है, वह इसका जवाबदेह नहीं कि strategy उसका क्या करती है।"],["जब फ़ायदा हो, तो आपके पास क्या बचता है","Presentation में split 70 / 5 / 25 बताया गया है, और साथ में «per trade» लिखा है: profit का 70 % आपका, 5 % system चलाने वाले developers को, और 25 % उसे जाता है जिसे presentation «the team» कहता है — «Bonus model कैसे बनाया गया है» में दिखाया गया है कि वह कैसे बँटता है। Sonic strategy के card पर यह 30 % performance fee के रूप में दिखता है, और कोई management fee या joining fee नहीं।\n\nयानी $100 के profit में से क़रीब $70 आपके। एक बात कहीं नहीं दिखाई गई: fee हर जीतने वाली trade पर कटती है या किसी अवधि के net नतीजे पर — card पर लिखा है «Schedule 1 Week»। अगर यह हर जीतने वाली trade पर कटती है, तो fee का हिसाब लगाते समय घाटे वाली trades को घटाया नहीं जाता, और कुल नतीजे का 70 % से कम आपके पास रहता है। अपने sponsor से पूछें कि इनमें से कौन-सा तरीक़ा लागू होता है।\n\nMyfxbook समेत किसी भी published नतीजे को पढ़ते समय यह बात मायने रखती है: Myfxbook strategy का अपना account दिखाता है, और 30 % fee आप जैसे followers से ली जाती है — इसलिए वह उन curves में से नहीं काटी गई है।"],["नियम, broker के अपने help centre से","फ़ायदा किसी भी समय, किसी भी घड़ी, किसी भी दिन निकाला जा सकता है; broker के मुताबिक़ उसके बाद भुगतान में 1–3 कामकाजी दिन लगते हैं। आपका जमा किया पैसा अलग बात है: वह पहली trade के 30 दिन बाद ही निकल सकता है — पैसा डालने के 30 दिन बाद नहीं — और उसे निकालते ही account तुरंत बंद हो जाता है। Account upgrade किया तो वे 30 दिन फिर से शुरू। रोज़ के नुक़सान की कोई सीमा नहीं, सिर्फ़ 10 % वाली, और ऐसे जितने चाहें account रख सकते हैं। Community token के साथ यह 10 % की सीमा 5 % हो जाती है।"],["Commission और leverage, आपके अपने पैसे के हिसाब से","Amplified account में forex और metals (धातुएँ) पर commission $10 प्रति lot है, जो trade बंद होने पर लगता है। Indices (सूचकांक) और crypto के बारे में broker के अपने articles आपस में अलग-अलग बातें कहते हैं।\n\nForm पर leverage 1:30 दिखती है, लेकिन यह बढ़े हुए balance पर लगती है। आपकी अपनी जमा रक़म के हिसाब से 24 × 30 = 720:1 — यानी सामान्य account के 1:500 से ज़्यादा, कम नहीं। 12× पर यह 360:1 है।"]],"ur":[["Aimpire کا token: #Aitech، پھر 000000","Community token کا خانہ وہ جگہ ہے جہاں Aimpire کا token ڈالا جاتا ہے۔ #Aitech لکھیں، Verify دبائیں، پھر آنے والے Hash خانے میں 000000 لکھیں۔ درست token کے بغیر account 12× پر 10 % والی حد کے ساتھ کھلتا ہے، 24× پر 5 % والی حد کے ساتھ نہیں۔ Copy Now دبانے سے پہلے دیکھ لیں کہ tick کا نشان نظر آ رہا ہے۔"],["Sonic، Amplify پر چلتا ہے — اور token اُسے 12× سے 24× کر دیتا ہے","Sonic strategy ایک Amplify account پر چلتی ہے؛ اُس کا اپنا sign-up form یہی کہتا ہے۔ Amplify ایک funded account ہے: آپ جتنا ڈالتے ہیں، اُس کے کئی گنا سے trade کرتے ہیں، اور پیسہ اصلی ہے۔\n\nBroker کا standard 12× ہے۔ Aimpire token — #Aitech اور 000000 — اِسے 24× کر دیتا ہے۔ ہمارے اپنے test میں $109 سے $2,616 کا trading balance بنا۔ یہ گُنا نقصان پر بھی بالکل اُتنا ہی لگتا ہے جتنا نفع پر۔"],["جو فیصلہ واقعی آپ کا ہے: کتنا","Sonic سے جُڑنے کا مطلب ہے amplified trading — form کہتا ہے کہ strategy Amplify پر چلتی ہے، تو شروع کرنے کے لیے اِس کا کوئی چھوٹا روپ نہیں۔ جو انتخاب آپ کو بچاتا ہے، وہ رقم ہے۔\n\nتین سوال، اور کسی ایک کا جواب بھی ہاں ہو تو کم ڈالیں: کیا یہ ساری رقم چلی جائے تو آپ کے مہینے کا بجٹ بگڑ جائے گا؟ کیا کسی trade کو اپنے خلاف جاتے دیکھنا اور اُس کا دباؤ محسوس کرنا آپ کے لیے نیا ہوگا؟ کیا یہ آپ کا پہلا trading account ہے؟\n\nاُتنی رقم سے شروع کریں جسے پورا کھونا آپ برداشت کر سکیں، اور چند ہفتے دیکھیں۔ بعد میں بڑھائیں تو یاد رکھیں: upgrade سے آپ کے deposit کی 30 دن والی گنتی پھر سے شروع ہو جاتی ہے۔"],["Liquidation کا اصول، platform کے اپنے الفاظ میں","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nToken کے ساتھ form ایک اور سطر جوڑتا ہے: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» سائز دُگنا، نقصان کی گنجائش آدھی: 5% کا نقصان account بند کر دیتا ہے۔\n\nپیسوں میں: آپ کے $109 پر $2,616 کی trading ہوتی ہے۔ اُس balance میں 1 ÷ 24 = 4.2 % کی کمی $109 کے برابر ہے — یعنی آپ کا پورا deposit ختم، اور یہ 5 % والی حد پر account بند ہونے سے بھی پہلے ہو جاتا ہے۔\n\nیہ وارننگ نہیں، سیدھا trigger ہے۔ آپ قیمتوں کے واپس آنے کا انتظار نہیں کر سکتے۔"],["ذمہ داری کے بارے میں platform خود کیا کہتا ہے","Submit سے پہلے آپ ایک box پر ٹک کرتے ہیں جس میں لکھا ہے کہ CopyX پر trades وہ traders کرتے ہیں جن کا Tag Markets سے کوئی تعلق نہیں، اور Tag Markets اِن trades یا اُن کے نتائج کی کوئی ذمہ داری نہیں لیتا۔\n\nٹک کرنے سے پہلے پڑھ لیں۔ مطلب یہ کہ جو broker آپ کا پیسہ رکھتا ہے، وہ اس کا جواب دہ نہیں کہ strategy اُس کا کیا کرتی ہے۔"],["جب فائدہ ہو، تو آپ کے پاس کیا بچتا ہے","Presentation میں split 70 / 5 / 25 بتایا گیا ہے، اور ساتھ «per trade» لکھا ہے: profit کا 70 % آپ کا، 5 % system چلانے والے developers کا، اور 25 % اُسے جاتا ہے جسے presentation «the team» کہتا ہے — «Bonus model کیسے بنایا گیا ہے» میں دکھایا گیا ہے کہ وہ کیسے بٹتا ہے۔ Sonic strategy کے card پر یہ 30 % performance fee کی صورت میں نظر آتا ہے، نہ کوئی management fee ہے، نہ joining fee۔\n\nیعنی $100 کے profit میں سے تقریباً $70 آپ کے۔ ایک بات کہیں نہیں دکھائی گئی: fee ہر جیتنے والی trade پر کٹتی ہے یا کسی مدت کے net نتیجے پر — card پر لکھا ہے «Schedule 1 Week»۔ اگر یہ ہر جیتنے والی trade پر کٹتی ہے تو fee کا حساب لگاتے وقت نقصان والی trades نہیں گھٹائی جاتیں، اور کُل نتیجے کا 70 % سے کم آپ کے پاس رہتا ہے۔ اپنے sponsor سے پوچھیں کہ اِن میں سے کون سا طریقہ لاگو ہوتا ہے۔\n\nMyfxbook سمیت کوئی بھی published نتیجہ دیکھتے وقت یہ یاد رکھیں: Myfxbook strategy کا اپنا account دکھاتا ہے، اور 30 % fee آپ جیسے followers سے لی جاتی ہے — اِس لیے وہ اُن curves میں سے نہیں کاٹی گئی۔"],["قواعد، broker کے اپنے help centre سے","نفع کسی بھی وقت، کسی بھی گھڑی، کسی بھی دن نکالا جا سکتا ہے؛ broker کے مطابق اُس کے بعد ادائیگی میں 1–3 کاروباری دن لگتے ہیں۔ آپ کی جمع کرائی رقم الگ بات ہے: وہ پہلی trade کے 30 دن بعد ہی نکل سکتی ہے — رقم ڈالنے کے 30 دن بعد نہیں — اور اُسے نکالتے ہی account فوراً بند ہو جاتا ہے۔ Account اپ گریڈ کیا تو وہ 30 دن دوبارہ شروع۔ کوئی روزانہ نقصان کی حد نہیں، صرف 10% والی، اور ایسے جتنے چاہیں account رکھ سکتے ہیں۔ Community token کے ساتھ یہ 10 % کی حد 5 % ہو جاتی ہے۔"],["Commission اور leverage، آپ کے اپنے پیسے کے حساب سے","Amplified account میں forex اور metals (دھاتیں) پر commission $10 فی lot ہے، جو trade بند ہونے پر لگتی ہے۔ Indices اور crypto کے بارے میں broker کے اپنے articles آپس میں مختلف باتیں کہتے ہیں۔\n\nForm پر leverage 1:30 لکھی ہے، لیکن یہ بڑھے ہوئے balance پر لگتی ہے۔ آپ کے اپنے deposit کے حساب سے دیکھیں تو 24 × 30 = 720:1 — یعنی عام account کے 1:500 سے زیادہ، کم نہیں۔ 12× پر یہ 360:1 ہے۔"]],"ar":[["الـ token الخاص بـ Aimpire: ‎#Aitech، ثم 000000","خانة الـ community token هي المكان الذي يُكتب فيه الـ token الخاص بـ Aimpire. اكتب ‎#Aitech، واضغط Verify، ثم اكتب 000000 في خانة الـ Hash التي تظهر. ومن دون token صالح يُفتح الحساب بـ 12× مع حدّ الـ 10 %، بدلاً من 24× مع حدّ الـ 5 %. وتأكّد من ظهور علامة الصحّ قبل أن تضغط Copy Now."],["Sonic يعمل على Amplify — والـ token يرفعه من 12× إلى 24×","تعمل استراتيجية Sonic على حساب Amplify؛ هذا ما يقوله نموذج التسجيل نفسه. والـ Amplify حساب مموَّل: تتداول بمضاعَف لما تودعه، والمال حقيقي.\n\nالمضاعِف المعتاد لدى الـ broker هو 12×. والـ token الخاص بـ Aimpire — ‎#Aitech و000000 — يرفعه إلى 24×. في تجربتنا نحن صار مبلغ $109 رصيد تداول قدره $2,616. والمضاعِف يعمل على الخسارة تماماً كما يعمل على الربح."],["القرار الذي هو لك فعلاً: كم تضع","الربط بـ Sonic يعني تداولاً مضخَّماً — فالنموذج يقول إن الاستراتيجية تعمل على Amplify، ولا توجد نسخة أصغر منها تبدأ بها. والاختيار الذي يحميك هو المبلغ.\n\nثلاثة أسئلة، وإن كانت الإجابة عن أيٍّ منها بنعم فضع مبلغاً أقل: هل ستُربك خسارةُ المبلغ كله ميزانيتك هذا الشهر؟ هل هذه أول مرة ستشاهد فيها صفقة تسير ضدك وتشعر بوقعها؟ هل هذا أول حساب تداول لك؟\n\nابدأ بمبلغ تستطيع خسارته كاملاً، وراقبه بضعة أسابيع. وإن أضفت مبلغاً لاحقاً، فاعلم أن الـ upgrade يعيد مهلة الثلاثين يوماً الخاصة بإيداعك إلى بدايتها."],["قاعدة التصفية، بكلمات المنصّة نفسها","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nومع الـ token يضيف النموذج سطراً ثانياً: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» ضعف الحجم، ونصف المساحة المسموح بها للخسارة: خسارة 5% تُغلق الحساب.\n\nبالأرقام: مبلغك البالغ $109 يُتداوَل كأنه $2,616. وهبوط بنسبة 1 ÷ 24 = 4.2 % في ذلك الرصيد يساوي $109 — إيداعك كله، يذهب قبل أن يُغلق حدّ الـ 5 % الحساب أصلاً.\n\nإنها قاعدة تُنفَّذ تلقائياً، لا مجرّد تحذير. ولا مجال لأن تنتظر حتى يتعافى الحساب."],["ماذا تقول المنصّة عن المسؤولية","قبل أن ترسل، تضع علامة في مربّع يقول إنّ الصفقات على CopyX ينفّذها متداولون لا صلة لهم بـ Tag Markets، وإنّ Tag Markets لا تتحمّل أي مسؤولية عن الصفقات ولا عن نتائجها. اقرأه قبل أن تعلّم عليه. ومعناه أنّ الـ broker الذي يحتفظ بمالك ليس مسؤولاً عمّا تفعله الاستراتيجية به."],["ما يبقى لك عندما يربح","يذكر العرض التقديمي أن التوزيع 70 / 5 / 25، مع عبارة «per trade»: تحتفظ بـ 70 % من الربح، و5 % للمطوّرين الذين يشغّلون النظام، و25 % تذهب إلى ما يسمّيه العرض «the team» — ويبيّن قسم «كيف رُسم نموذج المكافآت» كيف تُوزَّع. وعلى بطاقة استراتيجية Sonic يظهر ذلك في صورة رسم أداء (performance fee) قدره 30 %، من دون رسوم إدارة ولا رسوم انضمام.\n\nأي أن ربحاً قدره $100 يعني نحو $70 لك. لكن أمراً واحداً لا يظهر في أي مكان: هل يُسوّى الرسم على كل صفقة رابحة، أم على صافي النتيجة خلال فترة — فالبطاقة تقول «Schedule 1 Week». فإن كان يُفرض على كل صفقة رابحة، فلا تُخصم الصفقات الخاسرة منه، ويبقى لك أقل من 70 % من النتيجة الإجمالية. اسأل الـ sponsor الخاص بك أيّهما المعمول به.\n\nوهذا مهم حين تقرأ أي نتيجة منشورة، بما فيها Myfxbook: فـ Myfxbook يعرض حساب الاستراتيجية نفسها، ورسم الـ 30 % يُفرض على المتابعين مثلك — لذا فهو غير مخصوم من تلك المنحنيات."],["القواعد، من مركز مساعدة الـ broker نفسه","يمكنك سحب الأرباح في أي وقت، في أي ساعة وأي يوم؛ ويذكر الـ broker أن الدفعة تستغرق بعد ذلك من 1 إلى 3 أيام عمل. أما إيداعك الأصلي فأمر آخر: لا يُسحب إلا بعد 30 يوماً من أول صفقة لك — لا بعد 30 يوماً من الإيداع — وسحبه يُغلق الحساب فوراً. وإن أجريت upgrade للحساب، بدأت مدة الـ 30 يوماً من جديد. ولا يوجد حدّ خسارة يومي، بل حدّ الـ 10 % فقط، ويمكنك الاحتفاظ بما شئت من هذه الحسابات. ومع الـ community token يصبح حدّ الـ 10 % هذا 5 %."],["العمولة والـ leverage بالقياس إلى مالك أنت","العمولة على الحساب المضاعَف هي $10 لكل lot على الـ forex والـ metals (المعادن)، وتُحتسب عند إغلاق الصفقة. أما الـ indices (المؤشرات) والـ crypto، فمقالات الـ broker نفسه تتضارب بشأنها.\n\nيُظهر النموذج أن الـ leverage هو 1:30، لكنه يُطبَّق على الرصيد المضاعَف. وبالقياس إلى إيداعك أنت: 24 × 30 = 720:1 — أي أكثر من الـ 1:500 في الحساب العادي، لا أقل. وعند 12× يكون 360:1."]],"ar_rm":[["Al-token al-khass bi Aimpire: #Aitech, thumma 000000","Khanat al-community token hiya al-makan alladhi yuktab fih al-token al-khass bi Aimpire. Uktub #Aitech, w idghat Verify, thumma uktub 000000 fi khanat al-Hash allati tazhar. W min dun token salih yuftah al-hisab bi 12× ma3 hadd al-10 %, badalan min 24× ma3 hadd al-5 %. W ta'akkad min zuhur 3alamat al-sahh qabl an tadghat Copy Now."],["Sonic ya3mal 3ala Amplify — w al-token yarfa3uh min 12× ila 24×","Ta3mal istratijiyat Sonic 3ala hisab Amplify; hadha ma yaquluh namudhaj al-tasjil nafsuh. W al-Amplify hisab mumawwal: tatadawal bi-muda3af lima tudi3uh, w al-mal haqiqi.\n\nAl-muda3if al-mu3tad lada al-broker huwa 12×. W al-token al-khass bi Aimpire — #Aitech w 000000 — yarfa3uh ila 24×. Fi tajribatina nahnu sar mablagh $109 rasid tadawul qadruh $2,616. W al-muda3if ya3mal 3ala al-khasara tamaman kama ya3mal 3ala al-ribh."],["Al-qarar alladhi huwa lak fi3lan: kam tada3","Al-rabt bi Sonic ya3ni tadawulan mudakhkhaman — fal-namudhaj yaqul inna al-istratijiya ta3mal 3ala Amplify, w la tujad nuskha asghar minha tabda' biha. W al-ikhtiyar alladhi yahmik huwa al-mablagh.\n\nThalathat as'ila, w in kanat al-ijaba 3an ayy minha bi-na3am fada3 mablaghan aqall: hal saturbik khasarat al-mablagh kulluh mizaniyatak hadha al-shahr? Hal hadhihi awwal marra satushahid fiha safqa tasir diddak w tash3ur bi-waq3iha? Hal hadha awwal hisab tadawul lak?\n\nIbda' bi-mablagh tastati3 khasaratah kamilan, w raqibh bid3at asabi3. W in adaft mablaghan lahiqan, fa3lam anna al-upgrade yu3id muhlat al-thalathin yawman al-khassa bi-ida3ak ila bidayatiha."],["Qa3idat al-tasfiya, bi-kalimat al-minassa nafsiha","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nW ma3 al-token yudif al-namudhaj satran thaniyan: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» Di3f al-hajm, w nisf al-masaha al-masmuh biha lil-khasara: khasarat 5% tughliq al-hisab.\n\nBil-arqam: mablaghak al-baligh $109 yutadawal ka'annahu $2,616. W hubut bi-nisbat 1 ÷ 24 = 4.2 % fi dhalik al-rasid yusawi $109 — ida3ak kulluh, yadhhab qabl an yughliq hadd al-5 % al-hisab aslan.\n\nInnaha qa3ida tunaffadh tilqa'iyan, la mujarrad tahdhir. W la majal li-an tantazir hatta yata3afa al-hisab."],["Madha taqul al-minassa 3an al-mas'uliya","Qabl an tursil, tada3 3alama fi murabba3 yaqul inna al-safaqat 3ala CopyX yunaffidhuha mutadawilun la silata lahum bi Tag Markets, w inna Tag Markets la tatahammal ayy mas'uliya 3an al-safaqat w la 3an nata'ijiha. Iqra'h qabl an tu3allim 3alayh. W ma3nah anna al-broker alladhi yahtafiz bi-malak laysa mas'ulan 3amma taf3aluh al-istratijiya bih."],["Ma yabqa lak 3indama yarbah","Yadhkur al-3ard al-taqdimi anna al-tawzi3 70 / 5 / 25, ma3 3ibarat «per trade»: tahtafiz bi 70 % min al-ribh, w 5 % lil-mutawwirin alladhina yushaghghilun al-nizam, w 25 % tadhhab ila ma yusammih al-3ard «the team» — w yubayyin qism «Kayf rusim namudhaj al-mukafa'at» kayf tuwazza3. W 3ala bitaqat istratijiyat Sonic yazhar dhalik fi surat rasm ada' (performance fee) qadruh 30 %, min dun rusum idara w la rusum indimam.\n\nAy anna ribhan qadruh $100 ya3ni nahwa $70 lak. Lakin amran wahidan la yazhar fi ayy makan: hal yusawwa al-rasm 3ala kull safqa rabiha, am 3ala safi al-natija khilal fatra — fal-bitaqa taqul «Schedule 1 Week». Fa'in kan yufrad 3ala kull safqa rabiha, fala tukhsam al-safaqat al-khasira minh, w yabqa lak aqall min 70 % min al-natija al-ijmaliya. Is'al al-sponsor al-khass bik ayyuhuma al-ma3mul bih.\n\nW hadha muhimm hin taqra' ayy natija manshura, bima fiha Myfxbook: fa Myfxbook ya3rid hisab al-istratijiya nafsiha, w rasm al-30 % yufrad 3ala al-mutabi3in mithlak — lidha fahuwa ghayr makhsum min tilka al-munhanayat."],["Al-qawa3id, min markaz musa3adat al-broker nafsuh","Yumkinuk sahb al-arbah fi ayy waqt, fi ayy sa3a w ayy yawm; w yadhkur al-broker anna al-daf3a tastaghriq ba3d dhalik min 1 ila 3 ayyam 3amal. Amma ida3ak al-asli fa'amr akhar: la yushab illa ba3d 30 yawman min awwal safqa lak — la ba3d 30 yawman min al-ida3 — w sahbuh yughliq al-hisab fawran. W in ajrayt upgrade lil-hisab, bada'at muddat al-30 yawman min jadid. W la yujad hadd khasara yawmi, bal hadd al-10 % faqat, w yumkinuk al-ihtifaz bima shi't min hadhihi al-hisabat. W ma3 al-community token yusbih hadd al-10 % hadha 5 %."],["Al-3umula w al-leverage bil-qiyas ila malak anta","Al-3umula 3ala al-hisab al-muda3af hiya $10 li-kull lot 3ala al-forex w al-metals (al-ma3adin), w tuhtasab 3ind ighlaq al-safqa. Amma al-indices (al-mu'ashshirat) w al-crypto, famaqalat al-broker nafsuh tatadarab bi-sha'niha.\n\nYuzhir al-namudhaj anna al-leverage huwa 1:30, lakinnahu yutabbaq 3ala al-rasid al-muda3af. W bil-qiyas ila ida3ak anta: 24 × 30 = 720:1 — ay akthar min al-1:500 fil-hisab al-3adi, la aqall. W 3ind 12× yakun 360:1."]],"ur_rm":[["Aimpire ka token: #Aitech, phir 000000","Community token ka khana woh jagah hai jahan Aimpire ka token daala jaata hai. #Aitech likhein, Verify dabayein, phir aane wale Hash khane mein 000000 likhein. Durust token ke baghair account 12× par 10 % wali had ke saath khulta hai, 24× par 5 % wali had ke saath nahi. Copy Now dabane se pehle dekh lein keh tick ka nishan nazar aa raha hai."],["Sonic, Amplify par chalta hai — aur token use 12× se 24× kar deta hai","Sonic strategy ek Amplify account par chalti hai; us ka apna sign-up form yahi kehta hai. Amplify ek funded account hai: aap jitna daalte hain, us ke kai guna se trade karte hain, aur paisa asli hai.\n\nBroker ka standard 12× hai. Aimpire token — #Aitech aur 000000 — ise 24× kar deta hai. Hamare apne test mein $109 se $2,616 ka trading balance bana. Yeh guna nuqsan par bhi bilkul utna hi lagta hai jitna nafe par."],["Jo faisla waqai aap ka hai: kitna","Sonic se judne ka matlab hai amplified trading — form kehta hai keh strategy Amplify par chalti hai, to shuru karne ke liye is ka koi chhota roop nahi. Jo intekhab aap ko bachata hai, woh raqam hai.\n\nTeen sawal, aur kisi ek ka jawab bhi haan ho to kam daalein: Kya yeh saari raqam chali jaaye to aap ke mahine ka budget bigad jaayega? Kya kisi trade ko apne khilaaf jaate dekhna aur us ka dabaao mehsoos karna aap ke liye naya hoga? Kya yeh aap ka pehla trading account hai?\n\nUtni raqam se shuru karein jise poora khona aap bardasht kar sakein, aur chand hafte dekhein. Baad mein badhayein to yaad rakhein: upgrade se aap ke deposit ki 30 din wali ginti phir se shuru ho jaati hai."],["Liquidation ka usool, platform ke apne alfaaz mein","«If the manager loses more than 10% of starting balance, your account will be liquidated.»\n\nToken ke saath form ek aur satar jodta hai: «By using a token code, your Amplify account draw down limit will change to 5% of your starting balance.» Size dugna, nuqsan ki gunjaish aadhi: 5% ka nuqsan account band kar deta hai.\n\nPaison mein: aap ke $109 par $2,616 ki trading hoti hai. Us balance mein 1 ÷ 24 = 4.2 % ki kami $109 ke barabar hai — yaani aap ka poora deposit khatam, aur yeh 5 % wali had par account band hone se bhi pehle ho jaata hai.\n\nYeh warning nahi, seedha trigger hai. Aap qeematon ke wapas aane ka intezar nahi kar sakte."],["Zimmedari ke baare mein platform khud kya kehta hai","Submit se pehle aap ek box par tick karte hain jis mein likha hai keh CopyX par trades woh traders karte hain jin ka Tag Markets se koi taalluq nahi, aur Tag Markets in trades ya un ke nataij ki koi zimmedari nahi leta.\n\nTick karne se pehle parh lein. Matlab yeh keh jo broker aap ka paisa rakhta hai, woh is ka jawabdeh nahi keh strategy us ka kya karti hai."],["Jab faida ho, to aap ke paas kya bachta hai","Presentation mein split 70 / 5 / 25 bataya gaya hai, aur saath «per trade» likha hai: profit ka 70 % aap ka, 5 % system chalane wale developers ka, aur 25 % use jaata hai jise presentation «the team» kehta hai — «Bonus model kaise banaya gaya hai» mein dikhaya gaya hai keh woh kaise batta hai. Sonic strategy ke card par yeh 30 % performance fee ki soorat mein nazar aata hai, na koi management fee hai, na joining fee.\n\nYaani $100 ke profit mein se taqreeban $70 aap ke. Ek baat kahin nahi dikhayi gayi: fee har jeetne wali trade par katti hai ya kisi muddat ke net nateeje par — card par likha hai «Schedule 1 Week». Agar yeh har jeetne wali trade par katti hai to fee ka hisaab lagate waqt nuqsan wali trades nahi ghatayi jaatin, aur kul nateeje ka 70 % se kam aap ke paas rehta hai. Apne sponsor se poochein keh in mein se kaun sa tareeqa laagu hota hai.\n\nMyfxbook samet koi bhi published nateeja dekhte waqt yeh yaad rakhein: Myfxbook strategy ka apna account dikhata hai, aur 30 % fee aap jaise followers se li jaati hai — is liye woh un curves mein se nahi kaati gayi."],["Qawaid, broker ke apne help centre se","Nafa kisi bhi waqt, kisi bhi ghari, kisi bhi din nikala ja sakta hai; broker ke mutabiq us ke baad adaigi mein 1–3 karobari din lagte hain. Aap ki jama karayi raqam alag baat hai: woh pehli trade ke 30 din baad hi nikal sakti hai — raqam daalne ke 30 din baad nahi — aur use nikalte hi account fauran band ho jaata hai. Account upgrade kiya to woh 30 din dobara shuru. Koi rozana nuqsan ki had nahi, sirf 10% wali, aur aise jitne chahein account rakh sakte hain. Community token ke saath yeh 10 % ki had 5 % ho jaati hai."],["Commission aur leverage, aap ke apne paise ke hisaab se","Amplified account mein forex aur metals (dhaatein) par commission $10 fi lot hai, jo trade band hone par lagti hai. Indices aur crypto ke baare mein broker ke apne articles aapas mein mukhtalif baatein kehte hain.\n\nForm par leverage 1:30 likhi hai, lekin yeh badhe hue balance par lagti hai. Aap ke apne deposit ke hisaab se dekhein to 24 × 30 = 720:1 — yaani aam account ke 1:500 se zyada, kam nahi. 12× par yeh 360:1 hai."]]},"compare":{"cols":["12×","24×"],"en":{"title":"12× or 24× — the same $100","rows":[["Trades as","$1,200","$2,400"],["The account closes after a loss of","10 %","5 %"],["A fall that takes your whole $100","8.3 %","4.2 %"],["Leverage on forex and metals, measured on your own money","360:1","720:1"],["Token","None","#Aitech + 000000"]],"note":"Gains are 12 or 24 times larger too. The record's deepest dip, 0.86 %, would have been about 10 % or 21 % of your deposit."},"no":{"title":"12× eller 24× — de samme $100","rows":[["Handler som","$1 200","$2 400"],["Kontoen stenges etter et tap på","10 %","5 %"],["Et fall som tar alle dine $100","8,3 %","4,2 %"],["Leverage på forex og metaller, målt på dine egne penger","360:1","720:1"],["Token","Ingen","#Aitech + 000000"]],"note":"Gevinstene blir også 12 eller 24 ganger større. Historikkens dypeste dupp, 0,86 %, ville vært rundt 10 % eller 21 % av innskuddet ditt."},"hi":{"title":"12× या 24× — वही $100","rows":[["Trade होने वाली रक़म","$1,200","$2,400"],["Account इतने नुक़सान पर बंद हो जाता है","10 %","5 %"],["गिरावट जो आपके पूरे $100 ले जाए","8.3 %","4.2 %"],["Forex और metals पर leverage, आपके अपने पैसे के हिसाब से","360:1","720:1"],["Token","कोई नहीं","#Aitech + 000000"]],"note":"फ़ायदे भी 12 या 24 गुना बड़े होते हैं। Record की सबसे गहरी गिरावट, 0.86 %, आपकी जमा रक़म का क़रीब 10 % या 21 % होती।"},"ar":{"title":"12× أو 24× — بالمبلغ نفسه، $100","rows":[["يُتداوَل كأنه","$1,200","$2,400"],["يُغلق الحساب بعد خسارة قدرها","10 %","5 %"],["هبوط يذهب بالـ $100 كلها","8.3 %","4.2 %"],["الـ leverage على الـ forex والـ metals، بالقياس إلى مالك أنت","360:1","720:1"],["الـ token","لا يوجد","#Aitech + 000000"]],"note":"والأرباح أيضاً أكبر بـ 12 أو 24 مرة. وأعمق هبوط في السجلّ، 0.86 %، كان سيعادل نحو 10 % أو 21 % من إيداعك."},"ur":{"title":"12× یا 24× — وہی $100","rows":[["Trading ہونے والی رقم","$1,200","$2,400"],["Account اِتنے نقصان پر بند ہو جاتا ہے","10 %","5 %"],["کمی جو آپ کے پورے $100 لے جائے","8.3 %","4.2 %"],["Forex اور metals پر leverage، آپ کے اپنے پیسے کے حساب سے","360:1","720:1"],["Token","کوئی نہیں","#Aitech + 000000"]],"note":"نفع بھی 12 یا 24 گنا بڑا ہوتا ہے۔ Record کی سب سے گہری کمی، 0.86 %، آپ کے deposit کا تقریباً 10 % یا 21 % بنتی۔"},"ar_rm":{"title":"12× aw 24× — bil-mablagh nafsuh, $100","rows":[["Yutadawal ka'annahu","$1,200","$2,400"],["Yughlaq al-hisab ba3d khasara qadruha","10 %","5 %"],["Hubut yadhhab bil-$100 kulliha","8.3 %","4.2 %"],["Al-leverage 3ala al-forex w al-metals, bil-qiyas ila malak anta","360:1","720:1"],["Al-token","La yujad","#Aitech + 000000"]],"note":"W al-arbah aydan akbar bi 12 aw 24 marra. W a3maq hubut fil-sijill, 0.86 %, kan sayu3adil nahwa 10 % aw 21 % min ida3ak."},"ur_rm":{"title":"12× ya 24× — wohi $100","rows":[["Trading hone wali raqam","$1,200","$2,400"],["Account itne nuqsan par band ho jaata hai","10 %","5 %"],["Kami jo aap ke poore $100 le jaaye","8.3 %","4.2 %"],["Forex aur metals par leverage, aap ke apne paise ke hisaab se","360:1","720:1"],["Token","Koi nahi","#Aitech + 000000"]],"note":"Nafa bhi 12 ya 24 guna bada hota hai. Record ki sab se gehri kami, 0.86 %, aap ke deposit ka taqreeban 10 % ya 21 % banti."}}},"ib":{"en":{"lede":"This part is optional. You can open an account, let Sonic run, and never introduce a single person. Nothing on the platform requires it. It is here because people ask how it works, and because half-explained money is how communities go wrong.","blocks":[["What an IB actually is","The broker already charges a spread and a commission on every trade, whether you introduced anyone or not. An Introducing Broker gets a share of what the broker earns. That is the usual mechanism across the industry, and it is not a separate fee on the person you introduced. On Sonic there is one more thing to know: part of what the people above you earn comes from the member's own 30 % performance fee. The fee is the same either way, but it is the member who pays it."],["The lock nobody explains","The plan has ten generations. They start locked. Your IB Portal shows two lines that decide everything: «# of Directs with active Trading account» and «Generations unlocked». Generations open only when your directs — the people you introduced yourself — have active trading accounts. Until then, the level-based streams pay nothing on the locked levels. How they open, according to the Tag Markets presentation other teams use: you need at least $250 in trading yourself, which opens the first three levels. Levels four to ten open as up to ten people you introduced directly each have $250 in trading. The portal does not show the rate per level.","lock"],["What that looks like in real numbers","Figures from the founder's own portal on 13 October 2026: five people introduced, $43 deposited across all of them, nine income streams listed by name — and $0.00 earned. Not because anything was broken: mainly because 0 of 10 generations were unlocked. This is the single most useful thing to understand before you start. With $43 between five people, none of them came near the $250 the presentation names."],["Two programmes: international and Europe","AiTech's own presentation of 3 October 2026 shows two versions of the programme. The international one, for members outside Europe, pays on ten levels: 2.5 % of each trade's profit per level, and per lot $2.00, $1.50, $1.00, $1.00 and then $0.50 on levels five to ten — up to $8.50 per lot in all. The European one pays on one level only: 2.5 % that can rise to 22.5 % with volume, $2.00 per lot that can rise to $6.50, and a general bonus of $2.00 per lot plus a bonus payment. In the CopyX app that general bonus has steps at $10,000, $50,000, $200,000 and $500,000 of team volume.\n\nThe broker's own help centre documents a third table for its amplified accounts — $3.00, $1.20 and $0.60 on three levels. That table may belong to Tag Markets' own partner plan rather than AiTech's. The same help centre says a trade only counts for commission if it stays open for at least 3 minutes.","ladder"],["How the bonus model is drawn","The presentation draws it in five parts. First the split of every trade's profit: 70 % stays with the member, 5 % goes to the developers, and 25 % is shared ten levels down in the structure — the 2.5 % per level above. Then the per-lot commission, the leader pools with an ambassador rate of $2.00 per lot, «CPA» on the new money deposited in your network, and incentives.\n\nFor CPA and the pools the presentation and the portal show how much volume each step needs — see «The nine streams, by name». When each of the ten levels opens depends on your directs, as «The lock nobody explains» describes. Ask your sponsor to show you your own figures in the IB Portal before you count on any of it. The presentation marks the programme «subject to local restrictions» and «only available to professional Influencer»."],["A worked example with real sizes","Suppose twenty members each put in $100. At 24× each trades as $2,400. Copying the strategy's own volume — about 4.5 lots a month on about $130,000 — twenty such accounts trade about 1.7 lots a month between them. At $2.00 per lot on the first level, that is about $3.30 a month, and only once that level is open.\n\nThe volume comes from the strategy and from how much your members put in, not from anything you control. Run the number for your own team, not the one in someone's screenshot."],["The formula, so you can put your own numbers in","monthly rebate ≈ members × trades each × lots per trade × rate per lot. Every part after the ≈ sign is yours to check: the lot size depends on your leverage, and the rate depends on which programme your agreement is under. Put in your own numbers and the answer is yours, not someone else's claim."],["The nine streams, by name","So you recognise them in the portal rather than in a chat message: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 and 2, Sonic Pool, Profit Pool, NeoFX Pool and Super Sonic Bonus. «CPA Earnings» is not paid per person. It is a monthly percentage of the new money your whole team deposits — from 1 % at $10,000 to 7.5 % at $100,000,000 — counted after a «50% rule», so no more than half may come from your strongest line, and paid as the difference to anyone below you who qualifies too. One overview slide in the presentation calls it a payment per qualified registration; the portal and the presentation's own table show it as a percentage of deposits. Leader Pool 1 starts at $500,000 of team volume, Leader Pool 2 at $1,000,000. Payouts are made in USDT."],["What is not promised","No income is guaranteed and it can be zero. Everything above depends on other people depositing and trading, which depends on them choosing to, which you do not control. Treat it as a share of activity that may happen, not as a plan."]],"unverified":"These are the programme's published rates, not what you will be paid. What you actually earn shows in your own IB Portal — check it there before you repeat a number to anyone.","lock_cap":"Ten generations. Zero open until directs with active accounts unlock them.","ladder_cap":"AiTech, international: $2.00 · $1.50 · $1.00 · $1.00, then $0.50 on levels 5–10 — up to $8.50 per lot"},"no":{"lede":"Denne delen er valgfri. Du kan åpne konto, la Sonic gå og aldri introdusere et eneste menneske. Ingenting på plattformen krever det. Den ligger her fordi folk spør hvordan det virker — og fordi det er når pengene bare er halvveis forklart, at fellesskap går i stykker.","blocks":[["Hva en IB faktisk er","Megleren tar allerede spread og kurtasje på hver handel, enten du har introdusert noen eller ikke. En Introducing Broker får en andel av det megleren tjener. Det er den vanlige mekanismen i bransjen, og det er ikke et eget gebyr på den du introduserte. På Sonic er det én ting til du bør kjenne til: en del av det de over deg tjener, kommer fra medlemmets eget resultathonorar på 30 %. Honoraret er det samme uansett, men det er medlemmet som betaler det."],["Låsen ingen forklarer","Planen har ti generasjoner. De starter låst. IB-portalen viser to linjer som avgjør alt: «# of Directs with active Trading account» og «Generations unlocked». Generasjoner åpnes bare når dine directs — de du selv har introdusert — har aktive handelskontoer. Fram til da betaler de nivåbaserte strømmene ingenting på de låste nivåene. Slik åpnes de, ifølge Tag Markets-presentasjonen som andre team bruker: du må selv ha minst $250 i trading, og det åpner de tre første nivåene. Nivå fire til ti åpnes etter hvert som opptil ti personer du har introdusert direkte, har $250 i trading hver. Portalen viser ikke satsen per nivå.","lock"],["Hvordan det ser ut i ekte tall","Tall fra grunnleggerens egen portal 13. oktober 2026: fem personer introdusert, $43 innskutt til sammen, ni inntektsstrømmer listet med navn — og $0,00 opptjent. Ikke fordi noe var ødelagt, men først og fremst fordi 0 av 10 generasjoner var låst opp. Dette er det mest nyttige å forstå før du begynner. Med $43 fordelt på fem personer kom ingen av dem i nærheten av de $250 presentasjonen nevner."],["To programmer: internasjonalt og Europa","AiTechs egen presentasjon fra 3. oktober 2026 viser to versjoner av programmet. Den internasjonale, for medlemmer utenfor Europa, betaler på ti nivåer: 2,5 % av profitten på hver handel per nivå, og per lot $2,00, $1,50, $1,00, $1,00 og deretter $0,50 på nivå fem til ti — opptil $8,50 per lot til sammen. Den europeiske betaler bare på ett nivå: 2,5 % som kan stige til 22,5 % med volum, $2,00 per lot som kan stige til $6,50, og en generell bonus på $2,00 per lot pluss en bonusutbetaling. I CopyX-appen har den generelle bonusen trinn ved $10 000, $50 000, $200 000 og $500 000 i teamvolum.\n\nMeglerens eget hjelpesenter dokumenterer en tredje tabell for sine amplifiserte kontoer — $3,00, $1,20 og $0,60 på tre nivåer. Den tabellen kan høre til Tag Markets' egen partnerplan og ikke til AiTechs. Det samme hjelpesenteret sier at en handel teller bare for provisjon hvis den står åpen i minst 3 minutter.","ladder"],["Slik er bonusmodellen tegnet","Presentasjonen tegner den i fem deler. Først fordelingen av profitten på hver handel: 70 % blir hos medlemmet, 5 % går til utviklerne, og 25 % deles ti nivåer nedover i strukturen — de 2,5 % per nivå ovenfor. Så provisjonen per lot, Leader Pool-ene med en ambassadørsats på $2,00 per lot, «CPA» på de nye pengene som settes inn i nettverket ditt, og insentiver.\n\nFor CPA og poolene viser presentasjonen og portalen hvor mye volum hvert trinn krever — se «De ni strømmene, med navn». Når hvert av de ti nivåene åpnes, avhenger av dine directs, slik «Låsen ingen forklarer» beskriver. Be sponsoren din vise deg dine egne tall i IB-portalen før du regner med noe av det. Presentasjonen merker programmet «subject to local restrictions» og «only available to professional Influencer»."],["Et regnestykke med reelle størrelser","La oss si at tjue medlemmer setter inn $100 hver. Med 24× handler hver av dem som en konto på $2 400. Når de kopierer strategiens eget volum — rundt 4,5 lot i måneden på rundt $130 000 — handler tjue slike kontoer til sammen rundt 1,7 lot i måneden. Med $2,00 per lot på første nivå blir det rundt $3,30 i måneden, og bare når det nivået er åpent.\n\nVolumet kommer fra strategien og fra hvor mye medlemmene dine setter inn, ikke fra noe du styrer. Regn ut tallet for ditt eget team, ikke det som står i noens skjermbilde."],["Formelen, så du kan sette inn dine egne tall","månedlig rebate ≈ medlemmer × handler hver × lot per handel × sats per lot. Alt på høyre side kan du sjekke selv: lot-størrelsen avhenger av giringen din, og satsen av hvilket program avtalen din hører under. Setter du inn dine egne tall, er svaret ditt eget, ikke en annens påstand."],["De ni strømmene, med navn","Så du kjenner dem igjen i portalen og ikke i en chat: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 og 2, Sonic Pool, Profit Pool, NeoFX Pool og Super Sonic Bonus. «CPA Earnings» betales ikke per person. Det er en månedlig prosentandel av de nye pengene hele teamet ditt setter inn — fra 1 % ved $10 000 til 7,5 % ved $100 000 000 — som regnes etter en «50% rule», slik at høyst halvparten får komme fra din sterkeste linje, og som utbetales som differansen mot alle under deg som også kvalifiserer. Ett oversiktslysbilde i presentasjonen kaller det en betaling per kvalifisert registrering; portalen og presentasjonens egen tabell viser det som en prosentandel av innskuddene. Leader Pool 1 starter ved $500 000 i teamvolum, Leader Pool 2 ved $1 000 000. Utbetaling skjer i USDT."],["Hva som ikke er lovet","Ingen inntekt er garantert, og den kan bli null. Alt ovenfor avhenger av at andre setter inn penger og handler, og det avhenger igjen av at de selv velger å gjøre det — noe du ikke styrer. Se på det som en andel av aktivitet som kanskje skjer, ikke som en plan."]],"unverified":"Dette er programmets publiserte satser, ikke det du vil få utbetalt. Det du faktisk tjener, vises i din egen IB-portal — sjekk det der før du gjentar et tall til noen.","lock_cap":"Ti generasjoner. Ingen er åpne før directs med aktive kontoer låser dem opp.","ladder_cap":"AiTech, internasjonalt: $2,00 · $1,50 · $1,00 · $1,00, så $0,50 på nivå 5–10 — opptil $8,50 per lot"},"hi":{"lede":"यह हिस्सा वैकल्पिक है। आप account खोल सकते हैं, Sonic को चलने दे सकते हैं, और कभी एक भी व्यक्ति को बुलाए बिना रह सकते हैं। Platform पर ऐसा कोई नियम नहीं। यह यहाँ इसलिए है क्योंकि लोग पूछते हैं कि यह काम कैसे करता है — और क्योंकि जब पैसे की बात आधी-अधूरी समझाई जाती है, तो community बिगड़ जाती है।","blocks":[["IB असल में है क्या","Broker हर trade पर spread और commission पहले से लेता है, चाहे आपने किसी को बुलाया हो या नहीं। Introducing Broker को broker की कमाई का एक हिस्सा मिलता है। पूरे उद्योग में यही आम तंत्र है, और यह उस व्यक्ति पर कोई अलग fee नहीं जिसे आपने बुलाया। Sonic पर एक और बात जानना ज़रूरी है: आपसे ऊपर वाले लोग जो कमाते हैं, उसका एक हिस्सा member की अपनी 30 % performance fee से आता है। Fee दोनों हाल में उतनी ही रहती है, लेकिन उसे member ही चुकाता है।"],["वह lock जिसे कोई नहीं समझाता","Plan में दस generations हैं। वे शुरू में बंद होती हैं। आपका IB Portal दो लाइनें दिखाता है जो सब तय करती हैं: «# of Directs with active Trading account» और «Generations unlocked»। Generations तभी खुलती हैं जब आपके directs — यानी वे लोग जिन्हें आपने ख़ुद जोड़ा — के active trading accounts हों। तब तक level पर आधारित streams बंद levels पर कुछ नहीं देतीं। ये कैसे खुलती हैं, Tag Markets के उस presentation के मुताबिक़ जिसे दूसरी teams इस्तेमाल करती हैं: ख़ुद आपके कम से कम $250 trading में होने चाहिए, जिससे पहले तीन levels खुलते हैं। Levels चार से दस, जैसे-जैसे आपके सीधे जोड़े हुए दस तक लोगों में से हर एक के $250 trading में होते हैं, वैसे-वैसे खुलते हैं। Portal हर level की दर नहीं दिखाता।","lock"],["असली आँकड़ों में यह कैसा दिखता है","13 अक्टूबर 2026 को founder के अपने portal के आँकड़े: पाँच लोग बुलाए गए, सबका मिलाकर $43 जमा, नौ income streams नाम से दर्ज — और कमाई $0.00। इसलिए नहीं कि कुछ ख़राब था, बल्कि मुख्य रूप से इसलिए कि 10 में से 0 generations खुली थीं। शुरू करने से पहले समझने लायक सबसे ज़रूरी बात यही है। पाँच लोगों में कुल $43 के साथ, उनमें से कोई भी presentation में बताए गए $250 के आसपास भी नहीं पहुँचा।"],["दो programmes: अंतरराष्ट्रीय और यूरोप","AiTech के अपने 3 अक्टूबर 2026 के presentation में programme के दो रूप दिखाए गए हैं। अंतरराष्ट्रीय programme, जो यूरोप से बाहर के members के लिए है, दस levels पर भुगतान करता है: हर level पर हर trade के profit का 2.5 %, और प्रति lot $2.00, $1.50, $1.00, $1.00 और फिर levels पाँच से दस पर $0.50 — कुल मिलाकर प्रति lot $8.50 तक। यूरोप वाला programme सिर्फ़ एक level पर भुगतान करता है: 2.5 %, जो volume के साथ 22.5 % तक बढ़ सकता है; $2.00 प्रति lot, जो $6.50 तक बढ़ सकता है; और एक general bonus — $2.00 प्रति lot और एक bonus payment। CopyX app में इस general bonus के क़दम $10,000, $50,000, $200,000 और $500,000 के team volume पर हैं।\n\nBroker का अपना help centre अपने amplified accounts के लिए एक तीसरी तालिका बताता है — तीन levels पर $3.00, $1.20 और $0.60। हो सकता है कि वह तालिका AiTech के नहीं, बल्कि Tag Markets के अपने partner plan की हो। वही help centre कहता है कि कोई trade commission के लिए तभी गिनी जाती है जब वह कम से कम 3 मिनट खुली रहे।","ladder"],["Bonus model कैसे बनाया गया है","Presentation इसे पाँच हिस्सों में दिखाता है। पहले हर trade के profit का बँटवारा: 70 % member के पास रहता है, 5 % developers को जाता है, और 25 % structure में दस levels नीचे तक बाँटा जाता है — यानी ऊपर बताया गया हर level का 2.5 %। फिर प्रति lot commission, $2.00 प्रति lot की एम्बेसडर दर वाले leader pools, आपके network में जमा हुए नए पैसे पर «CPA», और incentives।\n\nCPA और pools के लिए presentation और portal दिखाते हैं कि हर क़दम के लिए कितना volume चाहिए — देखें «नौ streams, नाम से»। दस levels में से हर एक कब खुलता है, यह आपके directs पर निर्भर है, जैसा «वह lock जिसे कोई नहीं समझाता» में बताया गया है। इसमें से किसी पर भी भरोसा करने से पहले अपने sponsor से कहें कि IB Portal में आपको आपके अपने आँकड़े दिखाए। Presentation में programme के लिए लिखा है «subject to local restrictions» और «only available to professional Influencer»।"],["असली sizes के साथ एक हिसाब","मान लें बीस members में से हर एक $100 जमा करता है। 24× पर हर एक $2,400 के account की तरह trade करता है। Strategy के अपने volume को copy करते हुए — क़रीब $130,000 पर महीने में क़रीब 4.5 lots — ऐसे बीस accounts मिलकर महीने में क़रीब 1.7 lots trade करते हैं। पहले level पर $2.00 प्रति lot के हिसाब से यह महीने में क़रीब $3.30 बनता है, और वह भी तभी जब वह level खुला हो।\n\nVolume strategy से आता है और इस बात से कि आपके members कितना जमा करते हैं, किसी ऐसी चीज़ से नहीं जो आपके हाथ में हो। अपनी team के लिए हिसाब लगाएँ, किसी के screenshot वाले आँकड़े पर नहीं।"],["सूत्र, ताकि आप अपने आँकड़े डाल सकें","मासिक rebate ≈ members × हर एक की trades × lo ھی جب وہ level کھلا ہو۔\n\nVolume strategy سے آتا ہے اور اِس بات سے کہ آپ کے members کتنا جمع کراتے ہیں، کسی ایسی چیز سے نہیں جو آپ کے اختیار میں ہو۔ اپنی team کے لیے حساب لگائیں، کسی کے screenshot والے عدد پر نہیں۔"],["فارمولا، تاکہ آپ اپنے اعداد ڈال سکیں","ماہانہ rebate ≈ members × ہر ایک کی trades × lots فی trade × شرح فی lot۔ اِن چاروں چیزوں کو آپ خود جانچ سکتے ہیں: lot size آپ کی leverage پر منحصر ہے، اور شرح اس پر کہ آپ کی agreement کس programme کے تحت ہے۔ اپنے اعداد ڈالیں، اور جواب آپ کا ہوگا، کسی اور کا دعویٰ نہیں۔"],["نو streams، نام کے ساتھ","تاکہ آپ اُنہیں portal میں پہچانیں، کسی chat میں نہیں: Lot Commissions، Profit Share، CPA Earnings، Leader Pool 1 اور 2، Sonic Pool، Profit Pool، NeoFX Pool اور Super Sonic Bonus۔ «CPA Earnings» فی شخص کے حساب سے نہیں ملتی۔ یہ اُس نئے پیسے کا ماہانہ فیصد ہے جو آپ کی پوری team جمع کراتی ہے — $10,000 پر 1 % سے لے کر $100,000,000 پر 7.5 % تک۔ اِسے ایک «50% rule» لگانے کے بعد گنا جاتا ہے، یعنی آدھے سے زیادہ حصہ آپ کی سب سے مضبوط line سے نہیں آ سکتا، اور ادائیگی فرق کی صورت میں ہوتی ہے، اُن سب کے مقابلے میں جو آپ کے نیچے خود بھی qualify کرتے ہیں۔ Presentation کی ایک overview slide اِسے ہر qualified registration پر ملنے والی ادائیگی بتاتی ہے؛ portal اور presentation کا اپنا جدول اِسے deposits کے فیصد کے طور پر دکھاتے ہیں۔ Leader Pool 1 کی شروعات $500,000 کے team volume سے ہوتی ہے، Leader Pool 2 کی $1,000,000 سے۔ ادائیگی USDT میں ہوتی ہے۔"],["کس بات کا وعدہ نہیں","کسی آمدنی کی ضمانت نہیں اور وہ صفر بھی ہو سکتی ہے۔ اوپر سب کچھ اس پر منحصر ہے کہ دوسرے پیسے جمع کرائیں اور trade کریں، جو اس پر منحصر ہے کہ وہ ایسا چنیں — اور وہ آپ کے اختیار میں نہیں۔ اسے ایسی سرگرمی کا حصہ سمجھیں جو شاید ہو، کسی plan کی طرح نہیں۔"]],"unverified":"یہ programme کی شائع کی ہوئی شرحیں ہیں، وہ نہیں جو آپ کو ملے گا۔ آپ اصل میں کتنا کماتے ہیں، یہ آپ کے اپنے IB Portal میں نظر آتا ہے — کسی کو کوئی عدد دہرانے سے پہلے وہیں دیکھ لیں۔","lock_cap":"دس generations۔ جب تک active account والے directs اِنہیں نہ کھولیں، ایک بھی نہیں کھلتی۔","ladder_cap":"AiTech، بین الاقوامی: $2.00 · $1.50 · $1.00 · $1.00، پھر levels 5–10 پر $0.50 — فی lot $8.50 تک"},"ar":{"lede":"هذا الجزء اختياري. يمكنك فتح حساب، وترك Sonic يعمل، دون أن تعرّف أحداً على الإطلاق. ولا شيء في المنصّة يفرض ذلك. وهو هنا لأنّ الناس يسألون كيف يعمل — ولأنّ أنصاف الشروح في أمور المال هي ما يُفسد المجتمعات.","blocks":[["ما هو الـ IB فعلاً","الـ broker يأخذ أصلاً الـ spread والعمولة على كل صفقة، عرّفت أحداً أم لا. والـ Introducing Broker يأخذ حصّة ممّا يكسبه الـ broker. هذه هي الآلية المعتادة في القطاع، وهي ليست رسماً منفصلاً على من عرّفته. وفي Sonic أمر آخر ينبغي أن تعرفه: جزء ممّا يكسبه مَن هم فوقك يأتي من رسم الأداء الخاص بالعضو نفسه، وقدره 30 %. والرسم هو نفسه في الحالتين، لكن العضو هو من يدفعه."],["القفل الذي لا يشرحه أحد","في الخطة عشرة أجيال، وكلها تبدأ مقفلة. ويعرض الـ IB Portal سطرين يحدّدان كل شيء: «# of Directs with active Trading account» و«Generations unlocked». ولا تُفتح الأجيال إلا عندما تكون لدى الـ directs الخاصين بك — أي مَن عرّفتهم أنت بنفسك — حسابات تداول نشطة. وإلى ذلك الحين لا تدفع مصادر الدخل القائمة على المستويات شيئاً عن المستويات المقفلة. أما كيف تُفتح، فبحسب عرض Tag Markets الذي تستخدمه فِرق أخرى: تحتاج أنت نفسك إلى $250 على الأقل في التداول، وهذا يفتح المستويات الثلاثة الأولى. وتُفتح المستويات من الرابع إلى العاشر كلما أصبح لدى أشخاص عرّفتهم مباشرةً — حتى عشرة أشخاص — $250 في التداول لكلٍّ منهم. ولا يُظهر الـ portal السعر لكل مستوى.","lock"],["كيف يبدو ذلك بأرقام حقيقية","أرقام من الـ portal الخاص بالمؤسّس نفسه في 13 أكتوبر 2026: خمسة أشخاص عرّفهم، وإيداعاتهم مجتمعةً $43، وتسعة مصادر دخل مذكورة بالاسم — و$0.00 مكتسبة. لا لأنّ شيئاً كان معطّلاً، بل أساساً لأنّ 0 من 10 أجيال كانت مفتوحة. وهذا أنفع ما تفهمه قبل أن تبدأ. وبمبلغ $43 موزَّعاً على خمسة أشخاص، لم يقترب أيٌّ منهم من مبلغ $250 الذي يذكره العرض."],["برنامجان: الدولي والأوروبي","العرض الذي قدّمته AiTech نفسها بتاريخ 3 أكتوبر 2026 يُظهر نسختين من البرنامج. النسخة الدولية، للأعضاء خارج أوروبا، تدفع على عشرة مستويات: 2.5 % من ربح كل صفقة في كل مستوى، ولكل lot: ‏$2.00 و$1.50 و$1.00 و$1.00، ثم $0.50 في المستويات من الخامس إلى العاشر — أي حتى $8.50 لكل lot إجمالاً. أما النسخة الأوروبية فتدفع على مستوى واحد فقط: 2.5 % يمكن أن ترتفع إلى 22.5 % مع الحجم، و$2.00 لكل lot يمكن أن يرتفع إلى $6.50، ومكافأة عامة قدرها $2.00 لكل lot مع دفعة مكافأة. وفي تطبيق CopyX لهذه المكافأة العامة درجات عند $10,000 و$50,000 و$200,000 و$500,000 من حجم تداول الفريق.\n\nويوثّق مركز مساعدة الـ broker نفسه جدولاً ثالثاً لحساباته المضاعَفة — $3.00 و$1.20 و$0.60 على ثلاثة مستويات. وقد يكون هذا الجدول تابعاً لخطة الشركاء الخاصة بـ Tag Markets نفسها، لا لخطة AiTech. ويذكر مركز المساعدة نفسه أن الصفقة لا تُحتسب في العمولة إلا إذا بقيت مفتوحة 3 دقائق على الأقل.","ladder"],["كيف رُسم نموذج المكافآت","يرسمه العرض في خمسة أجزاء. أولاً توزيع ربح كل صفقة: تبقى 70 % للعضو، و5 % للمطوّرين، و25 % تُوزَّع على عشرة مستويات نزولاً في الهيكل — وهي الـ 2.5 % لكل مستوى المذكورة أعلاه. ثم العمولة لكل lot، والـ leader pools بسعر للسفير قدره $2.00 لكل lot، و«CPA» على المال الجديد المودَع في شبكتك، والحوافز.\n\nأما الـ CPA والـ pools فيُظهر العرض والـ portal حجم التداول الذي تتطلّبه كل درجة منها — انظر «المصادر التسعة بالاسم». ومتى يُفتح كل مستوى من المستويات العشرة يتوقّف على الـ directs الخاصين بك، كما يوضّح «القفل الذي لا يشرحه أحد». اطلب من الـ sponsor أن يريك أرقامك أنت في الـ IB Portal قبل أن تعتمد على أي شيء منه. ويصف العرض البرنامج بأنه «subject to local restrictions» و«only available to professional Influencer»."],["مثال عملي بأحجام حقيقية","لنفترض أن عشرين عضواً أودع كلٌّ منهم $100. عند 24× يتداول كلٌّ منهم كحساب بقيمة $2,400. وبنسخ حجم تداول الاستراتيجية نفسها — نحو 4.5 lots في الشهر على نحو $130,000 — يتداول عشرون حساباً من هذا النوع فيما بينها نحو 1.7 lots في الشهر. وبواقع $2.00 لكل lot في المستوى الأول، يكون ذلك نحو $3.30 في الشهر، ولن يتحقّق إلا بعد أن يُفتح هذا المستوى.\n\nأما حجم التداول فيأتي من الاستراتيجية ومن المبالغ التي يودعها أعضاؤك، لا من أي شيء تتحكّم فيه أنت. احسب الرقم لفريقك أنت، لا الرقم الظاهر في لقطة شاشة أحدهم."],["المعادلة، لتحسب بأرقامك أنت","الـ rebate الشهري ≈ الأعضاء × صفقات كلٍّ منهم × الـ lots لكل صفقة × السعر لكل lot. وكل العوامل في الطرف الآخر من المعادلة تستطيع التحقّق منها بنفسك: حجم الـ lot يتبع الـ leverage لديك، والسعر يتبع البرنامج الذي يندرج تحته اتفاقك. ضع أرقامك أنت، فيصير الجواب جوابك أنت لا ادّعاء غيرك."],["المصادر التسعة بالاسم","لتعرفها في الـ portal لا في رسالة chat: Lot Commissions، وProfit Share، وCPA Earnings، وLeader Pool 1 و2، وSonic Pool، وProfit Pool، وNeoFX Pool، وSuper Sonic Bonus. و«CPA Earnings» لا تُدفع عن كل شخص، بل هي نسبة شهرية من المال الجديد الذي يودعه فريقك كله — من 1 % عند $10,000 إلى 7.5 % عند $100,000,000 — تُحتسب بعد تطبيق «50% rule»، فلا يجوز أن يأتي أكثر من النصف من أقوى خطّ لديك، وتُدفع على شكل الفرق بينك وبين كل من تحتك ممن يتأهّل هو أيضاً. وتصفها إحدى شرائح النظرة العامة في العرض بأنها دفعة عن كل تسجيل مؤهَّل؛ أما الـ portal وجدول العرض نفسه فيُظهرانها نسبةً من الإيداعات. ويبدأ Leader Pool 1 عند $500,000 من حجم تداول الفريق، وLeader Pool 2 عند $1,000,000. والدفع يتم بـ USDT."],["ما لا نعدك به","لا دخل مضمون، وقد يكون صفراً. وكل ما سبق يتوقّف على إيداع الآخرين وتداولهم، وهو يتوقّف على اختيارهم، وأنت لا تتحكّم فيه. اعتبره حصّة من نشاط قد يحدث، لا خطة."]],"unverified":"هذه هي الأسعار المنشورة للبرنامج، لا ما سيُدفع لك. وما تكسبه فعلاً يظهر في الـ IB Portal الخاص بك — تحقّق منه هناك قبل أن تنقل رقماً لأحد.","lock_cap":"عشرة أجيال، ولا شيء منها مفتوح إلى أن يفتحها مَن عرّفتهم مباشرةً ولديهم حسابات نشطة.","ladder_cap":"البرنامج الدولي لـ AiTech: ‏$2.00 · $1.50 · $1.00 · $1.00، ثم $0.50 في المستويات من 5 إلى 10 — حتى $8.50 لكل lot"},"ar_rm":{"lede":"Hadha al-juz' ikhtiyari. Yumkinuk fath hisab, w tark Sonic ya3mal, dun an tu3arrif ahadan 3ala al-itlaq. W la shay' fil-minassa yafrid dhalik. W huwa huna li-anna al-nas yas'alun kayf ya3mal — w li-anna ansaf al-shuruh fi umur al-mal hiya ma yufsid al-mujtama3at.","blocks":[["Ma huwa al-IB fi3lan","Al-broker ya'khudh aslan al-spread w al-3umula 3ala kull safqa, 3arraft ahadan am la. W al-Introducing Broker ya'khudh hissa mimma yaksibuh al-broker. Hadhihi hiya al-aliya al-mu3tada fil-qita3, w hiya laysat rasman munfasilan 3ala man 3arraftah. W fi Sonic amr akhar yanbaghi an ta3rifah: juz' mimma yaksibuh man hum fawqak ya'ti min rasm al-ada' al-khass bil-3udw nafsuh, w qadruh 30 %. W al-rasm huwa nafsuh fil-halatayn, lakin al-3udw huwa man yadfa3uh."],["Al-qufl alladhi la yashrahuh ahad","Fil-khutta 3asharat ajyal, w kulluha tabda' muqfala. W ya3rid al-IB Portal satrayn yuhaddidan kull shay': «# of Directs with active Trading account» w «Generations unlocked». W la tuftah al-ajyal illa 3indama takun lada al-directs al-khassin bik — ay man 3arraftahum anta binafsak — hisabat tadawul nashita. W ila dhalik al-hin la tadfa3 masadir al-dakhl al-qa'ima 3ala al-mustawayat shay'an 3an al-mustawayat al-muqfala. Amma kayf tuftah, fabi-hasab 3ard Tag Markets alladhi tastakhdimuh firaq ukhra: tahtaj anta nafsak ila $250 3ala al-aqall fil-tadawul, w hadha yaftah al-mustawayat al-thalatha al-ula. W tuftah al-mustawayat min al-rabi3 ila al-3ashir kullama asbaha lada ashkhas 3arraftahum mubasharatan — hatta 3asharat ashkhas — $250 fil-tadawul li-kullin minhum. W la yuzhir al-portal al-si3r li-kull mustawa.","lock"],["Kayf yabdu dhalik bi-arqam haqiqiya","Arqam min al-portal al-khass bil-mu'assis nafsuh fi 13 uktubar 2026: khamsat ashkhas 3arrafahum, w ida3atuhum mujtami3atan $43, w tis3at masadir dakhl madhkura bil-ism — w $0.00 muktasaba. La li-anna shay'an kan mu3attalan, bal asasan li-anna 0 min 10 ajyal kanat maftuha. W hadha anfa3 ma tafhamuh qabl an tabda'. W bi-mablagh $43 muwazza3an 3ala khamsat ashkhas, lam yaqtarib ayyun minhum min mablagh $250 alladhi yadhkuruh al-3ard."],["Barnamajan: al-dawli w al-urubbi","Al-3ard alladhi qaddamathu AiTech nafsuha bi-tarikh 3 uktubar 2026 yuzhir nuskhatayn min al-barnamaj. Al-nuskha al-dawliya, lil-a3da' kharij Urubba, tadfa3 3ala 3asharat mustawayat: 2.5 % min ribh kull safqa fi kull mustawa, w li-kull lot: $2.00 w $1.50 w $1.00 w $1.00, thumma $0.50 fil-mustawayat min al-khamis ila al-3ashir — ay hatta $8.50 li-kull lot ijmalan. Amma al-nuskha al-urubbiya fatadfa3 3ala mustawa wahid faqat: 2.5 % yumkin an tartafi3 ila 22.5 % ma3 al-hajm, w $2.00 li-kull lot yumkin an yartafi3 ila $6.50, w mukafa'a 3amma qadruha $2.00 li-kull lot ma3 daf3at mukafa'a. W fi tatbiq CopyX li-hadhihi al-mukafa'a al-3amma darajat 3ind $10,000 w $50,000 w $200,000 w $500,000 min hajm tadawul al-fariq.\n\nW yuwaththiq markaz musa3adat al-broker nafsuh jadwalan thalithan li-hisabatih al-muda3afa — $3.00 w $1.20 w $0.60 3ala thalathat mustawayat. W qad yakun hadha al-jadwal tabi3an li-khuttat al-shuraka' al-khassa bi Tag Markets nafsuha, la li-khuttat AiTech. W yadhkur markaz al-musa3ada nafsuh anna al-safqa la tuhtasab fil-3umula illa idha baqiyat maftuha 3 daqa'iq 3ala al-aqall.","ladder"],["Kayf rusim namudhaj al-mukafa'at","Yarsumuh al-3ard fi khamsat ajza'. Awwalan tawzi3 ribh kull safqa: tabqa 70 % lil-3udw, w 5 % lil-mutawwirin, w 25 % tuwazza3 3ala 3asharat mustawayat nuzulan fil-haykal — w hiya al-2.5 % li-kull mustawa al-madhkura a3lah. Thumma al-3umula li-kull lot, w al-leader pools bi-si3r lil-safir qadruh $2.00 li-kull lot, w «CPA» 3ala al-mal al-jadid al-muda3 fi shabakatak, w al-hawafiz.\n\nAmma al-CPA w al-pools fayuzhir al-3ard w al-portal hajm al-tadawul alladhi tatatallabuh kull daraja minha — unzur «Al-masadir al-tis3a bil-ism». W mata yuftah kull mustawa min al-mustawayat al-3ashara yatawaqqaf 3ala al-directs al-khassin bik, kama yuwaddih «Al-qufl alladhi la yashrahuh ahad». Utlub min al-sponsor an yuriyak arqamak anta fil-IB Portal qabl an ta3tamid 3ala ayy shay' minh. W yasif al-3ard al-barnamaj bi-annahu «subject to local restrictions» w «only available to professional Influencer»."],["Mithal 3amali bi-ahjam haqiqiya","Li-nafturid anna 3ishrin 3udwan awda3a kullun minhum $100. 3ind 24× yatadawal kullun minhum ka-hisab bi-qimat $2,400. W bi-naskh hajm tadawul al-istratijiya nafsiha — nahwa 4.5 lots fil-shahr 3ala nahwa $130,000 — yatadawal 3ishrun hisaban min hadha al-naw3 fima baynaha nahwa 1.7 lots fil-shahr. W bi-waqi3 $2.00 li-kull lot fil-mustawa al-awwal, yakun dhalik nahwa $3.30 fil-shahr, w lan yatahaqqaq illa ba3d an yuftah hadha al-mustawa.\n\nAmma hajm al-tadawul faya'ti min al-istratijiya w min al-mabaligh allati yudi3uha a3da'uk, la min ayy shay' tatahakkam fih anta. Ihsib al-raqm li-fariqak anta, la al-raqm al-zahir fi laqtat shashat ahadihim."],["Al-mu3adala, li-tahsub bi-arqamak anta","Al-rebate al-shahri ≈ al-a3da' × safaqat kull minhum × al-lots li-kull safqa × al-si3r li-kull lot. W kull al-3awamil fil-taraf al-akhar min al-mu3adala tastati3 al-tahaqquq minha binafsak: hajm al-lot yatba3 al-leverage ladayk, w al-si3r yatba3 al-barnamaj alladhi yandarij tahtah ittifaqak. Da3 arqamak anta, fayasir al-jawab jawabak anta la iddi3a' ghayrik."],["Al-masadir al-tis3a bil-ism","Li-ta3rifaha fil-portal la fi risalat chat: Lot Commissions, w Profit Share, w CPA Earnings, w Leader Pool 1 w 2, w Sonic Pool, w Profit Pool, w NeoFX Pool, w Super Sonic Bonus. W «CPA Earnings» la tudfa3 3an kull shakhs, bal hiya nisba shahriya min al-mal al-jadid alladhi yudi3uh fariqak kulluh — min 1 % 3ind $10,000 ila 7.5 % 3ind $100,000,000 — tuhtasab ba3d tatbiq «50% rule», fala yajuz an ya'ti akthar min al-nisf min aqwa khatt ladayk, w tudfa3 3ala shakl al-farq baynak w bayn kull man tahtak mimman yata'ahhal huwa aydan. W tasifuha ihda shara'ih al-nazra al-3amma fil-3ard bi-annaha daf3a 3an kull tasjil mu'ahhal; amma al-portal w jadwal al-3ard nafsuh fayuzhiraniha nisbatan min al-ida3at. W yabda' Leader Pool 1 3ind $500,000 min hajm tadawul al-fariq, w Leader Pool 2 3ind $1,000,000. W al-daf3 yatimm bi USDT."],["Ma la na3idak bih","La dakhl madmun, w qad yakun sifran. W kull ma sabaq yatawaqqaf 3ala ida3 al-akharin w tadawulihim, w huwa yatawaqqaf 3ala ikhtiyarihim, w anta la tatahakkam fih. I3tabirh hissa min nashat qad yahduth, la khutta."]],"unverified":"Hadhihi hiya al-as3ar al-manshura lil-barnamaj, la ma sayudfa3 lak. W ma taksibuh fi3lan yazhar fil-IB Portal al-khass bik — tahaqqaq minh hunak qabl an tanqul raqman li-ahad.","lock_cap":"3asharat ajyal, w la shay' minha maftuh ila an yaftahaha man 3arraftahum mubasharatan w ladayhim hisabat nashita.","ladder_cap":"Al-barnamaj al-dawli li AiTech: $2.00 · $1.50 · $1.00 · $1.00, thumma $0.50 fil-mustawayat min 5 ila 10 — hatta $8.50 li-kull lot"},"ur_rm":{"lede":"Yeh hissa ikhtiyari hai. Aap account khol sakte hain, Sonic ko chalne de sakte hain, aur kisi ek shakhs ko bhi bulaye baghair yeh sab kar sakte hain. Platform par aisa koi taqaza nahi. Yeh yahan is liye hai keh log poochte hain keh kaam kaise hota hai — aur is liye keh jab paise ki baat aadhi adhoori samjhai jaaye to community isi se bigadti hai.","blocks":[["IB asal mein hai kya","Broker har trade par spread aur commission pehle se leta hai, chahe aap ne kisi ko bulaya ho ya na. Introducing Broker ko broker ki kamaai ka ek hissa milta hai. Poori industry mein yahi aam nizaam hai, aur yeh us shakhs par koi alag fee nahi jise aap ne bulaya. Sonic par ek aur baat jaanna zaroori hai: aap se upar wale log jo kamate hain, us ka ek hissa member ki apni 30 % performance fee se aata hai. Fee dono soorton mein utni hi rehti hai, lekin use member hi ada karta hai."],["Woh lock jise koi nahi samjhata","Plan mein das generations hain. Woh shuru mein band hoti hain. Aap ka IB Portal do lines dikhata hai jo sab tay karti hain: «# of Directs with active Trading account» aur «Generations unlocked». Generations tabhi khulti hain jab aap ke directs — yaani woh log jinhein aap ne khud bulaya — ke active trading accounts hon. Tab tak level par mabni streams band levels par kuch nahi deteen. Yeh kaise khulti hain, Tag Markets ke us presentation ke mutabiq jise doosri teams istemal karti hain: khud aap ke kam az kam $250 trading mein hone chahiyein, jis se pehle teen levels khulte hain. Levels chaar se das, jaise jaise aap ke baraah-e-raast bulaye hue das tak logon mein se har ek ke $250 trading mein hon, waise waise khulte hain. Portal har level ki sharah nahi dikhata.","lock"],["Asal adaad mein yeh kaisa lagta hai","13 October 2026 ko founder ke apne portal ke adaad: paanch log bulaye gaye, sab ka mil kar $43 jama, nau income streams naam se darj — aur kamaai $0.00. Is liye nahi keh kuch kharab tha, balkeh buniyadi taur par is liye keh 10 mein se 0 generations khuli thein. Shuru karne se pehle samajhne ke laaiq sab se aham baat yahi hai. Paanch logon mein kul $43 ke saath, un mein se koi bhi presentation mein bataye gaye $250 ke qareeb bhi nahi pahuncha."],["Do programmes: bain-ul-aqwami aur Europe","AiTech ke apne 3 October 2026 ke presentation mein programme ke do roop dikhaye gaye hain. Bain-ul-aqwami programme, jo Europe se bahar ke members ke liye hai, das levels par adaigi karta hai: har level par har trade ke profit ka 2.5 %, aur fi lot $2.00, $1.50, $1.00, $1.00 aur phir levels paanch se das par $0.50 — kul mila kar fi lot $8.50 tak. Europe wala programme sirf ek level par adaigi karta hai: 2.5 %, jo volume ke saath 22.5 % tak badh sakta hai; $2.00 fi lot, jo $6.50 tak badh sakta hai; aur ek general bonus — $2.00 fi lot aur ek bonus payment. CopyX app mein is general bonus ke qadam $10,000, $50,000, $200,000 aur $500,000 ke team volume par hain.\n\nBroker ka apna help centre apne amplified accounts ke liye ek teesra jadwal batata hai — teen levels par $3.00, $1.20 aur $0.60. Ho sakta hai yeh jadwal AiTech ke bajaye Tag Markets ke apne partner plan ka ho. Wohi help centre kehta hai keh koi trade commission ke liye tabhi gini jaati hai jab woh kam az kam 3 minute khuli rahe.","ladder"],["Bonus model kaise banaya gaya hai","Presentation ise paanch hisson mein dikhata hai. Pehle har trade ke profit ki taqseem: 70 % member ke paas rehta hai, 5 % developers ko jaata hai, aur 25 % structure mein das levels neeche tak baanta jaata hai — yaani upar bataya gaya har level ka 2.5 %. Phir fi lot commission, $2.00 fi lot ki ambassador sharah wale leader pools, aap ke network mein jama hone wale naye paise par «CPA», aur incentives.\n\nCPA aur pools ke liye presentation aur portal dikhate hain keh har qadam ke liye kitna volume chahiye — dekhein «Nau streams, naam ke saath». Das levels mein se har ek kab khulta hai, yeh aap ke directs par munhasir hai, jaisa keh «Woh lock jise koi nahi samjhata» mein bataya gaya hai. Is mein se kisi par bhi bharosa karne se pehle apne sponsor se kahein keh IB Portal mein aap ko aap ke apne adaad dikhaye. Presentation mein programme ke liye likha hai «subject to local restrictions» aur «only available to professional Influencer»."],["Asal sizes ke saath ek hisaab","Farz karein bees members mein se har ek $100 jama karata hai. 24× par har ek $2,400 ke account ki tarah trade karta hai. Strategy ke apne volume ko copy karte hue — taqreeban $130,000 par mahine mein taqreeban 4.5 lots — aise bees accounts mil kar mahine mein taqreeban 1.7 lots trade karte hain. Pehle level par $2.00 fi lot ke hisaab se yeh mahine mein taqreeban $3.30 bante hain, aur woh bhi tabhi jab woh level khula ho.\n\nVolume strategy se aata hai aur is baat se keh aap ke members kitna jama karate hain, kisi aisi cheez se nahi jo aap ke ikhtiyar mein ho. Apni team ke liye hisaab lagayein, kisi ke screenshot wale adad par nahi."],["Formula, taakeh aap apne adaad daal sakein","Mahana rebate ≈ members × har ek ki trades × lots fi trade × sharah fi lot. In chaaron cheezon ko aap khud jaanch sakte hain: lot size aap ki leverage par munhasir hai, aur sharah is par keh aap ki agreement kis programme ke tehat hai. Apne adaad daalein, aur jawab aap ka hoga, kisi aur ka daawa nahi."],["Nau streams, naam ke saath","Taakeh aap unhein portal mein pehchanein, kisi chat mein nahi: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 aur 2, Sonic Pool, Profit Pool, NeoFX Pool aur Super Sonic Bonus. «CPA Earnings» fi shakhs ke hisaab se nahi milti. Yeh us naye paise ka mahana feesad hai jo aap ki poori team jama karati hai — $10,000 par 1 % se le kar $100,000,000 par 7.5 % tak. Ise ek «50% rule» lagane ke baad gina jaata hai, yaani aadhe se zyada hissa aap ki sab se mazboot line se nahi aa sakta, aur adaigi farq ki soorat mein hoti hai, un sab ke muqable mein jo aap ke neeche khud bhi qualify karte hain. Presentation ki ek overview slide ise har qualified registration par milne wali adaigi batati hai; portal aur presentation ka apna jadwal ise deposits ke feesad ke taur par dikhate hain. Leader Pool 1 ki shuruaat $500,000 ke team volume se hoti hai, Leader Pool 2 ki $1,000,000 se. Adaigi USDT mein hoti hai."],["Kis baat ka waada nahi","Kisi aamdani ki zamanat nahi aur woh sifar bhi ho sakti hai. Upar sab kuch is par munhasir hai keh doosre paise jama karayein aur trade karein, jo is par munhasir hai keh woh aisa chunein — aur woh aap ke ikhtiyar mein nahi. Ise aisi sargarmi ka hissa samjhein jo shayad ho, kisi plan ki tarah nahi."]],"unverified":"Yeh programme ki shaye ki hui sharhein hain, woh nahi jo aap ko milega. Aap asal mein kitna kamaate hain, yeh aap ke apne IB Portal mein nazar aata hai — kisi ko koi adad dohrane se pehle wahin dekh lein.","lock_cap":"Das generations. Jab tak active account wale directs inhein na kholein, ek bhi nahi khulti.","ladder_cap":"AiTech, bain-ul-aqwami: $2.00 · $1.50 · $1.00 · $1.00, phir levels 5–10 par $0.50 — fi lot $8.50 tak"}},"menu":{"en":{"lede":"Pick the part you need now — the rest stays here.","back":"All sections","items":[["start","Get set up","Ten steps from a link to an account that works."],["tools","Tools","Results, the news calendar, the chat — and the apps."],["earn","Sonic, and what you earn","How the copy trading works, and the bonus model."],["calc","Your amount","What the record would have meant for your money — after every cost."],["learn","Learn the groundwork","Pips, lots and spreads — with the formulas."],["faq","Questions and answers","Short answers to what people usually ask."]]},"no":{"lede":"Velg delen du trenger nå —
