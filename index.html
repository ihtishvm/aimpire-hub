 خانة الدولة تأتي محدَّدة على ألبانيا عند الجميع — غيّرها إلى بلد إقامتك الفعلي، لأن مفتاح الهاتف يتغيّر معها. ثم ضع علامة في المربعين، وانتظر حتى ينتهي مربع «Verifying…» الرمادي الصغير في الأسفل، واضغط Sign Up. والضغط عليه قبل انتهاء التحقق لا يفعل شيئاً.",{"img":"assets/shot-register.jpg","alt":"استمارة التسجيل في CopyX","marks":[{"n":1,"x":24,"y":32,"t":"اسمك الحقيقي. يجب أن يطابق الهوية التي ترفعها بعد قليل، وإلا فسيفشل التحقق."},{"n":2,"x":24,"y":45,"t":"اختر password لا تستخدمه في أي مكان آخر — ولا تستخدم نفس password بريدك الإلكتروني."},{"n":3,"x":9,"y":66,"t":"علّم المربعين. اقرأهما أولاً — فهما يقولان إنك قد تخسر مالك."},{"n":4,"x":50,"y":87,"t":"إذا رأيت هذا المربع الأصفر، فرابطك كان ينقصه رمز الدعوة. ارجع وافتح رابط الـ sponsor بدلاً منه."},{"n":5,"x":24,"y":56,"t":"هذه الخانة تأتي محدَّدة على ألبانيا عند الجميع. غيّرها — فمفتاح الهاتف يتغيّر معها."}],"check":"تصل إلى داخل الـ portal وترى اسمك أنت، لا استمارة التسجيل من جديد."}],["اربط حساب الـ broker — هذه الخطوة مهمة","بعد أن تدخل إلى الـ portal، ابحث عن زر Login to CopyX واستخدمه لإنشاء حساب Tag Markets الخاص بك. ولا تُنشئ الحساب بنفسك على CopyX أو عند الـ broker مباشرةً: الحساب الذي يُنشأ بهذه الطريقة لا يكون مرتبطاً بحسابك هنا، ولن يُحتسب لك شيء بعد ذلك.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"شاهد هذه الخطوة"},"note":"النص في الـ portal صريح: سجّل حساب Tag Markets الخاص بك عبر ذلك الزر حصراً.","img":"assets/shot-copyx-register.jpg","alt":"لوحة تسجيل CopyX داخل الـ IB portal","marks":[{"n":1,"x":34,"y":37,"t":"اقرأ هذا السطر. فهو يطلب منك أن تُنشئ حساب الـ broker من هنا، لا من أي مكان آخر."},{"n":2,"x":13,"y":71,"t":"هذا هو الزر. مكتوب عليه Login to CopyX — استخدمه حتى في المرة الأولى."},{"n":3,"x":50,"y":90,"t":"التحذير بالأصفر: الحساب الذي يُنشأ مباشرةً على CopyX لن يكون مرتبطاً بحسابك هنا."}],"check":"يظهر حساب Tag Markets داخل الـ portal. وإن اضطررت لتسجيل دخول منفصل لتجده، فهو غير مرتبط."}],["أكّد هويتك","ستحتاج إلى بطاقة هويتك أو جواز سفرك، وإلى مستند يُظهر عنوانك. صوّرهما في ضوء جيد مع ظهور زواياها الأربع كاملة. والصورة غير الواضحة هي السبب الأول للرفض، وليس السبب شيئاً أخطر من ذلك.",{"img":"assets/shot-kyc.jpg","alt":"لوحة رفع المستندات","marks":[{"n":1,"x":50,"y":44,"t":"اختر نوع المستند من هنا أولاً. لا يُرفع شيء قبل ذلك."},{"n":2,"x":50,"y":75,"t":"هذا السطر الأصفر طبيعي قبل الرفع. وهو ليس خطأً."},{"n":3,"x":90,"y":5,"t":"كلمة Validate تعني أن الـ broker لم يفحص مستنداتك بعد."}],"check":"اختفى السطر الأصفر «upload» وصار كل مستند مُرسَلاً. وبقاء «Validate» يعني أنّ الـ broker لم ينظر بعد، وهذا طبيعي."}],["انتظر الموافقة","التحقق يستغرق عادةً وقتاً قصيراً. وإلى أن يكتمل، لن يسمح لك الـ broker بإيداع المال — وسترى هذا التنبيه في صفحة الـ wallet. وهذا طبيعي، وليس خطأً.",{"img":"assets/shot-wallet-kyc.jpg","alt":"صفحة الـ wallet تُظهر وجوب إكمال KYC أولاً","marks":[{"n":1,"x":50,"y":30,"t":"هذا السطر الزهري يعني أن التحقق ما زال قيد الانتظار. ويختفي بعد الموافقة على مستنداتك."}],"check":"اختفى السطر الزهري في صفحة الـ wallet وصار زر Deposit قابلاً للضغط."}],["أودع المال","في الـ portal اضغط Deposit، واختر المبلغ — الحد الأدنى $10 — ثم اختر العملة الرقمية التي تملكها فعلاً. بعدها يعرض لك الـ portal عنواناً ورمز QR وشبكة وعدّاً تنازلياً مدته نحو خمس عشرة دقيقة. افتح محفظتك أنت، سواء كانت Binance أو RedotPay أو غيرهما، وأرسل من هناك. وإن انتهى العدّ قبل أن ترسل، فاطلب عنواناً جديداً بدل إعادة استخدام القديم. بعد الإرسال تعرض المحفظة قائمة حالة: تمّ الإرسال، قيد المراجعة، قيد المعالجة، ويُتوقَّع الوصول خلال 24 ساعة. وظهور «pending» ليس مشكلة، بل هي الحالة الطبيعية في معظم تلك المدة.",{"note":"يجب أن تتطابق الشبكة على الجهتين. واختيار الخطأ لا يؤخّر المال، بل يضيّعه. وتكلفتها تختلف: إرسال 25 USDC عبر Ethereum كلّف 1.00 USDC رسوماً — أربعة بالمئة. وكانت Arbitrum وPolygon وSolana وBNB Smart Chain مذكورة جميعاً كأسرع. تحقّق من التكلفة قبل أن تختار.","check":"يظهر المبلغ في رصيد محفظتك. وإن لم يصل، فتحقّق من العملية في محفظتك أنت أولاً — فالـ portal لا يعرض ما لم يصله أصلاً."}],["اتصل بـ Sonic copy trading","هذه هي الخطوة التي تبدأ النسخ فعلياً. وقبلها قد يبقى المال في الحساب دون أن تُنفَّذ أي صفقة. ادخل إلى Tag Markets، وافتح CopyX من القائمة، واضغط Details، واختر SONIC، ثم اضغط Connect. بعدها أربعة حقول: المبلغ الذي تبدأ به (بحد أدنى $10)، ونوع الحساب، ورمز المجتمع — اكتب #Aitech واضغط Verify. ثم يظهر حقل Hash، اكتب فيه 000000. اضغط Submit، ثم Join to Copytrade.",{"note":"نوع الحساب: AMPLIFY يضاعف حجم كل صفقة حتى 24 مرة. وهو يضاعف الخسارة بالقدر نفسه تماماً الذي يضاعف به الربح. إن كان هذا حسابك الأول، فابدأ بدونه.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"تظهر الاستراتيجية متّصلة، ويظهر تحتها المبلغ الذي أدخلته. وإن ظهر $0 فإنّ Submit لم يمرّ."}],["راقب حسابك في MetaTrader 5","من هنا تتابع الحساب يوماً بيوم. ثبّت MetaTrader 5، ثم افتح الـ portal وابحث عن MT5 Credentials — تجد فيه رقم حساب، وMaster Password، وInvestor Password. في التطبيق اختر إضافة حساب موجود، وابحث عن T.M. Financials Ltd، واختر الخادم TMFinancials-Server. واسم الدخول هو رقم الحساب. بعدها سترى Balance وEquity وFree Margin.",{"note":"الـ Master Password يستطيع تنفيذ صفقات على حسابك. أما الـ Investor Password فلا يرى إلا العرض. لا ترسل الـ Master Password إلى أحد — لا إلى قائد، ولا إلى الدعم، ولا إلى من يطلبه. وإن أردت أن يطّلع أحد على نتائجك، فأعطه الـ Investor Password.","apps":{"lede":"ثبّت MetaTrader 5 على هاتفك:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"تعرض لك التطبيق Balance وEquity وFree Margin بالرقم نفسه الموجود في الـ portal. واختلاف الرقم يعني أنّك دخلت إلى حساب خاطئ."}],["انضم إلى المجموعة","هناك تجد الإجابات — ولا أحد منهم بدأ وهو يعرف شيئاً. وعندما تُودع المال في الحساب لاحقاً، يُستحسن أن تبدأ بمبلغ صغير.",{"apps":{"lede":"ثبّت Element X — هذا التطبيق بالذات، لا Element Classic ولا أي تطبيق محادثة آخر. أنشئ حساباً، واسم المستخدم أي اسم. ثم عد إلى هنا واضغط «انضم إلى المجموعة».","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"انضم إلى مجموعة Aimpire"},"check":"تستطيع قراءة الرسائل في الغرفة، لا أن ترى اسمها فحسب."}]]}},"langs":[{"code":"en","label":"English","dir":"ltr","font":"latin"},{"code":"no","label":"Norsk","dir":"ltr","font":"latin"},{"code":"hi","label":"हिन्दी","dir":"ltr","font":"deva"},{"code":"ar","label":"العربية","dir":"rtl","font":"naskh"},{"code":"ur","label":"اردو","dir":"rtl","font":"nastaliq"}],"earn_shot":{"img":"assets/shot-commission.jpg","alt":{"en":"The commissions overview in the IB Portal","no":"Provisjonsoversikten i IB Portal","hi":"IB Portal में commissions का अवलोकन","ur":"IB Portal میں commissions کا جائزہ","ar":"نظرة عامة على العمولات في IB Portal"},"marks":{"en":[{"n":1,"x":22,"y":55,"t":"This is where your real numbers live. If a figure in a chat message does not match this screen, this screen is right."}],"no":[{"n":1,"x":22,"y":55,"t":"Her står dine virkelige tall. Hvis et tall i en chat ikke stemmer med denne skjermen, er det denne som gjelder."}],"hi":[{"n":1,"x":22,"y":55,"t":"आपके असली आँकड़े यहीं हैं। किसी चैट का आँकड़ा इस स्क्रीन से मेल न खाए, तो यही स्क्रीन सही है।"}],"ur":[{"n":1,"x":22,"y":55,"t":"آپ کے اصل اعداد و شمار یہیں ہوتے ہیں۔ کسی chat میں بتائی گئی رقم اس screen سے میل نہ کھائے، تو درست یہی screen ہے۔"}],"ar":[{"n":1,"x":22,"y":55,"t":"هنا توجد أرقامك الحقيقية. وإذا اختلف رقم في رسالة على الـ chat عمّا تراه في هذه الشاشة، فالشاشة هي الصحيحة."}]}},"places":{"title":{"en":"Three places, three names","no":"Tre steder, tre navn","hi":"तीन जगहें, तीन नाम","ur":"تین جگہیں، تین نام","ar":"ثلاثة أماكن، ثلاثة أسماء"},"lede":{"en":"You will end up with two logins. Knowing which is which saves most of the confusion.","no":"Du ender opp med to innlogginger. Vet du hvilken som er hvilken, slipper du det meste av forvirringen.","hi":"आपके पास दो logins होंगे। कौन सा क्या है, यह जान लेने से अधिकांश उलझन बच जाती है।","ur":"آپ کے پاس دو logins ہوں گے۔ کون سا کیا ہے، یہ ایک بار سمجھ لیں تو بعد کی زیادہ تر الجھن ختم ہو جاتی ہے۔","ar":"سيكون لديك حسابان تسجّل بهما الدخول. ومعرفة الفرق بينهما تُجنّبك معظم الالتباس."},"items":{"en":[["CopyX","The platform that copies the traders. You create this first, in step 2."],["IB Portal","Where your team and your numbers live. Same login as CopyX."],["Tag Markets","The broker — the company that actually holds your money. You create this from inside the portal, in step 3."]],"no":[["CopyX","Plattformen som kopierer traderne. Denne oppretter du først, i steg 2."],["IB Portal","Der teamet ditt og tallene dine ligger. Samme innlogging som CopyX."],["Tag Markets","Megleren — selskapet som faktisk holder pengene dine. Denne oppretter du inne fra portalen, i steg 3."]],"hi":[["CopyX","वह platform जो traders को copy करता है। यह आप सबसे पहले बनाते हैं, step 2 में।"],["IB Portal","जहाँ आपकी team और आपके आँकड़े रहते हैं। CopyX वाला ही login।"],["Tag Markets","Broker — वह कंपनी जो असल में आपका पैसा रखती है। यह आप portal के अंदर से बनाते हैं, step 3 में।"]],"ur":[["CopyX","وہ platform جو traders کو copy کرتا ہے۔ یہ آپ سب سے پہلے بناتے ہیں، step 2 میں۔"],["IB Portal","جہاں آپ کی team اور آپ کے اعداد و شمار ہوتے ہیں۔ Login وہی ہے جو CopyX کا ہے۔"],["Tag Markets","Broker — وہ کمپنی جو اصل میں آپ کا پیسہ رکھتی ہے۔ یہ آپ portal کے اندر سے بناتے ہیں، step 3 میں۔"]],"ar":[["CopyX","المنصة التي تنسخ صفقات الـ traders. تنشئ حسابك فيها أولاً، في الخطوة 2."],["IB Portal","حيث تجد فريقك وأرقامك. وتدخل إليه بنفس بيانات الدخول إلى CopyX."],["Tag Markets","الـ broker — الشركة التي تحتفظ بمالك فعلاً. تنشئ حسابك فيها من داخل الـ portal، في الخطوة 3."]]}},"guide_ui":{"en":{"copy":"Copy","copied":"Copied","progress":"{done} of {total} steps done","reset":"Clear","check":"You know it worked when"},"no":{"copy":"Kopier","copied":"Kopiert","progress":"{done} av {total} steg gjort","reset":"Nullstill","check":"Du vet det gikk riktig når"},"hi":{"copy":"कॉपी करें","copied":"कॉपी हो गया","progress":"{total} में से {done} steps पूरे","reset":"रीसेट","check":"आपको पता चलेगा कि सही हुआ जब"},"ur":{"copy":"کاپی کریں","copied":"کاپی ہو گیا","progress":"{total} میں سے {done} steps مکمل","reset":"صاف کریں","check":"آپ کو پتا چلے گا کہ ٹھیک ہوا جب"},"ar":{"copy":"نسخ","copied":"تم النسخ","progress":"{done} من {total} خطوات مكتملة","reset":"مسح","check":"تعرف أنّها نجحت حين"}},"learn":{"intro":{"en":"You do not need any of this to let Sonic run. It is here for when you want to understand what you are looking at. Tap any word to open it.","no":"Du trenger ikke noe av dette for å la Sonic gå. Det ligger her for når du vil forstå hva du ser på. Trykk på et ord for å åpne det.","hi":"Sonic चलाने के लिए इसमें से कुछ भी ज़रूरी नहीं है। यह तब के लिए है जब आप समझना चाहें कि आप क्या देख रहे हैं। किसी भी शब्द पर दबाएँ।","ur":"Sonic چلانے کے لیے اس میں سے کچھ بھی ضروری نہیں۔ یہ اُس وقت کے لیے ہے جب آپ سمجھنا چاہیں کہ آپ کیا دیکھ رہے ہیں۔ کسی بھی لفظ پر دبائیں۔","ar":"لا تحتاج شيئاً من هذا لتترك Sonic يعمل. إنما هو هنا حين تريد أن تفهم ما تنظر إليه. اضغط أي كلمة لفتحها."},"labels":{"en":["Example","Why it matters","Formula"],"no":["Eksempel","Hvorfor det betyr noe","Formel"],"hi":["उदाहरण","यह क्यों मायने रखता है","सूत्र"],"ur":["مثال","یہ کیوں اہم ہے","فارمولا"],"ar":["مثال","لماذا يهمّ","المعادلة"]},"terms":{"en":[["Pip","The unit a price moves in — the fourth decimal on most pairs.","On EUR/USD, 1.0850 → 1.0851 is one pip. At 0.01 lots that is $0.10.","Every target and result you hear is quoted in pips, and a pip is worth nothing until you know the lot size behind it.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","A tenth of a pip. Some platforms quote points instead.","«+500 points» on EUR/USD is 50 pips. At 0.01 lots that is $5, not $500.","This is the mix-up that makes a modest result look ten times bigger. Check the unit before you compare your numbers to anyone's.","pips = points ÷ 10",""],["Spread","The gap between the buy price and the sell price. You pay it the moment you enter.","Buy 1.08515, sell 1.08500 is 1.5 pips. At 0.01 lots, $0.15 per trade.","Every trade starts behind by the spread, win or lose. Ten trades a day on a small account is a real cost.","spread cost = spread in pips × pip value","spread"],["Lot size","How much you trade. This decides what one move is worth — and it is not the same number on every instrument.","EUR/USD: 1.00 lot ≈ $10 per pip, 0.01 ≈ $0.10. Gold (XAUUSD): 1.00 lot = 100 oz, so a $1 move is $100.","This is the one number that decides whether an ordinary move is an irritation or the end of the account — and the figure differs per instrument. Sonic's own record trades gold, not a currency pair. Before you size anything, check the real value: in MT5, right-click the symbol and open Specification.","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage is how big a position you may hold. Margin is the part of your money locked while it is open.","A 0.01 lot EUR/USD position is about $1,085 of currency. At 1:300 that ties up roughly $3.60 of yours.","Higher leverage does not reduce risk. It only frees margin so you are allowed to open more.","margin = (lots × 100 000) ÷ leverage",""],["Balance and equity","Balance is money from trades already closed. Equity is that plus or minus everything still open.","Balance $100, one trade 40 pips offside at 0.01 lots (−$4) → equity $96.","Balance is history. Equity is where you actually stand. A floating loss is a real loss not yet written down.","equity = balance + open profit − open loss",""],["Margin call and stop out","When equity falls far enough against the margin your trades need, the broker closes them for you.","$100 account carrying a $60 floating loss has $40 of equity left.","At a stop out you do not choose the exit. The loss is locked in at that moment, often at the worst point.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","A standing instruction to close at a price you picked in advance, so the loss stops growing.","Buy at 1.0850 with a stop at 1.0830 is 20 pips. At 0.01 lots, $2 at risk — decided before you entered.","Without one, the size of your loss is set by how long you can stand to look at it.","risk = stop in pips × pip value",""],["Limit and stop orders","A limit waits for a better price. A stop only triggers once price pushes through a level.","Price 1.0850. Buy Limit 1.0830 fills if price falls. Buy Stop 1.0870 fills if price rises.","Signals are posted in this shorthand. The wrong one of the four either never triggers, or takes you in the opposite way."],["Risk per trade","The money — not the pips — you accept losing on one trade.","$100 account, 0.01 lots, 20-pip stop = $2 at risk. That is 2 percent.","On a $100 account the smallest tradable size already risks several percent per trade. The «risk 1 percent» advice does not fit yet.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","How far equity has fallen from its highest point, in percent.","$100 down to $60 is 40 percent down. Getting back to $100 needs a 67 percent gain, not 40.","Losses and recoveries are not symmetrical. A run of small losses can leave you needing a return you have never produced.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","Leaving gains in, so position size grows with the balance instead of staying fixed.","$100 at 5 percent a month, profit left in, is about $180 after a year rather than $160.","It is the honest argument for patience on a small account — and the engine of every unrealistic plan you will be shown.","final = start × (1 + rate)^periods",""]],"no":[["Pip","Enheten en pris beveger seg i — fjerde desimal på de fleste par.","På EUR/USD er 1,0850 → 1,0851 én pip. Ved 0,01 lot er det $0,10.","Alle mål og resultater du hører, oppgis i pips — og en pip er verdiløs til du vet lot-størrelsen bak.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","En tidels pip. Noen plattformer oppgir points i stedet.","«+500 points» på EUR/USD er 50 pips. Ved 0,01 lot er det $5, ikke $500.","Dette er forvekslingen som får et nøkternt resultat til å se ti ganger større ut. Sjekk enheten før du sammenligner tall med noen.","pips = points ÷ 10",""],["Spread","Avstanden mellom kjøpsprisen og salgsprisen. Du betaler den i det du går inn.","Kjøp 1,08515, salg 1,08500 er 1,5 pips. Ved 0,01 lot er det $0,15 per handel.","Hver handel starter bak med spreaden, enten den går bra eller ikke. Ti handler om dagen på en liten konto er en reell kostnad.","spread cost = spread in pips × pip value","spread"],["Lot size","Hvor mye du handler. Det avgjør hva én bevegelse er verdt — og det er ikke samme tall på alle instrumenter.","EUR/USD: 1,00 lot ≈ $10 per pip, 0,01 ≈ $0,10. Gull (XAUUSD): 1,00 lot = 100 unser, så $1 bevegelse er $100.","Det ene tallet som avgjør om en helt vanlig bevegelse er en irritasjon eller slutten på kontoen — og tallet er ulikt per instrument. Sonics eget track record handler gull, ikke et valutapar. Før du setter størrelse, sjekk den ekte verdien: høyreklikk symbolet i MT5 og åpne Specification.","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage er hvor stor posisjon du får holde. Margin er den delen av pengene dine som er låst mens den står åpen.","En posisjon på 0,01 lot EUR/USD er rundt $1 085 i valuta. Ved 1:300 binder det omtrent $3,60 av dine.","Høyere leverage reduserer ikke risiko. Den frigjør bare margin, så du får lov til å åpne mer.","margin = (lots × 100 000) ÷ leverage",""],["Balance and equity","Balance er penger fra handler som alt er lukket. Equity er det, pluss eller minus alt som fortsatt står åpent.","Balance $100, én handel 40 pips i minus ved 0,01 lot (−$4) → equity $96.","Balance er historie. Equity er der du faktisk står. Et flytende tap er et ekte tap som ennå ikke er bokført.","equity = balance + open profit − open loss",""],["Margin call and stop out","Når equity faller langt nok mot marginen handlene krever, lukker megleren dem for deg.","En konto på $100 med $60 i flytende tap har $40 igjen i equity.","Ved et stop out velger ikke du utgangen. Tapet låses der og da, ofte på det verste punktet.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","En stående ordre om å lukke på en pris du valgte på forhånd, så tapet slutter å vokse.","Kjøp på 1,0850 med stopp på 1,0830 er 20 pips. Ved 0,01 lot er $2 i risiko — bestemt før du gikk inn.","Uten den avgjøres tapets størrelse av hvor lenge du orker å se på det.","risk = stop in pips × pip value",""],["Limit and stop orders","En limit venter på en bedre pris. En stop utløses først når prisen bryter gjennom et nivå.","Pris 1,0850. Buy Limit 1,0830 fylles hvis prisen faller. Buy Stop 1,0870 fylles hvis den stiger.","Signaler postes i denne forkortelsen. Feil av de fire utløses enten aldri, eller tar deg inn motsatt vei."],["Risk per trade","Pengene — ikke pipsene — du godtar å tape på én handel.","Konto $100, 0,01 lot, 20 pips stopp = $2 i risiko. Det er 2 prosent.","På en $100-konto risikerer den minste handelbare størrelsen alt flere prosent per handel. Rådet om «risiker 1 prosent» passer ikke ennå.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Hvor langt equity har falt fra toppen, i prosent.","$100 ned til $60 er 40 prosent ned. Tilbake til $100 krever 67 prosent opp, ikke 40.","Tap og gjenhenting er ikke symmetrisk. En rekke små tap kan etterlate deg med et krav om avkastning du aldri har levert.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","Å la gevinsten stå, så posisjonsstørrelsen vokser med saldoen i stedet for å stå fast.","$100 med 5 prosent i måneden, gevinsten stående, er rundt $180 etter et år i stedet for $160.","Det er det ærlige argumentet for tålmodighet på en liten konto — og motoren i hver urealistiske plan du vil bli vist.","final = start × (1 + rate)^periods",""]],"hi":[["Pip","वह unit जिसमें price हिलती है — ज़्यादातर pairs में चौथा दशमलव।","EUR/USD पर 1.0850 → 1.0851 एक pip है। 0.01 lot पर यह $0.10 है।","हर target और result pips में बताया जाता है — और pip का कोई मोल नहीं जब तक पीछे का lot size न पता हो।","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","Pip का दसवाँ हिस्सा। कुछ platforms points में बताते हैं।","EUR/USD पर «+500 points» यानी 50 pips। 0.01 lot पर $5, $500 नहीं।","यही गड़बड़ है जो एक मामूली result को दस गुना बड़ा दिखाती है। किसी से तुलना करने से पहले unit देखें।","pips = points ÷ 10",""],["Spread","खरीद और बिक्री के दाम का फ़र्क़। यह आप घुसते ही चुकाते हैं।","Buy 1.08515, sell 1.08500 यानी 1.5 pips। 0.01 lot पर $0.15 प्रति trade।","हर trade spread जितना पीछे से शुरू होती है, चाहे चले या न चले। छोटे account पर दिन में दस trades असली ख़र्च है।","spread cost = spread in pips × pip value","spread"],["Lot size","आप कितना trade करते हैं। यही तय करता है कि एक हरकत कितने की है — और यह हर instrument पर एक ही संख्या नहीं होती।","EUR/USD: 1.00 lot ≈ $10 प्रति pip, 0.01 ≈ $0.10। सोना (XAUUSD): 1.00 lot = 100 औंस, यानी $1 की हरकत $100।","यही वह एक नंबर है जो तय करता है कि आम हरकत खीझ है या account का अंत — और यह हर instrument पर अलग है। Sonic का अपना record सोने में है, किसी currency pair में नहीं। size तय करने से पहले असली मान देखें: MT5 में symbol पर right-click करके Specification खोलें।","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage यानी कितनी बड़ी position रख सकते हैं। Margin यानी आपका वह पैसा जो खुली रहने तक रुका रहता है।","0.01 lot EUR/USD की position लगभग $1,085 की है। 1:300 पर इसमें आपके क़रीब $3.60 रुकते हैं।","ज़्यादा leverage risk कम नहीं करती। वह सिर्फ़ margin खाली करती है ताकि आप और खोल सकें।","margin = (lots × 100 000) ÷ leverage",""],["Balance and equity","Balance बंद हो चुकी trades का पैसा है। Equity वही है, जमा या घटा जो अब भी खुला है।","Balance $100, एक trade 0.01 lot पर 40 pips घाटे में (−$4) → equity $96।","Balance इतिहास है। Equity बताती है आप असल में कहाँ हैं। खुला घाटा असली घाटा है, बस लिखा नहीं गया।","equity = balance + open profit − open loss",""],["Margin call and stop out","जब equity उस margin के मुक़ाबले काफ़ी गिर जाए जो आपकी trades माँगती हैं, broker उन्हें ख़ुद बंद कर देता है।","$100 के account पर $60 का खुला घाटा हो तो $40 equity बची।","Stop out पर exit आप नहीं चुनते। घाटा उसी वक़्त पक्का हो जाता है, अक्सर सबसे बुरे मोड़ पर।","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","पहले से चुने दाम पर बंद करने का खड़ा आदेश, ताकि घाटा बढ़ना रुक जाए।","1.0850 पर buy और 1.0830 पर stop यानी 20 pips। 0.01 lot पर $2 का risk — घुसने से पहले तय।","इसके बिना घाटे का आकार इस बात से तय होता है कि आप उसे कितनी देर देख सकते हैं।","risk = stop in pips × pip value",""],["Limit and stop orders","Limit बेहतर दाम का इंतज़ार करती है। Stop तभी चलती है जब price किसी level को पार करे।","Price 1.0850। Buy Limit 1.0830 तब भरेगी जब दाम गिरे। Buy Stop 1.0870 तब जब चढ़े।","Signals इसी शॉर्टहैंड में आते हैं। चारों में से ग़लत वाला या तो कभी चलता नहीं, या उल्टी दिशा में घुसा देता है।"],["Risk per trade","वह पैसा — pips नहीं — जो आप एक trade पर खोना मंज़ूर करते हैं।","$100 account, 0.01 lot, 20 pips stop = $2 risk। यानी 2 प्रतिशत।","$100 के account पर सबसे छोटी size भी हर trade पर कई प्रतिशत जोखिम में डालती है। «1 प्रतिशत risk» वाली सलाह अभी फिट नहीं बैठती।","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Equity अपने सबसे ऊँचे बिंदु से कितनी गिरी, प्रतिशत में।","$100 से $60 यानी 40 प्रतिशत नीचे। वापस $100 पर आने के लिए 67 प्रतिशत चाहिए, 40 नहीं।","घाटा और भरपाई बराबर नहीं होते। छोटे-छोटे घाटों की एक लड़ी आपसे ऐसा return माँग सकती है जो आपने कभी दिया ही नहीं।","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","फ़ायदा account में छोड़ना, ताकि position size balance के साथ बढ़े, टिकी न रहे।","$100 पर महीने के 5 प्रतिशत, फ़ायदा छोड़ा हुआ, साल भर में क़रीब $180 — $160 नहीं।","छोटे account पर सब्र का ईमानदार तर्क यही है — और हर ग़ैर-हक़ीक़ी plan का इंजन भी यही है।","final = start × (1 + rate)^periods",""]],"ur":[["Pip","وہ unit جس میں price حرکت کرتی ہے — زیادہ تر pairs میں چوتھا اعشاریہ۔","EUR/USD پر 1.0850 → 1.0851 ایک pip ہے۔ 0.01 lot پر یہ $0.10 بنتا ہے۔","ہر target اور نتیجہ pips میں بتایا جاتا ہے — اور pip کی کوئی قیمت نہیں جب تک پیچھے کا lot size معلوم نہ ہو۔","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","Pip کا دسواں حصہ۔ کچھ platforms points میں بتاتے ہیں۔","EUR/USD پر «+500 points» یعنی 50 pips۔ 0.01 lot پر $5، $500 نہیں۔","یہی گڑبڑ ہے جو ایک معمولی نتیجے کو دس گنا بڑا دکھاتی ہے۔ کسی سے موازنہ کرنے سے پہلے unit دیکھ لیں۔","pips = points ÷ 10",""],["Spread","خریدنے اور بیچنے کی قیمت کا فرق۔ یہ آپ داخل ہوتے ہی ادا کرتے ہیں۔","Buy 1.08515، sell 1.08500 یعنی 1.5 pips۔ 0.01 lot پر ہر trade پر $0.15۔","ہر trade spread جتنی پیچھے سے شروع ہوتی ہے، چلے یا نہ چلے۔ چھوٹے account پر دن میں دس trades اصل خرچ ہے۔","spread cost = spread in pips × pip value","spread"],["Lot size","آپ کتنا trade کرتے ہیں۔ یہی طے کرتا ہے کہ ایک حرکت کتنے کی ہے — اور یہ ہر instrument پر ایک ہی عدد نہیں ہوتا۔","EUR/USD: 1.00 lot ≈ $10 فی pip، 0.01 ≈ $0.10۔ سونا (XAUUSD): 1.00 lot = 100 اونس، یعنی $1 کی حرکت $100۔","یہی وہ ایک عدد ہے جو طے کرتا ہے کہ عام حرکت جھنجھلاہٹ ہے یا account کا خاتمہ — اور یہ ہر instrument پر الگ ہے۔ Sonic کا اپنا record سونے میں ہے، کسی currency pair میں نہیں۔ size طے کرنے سے پہلے اصل قیمت دیکھیں: MT5 میں symbol پر right-click کر کے Specification کھولیں۔","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage یعنی آپ کتنی بڑی position رکھ سکتے ہیں۔ Margin آپ کا وہ پیسہ ہے جو position کھلی رہنے تک رُکا رہتا ہے۔","0.01 lot EUR/USD کی position تقریباً $1,085 کی ہے۔ 1:300 پر اس میں آپ کے تقریباً $3.60 رُکتے ہیں۔","زیادہ leverage خطرہ کم نہیں کرتی۔ وہ صرف margin خالی کرتی ہے تاکہ آپ مزید کھول سکیں۔","margin = (lots × 100 000) ÷ leverage",""],["Balance and equity","Balance بند ہو چکی trades کا پیسہ ہے۔ Equity وہی ہے، جمع یا منفی وہ سب جو ابھی کھلا ہے۔","Balance $100، ایک trade 0.01 lot پر 40 pips نقصان میں (−$4) → equity $96۔","Balance تاریخ ہے۔ Equity بتاتی ہے آپ اصل میں کہاں کھڑے ہیں۔ کھلا نقصان اصلی نقصان ہے، بس ابھی لکھا نہیں گیا۔","equity = balance + open profit − open loss",""],["Margin call and stop out","جب equity اُس margin کے مقابلے کافی گر جائے جو آپ کی trades مانگتی ہیں، broker اُنہیں خود بند کر دیتا ہے۔","$100 کے account پر $60 کا کھلا نقصان ہو تو $40 equity بچتی ہے۔","Stop out پر نکلنے کا وقت آپ نہیں چنتے۔ نقصان اُسی لمحے پکا ہو جاتا ہے، اکثر بدترین موڑ پر۔","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","پہلے سے چنی ہوئی قیمت پر بند کرنے کا کھڑا حکم، تاکہ نقصان بڑھنا رُک جائے۔","1.0850 پر buy اور 1.0830 پر stop یعنی 20 pips۔ 0.01 lot پر $2 خطرے میں — داخل ہونے سے پہلے طے۔","اس کے بغیر نقصان کا حجم اس بات سے طے ہوتا ہے کہ آپ اُسے کتنی دیر دیکھ سکتے ہیں۔","risk = stop in pips × pip value",""],["Limit and stop orders","Limit بہتر قیمت کا انتظار کرتی ہے۔ Stop تبھی چلتی ہے جب price کوئی level پار کرے۔","Price 1.0850۔ Buy Limit 1.0830 تب بھرے گی جب قیمت گرے۔ Buy Stop 1.0870 تب جب چڑھے۔","Signals اسی مختصر شکل میں آتے ہیں۔ چار میں سے غلط والا یا تو کبھی چلتا نہیں، یا اُلٹی طرف داخل کر دیتا ہے۔"],["Risk per trade","وہ رقم — pips نہیں — جو آپ ایک trade پر کھونا قبول کرتے ہیں۔","$100 account، 0.01 lot، 20 pips stop = $2 خطرہ۔ یعنی 2 فیصد۔","$100 کے account پر سب سے چھوٹی size بھی ہر trade پر کئی فیصد خطرے میں ڈالتی ہے۔ «1 فیصد خطرہ» والا مشورہ ابھی ٹھیک نہیں بیٹھتا۔","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Equity اپنی بلند ترین سطح سے کتنی گری، فیصد میں۔","$100 سے $60 یعنی 40 فیصد نیچے۔ واپس $100 پر آنے کے لیے 67 فیصد چاہیے، 40 نہیں۔","نقصان اور بھرپائی برابر نہیں ہوتے۔ چھوٹے نقصانات کی ایک لڑی آپ سے ایسا return مانگ سکتی ہے جو آپ نے کبھی دیا ہی نہیں۔","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","نفع account میں چھوڑنا، تاکہ position size balance کے ساتھ بڑھے، ایک جگہ کھڑی نہ رہے۔","$100 پر مہینے کے 5 فیصد، نفع چھوڑا ہوا، سال بھر میں تقریباً $180 — $160 نہیں۔","چھوٹے account پر صبر کی ایماندار دلیل یہی ہے — اور ہر غیر حقیقی plan کا انجن بھی یہی ہے۔","final = start × (1 + rate)^periods",""]],"ar":[["Pip","الوحدة التي يتحرّك بها السعر — الخانة العشرية الرابعة في معظم الأزواج.","على EUR/USD، 1.0850 ← 1.0851 تساوي pip واحدة. وعند 0.01 lot تساوي $0.10.","كل هدف ونتيجة تسمعها تُذكر بالـ pips — والـ pip بلا قيمة حتى تعرف الـ lot size خلفها.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","عُشر الـ pip. وبعض الـ platforms تعرض بالـ points.","«+500 points» على EUR/USD تعني 50 pips. وعند 0.01 lot فهي $5، لا $500.","هذا هو الخلط الذي يجعل نتيجة متواضعة تبدو أكبر عشر مرات. تحقّق من الوحدة قبل أن تقارن أرقامك بأرقام أحد.","pips = points ÷ 10",""],["Spread","الفارق بين سعر الشراء وسعر البيع. تدفعه لحظة الدخول.","شراء 1.08515 وبيع 1.08500 يساوي 1.5 pip. وعند 0.01 lot فذلك $0.15 لكل صفقة.","كل صفقة تبدأ متأخرة بمقدار الـ spread، ربحت أم خسرت. وعشر صفقات يومياً على حساب صغير تكلفة حقيقية.","spread cost = spread in pips × pip value","spread"],["Lot size","حجم ما تتداوله. وهو يحدّد قيمة الحركة الواحدة — وليس الرقم نفسه على كل أداة.","EUR/USD: ‏1.00 lot ≈ $10 لكل pip، و0.01 ≈ $0.10. والذهب (XAUUSD): ‏1.00 lot = 100 أونصة، فحركة بـ $1 تساوي $100.","هو الرقم الوحيد الذي يقرّر إن كانت حركة عادية مجرّد إزعاج أم نهاية الحساب — وهو يختلف بين أداة وأخرى. وسجل Sonic نفسه على الذهب، لا على زوج عملات. فقبل أن تحدّد الحجم، تحقّق من القيمة الحقيقية: في MT5 اضغط بالزر الأيمن على الرمز وافتح Specification.","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","الـ leverage هو حجم الصفقة المسموح لك بفتحها. والـ margin هو الجزء المحجوز من مالك ما دامت مفتوحة.","صفقة 0.01 lot على EUR/USD تساوي نحو $1,085. وعند 1:300 يُحجز منها نحو $3.60 من مالك.","الـ leverage الأعلى لا يقلّل الخطر. هو فقط يحرّر margin فيُسمح لك بفتح المزيد.","margin = (lots × 100 000) ÷ leverage",""],["Balance and equity","الـ balance مال الصفقات المغلقة. والـ equity هو ذلك، زائداً أو ناقصاً كل ما زال مفتوحاً.","Balance ‏$100، وصفقة واحدة خاسرة 40 pip عند 0.01 lot (−$4) ← equity ‏$96.","الـ balance تاريخ. والـ equity موضعك الفعلي. والخسارة العائمة خسارة حقيقية لم تُقيَّد بعد.","equity = balance + open profit − open loss",""],["Margin call and stop out","حين يهبط الـ equity كثيراً أمام الـ margin الذي تتطلّبه صفقاتك، يغلقها الـ broker نيابةً عنك.","حساب بـ $100 يحمل خسارة عائمة $60 يتبقّى له $40 من الـ equity.","عند الـ stop out لا تختار أنت لحظة الخروج. تُثبَّت الخسارة حينها، وغالباً عند أسوأ نقطة.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","أمر قائم بالإغلاق عند سعر اخترته مسبقاً، فتتوقّف الخسارة عن النمو.","شراء عند 1.0850 مع stop عند 1.0830 يساوي 20 pip. وعند 0.01 lot فذلك $2 تخاطر بها — قرّرتها قبل الدخول.","من دونه يتحدّد حجم خسارتك بمقدار ما تحتمل النظر إليها.","risk = stop in pips × pip value",""],["Limit and stop orders","الـ limit ينتظر سعراً أفضل. والـ stop لا يُنفَّذ إلا بعد أن يخترق السعر مستوى معيّناً.","السعر 1.0850. Buy Limit عند 1.0830 يُنفَّذ إن هبط السعر. وBuy Stop عند 1.0870 يُنفَّذ إن صعد.","الإشارات تُنشر بهذا الاختصار. والخطأ من بين الأربعة إمّا ألّا يُنفَّذ أبداً، أو يُدخلك في الاتجاه المعاكس."],["Risk per trade","المبلغ — لا الـ pips — الذي تقبل خسارته في صفقة واحدة.","حساب $100، و0.01 lot، وstop بـ 20 pip = $2 تخاطر بها. أي 2 بالمئة.","على حساب بـ $100 فإن أصغر حجم قابل للتداول يخاطر أصلاً بعدّة بالمئة في الصفقة. ونصيحة «خاطر بواحد بالمئة» لا تناسب بعد.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","مقدار هبوط الـ equity عن أعلى نقطة بلغها، بالنسبة المئوية.","من $100 إلى $60 هبوط 40 بالمئة. والعودة إلى $100 تحتاج ربحاً 67 بالمئة، لا 40.","الخسارة والتعويض ليسا متناظرين. وسلسلة خسائر صغيرة قد تتركك محتاجاً عائداً لم تحقّقه يوماً.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","ترك الأرباح في الحساب، فينمو حجم الصفقة مع الرصيد بدل أن يبقى ثابتاً.","‏$100 بنسبة 5 بالمئة شهرياً مع ترك الربح تصير نحو $180 بعد سنة، لا $160.","هي الحجّة الصادقة للصبر على حساب صغير — وهي أيضاً محرّك كل خطة غير واقعية ستُعرض عليك.","final = start × (1 + rate)^periods",""]]}},"amplify":{"items":{"en":[["#Aitech is what attaches you to Aimpire","The community token field is the only place in the whole sign-up that connects your copy trading to this community. Type #Aitech, press Verify, then enter 000000 in the Hash field that appears. Get it wrong and the account still works — it just is not connected to anyone here."],["Amplify is a choice, not a setting","The platform offers a normal account and an Amplify account. Amplify multiplies the size of every position, up to 24 times. It multiplies the losses by exactly the same amount as the gains."],["A rule you can actually use","Three questions, and if any answer is yes, do not amplify yet. Would losing this account change your month? Have you never watched a position move against you and felt it? Is this your first account? Amplify is a second decision, taken after you have seen a normal account behave for a while — not a box you tick on the way in."],["The liquidation rule, in the platform's own words","«If the manager loses more than 10% of starting balance, your account will be liquidated.» That is a hard trigger, not a warning. On an Amplify account a 10% move against the manager ends your account — you do not get to decide to wait it out."],["What the platform says about who is responsible","Before you can submit, you tick a box that says trades on CopyX are provided by traders unaffiliated with Tag Markets, and that Tag Markets bears no responsibility or liability for the trades or their outcomes. Read it before you tick it. It means the broker holding your money is not answerable for what the strategy does with it."]],"no":[["#Aitech er det som knytter deg til Aimpire","Community token-feltet er det eneste stedet i hele registreringen som kobler kopihandelen din til dette fellesskapet. Skriv #Aitech, trykk Verify, og skriv så 000000 i Hash-feltet som dukker opp. Gjør du feil, virker kontoen fortsatt — den er bare ikke knyttet til noen her."],["Amplify er et valg, ikke en innstilling","Plattformen tilbyr en vanlig konto og en Amplify-konto. Amplify ganger størrelsen på hver posisjon, opptil 24 ganger. Den ganger tapet nøyaktig like mye som gevinsten."],["En regel du faktisk kan bruke","Tre spørsmål, og svarer du ja på ett av dem, ikke amplify ennå. Ville det endret måneden din å tape denne kontoen? Har du aldri sett en posisjon gå mot deg og kjent på det? Er dette din første konto? Amplify er en andre beslutning, tatt etter at du har sett en vanlig konto oppføre seg en stund — ikke en boks du huker av på vei inn."],["Likvidasjonsregelen, med plattformens egne ord","«If the manager loses more than 10% of starting balance, your account will be liquidated.» Det er en hard utløser, ikke en advarsel. På en Amplify-konto avslutter en bevegelse på 10 % mot forvalteren kontoen din — du får ikke velge å sitte den ut."],["Hva plattformen selv sier om ansvar","Før du kan sende inn, huker du av en boks som sier at handlene på CopyX utføres av tradere uten tilknytning til Tag Markets, og at Tag Markets ikke bærer noe ansvar for handlene eller utfallet av dem. Les den før du huker av. Den betyr at megleren som holder pengene dine, ikke svarer for hva strategien gjør med dem."]],"hi":[["#Aitech ही आपको Aimpire से जोड़ता है","पूरी registration में community token का खाना ही एक जगह है जो आपकी copy trading को इस community से जोड़ती है। #Aitech लिखें, Verify दबाएँ, फिर आने वाले Hash खाने में 000000 लिखें। ग़लत हुआ तो account फिर भी चलेगा — बस यहाँ किसी से जुड़ा नहीं होगा।"],["Amplify एक चुनाव है, setting नहीं","Platform दो तरह के account देता है: सामान्य और Amplify। Amplify हर position का size 24 गुना तक बढ़ाता है। यह नुक़सान को भी ठीक उतना ही बढ़ाता है जितना फ़ायदे को।"],["एक नियम जो आप सचमुच इस्तेमाल कर सकें","तीन सवाल, और किसी एक का जवाब हाँ हो तो अभी amplify न करें। क्या यह account खोना आपका महीना बदल देगा? क्या आपने कभी position को अपने ख़िलाफ़ जाते देखा और महसूस नहीं किया? क्या यह आपका पहला account है? Amplify दूसरा फ़ैसला है, सामान्य account को कुछ समय चलते देखने के बाद — अंदर आते वक़्त टिक करने वाला box नहीं।"],["Liquidation का नियम, platform के अपने शब्दों में","«If the manager loses more than 10% of starting balance, your account will be liquidated.» यह चेतावनी नहीं, पक्का नियम है। Amplify account पर manager के ख़िलाफ़ 10% की हरकत आपका account ख़त्म कर देती है — रुककर देखने का विकल्प नहीं मिलता।"],["ज़िम्मेदारी के बारे में platform ख़ुद क्या कहता है","Submit से पहले आप एक box पर टिक करते हैं जिसमें लिखा है कि CopyX पर trades वे traders करते हैं जिनका Tag Markets से कोई संबंध नहीं, और Tag Markets इन trades या उनके नतीजों की कोई ज़िम्मेदारी नहीं लेता। टिक करने से पहले पढ़ें। मतलब यह कि जो broker आपका पैसा रखता है, वह इसका जवाबदेह नहीं कि strategy उसका क्या करती है।"]],"ur":[["#Aitech ہی آپ کو Aimpire سے جوڑتا ہے","پوری رجسٹریشن میں community token کا خانہ ہی وہ واحد جگہ ہے جو آپ کی copy trading کو اس community سے جوڑتی ہے۔ #Aitech لکھیں، Verify دبائیں، پھر آنے والے Hash خانے میں 000000 لکھیں۔ غلط ہوا تو account پھر بھی چلے گا — بس یہاں کسی سے جڑا نہیں ہوگا۔"],["Amplify ایک انتخاب ہے، setting نہیں","Platform دو طرح کے account دیتا ہے: عام اور Amplify۔ Amplify ہر position کا سائز 24 گنا تک بڑھاتا ہے۔ یہ نقصان کو بھی بالکل اتنا ہی بڑھاتا ہے جتنا نفع کو۔"],["ایک اصول جو آپ واقعی استعمال کر سکیں","تین سوال، اور کسی ایک کا جواب ہاں ہو تو ابھی amplify نہ کریں۔ کیا یہ account کھونا آپ کا مہینہ بدل دے گا؟ کیا آپ نے کبھی position کو اپنے خلاف جاتے دیکھا اور محسوس نہیں کیا؟ کیا یہ آپ کا پہلا account ہے؟ Amplify دوسرا فیصلہ ہے، عام account کو کچھ عرصہ چلتے دیکھنے کے بعد — اندر آتے وقت ٹک کرنے والا box نہیں۔"],["Liquidation کا قاعدہ، platform کے اپنے الفاظ میں","«If the manager loses more than 10% of starting balance, your account will be liquidated.» یہ تنبیہ نہیں، پکا قاعدہ ہے۔ Amplify account پر manager کے خلاف 10% کی حرکت آپ کا account ختم کر دیتی ہے — رک کر دیکھنے کا اختیار نہیں ملتا۔"],["ذمہ داری کے بارے میں platform خود کیا کہتا ہے","Submit سے پہلے آپ ایک box پر ٹک کرتے ہیں جس میں لکھا ہے کہ CopyX پر trades وہ traders کرتے ہیں جن کا Tag Markets سے کوئی تعلق نہیں، اور Tag Markets اِن trades یا اُن کے نتائج کی کوئی ذمہ داری نہیں لیتا۔ ٹک کرنے سے پہلے پڑھ لیں۔ مطلب یہ کہ جو broker آپ کا پیسہ رکھتا ہے، وہ اس کا جواب دہ نہیں کہ strategy اُس کا کیا کرتی ہے۔"]],"ar":[["‏#Aitech هو ما يربطك بـ Aimpire","خانة الـ community token هي المكان الوحيد في التسجيل كلّه الذي يربط نسخ التداول عندك بهذا المجتمع. اكتب ‎#Aitech، واضغط Verify، ثم اكتب 000000 في خانة الـ Hash التي تظهر. وإن أخطأت، فالحساب يعمل — لكنه غير مرتبط بأحد هنا."],["‏Amplify اختيار، لا إعداد","تقدّم المنصّة حساباً عادياً وحساب Amplify. والـ Amplify يضاعف حجم كل صفقة حتى 24 مرة، ويضاعف الخسارة بالقدر نفسه تماماً الذي يضاعف به الربح."],["قاعدة تستطيع استعمالها فعلاً","ثلاثة أسئلة، وإن كان جواب أيّ منها نعم فلا تستعمل Amplify بعد. هل خسارة هذا الحساب تغيّر شهرك؟ هل لم يسبق أن رأيت صفقة تتحرّك ضدّك وشعرت بذلك؟ أهذا حسابك الأول؟ الـ Amplify قرار ثانٍ، يُتخذ بعد أن ترى حساباً عادياً يعمل مدّة — لا مربّع تعلّم عليه وأنت داخل."],["قاعدة التصفية، بكلمات المنصّة نفسها","«If the manager loses more than 10% of starting balance, your account will be liquidated.» هذا شرط صارم، لا تحذير. فعلى حساب Amplify تُنهي حركةٌ بنسبة 10% ضدّ المدير حسابَك — ولا يُترك لك أن تنتظر."],["ماذا تقول المنصّة عن المسؤولية","قبل أن ترسل، تضع علامة في مربّع يقول إنّ الصفقات على CopyX ينفّذها متداولون لا صلة لهم بـ Tag Markets، وإنّ Tag Markets لا تتحمّل أي مسؤولية عن الصفقات ولا عن نتائجها. اقرأه قبل أن تعلّم عليه. ومعناه أنّ الـ broker الذي يحتفظ بمالك ليس مسؤولاً عمّا تفعله الاستراتيجية به."]]}},"ib":{"en":{"lede":"This part is optional. You can open an account, let Sonic run, and never introduce a single person. Nothing on the platform requires it. It is here because people ask how it works, and because half-explained money is how communities go wrong.","blocks":[["What an IB actually is","The broker already charges a spread and a commission on every trade, whether you introduced anyone or not. An Introducing Broker gets a share of what the broker already earns. It is not an extra fee charged to the person you introduced — their cost is the same either way. That is the whole mechanism, and it is ordinary across the industry."],["The lock nobody explains","The plan has ten generations. They start locked. Your IB Portal shows two lines that decide everything: «# of Directs with active Trading account» and «Generations unlocked». Until directs with active accounts open them, the streams exist but pay nothing.","lock"],["What that looks like in real numbers","Read from the founder's own portal on 13 October: five people introduced, $43 deposited across all of them, nine income streams listed by name — and $0.00 earned. Not because anything was broken. Because 0 of 10 generations were unlocked. This is the single most useful thing to understand before you start."],["The per-lot ladder","When generations are open, each lot your team trades pays down the levels. The figures circulating are $2 on level 1, $1.50 on level 2, $1 on levels 3–4 and $0.50 on levels 5–10 — about $8.50 per lot spread across ten levels.","ladder"],["A worked example, at the size you actually are","Twenty members, $10 each, at the leverage the account actually uses. That is roughly 0.03 lot per trade. Twenty trades a month each is about 12 lots, which at $2 on level 1 is around $24 a month — and only once the generations are open. It is not nothing, and it is not a living. Anyone showing you a bigger number owes you the arithmetic."],["The formula, so you can put your own numbers in","monthly rebate ≈ members × trades each × lots per trade × rate per lot. Twenty members, twenty trades each, 0.03 lot, $2 on level 1 → 20 × 20 × 0.03 × $2 = $24. Change any number and you have your own answer instead of someone else's claim."],["The nine streams, by name","So you recognise them in the portal rather than in a chat message: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 and 2, Sonic Pool, NeoFX Pool, Super Sonic Bonus, and seasonal campaigns. Payouts are made in USDT."],["What is not promised","No income is guaranteed and it can be zero. Everything above depends on other people trading, which depends on them choosing to, which you do not control. Treat it as a share of activity that may happen, not as a plan."]],"unverified":"The per-lot figures come from public write-ups, not from a signed agreement. Check them against your own IB terms before you repeat them to anyone.","lock_cap":"Ten generations. Zero open until directs with active accounts unlock them.","ladder_cap":"About $8.50 per lot, split across ten levels — not $8.50 to you."},"no":{"lede":"Denne delen er valgfri. Du kan åpne konto, la Sonic gå, og aldri introdusere et eneste menneske. Ingenting på plattformen krever det. Den ligger her fordi folk spør hvordan det virker — og fordi halvforklarte penger er måten fellesskap går i stykker på.","blocks":[["Hva en IB faktisk er","Megleren tar allerede spread og kommisjon på hver handel, enten du har introdusert noen eller ikke. En Introducing Broker får en andel av det megleren alt tjener. Det er ikke et ekstra gebyr som belastes den du introduserte — kostnaden deres er den samme uansett. Det er hele mekanismen, og den er helt alminnelig i bransjen."],["Låsen ingen forklarer","Planen har ti generasjoner. De starter låst. IB-portalen viser to linjer som avgjør alt: «# of Directs with active Trading account» og «Generations unlocked». Før directs med aktive kontoer åpner dem, finnes strømmene — men de betaler ingenting.","lock"],["Hvordan det ser ut i ekte tall","Lest i founders egen portal 13. oktober: fem personer introdusert, $43 innskutt til sammen, ni inntektsstrømmer listet med navn — og $0,00 opptjent. Ikke fordi noe var ødelagt. Fordi 0 av 10 generasjoner var låst opp. Dette er det mest nyttige å forstå før du begynner."],["Stigen per lot","Når generasjonene er åpne, betaler hver lot teamet ditt handler nedover nivåene. Tallene som sirkulerer er $2 på nivå 1, $1,50 på nivå 2, $1 på nivå 3–4 og $0,50 på nivå 5–10 — rundt $8,50 per lot fordelt på ti nivåer.","ladder"],["Et regnestykke, på den størrelsen du faktisk er","Tjue medlemmer med $10 hver, på den giringen kontoen faktisk bruker. Det er rundt 0,03 lot per handel. Tjue handler i måneden hver blir omtrent 12 lot, som med $2 på nivå 1 gir rundt $24 i måneden — og bare når generasjonene er åpne. Det er ikke ingenting, og det er ikke en inntekt å leve av. Den som viser deg et større tall, skylder deg regnestykket."],["Formelen, så du kan sette inn dine egne tall","månedlig rebate ≈ medlemmer × handler hver × lot per handel × sats per lot. Tjue medlemmer, tjue handler hver, 0,03 lot, $2 på nivå 1 → 20 × 20 × 0,03 × $2 = $24. Endre et tall, så har du ditt eget svar i stedet for noen andres påstand."],["De ni strømmene, med navn","Så du kjenner dem igjen i portalen og ikke i en chat: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 og 2, Sonic Pool, NeoFX Pool, Super Sonic Bonus, og sesongkampanjer. Utbetaling skjer i USDT."],["Hva som ikke er lovet","Ingen inntekt er garantert, og den kan bli null. Alt over avhenger av at andre handler, som avhenger av at de velger å gjøre det, som du ikke styrer. Se på det som en andel av aktivitet som kanskje skjer — ikke som en plan."]],"unverified":"Tallene per lot kommer fra offentlige omtaler, ikke fra en signert avtale. Sjekk dem mot dine egne IB-vilkår før du gjentar dem til noen.","lock_cap":"Ti generasjoner. Null åpne før directs med aktive kontoer låser dem opp.","ladder_cap":"Rundt $8,50 per lot, fordelt på ti nivåer — ikke $8,50 til deg."},"hi":{"lede":"यह हिस्सा वैकल्पिक है। आप account खोल सकते हैं, Sonic चलने दे सकते हैं, और कभी किसी को न बुलाएँ। Platform पर ऐसा कोई नियम नहीं। यह यहाँ  का दावा नहीं।"],["नौ streams, नाम से","ताकि आप उन्हें portal में पहचानें, किसी chat में नहीं: Lot Commissions, Profit Share, CPA Earnings, Leader Pool 1 और 2, Sonic Pool, NeoFX Pool, Super Sonic Bonus, और मौसमी campaigns। भुगतान USDT में होता है।"],["किस बात का वादा नहीं है","किसी आमदनी की गारंटी नहीं और वह शून्य भी हो सकती है। ऊपर सब कुछ इस पर निर्भर है कि दूसरे trade करें, जो इस पर निर्भर है कि वे ऐसा चुनें — और वह आपके हाथ में नहीं। इसे ऐसी गतिविधि का हिस्सा समझें जो शायद हो, किसी plan की तरह नहीं।"]],"unverified":"हर lot के आँकड़े सार्वजनिक लेखों से हैं, किसी हस्ताक्षरित समझौते से नहीं। किसी को दोहराने से पहले अपनी IB शर्तों से मिलाएँ।","lock_cap":"दस generations। Active account वाले directs खोलें, उससे पहले शून्य खुली।","ladder_cap":"क़रीब $8.50 प्रति lot, दस levels में बँटा — आपको $8.50 नहीं।"},"ur":{"lede":"یہ حصہ اختیاری ہے۔ آپ account کھول سکتے ہیں، Sonic کو چلنے دے سکتے ہیں، اور کبھی کسی کو نہ بلائیں۔ Platform پر ایسا کوئی تقاضا نہیں۔ یہ یہاں اس لیے ہے کہ لوگ پوچھتے ہیں کہ کام کیسے ہوتا ہے — اور اس لیے کہ آدھے سمجھائے ہوئے پیسے ہی وہ چیز ہیں جس سے community ٹوٹتی ہے۔","blocks":[["IB اصل میں ہے کیا","Broker ہر trade پر spread اور commission پہلے سے لیتا ہے، چاہے آپ نے کسی کو بلایا ہو یا نہ۔ Introducing Broker کو اُسی کمائی کا ایک حصہ ملتا ہے جو broker پہلے ہی کما رہا ہے۔ یہ اُس شخص پر کوئی اضافی fee نہیں جسے آپ نے بلایا — اُس کی لاگت دونوں صورتوں میں ایک ہی رہتی ہے۔ پورا نظام یہی ہے، اور یہ پوری انڈسٹری میں عام ہے۔"],["وہ lock جسے کوئی نہیں سمجھاتا","Plan میں دس generations ہیں۔ وہ شروع میں بند ہوتی ہیں۔ آپ کا IB Portal دو لائنیں دکھاتا ہے جو سب طے کرتی ہیں: «# of Directs with active Trading account» اور «Generations unlocked»۔ جب تک active account والے directs اُنہیں نہ کھولیں، streams موجود تو ہیں — مگر کچھ نہیں دیتیں۔","lock"],["اصل اعداد میں یہ کیسا لگتا ہے","13 اکتوبر کو founder کے اپنے portal میں: پانچ لوگ بلائے گئے، سب کا مل کر $43 جمع، نو income streams نام سے درج — اور کمائی $0.00۔ اس لیے نہیں کہ کچھ خراب تھا۔ اس لیے کہ 10 میں سے 0 generations کھل /* «member» eller «leaders». Samme fil, samme CSS, to adresser: medlemmene
   skal ikke se lederverktoeyet i det hele tatt, og lederne trenger ikke
   scrolle gjennom guiden for aa finne det. */
const PAGE = "member";

/* An IB's sign-up link carries an opaque token (?e=...), not their IB number,
   so the whole link travels as ?ref= and only these hosts are accepted. */
const REF_ALLOWED_HOSTS = ["aitech.sonicpilot.io","copyxapp.com","www.copyxapp.com",
                           "aitech.ibportal.io","portal.tagmarkets.com","tagmarkets.com"];
const REF_HOUSE = "";

let lang = C.langs[0].code, sponsorUrl = null, pendingRef = null, sponsorName = "";
const $ = id => document.getElementById(id);
const conf = code => C.langs.find(l => l.code === code) || C.langs[0];
function store(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* Nothing becomes an href unless it is plain http(s). */
function safeUrl(u){
  try{ const p = new URL(String(u), location.href).protocol;
       return p === "https:" || p === "http:"; }catch(e){ return false; }
}
/* Images belong to this page. Anything off-origin is skipped. */
function sameOrigin(u){
  try{ return new URL(String(u), location.href).origin === location.origin; }catch(e){ return false; }
}
function validRef(raw){
  if(!raw) return null;
  let u;
  try{ u = new URL(String(raw).trim()); }catch(e){ return null; }
  if(u.protocol !== "https:") return null;
  return REF_ALLOWED_HOSTS.indexOf(u.hostname) !== -1 ? u : null;
}
/* «by» kommer fra URL-en og er dermed kontrollert av den som laget lenka.
   Den settes alltid med textContent, aldri innerHTML — men den filtreres
   ogsaa: bare bokstaver i et hvilket som helst skriftsystem, mellomrom,
   bindestrek og apostrof, og maks 24 tegn. Da kan et «navn» verken bli
   markup, en URL eller et avsnitt. */
function cleanName(raw){
  if(!raw) return "";
  let t = String(raw).trim().slice(0, 48);
  try{ t = t.replace(/[^\p{L}\p{M} '\-]/gu, ""); }
  catch(e){ t = t.replace(/[^A-Za-zÀ-ÿ '\-]/g, ""); }
  t = t.replace(/\s+/g, " ").trim().slice(0, 24);
  return t;
}
const urlName  = () => cleanName(new URLSearchParams(location.search).get("by"));
const urlRef    = () => validRef(new URLSearchParams(location.search).get("ref"));
const storedRef = () => validRef(load("aimpire.ref"));
function fingerprint(u){
  const t = u.searchParams.get("e") || u.search || u.pathname;
  return String(t).replace(/[^A-Za-z0-9]/g,"").slice(-6).toUpperCase();
}

/* Decided once, on load. Rendering never writes. A different link does not
   silently replace a remembered sponsor — that would let anyone re-tag
   someone else's lead just by having them open a page. We ask. */
function initSponsor(){
  const fromUrl = urlRef(), remembered = storedRef();
  if(!fromUrl){
    sponsorUrl = remembered;
    sponsorName = cleanName(load("aimpire.by"));
    return;
  }
  if(!remembered){
    store("aimpire.ref", fromUrl.href);
    sponsorName = urlName(); store("aimpire.by", sponsorName || null);
    sponsorUrl = fromUrl;
  }
  else if(remembered.href === fromUrl.href){
    sponsorUrl = remembered;
    sponsorName = urlName() || cleanName(load("aimpire.by"));
    store("aimpire.by", sponsorName || null);
  }
  else { sponsorUrl = remembered; sponsorName = cleanName(load("aimpire.by")); pendingRef = fromUrl; }
}
/* Hvilke steg som er gjort. Lagres lokalt per leser - aldri sendt noe sted. */
function doneSet(){
  const raw = load("aimpire.done") || "";
  return new Set(raw.split(",").filter(function(x){ return x !== ""; }));
}
function toggleStep(i){
  const set = doneSet(), k = String(i);
  if(set.has(k)) set.delete(k); else set.add(k);
  store("aimpire.done", Array.from(set).join(","));
  render();
}
function clearSteps(){ store("aimpire.done", null); render(); }

function copyCode(btn, value, label){
  function done(){
    const tag = btn.querySelector(".c");
    if(tag) tag.textContent = (C.guide_ui[lang] || C.guide_ui.en).copied;
  }
  try{
    navigator.clipboard.writeText(value).then(done, function(){ fallback(); });
  }catch(e){ fallback(); }
  function fallback(){
    try{
      const t = document.createElement("textarea");
      t.value = value; t.setAttribute("readonly","");
      t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      document.execCommand("copy"); document.body.removeChild(t); done();
    }catch(e2){}
  }
}

function keepSponsor(){ pendingRef = null; render(); }
function switchSponsor(){
  if(pendingRef){
    store("aimpire.ref", pendingRef.href); sponsorUrl = pendingRef;
    sponsorName = urlName(); store("aimpire.by", sponsorName || null);
    pendingRef = null;
  }
  render();
}
function changeSponsor(){
  store("aimpire.ref", null); store("aimpire.by", null);
  sponsorUrl = null; sponsorName = ""; pendingRef = null;
  if(location.search) history.replaceState(null,"",location.pathname);
  render();
}
function destination(){
  return sponsorUrl
    ? { url:sponsorUrl.href, host:sponsorUrl.hostname, fp:fingerprint(sponsorUrl) }
    : { url:REF_HOUSE, host:null, fp:null };
}

function makeLink(){
  const u = validRef($("ld-in").value), out = $("ld-out"), L = C.leaders[lang] || C.leaders.en;
  out.hidden = false; out.textContent = "";
  const b = document.createElement("b");
  if(!u){ out.className = "out bad"; b.textContent = L.bad; out.appendChild(b); return; }
  out.className = "out";
  b.textContent = L.ok; out.appendChild(b);
  const nm = cleanName($("ld-name").value);
  let link = location.origin + location.pathname + "?ref=" + encodeURIComponent(u.href);
  if(nm) link += "&by=" + encodeURIComponent(nm);
  out.appendChild(document.createTextNode(link));
  try{ navigator.clipboard.writeText(link); }catch(e){}
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined) n.textContent = text;
  return n;
}

function rowsFor(items, dest){
  const frag = document.createDocumentFragment();
  const list = el("div","rows");
  let any = false;
  items.forEach(function(i){
    const href = i.url === "__REF__" ? dest.url : i.url;
    if(!href || !safeUrl(href)) return;
    const pair = i[lang] || i.en;
    any = true;
    const a = el("a", i.primary ? "slab" : "row");
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.appendChild(el("span","t",pair[0]));
    a.appendChild(el("span","s",pair[1]));
    if(i.primary){ frag.appendChild(a); }
    else { a.appendChild(el("span","go","›")); list.appendChild(a); }
  });
  if(list.children.length) frag.appendChild(list);
  return any ? frag : null;
}

function setLang(code){
  const L = conf(code);
  lang = L.code;
  document.documentElement.lang = L.code;
  document.documentElement.dir = L.dir;
  document.documentElement.setAttribute("data-font", L.font);
  C.langs.forEach(function(x){
    const b = $("L-" + x.code);
    if(b) b.setAttribute("aria-pressed", String(x.code === lang));
  });
  store("aimpire.lang", lang);
  render();
}
function toggleTheme(){
  /* Lys er naa standard, saa foerste trykk skal gaa til moerk. */
  const cur = document.documentElement.getAttribute("data-theme") || "light";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store("aimpire.theme", next);
}
(function(){
  const th = load("aimpire.theme");
  if(th) document.documentElement.setAttribute("data-theme", th);
  let l = load("aimpire.lang");
  if(!C.langs.some(function(x){ return x.code === l; })){
    const nav = ((navigator.language || "") + " " + (navigator.languages || []).join(" ")).toLowerCase();
    const hit = C.langs.find(function(x){ return new RegExp("\\b" + x.code + "\\b|" + x.code + "-").test(nav); });
    l = hit ? hit.code : C.langs[0].code;
  }
  initSponsor();
  buildSwitch();
  setLang(l);
})();
</script>
</body>
</html>
