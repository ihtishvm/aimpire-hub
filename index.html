<style>
/* Samplet fra founders egne Canva-dokumenter 14.10.2026, ikke oppfunnet:
   kjerneblaa #006EFD, gradient som lysner mot hvitt, svart display-serif.
   Lys er standard - merkevaren er hvit-dominert (31-45 % av pikslene).
   Variabelnavnene er beholdt fra den moerke paletten, saa de ~90
   bruksstedene ikke maatte roeres. Kontrasttall i kommentar per linje. */
:root{
  --ink:#EBF1FB;            /* sideflate: rolig blaa, ikke hvit            */
  --ink-deep:#FFFFFF;       /* kortene loefter seg til hvitt mot den blaa   */
  --ink-raise:#FFFFFF;      /* kort som baerer egen kantlinje              */
  --gold:#006EFD;           /* FLATEfarge: knapp, aktiv fane, 2px-marg     */
  --gold-soft:#064492;      /* TEKSTfarge for blaatt: 9,33:1 mot hvitt     */
  --gold-deep:#064492;
  --lime:#0F7A4A; --red:#C0392B;
  --chalk:#0A1A2F;          /* overskrifter og broedtekst: 17,48:1         */
  --chalk-dim:#49596E;      /* all guidetekst bruker denne - moerknet da   */
                            /* grunnen ble blaa og 5,66 falt til 4,98      */
  --rule:#C9D8EF;           /* hairlines - moerknet for aa synes paa blaa   */
  --edge-ui:#7E90A6;        /* kant paa felt og knapper som MAA ses        */
  --ember:#C24F15;          /* den sparsomme oransjen: risiko, «etterpaa»  */
  --gold-metal:#E8B84B;     /* FLATE: markoerer og stegtall - «se her»     */
  --gold-ink:#7A5410;       /* TEKST-gull naar det trengs: 7,0:1 mot hvitt */
  --jet:#0C1118;            /* ekte svart til kontroller, ikke blaasvart   */
  --jet-on:#FFFFFF;         /* tekst PAA jet - maa snu i moerk modus       */
  --v1:#006EFD; --v2:#2B87FD; --v3:#57A0FE; --v4:#80B7FE;
  --grad:linear-gradient(118deg,#1B4FD8 0%,#15D8C4 33%,#C21FBF 68%,#FBE16B 100%);
  /* Samme familie, men uten de to trinnene som forsvinner paa hvitt:
     #15D8C4 gir 1,9:1 og #FBE16B gir 1,3:1 mot hvit flate. */
  --grad-ink:linear-gradient(118deg,#1B4FD8 0%,#0A5BD8 38%,#C21FBF 100%);
  --measure:36rem;
  --face:"Montserrat",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --display:"Archivo","Montserrat",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --ink:#071A31; --ink-deep:#0B2341; --ink-raise:#123055;
  --gold:#2B87FD; --gold-soft:#80B7FE; --gold-deep:#57A0FE;
  --chalk:#F2F6FC; --chalk-dim:#9DB0C9; --rule:#1E3D66;
  --edge-ui:#6E86A4; --ember:#E8833A;
  --v1:#80B7FE; --v2:#57A0FE; --v3:#2B87FD; --v4:#006EFD;
  --gold-metal:#E8B84B; --gold-ink:#F3CE78; --jet:#F2F6FC; --jet-on:#071A31;
  --grad-ink:var(--grad);
}
html[data-font="deva"]{ --face:"Noto Sans Devanagari","Montserrat",sans-serif }
html[data-font="nastaliq"]{ --face:"Noto Nastaliq Urdu","Montserrat",serif }
html[data-font="naskh"]{ --face:"Noto Naskh Arabic","Montserrat",serif }

/* «Himmelen over bruksanvisningen». Merkevarens egen gradient som et fast
   lag bak innholdet, saa siden har noe aa staa under i stedet for et moerkt
   lokk over seg. Driver bare MENS du scroller: animation-timeline gjoer at
   den har posisjon, ikke tid, saa det tegnes ingen ramme naar siden ligger
   stille. Kun transform animeres - laget males én gang, GPU-en flytter
   teksturen. Ingen background-attachment:fixed (jank i Android Chrome) og
   ingen backdrop-filter (dyr paa Mali/Adreno). ~0,3 KB gzipet. */
.sky{position:fixed;inset-block-start:0;inset-inline:0;height:46vh;z-index:-1;
  pointer-events:none;transform:translate3d(0,0,0);
  background:
    radial-gradient(120% 86% at 16% -12%, #2B87FD 0%, rgba(87,160,254,.55) 34%, rgba(128,183,254,0) 68%),
    linear-gradient(180deg, rgba(241,247,255,.75) 0%, rgba(235,241,251,0) 100%)}
html[dir="rtl"] .sky{background:
    radial-gradient(120% 86% at 84% -12%, #2B87FD 0%, rgba(87,160,254,.55) 34%, rgba(128,183,254,0) 68%),
    linear-gradient(180deg, rgba(241,247,255,.75) 0%, rgba(235,241,251,0) 100%)}
:root[data-theme="dark"] .sky{background:
    radial-gradient(120% 86% at 16% -12%, rgba(6,68,146,.55) 0%, rgba(11,35,65,.35) 40%, rgba(11,35,65,0) 72%),
    linear-gradient(180deg, rgba(11,35,65,.85) 0%, rgba(7,26,49,0) 100%)}
@keyframes drift{
  from{transform:translate3d(-2%,0,0) scale(1.04)}
  to{transform:translate3d(2%,-1.5%,0) scale(1.12)}}
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline:scroll()){
    .sky{animation:drift 1s linear both;animation-timeline:scroll(root block)}}}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--face);
  font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* Nastaliq stabler bokstavformer vertikalt INNE i linja, saa 14px nastaliq
   har omtrent samme detaljnivaa som 10px latinsk. Maalt foer endring:
   guidetekst 15,2px, markoerforklaringer 14,08px — saa vidt lesbart.
   Roten loeftes per skriftsystem, og alle rem-verdier foelger med. */
html[data-font="nastaliq"]{font-size:19.5px}
html[data-font="naskh"]{font-size:18px}
html[data-font="deva"]{font-size:17.5px}
html[data-font="nastaliq"] body{line-height:2.1}
html[data-font="naskh"] body{line-height:1.9}
html[data-font="deva"] body{line-height:1.8}
/* Noto Nastaliq Urdu finnes i 400 og 700. Ber vi om 800 eller 900, lager
   nettleseren syntetisk fet — og paa en skrift der strekene allerede
   overlapper, smoerer det teksten ut i stedet for aa framheve den. */
html[data-font="nastaliq"] h1,html[data-font="nastaliq"] h2,
html[data-font="nastaliq"] h3,html[data-font="nastaliq"] strong,
html[data-font="nastaliq"] b,html[data-font="nastaliq"] .t,
html[data-font="nastaliq"] .wm{font-weight:700}
.shell{max-width:46rem;margin:0 auto;padding:0 clamp(18px,5vw,40px) 72px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
[hidden]{display:none !important}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:26px 0 0;border-bottom:1px solid var(--rule)}
.wordmark{display:flex;align-items:center;gap:11px;padding-bottom:12px}
.mono{width:40px;height:40px;flex:0 0 auto;display:block}
.wordmark .wm{display:block;font-family:var(--display);font-weight:800;font-size:18px;
  font-variation-settings:"wdth" 94;letter-spacing:.11em;text-transform:uppercase;
  line-height:1;color:var(--chalk)}
/* «AIM» er fortsatt poenget i navnet, men det baeres av vekt, ikke av en
   andre farge. Ett ordmerke skal ha én farge naar det staar inntil en
   gradient - ellers konkurrerer de. */
.wordmark .wm em{font-style:normal;font-weight:500;color:inherit}
.wordmark .tag{display:block;margin-top:5px;font-size:10px;letter-spacing:.22em;
  color:var(--chalk-dim);font-weight:600;font-family:var(--display);text-transform:uppercase}
/* Alle fem skal paa én linje ogsaa paa 360px, ellers havner urdu til
   venstre paa linje to - stikk motsatt av hensikten med aa sette den sist. */
.switch{display:flex;gap:4px;padding-bottom:8px;align-items:center}
.switch button{background:var(--ink-deep);border:1px solid var(--rule);border-radius:999px;
  color:var(--chalk);font:inherit;font-size:13px;font-weight:700;
  padding:7px clamp(8px,2.6vw,14px);
  cursor:pointer;font-family:var(--display);min-height:38px;line-height:1;
  white-space:nowrap;transition:none}
.switch button:hover{border-color:var(--gold)}
/* Aktivt spraak: svart flate med gull understrek. Svart baerer kontrasten,
   gullet sier hvilken. Begge deler leses paa en billig skjerm i dagslys. */
.switch button[aria-pressed="true"]{background:var(--jet);border-color:var(--jet);
  color:var(--jet-on);box-shadow:inset 0 -3px 0 0 var(--gold-metal)}
/* Lys/moerk er en KONTROLL, ikke et spraak - den skilles ut. */
.switch .thm{font-size:15px;margin-inline-start:auto;padding:7px 11px;
  border-style:dashed;color:var(--chalk-dim);flex:0 0 auto}
.switch .thm:hover{color:var(--chalk);border-color:var(--gold-metal)}

/* hero */
.hero{padding:52px 0 40px}
.hero h1{margin:0;font-family:var(--display);font-weight:800;
  font-variation-settings:"wdth" 88;
  font-size:clamp(2.5rem,10.5vw,4.6rem);line-height:.94;letter-spacing:-.028em;
  text-transform:none;text-wrap:balance}
html[data-font="deva"] .hero h1,html[data-font="nastaliq"] .hero h1,html[data-font="naskh"] .hero h1{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.3;
  font-size:clamp(2rem,8vw,3.4rem)}
.hero h1 span{display:block}
/* Gradienten bor i logoen og i regelstreken under hver h2. Paa overskriften
   ble den dekorasjon — og halvt usynlig paa hvitt. Dyp blaa i stedet: 9,33:1,
   og to toner leser som ett utsagn i stedet for to. */
.hero h1 span:last-child{color:var(--gold-soft)}
.hero p{margin:26px 0 0;max-width:var(--measure);color:var(--chalk-dim);font-size:1.02rem}
@media (prefers-reduced-motion:no-preference){
  .hero h1 span{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
  .hero h1 span:nth-child(2){animation-delay:.07s}
}
@keyframes rise{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}

/* sections */
.sec{padding:50px 0 0}
.sec > h2{margin:0 0 22px;font-size:1.42rem;font-weight:700;letter-spacing:-.015em;
  color:var(--chalk);font-family:var(--display);font-variation-settings:"wdth" 92}
html[data-font="deva"] .sec > h2,html[data-font="nastaliq"] .sec > h2,html[data-font="naskh"] .sec > h2{
  font-family:var(--face);letter-spacing:0}
.sec > h2 b{display:block;width:46px;height:3px;background:var(--grad);margin-top:11px}
.lede{max-width:var(--measure);color:var(--chalk-dim);margin:0 0 26px}

/* sponsor */
.spon{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin:30px 0 0;
  padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:.86rem;color:var(--chalk-dim)}
.spon strong{color:var(--chalk);font-weight:700}
.spon .fp{font-family:var(--mono);font-size:.82rem;color:var(--gold-soft);font-weight:700;
  letter-spacing:.04em;background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:4px;padding:2px 7px}
.guide > li::before,.rail > li::before,.pin,.keys li::before{font-variant-numeric:tabular-nums}
.spon button{background:none;border:0;color:var(--gold-soft);font:inherit;font-size:.86rem;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* primary action */
.slab{display:block;background:var(--grad);color:#071A31;text-decoration:none;
  border-radius:2px;
  padding:22px 24px;margin:0 0 2px;border:0}
.slab .t{display:block;font-family:"Montserrat",sans-serif;font-weight:900;font-size:1.4rem;
  letter-spacing:.01em;line-height:1.12;text-transform:uppercase}
html[data-font="deva"] .slab .t,html[data-font="nastaliq"] .slab .t,html[data-font="naskh"] .slab .t{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.7}
.slab .s{display:block;margin-top:5px;font-size:.9rem;opacity:.72;font-weight:600}
.slab:hover,.slab:focus-visible{filter:brightness(1.12)}

/* ruled link rows */
/* Rader paa blaa grunn saa ut som tekst. Naa er de et hvitt kort med
   egne rader, tittelen i lenkefargen og et stoerre, tydeligere maal. */
.rows{background:var(--ink-deep);border:1px solid var(--rule);border-radius:8px;
  overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:15px 16px;
  border-top:1px solid var(--rule);text-decoration:none;color:inherit;min-height:60px}
.row:first-child{border-top:0}
.row .t{font-weight:700;font-size:1.04rem;letter-spacing:-.01em;color:var(--gold-soft)}
.row .s{color:var(--chalk-dim);font-size:.88rem;flex:1}
.row:hover,.row:focus-visible{background:#F3F8FF}
.row .go{color:var(--gold);font-weight:800;font-size:1.25rem;font-family:var(--display);
  flex:0 0 auto;line-height:1}
html[dir="rtl"] .row .go{transform:scaleX(-1)}
:root[data-theme="dark"] .row:hover,:root[data-theme="dark"] .row:focus-visible{
  background:var(--ink-raise)}

/* short list */
.rail{list-style:none;margin:0;padding:0;position:relative;counter-reset:n}
.rail::before{content:"";position:absolute;inset-block:14px;inset-inline-start:13px;
  width:1px;background:var(--rule)}
.rail > li{position:relative;padding:0 0 26px;padding-inline-start:46px;max-width:var(--measure)}
.rail > li:last-child{padding-bottom:0}
.rail > li::before{content:counter(n);counter-increment:n;position:absolute;inset-inline-start:0;
  top:-1px;width:27px;height:27px;border:1px solid var(--rule);border-radius:50%;
  background:var(--ink);color:var(--chalk-dim);display:grid;place-items:center;
  font-size:.8rem;font-weight:700;font-family:"Montserrat",sans-serif}

/* step-by-step guide */
.guide{list-style:none;counter-reset:g;margin:0;padding:0;position:relative}
.guide::before{content:"";position:absolute;inset-block:16px;inset-inline-start:15px;
  width:1px;background:var(--rule)}
.guide > li{counter-increment:g;position:relative;padding:0 0 26px;padding-inline-start:52px;
  max-width:var(--measure)}
.guide > li:last-child{padding-bottom:0}
/* Stegtallet ER avhukingen. Ett trykk, stort nok maal, og ingressen sitt
   loefte om aa «stoppe etter hvert steg og komme tilbake» blir ekte. */
.tick{position:absolute;inset-inline-start:0;top:-2px;width:33px;height:33px;
  border-radius:50%;background:var(--gold-metal);border:1.5px solid var(--jet);
  color:var(--jet);display:grid;place-items:center;font:800 .85rem/1 var(--display);
  font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.tick[aria-pressed="true"]{background:var(--jet);color:var(--gold-metal)}
/* Dimming av avhukede steg var feil paa to maater: paa nastaliq og naskh
   blir allerede fine streker uleselige ved 50 % opasitet, og man maa kunne
   lese om igjen et steg man har gjort. Fullfoeringen vises paa sirkelen
   alene — teksten staar i full styrke. */
.guide > li.done h3{color:var(--chalk-dim)}
.tick[aria-pressed="true"]::after{content:"";position:absolute;inset:0;
  border-radius:50%;box-shadow:0 0 0 3px var(--gold-metal)}
.tick{position:absolute}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 20px;
  font-family:var(--mono);font-size:.82rem;color:var(--chalk-dim)}
.prog .bar{flex:1 1 120px;height:4px;background:var(--rule);border-radius:999px;
  overflow:hidden;min-width:90px}
.prog .bar i{display:block;height:100%;background:var(--gold-metal);
  transition:width .18s linear}
.prog button{background:none;border:0;color:var(--gold-soft);font:inherit;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* Koder som maa skrives EKSAKT hoerer ikke hjemme i loepende tekst. */
.codes{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 0}
.codes button{display:inline-flex;align-items:center;gap:9px;background:var(--ink-deep);
  border:1px solid var(--rule);border-radius:6px;padding:9px 12px;cursor:pointer;
  font:inherit;font-size:.84rem;color:var(--chalk);text-align:start}
.codes button:hover{border-color:var(--gold-metal)}
.codes .k{color:var(--chalk-dim);font-size:.78rem}
/* «#Aitech» begynner med et noeytralt tegn. I en RTL-setning flyttes
   «#» til hoeyre for de latinske bokstavene og koden VISES som «Aitech#»,
   selv om verdien som kopieres er riktig. Isolering laaser visningen. */
.codes .v{font-family:var(--mono);font-weight:700;letter-spacing:.03em;
  direction:ltr;unicode-bidi:isolate;display:inline-block}
.codes .c{color:var(--gold-soft);font-size:.74rem;font-family:var(--face)}

/* Riktig app, riktig plattform. To store maal - ingen gjetting. */
.apps{display:flex;gap:8px;margin:13px 0 0;flex-wrap:wrap}
.apps a{flex:1 1 130px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--jet);color:var(--jet-on);border:1px solid var(--jet);border-radius:6px;
  padding:13px 14px;text-decoration:none;font-weight:700;font-size:.92rem;
  font-family:var(--display);min-height:46px}
.apps a:hover,.apps a:focus-visible{filter:brightness(1.25)}
.joinbtn{display:block;margin:9px 0 0;background:var(--grad);color:#071A31;
  text-decoration:none;padding:15px 16px;border-radius:6px;text-align:center;
  font-weight:800;font-size:1rem;font-family:var(--display);min-height:50px}
.joinbtn:hover,.joinbtn:focus-visible{filter:brightness(1.12)}

/* Ordlista. Lukket til man trykker, saa den som bare vil la Sonic gaa
   slipper aa scrolle forbi tolv begreper. */
.learn{display:grid;gap:2px}
.learn details{background:var(--ink-deep);border:1px solid var(--rule);border-radius:6px}
.learn summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:1rem;
  font-family:var(--display);list-style:none;display:flex;align-items:center;gap:10px;
  min-height:52px}
.learn summary::-webkit-details-marker{display:none}
.learn summary::after{content:"+";margin-inline-start:auto;color:var(--gold-soft);
  font-weight:800;font-size:1.2rem;line-height:1}
.learn details[open] summary::after{content:"\2212"}
.learn details[open] summary{border-bottom:1px solid var(--rule)}
.learn .body{padding:4px 16px 16px}
.learn .one{margin:10px 0 0;color:var(--chalk);font-size:.95rem}
.learn dl{margin:12px 0 0;display:grid;gap:3px}
.learn dt{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--chalk-dim);font-family:var(--display);font-weight:700}
.learn dd{margin:0 0 9px;font-size:.9rem;color:var(--chalk-dim)}
.learn dd.ex{font-family:var(--mono);font-size:.84rem;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);border-radius:5px;padding:9px 11px;
  direction:ltr;unicode-bidi:isolate;text-align:start}
/* Formelen er regelen de kan bruke selv. Den skiller seg fra eksempelet
   med gullkant, saa den leses som «dette er verktoeyet». */
.learn dd.fx{font-family:var(--mono);font-size:.84rem;color:var(--chalk);
  background:var(--ink);border:1px solid var(--rule);
  border-inline-start:3px solid var(--gold-metal);border-radius:0 5px 5px 0;
  padding:9px 11px;direction:ltr;unicode-bidi:isolate;text-align:start}
html[dir="rtl"] .learn dd.fx{border-radius:5px 0 0 5px}
.learn .lfig{margin:13px 0 4px}
.learn .lfig svg{display:block;width:100%;height:auto}
.guide h3{margin:0 0 5px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.guide p{margin:0;color:var(--chalk-dim);font-size:.95rem}

/* language chips for the partner's own videos */
/* «Husk dette» skal leses foer broedteksten rundt, ikke etter. Gul kant
   og hvit flate loefter den ut, og den staar i full tekstfarge — ikke
   dempet, slik den gjorde foer. */
/* «Slik vet du at det gikk riktig». Groenn kant fordi den betyr
   fullfoert — her er det faktisk riktig bruk av groenn. */
.chk{margin:13px 0 0;padding:12px 15px;background:var(--ink-deep);
  border:1px solid var(--rule);border-inline-start:4px solid #0F7A4A;
  border-radius:0 6px 6px 0;font-size:.89rem;color:var(--chalk)}
html[dir="rtl"] .chk{border-radius:6px 0 0 6px}
.chk b{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  color:#0F7A4A;font-family:var(--display);margin-bottom:5px}
:root[data-theme="dark"] .chk{border-inline-start-color:#4ADE80}
:root[data-theme="dark"] .chk b{color:#4ADE80}

.vnote{margin:13px 0 0;padding:13px 15px;background:var(--ink-deep);
  border:1px solid var(--rule);border-inline-start:4px solid var(--gold-metal);
  border-radius:0 6px 6px 0;font-size:.9rem;color:var(--chalk);font-weight:500}
html[dir="rtl"] .vnote{border-radius:6px 0 0 6px}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.langs a{display:inline-block;padding:7px 12px;border:1px solid var(--rule);border-radius:999px;
  font-size:.82rem;font-weight:600;text-decoration:none;color:var(--chalk-dim);
  font-family:"Montserrat",sans-serif;background:var(--ink-deep)}
.langs a:hover,.langs a:focus-visible{border-color:var(--gold);color:var(--gold)}
.soon{margin:12px 0 0;font-size:.86rem;color:var(--chalk-dim);font-style:italic}

/* annotated screenshot */
.shot{margin:14px 0 0;position:relative;max-width:300px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:6px}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--gold-metal);
  color:var(--jet);font:800 12px/1 var(--display);display:grid;place-items:center;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--ink);pointer-events:none}
html[dir="rtl"] .pin{transform:translate(50%,-50%)}
.keys{list-style:none;margin:12px 0 0;padding:0;counter-reset:k}
.keys li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:.88rem;
  color:var(--chalk-dim)}
.keys li::before{content:counter(k);counter-increment:k;flex:0 0 auto;width:20px;height:20px;
  border-radius:50%;background:var(--gold-metal);color:var(--jet);display:grid;place-items:center;
  font:800 11px/1 var(--display);margin-top:2px}

/* earnings */
.earn{margin:0;padding:0;list-style:none}
.earn > li{padding:0 0 22px;max-width:var(--measure);position:relative;padding-inline-start:20px}
.earn > li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;
  width:8px;height:8px;background:var(--gold)}
.earn h3{margin:0 0 3px;font-size:1.04rem;font-weight:700;letter-spacing:-.01em}
.earn p{margin:0;color:var(--chalk-dim);font-size:.93rem}
.warn{max-width:var(--measure);margin:10px 0 0;padding:18px 20px;background:#FFF4EC;
  border:1px solid #F0D3BE;border-inline-start:4px solid var(--ember);
  border-radius:0 6px 6px 0;font-size:.93rem;color:var(--chalk)}
html[dir="rtl"] .warn{border-radius:6px 0 0 6px}
:root[data-theme="dark"] .warn{background:var(--ink-raise);border-color:var(--rule);
  border-inline-start-color:var(--ember)}

/* values — tiers that widen */
.tiers{margin:0;padding:0;list-style:none}
.tiers > li{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;margin-bottom:3px;
  background:var(--ink-raise);border-inline-start:3px solid var(--gold)}
.tiers > li:nth-child(1){width:76%;border-inline-start-color:var(--v1)}
.tiers > li:nth-child(2){width:84%;border-inline-start-color:var(--v2)}
.tiers > li:nth-child(3){width:92%;border-inline-start-color:var(--v3)}
.tiers > li:nth-child(4){width:100%;border-inline-start-color:var(--v4)}
@media (max-width:560px){ .tiers > li{width:100% !important} }
/* The whole word is the display type now — founder saw one 2rem Montserrat Black
   letter in four bright colours and said it read like a primary-school alphabet
   chart. Geometric/technical face per BRAND.md §1, medium weight instead of
   Black, sentence case instead of shouting caps, and the AIMPIRE acronym is
   carried by the initial in the logo gradient rather than by four flat brights. */
.tiers h3{margin:0 0 6px;font-family:var(--display);font-weight:700;
  font-variation-settings:"wdth" 90;
  font-size:clamp(1.5rem,5.6vw,2.05rem);line-height:1.04;letter-spacing:-.022em;
  text-transform:none;color:var(--chalk)}
.tiers h3 .ini{color:var(--gold-soft);
  box-shadow:inset 0 -.085em 0 0 var(--gold);padding-bottom:.03em}
html[data-font="deva"] .tiers h3,html[data-font="nastaliq"] .tiers h3,html[data-font="naskh"] .tiers h3{
  font-family:var(--display)}
.tiers p{margin:0;color:var(--chalk-dim);font-size:.92rem}

/* tre steder, tre navn */
.places{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.places > li{padding:15px 18px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold)}
.places h3{margin:0 0 3px;font-size:.95rem;font-weight:800;
  font-family:"Montserrat",sans-serif;letter-spacing:.01em}
.places p{margin:0;color:var(--chalk-dim);font-size:.9rem}
@media (min-width:620px){ .places{grid-template-columns:repeat(3,1fr)} }
/* Amplify staar i én kolonne ogsaa paa bred skjerm — fire punkter som maa
   leses i rekkefoelge, ikke tre kort som kan skumleses. */
.places.amp{grid-template-columns:1fr !important;gap:3px;max-width:var(--measure)}
.places.amp > li{border-inline-start-color:var(--ember);padding:16px 18px}
.places.amp p{color:var(--chalk);font-size:.93rem}

/* IB-seksjonen. Staar nederst fordi den er valgfri. */
.ib{display:grid;gap:3px;max-width:var(--measure)}
.ib > section{background:var(--ink-deep);border:1px solid var(--rule);
  border-radius:6px;padding:17px 19px}
.ib h3{margin:0 0 7px;font-family:var(--display);font-weight:700;
  font-size:1.06rem;letter-spacing:-.015em}
.ib p{margin:0;color:var(--chalk);font-size:.93rem}
.ib .fig{margin:15px 0 0}
.ib .cap{margin:8px 0 0;font-size:.8rem;color:var(--chalk-dim);
  font-family:var(--mono);direction:ltr;unicode-bidi:isolate;text-align:start}
.ib .flag{margin:14px 0 0;padding:11px 13px;background:#FFF4EC;
  border:1px solid #F0D3BE;border-inline-start:4px solid var(--ember);
  border-radius:0 5px 5px 0;font-size:.85rem;color:var(--chalk)}
html[dir="rtl"] .ib .flag{border-radius:5px 0 0 5px}
:root[data-theme="dark"] .ib .flag{background:var(--ink-raise);border-color:var(--rule)}
.ib svg{display:block;width:100%;height:auto}

/* notices */
.notice{max-width:var(--measure);padding:22px 24px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold)}
.notice.alert{border-inline-start-color:var(--ember);background:#FFF4EC}
:root[data-theme="dark"] .notice.alert{background:var(--ink-raise)}
.notice h3{margin:0 0 8px;font-size:1.1rem;font-weight:700}
.notice p{margin:0 0 10px;color:var(--chalk-dim);font-size:.94rem}
.notice p:last-child{margin-bottom:0}
.notice .foot{font-size:.85rem;padding-top:12px;margin-top:14px;border-top:1px solid var(--rule)}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.choice button{flex:1 1 150px;padding:13px;border:1px solid var(--rule);background:none;
  color:var(--chalk);font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
  font-family:"Montserrat",sans-serif}
.choice button:first-child{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* leader tool */
.tool{max-width:var(--measure)}
.tool p{color:var(--chalk-dim);font-size:.94rem;margin:0 0 16px}
.tool input{width:100%;background:var(--ink-deep);border:1px solid var(--rule);color:var(--chalk);
  padding:14px 15px;font:inherit;font-size:.95rem;font-family:"Montserrat",sans-serif;
  margin-bottom:8px}
.tool input:focus{border-color:var(--gold);outline:none}
.tool .hint{font-size:.82rem;color:var(--chalk-dim);margin:0 0 14px}
.spon .who{color:var(--chalk);font-weight:800}
.tool button{width:100%;background:var(--chalk);color:var(--ink);border:0;padding:15px;
  font:inherit;font-weight:700;font-size:.98rem;cursor:pointer;font-family:"Montserrat",sans-serif}
.out{margin-top:14px;padding:14px 15px;background:var(--ink-deep);border:1px solid var(--rule);
  font-size:.8rem;word-break:break-all;line-height:1.7}
.out b{display:block;color:var(--gold-soft);margin-bottom:6px;font-size:.85rem}
.out.bad b{color:var(--gold-soft)}

.risk{max-width:var(--measure);margin:56px 0 0;padding-top:20px;border-top:1px solid var(--rule);
  color:var(--chalk-dim);font-size:.85rem}
.sig{margin:30px 0 0;font-size:.8rem;color:var(--chalk-dim);font-family:"Montserrat",sans-serif}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="shell">

  <header class="mast">
    <div class="wordmark">
      <img class="mono" src="assets/ap-gradient.png" alt="" width="40" height="40">
      <span><span class="wm">Aim<em>pire</em></span><span class="tag">Aim for it</span></span>
    </div>
    <nav class="switch" id="switch" aria-label="Language"></nav>
  </header>

  <section class="hero">
    <h1><span id="h1"></span><span id="h2"></span></h1>
    <p id="hsub"></p>
    <div class="spon" id="spon" hidden></div>
  </section>

  <section class="sec" id="s-main">
    <h2 id="t-start"></h2>
    <div class="notice" id="notice-none" hidden>
      <h3 id="nn-t"></h3><p id="nn-b"></p><p class="foot" id="nn-f"></p>
    </div>
    <div class="notice alert" id="notice-conflict" hidden>
      <p id="nc-t"></p>
      <div class="choice"><button id="nc-keep"></button><button id="nc-use"></button></div>
    </div>
    <div id="main-links"></div>
  </section>

  <section class="sec">
    <h2 id="t-guide"></h2>
    <p class="lede" id="guide-lede"></p>
    <p class="prog" id="prog" hidden>
      <span id="prog-t"></span>
      <span class="bar"><i id="prog-i"></i></span>
      <button id="prog-r" type="button"></button>
    </p>
    <ol class="guide" id="guide"></ol>
  </section>

  <section class="sec" id="s-amplify" hidden>
    <h2 id="t-amplify"></h2>
    <ul class="places" id="amplify"></ul>
  </section>

  <section class="sec" id="s-places" hidden>
    <h2 id="t-places"></h2>
    <p class="lede" id="places-lede"></p>
    <ul class="places" id="places"></ul>
  </section>

  <section class="sec" id="s-platform"><h2 id="t-platform"></h2><div id="platform-links"></div></section>

  <section class="sec">
    <h2 id="t-earn"></h2>
    <p class="lede" id="earn-lede"></p>
    <ul class="earn" id="earn-list"></ul>
    <div id="earn-shot"></div>
    <p class="warn" id="earn-warn"></p>
  </section>

  <section class="sec"><h2 id="t-values"></h2><ul class="tiers" id="tiers"></ul></section>
  <section class="sec" id="s-learn" hidden>
    <h2 id="t-learn"></h2>
    <p class="lede" id="learn-lede"></p>
    <div id="learn"></div>
  </section>

  <section class="sec" id="s-video"><h2 id="t-video"></h2><div id="video-links"></div></section>
  <section class="sec" id="s-docs"><h2 id="t-docs"></h2><div id="docs-links"></div></section>
  <section class="sec" id="s-help"><h2 id="t-help"></h2><div id="help-links"></div></section>

  <section class="sec" id="s-ib" hidden>
    <h2 id="t-ib"></h2>
    <p class="lede" id="ib-lede"></p>
    <div id="ib"></div>
  </section>

  <section class="sec" id="s-leaders">
    <h2 id="t-leaders"></h2>
    <div class="tool">
      <p id="ld-body"></p>
      <input id="ld-in" type="url" autocomplete="off" spellcheck="false">
      <input id="ld-name" type="text" autocomplete="given-name" spellcheck="false" maxlength="24">
      <p class="hint" id="ld-hint"></p>
      <button id="ld-btn" onclick="makeLink()"></button>
      <div class="out" id="ld-out" hidden></div>
    </div>
  </section>

  <p class="risk" id="risk"></p>
  <p class="sig">Aimpire &middot; <span id="yr"></span></p>
</div>

p by step","ur":"اکاؤنٹ کھولنے کا طریقہ، مرحلہ وار","no":"Slik åpner du kontoen, steg for steg","hi":"खाता खोलने का तरीका, चरण दर चरण","ar":"فتح حسابك، خطوة بخطوة"},"learn":{"en":"The words, if you want them","no":"Ordene, om du vil ha dem","hi":"शब्द, अगर आप चाहें","ur":"الفاظ، اگر آپ چاہیں","ar":"المصطلحات، إن أردتها"},"platform_gate":{"en":"These open once your sponsor's link is set. They are for after you have an account — opening them before that is how people end up with an account nobody is attached to.","no":"Disse åpner seg når sponsorlenka er satt. De er til etter at du har konto — å åpne dem før det er slik folk ender opp med en konto ingen er knyttet til.","hi":"ये तब खुलते हैं जब sponsor का link सेट हो। ये account बनने के बाद के लिए हैं — उससे पहले खोलना ही वह तरीक़ा है जिससे लोग ऐसा account बना बैठते हैं जिससे कोई जुड़ा नहीं होता।","ur":"یہ تب کھلتے ہیں جب sponsor کا link سیٹ ہو۔ یہ account بننے کے بعد کے لیے ہیں — اس سے پہلے کھولنا ہی وہ طریقہ ہے جس سے لوگ ایسا account بنا بیٹھتے ہیں جس سے کوئی منسلک نہیں ہوتا۔","ar":"تُفتح هذه بعد ضبط رابط الـ sponsor. وهي لما بعد إنشاء الحساب — وفتحها قبل ذلك هو ما يجعل الناس ينتهون بحساب لا يرتبط به أحد."},"amplify":{"en":"Amplify and the token — what you are agreeing to","no":"Amplify og token — hva du sier ja til","hi":"Amplify और token — आप किस बात पर हाँ कह रहे हैं","ur":"Amplify اور token — آپ کس بات پر ہاں کہہ رہے ہیں","ar":"Amplify والـ token — على ماذا توافق"},"ib":{"en":"How you earn, if you want to","no":"Hvordan du tjener, hvis du vil","hi":"आप कैसे कमाते हैं, अगर आप चाहें","ur":"آپ کیسے کماتے ہیں، اگر آپ چاہیں","ar":"كيف تكسب، إن أردت"}},"steps":{"en":["Use your sponsor's link","Create your account","Link your broker account — this step matters","Verify your identity","Wait for approval","Put money in","Connect to Sonic copy trading","See your account in MetaTrader 5","Join the group"],"ur":["اپنے سپانسر کا لنک استعمال کریں","اپنا اکاؤنٹ بنائیں","اپنا broker اکاؤنٹ جوڑیں — یہ مرحلہ اہم ہے","اپنی شناخت کی تصدیق کریں","منظوری کا انتظار کریں","پیسے جمع کریں","سونِک کاپی ٹریڈنگ سے منسلک ہوں","اپنا account MetaTrader 5 میں دیکھیں","گروپ میں شامل ہوں"],"no":["Bruk sponsorens lenke","Opprett kontoen","Koble meglerkontoen — dette steget er viktig","Bekreft identiteten din","Vent på godkjenning","Sett inn penger","Koble til Sonic copy trading","Se kontoen din i MetaTrader 5","Bli med i gruppa"],"hi":["अपने स्पॉन्सर का लिंक इस्तेमाल करें","अपना खाता बनाएँ","अपना ब्रोकर खाता जोड़ें — यह चरण महत्वपूर्ण है","अपनी पहचान सत्यापित करें","मंज़ूरी का इंतज़ार करें","पैसे डालें","Sonic copy trading से जुड़ें","अपना account MetaTrader 5 में देखें","ग्रुप में शामिल हों"],"ar":["استخدم رابط الـ sponsor الخاص بك","أنشئ حسابك","اربط حساب الـ broker — هذه الخطوة مهمة","أكّد هويتك","انتظر الموافقة","أودع المال","اتصل بـ Sonic copy trading","راقب حسابك في MetaTrader 5","انضم إلى المجموعة"]},"earn":{"en":{"intro":"Four ways, and one warning. Your real numbers are only ever in your IB Portal — never in a chat message.","items":[["Rebate per lot","Part of the trading cost comes back on every lot your team trades. Paid on activity. No trading, no rebate."],["Profit share","When a strategy closes a winning trade, the profit is split. The trader keeps the largest share."],["Team bonus","As people you introduced start trading, more levels of the structure pay out to you. Your IB Portal shows which are open and which are still locked — that screen is the number that counts."],["Pools and campaigns","Leader pools and seasonal campaigns come and go. Read the current terms before you count on one."]],"warning":"Trading involves real risk, and most retail accounts lose money. What you earn here depends on actual activity — there is no guaranteed income, and it can be nothing. We would rather be straight with you about that from the start."},"ur":{"intro":"کمائی کے چار راستے، اور ایک ضروری بات۔ آپ کے اصل اعداد و شمار صرف آپ کے IB Portal میں ہوتے ہیں — کسی chat میں نہیں۔","items":[["Rebate per lot","آپ کی ٹیم کے ہر lot پر trading cost کا ایک حصہ واپس آتا ہے۔ یہ سرگرمی پر ملتا ہے، وعدوں پر نہیں — trading نہیں تو rebate نہیں۔"],["Profit share","جب کوئی strategy نفع کے ساتھ trade بند کرتی ہے تو profit تقسیم ہوتا ہے۔ سب سے بڑا حصہ trader کا رہتا ہے۔"],["Team bonus","آپ کی ٹیم بڑھنے کے ساتھ اس کی مزید levels آپ کے حساب میں آنے لگتی ہیں۔ IB Portal میں آپ دیکھ سکتے ہیں کون سی کھل چکی ہیں اور کون سی نہیں۔"],["Pools and campaigns","Leader pools اور کچھ عرصے کے لیے چلنے والی campaigns آتی جاتی رہتی ہیں۔ اس لیے اِن پر بھروسہ کرنے سے پہلے IB Portal میں موجودہ شرائط ضرور پڑھ لیں۔"]],"warning":"Trading میں اصل خطرہ ہوتا ہے، اور زیادہ تر retail accounts نقصان میں رہتے ہیں۔ یہاں آپ کی کمائی اس پر ہے کہ اصل میں کتنی trading ہوتی ہے — کسی آمدنی کی ضمانت نہیں، اور یہ صفر بھی ہو سکتی ہے۔ ہم چاہتے ہیں کہ آپ یہ شروع ہی سے صاف جان لیں۔"},"no":{"intro":"Fire veier, og én advarsel. De virkelige tallene dine finnes bare i IB-portalen — aldri i en chatmelding.","items":[["Rebate per lot","Del av handelskostnaden kommer tilbake på hver lot teamet ditt handler. Betales på aktivitet. Ingen handel, ingen rebate."],["Profit share","Når en strategi lukker en handel med gevinst, deles profitten. Traderen beholder den største delen."],["Team bonus","Etter hvert som teamet vokser, teller flere av nivåene mot deg. Portalen viser hvilke som er låst opp."],["Pools and campaigns","Lederpotter og sesongkampanjer kommer og går. Les gjeldende vilkår før du regner med en."]],"warning":"Trading innebærer reell risiko, og de fleste privatkontoer taper penger. Det du tjener her avhenger av faktisk aktivitet — ingen inntekt er garantert, og den kan bli null. Vi vil heller være ærlige om det fra starten."},"hi":{"intro":"कमाई के चार रास्ते, और एक चेतावनी। आपके असली आँकड़े सिर्फ़ आपके IB Portal में होते हैं — किसी चैट संदेश में नहीं।","items":[["Rebate per lot","आपकी टीम द्वारा ट्रेड किए गए हर lot पर trading cost का एक हिस्सा वापस आता है। यह गतिविधि पर मिलता है, वादों पर नहीं — trading नहीं तो rebate नहीं।"],["Profit share","जब कोई strategy मुनाफ़े के साथ trade बंद करती है तो profit बँटता है। सबसे बड़ा हिस्सा trader का रहता है।"],["Team bonus","टीम बढ़ने के साथ उसके और levels आपके लिए गिने जाते हैं। IB Portal बताता है कौन से खुले हैं और कौन से नहीं।"],["Pools and campaigns","Leader pools और मौसमी campaigns समय-समय पर चलती हैं। ये बदलती रहती हैं, इसलिए भरोसा करने से पहले IB Portal में मौजूदा शर्तें ज़रूर पढ़ें।"]],"warning":"Trading में असली जोखिम है, और ज़्यादातर retail accounts नुक़सान उठाते हैं। यहाँ आपकी कमाई असल गतिविधि पर निर्भर करती है — कोई आमदनी की गारंटी नहीं, और यह शून्य भी हो सकती है। हम चाहते हैं कि आप यह शुरू से ही साफ़ जान लें।"},"ar":{"intro":"أربع طرق، وتنبيه واحد. أرقامك الحقيقية موجودة في IB Portal وحده — وليست في رسالة chat.","items":[["Rebate per lot","يعود إليك جزء من الـ trading cost عن كل lot يتداوله فريقك. ويُدفع مقابل النشاط الفعلي: بلا trading لا يوجد rebate."],["Profit share","عندما تُغلق إحدى الـ strategies صفقة رابحة، يُقسَّم الـ profit. ويبقى النصيب الأكبر للـ trader."],["Team bonus","كلما كبر فريقك، احتُسب لك عدد أكبر من مستوياته. ويُظهر لك IB Portal أيُّها مفتوح."],["Pools and campaigns","الـ leader pools والـ campaigns الموسمية تتغيّر من فترة إلى أخرى. اقرأ الشروط الحالية في IB Portal قبل أن تعتمد على أيٍّ منها."]],"warning":"في الـ trading خطر حقيقي، وأكثر الـ retail accounts تخسر أموالها. وما تكسبه هنا يعتمد على نشاط فعلي — لا دخل مضمون، وقد يكون صفراً. نفضّل أن نكون صريحين معك في هذا منذ البداية."}},"values":{"en":[["A","Aspire","Dream big and go after it. Ambition is the entry fee, not the reward."],["I","Inspire","Share what you learn, including what went wrong. Lift the person next to you."],["M","Meritocracy","Work and skill get recognised. Where you come from does not decide what you can become."],["E","Empire","Built together, or not at all. Everyone belongs and everyone contributes."]],"ur":[["A","Aspire","خواب بڑا رکھیں، پھر اُس پر کام بھی کریں۔ صرف چاہنا شروعات ہے، انعام نہیں۔"],["I","Inspire","جو سیکھیں وہ آگے بتائیں — جو غلط ہوا، وہ بھی۔ ساتھ والے کو ساتھ لے کر چلیں۔"],["M","Meritocracy","محنت اور مہارت کی قدر ہوتی ہے۔ آپ کہاں سے آئے، یہ طے نہیں کرتا کہ آپ کیا بن سکتے ہیں۔"],["E","Empire","یہ مل کر ہی بنے گا، اکیلے نہیں۔ ہر کوئی اپنا ہے، اور ہر کوئی اپنا حصہ ڈالتا ہے۔"]],"no":[["A","Aspire","Drøm stort — og gjør noe med det. Ambisjon er inngangsbilletten, ikke belønningen."],["I","Inspire","Del det du lærer, også det som gikk galt. Dra med deg dem som står ved siden av deg."],["M","Meritocracy","Innsats og dyktighet teller. Hvor du kommer fra avgjør ikke hvor du kan havne."],["E","Empire","Vi bygger det sammen, ellers blir det ikke bygd. Alle hører til, og alle bidrar."]],"hi":[["A","Aspire","बड़ा सपना देखें और उसके पीछे जाएँ। महत्वाकांक्षा प्रवेश शुल्क है, इनाम नहीं।"],["I","Inspire","जो सीखें वह बाँटें, जो ग़लत हुआ वह भी। अपने साथी को ऊपर उठाएँ।"],["M","Meritocracy","मेहनत और हुनर की क़द्र होती है। आप कहाँ से आए, यह तय नहीं करता कि आप क्या बन सकते हैं।"],["E","Empire","मिलकर बनेगा, वरना नहीं। हर कोई अपना है और हर कोई योगदान देता है।"]],"ar":[["A","Aspire","اطمح إلى ما هو أكبر، واسعَ إليه. الطموح تذكرة الدخول، لا الجائزة."],["I","Inspire","شارك ما تتعلمه، وأخطاءك أيضاً. وخُذ بيد من بجانبك."],["M","Meritocracy","التقدير هنا للعمل والمهارة. ومن أين أتيت لا يحدد إلى أين تصل."],["E","Empire","نبنيه معاً، أو لا يُبنى. لكلِّ واحد مكانه فيه، ولكلِّ واحد دوره."]]},"leaders":{"en":{"title":"Turn your IB link into an Aimpire page","body":"Open the IB Portal, go to Profile, and copy your Partner or SonicFunnel link. Paste it here. You get one link that shows this whole page in every language, with you attached as the contact for anyone who opens it.","placeholder":"Paste your invite link","button":"Make my link","ok":"Copied. Share this one.","bad":"That is not a recognised invite link. It must start with https:// and come from your IB Portal profile.","name_hint":"Add your first name and the people you invite will see who sent them."},"ur":{"title":"اپنے invite link کو Aimpire link بنائیں","body":"IB Portal کھولیں، Profile میں جائیں، اور اپنا Partner یا SonicFunnel link کاپی کریں۔ اسے یہاں پیسٹ کریں۔ آپ کو ایک ہی link ملے گا جو یہ صفحہ ہر زبان میں دکھاتا ہے، اور جو بھی اسے کھولے، اُس کے لیے رابطہ آپ ہوں گے۔","placeholder":"اپنا دعوتی لنک پیسٹ کریں","button":"میرا لنک بنائیں","ok":"کاپی ہو گیا۔ یہی شیئر کریں۔","bad":"یہ link پہچانا نہیں گیا۔ یہ https:// سے شروع ہونا چاہیے اور آپ کے IB Portal کے Profile سے آنا چاہیے۔","name_hint":"اپنا پہلا نام شامل کریں، تو جنہیں آپ مدعو کریں گے وہ دیکھ سکیں گے کہ کس نے بھیجا۔"},"no":{"title":"Gjør invitasjonslenken din om til en Aimpire-lenke","body":"Åpne IB Portal, gå til Profile, og kopier Partner- eller SonicFunnel-lenka di. Lim den inn her. Du får én lenke som viser hele denne siden på alle språkene, med deg som kontaktperson for alle som åpner den.","placeholder":"Lim inn invitasjonslenken din","button":"Lag lenken min","ok":"Kopiert. Del denne.","bad":"Dette er ikke en gyldig invitasjonslenke. Den må starte med https:// og komme fra IB-portalprofilen din.","name_hint":"Legg til fornavnet ditt, så ser de du inviterer hvem som sendte dem."},"hi":{"title":"अपने निमंत्रण लिंक को Aimpire लिंक बनाएँ","body":"IB Portal खोलें, Profile में जाएँ, और अपना Partner या SonicFunnel लिंक कॉपी करें। उसे यहाँ पेस्ट करें। आपको एक लिंक मिलेगा जो यह पूरा पेज सभी भाषाओं में दिखाता है, और जो भी उसे खोलेगा उसके लिए आप ही contact होंगे।","placeholder":"अपना निमंत्रण लिंक पेस्ट करें","button":"मेरा लिंक बनाएँ","ok":"कॉपी हो गया। यही साझा करें।","bad":"यह मान्य निमंत्रण लिंक नहीं है। यह https:// से शुरू होना चाहिए और आपके IB Portal प्रोफ़ाइल से आना चाहिए।","name_hint":"अपना पहला नाम जोड़ें, तो जिन्हें आप बुलाएँगे वे देख पाएँगे कि किसने भेजा।"},"ar":{"title":"حوّل رابط دعوتك إلى رابط Aimpire","body":"افتح IB Portal، واذهب إلى Profile، وانسخ رابط Partner أو SonicFunnel الخاص بك. ألصقه هنا. ستحصل على رابط واحد يعرض هذه الصفحة كاملة بجميع اللغات، وتكون أنت جهة الاتصال لكل من يفتحه.","placeholder":"الصق رابط دعوتك","button":"أنشئ رابطي","ok":"تم النسخ. شارِك هذا الرابط.","bad":"لم نتعرّف على هذا الرابط كرابط دعوة. يجب أن يبدأ بـ https:// وأن يكون من صفحة Profile في IB Portal.","name_hint":"أضف اسمك الأول، فيرى من تدعوهم من أرسلهم."}},"risk":{"en":"Trading involves risk and you can lose the money you put in. Nothing here is financial advice, and no income is promised. Use only money you can afford to lose, and check the rules that apply where you live.","ur":"Trading میں خطرہ ہے اور آپ اپنی لگائی ہوئی رقم کھو سکتے ہیں۔ یہاں کچھ بھی financial advice نہیں، اور کسی آمدنی کا وعدہ نہیں۔ صرف وہی رقم لگائیں جس کا نقصان آپ سہہ سکیں، اور اپنے ملک کے قوانین دیکھیں۔","no":"Trading innebærer risiko, og du kan tape pengene du setter inn. Ingenting her er finansiell rådgivning, og ingen inntekt er lovet. Bruk bare penger du kan tåle å tape, og sjekk reglene der du bor.","hi":"Trading में जोखिम है और आप अपनी लगाई रकम खो सकते हैं। यहाँ कुछ भी financial advice नहीं, और किसी आमदनी का वादा नहीं। केवल वही रकम लगाएँ जिसका नुक़सान आप सह सकें, और अपने देश के नियम देखें।","ar":"في الـ trading خطر، ويمكن أن تخسر المال الذي تودعه. ولا شيء هنا يُعدّ financial advice، ولا وعد بأي دخل. ولا تستخدم إلا مالاً تحتمل خسارته، وراجع القوانين السارية في بلد إقامتك."},"links":{"main":[{"url":"__REF__","primary":true,"en":["Open your account","Through your sponsor's link"],"ur":["اپنا اکاؤنٹ کھولیں","اپنے سپانسر کے لنک سے"],"no":["Åpne kontoen din","Via sponsorens lenke"],"hi":["अपना खाता खोलें","अपने स्पॉन्सर के लिंक से"],"ar":["افتح حسابك","عبر رابط الـ sponsor الخاص بك"]},{"url":"","en":["Weekly call","Sunday, 20:00 Pakistan time"],"ur":["ہفتہ وار کال","اتوار، رات 8 بجے پاکستان کا وقت"],"no":["Ukentlig call","Søndag kl. 20:00 pakistansk tid"],"hi":["साप्ताहिक कॉल","रविवार, रात 8 बजे पाकिस्तान समय"],"ar":["المكالمة الأسبوعية","الأحد، الثامنة مساءً بتوقيت باكستان"]},{"url":"https://instagram.com/aim.pire","en":["Instagram","@aim.pire — what we are up to"],"no":["Instagram","@aim.pire — hva vi driver med"],"hi":["Instagram","@aim.pire — हम क्या कर रहे ["Koble til CopyX","Knytte meglerkontoen din"],"hi":["CopyX जोड़ना","अपना ब्रोकर खाता जोड़ना"],"ar":["ربط CopyX","ربط حساب الـ broker الخاص بك"]},{"url":"","en":["Taking money out","Do this early, with a small amount"],"ur":["رقم نکالنا","یہ شروع میں ہی کر لیں، تھوڑی رقم سے"],"no":["Ta ut penger","Gjør det tidlig, med et lite beløp"],"hi":["पैसे निकालना","यह जल्दी करें, थोड़ी रकम के साथ"],"ar":["سحب المال","افعل هذا مبكراً، وبمبلغ صغير"]}],"docs":[{"url":"https://intercom.help/tag-markets/en/articles/10088332-how-to-change-your-account-password","en":["Changing your password","The broker's own guide, with pictures"],"no":["Bytte passord","Meglerens egen guide, med bilder"],"hi":["अपना password बदलना","Broker की अपनी guide, तस्वीरों के साथ"],"ur":["اپنا password بدلنا","Broker کی اپنی guide، تصاویر کے ساتھ"],"ar":["تغيير الـ password","دليل الـ broker نفسه، بالصور"]},{"url":"","en":["Start here guide","PDF, English"],"ur":["ابتدائی رہنما","پی ڈی ایف، انگریزی"],"no":["Startguide","PDF"],"hi":["शुरुआती गाइड","PDF"],"ar":["دليل البداية","PDF، بالإنجليزية"]},{"url":"","en":["Start here guide","PDF, Urdu"],"ur":["ابتدائی رہنما","پی ڈی ایف، اردو"],"no":["Startguide","PDF"],"hi":["शुरुआती गाइड","PDF"],"ar":["دليل البداية","PDF، بالأردية"]},{"url":"","en":["Pips and lot size","How much one move actually costs you"],"ur":["پپس اور لاٹ سائز","قیمت کی ایک حرکت اصل میں کتنے کی پڑتی ہے"],"no":["Pips og lot size","Hva én bevegelse faktisk koster deg"],"hi":["पिप्स और लॉट साइज़","एक चाल असल में आपको कितनी पड़ती है"],"ar":["الـ pips وحجم الـ lot","كم تكلفك الحركة الواحدة فعلاً"]},{"url":"","en":["Trading psychology","The part nobody wants to read"],"ur":["Trading کی نفسیات","وہ حصہ جو کوئی پڑھنا نہیں چاہتا"],"no":["Trading-psykologi","Delen ingen vil lese"],"hi":["ट्रेडिंग मनोविज्ञान","वह हिस्सा जो कोई पढ़ना नहीं चाहता"],"ar":["نفسية الـ trading","الجزء الذي لا يريد أحد قراءته"]}],"help":[{"url":"","en":["Ask your sponsor","The person who invited you"],"ur":["اپنے سپانسر سے پوچھیں","جس نے آپ کو مدعو کیا"],"no":["Spør sponsoren din","Den som inviterte deg"],"hi":["अपने स्पॉन्सर से पूछें","जिसने आपको आमंत्रित किया"],"ar":["اسأل الـ sponsor الخاص بك","الشخص الذي دعاك"]},{"url":"","en":["Common questions","Answered once, properly"],"ur":["عام سوالات","ایک بار، ٹھیک سے جواب دیے گئے"],"no":["Vanlige spørsmål","Besvart én gang, ordentlig"],"hi":["आम सवाल","एक बार, ठीक से उत्तर दिए गए"],"ar":["أسئلة متكررة","أُجيب عنها مرة واحدة، كما ينبغي"]}]},"guide":{"en":{"lede":"The first five steps take about fifteen minutes, and you need your ID and something showing your address next to you. Then you wait for approval, which is not in your hands. Funding and the rest come after that, whenever suits you. You can stop after any step and come back — the page remembers where you were.","steps":[["Use your sponsor's link","Open the link the person who invited you sent — theirs, not one from a group. At the top of this page there is a line reading “Your sign-up goes to …” ending in six letters and numbers. That code identifies them. If you do not see that line at all, you opened a plain link: the broker will not know who introduced you, and you will not have anyone attached to help. Ask them to send you theirs.",{"check":"The line at the top shows a name, or a domain and six characters. No line at all means no sponsor is attached — go back and open their link."}],["Create your account","Scroll back UP to the big button at the top that says “Open your account” and tap it. It opens CopyX in a new tab — you will see a black COPY-X logo. Use your real name and details: they have to match the ID you upload later. Choose a password you do not use anywhere else. Important: the country box starts on Albania for everyone — change it to where you actually live, because the phone code follows it. Then tick both boxes, wait for the small grey “Verifying…” box at the bottom to finish, and press Sign Up. Tapping it before the check finishes does nothing.",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"Your real name. It must match the ID you upload next, or verification fails."},{"n":2,"x":24,"y":45,"t":"A password you use nowhere else. Not your email password."},{"n":3,"x":9,"y":66,"t":"Tick both. Read them first — they say you can lose money."},{"n":4,"x":50,"y":87,"t":"If you see this yellow box, your link was missing the invite code. Go back and open your sponsor's link instead."},{"n":5,"x":24,"y":56,"t":"This starts on Albania for everyone. Change it — the phone code follows it."}],"check":"You land inside the portal and see your own name, not the sign-up form again."}],["Link your broker account — this step matters","Once you are inside the portal, find the Login to CopyX button and use that to create your Tag Markets account. Do not go to CopyX or the broker and sign up separately: an account made that way is not synchronised, and nothing will track correctly afterwards.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Watch this step"},"note":"The portal says it plainly: register your Tag Markets account exclusively using that button.","img":"assets/shot-copyx-register.jpg","alt":"The CopyX Registration panel in the IB portal","marks":[{"n":1,"x":34,"y":37,"t":"Read this line. It tells you to create the broker account from here, not anywhere else."},{"n":2,"x":13,"y":71,"t":"This is the button. It says Login to CopyX — use it even the first time."},{"n":3,"x":50,"y":90,"t":"The warning in yellow: an account made directly on CopyX will not be linked."}],"check":"The Tag Markets account appears inside the portal. If you had to log in somewhere separately to find it, it is not linked."}],["Verify your identity","You will need your ID card or passport, and something showing your address. Photograph them in good light with all four corners visible. A blurry photo is the main reason people get rejected — not anything serious.",{"img":"assets/shot-kyc.jpg","alt":"The Upload Documents panel","marks":[{"n":1,"x":50,"y":44,"t":"Pick the document type here first. Nothing uploads until you do."},{"n":2,"x":50,"y":75,"t":"This yellow line is normal before you upload. It is not an error."},{"n":3,"x":90,"y":5,"t":"Validate means the broker has not checked your documents yet."}],"check":"The yellow «upload» line is gone and each document shows as submitted. «Validate» still showing means the broker has not looked yet, which is normal."}],["Wait for approval","Verification usually takes a short while. Until it comes through, the broker will not let you add money — you will see this notice on the wallet page. That is normal, not an error.",{"img":"assets/shot-wallet-kyc.jpg","alt":"The wallet page showing that KYC must be completed first","marks":[{"n":1,"x":50,"y":30,"t":"This pink line means verification is still pending. It disappears once your documents are approved."}],"check":"The pink line on the wallet page is gone and the Deposit button is clickable."}],["Put money in","In the portal press Deposit, pick the amount — the minimum is $10 — and choose the crypto you actually hold. The portal then shows you an address, a QR code, a network, and a countdown of about fifteen minutes. Open your own wallet, whether that is Binance, RedotPay or anything else, and send from there. If the countdown runs out before you send, go back and get a fresh address instead of reusing the old one. After you send, the wallet shows a status list: submission successful, pending review, wallet processing, expected to arrive within 24 hours. Seeing «pending» is not a problem. It is the normal state for most of that window.",{"note":"The network must match on both sides. Picking the wrong one does not delay the money, it loses it. They also cost different amounts: sending 25 USDC over Ethereum cost 1.00 USDC in fees — four percent. Arbitrum, Polygon, Solana and BNB Smart Chain were all listed as faster. Check the cost before you pick.","check":"The amount shows in your wallet balance. If it does not arrive, check the transaction in your OWN wallet first — the portal cannot show what never reached it."}],["Connect to Sonic copy trading","This is the step that actually starts the copying. Until you do it, money can sit in the account and nothing will trade. Go to Tag Markets, open CopyX from the menu, press Details, choose SONIC, and press Connect. Then four fields: the amount you want to start with (minimum $10), the account type, and the community token — type #Aitech and press Verify. A Hash field appears after that: enter 000000. Press Submit, then Join to Copytrade.",{"note":"Account type: AMPLIFY multiplies the size of every position, up to 24 times. It multiplies the losses by exactly the same amount as the gains. If this is your first account, start without it.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"The strategy shows as connected and the amount you entered appears under it. If it says $0, the Submit did not go through."}],["See your account in MetaTrader 5","This is where you watch the account day to day. Install MetaTrader 5, then open the portal and find MT5 Credentials — it gives you an account number, a Master Password and an Investor Password. In the app choose to add an existing account, search for T.M. Financials Ltd, and pick the server TMFinancials-Server. Your login is the account number. After that you will see Balance, Equity and Free Margin.",{"note":"The Master Password can place trades on your account. The Investor Password can only look. Never send anyone your Master Password — not a leader, not support, not anyone who asks for it. If you want someone to check your results, give them the Investor Password instead.","apps":{"lede":"Install MetaTrader 5 for your phone:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance, Equity and Free Margin in the app show the same number as the portal. Different numbers mean you logged into the wrong account."}],["Join the group","That is where questions get answered — nobody there started out knowing anything either. When you fund the account later, it is worth starting small.",{"apps":{"lede":"Install Element X — that exact app, not Element Classic and not another chat app. Make an account, any username. Then come back here and tap Join the group.","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Join the Aimpire group"},"check":"You can read messages in the room, not just see its name."}]]},"ur":{"lede":"پہلے پانچ steps میں تقریباً پندرہ منٹ لگتے ہیں، اور آپ کے پاس اپنا ID اور پتہ دکھانے والی کوئی دستاویز ہونی چاہیے۔ پھر approval کا انتظار، جو آپ کے ہاتھ میں نہیں۔ پیسے ڈالنا اور باقی سب اُس کے بعد، جب آپ کو مناسب لگے۔ آپ کسی بھی step کے بعد رک کر واپس آ سکتے ہیں — صفحہ یاد رکھتا ہے آپ کہاں تھے۔","steps":[["اپنے سپانسر کا لنک استعمال کریں","وہی link کھولیں جو آپ کو بلانے والے نے بھیجا ہے — اُن کا اپنا link، کسی group میں پڑا ہوا نہیں۔ اس صفحے کے اوپر ایک سطر ہے — «آپ کی رجسٹریشن جائے گی …» — جو چھ حروف اور نمبروں پر ختم ہوتی ہے۔ اسی code سے پتہ چلتا ہے کہ آپ کو کون لایا ہے۔ اگر وہ سطر نظر ہی نہ آئے تو آپ نے بغیر code والا link کھولا ہے اور رجسٹریشن کسی کے نام نہیں لگے گی — اُن سے اُن کا link مانگ لیں۔",{"check":"اوپر والی لائن میں نام نظر آئے، یا domain اور چھ حروف۔ لائن بالکل نہ ہو تو کوئی sponsor منسلک نہیں — واپس جا کر اُن کا link کھولیں۔"}],["اپنا اکاؤنٹ بنائیں","اوپر scroll کر کے سب سے اوپر والے بڑے button “Open your account” پر جائیں اور دبائیں۔ یہ CopyX کو نئے tab میں کھولتا ہے — آپ کو کالا COPY-X لوگو نظر آئے گا۔ اصل نام اور معلومات دیں: یہ اُس شناختی کارڈ سے ملنی چاہیے جو آپ بعد میں اپ لوڈ کریں گے۔ ایسا password چنیں جو کہیں اور استعمال نہ کرتے ہوں۔ اہم: country کا خانہ سب کے لیے Albania پر رہتا ہے — اسے اپنے اصل ملک پر بدلیں، کیونکہ phone کا code اسی سے آتا ہے۔ پھر دونوں boxes پر نشان لگائیں، نیچے کی چھوٹی سرمئی “Verifying…” box مکمل ہونے دیں، اور Sign Up دبائیں۔ جانچ مکمل ہونے سے پہلے دبانے پر کچھ نہیں ہوتا۔",{"img":"assets/shot-register.jpg","alt":"CopyX کا سائن اپ فارم","marks":[{"n":1,"x":24,"y":32,"t":"اپنا اصل نام۔ یہ اُس شناختی کارڈ سے ملنا چاہیے جو آگے اپ لوڈ کریں گے، ورنہ تصدیق ناکام ہوگی۔"},{"n":2,"x":24,"y":45,"t":"ایسا پاس ورڈ جو آپ کہیں اور استعمال نہیں کرتے۔ ای میل کا پاس ورڈ نہیں۔"},{"n":3,"x":9,"y":66,"t":"دونوں پر نشان لگائیں۔ پہلے پڑھیں — ان میں لکھا ہے کہ آپ رقم کھو سکتے ہیں۔"},{"n":4,"x":50,"y":87,"t":"یہ پیلا box نظر آئے تو آپ کے link میں invite code نہیں تھا۔ واپس جا کر اپنے sponsor کا link کھولیں۔"},{"n":5,"x":24,"y":56,"t":"یہ سب کے لیے Albania پر رہتا ہے۔ اسے بدلیں — phone کا code اسی سے آتا ہے۔"}],"check":"آپ portal کے اندر پہنچتے ہیں اور اپنا نام دیکھتے ہیں، دوبارہ sign-up form نہیں۔"}],["اپنا بروکر اکاؤنٹ منسلک کریں — یہ مرحلہ اہم ہے","IB Portal میں login کرنے کے بعد Login to CopyX کا بٹن تلاش کریں اور اسی سے اپنا Tag Markets اکاؤنٹ بنائیں۔ CopyX یا broker پر جا کر الگ سے sign up نہ کریں: اس طرح بنایا گیا اکاؤنٹ آپ کے portal سے نہیں جُڑتا، اور بعد میں آپ کا کوئی حساب ٹھیک نہیں چلے گا۔",{"note":"پورٹل خود صاف لکھتا ہے: اپنا Tag Markets اکاؤنٹ صرف اُسی بٹن سے بنائیں۔","soon":"اردو ویڈیو ابھی تیار کی جا رہی ہے۔ تب تک کوئی بات سمجھ نہ آئے تو اپنے سپانسر سے پوچھ لیں — وہ اسی لیے ہیں۔","img":"assets/shot-copyx-register.jpg","alt":"IB Portal میں CopyX رجسٹریشن پینل","marks":[{"n":1,"x":34,"y":37,"t":"یہ سطر پڑھیں۔ یہ بتاتی ہے کہ بروکر اکاؤنٹ یہیں سے بنانا ہے، کہیں اور سے نہیں۔"},{"n":2,"x":13,"y":71,"t":"یہی بٹن ہے۔ اس پر Login to CopyX لکھا ہے — پہلی بار بھی یہی استعمال کریں۔"},{"n":3,"x":50,"y":90,"t":"پیلی تنبیہ: سیدھا CopyX پر بنایا گیا اکاؤنٹ منسلک نہیں ہوگا۔"}],"check":"Tag Markets account portal کے اندر نظر آتا ہے۔ اگر اُسے ڈھونڈنے کے لیے کہیں الگ سے login کرنا پڑا، تو وہ جڑا ہوا نہیں۔"}],["اپنی شناخت کی تصدیق کریں","آپ کو شناختی کارڈ یا پاسپورٹ چاہیے، اور پتے کا کوئی ثبوت۔ اچھی روشنی میں تصویر لیں، چاروں کونے نظر آئیں۔ دھندلی تصویر ہی سب سے بڑی وجہ ہے جس سے درخواست مسترد ہوتی ہے — کوئی سنگین بات نہیں۔",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents پینل","marks":[{"n":1,"x":50,"y":44,"t":"پہلے یہاں دستاویز کی قسم چنیں۔ اس سے پہلے کچھ اپ لوڈ نہیں ہوگا۔"},{"n":2,"x":50,"y":75,"t":"اپ لوڈ سے پہلے یہ پیلی سطر معمول کی بات ہے۔ یہ خرابی نہیں۔"},{"n":3,"x":90,"y":5,"t":"Validate کا مطلب ہے بروکر نے ابھی آپ کی دستاویزات نہیں دیکھیں۔"}],"check":"پیلی «upload» لائن چلی گئی اور ہر document جمع شدہ دکھتا ہے۔ «Validate» اب بھی نظر آئے تو broker نے ابھی دیکھا نہیں — یہ معمول ہے۔"}],["منظوری کا انتظار کریں","تصدیق میں عموماً تھوڑا وقت لگتا ہے۔ جب تک یہ مکمل نہ ہو، broker آپ کو رقم ڈالنے نہیں دے گا — wallet صفحے پر آپ کو یہ اطلاع نظر آئے گی۔ یہ معمول کی بات ہے، کوئی خرابی نہیں۔",{"img":"assets/shot-wallet-kyc.jpg","alt":"wallet صفحہ جو بتاتا ہے کہ پہلے KYC مکمل کرنا ہے","marks":[{"n":1,"x":50,"y":30,"t":"یہ گلابی سطر بتاتی ہے کہ تصدیق ابھی باقی ہے۔ دستاویزات منظور ہوتے ہی یہ ہٹ جاتی ہے۔"}],"check":"Wallet page کی گلابی لائن چلی گئی اور Deposit کا بٹن دب سکتا ہے۔"}],["پیسے جمع کریں","Portal میں Deposit دبائیں، رقم چنیں — کم سے کم $10 — اور وہی crypto چنیں جو واقعی آپ کے پاس ہے۔ اس کے بعد portal آپ کو ایک address، ایک QR code، ایک network اور تقریباً پندرہ منٹ کا countdown دکھاتا ہے۔ اپنا wallet کھولیں، چاہے وہ Binance ہو، RedotPay ہو یا کوئی اور، اور وہیں سے بھیجیں۔ بھیجنے سے پہلے countdown ختم ہو جائے تو پرانا address دوبارہ استعمال نہ کریں، نیا لے لیں۔ بھیجنے کے بعد wallet ایک status فہرست دکھاتا ہے: submission successful، pending review، wallet processing، 24 گھنٹوں کے اندر پہنچنے کی توقع۔ «pending» نظر آنا کوئی مسئلہ نہیں۔ اُس پورے وقت کا بیشتر حصہ یہی معمول کی حالت ہے۔",{"note":"Network دونوں طرف ایک ہی ہونا چاہیے۔ غلط چننے پر پیسہ دیر سے نہیں آتا — وہ چلا جاتا ہے۔ ان کی قیمت بھی الگ ہے: Ethereum سے 25 USDC بھیجنے پر 1.00 USDC fee لگی، یعنی چار فیصد۔ Arbitrum، Polygon، Solana اور BNB Smart Chain سب تیز بتائے گئے تھے۔ چننے سے پہلے قیمت دیکھ لیں۔","check":"رقم آپ کے wallet balance میں نظر آتی ہے۔ نہ پہنچے تو پہلے اپنے ہی wallet میں transaction دیکھیں — portal وہ نہیں دکھا سکتا جو اُس تک پہنچا ہی نہیں۔"}],["سونِک (SONIC) کاپی ٹریڈنگ سے منسلک ہوں","یہی وہ مرحلہ ہے جو اصل میں کاپی ٹریڈنگ شروع کرتا ہے۔ اس سے پہلے رقم اکاؤنٹ میں پڑی رہ سکتی ہے اور کوئی ٹریڈ نہیں ہوگی۔ Tagmarkets.com پر جائیں، مینو سے CopyX منتخب کریں، details پر کلک کر کے SONIC کا انتخاب کریں، اور CONNECT پر کلک کریں۔ پھر چار خانے: سرمایہ کاری کی رقم (کم از کم $10)، اکاؤنٹ کی قسم، اور کمیونٹی ٹوکن — ڈراپ ڈاؤن کھول کر #Aitech درج کریں اور VERIFY پر کلک کریں۔ اس کے بعد Hash کا خانہ ظاہر ہوگا، وہاں 000000 درج کریں۔ SUBMIT پر کلک کریں، پھر JOIN TO COPYTRADE پر۔",{"note":"اکاؤنٹ کی قسم: AMPLIFY ہر پوزیشن کا سائز 24 گنا تک بڑھاتا ہے۔ یہ نقصان کو بھی بالکل اتنا ہی بڑھاتا ہے جتنا نفع کو۔ اگر یہ آپ کا پہلا اکاؤنٹ ہے تو اس کے بغیر شروع کریں۔","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"Strategy connected دکھتی ہے اور آپ کی ڈالی ہوئی رقم اُس کے نیچے آتی ہے۔ $0 دکھے تو Submit گیا نہیں۔"}],["اپنا account MetaTrader 5 میں دیکھیں","روزمرہ میں account یہیں سے دیکھا جاتا ہے۔ MetaTrader 5 install کریں، پھر portal کھول کر MT5 Credentials تلاش کریں — وہاں ایک account number، ایک Master Password اور ایک Investor Password ملتا ہے۔ App میں موجودہ account شامل کرنا چنیں، T.M. Financials Ltd تلاش کریں اور server TMFinancials-Server منتخب کریں۔ Login وہی account number ہے۔ اس کے بعد آپ کو Balance، Equity اور Free Margin نظر آئیں گے۔",{"note":"Master Password سے آپ کے account پر trade ہو سکتی ہے۔ Investor Password سے صرف دیکھا جا سکتا ہے۔ اپنا Master Password کسی کو نہ بھیجیں — نہ کسی leader کو، نہ support کو، نہ اُسے جو مانگے۔ کوئی آپ کے نتائج دیکھنا چاہے تو اُسے Investor Password دے دیں۔","apps":{"lede":"اپنے phone کے لیے MetaTrader 5 install کریں:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"App میں Balance، Equity اور Free Margin وہی عدد دکھائیں جو portal میں ہے۔ مختلف عدد کا مطلب ہے آپ غلط account میں داخل ہوئے ہیں۔"}],["گروپ میں شامل ہوں","سوالات کے جواب وہیں ملتے ہیں — وہاں بھی ہر کوئی صفر سے شروع ہوا تھا۔ بعد میں جب آپ account میں پیسے ڈالیں تو تھوڑی رقم سے شروع کرنا ہی سمجھداری ہے۔",{"apps":{"lede":"Element X install کریں — بالکل یہی app، Element Classic نہیں اور کوئی اور chat app نہیں۔ ایک account بنائیں، username کچھ بھی ہو سکتا ہے۔ پھر یہاں واپس آ کر «گروپ میں شامل ہوں» دبائیں۔","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Aimpire گروپ میں شامل ہوں"},"check":"آپ room میں پیغامات پڑھ سکتے ہیں، صرف اُس کا نام نہیں دیکھتے۔"}]]},"no":{"lede":"De fem første stegene tar rundt et kvarter, og du trenger ID-en din og noe som viser adressen din liggende klart. Så venter du på godkjenning, og det er ikke i dine hender. Innskudd og resten kommer etterpå, når det passer deg. Du kan stoppe etter hvert steg og komme tilbake — siden husker hvor du var.","steps":[["Bruk sponsorens lenke","Åpne lenken fra den som inviterte deg — deres, ikke en fra en gruppe. Øverst på siden står en linje som sier «Registreringen din går til …» og ender med seks tegn. Den koden identifiserer dem. Ser du ikke den linjen i det hele tatt, åpnet du en bar lenke og ingen blir kreditert — be dem sende sin egen.",{"check":"Linja øverst viser et navn, eller et domene og seks tegn. Ingen linje i det hele tatt betyr at ingen sponsor er knyttet til — gå tilbake og åpne lenka deres."}],["Opprett kontoen","Scroll OPP igjen til den store knappen øverst, «Åpne kontoen din», og trykk på den. Den åpner CopyX i en ny fane — du ser en sort COPY-X-logo. Bruk ekte navn og opplysninger: de må stemme med ID-en du laster opp senere. Velg et passord du ikke bruker noe annet sted. Viktig: landfeltet står på Albania for alle — endre det til der du faktisk bor, for landkoden på telefonen følger med. Kryss så av begge boksene, vent til den lille grå «Verifying…»-boksen nederst er ferdig, og trykk Sign Up. Trykker du før sjekken er ferdig, skjer ingenting.",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"Ditt ekte navn. Det må stemme med ID-en du laster opp etterpå, ellers går ikke verifiseringen gjennom."},{"n":2,"x":24,"y":45,"t":"Et passord du ikke bruker noe annet sted. Ikke e-postpassordet ditt."},{"n":3,"x":9,"y":66,"t":"Huk av begge. Les dem først — de sier at du kan tape penger."},{"n":4,"x":50,"y":87,"t":"Ser du denne gule boksen, manglet lenken invitasjonskoden. Gå tilbake og åpne sponsorens lenke i stedet."},{"n":5,"x":24,"y":56,"t":"Denne står på Albania for alle. Endre den — landkoden på telefonen følger med."}],"check":"Du havner inne i portalen og ser ditt eget navn, ikke registreringsskjemaet på nytt."}],["Koble meglerkontoen — dette steget er viktig","Når du er inne i portalen, finn knappen Login to CopyX og bruk den til å opprette Tag Markets-kontoen. Ikke gå til CopyX eller megleren og registrer deg separat: en konto laget slik blir ikke synkronisert, og ingenting spores riktig etterpå.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Se dette steget (på engelsk)"},"note":"Portalen sier det rett ut: opprett Tag Markets-kontoen kun med den knappen.","img":"assets/shot-copyx-register.jpg","alt":"CopyX Registration-panelet i IB-portalen","marks":[{"n":1,"x":34,"y":37,"t":"Les denne linjen. Den sier at meglerkontoen opprettes herfra, ikke andre steder."},{"n":2,"x":13,"y":71,"t":"Dette er knappen. Den heter Login to CopyX — bruk den også første gang."},{"n":3,"x":50,"y":90,"t":"Advarselen i gult: en konto laget direkte på CopyX blir ikke koblet."}],"check":"Tag Markets-kontoen dukker opp inne i portalen. Måtte du logge inn et annet sted for å finne den, er den ikke koblet."}],["Bekreft identiteten din","Du trenger ID-kort eller pass, og noe som viser adressen din. Fotografer dem i godt lys med alle fire hjørner synlige. Uskarpt bilde er den vanligste grunnen til avslag — ikke noe alvorlig.",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents-panelet","marks":[{"n":1,"x":50,"y":44,"t":"Velg dokumenttype her først. Ingenting lastes opp før du har gjort det."},{"n":2,"x":50,"y":75,"t":"Den gule linjen er normal før du laster opp. Det er ikke en feil."},{"n":3,"x":90,"y":5,"t":"Validate betyr at megleren ennå ikke har sjekket dokumentene dine."}],"check":"Den gule «last opp»-linja er borte og hvert dokument står som innsendt. Står «Validate» fortsatt, har ikke megleren sett på det ennå — det er normalt."}],["Vent på godkjenning","Bekreftelsen tar vanligvis litt tid. Fram til den er på plass lar ikke megleren deg sette inn penger — du ser denne meldingen på wallet-siden. Det er normalt, ikke en feil.",{"img":"assets/shot-wallet-kyc.jpg","alt":"Wallet-siden som viser at KYC må fullføres først","marks":[{"n":1,"x":50,"y":30,"t":"Den rosa linjen betyr at bekreftelsen fortsatt pågår. Den forsvinner når dokumentene er godkjent."}],"check":"Den rosa linja på wallet-siden er borte og Deposit-knappen kan trykkes."}],["Sett inn penger","Trykk Deposit i portalen, velg beløpet — minimum er $10 — og velg den kryptoen du faktisk har. Portalen viser deg så en adresse, en QR-kode, et nettverk og en nedtelling på rundt femten minutter. Åpne din egen lommebok, enten det er Binance, RedotPay eller noe annet, og send derfra. Går nedtellingen ut før du rekker å sende, hent en ny adresse i stedet for å bruke den gamle om igjen. Etter at du har sendt, viser lommeboka en statusliste: innsendt, til gjennomgang, under behandling, forventet framme innen 24 timer. Å se «pending» er ikke et problem. Det er den normale tilstanden gjennom mesteparten av det vinduet.",{"note":"Nettverket må være det samme på begge sider. Velger du feil, blir ikke pengene forsinket — de er borte. De koster også ulikt: å sende 25 USDC over Ethereum kostet 1,00 USDC i gebyr, altså fire prosent. Arbitrum, Polygon, Solana og BNB Smart Chain sto alle oppført som raskere. Sjekk prisen før du velger.","check":"Beløpet vises i wallet-saldoen. Kommer det ikke fram, sjekk transaksjonen i DIN EGEN lommebok først — portalen kan ikke vise noe som aldri nådde fram til den."}],["Koble til Sonic copy trading","Det er dette steget som faktisk starter kopieringen. Før du gjør det, kan pengene stå på kontoen uten at noe som helst handles. Gå til Tag Markets, åpne CopyX fra menyen, trykk Details, velg SONIC og trykk Connect. Så fire felter: beløpet du vil starte med (minimum $10), kontotypen, og community-token — skriv #Aitech og trykk Verify. Da dukker det opp et Hash-felt: skriv 000000. Trykk Submit, og deretter Join to Copytrade.",{"note":"Kontotype: AMPLIFY ganger størrelsen på hver posisjon, opptil 24 ganger. Den ganger tapet nøyaktig like mye som gevinsten. Er dette din første konto, start uten.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"Strategien står som tilkoblet, og beløpet du skrev inn vises under den. Står det $0, gikk ikke Submit gjennom."}],["Se kontoen din i MetaTrader 5","Det er her du følger kontoen fra dag til dag. Installer MetaTrader 5, åpne så portalen og finn MT5 Credentials — der får du et kontonummer, et Master Password og et Investor Password. I appen velger du å legge til en eksisterende konto, søker opp T.M. Financials Ltd og velger serveren TMFinancials-Server. Innloggingen er kontonummeret. Etterpå ser du Balance, Equity og Free Margin.",{"note":"Master Password kan handle på kontoen din. Investor Password kan bare se. Send aldri Master Password til noen — ikke til en leder, ikke til support, ikke til noen som ber om det. Vil du at noen skal se på resultatene dine, gi dem Investor Password i stedet.","apps":{"lede":"Installer MetaTrader 5 til telefonen din:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance, Equity og Free Margin i appen viser samme tall som portalen. Ulike tall betyr at du logget inn på feil konto."}],["Bli med i gruppa","Det er der spørsmål blir besvart — ingen der startet med å kunne noe heller. Når du senere setter inn penger, er det lurt å starte med et lite beløp.",{"apps":{"lede":"Installer Element X — akkurat den appen, ikke Element Classic og ikke en annen chat-app. Lag en konto, brukernavnet kan være hva som helst. Kom så tilbake hit og trykk «Bli med i gruppa».","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Bli med i Aimpire-gruppa"},"check":"Du kan lese meldinger i rommet, ikke bare se navnet på det."}]]},"hi":{"lede":"पहले पाँच steps में क़रीब पंद्रह मिनट लगते हैं, और आपके पास अपना ID और पता दिखाने वाला कोई document होना चाहिए। फिर approval का इंतज़ार, जो आपके हाथ में नहीं। पैसे डालना और बाक़ी सब उसके बाद, जब आपको ठीक लगे। आप किसी भी step के बाद रुककर लौट सकते हैं — page याद रखता है आप कहाँ थे।","steps":[["अपने स्पॉन्सर का लिंक इस्तेमाल करें","वही link खोलें जो आपको आमंत्रित करने वाले ने भेजा — उन्हीं का, किसी group का नहीं। इस पेज के ऊपर एक पंक्ति है जो छह अक्षर-अंकों पर ख़त्म होती है। वही code उन्हें पहचानता है। अगर वह पंक्ति दिखे ही नहीं, तो आपने सादा link खोला है और किसी को श्रेय नहीं मिलेगा — उनसे उनका link माँगें।",{"check":"ऊपर वाली लाइन में नाम दिखे, या domain और छह अक्षर। लाइन बिलकुल न हो तो कोई sponsor जुड़ा नहीं — वापस जाकर उनका link खोलें।"}],["अपना खाता बनाएँ","ऊपर scroll करके सबसे ऊपर वाले बड़े button “Open your account” पर जाएँ और दबाएँ। यह CopyX को नए tab में खोलता है — आपको काला COPY-X logo दिखेगा। असली नाम और जानकारी दें: यह उस पहचान पत्र से मेल खानी चाहिए जो आप बाद में अपलोड करेंगे। ऐसा password चुनें जो कहीं और इस्तेमाल न करते हों। ज़रूरी: country का box सबके लिए Albania पर रहता है — इसे अपने असली देश पर बदलें, क्योंकि phone का code उसी से आता है। फिर दोनों boxes पर निशान लगाएँ, नीचे की छोटी ग्रे “Verifying…” box पूरी होने दें, और Sign Up दबाएँ। जाँच पूरी होने से पहले दबाने पर कुछ नहीं होता।",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"आपका असली नाम। यह उस ID से मेल खाना चाहिए जो आप आगे अपलोड करेंगे, वरना verification पूरा नहीं होगा।"},{"n":2,"x":24,"y":45,"t":"ऐसा password जो आप कहीं और इस्तेमाल न करते हों। अपने email का password नहीं।"},{"n":3,"x":9,"y":66,"t":"दोनों पर टिक करें। पहले पढ़ें — उनमें लिखा है कि आप पैसे खो सकते हैं।"},{"n":4,"x":50,"y":87,"t":"यह पीला box दिखे तो आपके link में invite code नहीं था। वापस जाकर अपने sponsor का link खोलें।"},{"n":5,"x":24,"y":56,"t":"यह सबके लिए Albania पर रहता है। इसे बदलें — phone का code इसी से आता है।"}],"check":"आप portal के अंदर पहुँचते हैं और अपना नाम देखते हैं, दोबारा sign-up form नहीं।"}],["अपना ब्रोकर खाता जोड़ें — यह चरण महत्वपूर्ण है","पोर्टल में पहुँचने के बाद Login to CopyX बटन ढूँढें और उसी से अपना Tag Markets खाता बनाएँ। CopyX या ब्रोकर पर जाकर अलग से साइन अप न करें: इस तरह बना खाता सिंक नहीं होता, और बाद में कुछ भी सही दर्ज नहीं होगा।",{"video":{"url":"https://drive.google.com/file/d/1yvnfW9R7T930XvONOniniyG01_NZ8oV3/view","label":"यह चरण देखें"},"note":"पोर्टल साफ़ कहता है: अपना Tag Markets खाता केवल उसी बटन से बनाएँ।","img":"assets/shot-copyx-register.jpg","alt":"IB Portal में CopyX Registration पैनल","marks":[{"n":1,"x":34,"y":37,"t":"यह पंक्ति पढ़ें। यह बताती है कि ब्रोकर खाता यहीं से बनाना है, कहीं और से नहीं।"},{"n":2,"x":13,"y":71,"t":"यही बटन है। इस पर Login to CopyX लिखा है — पहली बार भी यही इस्तेमाल करें।"},{"n":3,"x":50,"y":90,"t":"पीली चेतावनी: सीधे CopyX पर बनाया खाता जुड़ेगा नहीं।"}],"check":"Tag Markets account portal के अंदर दिखता है। अगर उसे ढूँढने के लिए कहीं अलग से login करना पड़ा, तो वह जुड़ा नहीं है।"}],["अपनी पहचान सत्यापित करें","आपको पहचान पत्र या पासपोर्ट चाहिए, और पते का कोई प्रमाण। अच्छी रोशनी में तस्वीर लें, चारों कोने दिखें। धुँधली तस्वीर ही अस्वीकृति का सबसे बड़ा कारण है — कोई गंभीर बात नहीं।",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents पैनल","marks":[{"n":1,"x":50,"y":44,"t":"पहले यहाँ दस्तावेज़ का प्रकार चुनें। उससे पहले कुछ अपलोड नहीं होगा।"},{"n":2,"x":50,"y":75,"t":"अपलोड से पहले यह पीली पंक्ति सामान्य है। यह त्रुटि नहीं है।"},{"n":3,"x":90,"y":5,"t":"Validate का मतलब है ब्रोकर ने अभी आपके दस्तावेज़ जाँचे नहीं।"}],"check":"पीली «upload» लाइन चली गई और हर document जमा दिखता है। «Validate» अब भी दिखे तो broker ने अभी देखा नहीं — यह सामान्य है।"}],["मंज़ूरी का इंतज़ार करें","सत्यापन में आमतौर पर थोड़ा समय लगता है। जब तक यह पूरा न हो, broker आपको पैसे डालने नहीं देगा — wallet पेज पर आपको यह सूचना दिखेगी। यह सामान्य है, कोई त्रुटि नहीं।",{"img":"assets/shot-wallet-kyc.jpg","alt":"wallet पेज जो दिखाता है कि पहले KYC पूरा करना है","marks":[{"n":1,"x":50,"y":30,"t":"यह गुलाबी पंक्ति बताती है कि सत्यापन अभी बाक़ी है। दस्तावेज़ मंज़ूर होते ही यह हट जाती है।"}],"check":"Wallet page की गुलाबी लाइन चली गई और Deposit button दब सकता है।"}],["पैसे डालें","Portal में Deposit दबाएँ, रकम चुनें — कम से कम $10 — और वही crypto चुनें जो आपके पास है। Portal फिर एक address, एक QR code, एक network और करीब पंद्रह मिनट का countdown दिखाता है। अपना wallet खोलें, चाहे वह Binance हो, RedotPay हो या कोई और, और वहीं से भेजें। भेजने से पहले countdown ख़त्म हो जाए तो पुराना address दोबारा इस्तेमाल न करें, नया लें। भेजने के बाद wallet एक status सूची दिखाता है: submission successful, pending review, wallet processing, 24 घंटे के भीतर पहुँचने की उम्मीद। «pending» दिखना कोई समस्या नहीं। उस पूरे समय का अधिकांश हिस्सा यही सामान्य स्थिति है।",{"note":"Network दोनों तरफ़ एक ही होना चाहिए। ग़लत चुनने पर पैसा देर से नहीं आता — वह चला जाता है। उनकी क़ीमत भी अलग है: Ethereum से 25 USDC भेजने पर 1.00 USDC fee लगी, यानी चार प्रतिशत। Arbitrum, Polygon, Solana और BNB Smart Chain सब तेज़ बताए गए थे। चुनने से पहले क़ीमत देखें।","check":"रकम आपके wallet balance में दिखती है। न पहुँचे तो पहले अपने ही wallet में transaction देखें — portal वह नहीं दिखा सकता जो उस तक पहुँचा ही नहीं।"}],["Sonic copy trading से जुड़ें","यही वह step है जो असल में copying शुरू करता है। इससे पहले पैसा account में पड़ा रह सकता है और कोई trade नहीं होगी। Tag Markets पर जाएँ, menu से CopyX खोलें, Details दबाएँ, SONIC चुनें, और Connect दबाएँ। फिर चार खाने: जितने से शुरू करना है वह रकम (कम से कम $10), account type, और community token — #Aitech लिखें और Verify दबाएँ। उसके बाद Hash का खाना आएगा, उसमें 000000 लिखें। Submit दबाएँ, फिर Join to Copytrade।",{"note":"Account type: AMPLIFY हर position का size 24 गुना तक बढ़ाता है। यह नुकसान को भी ठीक उतना ही बढ़ाता है जितना फ़ायदे को। अगर यह आपका पहला account है तो इसके बिना शुरू करें।","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"Strategy connected दिखती है और आपकी डाली रकम उसके नीचे आती है। $0 दिखे तो Submit गया नहीं।"}],["अपना account MetaTrader 5 में देखें","रोज़मर्रा में account यहीं से देखा जाता है। MetaTrader 5 install करें, फिर portal खोलकर MT5 Credentials ढूँढें — वहाँ account number, एक Master Password और एक Investor Password मिलता है। App में existing account जोड़ना चुनें, T.M. Financials Ltd खोजें और server TMFinancials-Server चुनें। Login वही account number है। उसके बाद आपको Balance, Equity और Free Margin दिखेंगे।",{"note":"Master Password से आपके account पर trade की जा सकती है। Investor Password से सिर्फ़ देखा जा सकता है। अपना Master Password किसी को न भेजें — न किसी leader को, न support को, न किसी को जो माँगे। कोई आपके नतीजे देखना चाहे तो उसे Investor Password दें।","apps":{"lede":"अपने phone के लिए MetaTrader 5 install करें:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"App में Balance, Equity और Free Margin वही संख्या दिखाएँ जो portal में है। अलग संख्या मतलब आप ग़लत account में घुसे हैं।"}],["ग्रुप में शामिल हों","सवालों के जवाब वहीं मिलते हैं — वहाँ भी कोई सब कुछ जानते हुए शुरू नहीं हुआ था। बाद में जब आप account में पैसे डालें, तो थोड़ी रकम से शुरू करना समझदारी है।",{"apps":{"lede":"Element X install करें — बिलकुल यही app, Element Classic नहीं और कोई दूसरा chat app नहीं। एक account बनाएँ, username कुछ भी चल जाएगा। फिर यहाँ वापस आकर «ग्रुप में शामिल हों» दबाएँ।","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Aimpire ग्रुप में शामिल हों"},"check":"आप room में messages पढ़ सकते हैं, सिर्फ़ उसका नाम नहीं देखते।"}]]},"ar":{"lede":"تأخذ الخطوات الخمس الأولى نحو خمس عشرة دقيقة، وتحتاج هويتك ومستنداً يُظهر عنوانك بجانبك. ثم تنتظر الموافقة، وهي ليست بيدك. أما الإيداع وبقية الخطوات فتأتي بعد ذلك، متى ناسبك. ويمكنك التوقف بعد أي خطوة والعودة — فالصفحة تتذكّر أين كنت.","steps":[["استخدم رابط الـ sponsor الخاص بك","افتح الرابط الذي أرسله لك الشخص الذي دعاك — رابطه هو، لا رابطاً منشوراً في مجموعة. في أعلى هذه الصفحة سطرٌ يقول «تسجيلك يُحسب لـ …» وينتهي برمز من ستة أحرف وأرقام، وهذا الرمز يدلّ عليه. وإن لم تَرَ ذلك السطر إطلاقاً، فقد فتحت رابطاً عادياً ولن يُحسب التسجيل لأحد — اطلب منه أن يرسل لك رابطه.",{"check":"يظهر في السطر الأعلى اسم، أو نطاق وستة أحرف. وغياب السطر تماماً يعني ألّا sponsor مرتبط — ارجع وافتح رابطه."}],["أنشئ حسابك","مرّر إلى أعلى الصفحة واضغط الزر الكبير في الأعلى المكتوب عليه «افتح حسابك». يفتح CopyX في تبويب جديد — وسترى شعار COPY-X الأسود. استخدم اسمك وبياناتك الحقيقية: يجب أن تطابق الهوية التي ترفعها لاحقاً. اختر password لا تستخدمه في أي مكان آخر. مهم:
