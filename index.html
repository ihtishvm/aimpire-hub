<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aimpire</title>
<meta name="description" content="Open your account in about two minutes. English, Norsk, हिन्दी, اردو.">

<meta property="og:type" content="website">
<meta property="og:title" content="Aimpire">
<meta property="og:description" content="Open your account in about two minutes. English, Norsk, हिन्दी, اردو.">

<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/ap-gradient.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* Aimpire's own palette, from "Presentation - Aimpire" — the only deck
   without a partner layered on top. Navy, gold, lime, logo gradient. */
:root{
  --ink:#0B2341; --ink-deep:#071A31; --ink-raise:#123055;
  --gold:#E8B84B; --gold-soft:#F3CE78; --gold-deep:#C99A2E;
  --lime:#A8D44A; --red:#E0483C;
  --chalk:#F5F3EF; --chalk-dim:#9DB0C9; --rule:#1E3D66;
  --v1:#E8B84B; --v2:#4EA8DE; --v3:#A8D44A; --v4:#E8833A;
  --grad:linear-gradient(118deg,#1B4FD8 0%,#15D8C4 33%,#C21FBF 68%,#FBE16B 100%);
  --measure:36rem;
  --face:"Montserrat",system-ui,-apple-system,sans-serif;
}
:root[data-theme="light"]{
  --ink:#F5F3EF; --ink-deep:#E7E3DB; --ink-raise:#FFFFFF;
  --chalk:#0B2341; --chalk-dim:#5A7093; --rule:#D3D8E2; --gold-soft:#8A6410;
}
html[data-font="deva"]{ --face:"Noto Sans Devanagari","Montserrat",sans-serif }
html[data-font="nastaliq"]{ --face:"Noto Nastaliq Urdu","Montserrat",serif }
html[data-font="naskh"]{ --face:"Noto Naskh Arabic","Montserrat",serif }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--face);
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[data-font="nastaliq"] body{line-height:2.15}
html[data-font="naskh"] body{line-height:1.9}
html[data-font="deva"] body{line-height:1.8}
.shell{max-width:46rem;margin:0 auto;padding:0 clamp(18px,5vw,40px) 72px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
[hidden]{display:none !important}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:26px 0 0;border-bottom:1px solid var(--rule)}
.wordmark{display:flex;align-items:center;gap:11px;padding-bottom:12px}
.mono{width:40px;height:40px;flex:0 0 auto;display:block}
.wordmark .wm{display:block;font-family:"Montserrat",sans-serif;font-weight:800;font-size:17px;
  letter-spacing:.13em;text-transform:uppercase;line-height:1}
.wordmark .wm em{font-style:normal;color:var(--gold)}
.wordmark .tag{display:block;margin-top:4px;font-size:9px;letter-spacing:.32em;color:var(--lime);
  font-weight:700;font-family:"Montserrat",sans-serif;text-transform:uppercase}
.switch{display:flex;gap:2px;padding-bottom:8px;flex-wrap:wrap}
.switch button{background:none;border:0;border-bottom:2px solid transparent;color:var(--chalk-dim);
  font:inherit;font-size:13.5px;font-weight:600;padding:5px 9px;cursor:pointer;
  font-family:"Montserrat",sans-serif;min-height:34px}
.switch button[aria-pressed="true"]{color:var(--chalk);border-bottom-color:var(--gold)}
.switch .thm{font-size:15px}

/* hero */
.hero{padding:52px 0 40px}
.hero h1{margin:0;font-family:"Montserrat",sans-serif;font-weight:900;
  font-size:clamp(2.6rem,11vw,4.9rem);line-height:.98;letter-spacing:-.035em;
  text-transform:uppercase;text-wrap:balance}
html[data-font="deva"] .hero h1,html[data-font="nastaliq"] .hero h1,html[data-font="naskh"] .hero h1{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.3;
  font-size:clamp(2rem,8vw,3.4rem)}
.hero h1 span{display:block}
.hero h1 span:last-child{background:var(--grad);-webkit-background-clip:text;
  background-clip:text;color:transparent}
@supports not (background-clip:text){ .hero h1 span:last-child{color:var(--gold)} }
.hero p{margin:26px 0 0;max-width:var(--measure);color:var(--chalk-dim);font-size:1.02rem}
@media (prefers-reduced-motion:no-preference){
  .hero h1 span{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
  .hero h1 span:nth-child(2){animation-delay:.07s}
}
@keyframes rise{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}

/* sections */
.sec{padding:50px 0 0}
.sec > h2{margin:0 0 22px;font-size:1.32rem;font-weight:800;letter-spacing:.01em;
  color:var(--gold);font-family:"Montserrat",sans-serif}
html[data-font="deva"] .sec > h2,html[data-font="nastaliq"] .sec > h2,html[data-font="naskh"] .sec > h2{
  font-family:var(--face);letter-spacing:0}
.sec > h2 b{display:block;width:46px;height:3px;background:var(--grad);margin-top:11px}
.lede{max-width:var(--measure);color:var(--chalk-dim);margin:0 0 26px}

/* sponsor */
.spon{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin:30px 0 0;
  padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:.86rem;color:var(--chalk-dim)}
.spon strong{color:var(--chalk);font-weight:700}
.spon .fp{font-variant-numeric:tabular-nums;color:var(--lime);font-weight:700}
.spon button{background:none;border:0;color:var(--gold-soft);font:inherit;font-size:.86rem;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* primary action */
.slab{display:block;background:var(--grad);color:#071A31;text-decoration:none;
  padding:22px 24px;margin:0 0 2px;border:0}
.slab .t{display:block;font-family:"Montserrat",sans-serif;font-weight:900;font-size:1.4rem;
  letter-spacing:.01em;line-height:1.12;text-transform:uppercase}
html[data-font="deva"] .slab .t,html[data-font="nastaliq"] .slab .t,html[data-font="naskh"] .slab .t{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.7}
.slab .s{display:block;margin-top:5px;font-size:.9rem;opacity:.72;font-weight:600}
.slab:hover,.slab:focus-visible{filter:brightness(1.12)}

/* ruled link rows */
.rows{border-top:1px solid var(--rule)}
.row{display:flex;align-items:baseline;gap:14px;padding:16px 2px;
  border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.row .t{font-weight:700;font-size:1.04rem;letter-spacing:-.01em}
.row .s{color:var(--chalk-dim);font-size:.88rem;flex:1}
.row:hover .t,.row:focus-visible .t{color:var(--gold-soft)}
.row .go{color:var(--rule);font-weight:700;font-family:"Montserrat",sans-serif}
.row:hover .go{color:var(--gold)}
html[dir="rtl"] .row .go{transform:scaleX(-1)}

/* short list */
.rail{list-style:none;margin:0;padding:0;position:relative;counter-reset:n}
.rail::before{content:"";position:absolute;inset-block:14px;inset-inline-start:13px;
  width:1px;background:var(--rule)}
.rail > li{position:relative;padding:0 0 26px;padding-inline-start:46px;max-width:var(--measure)}
.rail > li:last-child{padding-bottom:0}
.rail > li::before{content:counter(n);counter-increment:n;position:absolute;inset-inline-start:0;
  top:-1px;width:27px;height:27px;border:1px solid var(--rule);border-radius:50%;
  background:var(--ink);color:var(--chalk-dim);display:grid;place-items:center;
  font-size:.8rem;font-weight:700;font-family:"Montserrat",sans-serif}

/* step-by-step guide */
.guide{list-style:none;counter-reset:g;margin:0;padding:0;position:relative}
.guide::before{content:"";position:absolute;inset-block:16px;inset-inline-start:15px;
  width:1px;background:var(--rule)}
.guide > li{counter-increment:g;position:relative;padding:0 0 26px;padding-inline-start:52px;
  max-width:var(--measure)}
.guide > li:last-child{padding-bottom:0}
.guide > li::before{content:counter(g);position:absolute;inset-inline-start:0;top:-2px;
  width:31px;height:31px;border-radius:50%;background:var(--ink);border:1px solid var(--gold);
  color:var(--gold);display:grid;place-items:center;font-size:.85rem;font-weight:800;
  font-family:"Montserrat",sans-serif}
.guide h3{margin:0 0 5px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.guide p{margin:0;color:var(--chalk-dim);font-size:.95rem}

/* language chips for the partner's own videos */
.vnote{margin:12px 0 0;padding:11px 14px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold);font-size:.86rem;color:var(--chalk-dim)}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.langs a{display:inline-block;padding:7px 12px;border:1px solid var(--rule);border-radius:999px;
  font-size:.82rem;font-weight:600;text-decoration:none;color:var(--chalk-dim);
  font-family:"Montserrat",sans-serif;background:var(--ink-deep)}
.langs a:hover,.langs a:focus-visible{border-color:var(--gold);color:var(--gold)}
.soon{margin:12px 0 0;font-size:.86rem;color:var(--chalk-dim);font-style:italic}

/* annotated screenshot */
.shot{margin:14px 0 0;position:relative;max-width:300px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:6px}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--gold);
  color:var(--ink);font:800 12px/1 "Montserrat",sans-serif;display:grid;place-items:center;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(11,35,65,.85);pointer-events:none}
html[dir="rtl"] .pin{transform:translate(50%,-50%)}
.keys{list-style:none;margin:12px 0 0;padding:0;counter-reset:k}
.keys li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:.88rem;
  color:var(--chalk-dim)}
.keys li::before{content:counter(k);counter-increment:k;flex:0 0 auto;width:20px;height:20px;
  border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;
  font:800 11px/1 "Montserrat",sans-serif;margin-top:2px}

/* earnings */
.earn{margin:0;padding:0;list-style:none}
.earn > li{padding:0 0 22px;max-width:var(--measure);position:relative;padding-inline-start:20px}
.earn > li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;
  width:8px;height:8px;background:var(--gold)}
.earn h3{margin:0 0 3px;font-size:1.04rem;font-weight:700;letter-spacing:-.01em}
.earn p{margin:0;color:var(--chalk-dim);font-size:.93rem}
.warn{max-width:var(--measure);margin:8px 0 0;padding:18px 20px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold);font-size:.93rem}

/* values — tiers that widen */
.tiers{margin:0;padding:0;list-style:none}
.tiers > li{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;margin-bottom:3px;
  background:var(--ink-raise);border-inline-start:3px solid var(--gold)}
.tiers > li:nth-child(1){width:76%;border-inline-start-color:var(--v1)}
.tiers > li:nth-child(2){width:84%;border-inline-start-color:var(--v2)}
.tiers > li:nth-child(3){width:92%;border-inline-start-color:var(--v3)}
.tiers > li:nth-child(4){width:100%;border-inline-start-color:var(--v4)}
.tiers > li:nth-child(1) .ltr{color:var(--v1)} .tiers > li:nth-child(2) .ltr{color:var(--v2)}
.tiers > li:nth-child(3) .ltr{color:var(--v3)} .tiers > li:nth-child(4) .ltr{color:var(--v4)}
@media (max-width:560px){ .tiers > li{width:100% !important} }
.tiers .ltr{font-family:"Montserrat",sans-serif;font-weight:900;font-size:2rem;line-height:.85;
  flex:0 0 auto;width:1.1em}
.tiers h3{margin:0 0 3px;font-size:1rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;font-family:"Montserrat",sans-serif}
html[data-font="deva"] .tiers h3,html[data-font="nastaliq"] .tiers h3,html[data-font="naskh"] .tiers h3{
  font-family:"Montserrat",sans-serif}
.tiers p{margin:0;color:var(--chalk-dim);font-size:.92rem}

/* notices */
.notice{max-width:var(--measure);padding:22px 24px;background:var(--ink-raise);
  border-inline-start:3px solid var(--lime)}
.notice.alert{border-inline-start-color:var(--gold)}
.notice h3{margin:0 0 8px;font-size:1.1rem;font-weight:700}
.notice p{margin:0 0 10px;color:var(--chalk-dim);font-size:.94rem}
.notice p:last-child{margin-bottom:0}
.notice .foot{font-size:.85rem;padding-top:12px;margin-top:14px;border-top:1px solid var(--rule)}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.choice button{flex:1 1 150px;padding:13px;border:1px solid var(--rule);background:none;
  color:var(--chalk);font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
  font-family:"Montserrat",sans-serif}
.choice button:first-child{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* leader tool */
.tool{max-width:var(--measure)}
.tool p{color:var(--chalk-dim);font-size:.94rem;margin:0 0 16px}
.tool input{width:100%;background:var(--ink-deep);border:1px solid var(--rule);color:var(--chalk);
  padding:14px 15px;font:inherit;font-size:.95rem;font-family:"Montserrat",sans-serif;
  margin-bottom:8px}
.tool input:focus{border-color:var(--gold);outline:none}
.tool button{width:100%;background:var(--chalk);color:var(--ink);border:0;padding:15px;
  font:inherit;font-weight:700;font-size:.98rem;cursor:pointer;font-family:"Montserrat",sans-serif}
.out{margin-top:14px;padding:14px 15px;background:var(--ink-deep);border:1px solid var(--rule);
  font-size:.8rem;word-break:break-all;line-height:1.7}
.out b{display:block;color:var(--lime);margin-bottom:6px;font-size:.85rem}
.out.bad b{color:var(--gold-soft)}

.risk{max-width:var(--measure);margin:56px 0 0;padding-top:20px;border-top:1px solid var(--rule);
  color:var(--chalk-dim);font-size:.85rem}
.sig{margin:30px 0 0;font-size:.8rem;color:var(--chalk-dim);font-family:"Montserrat",sans-serif}
</style>
</head>
<body>
<div class="shell">

  <header class="mast">
    <div class="wordmark">
      <img class="mono" src="assets/ap-gradient.png" alt="" width="40" height="40">
      <span><span class="wm">Aim<em>pire</em></span><span class="tag">Aim for it</span></span>
    </div>
    <nav class="switch" id="switch" aria-label="Language"></nav>
  </header>

  <section class="hero">
    <h1><span id="h1"></span><span id="h2"></span></h1>
    <p id="hsub"></p>
    <div class="spon" id="spon" hidden></div>
  </section>

  <section class="sec" id="s-main">
    <h2 id="t-main"></h2>
    <div class="notice" id="notice-none" hidden>
      <h3 id="nn-t"></h3><p id="nn-b"></p><p class="foot" id="nn-f"></p>
    </div>
    <div class="notice alert" id="notice-conflict" hidden>
      <p id="nc-t"></p>
      <div class="choice"><button id="nc-keep"></button><button id="nc-use"></button></div>
    </div>
    <div id="main-links"></div>
  </section>

  <section class="sec">
    <h2 id="t-guide"></h2>
    <p class="lede" id="guide-lede"></p>
    <ol class="guide" id="guide"></ol>
  </section>

  <section class="sec" id="s-places" hidden>
    <h2 id="t-places"></h2>
    <p class="lede" id="places-lede"></p>
    <ul class="places" id="places"></ul>
  </section>

  <section class="sec" id="s-platform"><h2 id="t-platform"></h2><div id="platform-links"></div></section>

  <section class="sec">
    <h2 id="t-earn"></h2>
    <p class="lede" id="earn-lede"></p>
    <ul class="earn" id="earn-list"></ul>
    <div id="earn-shot"></div>
    <p class="warn" id="earn-warn"></p>
  </section>

  <section class="sec"><h2 id="t-values"></h2><ul class="tiers" id="tiers"></ul></section>
  <section class="sec" id="s-video"><h2 id="t-video"></h2><div id="video-links"></div></section>
  <section class="sec" id="s-docs"><h2 id="t-docs"></h2><div id="docs-links"></div></section>
  <section class="sec" id="s-help"><h2 id="t-help"></h2><div id="help-links"></div></section>

  <section class="sec">
    <h2 id="t-leaders"></h2>
    <div class="tool">
      <p id="ld-body"></p>
      <input id="ld-in" type="url" autocomplete="off" spellcheck="false">
      <button id="ld-btn" onclick="makeLink()"></button>
      <div class="out" id="ld-out" hidden></div>
    </div>
  </section>

  <p class="risk" id="risk"></p>
  <p class="sig">Aimpire &middot; <span id="yr"></span></p>
</div>

े से पहले IB Portal में मौजूदा शर्तें ज़रूर पढ़ें।"]],"warning":"Trading में असली जोखिम है, और ज़्यादातर retail accounts नुक़सान उठाते हैं। यहाँ आपकी कमाई असल गतिविधि पर निर्भर करती है — कोई आमदनी की गारंटी नहीं, और यह शून्य भी हो सकती है। हम चाहते हैं कि आप यह शुरू से ही साफ़ जान लें।"},"ar":{"intro":"أربع طرق، وتنبيه واحد. أرقامك الحقيقية موجودة في IB Portal وحده — وليست في رسالة chat.","items":[["Rebate per lot","يعود إليك جزء من الـ trading cost عن كل lot يتداوله فريقك. ويُدفع مقابل النشاط الفعلي: بلا trading لا يوجد rebate."],["Profit share","عندما تُغلق إحدى الـ strategies صفقة رابحة، يُقسَّم الـ profit. ويبقى النصيب الأكبر للـ trader."],["Team bonus","كلما كبر فريقك، احتُسب لك عدد أكبر من مستوياته. ويُظهر لك IB Portal أيُّها مفتوح."],["Pools and campaigns","الـ leader pools والـ campaigns الموسمية تتغيّر من فترة إلى أخرى. اقرأ الشروط الحالية في IB Portal قبل أن تعتمد على أيٍّ منها."]],"warning":"في الـ trading خطر حقيقي، وأكثر الـ retail accounts تخسر أموالها. وما تكسبه هنا يعتمد على نشاط فعلي — لا دخل مضمون، وقد يكون صفراً. نفضّل أن نكون صريحين معك في هذا منذ البداية."}},"values":{"en":[["A","Aspire","Dream big and go after it. Ambition is the entry fee, not the reward."],["I","Inspire","Share what you learn, including what went wrong. Lift the person next to you."],["M","Meritocracy","Work and skill get recognised. Where you come from does not decide what you can become."],["E","Empire","Built together, or not at all. Everyone belongs and everyone contributes."]],"ur":[["A","Aspire","بڑا خواب دیکھیں اور اس کے پیچھے جائیں۔ بلند حوصلگی داخلے کی فیس ہے، انعام نہیں۔"],["I","Inspire","جو سیکھیں وہ بانٹیں، بشمول وہ جو غلط ہوا۔ اپنے ساتھی کو اوپر اٹھائیں۔"],["M","Meritocracy","محنت اور مہارت کی قدر ہوتی ہے۔ آپ کہاں سے آئے، یہ طے نہیں کرتا کہ آپ کیا بن سکتے ہیں۔"],["E","Empire","مل کر بنے گا، ورنہ نہیں۔ ہر کوئی اپنا ہے اور ہر کوئی حصہ ڈالتا ہے۔"]],"no":[["A","Aspire","Drøm stort — og gjør noe med det. Ambisjon er inngangsbilletten, ikke belønningen."],["I","Inspire","Del det du lærer, også det som gikk galt. Dra med deg dem som står ved siden av deg."],["M","Meritocracy","Innsats og dyktighet teller. Hvor du kommer fra avgjør ikke hvor du kan havne."],["E","Empire","Vi bygger det sammen, ellers blir det ikke bygd. Alle hører til, og alle bidrar."]],"hi":[["A","Aspire","बड़ा सपना देखें और उसके पीछे जाएँ। महत्वाकांक्षा प्रवेश शुल्क है, इनाम नहीं।"],["I","Inspire","जो सीखें वह बाँटें, जो ग़लत हुआ वह भी। अपने साथी को ऊपर उठाएँ।"],["M","Meritocracy","मेहनत और हुनर की क़द्र होती है। आप कहाँ से आए, यह तय नहीं करता कि आप क्या बन सकते हैं।"],["E","Empire","मिलकर बनेगा, वरना नहीं। हर कोई अपना है और हर कोई योगदान देता है।"]],"ar":[["A","Aspire","اطمح إلى ما هو أكبر، واسعَ إليه. الطموح تذكرة الدخول، لا الجائزة."],["I","Inspire","شارك ما تتعلمه، وأخطاءك أيضاً. وخُذ بيد من بجانبك."],["M","Meritocracy","التقدير هنا للعمل والمهارة. ومن أين أتيت لا يحدد إلى أين تصل."],["E","Empire","نبنيه معاً، أو لا يُبنى. لكلِّ واحد مكانه فيه، ولكلِّ واحد دوره."]]},"leaders":{"en":{"title":"Turn your IB link into an Aimpire page","body":"Open the IB Portal, go to Profile, and copy your Partner or SonicFunnel link. Paste it here. You get one link that shows this whole page in every language, with you attached as the contact for anyone who opens it.","placeholder":"Paste your invite link","button":"Make my link","ok":"Copied. Share this one.","bad":"That is not a recognised invite link. It must start with https:// and come from your IB Portal profile."},"ur":{"title":"اپنے دعوتی لنک کو ایمپائر لنک بنائیں","body":"IB Portal کھولیں، Profile میں جائیں، اور اپنا Partner یا SonicFunnel لنک کاپی کریں۔ یہاں پیسٹ کریں۔ آپ کو ایک لنک ملے گا جو یہ پورا صفحہ تمام زبانوں میں دکھاتا ہے، اور جو بھی اسے کھولے گا اُس کے لیے رابطہ آپ ہوں گے۔","placeholder":"اپنا دعوتی لنک پیسٹ کریں","button":"میرا لنک بنائیں","ok":"کاپی ہو گیا۔ یہی شیئر کریں۔","bad":"یہ تسلیم شدہ دعوتی لنک نہیں ہے۔ یہ https:// سے شروع ہونا چاہیے اور آپ کے IB Portal پروفائل سے آنا چاہیے۔"},"no":{"title":"Gjør invitasjonslenken din om til en Aimpire-lenke","body":"Åpne IB Portal, gå til Profile, og kopier Partner- eller SonicFunnel-lenka di. Lim den inn her. Du får én lenke som viser hele denne siden på alle språkene, med deg som kontaktperson for alle som åpner den.","placeholder":"Lim inn invitasjonslenken din","button":"Lag lenken min","ok":"Kopiert. Del denne.","bad":"Dette er ikke en gyldig invitasjonslenke. Den må starte med https:// og komme fra IB-portalprofilen din."},"hi":{"title":"अपने निमंत्रण लिंक को Aimpire लिंक बनाएँ","body":"IB Portal खोलें, Profile में जाएँ, और अपना Partner या SonicFunnel लिंक कॉपी करें। उसे यहाँ पेस्ट करें। आपको एक लिंक मिलेगा जो यह पूरा पेज सभी भाषाओं में दिखाता है, और जो भी उसे खोलेगा उसके लिए आप ही contact होंगे।","placeholder":"अपना निमंत्रण लिंक पेस्ट करें","button":"मेरा लिंक बनाएँ","ok":"कॉपी हो गया। यही साझा करें।","bad":"यह मान्य निमंत्रण लिंक नहीं है। यह https:// से शुरू होना चाहिए और आपके IB Portal प्रोफ़ाइल से आना चाहिए।"},"ar":{"title":"حوّل رابط دعوتك إلى رابط Aimpire","body":"افتح IB Portal، واذهب إلى Profile، وانسخ رابط Partner أو SonicFunnel الخاص بك. ألصقه هنا. ستحصل على رابط واحد يعرض هذه الصفحة كاملة بجميع اللغات، وتكون أنت جهة الاتصال لكل من يفتحه.","placeholder":"الصق رابط دعوتك","button":"أنشئ رابطي","ok":"تم النسخ. شارِك هذا الرابط.","bad":"لم نتعرّف على هذا الرابط كرابط دعوة. يجب أن يبدأ بـ https:// وأن يكون من صفحة Profile في IB Portal."}},"risk":{"en":"Trading involves risk and you can lose the money you put in. Nothing here is financial advice, and no income is promised. Use only money you can afford to lose, and check the rules that apply where you live.","ur":"Trading میں خطرہ ہے اور آپ اپنی لگائی ہوئی رقم کھو سکتے ہیں۔ یہاں کچھ بھی financial advice نہیں، اور کسی آمدنی کا وعدہ نہیں۔ صرف وہی رقم لگائیں جس کا نقصان آپ سہہ سکیں، اور اپنے ملک کے قوانین دیکھیں۔","no":"Trading innebærer risiko, og du kan tape pengene du setter inn. Ingenting her er finansiell rådgivning, og ingen inntekt er lovet. Bruk bare penger du kan tåle å tape, og sjekk reglene der du bor.","hi":"Trading में जोखिम है और आप अपनी लगाई रकम खो सकते हैं। यहाँ कुछ भी financial advice नहीं, और किसी आमदनी का वादा नहीं। केवल वही रकम लगाएँ जिसका नुक़सान आप सह सकें, और अपने देश के नियम देखें।","ar":"في الـ trading خطر، ويمكن أن تخسر المال الذي تودعه. ولا شيء هنا يُعدّ financial advice، ولا وعد بأي دخل. ولا تستخدم إلا مالاً تحتمل خسارته، وراجع القوانين السارية في بلد إقامتك."},"links":{"main":[{"url":"__REF__","primary":true,"en":["Open your account","Through your sponsor's link"],"ur":["اپنا اکاؤنٹ کھولیں","اپنے سپانسر کے لنک سے"],"no":["Åpne kontoen din","Via sponsorens lenke"],"hi":["अपना खाता खोलें","अपने स्पॉन्सर के लिंक से"],"ar":["افتح حسابك","عبر رابط الـ sponsor الخاص بك"]},{"url":"","en":["Join the group","Element X — where we actually talk"],"ur":["گروپ میں شامل ہوں","ایلیمنٹ ایکس — جہاں ہم اصل میں بات کرتے ہیں"],"no":["Bli med i gruppa","Element X — der vi faktisk snakker"],"hi":["ग्रुप में शामिल हों","Element X — जहाँ हम असल में बात करते हैं"],"ar":["انضم إلى المجموعة","Element X — حيث نتحدث فعلاً"]},{"url":"","en":["Weekly call","Sunday, 20:00 Pakistan time"],"ur":["ہفتہ وار کال","اتوار، رات 8 بجے پاکستان کا وقت"],"no":["Ukentlig call","Søndag kl. 20:00 pakistansk tid"],"hi":["साप्ताहिक कॉल","रविवार, रात 8 बजे पाकिस्तान समय"],"ar":["المكالمة الأسبوعية","الأحد، الثامنة مساءً بتوقيت باكستان"]}],"platform":[{"url":"https://aitech.ibportal.io/profile","en":["IB Portal","Your team, your commissions, your real numbers"],"ur":["IB Portal","آپ کی ٹیم، آپ کا کمیشن، آپ کے اصل اعداد"],"no":["IB-portalen","Teamet ditt, provisjonen din, de virkelige tallene"],"hi":["IB Portal","आपकी टीम, आपका कमीशन, आपके असली आँकड़े"],"ar":["IB Portal","فريقك، وعمولاتك، وأرقامك الحقيقية"]},{"url":"https://www.copyxapp.com","en":["CopyX","The copy-trading platform"],"ur":["CopyX","کاپی ٹریڈنگ پلیٹ فارم"],"no":["CopyX","Plattformen for kopihandel"],"hi":["CopyX","कॉपी ट्रेडिंग प्लेटफ़ॉर्म"],"ar":["CopyX","منصة الـ copy trading"]},{ e, तस्वीरों के साथ"],"ur":["اپنا password بدلنا","Broker کی اپنی guide، تصاویر کے ساتھ"],"ar":["تغيير الـ password","دليل الـ broker نفسه، بالصور"]},{"url":"https://intercom.help/tag-markets/en/articles/10421701-how-to-create-an-account","en":["Opening a trading account","The broker's own guide, with pictures"],"no":["Åpne en handelskonto","Meglerens egen guide, med bilder"],"hi":["Trading account खोलना","Broker की अपनी guide, तस्वीरों के साथ"],"ur":["Trading account کھولنا","Broker کی اپنی guide، تصاویر کے ساتھ"],"ar":["فتح trading account","دليل الـ broker نفسه، بالصور"]},{"url":"","en":["Start here guide","PDF, English"],"ur":["ابتدائی رہنما","پی ڈی ایف، انگریزی"],"no":["Startguide","PDF"],"hi":["शुरुआती गाइड","PDF"],"ar":["دليل البداية","PDF، بالإنجليزية"]},{"url":"","en":["Start here guide","PDF, Urdu"],"ur":["ابتدائی رہنما","پی ڈی ایف، اردو"],"no":["Startguide","PDF"],"hi":["शुरुआती गाइड","PDF"],"ar":["دليل البداية","PDF، بالأردية"]},{"url":"","en":["Pips and lot size","How much one move actually costs you"],"ur":["پپس اور لاٹ سائز","ایک حرکت آپ کو اصل میں کتنی پڑتی ہے"],"no":["Pips og lot size","Hva én bevegelse faktisk koster deg"],"hi":["पिप्स और लॉट साइज़","एक चाल असल में आपको कितनी पड़ती है"],"ar":["الـ pips وحجم الـ lot","كم تكلفك الحركة الواحدة فعلاً"]},{"url":"","en":["Trading psychology","The part nobody wants to read"],"ur":["ٹریڈنگ نفسیات","وہ حصہ جو کوئی پڑھنا نہیں چاہتا"],"no":["Trading-psykologi","Delen ingen vil lese"],"hi":["ट्रेडिंग मनोविज्ञान","वह हिस्सा जो कोई पढ़ना नहीं चाहता"],"ar":["نفسية الـ trading","الجزء الذي لا يريد أحد قراءته"]}],"help":[{"url":"","en":["Ask your sponsor","The person who invited you"],"ur":["اپنے سپانسر سے پوچھیں","جس نے آپ کو مدعو کیا"],"no":["Spør sponsoren din","Den som inviterte deg"],"hi":["अपने स्पॉन्सर से पूछें","जिसने आपको आमंत्रित किया"],"ar":["اسأل الـ sponsor الخاص بك","الشخص الذي دعاك"]},{"url":"","en":["Common questions","Answered once, properly"],"ur":["عام سوالات","ایک بار، ٹھیک سے جواب دیے گئے"],"no":["Vanlige spørsmål","Besvart én gang, ordentlig"],"hi":["आम सवाल","एक बार, ठीक से उत्तर दिए गए"],"ar":["أسئلة متكررة","أُجيب عنها مرة واحدة، كما ينبغي"]}]},"guide":{"en":{"lede":"Set aside about fifteen minutes, and have your ID and something showing your address next to you before you start. The sign-up form takes two minutes — the broker account and your documents are the rest. You can stop after any step and come back.","steps":[["Use your sponsor's link","Open the link the person who invited you sent — theirs, not one from a group. At the top of this page there is a line reading “Your sign-up goes to …” ending in six letters and numbers. That code identifies them. If you do not see that line at all, you opened a plain link: the broker will not know who introduced you, and you will not have anyone attached to help. Ask them to send you theirs."],["Create your account","Scroll back UP to the gold button that says “Open your account” and tap it. It opens CopyX in a new tab — you will see a black COPY-X logo. Use your real name and details: they have to match the ID you upload later. Choose a password you do not use anywhere else. Important: the country box starts on Albania for everyone — change it to where you actually live, because the phone code follows it. Then tick both boxes, wait for the small grey “Verifying…” box at the bottom to finish, and press Sign Up. Tapping it before the check finishes does nothing.",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"Your real name. It must match the ID you upload next, or verification fails."},{"n":2,"x":24,"y":45,"t":"A password you use nowhere else. Not your email password."},{"n":3,"x":9,"y":66,"t":"Tick both. Read them first — they say you can lose money."},{"n":4,"x":50,"y":87,"t":"If you see this yellow box, your link was missing the invite code. Go back and open your sponsor's link instead."},{"n":5,"x":24,"y":56,"t":"This starts on Albania for everyone. Change it — the phone code follows it."}]}],["Link your broker account — this step matters","Once you are inside the portal, find the Login to CopyX button and use that to create your Tag Markets account. Do not go to CopyX or the broker and sign up separately: an account made that way is not synchronised, and nothing will track correctly afterwards.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Watch this step"},"note":"The portal says it plainly: register your Tag Markets account exclusively using that button.","img":"assets/shot-copyx-register.jpg","alt":"The CopyX Registration panel in the IB portal","marks":[{"n":1,"x":34,"y":37,"t":"Read this line. It tells you to create the broker account from here, not anywhere else."},{"n":2,"x":13,"y":71,"t":"This is the button. It says Login to CopyX — use it even the first time."},{"n":3,"x":50,"y":90,"t":"The warning in yellow: an account made directly on CopyX will not be linked."}]}],["Verify your identity","You will need your ID card or passport, and something showing your address. Photograph them in good light with all four corners visible. A blurry photo is the main reason people get rejected — not anything serious.",{"img":"assets/shot-kyc.jpg","alt":"The Upload Documents panel","marks":[{"n":1,"x":50,"y":44,"t":"Pick the document type here first. Nothing uploads until you do."},{"n":2,"x":50,"y":75,"t":"This yellow line is normal before you upload. It is not an error."},{"n":3,"x":90,"y":5,"t":"Validate means the broker has not checked your documents yet."}]}],["Wait for approval","Verification usually takes a short while. Until it comes through, the broker will not let you add money — you will see this notice on the wallet page. That is normal, not an error.",{"img":"assets/shot-wallet-kyc.jpg","alt":"The wallet page showing that KYC must be completed first","marks":[{"n":1,"x":50,"y":30,"t":"This pink line means verification is still pending. It disappears once your documents are approved."}]}],["Connect to Sonic copy trading","This is the step that actually starts the copying. Until you do it, money can sit in the account and nothing will trade. Go to Tag Markets, open CopyX from the menu, press Details, choose SONIC, and press Connect. Then four fields: the amount you want to start with (minimum $10), the account type, and the community token — type #Aitech and press Verify. A Hash field appears after that: enter 000000. Press Submit, then Join to Copytrade.",{"note":"Account type: AMPLIFY multiplies the size of every position, up to 24 times. It multiplies the losses by exactly the same amount as the gains. If this is your first account, start without it."}],["Join the group","That is where questions get answered — nobody there started out knowing anything either. When you fund the account later, it is worth starting small."]]},"ur":{"lede":"تقریباً پندرہ منٹ رکھیں، اور شروع کرنے سے پہلے اپنا شناختی کارڈ اور پتے کا کوئی ثبوت پاس رکھ لیں۔ Form بھرنے میں دو منٹ لگتے ہیں — broker اکاؤنٹ اور دستاویزات باقی وقت لیتے ہیں۔ آپ کسی بھی step کے بعد رک کر بعد میں جاری رکھ سکتے ہیں۔","steps":[["اپنے سپانسر کا لنک استعمال کریں","وہی link کھولیں جو آپ کو مدعو کرنے والے نے بھیجا — انہی کا، کسی group کا نہیں۔ اس صفحے کے اوپر ایک سطر ہے جو چھ حروف و اعداد پر ختم ہوتی ہے۔ وہی code اُنہیں پہچانتا ہے۔ اگر وہ سطر نظر ہی نہ آئے تو آپ نے سادہ link کھولا ہے اور کسی کو کریڈٹ نہیں ملے گا — اُن سے اُن کا link مانگیں۔"],["اپنا اکاؤنٹ بنائیں","اوپر scroll کر کے سنہرے button “Open your account” پر جائیں اور دبائیں۔ یہ CopyX کو نئے tab میں کھولتا ہے — آپ کو کالا COPY-X لوگو نظر آئے گا۔ اصل نام اور معلومات دیں: یہ اُس شناختی کارڈ سے ملنی چاہیے جو آپ بعد میں اپ لوڈ کریں گے۔ ایسا password چنیں جو کہیں اور استعمال نہ کرتے ہوں۔ اہم: country کا خانہ سب کے لیے Albania پر رہتا ہے — اسے اپنے اصل ملک پر بدلیں، کیونکہ phone کا code اسی سے آتا ہے۔ پھر دونوں boxes پر نشان لگائیں، نیچے کی چھوٹی سرمئی “Verifying…” box مکمل ہونے دیں، اور Sign Up دبائیں۔ جانچ مکمل ہونے سے پہلے دبانے پر کچھ نہیں ہوتا۔",{"img":"assets/shot-register.jpg","alt":"CopyX کا سائن اپ فارم","marks":[{"n":1,"x":24,"y":32,"t":"اپنا اصل نام۔ یہ اُس شناختی کارڈ سے ملنا چاہیے جو آگے اپ لوڈ کریں گے، ورنہ تصدیق ناکام ہوگی۔"},{"n":2,"x":24,"y":45,"t":"ایسا پاس ورڈ جو آپ کہیں اور استعمال نہیں کرتے۔ ای میل کا پاس ورڈ نہیں۔"},{"n":3,"x":9,"y":66,"t":"دونوں پر نشان لگائیں۔ پہلے پڑھیں — ان میں لکھا ہے کہ آپ رقم کھو سکتے ہیں۔"},{"n":4,"x":50,"y":87,"t":"یہ پیلا box نظر آئے تو آپ کے link میں invite code نہیں تھا۔ واپس جا کر اپنے sponsor کا link کھولیں۔"},{"n":5,"x":24,"y":56,"t":"یہ سب کے لیے Albania پر رہتا ہے۔ اسے بدلیں — phone کا code اسی سے آتا ہے۔"}]}],["اپنا بروکر اکاؤنٹ منسلک کریں — یہ مرحلہ اہم ہے","پورٹل میں داخل ہونے کے بعد Login to CopyX کا بٹن تلاش کریں اور اسی سے اپنا Tag Markets اکاؤنٹ بنائیں۔ CopyX یا بروکر پر جا کر الگ سے سائن اپ نہ کریں: اس طرح بنایا گیا اکاؤنٹ منسلک نہیں ہوتا، اور بعد میں کچھ بھی درست شمار نہیں ہوگا۔",{"note":"پورٹل خود صاف لکھتا ہے: اپنا Tag Markets اکاؤنٹ صرف اُسی بٹن سے بنائیں۔","soon":"اردو ویڈیو ابھی تیار کی جا رہی ہے۔ تب تک کوئی بات سمجھ نہ آئے تو اپنے سپانسر سے پوچھ لیں — وہ اسی لیے ہیں۔","img":"assets/shot-copyx-register.jpg","alt":"IB Portal میں CopyX رجسٹریشن پینل","marks":[{"n":1,"x":34,"y":37,"t":"یہ سطر پڑھیں۔ یہ بتاتی ہے کہ بروکر اکاؤنٹ یہیں سے بنانا ہے، کہیں اور سے نہیں۔"},{"n":2,"x":13,"y":71,"t":"یہی بٹن ہے۔ اس پر Login to CopyX لکھا ہے — پہلی بار بھی یہی استعمال کریں۔"},{"n":3,"x":50,"y":90,"t":"پیلی تنبیہ: سیدھا CopyX پر بنایا گیا اکاؤنٹ منسلک نہیں ہوگا۔"}]}],["اپنی شناخت کی تصدیق کریں","آپ کو شناختی کارڈ یا پاسپورٹ چاہیے، اور پتے کا کوئی ثبوت۔ اچھی روشنی میں تصویر لیں، چاروں کونے نظر آئیں۔ دھندلی تصویر ہی سب سے بڑی وجہ ہے جس سے درخواست مسترد ہوتی ہے — کوئی سنگین بات نہیں۔",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents پینل","marks":[{"n":1,"x":50,"y":44,"t":"پہلے یہاں دستاویز کی قسم چنیں۔ اس سے پہلے کچھ اپ لوڈ نہیں ہوگا۔"},{"n":2,"x":50,"y":75,"t":"اپ لوڈ سے پہلے یہ پیلی سطر معمول کی بات ہے۔ یہ خرابی نہیں۔"},{"n":3,"x":90,"y":5,"t":"Validate کا مطلب ہے بروکر نے ابھی آپ کی دستاویزات نہیں دیکھیں۔"}]}],["منظوری کا انتظار کریں","تصدیق میں عموماً تھوڑا وقت لگتا ہے۔ جب تک یہ مکمل نہ ہو، broker آپ کو رقم ڈالنے نہیں دے گا — wallet صفحے پر آپ کو یہ اطلاع نظر آئے گی۔ یہ معمول کی بات ہے، کوئی خرابی نہیں۔",{"img":"assets/shot-wallet-kyc.jpg","alt":"wallet صفحہ جو بتاتا ہے کہ پہلے KYC مکمل کرنا ہے","marks":[{"n":1,"x":50,"y":30,"t":"یہ گلابی سطر بتاتی ہے کہ تصدیق ابھی باقی ہے۔ دستاویزات منظور ہوتے ہی یہ ہٹ جاتی ہے۔"}]}],["سونِک (SONIC) کاپی ٹریڈنگ سے منسلک ہوں","یہی وہ مرحلہ ہے جو اصل میں کاپی ٹریڈنگ شروع کرتا ہے۔ اس سے پہلے رقم اکاؤنٹ میں پڑی رہ سکتی ہے اور کوئی ٹریڈ نہیں ہوگی۔ Tagmarkets.com پر جائیں، مینو سے CopyX منتخب کریں، details پر کلک کر کے SONIC کا انتخاب کریں، اور CONNECT پر کلک کریں۔ پھر چار خانے: سرمایہ کاری کی رقم (کم از کم $10)، اکاؤنٹ کی قسم، اور کمیونٹی ٹوکن — ڈراپ ڈاؤن کھول کر #Aitech درج کریں اور VERIFY پر کلک کریں۔ اس کے بعد Hash کا خانہ ظاہر ہوگا، وہاں 000000 درج کریں۔ SUBMIT پر کلک کریں، پھر JOIN TO COPYTRADE پر۔",{"note":"اکاؤنٹ کی قسم: AMPLIFY ہر پوزیشن کا سائز 24 گنا تک بڑھاتا ہے۔ یہ نقصان کو بھی بالکل اتنا ہی بڑھاتا ہے جتنا نفع کو۔ اگر یہ آپ کا پہلا اکاؤنٹ ہے تو اس کے بغیر شروع کریں۔"}],["گروپ میں شامل ہوں","سوالات کے جواب وہیں ملتے ہیں — وہاں بھی کوئی سب کچھ جانتے ہوئے شروع نہیں ہوا تھا۔ بعد میں جب آپ account میں پیسے ڈالیں تو تھوڑی رقم سے شروع کرنا سمجھداری ہے۔"]]},"no":{"lede":"Sett av et kvarter, og ha ID-en din og noe som viser adressen din klart før du begynner. Selve skjemaet tar to minutter — meglerkontoen og dokumentene er resten. Du kan stoppe etter hvilket som helst steg og fortsette senere.","steps":[["Bruk sponsorens lenke","Åpne lenken fra den som inviterte deg — deres, ikke en fra en gruppe. Øverst på siden står en linje som sier «Registreringen din går til …» og ender med seks tegn. Den koden identifiserer dem. Ser du ikke den linjen i det hele tatt, åpnet du en bar lenke og ingen blir kreditert — be dem sende sin egen."],["Opprett kontoen","Scroll OPP igjen til den gylne knappen «Åpne kontoen din» og trykk på den. Den åpner CopyX i en ny fane — du ser en sort COPY-X-logo. Bruk ekte navn og opplysninger: de må stemme med ID-en du laster opp senere. Velg et passord du ikke bruker noe annet sted. Viktig: landfeltet står på Albania for alle — endre det til der du faktisk bor, for landkoden på telefonen følger med. Kryss så av begge boksene, vent til den lille grå «Verifying…»-boksen nederst er ferdig, og trykk Sign Up. Trykker du før sjekken er ferdig, skjer ingenting.",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"Ditt ekte navn. Det må stemme med ID-en du laster opp etterpå, ellers går ikke verifiseringen gjennom."},{"n":2,"x":24,"y":45,"t":"Et passord du ikke bruker noe annet sted. Ikke e-postpassordet ditt."},{"n":3,"x":9,"y":66,"t":"Huk av begge. Les dem først — de sier at du kan tape penger."},{"n":4,"x":50,"y":87,"t":"Ser du denne gule boksen, manglet lenken invitasjonskoden. Gå tilbake og åpne sponsorens lenke i stedet."},{"n":5,"x":24,"y":56,"t":"Denne står på Albania for alle. Endre den — landkoden på telefonen følger med."}]}],["Koble meglerkontoen — dette steget er viktig","Når du er inne i portalen, finn knappen Login to CopyX og bruk den til å opprette Tag Markets-kontoen. Ikke gå til CopyX eller megleren og registrer deg separat: en konto laget slik blir ikke synkronisert, og ingenting spores riktig etterpå.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Se dette steget (på engelsk)"},"note":"Portalen sier det rett ut: opprett Tag Markets-kontoen kun med den knappen.","img":"assets/shot-copyx-register.jpg","alt":"CopyX Registration-panelet i IB-portalen","marks":[{"n":1,"x":34,"y":37,"t":"Les denne linjen. Den sier at meglerkontoen opprettes herfra, ikke andre steder."},{"n":2,"x":13,"y":71,"t":"Dette er knappen. Den heter Login to CopyX — bruk den også første gang."},{"n":3,"x":50,"y":90,"t":"Advarselen i gult: en konto laget direkte på CopyX blir ikke koblet."}]}],["Bekreft identiteten din","Du trenger ID-kort eller pass, og noe som viser adressen din. Fotografer dem i godt lys med alle fire hjørner synlige. Uskarpt bilde er den vanligste grunnen til avslag — ikke noe alvorlig.",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents-panelet","marks":[{"n":1,"x":50,"y":44,"t":"Velg dokumenttype her først. Ingenting lastes opp før du har gjort det."},{"n":2,"x":50,"y":75,"t":"Den gule linjen er normal før du laster opp. Det er ikke en feil."},{"n":3,"x":90,"y":5,"t":"Validate betyr at megleren ennå ikke har sjekket dokumentene dine."}]}],["Vent på godkjenning","Bekreftelsen tar vanligvis litt tid. Fram til den er på plass lar ikke megleren deg sette inn penger — du ser denne meldingen på wallet-siden. Det er normalt, ikke en feil.",{"img":"assets/shot-wallet-kyc.jpg","alt":"Wallet-siden som viser at KYC må fullføres først","marks":[{"n":1,"x":50,"y":30,"t":"Den rosa linjen betyr at bekreftelsen fortsatt pågår. Den forsvinner når dokumentene er godkjent."}]}],["Koble til Sonic copy trading","Det er dette steget som faktisk starter kopieringen. Før du gjør det, kan pengene stå på kontoen uten at noe som helst handles. Gå til Tag Markets, åpne CopyX fra menyen, trykk Details, velg SONIC og trykk Connect. Så fire felter: beløpet du vil starte med (minimum $10), kontotypen, og community-token — skriv #Aitech og trykk Verify. Da dukker det opp et Hash-felt: skriv 000000. Trykk Submit, og deretter Join to Copytrade.",{"note":"Kontotype: AMPLIFY ganger størrelsen på hver posisjon, opptil 24 ganger. Den ganger tapet nøyaktig like mye som gevinsten. Er dette din første konto, start uten."}],["Bli med i gruppa","Det er der spørsmål blir besvart — ingen der startet med å kunne noe heller. Når du senere setter inn penger, er det lurt å starte med et lite beløp."]]},"hi":{"lede":"लगभग पंद्रह मिनट रखें, और शुरू करने से पहले अपना पहचान पत्र और पते का कोई प्रमाण पास रख लें। Form भरने में दो मिनट लगते हैं — broker खाता और दस्तावेज़ बाक़ी समय लेते हैं। आप किसी भी step के बाद रुककर बाद में जारी रख सकते हैं।","steps":[["अपने स्पॉन्सर का लिंक इस्तेमाल करें","वही link खोलें जो आपको आमंत्रित करने वाले ने भेजा — उन्हीं का, किसी group का नहीं। इस पेज के ऊपर एक पंक्ति है जो छह अक्षर-अंकों पर ख़त्म होती है। वही code उन्हें पहचानता है। अगर वह पंक्ति दिखे ही नहीं, तो आपने सादा link खोला है और किसी को श्रेय नहीं मिलेगा — उनसे उनका link माँगें।"],["अपना खाता बनाएँ","ऊपर scroll करके सुनहरे button “Open your account” पर जाएँ और दबाएँ। यह CopyX को नए tab में खोलता है — आपको काला COPY-X logo दिखेगा। असली नाम और जानकारी दें: यह उस पहचान पत्र से मेल खानी चाहिए जो आप बाद में अपलोड करेंगे। ऐसा password चुनें जो कहीं और इस्तेमाल न करते हों। ज़रूरी: country का box सबके लिए Albania पर रहता है — इसे अपने असली देश पर बदलें, क्योंकि phone का code उसी से आता है। फिर दोनों boxes पर निशान लगाएँ, नीचे की छोटी ग्रे “Verifying…” box पूरी होने दें, और Sign Up दबाएँ। जाँच पूरी होने से पहले दबाने पर कुछ नहीं होता।",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"आपका असली नाम। यह उस ID से मेल खाना चाहिए जो आप आगे अपलोड करेंगे, वरना verification पूरा नहीं होगा।"},{"n":2,"x":24,"y":45,"t":"ऐसा password जो आप कहीं और इस्तेमाल न करते हों। अपने email का password नहीं।"},{"n":3,"x":9,"y":66,"t":"दोनों पर टिक करें। पहले पढ़ें — उनमें लिखा है कि आप पैसे खो सकते हैं।"},{"n":4,"x":50,"y":87,"t":"यह पीला box दिखे तो आपके link में invite code नहीं था। वापस जाकर अपने sponsor का link खोलें।"},{"n":5,"x":24,"y":56,"t":"यह सबके लिए Albania पर रहता है। इसे बदलें — phone का code इसी से आता है।"}]}],["अपना ब्रोकर खाता जोड़ें — यह चरण महत्वपूर्ण है","पोर्टल में पहुँचने के बाद Login to CopyX बटन ढूँढें और उसी से अपना Tag Markets खाता बनाएँ। CopyX या ब्रोकर पर जाकर अलग से साइन अप न करें: इस तरह बना खाता सिंक नहीं होता, और बाद में कुछ भी सही दर्ज नहीं होगा।",{"video":{"url":"https://drive.google.com/file/d/1yvnfW9R7T930XvONOniniyG01_NZ8oV3/view","label":"यह चरण देखें"},"note":"पोर्टल साफ़ कहता है: अपना Tag Markets खाता केवल उसी बटन से बनाएँ।","img":"assets/shot-copyx-register.jpg","alt":"IB Portal में CopyX Registration पैनल","marks":[{"n":1,"x":34,"y":37,"t":"यह पंक्ति पढ़ें। यह बताती है कि ब्रोकर खाता यहीं से बनाना है, कहीं और से नहीं।"},{"n":2,"x":13,"y":71,"t":"यही बटन है। इस पर Login to CopyX लिखा है — पहली बार भी यही इस्तेमाल करें।"},{"n":3,"x":50,"y":90,"t":"पीली चेतावनी: सीधे CopyX पर बनाया खाता जुड़ेगा नहीं।"}]}],["अपनी पहचान सत्यापित करें","आपको पहचान पत्र या पासपोर्ट चाहिए, और पते का कोई प्रमाण। अच्छी रोशनी में तस्वीर लें, चारों कोने दिखें। धुँधली तस्वीर ही अस्वीकृति का सबसे बड़ा कारण है — कोई गंभीर बात नहीं।",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents पैनल","marks":[{"n":1,"x":50,"y":44,"t":"पहले यहाँ दस्तावेज़ का प्रकार चुनें। उससे पहले कुछ अपलोड नहीं होगा।"},{"n":2,"x":50,"y":75,"t":"अपलोड से पहले यह पीली पंक्ति सामान्य है। यह त्रुटि नहीं है।"},{"n":3,"x":90,"y":5,"t":"Validate का मतलब है ब्रोकर ने अभी आपके दस्तावेज़ जाँचे नहीं।"}]}],["मंज़ूरी का इंतज़ार करें","सत्यापन में आमतौर पर थोड़ा समय लगता है। जब तक यह पूरा न हो, broker आपको पैसे डालने नहीं देगा — wallet पेज पर आपको यह सूचना दिखेगी। यह सामान्य है, कोई त्रुटि नहीं।",{"img":"assets/shot-wallet-kyc.jpg","alt":"wallet पेज जो दिखाता है कि पहले KYC पूरा करना है","marks":[{"n":1,"x":50,"y":30,"t":"यह गुलाबी पंक्ति बताती है कि सत्यापन अभी बाक़ी है। दस्तावेज़ मंज़ूर होते ही यह हट जाती है।"}]}],["Sonic copy trading से जुड़ें","यही वह step है जो असल में copying शुरू करता है। इससे पहले पैसा account में पड़ा रह सकता है और कोई trade नहीं होगी। Tag Markets पर जाएँ, menu से CopyX खोलें, Details दबाएँ, SONIC चुनें, और Connect दबाएँ। फिर चार खाने: जितने से शुरू करना है वह रकम (कम से कम $10), account type, और community token — #Aitech लिखें और Verify दबाएँ। उसके बाद Hash का खाना आएगा, उसमें 000000 लिखें। Submit दबाएँ, फिर Join to Copytrade।",{"note":"Account type: AMPLIFY हर position का size 24 गुना तक बढ़ाता है। यह नुकसान को भी ठीक उतना ही बढ़ाता है जितना फ़ायदे को। अगर यह आपका पहला account है तो इसके बिना शुरू करें।"}],["ग्रुप में शामिल हों","सवालों के जवाब वहीं मिलते हैं — वहाँ भी कोई सब कुछ जानते हुए शुरू नहीं हुआ था। बाद में जब आप account में पैसे डालें, तो थोड़ी रकम से शुरू करना समझदारी है।"]]},"ar":{"lede":"خصّص نحو ربع ساعة، وضع بجانبك هويتك ومستنداً يُظهر عنوانك قبل أن تبدأ. استمارة التسجيل تستغرق دقيقتين، وبقية الوقت تذهب إلى حساب الـ broker ومستنداتك. يمكنك التوقف بعد أي خطوة والعودة لاحقاً.","steps":[["استخدم رابط الـ sponsor الخاص بك","افتح الرابط الذي أرسله لك الشخص الذي دعاك — رابطه هو، لا رابطاً منشوراً في مجموعة. في أعلى هذه الصفحة سطرٌ يقول «تسجيلك يُحسب لـ …» وينتهي برمز من ستة أحرف وأرقام، وهذا الرمز يدلّ عليه. وإن لم تَرَ ذلك السطر إطلاقاً، فقد فتحت رابطاً عادياً ولن يُحسب التسجيل لأحد — اطلب منه أن يرسل لك رابطه."],["أنشئ حسابك","مرّر إلى أعلى الصفحة واضغط الزر الذهبي المكتوب عليه «افتح حسابك». يفتح CopyX في تبويب جديد — وسترى شعار COPY-X الأسود. استخدم اسمك وبياناتك الحقيقية: يجب أن تطابق الهوية التي ترفعها لاحقاً. اختر password لا تستخدمه في أي مكان آخر. مهم: خانة الدولة تأتي محدَّدة على ألبانيا عند الجميع — غيّرها إلى بلد إقامتك الفعلي، لأن مفتاح الهاتف يتغيّر معها. ثم ضع علامة في المربعين، وانتظر حتى ينتهي مربع «Verifying…» الرمادي الصغير في الأسفل، واضغط Sign Up. والضغط عليه قبل انتهاء التحقق لا يفعل شيئاً.",{"img":"assets/shot-register.jpg","alt":"استمارة التسجيل في CopyX","marks":[{"n":1,"x":24,"y":32,"t":"اسمك الحقيقي. يجب أن يطابق الهوية التي ترفعها بعد قليل، وإلا فسيفشل التحقق."},{"n":2,"x":24,"y":45,"t":"اختر password لا تستخدمه في أي مكان آخر — ولا تستخدم نفس password بريدك الإلكتروني."},{"n":3,"x":9,"y":66,"t":"علّم المربعين. اقرأهما أولاً — فهما يقولان إنك قد تخسر مالك."},{"n":4,"x":50,"y":87,"t":"إذا رأيت هذا المربع الأصفر، فرابطك كان ينقصه رمز الدعوة. ارجع وافتح رابط الـ sponsor بدلاً منه."},{"n":5,"x":24,"y":56,"t":"هذه الخانة تأتي محدَّدة على ألبانيا عند الجميع. غيّرها — فمفتاح الهاتف يتغيّر معها."}]}],["اربط حساب الـ broker — هذه الخطوة مهمة","بعد أن تدخل إلى الـ portal، ابحث عن زر Login to CopyX واستخدمه لإنشاء حساب Tag Markets الخاص بك. ولا تُنشئ الحساب بنفسك على CopyX أو عند الـ broker مباشرةً: الحساب الذي يُنشأ بهذه الطريقة لا يكون مرتبطاً بحسابك هنا، ولن يُحتسب لك شيء بعد ذلك.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"شاهد هذه الخطوة"},"note":"النص في الـ portal صريح: سجّل حساب Tag Markets الخاص بك عبر ذلك الزر حصراً.","img":"assets/shot-copyx-register.jpg","alt":"لوحة تسجيل CopyX داخل الـ IB portal","marks":[{"n":1,"x":34,"y":37,"t":"اقرأ هذا السطر. فهو يطلب منك أن تُنشئ حساب الـ broker من هنا، لا من أي مكان آخر."},{"n":2,"x":13,"y":71,"t":"هذا هو الزر. مكتوب عليه Login to CopyX — استخدمه حتى في المرة الأولى."},{"n":3,"x":50,"y":90,"t":"التحذير بالأصفر: الحساب الذي يُنشأ مباشرةً على CopyX لن يكون مرتبطاً بحسابك هنا."}]}],["أكّد هويتك","ستحتاج إلى بطاقة هويتك أو جواز سفرك، وإلى مستند يُظهر عنوانك. صوّرهما في ضوء جيد مع ظهور زواياها الأربع كاملة. والصورة غير الواضحة هي السبب الأول للرفض، وليس السبب شيئاً أخطر من ذلك.",{"img":"assets/shot-kyc.jpg","alt":"لوحة رفع المستندات","marks":[{"n":1,"x":50,"y":44,"t":"اختر نوع المستند من هنا أولاً. لا يُرفع شيء قبل ذلك."},{"n":2,"x":50,"y":75,"t":"هذا السطر الأصفر طبيعي قبل الرفع. وهو ليس خطأً."},{"n":3,"x":90,"y":5,"t":"كلمة Validate تعني أن الـ broker لم يفحص مستنداتك بعد."}]}],["انتظر الموافقة","التحقق يستغرق عادةً وقتاً قصيراً. وإلى أن يكتمل، لن يسمح لك الـ broker بإيداع المال — وسترى هذا التنبيه في صفحة الـ wallet. وهذا طبيعي، وليس خطأً.",{"img":"assets/shot-wallet-kyc.jpg","alt":"صفحة الـ wallet تُظهر وجوب إكمال KYC أولاً","marks":[{"n":1,"x":50,"y":30,"t":"هذا السطر الزهري يعني أن التحقق ما زال قيد الانتظار. ويختفي بعد الموافقة على مستنداتك."}]}],["اتصل بـ Sonic copy trading","هذه هي الخطوة التي تبدأ النسخ فعلياً. وقبلها قد يبقى المال في الحساب دون أن تُنفَّذ أي صفقة. ادخل إلى Tag Markets، وافتح CopyX من القائمة، واضغط Details، واختر SONIC، ثم اضغط Connect. بعدها أربعة حقول: المبلغ الذي تبدأ به (بحد أدنى $10)، /* An IB's sign-up link carries an opaque token (?e=...), not their IB number,
   so the whole link travels as ?ref= and only these hosts are accepted. */
const REF_ALLOWED_HOSTS = ["aitech.sonicpilot.io","copyxapp.com","www.copyxapp.com",
                           "aitech.ibportal.io","portal.tagmarkets.com","tagmarkets.com"];
const REF_HOUSE = "";

let lang = C.langs[0].code, sponsorUrl = null, pendingRef = null;
const $ = id => document.getElementById(id);
const conf = code => C.langs.find(l => l.code === code) || C.langs[0];
function store(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* Nothing becomes an href unless it is plain http(s). */
function safeUrl(u){
  try{ const p = new URL(String(u), location.href).protocol;
       return p === "https:" || p === "http:"; }catch(e){ return false; }
}
/* Images belong to this page. Anything off-origin is skipped. */
function sameOrigin(u){
  try{ return new URL(String(u), location.href).origin === location.origin; }catch(e){ return false; }
}
function validRef(raw){
  if(!raw) return null;
  let u;
  try{ u = new URL(String(raw).trim()); }catch(e){ return null; }
  if(u.protocol !== "https:") return null;
  return REF_ALLOWED_HOSTS.indexOf(u.hostname) !== -1 ? u : null;
}
const urlRef    = () => validRef(new URLSearchParams(location.search).get("ref"));
const storedRef = () => validRef(load("aimpire.ref"));
function fingerprint(u){
  const t = u.searchParams.get("e") || u.search || u.pathname;
  return String(t).replace(/[^A-Za-z0-9]/g,"").slice(-6).toUpperCase();
}

/* Decided once, on load. Rendering never writes. A different link does not
   silently replace a remembered sponsor — that would let anyone re-tag
   someone else's lead just by having them open a page. We ask. */
function initSponsor(){
  const fromUrl = urlRef(), remembered = storedRef();
  if(!fromUrl){ sponsorUrl = remembered; return; }
  if(!remembered){ store("aimpire.ref", fromUrl.href); sponsorUrl = fromUrl; }
  else if(remembered.href === fromUrl.href){ sponsorUrl = remembered; }
  else { sponsorUrl = remembered; pendingRef = fromUrl; }
}
function keepSponsor(){ pendingRef = null; render(); }
function switchSponsor(){
  if(pendingRef){ store("aimpire.ref", pendingRef.href); sponsorUrl = pendingRef; pendingRef = null; }
  render();
}
function changeSponsor(){
  store("aimpire.ref", null); sponsorUrl = null; pendingRef = null;
  if(location.search) history.replaceState(null,"",location.pathname);
  render();
}
function destination(){
  return sponsorUrl
    ? { url:sponsorUrl.href, host:sponsorUrl.hostname, fp:fingerprint(sponsorUrl) }
    : { url:REF_HOUSE, host:null, fp:null };
}

function makeLink(){
  const u = validRef($("ld-in").value), out = $("ld-out"), L = C.leaders[lang] || C.leaders.en;
  out.hidden = false; out.textContent = "";
  const b = document.createElement("b");
  if(!u){ out.className = "out bad"; b.textContent = L.bad; out.appendChild(b); return; }
  out.className = "out";
  b.textContent = L.ok; out.appendChild(b);
  const link = location.origin + location.pathname + "?ref=" + encodeURIComponent(u.href);
  out.appendChild(document.createTextNode(link));
  try{ navigator.clipboard.writeText(link); }catch(e){}
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined) n.textContent = text;
  return n;
}

function rowsFor(items, dest){
  const frag = document.createDocumentFragment();
  const list = el("div","rows");
  let any = false;
  items.forEach(function(i){
    const href = i.url === "__REF__" ? dest.url : i.url;
    if(!href || !safeUrl(href)) return;
    const pair = i[lang] || i.en;
    any = true;
    const a = el("a", i.primary ? "slab" : "row");
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.appendChild(el("span","t",pair[0]));
    a.appendChild(el("span","s",pair[1]));
    if(i.primary){ frag.appendChild(a); }
    else { a.appendChild(el("span","go","›")); list.appendChild(a); }
  });
  if(list.children.length) frag.appendChild(list);
  return any ? frag : null;
}

function render(){
  const dest = destination();

  $("h1").textContent = C.hero[lang].line1;
  $("h2").textContent = C.hero[lang].line2;
  $("hsub").textContent = C.hero[lang].sub;

  Object.keys(C.sections).forEach(function(k){
    const h = $("t-" + k);
    if(!h) return;
    h.textContent = C.sections[k][lang] || C.sections[k].en;
    h.appendChild(document.createElement("b"));
  });

  const S = C.sponsor[lang] || C.sponsor.en;
  const sp = $("spon"); sp.textContent = "";
  if(dest.host){
    sp.hidden = false;
    sp.appendChild(document.createTextNode(S.goes_to + " "));
    sp.appendChild(el("strong",null,dest.host));
    sp.appendChild(document.createTextNode(" " + S.fingerprint + " "));
    sp.appendChild(el("span","fp",dest.fp));
    sp.appendChild(document.createTextNode(" "));
    const c = el("button",null,S.change); c.onclick = changeSponsor; sp.appendChild(c);
  } else { sp.hidden = true; }

  const none = $("notice-none"), cf = $("notice-conflict");
  none.hidden = !(!sponsorUrl && !REF_HOUSE && !pendingRef);
  if(!none.hidden){
    $("nn-t").textContent = S.none_title;
    $("nn-b").textContent = S.none_body;
    $("nn-f").textContent = S.none_foot;
  }
  cf.hidden = !pendingRef;
  if(pendingRef){
    const A = fingerprint(sponsorUrl), B = fingerprint(pendingRef);
    $("nc-t").textContent = S.conflict.replace("{A}",A).replace("{B}",B);
    const k = $("nc-keep"), u = $("nc-use");
    k.textContent = S.keep.replace("{A}",A); k.onclick = keepSponsor;
    u.textContent = S.use.replace("{B}",B);  u.onclick = switchSponsor;
  }

  ["main","platform","video","docs","help"].forEach(function(key){
    const host = $(key + "-links"); if(!host) return;
    host.textContent = "";
    const frag = rowsFor(C.links[key], dest);
    if(frag) host.appendChild(frag);
    const sec = $("s-" + key);
    if(sec && key !== "main") sec.hidden = !frag;
  });

  const G = C.guide[lang] || C.guide.en;
  $("guide-lede").textContent = G.lede;
  const gl = $("guide"); gl.textContent = "";
  G.steps.forEach(function(st){
    const li = document.createElement("li");
    li.appendChild(el("h3",null,st[0]));
    li.appendChild(el("p",null,st[1]));
    const x = st[2];
    if(x && x.note) li.appendChild(el("p","vnote",x.note));
    if(x && x.video && safeUrl(x.video.url)){
      const row = el("div","langs");
      const a = el("a",null,x.video.label);
      a.href = x.video.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      row.appendChild(a);
      li.appendChild(row);
    }
    /* No video in this language yet. Say so, rather than offering another
       language — a list of every language except yours reads as an insult. */
    if(x && x.soon) li.appendChild(el("p","soon",x.soon));
    if(x && x.img && sameOrigin(x.img)){
      const fig = el("div","shot");
      const im = document.createElement("img");
      im.src = x.img; im.alt = x.alt || ""; im.loading = "lazy";
      fig.appendChild(im);
      (x.marks || []).forEach(function(m){
        const pin = el("span","pin",String(m.n));
        pin.style.insetInlineStart = m.x + "%"; pin.style.top = m.y + "%";
        fig.appendChild(pin);
      });
      li.appendChild(fig);
      if(x.marks && x.marks.length){
        const ul = el("ul","keys");
        x.marks.forEach(function(m){ ul.appendChild(el("li",null,m.t)); });
        li.appendChild(ul);
      }
    }
    gl.appendChild(li);
  });

  /* Three places, three names. This block existed in content.json in every
     language for a day without ever being drawn - nothing referenced it. */
  const PL = C.places;
  const ps = $("s-places");
  if(PL && PL.items && PL.items[lang]){
    ps.hidden = false;
    $("t-places").textContent = (PL.title[lang] || PL.title.en);
    $("t-places").appendChild(document.createElement("b"));
    $("places-lede").textContent = (PL.lede[lang] || PL.lede.en);
    const pu = $("places"); pu.textContent = "";
    (PL.items[lang] || PL.items.en).forEach(function(it){
      const li = document.createElement("li");
      li.appendChild(el("h3",null,it[0]));
      li.appendChild(el("p",null,it[1]));
      pu.appendChild(li);
    });
  } else { ps.hidden = true; }

  const E = C.earn[lang] || C.earn.en;
  $("earn-lede").textContent = E.intro;
  const le = $("earn-list"); le.textContent = "";
  E.items.forEach(function(it){
    const li = document.createElement("li");
    li.appendChild(el("h3",null,it[0]));
    li.appendChild(el("p",null,it[1]));
    le.appendChild(li);
  });
  const es = C.earn_shot;
  const eh = $("earn-shot"); eh.textContent = "";
  if(es && es.img && sameOrigin(es.img)){
    const fig = el("div","shot");
    const im = document.createElement("img");
    im.src = es.img; im.alt = (es.alt && (es.alt[lang] || es.alt.en)) || ""; im.loading = "lazy";
    fig.appendChild(im);
    const mk = (es.marks && (es.marks[lang] || es.marks.en)) || [];
    mk.forEach(function(m){
      const pin = el("span","pin",String(m.n));
      pin.style.insetInlineStart = m.x + "%"; pin.style.top = m.y + "%";
      fig.appendChild(pin);
    });
    eh.appendChild(fig);
    if(mk.length){
      const ul = el("ul","keys");
      mk.forEach(function(m){ ul.appendChild(el("li",null,m.t)); });
      eh.appendChild(ul);
    }
  }
  $("earn-warn").textContent = E.warning;

  const tl = $("tiers"); tl.textContent = "";
  (C.values[lang] || C.values.en).forEach(function(v){
    const li = document.createElement("li");
    /* Was a single 2rem letter in one of four bright colours, which read as
       a children's alphabet chart. The word carries the idea; the acronym
       survives because the initial is marked inside it. */
    const box = document.createElement("div");
    const word = String(v[1] || "");
    const h3 = el("h3");
    h3.appendChild(el("span","ini",word.slice(0,1)));
    h3.appendChild(document.createTextNode(word.slice(1)));
    box.appendChild(h3);
    box.appendChild(el("p",null,v[2]));
    li.appendChild(box); tl.appendChild(li);
  });

  const L = C.leaders[lang] || C.leaders.en;
  $("ld-body").textContent = L.body;
  $("ld-in").placeholder = L.placeholder;
  $("ld-btn").textContent = L.button;

  $("risk").textContent = C.risk[lang] || C.risk.en;
  $("yr").textContent = new Date().getFullYear();
}

function buildSwitch(){
  const nav = $("switch"); nav.textContent = "";
  C.langs.forEach(function(L){
    const b = el("button",null,L.label);
    b.id = "L-" + L.code;
    b.setAttribute("aria-pressed", String(L.code === lang));
    b.onclick = function(){ setLang(L.code); };
    nav.appendChild(b);
  });
  const th = el("button","thm","◐");
  th.setAttribute("aria-label","Light or dark");
  th.onclick = toggleTheme;
  nav.appendChild(th);
}

function setLang(code){
  const L = conf(code);
  lang = L.code;
  document.documentElement.lang = L.code;
  document.documentElement.dir = L.dir;
  document.documentElement.setAttribute("data-font", L.font);
  C.langs.forEach(function(x){
    const b = $("L-" + x.code);
    if(b) b.setAttribute("aria-pressed", String(x.code === lang));
  });
  store("aimpire.lang", lang);
  render();
}
function toggleTheme(){
  const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  store("aimpire.theme", next);
}
(function(){
  const th = load("aimpire.theme");
  if(th) document.documentElement.setAttribute("data-theme", th);
  let l = load("aimpire.lang");
  if(!C.langs.some(function(x){ return x.code === l; })){
    const nav = ((navigator.language || "") + " " + (navigator.languages || []).join(" ")).toLowerCase();
    const hit = C.langs.find(function(x){ return new RegExp("\\b" + x.code + "\\b|" + x.code + "-").test(nav); });
    l = hit ? hit.code : C.langs[0].code;
  }
  initSponsor();
  buildSwitch();
  setLang(l);
})();
</script>
</body>
</html>
