<style>
/* Aimpire's own palette, from "Presentation - Aimpire" — the only deck
   without a partner layered on top. Navy, gold, lime, logo gradient. */
:root{
  --ink:#0B2341; --ink-deep:#071A31; --ink-raise:#123055;
  --gold:#E8B84B; --gold-soft:#F3CE78; --gold-deep:#C99A2E;
  --lime:#A8D44A; --red:#E0483C;
  --chalk:#F5F3EF; --chalk-dim:#9DB0C9; --rule:#1E3D66;
  --v1:#E8B84B; --v2:#4EA8DE; --v3:#A8D44A; --v4:#E8833A;
  --grad:linear-gradient(118deg,#1B4FD8 0%,#15D8C4 33%,#C21FBF 68%,#FBE16B 100%);
  --measure:36rem;
  --face:"Montserrat",system-ui,-apple-system,sans-serif;
}
:root[data-theme="light"]{
  --ink:#F5F3EF; --ink-deep:#E7E3DB; --ink-raise:#FFFFFF;
  --chalk:#0B2341; --chalk-dim:#5A7093; --rule:#D3D8E2; --gold-soft:#8A6410;
}
html[data-font="deva"]{ --face:"Noto Sans Devanagari","Montserrat",sans-serif }
html[data-font="nastaliq"]{ --face:"Noto Nastaliq Urdu","Montserrat",serif }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font-family:var(--face);
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[data-font="nastaliq"] body{line-height:2.15}
html[data-font="deva"] body{line-height:1.8}
.shell{max-width:46rem;margin:0 auto;padding:0 clamp(18px,5vw,40px) 72px}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
[hidden]{display:none !important}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:26px 0 0;border-bottom:1px solid var(--rule)}
.wordmark{display:flex;align-items:center;gap:11px;padding-bottom:12px}
.mono{width:40px;height:40px;flex:0 0 auto;display:block}
.wordmark .wm{display:block;font-family:"Montserrat",sans-serif;font-weight:800;font-size:17px;
  letter-spacing:.13em;text-transform:uppercase;line-height:1}
.wordmark .wm em{font-style:normal;color:var(--gold)}
.wordmark .tag{display:block;margin-top:4px;font-size:9px;letter-spacing:.32em;color:var(--lime);
  font-weight:700;font-family:"Montserrat",sans-serif;text-transform:uppercase}
.switch{display:flex;gap:2px;padding-bottom:8px;flex-wrap:wrap}
.switch button{background:none;border:0;border-bottom:2px solid transparent;color:var(--chalk-dim);
  font:inherit;font-size:13.5px;font-weight:600;padding:5px 9px;cursor:pointer;
  font-family:"Montserrat",sans-serif;min-height:34px}
.switch button[aria-pressed="true"]{color:var(--chalk);border-bottom-color:var(--gold)}
.switch .thm{font-size:15px}

/* hero */
.hero{padding:52px 0 40px}
.hero h1{margin:0;font-family:"Montserrat",sans-serif;font-weight:900;
  font-size:clamp(2.6rem,11vw,4.9rem);line-height:.98;letter-spacing:-.035em;
  text-transform:uppercase;text-wrap:balance}
html[data-font="deva"] .hero h1,html[data-font="nastaliq"] .hero h1{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.3;
  font-size:clamp(2rem,8vw,3.4rem)}
.hero h1 span{display:block}
.hero h1 span:last-child{background:var(--grad);-webkit-background-clip:text;
  background-clip:text;color:transparent}
@supports not (background-clip:text){ .hero h1 span:last-child{color:var(--gold)} }
.hero p{margin:26px 0 0;max-width:var(--measure);color:var(--chalk-dim);font-size:1.02rem}
@media (prefers-reduced-motion:no-preference){
  .hero h1 span{animation:rise .55s cubic-bezier(.2,.7,.3,1) both}
  .hero h1 span:nth-child(2){animation-delay:.07s}
}
@keyframes rise{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}

/* sections */
.sec{padding:50px 0 0}
.sec > h2{margin:0 0 22px;font-size:1.32rem;font-weight:800;letter-spacing:.01em;
  color:var(--gold);font-family:"Montserrat",sans-serif}
html[data-font="deva"] .sec > h2,html[data-font="nastaliq"] .sec > h2{
  font-family:var(--face);letter-spacing:0}
.sec > h2 b{display:block;width:46px;height:3px;background:var(--grad);margin-top:11px}
.lede{max-width:var(--measure);color:var(--chalk-dim);margin:0 0 26px}

/* sponsor */
.spon{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin:30px 0 0;
  padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  font-size:.86rem;color:var(--chalk-dim)}
.spon strong{color:var(--chalk);font-weight:700}
.spon .fp{font-variant-numeric:tabular-nums;color:var(--lime);font-weight:700}
.spon button{background:none;border:0;color:var(--gold-soft);font:inherit;font-size:.86rem;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* primary action */
.slab{display:block;background:var(--grad);color:#071A31;text-decoration:none;
  padding:22px 24px;margin:0 0 2px;border:0}
.slab .t{display:block;font-family:"Montserrat",sans-serif;font-weight:900;font-size:1.4rem;
  letter-spacing:.01em;line-height:1.12;text-transform:uppercase}
html[data-font="deva"] .slab .t,html[data-font="nastaliq"] .slab .t{
  font-family:var(--face);text-transform:none;letter-spacing:0;line-height:1.7}
.slab .s{display:block;margin-top:5px;font-size:.9rem;opacity:.72;font-weight:600}
.slab:hover,.slab:focus-visible{filter:brightness(1.12)}

/* ruled link rows */
.rows{border-top:1px solid var(--rule)}
.row{display:flex;align-items:baseline;gap:14px;padding:16px 2px;
  border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.row .t{font-weight:700;font-size:1.04rem;letter-spacing:-.01em}
.row .s{color:var(--chalk-dim);font-size:.88rem;flex:1}
.row:hover .t,.row:focus-visible .t{color:var(--gold-soft)}
.row .go{color:var(--rule);font-weight:700;font-family:"Montserrat",sans-serif}
.row:hover .go{color:var(--gold)}
html[dir="rtl"] .row .go{transform:scaleX(-1)}

/* short list */
.rail{list-style:none;margin:0;padding:0;position:relative;counter-reset:n}
.rail::before{content:"";position:absolute;inset-block:14px;inset-inline-start:13px;
  width:1px;background:var(--rule)}
.rail > li{position:relative;padding:0 0 26px;padding-inline-start:46px;max-width:var(--measure)}
.rail > li:last-child{padding-bottom:0}
.rail > li::before{content:counter(n);counter-increment:n;position:absolute;inset-inline-start:0;
  top:-1px;width:27px;height:27px;border:1px solid var(--rule);border-radius:50%;
  background:var(--ink);color:var(--chalk-dim);display:grid;place-items:center;
  font-size:.8rem;font-weight:700;font-family:"Montserrat",sans-serif}

/* step-by-step guide */
.guide{list-style:none;counter-reset:g;margin:0;padding:0;position:relative}
.guide::before{content:"";position:absolute;inset-block:16px;inset-inline-start:15px;
  width:1px;background:var(--rule)}
.guide > li{counter-increment:g;position:relative;padding:0 0 26px;padding-inline-start:52px;
  max-width:var(--measure)}
.guide > li:last-child{padding-bottom:0}
.guide > li::before{content:counter(g);position:absolute;inset-inline-start:0;top:-2px;
  width:31px;height:31px;border-radius:50%;background:var(--ink);border:1px solid var(--gold);
  color:var(--gold);display:grid;place-items:center;font-size:.85rem;font-weight:800;
  font-family:"Montserrat",sans-serif}
.guide h3{margin:0 0 5px;font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.guide p{margin:0;color:var(--chalk-dim);font-size:.95rem}

/* language chips for the partner's own videos */
.vnote{margin:12px 0 0;padding:11px 14px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold);font-size:.86rem;color:var(--chalk-dim)}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.langs a{display:inline-block;padding:7px 12px;border:1px solid var(--rule);border-radius:999px;
  font-size:.82rem;font-weight:600;text-decoration:none;color:var(--chalk-dim);
  font-family:"Montserrat",sans-serif;background:var(--ink-deep)}
.langs a:hover,.langs a:focus-visible{border-color:var(--gold);color:var(--gold)}
.soon{margin:12px 0 0;font-size:.86rem;color:var(--chalk-dim);font-style:italic}

/* annotated screenshot */
.shot{margin:14px 0 0;position:relative;max-width:300px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:6px}
.pin{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--gold);
  color:var(--ink);font:800 12px/1 "Montserrat",sans-serif;display:grid;place-items:center;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(11,35,65,.85);pointer-events:none}
html[dir="rtl"] .pin{transform:translate(50%,-50%)}
.keys{list-style:none;margin:12px 0 0;padding:0;counter-reset:k}
.keys li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:.88rem;
  color:var(--chalk-dim)}
.keys li::before{content:counter(k);counter-increment:k;flex:0 0 auto;width:20px;height:20px;
  border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;
  font:800 11px/1 "Montserrat",sans-serif;margin-top:2px}

/* earnings */
.earn{margin:0;padding:0;list-style:none}
.earn > li{padding:0 0 22px;max-width:var(--measure);position:relative;padding-inline-start:20px}
.earn > li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;
  width:8px;height:8px;background:var(--gold)}
.earn h3{margin:0 0 3px;font-size:1.04rem;font-weight:700;letter-spacing:-.01em}
.earn p{margin:0;color:var(--chalk-dim);font-size:.93rem}
.warn{max-width:var(--measure);margin:8px 0 0;padding:18px 20px;background:var(--ink-deep);
  border-inline-start:3px solid var(--gold);font-size:.93rem}

/* values — tiers that widen */
.tiers{margin:0;padding:0;list-style:none}
.tiers > li{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;margin-bottom:3px;
  background:var(--ink-raise);border-inline-start:3px solid var(--gold)}
.tiers > li:nth-child(1){width:76%;border-inline-start-color:var(--v1)}
.tiers > li:nth-child(2){width:84%;border-inline-start-color:var(--v2)}
.tiers > li:nth-child(3){width:92%;border-inline-start-color:var(--v3)}
.tiers > li:nth-child(4){width:100%;border-inline-start-color:var(--v4)}
.tiers > li:nth-child(1) .ltr{color:var(--v1)} .tiers > li:nth-child(2) .ltr{color:var(--v2)}
.tiers > li:nth-child(3) .ltr{color:var(--v3)} .tiers > li:nth-child(4) .ltr{color:var(--v4)}
@media (max-width:560px){ .tiers > li{width:100% !important} }
.tiers .ltr{font-family:"Montserrat",sans-serif;font-weight:900;font-size:2rem;line-height:.85;
  flex:0 0 auto;width:1.1em}
.tiers h3{margin:0 0 3px;font-size:1rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;font-family:"Montserrat",sans-serif}
html[data-font="deva"] .tiers h3,html[data-font="nastaliq"] .tiers h3{
  font-family:"Montserrat",sans-serif}
.tiers p{margin:0;color:var(--chalk-dim);font-size:.92rem}

/* notices */
.notice{max-width:var(--measure);padding:22px 24px;background:var(--ink-raise);
  border-inline-start:3px solid var(--lime)}
.notice.alert{border-inline-start-color:var(--gold)}
.notice h3{margin:0 0 8px;font-size:1.1rem;font-weight:700}
.notice p{margin:0 0 10px;color:var(--chalk-dim);font-size:.94rem}
.notice p:last-child{margin-bottom:0}
.notice .foot{font-size:.85rem;padding-top:12px;margin-top:14px;border-top:1px solid var(--rule)}
.choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.choice button{flex:1 1 150px;padding:13px;border:1px solid var(--rule);background:none;
  color:var(--chalk);font:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
  font-family:"Montserrat",sans-serif}
.choice button:first-child{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* leader tool */
.tool{max-width:var(--measure)}
.tool p{color:var(--chalk-dim);font-size:.94rem;margin:0 0 16px}
.tool input{width:100%;background:var(--ink-deep);border:1px solid var(--rule);color:var(--chalk);
  padding:14px 15px;font:inherit;font-size:.95rem;font-family:"Montserrat",sans-serif;
  margin-bottom:8px}
.tool input:focus{border-color:var(--gold);outline:none}
.tool button{width:100%;background:var(--chalk);color:var(--ink);border:0;padding:15px;
  font:inherit;font-weight:700;font-size:.98rem;cursor:pointer;font-family:"Montserrat",sans-serif}
.out{margin-top:14px;padding:14px 15px;background:var(--ink-deep);border:1px solid var(--rule);
  font-size:.8rem;word-break:break-all;line-height:1.7}
.out b{display:block;color:var(--lime);margin-bottom:6px;font-size:.85rem}
.out.bad b{color:var(--gold-soft)}

.risk{max-width:var(--measure);margin:56px 0 0;padding-top:20px;border-top:1px solid var(--rule);
  color:var(--chalk-dim);font-size:.85rem}
.sig{margin:30px 0 0;font-size:.8rem;color:var(--chalk-dim);font-family:"Montserrat",sans-serif}
</style>
</head>
<body>
<div class="shell">

  <header class="mast">
    <div class="wordmark">
      <img class="mono" src="assets/ap-gradient.png" alt="" width="40" height="40">
      <span><span class="wm">Aim<em>pire</em></span><span class="tag">Aim for it</span></span>
    </div>
    <nav class="switch" id="switch" aria-label="Language"></nav>
  </header>

  <section class="hero">
    <h1><span id="h1"></span><span id="h2"></span></h1>
    <p id="hsub"></p>
    <div class="spon" id="spon" hidden></div>
  </section>

  <section class="sec" id="s-main">
    <h2 id="t-main"></h2>
    <div class="notice" id="notice-none" hidden>
      <h3 id="nn-t"></h3><p id="nn-b"></p><p class="foot" id="nn-f"></p>
    </div>
    <div class="notice alert" id="notice-conflict" hidden>
      <p id="nc-t"></p>
      <div class="choice"><button id="nc-keep"></button><button id="nc-use"></button></div>
    </div>
    <div id="main-links"></div>
  </section>

  <section class="sec">
    <h2 id="t-guide"></h2>
    <p class="lede" id="guide-lede"></p>
    <ol class="guide" id="guide"></ol>
  </section>

  <section class="sec" id="s-platform"><h2 id="t-platform"></h2><div id="platform-links"></div></section>

  <section class="sec">
    <h2 id="t-earn"></h2>
    <p class="lede" id="earn-lede"></p>
    <ul class="earn" id="earn-list"></ul>
    <div id="earn-shot"></div>
    <p class="warn" id="earn-warn"></p>
  </section>

  <section class="sec"><h2 id="t-values"></h2><ul class="tiers" id="tiers"></ul></section>
  <section class="sec" id="s-video"><h2 id="t-video"></h2><div id="video-links"></div></section>
  <section class="sec" id="s-docs"><h2 id="t-docs"></h2><div id="docs-links"></div></section>
  <section class="sec" id="s-help"><h2 id="t-help"></h2><div id="help-links"></div></section>

  <section class="sec">
    <h2 id="t-leaders"></h2>
    <div class="tool">
      <p id="ld-body"></p>
      <input id="ld-in" type="url" autocomplete="off" spellcheck="false">
      <button id="ld-btn" onclick="makeLink()"></button>
      <div class="out" id="ld-out" hidden></div>
    </div>
  </section>

  <p class="risk" id="risk"></p>
  <p class="sig">Aimpire &middot; <span id="yr"></span></p>
</div>

ाल","एक बार, ठीक से उत्तर दिए गए"]},{"url":"https://intercom.help/tag-markets/en/articles/10088332-how-to-change-your-account-password","en":["Change your password","Do this if you ever shared it"],"ur":["اپنا پاس ورڈ بدلیں","اگر کبھی کسی کو بتایا ہو تو ضرور کریں"],"no":["Bytt passord","Gjør dette hvis du har delt det"],"hi":["अपना पासवर्ड बदलें","अगर कभी किसी को बताया हो तो ज़रूर करें"]},{"url":"https://intercom.help/tag-markets/en/articles/10313927-how-to-recover-the-dashboard-password","en":["Locked out of the dashboard","How to recover access"],"ur":["ڈیش بورڈ سے باہر؟","رسائی دوبارہ حاصل کرنے کا طریقہ"],"no":["Låst ute av dashbordet","Slik får du tilgang igjen"],"hi":["डैशबोर्ड से बाहर?","पहुँच वापस कैसे पाएँ"]}]},"guide":{"en":{"lede":"About two minutes. At the end your account is open and sent for verification.","steps":[["Use your sponsor's link","Open the link the person who invited you sent — theirs, not one from a group. The line above shows who your sign-up goes to. Check it says the right person."],["Create your account","Press the button below. Enter your name, email and phone. Use your real details — they have to match the ID you upload later. Choose a password you do not use anywhere else.",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"Your real name. It must match the ID you upload next, or verification fails."},{"n":2,"x":24,"y":45,"t":"A password you use nowhere else. Not your email password."},{"n":3,"x":9,"y":66,"t":"Tick both. Read them first — they say you can lose money."},{"n":4,"x":50,"y":87,"t":"No invitation code? You opened the wrong link. Ask your sponsor for theirs."}]}],["Link your broker account — this step matters","Once you are inside the portal, find the Login to CopyX button and use that to create your Tag Markets account. Do not go to CopyX or the broker and sign up separately: an account made that way is not synchronised, and nothing will track correctly afterwards.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Watch this step"},"note":"The portal says it plainly: register your Tag Markets account exclusively using that button.","img":"assets/shot-copyx-register.jpg","alt":"The CopyX Registration panel in the IB portal","marks":[{"n":1,"x":34,"y":37,"t":"Read this line. It tells you to create the broker account from here, not anywhere else."},{"n":2,"x":13,"y":71,"t":"This is the button. It says Login to CopyX — use it even the first time."},{"n":3,"x":50,"y":90,"t":"The warning in yellow: an account made directly on CopyX will not be linked."}]}],["Verify your identity","You will need your ID card or passport, and something showing your address. Photograph them in good light with all four corners visible. A blurry photo is the main reason people get rejected — not anything serious.",{"img":"assets/shot-kyc.jpg","alt":"The Upload Documents panel","marks":[{"n":1,"x":50,"y":44,"t":"Pick the document type here first. Nothing uploads until you do."},{"n":2,"x":50,"y":75,"t":"This yellow line is normal before you upload. It is not an error."},{"n":3,"x":90,"y":5,"t":"Validate means the broker has not checked your documents yet."}]}],["Wait for approval","Verification usually takes a short while. Until it comes through, the broker will not let you add money — you will see this notice on the wallet page. That is normal, not an error.",{"img":"assets/shot-wallet-kyc.jpg","alt":"The wallet page showing that KYC must be completed first","marks":[{"n":1,"x":50,"y":30,"t":"This pink line means verification is still pending. It disappears once your documents are approved."}]}],["Join the group","That is where questions get answered — nobody there started out knowing anything either. When you fund the account later, it is worth starting small."]]},"ur":{"lede":"تقریباً دو منٹ۔ آخر میں آپ کا اکاؤنٹ کھل جائے گا اور تصدیق کے لیے چلا جائے گا۔","steps":[["اپنے سپانسر کا لنک استعمال کریں","وہ لنک کھولی /* An IB's sign-up link carries an opaque token (?e=...), not their IB number,
   so the whole link travels as ?ref= and only these hosts are accepted. */
const REF_ALLOWED_HOSTS = ["aitech.sonicpilot.io","copyxapp.com","www.copyxapp.com",
                           "aitech.ibportal.io","portal.tagmarkets.com","tagmarkets.com"];
const REF_HOUSE = "";

let lang = C.langs[0].code, sponsorUrl = null, pendingRef = null;
const $ = id => document.getElementById(id);
const conf = code => C.langs.find(l => l.code === code) || C.langs[0];
function store(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* Nothing becomes an href unless it is plain http(s). */
function safeUrl(u){
  try{ const p = new URL(String(u), location.href).protocol;
       return p === "https:" || p === "http:"; }catch(e){ return false; }
}
/* Images belong to this page. Anything off-origin is skipped. */
function sameOrigin(u){
  try{ return new URL(String(u), location.href).origin === location.origin; }catch(e){ return false; }
}
function validRef(raw){
  if(!raw) return null;
  let u;
  try{ u = new URL(String(raw).trim()); }catch(e){ return null; }
  if(u.protocol !== "https:") return null;
  return REF_ALLOWED_HOSTS.indexOf(u.hostname) !== -1 ? u : null;
}
const urlRef    = () => validRef(new URLSearchParams(location.search).get("ref"));
const storedRef = () => validRef(load("aimpire.ref"));
function fingerprint(u){
  const t = u.searchParams.get("e") || u.search || u.pathname;
  return String(t).replace(/[^A-Za-z0-9]/g,"").slice(-6).toUpperCase();
}

/* Decided once, on load. Rendering never writes. A different link does not
   silently replace a remembered sponsor — that would let anyone re-tag
   someone else's lead just by having them open a page. We ask. */
function initSponsor(){
  const fromUrl = urlRef(), remembered = storedRef();
  if(!fromUrl){ sponsorUrl = remembered; return; }
  if(!remembered){ store("aimpire.ref", fromUrl.href); sponsorUrl = fromUrl; }
  else if(remembered.href === fromUrl.href){ sponsorUrl = remembered; }
  else { sponsorUrl = remembered; pendingRef = fromUrl; }
}
function keepSponsor(){ pendingRef = null; render(); }
function switchSponsor(){
  if(pendingRef){ store("aimpire.ref", pendingRef.href); sponsorUrl = pendingRef; pendingRef = null; }
  render();
}
function changeSponsor(){
  store("aimpire.ref", null); sponsorUrl = null; pendingRef = null;
  if(location.search) history.replaceState(null,"",location.pathname);
  render();
}
function destination(){
  return sponsorUrl
    ? { url:sponsorUrl.href, host:sponsorUrl.hostname, fp:fingerprint(sponsorUrl) }
    : { url:REF_HOUSE, host:null, fp:null };
}

function makeLink(){
  const u = validRef($("ld-in").value), out = $("ld-out"), L = C.leaders[lang] || C.leaders.en;
  out.hidden = false; out.textContent = "";
  const b = document.createElement("b");
  if(!u){ out.className = "out bad"; b.textContent = L.bad; out.appendChild(b); return; }
  out.className = "out";
  b.textContent = L.ok; out.appendChild(b);
  const link = location.origin + location.pathname + "?ref=" + encodeURIComponent(u.href);
  out.appendChild(document.createTextNode(link));
  try{ navigator.clipboard.writeText(link); }catch(e){}
}

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined) n.textContent = text;
  return n;
}

function rowsFor(items, dest){
  const frag = document.createDocumentFragment();
  const list = el("div","rows");
  let any = false;
  items.forEach(function(i){
    const href = i.url === "__REF__" ? dest.url : i.url;
    if(!href || !safeUrl(href)) return;
    const pair = i[lang] || i.en;
    any = true;
    const a = el("a", i.primary ? "slab" : "row");
    a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.appendChild(el("span","t",pair[0]));
    a.appendChild(el("span","s",pair[1]));
    if(i.primary){ frag.appendChild(a); }
    else { a.appendChild(el("span","go","›")); list.appendChild(a); }
  });
  if(list.children.length) frag.appendChild(list);
  return any ? frag : null;
}

function render(){
  const dest = destination();

  $("h1").textContent = C.hero[lang].line1;
  $("h2").textContent = C.hero[lang].line2;
  $("hsub").textContent = C.hero[lang].sub;

  Object.keys(C.sections).forEach(function(k){
    const h = $("t-" + k);
    if(!h) return;
    h.textContent = C.sections[k][lang] || C.sections[k].en;
    h.appendChild(document.createElement("b"));
  });

  const S = C.sponsor[lang] || C.sponsor.en;
  const sp = $("spon"); sp.textContent = "";
  if(dest.host){
    sp.hidden = false;
    sp.appendChild(document.createTextNode(S.goes_to + " "));
    sp.appendChild(el("strong",null,dest.host));
    sp.appendChild(document.createTextNode(" " + S.fingerprint + " "));
    sp.appendChild(el("span","fp",dest.fp));
    sp.appendChild(document.createTextNode(" "));
    const c = el("button",null,S.change); c.onclick = changeSponsor; sp.appendChild(c);
  } else { sp.hidden = true; }

  const none = $("notice-none"), cf = $("notice-conflict");
  none.hidden = !(!sponsorUrl && !REF_HOUSE && !pendingRef);
  if(!none.hidden){
    $("nn-t").textContent = S.none_title;
    $("nn-b").textContent = S.none_body;
    $("nn-f").textContent = S.none_foot;
  }
  cf.hidden = !pendingRef;
  if(pendingRef){
    const A = fingerprint(sponsorUrl), B = fingerprint(pendingRef);
    $("nc-t").textContent = S.conflict.replace("{A}",A).replace("{B}",B);
    const k = $("nc-keep"), u = $("nc-use");
    k.textContent = S.keep.replace("{A}",A); k.onclick = keepSponsor;
    u.textContent = S.use.replace("{B}",B);  u.onclick = switchSponsor;
  }

  ["main","platform","video","docs","help"].forEach(function(key){
    const host = $(key + "-links"); if(!host) return;
    host.textContent = "";
    const frag = rowsFor(C.links[key], dest);
    if(frag) host.appendChild(frag);
    const sec = $("s-" + key);
    if(sec && key !== "main") sec.hidden = !frag;
  });

  const G = C.guide[lang] || C.guide.en;
  $("guide-lede").textContent = G.lede;
  const gl = $("guide"); gl.textContent = "";
  G.steps.forEach(function(st){
    const li = document.createElement("li");
    li.appendChild(el("h3",null,st[0]));
    li.appendChild(el("p",null,st[1]));
    const x = st[2];
    if(x && x.note) li.appendChild(el("p","vnote",x.note));
    if(x && x.video && safeUrl(x.video.url)){
      const row = el("div","langs");
      const a = el("a",null,x.video.label);
      a.href = x.video.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      row.appendChild(a);
      li.appendChild(row);
    }
    /* No video in this language yet. Say so, rather than offering another
       language — a list of every language except yours reads as an insult. */
    if(x && x.soon) li.appendChild(el("p","soon",x.soon));
    if(x && x.img && sameOrigin(x.img)){
      const fig = el("div","shot");
      const im = document.createElement("img");
      im.src = x.img; im.alt = x.alt || ""; im.loading = "lazy";
      fig.appendChild(im);
      (x.marks || []).forEach(function(m){
        const pin = el("span","pin",String(m.n));
        pin.style.insetInlineStart = m.x + "%"; pin.style.top = m.y + "%";
        fig.appendChild(pin);
      });
      li.appendChild(fig);
      if(x.marks && x.marks.length){
        const ul = el("ul","keys");
        x.marks.forEach(function(m){ ul.appendChild(el("li",null,m.t)); });
        li.appendChild(ul);
      }
    }
    gl.appendChild(li);
  });

  const E = C.earn[lang] || C.earn.en;
  $("earn-lede").textContent = E.intro;
  const le = $("earn-list"); le.textContent = "";
  E.items.forEach(function(it){
    const li = document.createElement("li");
    li.appendChild(el("h3",null,it[0]));
    li.appendChild(el("p",null,it[1]));
    le.appendChild(li);
  });
  const es = C.earn_shot;
  const eh = $("earn-shot"); eh.textContent = "";
  if(es && es.img && sameOrigin(es.img)){
    const fig = el("div","shot");
    const im = document.createElement("img");
    im.src = es.img; im.alt = (es.alt && (es.alt[lang] || es.alt.en)) || ""; im.loading = "lazy";
    fig.appendChild(im);
    const mk = (es.marks && (es.marks[lang] || es.marks.en)) || [];
    mk.forEach(function(m){
      const pin = el("span","pin",String(m.n));
      pin.style.insetInlineStart = m.x + "%"; pin.style.top = m.y + "%";
      fig.appendChild(pin);
    });
    eh.appendChild(fig);
    if(mk.length){
      const ul = el("ul","keys");
      mk.forEach(function(m){ ul.appendChild(el("li",null,m.t)); });
      eh.appendChild(ul);
    }
  }
  $("earn-warn").textContent = E.warning;

  const tl = $("tiers"); tl.textContent = "";
  (C.values[lang] || C.values.en).forEach(function(v){
    const li = document.createElement("li");
    li.appendChild(el("span","ltr",v[0]));
    const box = document.createElement("div");
    box.appendChild(el("h3",null,v[1]));
    box.appendChild(el("p",null,v[2]));
    li.appendChild(box); tl.appendChild(li);
  });

  const L = C.leaders[lang] || C.leaders.en;
  $("ld-body").textContent = L.body;
  $("ld-in").placeholder = L.placeholder;
  $("ld-btn").textContent = L.button;

  $("risk").textContent = C.risk[lang] || C.risk.en;
  $("yr").textContent = new Date().getFullYear();
}

function buildSwitch(){
  const nav = $("switch"); nav.textContent = "";
  C.langs.forEach(function(L){
    const b = el("button",null,L.label);
    b.id = "L-" + L.code;
    b.setAttribute("aria-pressed", String(L.code === lang));
    b.onclick = function(){ setLang(L.code); };
    nav.appendChild(b);
  });
  const th = el("button","thm","◐");
  th.setAttribute("aria-label","Light or dark");
  th.onclick = toggleTheme;
  nav.appendChild(th);
}

function setLang(code){
  const L = conf(code);
  lang = L.code;
  document.documentElement.lang = L.code;
  document.documentElement.dir = L.dir;
  document.documentElement.setAttribute("data-font", L.font);
  C.langs.forEach(function(x){
    const b = $("L-" + x.code);
    if(b) b.setAttribute("aria-pressed", String(x.code === lang));
  });
  store("aimpire.lang", lang);
  render();
}
function toggleTheme(){
  const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  store("aimpire.theme", next);
}
(function(){
  const th = load("aimpire.theme");
  if(th) document.documentElement.setAttribute("data-theme", th);
  let l = load("aimpire.lang");
  if(!C.langs.some(function(x){ return x.code === l; })){
    const nav = ((navigator.language || "") + " " + (navigator.languages || []).join(" ")).toLowerCase();
    const hit = C.langs.find(function(x){ return new RegExp("\\b" + x.code + "\\b|" + x.code + "-").test(nav); });
    l = hit ? hit.code : C.langs[0].code;
  }
  initSponsor();
  buildSwitch();
  setLang(l);
})();
</script>
</body>
</html>
