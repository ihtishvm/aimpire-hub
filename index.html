yment page پر لکھا ہے۔ آپ کا wallet خود خبردار کرتا ہے کہ network کے میل نہ کھانے کا مطلب «permanent loss of funds» ہو سکتا ہے۔\nقبول ہیں: Ethereum (ERC20)، Polygon، Tron (TRC20)، BNB (BEP20)، Bitcoin، Polkadot اور Solana۔ Arbitrum نہیں۔\nFee الگ الگ ہے: Ethereum سے 25 USDC بھیجنے پر 1.00 USDC لگے، یعنی چار فیصد۔","check":"رقم portal کے wallet صفحے پر نظر آتی ہے۔ نظر نہیں آئی؟ پہلے اپنے ہی wallet میں transaction دیکھیں۔","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71},"p2p":true}],["Sonic copy trading سے جُڑیں","یہی step copying شروع کرتا ہے — اِس کے بغیر کوئی trade نہیں ہوتی۔\nTag Markets میں CopyX کھولیں، SONIC ڈھونڈیں اور Details دبائیں۔ Card پر شرطیں ہیں: 30 % performance fee، کم از کم ایک مہینہ، نہ کوئی management fee، نہ joining fee۔\nConnect دبائیں، اپنی رقم لکھیں (کم از کم $10) اور Amplify چنیں۔\nCommunity Token میں #Aitech لکھیں، Verify دبائیں، Hash میں 000000 لکھیں اور Submit دبائیں۔\nدونوں boxes پر tick کریں اور Copy Now دبائیں۔",{"note":"Token کے ساتھ account 24× پر trade کرتا ہے — ہمارے $109 سے $2,616 بنے — اور یہ 10 % کی بجائے 5 % نقصان پر بند ہو جاتا ہے۔ صرف اُتنی رقم ڈالیں جسے پورا کھونا آپ برداشت کر سکیں۔","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"«CopyX Account Created» آئے گا — Continue دبائیں، اور آپ کے dashboard پر SONIC نظر آئے گا۔ رقم $0؟ تو Submit نہیں ہوا۔","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["اپنا account MetaTrader 5 میں دیکھیں","Portal میں MT5 Credentials کھولیں: account number، Master Password، Investor Password۔\nMetaTrader 5 میں موجودہ account شامل کریں، T.M. Financials Ltd تلاش کریں اور TMFinancials-Server چنیں۔\nLogin وہی account number ہے۔ پھر آپ کو Balance، Equity اور Free Margin نظر آئیں گے۔",{"note":"Master Password سے trade ہو سکتی ہے؛ Investor Password سے صرف دیکھا جا سکتا ہے۔ اپنا Master Password کبھی کسی کو نہ دیں۔ کوئی آپ کے نتائج دیکھے تو اُسے Investor Password دیں۔","apps":{"lede":"اپنے phone کے لیے MetaTrader 5 install کریں:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance، portal سے ملتا ہے اور آپ کی ڈالی ہوئی رقم کا 24 گنا ہوتا ہے — ہمارے $109 کی جگہ $2,616 نظر آئے۔ 24 گنا نہیں؟ رُک جائیں اور اپنے sponsor سے پوچھیں۔","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["گروپ میں شامل ہوں","سوالات کے جواب group میں ملتے ہیں — وہاں بھی ہر کوئی صفر سے شروع ہوا تھا۔\nبعد میں مزید پیسے ڈالنے ہیں؟ تھوڑے تھوڑے کر کے ڈالیں۔",{"apps":{"lede":"Element X install کریں — بالکل یہی app، Element Classic نہیں اور کوئی اور chat app نہیں۔ ایک account بنائیں، username کچھ بھی ہو سکتا ہے۔ پھر یہاں واپس آ کر “Aimpire گروپ میں شامل ہوں” دبائیں۔","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Aimpire گروپ میں شامل ہوں"},"check":"آپ پیغامات پڑھ سکتے ہیں، صرف group کا نام نہیں دیکھتے۔"}]]},"no":{"lede":"Steg 1–4 tar rundt et kvarter. Ha ID-kortet eller passet ditt klart.\nSå venter du på godkjenning. Resten gjør du når det passer deg — siden husker hvor du stoppet.","steps":[["Bruk sponsorens lenke","Åpne lenken sponsoren din sendte deg — sponsorens egen lenke, ikke en fra en gruppe.\nØverst på denne siden skal det stå en linje med sponsorens navn, som ender med en kode på seks tegn.\nSer du ingen slik linje? Be sponsoren sende deg lenken sin før du går videre.",{"check":"Øverst står et navn, eller et domene og seks tegn. Ingen linje betyr at ingen sponsor er knyttet til deg."}],["Opprett kontoen","Bla opp og trykk på den store knappen for å åpne kontoen. CopyX åpnes i en ny fane.\nBruk ditt ekte navn — det må stemme med ID-en din. Velg et passord du ikke bruker noe annet sted.\nEndre landet fra Albania til der du bor; landkoden for telefonen følger det.\nKryss av begge boksene, vent til «Verifying…» er ferdig, og trykk Sign Up.",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"Ditt ekte navn. Det må stemme med ID-en du laster opp etterpå, ellers går ikke verifiseringen gjennom."},{"n":2,"x":24,"y":45,"t":"Et passord du ikke bruker noe annet sted. Ikke e-postpassordet ditt."},{"n":3,"x":9,"y":66,"t":"Huk av begge. Les dem først — de sier at du kan tape penger."},{"n":4,"x":50,"y":87,"t":"Ser du denne gule boksen, manglet lenken invitasjonskoden. Gå tilbake og åpne sponsorens lenke i stedet."},{"n":5,"x":24,"y":56,"t":"Denne står på Albania for alle. Endre den — landkoden for telefonnummeret følger landet du velger."}],"check":"Du havner inne i portalen og ser ditt eget navn."}],["Koble til meglerkontoen — dette steget er viktig","Inne i portalen bruker du knappen Login to CopyX til å opprette Tag Markets-kontoen.\nIkke opprett den noe annet sted — en konto laget andre steder blir ikke koblet, og ingenting spores riktig.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Se dette steget (på engelsk)"},"note":"Portalen sier det også: bruk bare den knappen.","img":"assets/shot-copyx-register.jpg","alt":"CopyX Registration-panelet i IB-portalen","marks":[{"n":1,"x":34,"y":37,"t":"Les denne linjen. Den sier at meglerkontoen opprettes herfra, ikke andre steder."},{"n":2,"x":13,"y":71,"t":"Dette er knappen. Den heter Login to CopyX — bruk den også første gang."},{"n":3,"x":50,"y":90,"t":"Advarselen i gult: en Tag Markets-konto laget direkte på CopyX blir ikke koblet."}],"check":"Tag Markets-kontoen vises inne i portalen. Måtte du logge inn et annet sted for å finne den, er den ikke koblet."}],["Bekreft identiteten din","Du trenger ID-kort eller pass, pluss en ansiktsskanning.\nFotografer dokumentet i godt lys med alle fire hjørner synlige — et uskarpt bilde er den vanlige grunnen til avslag.",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents-panelet","marks":[{"n":1,"x":50,"y":44,"t":"Velg dokumenttype her først. Ingenting lastes opp før du har gjort det."},{"n":2,"x":50,"y":75,"t":"Den gule linjen er normal før du laster opp. Det er ikke en feil."},{"n":3,"x":90,"y":5,"t":"Validate betyr at megleren ennå ikke har sjekket dokumentene dine."}],"check":"Den gule «upload»-linjen er borte, og dokumentet ditt står som innsendt. «Validate» betyr bare at megleren ikke har sett på det ennå."}],["Vent på godkjenning","Godkjenningen tar vanligvis ikke lang tid.\nFram til da kan du ikke sette inn penger — meldingen på wallet-siden er normal, ikke en feil.",{"img":"assets/shot-wallet-kyc.jpg","alt":"Wallet-siden som viser at KYC må fullføres først","marks":[{"n":1,"x":50,"y":30,"t":"Den rosa linjen betyr at verifiseringen fortsatt pågår. Den forsvinner når dokumentene er godkjent."}],"check":"Den rosa linjen på wallet-siden er borte, og Deposit kan trykkes."}],["Mens du venter: installer de to appene","Bruk ventetiden til å installere to apper, kun fra de offisielle butikkene — knappene under går rett dit.\nMetaTrader 5, for å se kontoen din (steg 9).\nElement X, for Aimpire-gruppen (steg 10).\nTag Markets, CopyX og IB Portal kjører i nettleseren. Installer aldri en «Tag Markets app» noen sender deg.",{"appcards":true,"check":"Begge appene åpner seg på telefonen. Du trenger ikke logge inn ennå."}],["Sett inn penger","Trykk Deposit i portalen, velg beløpet (minimum $10) og kryptoen du har.\nDu får en adresse, en QR-kode, et nettverk og en nedtelling på rundt femten minutter.\nSend fra din egen lommebok — Binance, RedotPay eller lignende. Den kan be om Face ID eller en kode; det er lommebokens egen sjekk.\nGikk nedtellingen ut? Hent en ny adresse; bruk aldri den gamle om igjen.\nLommeboken din kan vise «Pending» en stund — anslaget den selv gir, kan lyde på opptil 24 timer.",{"note":"Send på nøyaktig det nettverket betalingssiden oppgir. Lommeboken din advarer selv om at feil nettverk kan bety «permanent loss of funds».\nGodtatt: Ethereum (ERC20), Polygon, Tron (TRC20), BNB (BEP20), Bitcoin, Polkadot og Solana. Ikke Arbitrum.\nGebyrene varierer: 25 USDC via Ethereum kostet 1,00 USDC, altså fire prosent.","check":"Beløpet vises på wallet-siden i portalen. Mangler det? Sjekk transaksjonen i din egen lommebok først.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71},"p2p":true}],["Koble til kopihandel med Sonic","Dette steget starter kopieringen — før det handles ingenting.\nÅpne CopyX i Tag Markets, finn SONIC og trykk Details. Kortet viser vilkårene: 30 % resultathonorar, minst én måned, ingen forvaltningsavgift og ingen innmeldingsavgift.\nTrykk Connect, skriv inn beløpet (minimum $10) og velg Amplify.\nUnder Community Token skriver du #Aitech, trykker Verify, skriver 000000 i Hash og trykker Submit.\nKryss av begge boksene og trykk Copy Now.",{"note":"Med tokenet handler kontoen på 24× — våre $109 ble $2 616 — og den stenges ved 5 % tap i stedet for 10 %. Sett bare inn det du kan tape helt.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"«CopyX Account Created» dukker opp — trykk Continue, så vises SONIC på dashbordet ditt. Står beløpet på $0? Da gikk ikke Submit gjennom.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["Se kontoen din i MetaTrader 5","Åpne MT5 Credentials i portalen: kontonummer, Master Password, Investor Password.\nI MetaTrader 5 legger du til en eksisterende konto, søker opp T.M. Financials Ltd og velger TMFinancials-Server.\nInnloggingen er kontonummeret. Så ser du Balance, Equity og Free Margin.",{"note":"Master Password kan handle; Investor Password kan bare se. Gi aldri Master Password til noen. Skal noen sjekke resultatene dine, gi dem Investor Password.","apps":{"lede":"Installer MetaTrader 5 på telefonen din:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance stemmer med portalen og er 24 ganger innskuddet ditt — våre $109 ble vist som $2 616. Ikke 24 ganger? Stopp og spør sponsoren din.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["Bli med i gruppa","I gruppen får du svar på spørsmål — ingen der kunne noe da de begynte.\nVil du sette inn mer senere? Gjør det litt om gangen.",{"apps":{"lede":"Installer Element X — akkurat den appen, ikke Element Classic og ikke en annen chat-app. Lag en konto, brukernavnet kan være hva som helst. Kom så tilbake hit og trykk på knappen Bli med i Aimpire-gruppa.","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Bli med i Aimpire-gruppa"},"check":"Du kan lese meldingene, ikke bare se navnet på gruppen."}]]},"hi":{"lede":"Steps 1–4 में क़रीब पंद्रह मिनट लगते हैं। अपना पहचान पत्र या पासपोर्ट पास रखें।\nफिर approval का इंतज़ार। बाक़ी काम जब आपको ठीक लगे तब करें — page याद रखता है कि आप कहाँ रुके थे।","steps":[["अपने sponsor का link इस्तेमाल करें","वही link खोलें जो आपके sponsor ने भेजा है — उन्हीं का अपना link, किसी group वाला नहीं।\nइस page के सबसे ऊपर एक पंक्ति में उनका नाम दिखना चाहिए, जिसके अंत में छह अक्षर-अंकों का code हो।\nऐसी पंक्ति नहीं दिखी? आगे बढ़ने से पहले अपने sponsor से उनका link माँगें।",{"check":"सबसे ऊपर कोई नाम दिखता है, या domain और छह अक्षर-अंक। पंक्ति नहीं है, तो कोई sponsor जुड़ा नहीं है।"}],["अपना account बनाएँ","ऊपर scroll करें और account खोलने वाला बड़ा button दबाएँ। CopyX नए tab में खुलेगा।\nअपना असली नाम दें — यह आपके पहचान पत्र से मेल खाना चाहिए। ऐसा password चुनें जो आप कहीं और इस्तेमाल न करते हों।\nCountry को Albania से बदलकर वह देश चुनें जहाँ आप रहते हैं; phone code उसी के हिसाब से आता है।\nदोनों boxes पर tick करें, «Verifying…» पूरा होने दें, फिर Sign Up दबाएँ।",{"img":"assets/shot-register.jpg","alt":"The CopyX sign-up form","marks":[{"n":1,"x":24,"y":32,"t":"आपका असली नाम। यह उस ID से मेल खाना चाहिए जो आप आगे अपलोड करेंगे, वरना verification पूरा नहीं होगा।"},{"n":2,"x":24,"y":45,"t":"ऐसा password जो आप कहीं और इस्तेमाल न करते हों। अपने email का password नहीं।"},{"n":3,"x":9,"y":66,"t":"दोनों पर टिक करें। पहले पढ़ें — उनमें लिखा है कि आप पैसे खो सकते हैं।"},{"n":4,"x":50,"y":87,"t":"यह पीला box दिखे तो आपके link में invite code नहीं था। वापस जाकर अपने sponsor का link खोलें।"},{"n":5,"x":24,"y":56,"t":"इसमें सबके लिए पहले से Albania चुना होता है। इसे बदलें — phone का code इसी के हिसाब से आता है।"}],"check":"आप portal के अंदर पहुँचते हैं और अपना नाम देखते हैं।"}],["अपना broker account जोड़ें — यह step महत्वपूर्ण है","Portal के अंदर Login to CopyX button से अपना Tag Markets account बनाएँ।\nइसे कहीं और न बनाएँ — कहीं और बना account जुड़ता नहीं, और कुछ भी ठीक से track नहीं होता।",{"video":{"url":"https://drive.google.com/file/d/1yvnfW9R7T930XvONOniniyG01_NZ8oV3/view","label":"यह step देखें"},"note":"Portal भी यही कहता है: सिर्फ़ उसी button का इस्तेमाल करें।","img":"assets/shot-copyx-register.jpg","alt":"IB Portal में CopyX Registration पैनल","marks":[{"n":1,"x":34,"y":37,"t":"यह पंक्ति पढ़ें। यह बताती है कि broker account यहीं से बनाना है, कहीं और से नहीं।"},{"n":2,"x":13,"y":71,"t":"यही बटन है। इस पर Login to CopyX लिखा है — पहली बार भी यही इस्तेमाल करें।"},{"n":3,"x":50,"y":90,"t":"पीली चेतावनी: सीधे CopyX पर बनाया गया Tag Markets account जुड़ेगा नहीं।"}],"check":"Tag Markets account portal के अंदर दिखता है। अगर उसे ढूँढने के लिए कहीं और login करना पड़ा, तो वह जुड़ा नहीं है।"}],["अपनी पहचान सत्यापित करें","आपको पहचान पत्र या पासपोर्ट चाहिए, और एक face scan भी।\nDocument की तस्वीर अच्छी रोशनी में लें, चारों कोने दिखें — reject होने की आम वजह धुँधली तस्वीर होती है।",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents पैनल","marks":[{"n":1,"x":50,"y":44,"t":"पहले यहाँ दस्तावेज़ का प्रकार चुनें। उससे पहले कुछ अपलोड नहीं होगा।"},{"n":2,"x":50,"y":75,"t":"अपलोड से पहले यह पीली पंक्ति सामान्य है। यह त्रुटि नहीं है।"},{"n":3,"x":90,"y":5,"t":"Validate का मतलब है कि broker ने अभी आपके दस्तावेज़ नहीं जाँचे हैं।"}],"check":"पीली «upload» पंक्ति हट गई है और आपका document submitted दिखता है। «Validate» का मतलब बस इतना है कि broker ने अभी देखा नहीं।"}],["मंज़ूरी का इंतज़ार करें","Approval में आमतौर पर थोड़ा समय लगता है।\nतब तक आप पैसे नहीं डाल सकते — wallet page पर दिखने वाली सूचना सामान्य है, कोई त्रुटि नहीं।",{"img":"assets/shot-wallet-kyc.jpg","alt":"wallet पेज जो दिखाता है कि पहले KYC पूरा करना है","marks":[{"n":1,"x":50,"y":30,"t":"यह गुलाबी पंक्ति बताती है कि सत्यापन अभी बाक़ी है। दस्तावेज़ मंज़ूर होते ही यह हट जाती है।"}],"check":"Wallet page की गुलाबी पंक्ति हट गई है और Deposit दबाया जा सकता है।"}],["इंतज़ार के दौरान: दोनों apps install करें","इंतज़ार के समय में दो apps install कर लें, सिर्फ़ official stores से — नीचे के buttons सीधे वहीं ले जाते हैं।\nMetaTrader 5, अपना account देखने के लिए (step 9)।\nElement X, Aimpire group के लिए (step 10)।\nTag Markets, CopyX और IB Portal browser में चलते हैं। कोई आपको «Tag Markets app» भेजे तो उसे कभी install न करें।",{"appcards":true,"check":"दोनों apps आपके phone पर खुलते हैं। अभी login की ज़रूरत नहीं।"}],["पैसे डालें","Portal में Deposit दबाएँ, रक़म चुनें (कम से कम $10) और वह crypto जो आपके पास है।\nआपको एक address, एक QR code, एक network और क़रीब पंद्रह मिनट का countdown मिलता है।\nअपने ही wallet से भेजें — Binance, RedotPay या ऐसा कोई और। वह Face ID या code माँग सकता है; यह आपके wallet की अपनी जाँच है।\nCountdown ख़त्म हो गया? नया address लें; पुराना कभी दोबारा इस्तेमाल न करें।\nआपका wallet कुछ देर तक «Pending» दिखा सकता है — उसका अपना अनुमान 24 घंटे तक का हो सकता है।",{"note":"ठीक उसी network पर भेजें जिसका नाम payment page पर लिखा है। आपका wallet ख़ुद चेतावनी देता है कि network मेल न खाए तो इसका मतलब «permanent loss of funds» हो सकता है।\nमान्य networks: Ethereum (ERC20), Polygon, Tron (TRC20), BNB (BEP20), Bitcoin, Polkadot और Solana। Arbitrum नहीं।\nFee अलग-अलग होती है: Ethereum से 25 USDC भेजने पर 1.00 USDC लगे, यानी चार प्रतिशत।","check":"रक़म portal के wallet page पर दिखती है। नहीं दिखी? पहले अपने ही wallet में transaction देखें।","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71},"p2p":true}],["Sonic copy trading से जुड़ें","यही step copying शुरू करता है — इसके बिना कोई trade नहीं होती।\nTag Markets में CopyX खोलें, SONIC ढूँढें और Details दबाएँ। Card पर शर्तें हैं: 30 % performance fee, कम से कम एक महीना, कोई management fee नहीं और कोई joining fee नहीं।\nConnect दबाएँ, अपनी रक़म लिखें (कम से कम $10) और Amplify चुनें।\nCommunity Token में #Aitech लिखें, Verify दबाएँ, Hash में 000000 लिखें और Submit दबाएँ।\nदोनों boxes पर tick करें और Copy Now दबाएँ।",{"note":"Token के साथ account 24× पर trade करता है — हमारे $109 से $2,616 बने — और यह 10 % की जगह 5 % नुक़सान पर बंद हो जाता है। सिर्फ़ उतना डालें जिसे पूरा खोना आप सह सकें।","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"«CopyX Account Created» आता है — Continue दबाएँ, और आपके dashboard पर SONIC दिखेगा। रक़म $0? तो Submit नहीं हुआ।","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["अपना account MetaTrader 5 में देखें","Portal में MT5 Credentials खोलें: account number, Master Password, Investor Password।\nMetaTrader 5 में existing account जोड़ें, T.M. Financials Ltd खोजें और TMFinancials-Server चुनें।\nLogin वही account number है। फिर आपको Balance, Equity और Free Margin दिखेंगे।",{"note":"Master Password से trade हो सकती है; Investor Password से सिर्फ़ देखा जा सकता है। अपना Master Password कभी किसी को न दें। कोई आपके नतीजे देखे, तो उसे Investor Password दें।","apps":{"lede":"अपने phone के लिए MetaTrader 5 install करें:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance portal से मेल खाता है और आपकी डाली रक़म का 24 गुना होता है — हमारे $109 वहाँ $2,616 दिखे। 24 गुना नहीं है? रुकें और अपने sponsor से पूछें।","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["ग्रुप में शामिल हों","सवालों के जवाब group में मिलते हैं — वहाँ कोई भी शुरुआत में कुछ नहीं जानता था।\nबाद में और पैसे डालने हैं? थोड़ा-थोड़ा करके डालें।",{"apps":{"lede":"Element X install करें — बिलकुल यही app, Element Classic नहीं और कोई दूसरा chat app नहीं। एक account बनाएँ, username कुछ भी चल जाएगा। फिर यहाँ वापस आकर “Aimpire ग्रुप में शामिल हों” दबाएँ।","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Aimpire ग्रुप में शामिल हों"},"check":"आप messages पढ़ सकते हैं, सिर्फ़ group का नाम नहीं देखते।"}]]},"ar":{"lede":"تستغرق الخطوات 1–4 نحو خمس عشرة دقيقة. اجعل بطاقة هويتك أو جواز سفرك في متناول يدك.\nثم تنتظر الموافقة. أما الباقي فتفعله متى ناسبك — فالصفحة تتذكّر أين توقفت.","steps":[["استخدم رابط الـ sponsor الخاص بك","افتح الرابط الذي أرسله لك الـ sponsor — رابطه هو، لا رابطاً من مجموعة.\nفي أعلى هذه الصفحة يجب أن ترى سطراً يذكر اسمه، وينتهي برمز من ستة أحرف وأرقام.\nلا ترى هذا السطر؟ اطلب من الـ sponsor أن يرسل لك رابطه قبل أن تكمل.",{"check":"يظهر في الأعلى اسمٌ، أو نطاقٌ وستة أحرف وأرقام. وغياب السطر يعني أنه لا يوجد sponsor مرتبط بك."}],["أنشئ حسابك","مرّر إلى الأعلى واضغط الزر الكبير لفتح حسابك. يُفتح CopyX في تبويب جديد.\nاستخدم اسمك الحقيقي — يجب أن يطابق هويتك. واختر password لا تستخدمه في أي مكان آخر.\nغيّر الدولة من ألبانيا إلى بلد إقامتك؛ فمفتاح الهاتف يتبعها.\nضع علامة في المربعين، وانتظر حتى ينتهي «Verifying…»، ثم اضغط Sign Up.",{"img":"assets/shot-register.jpg","alt":"استمارة التسجيل في CopyX","marks":[{"n":1,"x":24,"y":32,"t":"اسمك الحقيقي. يجب أن يطابق الهوية التي ترفعها لاحقاً، وإلا فسيفشل التحقق."},{"n":2,"x":24,"y":45,"t":"اختر password لا تستخدمه في أي مكان آخر — ولا تستخدم نفس password بريدك الإلكتروني."},{"n":3,"x":9,"y":66,"t":"علّم المربعين. اقرأهما أولاً — فهما ينصّان على أنك قد تخسر مالك."},{"n":4,"x":50,"y":87,"t":"إذا رأيت هذا المربع الأصفر، فرابطك كان ينقصه رمز الدعوة. ارجع وافتح رابط الـ sponsor بدلاً منه."},{"n":5,"x":24,"y":56,"t":"هذه الخانة تأتي محدَّدة على ألبانيا عند الجميع. غيّرها — فمفتاح الهاتف يتغيّر معها."}],"check":"تصل إلى داخل الـ portal وترى اسمك أنت."}],["اربط حساب الـ broker — هذه الخطوة مهمة","داخل الـ portal، استخدم زر Login to CopyX لإنشاء حساب Tag Markets الخاص بك.\nلا تُنشئه في أي مكان آخر — فالحساب الذي يُنشأ في مكان آخر لا يكون مرتبطاً، ولا يُتتبَّع أي شيء بشكل صحيح.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"شاهد هذه الخطوة"},"note":"والـ portal يقول ذلك أيضاً: استخدم ذلك الزر فقط.","img":"assets/shot-copyx-register.jpg","alt":"لوحة تسجيل CopyX داخل الـ IB Portal","marks":[{"n":1,"x":34,"y":37,"t":"اقرأ هذا السطر. فهو يطلب منك أن تُنشئ حساب الـ broker من هنا، لا من أي مكان آخر."},{"n":2,"x":13,"y":71,"t":"هذا هو الزر. مكتوب عليه Login to CopyX — استخدمه حتى في المرة الأولى."},{"n":3,"x":50,"y":90,"t":"التحذير بالأصفر: حساب Tag Markets الذي يُنشأ مباشرةً على CopyX لن يكون مرتبطاً بحسابك هنا."}],"check":"يظهر حساب Tag Markets داخل الـ portal. وإن اضطُررت إلى تسجيل الدخول في مكان آخر لتجده، فهو غير مرتبط."}],["أكّد هويتك","تحتاج إلى بطاقة هويتك أو جواز سفرك، إضافةً إلى مسح للوجه.\nصوّر المستند في ضوء جيد بحيث تظهر زواياه الأربع — فالصورة غير الواضحة هي السبب المعتاد للرفض.",{"img":"assets/shot-kyc.jpg","alt":"لوحة رفع المستندات","marks":[{"n":1,"x":50,"y":44,"t":"اختر نوع المستند من هنا أولاً. لا يُرفع شيء قبل ذلك."},{"n":2,"x":50,"y":75,"t":"هذا السطر الأصفر طبيعي قبل الرفع. وهو ليس خطأً."},{"n":3,"x":90,"y":5,"t":"كلمة Validate تعني أن الـ broker لم يفحص مستنداتك بعد."}],"check":"اختفى السطر الأصفر «upload» وظهر مستندك مُرسَلاً. و«Validate» يعني فقط أنّ الـ broker لم ينظر بعد."}],["انتظر الموافقة","تستغرق الموافقة عادةً وقتاً قصيراً.\nوحتى ذلك الحين لا يمكنك الإيداع — والتنبيه في صفحة الـ wallet طبيعي، وليس خطأً.",{"img":"assets/shot-wallet-kyc.jpg","alt":"صفحة الـ wallet تُظهر وجوب إكمال KYC أولاً","marks":[{"n":1,"x":50,"y":30,"t":"هذا السطر الزهري يعني أن التحقق ما زال قيد الانتظار. ويختفي بعد الموافقة على مستنداتك."}],"check":"اختفى السطر الزهري في صفحة الـ wallet وصار بالإمكان الضغط على Deposit."}],["أثناء الانتظار: ثبّت التطبيقين","استفد من وقت الانتظار لتثبيت تطبيقين، من المتاجر الرسمية فقط — الأزرار أدناه تأخذك إليها مباشرة.\nMetaTrader 5، لترى حسابك (الخطوة 9).\nElement X، لمجموعة Aimpire (الخطوة 10).\nيعمل Tag Markets وCopyX والـ IB Portal في المتصفح. لا تثبّت أبداً «Tag Markets app» يرسله لك أحد.",{"appcards":true,"check":"يُفتح كلا التطبيقين على هاتفك. ولا حاجة إلى تسجيل الدخول بعد."}],["أودع المال","في الـ portal اضغط Deposit، واختر المبلغ (الحد الأدنى $10) والعملة الرقمية التي تملكها.\nستحصل على عنوان ورمز QR وشبكة وعدّ تنازلي مدته نحو خمس عشرة دقيقة.\nأرسل من محفظتك أنت — Binance أو RedotPay أو ما يشبههما. قد تطلب Face ID أو رمزاً؛ هذا تحقّق خاص بمحفظتك.\nانتهى العدّ؟ اطلب عنواناً جديداً؛ ولا تُعِد استخدام القديم أبداً.\nقد تُظهر محفظتك «Pending» لبعض الوقت — وقد يذكر تقديرها الخاص مدةً تصل إلى 24 ساعة.",{"note":"أرسل على الشبكة التي تذكرها صفحة الدفع بالضبط. ومحفظتك نفسها تحذّر من أن عدم تطابق الشبكة قد يعني «permanent loss of funds».\nالمقبولة: Ethereum (ERC20) وPolygon وTron (TRC20) وBNB (BEP20) وBitcoin وPolkadot وSolana. وليس Arbitrum.\nالرسوم تختلف: إرسال 25 USDC عبر Ethereum كلّف 1.00 USDC، أي أربعة في المئة.","check":"يظهر المبلغ في صفحة الـ wallet في الـ portal. لم يظهر؟ تحقّق من العملية في محفظتك أنت أولاً.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71},"p2p":true}],["اربط حسابك بـ Sonic copy trading","هذه الخطوة تبدأ النسخ — وقبلها لا يجري أي تداول.\nفي Tag Markets افتح CopyX، وابحث عن SONIC واضغط Details. تعرض البطاقة الشروط: رسم أداء 30 %، وشهر واحد كحدّ أدنى، ولا رسوم إدارة ولا رسوم انضمام.\nاضغط Connect، واكتب المبلغ ($10 على الأقل) واختر Amplify.\nفي Community Token اكتب ‎#Aitech واضغط Verify، ثم اكتب 000000 في Hash واضغط Submit.\nعلّم المربّعين واضغط Copy Now.",{"note":"مع الـ token يتداول الحساب بـ 24× — فمبلغنا $109 صار $2,616 — ويُغلق عند خسارة 5 % بدل 10 %. لا تضع إلا ما تستطيع خسارته كاملاً.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"يظهر «CopyX Account Created» — اضغط Continue، فيظهر SONIC في لوحتك. المبلغ $0؟ إذن لم يكتمل Submit.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["راقب حسابك في MetaTrader 5","في الـ portal افتح MT5 Credentials: رقم الحساب، وMaster Password، وInvestor Password.\nفي MetaTrader 5 أضِف حساباً موجوداً، وابحث عن T.M. Financials Ltd واختر TMFinancials-Server.\nاسم الدخول هو رقم الحساب. بعدها ترى Balance وEquity وFree Margin.",{"note":"الـ Master Password يتيح التداول؛ أما الـ Investor Password فيتيح المشاهدة فقط. لا تُعطِ الـ Master Password لأي أحد أبداً. وإن كان على أحد أن يطّلع على نتائجك، فأعطه الـ Investor Password.","apps":{"lede":"ثبّت MetaTrader 5 على هاتفك:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"يطابق Balance الرقم في الـ portal ويكون 24 ضعف إيداعك — مبلغنا $109 ظهر بقيمة $2,616. ليس 24 ضعفاً؟ توقّف واسأل الـ sponsor الخاص بك.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["انضم إلى المجموعة","في المجموعة تجد إجابات أسئلتك — فلا أحد هناك بدأ وهو يعرف شيئاً.\nستضيف مالاً لاحقاً؟ أضِفه على دفعات صغيرة.",{"apps":{"lede":"ثبّت Element X — هذا التطبيق بالذات، لا Element Classic ولا أي تطبيق محادثة آخر. أنشئ حساباً بأي اسم مستخدم. ثم عُد إلى هنا واضغط «انضم إلى مجموعة Aimpire».","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"انضم إلى مجموعة Aimpire"},"check":"تستطيع قراءة الرسائل، لا رؤية اسم المجموعة فقط."}]]},"ar_rm":{"lede":"Tastaghriq al-khutuwat 1–4 nahwa khams 3ashrata daqiqa. Ij3al bitaqat hawiyatak aw jawaz safarak fi mutanawal yadak.\nThumma tantazir al-muwafaqa. Amma al-baqi fataf3aluh mata nasabak — fal-safha tatadhakkar ayn tawaqqaft.","steps":[["Istakhdim rabit al-sponsor al-khass bik","Iftah al-rabit alladhi arsalah lak al-sponsor — rabituh huwa, la rabitan min majmu3a.\nFi a3la hadhihi al-safha yajib an tara satran yadhkur ismah, w yantahi bi-ramz min sitta ahruf w arqam.\nLa tara hadha al-satr? Utlub min al-sponsor an yursil lak rabitah qabl an tukmil.",{"check":"Yazhar fil-a3la ismun, aw nitaqun w sitta ahruf w arqam. W ghiyab al-satr ya3ni annahu la yujad sponsor murtabit bik."}],["Anshi' hisabak","Marrir ila al-a3la w idghat al-zirr al-kabir li-fath hisabak. Yuftah CopyX fi tabwib jadid.\nIstakhdim ismak al-haqiqi — yajib an yutabiq hawiyatak. W ikhtar password la tastakhdimuh fi ayy makan akhar.\nGhayyir al-dawla min Albania ila balad iqamatak; fa-miftah al-hatif yatba3uha.\nDa3 3alama fil-murabba3ayn, w intazir hatta yantahi «Verifying…», thumma idghat Sign Up.",{"img":"assets/shot-register.jpg","alt":"Istimarat al-tasjil fi CopyX","marks":[{"n":1,"x":24,"y":32,"t":"Ismak al-haqiqi. Yajib an yutabiq al-hawiya allati tarfa3uha lahiqan, w illa fasayafshal al-tahaqquq."},{"n":2,"x":24,"y":45,"t":"Ikhtar password la tastakhdimuh fi ayy makan akhar — w la tastakhdim nafs password baridak al-iliktruni."},{"n":3,"x":9,"y":66,"t":"3allim al-murabba3ayn. Iqra'huma awwalan — fahuma yanussan 3ala annak qad takhsar malak."},{"n":4,"x":50,"y":87,"t":"Idha ra'ayt hadha al-murabba3 al-asfar, farabitak kan yanqusuh ramz al-da3wa. Irja3 w iftah rabit al-sponsor badalan minh."},{"n":5,"x":24,"y":56,"t":"Hadhihi al-khana ta'ti muhaddada 3ala Albania 3ind al-jami3. Ghayyirha — famiftah al-hatif yataghayyar ma3aha."}],"check":"Tasil ila dakhil al-portal w tara ismak anta."}],["Urbut hisab al-broker — hadhihi al-khutwa muhimma","Dakhil al-portal, istakhdim zirr Login to CopyX li-insha' hisab Tag Markets al-khass bik.\nLa tunshi'h fi ayy makan akhar — fal-hisab alladhi yunsha' fi makan akhar la yakun murtabitan, w la yutatabba3 ayy shay' bi-shakl sahih.",{"video":{"url":"https://drive.google.com/file/d/1KrEU9XkoVflSNhCXUtmHzx-wY0q_RBB1/view","label":"Shahid hadhihi al-khutwa"},"note":"W al-portal yaqul dhalik aydan: istakhdim dhalik al-zirr faqat.","img":"assets/shot-copyx-register.jpg","alt":"Lawhat tasjil CopyX dakhil al-IB Portal","marks":[{"n":1,"x":34,"y":37,"t":"Iqra' hadha al-satr. Fahuwa yatlub minnak an tunshi' hisab al-broker min huna, la min ayy makan akhar."},{"n":2,"x":13,"y":71,"t":"Hadha huwa al-zirr. Maktub 3alayh Login to CopyX — istakhdimh hatta fil-marra al-ula."},{"n":3,"x":50,"y":90,"t":"Al-tahdhir bil-asfar: hisab Tag Markets alladhi yunsha' mubasharatan 3ala CopyX lan yakun murtabitan bi-hisabak huna."}],"check":"Yazhar hisab Tag Markets dakhil al-portal. W in udturirt ila tasjil al-dukhul fi makan akhar li-tajidah, fahuwa ghayr murtabit."}],["Akkid hawiyatak","Tahtaj ila bitaqat hawiyatak aw jawaz safarak, idafatan ila mash lil-wajh.\nSawwir al-mustanad fi daw' jayyid bihaythu tazhar zawayah al-arba3 — fal-sura ghayr al-wadiha hiya al-sabab al-mu3tad lil-rafd.",{"img":"assets/shot-kyc.jpg","alt":"Lawhat raf3 al-mustanadat","marks":[{"n":1,"x":50,"y":44,"t":"Ikhtar naw3 al-mustanad min huna awwalan. La yurfa3 shay' qabl dhalik."},{"n":2,"x":50,"y":75,"t":"Hadha al-satr al-asfar tabi3i qabl al-raf3. W huwa laysa khata'an."},{"n":3,"x":90,"y":5,"t":"Kalimat Validate ta3ni ann al-broker lam yafhas mustanadatak ba3d."}],"check":"Ikhtafa al-satr al-asfar «upload» w zahar mustanadak mursalan. W «Validate» ya3ni faqat anna al-broker lam yanzur ba3d."}],["Intazir al-muwafaqa","Tastaghriq al-muwafaqa 3adatan waqtan qasiran.\nW hatta dhalik al-hin la yumkinuk al-ida3 — w al-tanbih fi safhat al-wallet tabi3i, w laysa khata'an.",{"img":"assets/shot-wallet-kyc.jpg","alt":"Safhat al-wallet tuzhir wujub ikmal KYC awwalan","marks":[{"n":1,"x":50,"y":30,"t":"Hadha al-satr al-zahri ya3ni ann al-tahaqquq ma zal qayd al-intizar. W yakhtafi ba3d al-muwafaqa 3ala mustanadatak."}],"check":"Ikhtafa al-satr al-zahri fi safhat al-wallet w sar bil-imkan al-daght 3ala Deposit."}],["Athna' al-intizar: thabbit al-tatbiqayn","Istafid min waqt al-intizar li-tathbit tatbiqayn, min al-matajir al-rasmiya faqat — al-azrar adnah ta'khudhak ilayha mubashara.\nMetaTrader 5, li-tara hisabak (al-khutwa 9).\nElement X, li-majmu3at Aimpire (al-khutwa 10).\nYa3mal Tag Markets w CopyX w al-IB Portal fil-mutasaffih. La tuthabbit abadan «Tag Markets app» yursiluh lak ahad.",{"appcards":true,"check":"Yuftah kila al-tatbiqayn 3ala hatifak. W la haja ila tasjil al-dukhul ba3d."}],["Awdi3 al-mal","Fil-portal idghat Deposit, w ikhtar al-mablagh (al-hadd al-adna $10) w al-3umla al-raqmiya allati tamlikuha.\nSatahsul 3ala 3unwan w ramz QR w shabaka w 3add tanazuli muddatuh nahwa khams 3ashrata daqiqa.\nArsil min mihfazatak anta — Binance aw RedotPay aw ma yushbihuhuma. Qad tatlub Face ID aw ramzan; hadha tahaqquq khass bi-mihfazatak.\nIntaha al-3add? Utlub 3unwanan jadidan; w la tu3id istikhdam al-qadim abadan.\nQad tuzhir mihfazatak «Pending» li-ba3d al-waqt — w qad yadhkur taqdiruha al-khass muddatan tasil ila 24 sa3a.",{"note":"Arsil 3ala al-shabaka allati tadhkuruha safhat al-daf3 bil-dabt. W mihfazatak nafsuha tuhadhdhir min anna 3adam tatabuq al-shabaka qad ya3ni «permanent loss of funds».\nAl-maqbula: Ethereum (ERC20) w Polygon w Tron (TRC20) w BNB (BEP20) w Bitcoin w Polkadot w Solana. W laysa Arbitrum.\nAl-rusum takhtalif: irsal 25 USDC 3abr Ethereum kallaf 1.00 USDC, ay arba3a fil-mi'a.","check":"Yazhar al-mablagh fi safhat al-wallet fil-portal. Lam yazhar? Tahaqqaq min al-3amaliya fi mihfazatak anta awwalan.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71},"p2p":true}],["Urbut hisabak bi Sonic copy trading","Hadhihi al-khutwa tabda' al-naskh — w qablaha la yajri ayy tadawul.\nFi Tag Markets iftah CopyX, w ibhath 3an SONIC w idghat Details. Ta3rid al-bitaqa al-shurut: rasm ada' 30 %, w shahr wahid ka-hadd adna, w la rusum idara w la rusum indimam.\nIdghat Connect, w uktub al-mablagh ($10 3ala al-aqall) w ikhtar Amplify.\nFi Community Token uktub #Aitech w idghat Verify, thumma uktub 000000 fi Hash w idghat Submit.\n3allim al-murabba3ayn w idghat Copy Now.",{"note":"Ma3 al-token yatadawal al-hisab bi-24× — fa-mablaghuna $109 sar $2,616 — w yughlaq 3ind khasarat 5 % badal 10 %. La tada3 illa ma tastati3 khasaratah kamilan.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"Yazhar «CopyX Account Created» — idghat Continue, fayazhar SONIC fi lawhatak. Al-mablagh $0? Idhan lam yaktamil Submit.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["Raqib hisabak fi MetaTrader 5","Fil-portal iftah MT5 Credentials: raqm al-hisab, w Master Password, w Investor Password.\nFi MetaTrader 5 adif hisaban mawjudan, w ibhath 3an T.M. Financials Ltd w ikhtar TMFinancials-Server.\nIsm al-dukhul huwa raqm al-hisab. Ba3daha tara Balance w Equity w Free Margin.",{"note":"Al-Master Password yutih al-tadawul; amma al-Investor Password fayutih al-mushahada faqat. La tu3ti al-Master Password li-ayy ahad abadan. W in kan 3ala ahad an yattali3 3ala nata'ijak, fa'a3tih al-Investor Password.","apps":{"lede":"Thabbit MetaTrader 5 3ala hatifak:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Yutabiq Balance al-raqm fil-portal w yakun 24 di3f ida3ak — mablaghuna $109 zahar bi-qimat $2,616. Laysa 24 di3fan? Tawaqqaf w is'al al-sponsor al-khass bik.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["Indamm ila al-majmu3a","Fil-majmu3a tajid ijabat as'ilatak — fala ahad hunak bada' w huwa ya3rif shay'an.\nSatudif malan lahiqan? Adifh 3ala dafa3at saghira.",{"apps":{"lede":"Thabbit Element X — hadha al-tatbiq bil-dhat, la Element Classic w la ayy tatbiq muhadatha akhar. Anshi' hisaban bi-ayy ism mustakhdim. Thumma 3ud ila huna w idghat «Indamm ila majmu3at Aimpire».","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Indamm ila majmu3at Aimpire"},"check":"Tastati3 qira'at al-rasa'il, la ru'yat ism al-majmu3a faqat."}]]},"ur_rm":{"lede":"Steps 1–4 mein taqreeban pandrah minute lagte hain. Apna shanakhti card ya passport paas rakhein.\nPhir approval ka intezar. Baqi kaam jab munasib lage tab karein — safha yaad rakhta hai keh aap kahan ruke the.","steps":[["Apne sponsor ka link istemal karein","Wohi link kholein jo aap ke sponsor ne bheja hai — un ka apna link, kisi group wala nahi.\nIs safhe ke upar ek satar mein un ka naam nazar aana chahiye, jo chhe huroof ke code par khatam ho.\nAisi satar nazar nahi aayi? Aage barhne se pehle apne sponsor se un ka link maangein.",{"check":"Upar naam nazar aaye, ya domain aur chhe huroof. Line na ho to koi sponsor munsalik nahi."}],["Apna account banayein","Upar scroll karein aur account kholne wala bada button dabayein. CopyX naye tab mein khulega.\nApna asal naam dein — yeh aap ki ID se milna chahiye. Aisa password chunein jo kahin aur istemal na karte hon.\nCountry ko Albania se badal kar apna mulk chunein; phone ka code isi se aata hai.\nDono boxes par nishan lagayein, «Verifying…» mukammal hone dein, phir Sign Up dabayein.",{"img":"assets/shot-register.jpg","alt":"CopyX ka sign up form","marks":[{"n":1,"x":24,"y":32,"t":"Apna asal naam. Yeh us shanakhti card se milna chahiye jo aage upload karenge, warna tasdeeq nakaam hogi."},{"n":2,"x":24,"y":45,"t":"Aisa password jo aap kahin aur istemal nahi karte. Email ka password nahi."},{"n":3,"x":9,"y":66,"t":"Dono par nishan lagayein. Pehle parhein — in mein likha hai keh aap raqam kho sakte hain."},{"n":4,"x":50,"y":87,"t":"Yeh peela box nazar aaye to aap ke link mein invite code nahi tha. Wapas ja kar apne sponsor ka link kholein."},{"n":5,"x":24,"y":56,"t":"Yeh sab ke liye pehle se Albania par hota hai. Ise badlein — phone ka code isi se aata hai."}],"check":"Aap portal ke andar pahunchte hain aur apna naam dekhte hain."}],["Apna broker account jorein — yeh marhala aham hai","Portal ke andar Login to CopyX ke button se apna Tag Markets account banayein.\nIse kahin aur na banayein — kahin aur bana account jura nahi hota, aur kuch bhi theek se track nahi hota.",{"note":"Portal bhi yahi kehta hai: sirf wohi button istemal karein.","soon":"Urdu video abhi tayyar ki ja rahi hai. Tab tak koi baat samajh na aaye to apne sponsor se pooch lein — woh isi liye hain.","img":"assets/shot-copyx-register.jpg","alt":"IB Portal mein CopyX registration panel","marks":[{"n":1,"x":34,"y":37,"t":"Yeh satar parhein. Yeh batati hai keh broker account yahin se banana hai, kahin aur se nahi."},{"n":2,"x":13,"y":71,"t":"Yehi button hai. Is par Login to CopyX likha hai — pehli baar bhi yehi istemal karein."},{"n":3,"x":50,"y":90,"t":"Peeli tanbeeh: seedha CopyX par banaya gaya Tag Markets account munsalik nahi hoga."}],"check":"Tag Markets account portal ke andar nazar aata hai. Agar use dhoondne ke liye kahin aur login karna pada, to woh jura hua nahi."}],["Apni shanakht ki tasdeeq karein","Aap ko shanakhti card ya passport chahiye, aur saath ek face scan.\nDastavez ki tasveer achi roshni mein lein, charon konay nazar aayein — mustarad hone ki aam wajah dhundli tasveer hoti hai.",{"img":"assets/shot-kyc.jpg","alt":"Upload Documents panel","marks":[{"n":1,"x":50,"y":44,"t":"Pehle yahan dastavez ki qisam chunein. Is se pehle kuch upload nahi hoga."},{"n":2,"x":50,"y":75,"t":"Upload se pehle yeh peeli satar maamool ki baat hai. Yeh kharabi nahi."},{"n":3,"x":90,"y":5,"t":"Validate ka matlab hai broker ne abhi aap ki dastavezaat nahi dekhin."}],"check":"Peeli «upload» line chali gayi aur aap ka document jama shuda dikhta hai. «Validate» ka matlab bas yeh hai keh broker ne abhi dekha nahi."}],["Manzoori ka intezar karein","Approval mein umooman thora waqt lagta hai.\nTab tak aap raqam nahi daal sakte — wallet safhe par nazar aane wali ittila maamool ki baat hai, koi kharabi nahi.",{"img":"assets/shot-wallet-kyc.jpg","alt":"wallet safha jo batata hai keh pehle KYC mukammal karna hai","marks":[{"n":1,"x":50,"y":30,"t":"Yeh gulabi satar batati hai keh tasdeeq abhi baqi hai. Dastavezaat manzoor hote hi yeh hat jati hai."}],"check":"Wallet page ki gulabi line chali gayi aur Deposit dab sakta hai."}],["Intezar ke dauran: dono apps install karein","Intezar ke waqt mein do apps install kar lein, sirf official stores se — neeche ke buttons seedhe wahin le jaate hain.\nMetaTrader 5, apna account dekhne ke liye (step 9).\nElement X, Aimpire group ke liye (step 10).\nTag Markets, CopyX aur IB Portal browser mein chalte hain. Koi aap ko «Tag Markets app» bheje to use kabhi install na karein.",{"appcards":true,"check":"Dono apps aap ke phone par khulti hain. Abhi login ki zaroorat nahi."}],["Account mein paise daalein","Portal mein Deposit dabayein, raqam chunein (kam se kam $10) aur woh crypto jo aap ke paas hai.\nAap ko ek address, ek QR code, ek network aur taqreeban pandrah minute ka countdown milta hai.\nApne hi wallet se bhejein — Binance, RedotPay ya koi aur. Woh Face ID ya code maang sakta hai; yeh aap ke wallet ki apni jaanch hai.\nCountdown khatam ho gaya? Naya address lein; purana kabhi dobara istemal na karein.\nAap ka wallet kuch der tak «Pending» dikha sakta hai — us ka apna andaza 24 ghanton tak ka ho sakta hai.",{"note":"Bilkul usi network par bhejein jis ka naam payment page par likha hai. Aap ka wallet khud khabardar karta hai keh network ke mel na khane ka matlab «permanent loss of funds» ho sakta hai.\nQubool hain: Ethereum (ERC20), Polygon, Tron (TRC20), BNB (BEP20), Bitcoin, Polkadot aur Solana. Arbitrum nahi.\nFee alag alag hai: Ethereum se 25 USDC bhejne par 1.00 USDC lage, yaani chaar feesad.","check":"Raqam portal ke wallet safhe par nazar aati hai. Nazar nahi aayi? Pehle apne hi wallet mein transaction dekhein.","clip":{"src":"assets/video/steg6-innskudd.mp4","poster":"assets/video/steg6-innskudd.jpg","secs":71},"p2p":true}],["Sonic copy trading se judein","Yahi step copying shuru karta hai — is ke baghair koi trade nahi hoti.\nTag Markets mein CopyX kholein, SONIC dhoondein aur Details dabayein. Card par shartein hain: 30 % performance fee, kam az kam ek mahina, na koi management fee, na joining fee.\nConnect dabayein, apni raqam likhein (kam az kam $10) aur Amplify chunein.\nCommunity Token mein #Aitech likhein, Verify dabayein, Hash mein 000000 likhein aur Submit dabayein.\nDono boxes par tick karein aur Copy Now dabayein.",{"note":"Token ke saath account 24× par trade karta hai — hamare $109 se $2,616 bane — aur yeh 10 % ki bajaye 5 % nuqsan par band ho jaata hai. Sirf utni raqam daalein jise poora khona aap bardasht kar sakein.","codes":[{"label":"Community token","value":"#Aitech"},{"label":"Hash","value":"000000"}],"check":"«CopyX Account Created» aayega — Continue dabayein, aur aap ke dashboard par SONIC nazar aayega. Raqam $0? To Submit nahi hua.","clip":{"src":"assets/video/steg7-sonic.mp4","poster":"assets/video/steg7-sonic.jpg","secs":65}}],["Apna account MetaTrader 5 mein dekhein","Portal mein MT5 Credentials kholein: account number, Master Password, Investor Password.\nMetaTrader 5 mein maujooda account shamil karein, T.M. Financials Ltd talaash karein aur TMFinancials-Server chunein.\nLogin wohi account number hai. Phir aap ko Balance, Equity aur Free Margin nazar aayenge.",{"note":"Master Password se trade ho sakti hai; Investor Password se sirf dekha ja sakta hai. Apna Master Password kabhi kisi ko na dein. Koi aap ke nataij dekhe to use Investor Password dein.","apps":{"lede":"Apne phone ke liye MetaTrader 5 install karein:","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5"},{"os":"iPhone","url":"https://apps.apple.com/app/metatrader-5/id413251709"}]},"check":"Balance portal se milta hai aur aap ki daali hui raqam ka 24 guna hota hai — hamare $109 ki jagah $2,616 nazar aaye. 24 guna nahi? Ruk jaayein aur apne sponsor se poochein.","clip":{"src":"assets/video/steg8-mt5.mp4","poster":"assets/video/steg8-mt5.jpg","secs":51}}],["Group mein shamil hon","Sawalaat ke jawab group mein milte hain — wahan bhi har koi sifar se shuru hua tha.\nBaad mein mazeed paise daalne hain? Thode thode kar ke daalein.",{"apps":{"lede":"Element X install karein — bilkul yahi app, Element Classic nahi aur koi aur chat app nahi. Ek account banayein, username kuch bhi ho sakta hai. Phir yahan wapas aa kar “Aimpire group mein shamil hon” dabayein.","items":[{"os":"Android","url":"https://play.google.com/store/apps/details?id=io.element.android.x"},{"os":"iPhone","url":"https://apps.apple.com/app/element-x/id1631335820"}]},"join":{"url":"https://matrix.to/#/%23aimpire:matrix.org","label":"Aimpire group mein shamil hon"},"check":"Aap paighamaat parh sakte hain, sirf group ka naam nahi dekhte."}]]}},"langs":[{"code":"en","label":"English","dir":"ltr","font":"latin"},{"code":"no","label":"Norsk","dir":"ltr","font":"latin"},{"code":"hi","label":"हिन्दी","dir":"ltr","font":"deva"},{"code":"ar","label":"العربية","dir":"rtl","font":"naskh"},{"code":"ur","label":"اردو","dir" e confusion.","no":"Du får to innlogginger. Vet du hvilken som er hvilken, slipper du det meste av forvirringen.","hi":"आपके पास दो logins होंगे। कौन-सा login किस चीज़ का है, यह जान लेने से ज़्यादातर उलझन से बचा जा सकता है।","ur":"آپ کے پاس دو logins ہوں گے۔ کون سا کیا ہے، یہ ایک بار سمجھ لیں تو بعد کی زیادہ تر الجھن ختم ہو جاتی ہے۔","ar":"سيكون لديك حسابان تسجّل بهما الدخول. ومعرفة الفرق بينهما تُجنّبك معظم الالتباس.","ar_rm":"Sayakun ladayk hisaban tusajjil bihima al-dukhul. W ma3rifat al-farq baynahuma tujannibak mu3zam al-iltibas.","ur_rm":"Aap ke paas do logins honge. Kaun sa kya hai, yeh ek baar samajh lein to baad ki zyada tar uljhan khatam ho jati hai."},"items":{"en":[["CopyX","The platform that copies the traders. You create this first, in step 2."],["IB Portal","Where your team and your numbers live. Same login as CopyX."],["Tag Markets","The broker — the company that actually holds your money. You create this from inside the portal, in step 3."]],"no":[["CopyX","Plattformen som kopierer traderne. Denne oppretter du først, i steg 2."],["IB Portal","Der teamet ditt og tallene dine ligger. Samme innlogging som CopyX."],["Tag Markets","Megleren — selskapet som faktisk holder pengene dine. Denne oppretter du inne fra portalen, i steg 3."]],"hi":[["CopyX","वह platform जो traders को copy करता है। यह आप सबसे पहले बनाते हैं, step 2 में।"],["IB Portal","जहाँ आपकी team और आपके आँकड़े रहते हैं। CopyX वाला ही login।"],["Tag Markets","Broker — वह कंपनी जो असल में आपका पैसा रखती है। यह आप portal के अंदर से बनाते हैं, step 3 में।"]],"ur":[["CopyX","وہ platform جو traders کو copy کرتا ہے۔ یہ آپ سب سے پہلے بناتے ہیں، step 2 میں۔"],["IB Portal","جہاں آپ کی team اور آپ کے اعداد و شمار ہوتے ہیں۔ Login وہی ہے جو CopyX کا ہے۔"],["Tag Markets","Broker — وہ کمپنی جو اصل میں آپ کا پیسہ رکھتی ہے۔ یہ آپ portal کے اندر سے بناتے ہیں، step 3 میں۔"]],"ar":[["CopyX","المنصة التي تنسخ صفقات الـ traders. تنشئ حسابك فيها أولاً، في الخطوة 2."],["IB Portal","حيث تجد فريقك وأرقامك. وتدخل إليه بنفس بيانات الدخول إلى CopyX."],["Tag Markets","الـ broker — الشركة التي تحتفظ بمالك فعلاً. تنشئ حسابك فيها من داخل الـ portal، في الخطوة 3."]],"ar_rm":[["CopyX","Al-minassa allati tansakh safaqat al-traders. Tunshi' hisabak fiha awwalan, fil-khutwa 2."],["IB Portal","Haythu tajid fariqak w arqamak. W tadkhul ilayh bi-nafs bayanat al-dukhul ila CopyX."],["Tag Markets","Al-broker — al-sharika allati tahtafiz bi-malak fi3lan. Tunshi' hisabak fiha min dakhil al-portal, fil-khutwa 3."]],"ur_rm":[["CopyX","Woh platform jo traders ko copy karta hai. Yeh aap sab se pehle banate hain, step 2 mein."],["IB Portal","Jahan aap ki team aur aap ke adaad o shumar hote hain. Login wohi hai jo CopyX ka hai."],["Tag Markets","Broker — woh company jo asal mein aap ka paisa rakhti hai. Yeh aap portal ke andar se banate hain, step 3 mein."]]}},"guide_ui":{"en":{"copy":"Copy","copied":"Copied","progress":"{done} of {total} steps done","reset":"Clear","check":"You know it worked when","mark":"Mark this step done","marked":"Done — tap to undo","left":"{n} left","next":"Next: {t}","all_done":"All {total} steps done. You are set up.","all_done_go":"Next: how Sonic works","watch":"See it on screen — {s} seconds"},"no":{"copy":"Kopier","copied":"Kopiert","progress":"{done} av {total} steg gjort","reset":"Nullstill","check":"Du vet at det virket når","mark":"Merk steget som gjort","marked":"Gjort — trykk for å angre","left":"{n} igjen","next":"Neste: {t}","all_done":"Alle de {total} stegene er gjort. Du er i gang.","all_done_go":"Videre: hvordan Sonic virker","watch":"Se det på skjermen — {s} sekunder"},"hi":{"copy":"कॉपी करें","copied":"कॉपी हो गया","progress":"{total} में से {done} steps पूरे","reset":"रीसेट","check":"कैसे पता चलेगा कि काम हो गया","mark":"इस step को पूरा मार्क करें","marked":"हो गया — वापस लेने के लिए दबाएँ","left":"{n} बाक़ी","next":"अगला: {t}","all_done":"सभी {total} steps पूरे। आप तैयार हैं।","all_done_go":"आगे: Sonic कैसे काम करता है","watch":"स्क्रीन पर देखें — {s} सेकंड"},"ur":{"copy":"کاپی کریں","copied":"کاپی ہو گیا","progress":"{total} میں سے {done} steps مکمل","reset":"صاف کریں","check":"کیسے پتا چلے کہ ٹھیک ہوا","mark":"یہ step مکمل ہو گیا","marked":"ہو گیا — واپس لینے کے لیے دبائیں","left":"{n} باقی","next":"اگلا: {t}","all_done":"تمام {total} steps مکمل۔ آپ تیار ہیں۔","all_done_go":"آگے: Sonic کیسے کام کرتا ہے","watch":"اسکرین پر دیکھیں — {s} سیکنڈ"},"ar":{"copy":"نسخ","copied":"تم النسخ","progress":"{done} من {total} خطوات مكتملة","reset":"مسح","check":"تعرف أنّها نجحت حين","mark":"علّم هذه الخطوة على أنها مُنجزة","marked":"تمّت — اضغط للتراجع","left":"{n} متبقية","next":"التالي: {t}","all_done":"أُنجزت الخطوات الـ {total} كلها. أنت جاهز.","all_done_go":"التالي: كيف يعمل Sonic","watch":"شاهده على الشاشة — {s} ثانية"},"ar_rm":{"copy":"Naskh","copied":"Tamm al-naskh","progress":"{done} min {total} khutuwat muktamila","reset":"Mash","check":"Ta3rif annaha najahat hin","mark":"3allim hadhihi al-khutwa 3ala annaha munjaza","marked":"Tammat — idghat lil-tarajju3","left":"{n} mutabaqqiya","next":"Al-tali: {t}","all_done":"Unjizat al-khutuwat al-{total} kulluha. Anta jahiz.","all_done_go":"Al-tali: kayf ya3mal Sonic","watch":"Shahidh 3ala al-shasha — {s} thaniya"},"ur_rm":{"copy":"Copy karein","copied":"Copy ho gaya","progress":"{total} mein se {done} steps mukammal","reset":"Saaf karein","check":"Kaise pata chale keh theek hua","mark":"Yeh step mukammal ho gaya","marked":"Ho gaya — wapas lene ke liye dabayein","left":"{n} baqi","next":"Agla: {t}","all_done":"Tamaam {total} steps mukammal. Aap tayyar hain.","all_done_go":"Aage: Sonic kaise kaam karta hai","watch":"Screen par dekhein — {s} second"}},"learn":{"intro":{"en":"You do not need any of this to let Sonic run. It is here for when you want to understand what you are looking at. Tap any word to open it.","no":"Du trenger ikke noe av dette for å la Sonic gå. Det er her når du vil forstå hva du ser på. Trykk på et ord for å åpne det.","hi":"Sonic को चलने देने के लिए इसमें से कुछ भी जानना ज़रूरी नहीं है। यह तब के लिए है जब आप समझना चाहें कि आप क्या देख रहे हैं। किसी भी शब्द को खोलने के लिए उस पर दबाएँ।","ur":"Sonic چلانے کے لیے اس میں سے کچھ بھی ضروری نہیں۔ یہ اُس وقت کے لیے ہے جب آپ سمجھنا چاہیں کہ آپ کیا دیکھ رہے ہیں۔ کسی بھی لفظ پر دبائیں۔","ar":"لا تحتاج إلى شيء من هذا لتترك Sonic يعمل. هو هنا لتعود إليه حين تريد أن تفهم ما تنظر إليه. اضغط على أي كلمة لتفتحها.","ar_rm":"La tahtaj ila shay' min hadha li-tatruk Sonic ya3mal. Huwa huna li-ta3ud ilayh hin turid an tafham ma tanzur ilayh. Idghat 3ala ayy kalima li-taftahaha.","ur_rm":"Sonic chalane ke liye is mein se kuch bhi zaroori nahi. Yeh us waqt ke liye hai jab aap samajhna chahein keh aap kya dekh rahe hain. Kisi bhi lafz par dabayein."},"labels":{"en":["Example","Why it matters","Formula"],"no":["Eksempel","Hvorfor det er viktig","Formel"],"hi":["उदाहरण","यह क्यों मायने रखता है","सूत्र"],"ur":["مثال","یہ کیوں اہم ہے","فارمولا"],"ar":["مثال","لماذا يهمّك","المعادلة"],"ar_rm":["Mithal","Limadha yahummak","Al-mu3adala"],"ur_rm":["Misaal","Yeh kyun aham hai","Formula"]},"terms":{"en":[["Pip","The unit a price moves in — the fourth decimal on most pairs.","On EUR/USD, 1.0850 → 1.0851 is one pip. At 0.01 lots that is $0.10.","Every target and result you hear is quoted in pips, and a number of pips means nothing until you know the lot size behind it.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","A tenth of a pip. Some platforms quote points instead.","«+500 points» on EUR/USD is 50 pips. At 0.01 lots that is $5, not $500.","This is the mix-up that makes a modest result look ten times bigger. Check the unit before you compare your numbers to anyone's.","pips = points ÷ 10",""],["Spread","The gap between the buy price and the sell price. You pay it the moment you enter.","Buy 1.08515, sell 1.08500 is 1.5 pips. At 0.01 lots, $0.15 per trade.","Every trade starts behind by the spread, win or lose. Ten trades a day on a small account is a real cost.","spread cost = spread in pips × pip value","spread"],["Lot size","How much you trade. This decides what one move is worth — and it is not the same number on every instrument.","EUR/USD: 1.00 lot ≈ $10 per pip, 0.01 ≈ $0.10. Gold (XAUUSD): 1.00 lot = 100 oz, so a $1 move is $100.","This is the one number that decides whether an ordinary move is an irritation or the end of the account — and the figure differs per instrument. Sonic's own record shows it trades gold, not a currency pair. Before you size anything, check the real value: in MT5, open the symbol's Specification (on a computer, right-click the symbol).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage is how big a position you may hold. Margin is the part of your money locked while it is open.","A 0.01 lot EUR/USD position is about $1,085 of currency. At 1:300 that ties up roughly $3.60 of yours.","Higher leverage does not reduce risk. It only frees margin so you are allowed to open more.","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance is money from trades already closed. Equity is that plus or minus everything still open.","Balance $100, one trade 40 pips against you at 0.01 lots (−$4) → equity $96.","Balance is history. Equity is where you actually stand. A floating loss is a real loss not yet written down.","equity = balance + open profit − open loss",""],["Margin call and stop out","When equity falls far enough against the margin your trades need, the broker closes them for you.","$100 account carrying a $60 floating loss has $40 of equity left.","At a stop out you do not choose the exit. The loss is locked in at that moment, often at the worst point.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","A standing instruction to close at a price you picked in advance, so the loss stops growing.","Buy at 1.0850 with a stop at 1.0830 is 20 pips. At 0.01 lots, $2 at risk — decided before you entered.","Without one, the size of your loss is set by how long you can stand to look at it.","risk = stop in pips × pip value",""],["Limit and stop orders","A limit waits for a better price. A stop only triggers once price pushes through a level.","Price 1.0850. Buy Limit 1.0830 fills if price falls. Buy Stop 1.0870 fills if price rises.","Signals are posted in this shorthand: Buy Limit, Buy Stop, Sell Limit, Sell Stop. Pick the wrong one of the four and it either never triggers, or opens your trade at the wrong moment."],["Risk per trade","The money — not the pips — you accept losing on one trade.","$100 account, 0.01 lots, 20-pip stop = $2 at risk. That is 2 percent.","On a $100 account the smallest tradable size already risks several percent per trade. The «risk 1 percent» advice does not fit yet.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","How far equity has fallen from its highest point, in percent.","$100 down to $60 is 40 percent down. Getting back to $100 needs a 67 percent gain, not 40.","Losses and recoveries are not symmetrical. A run of small losses can leave you needing a return you have never produced.","gain needed = loss ÷ (1 − loss)   →   40 % lost needs 67 % back","dd"],["Compounding","Leaving gains in, so position size grows with the balance instead of staying fixed.","$100 at 5 percent a month, profit left in, is about $180 after a year rather than $160.","It is the honest argument for patience on a small account — and the engine of every unrealistic plan you will be shown.","final = start × (1 + rate)^periods",""]],"no":[["Pip","Enheten en pris beveger seg i — fjerde desimal på de fleste par.","På EUR/USD er 1,0850 → 1,0851 én pip. Ved 0,01 lot er det $0,10.","Alle mål og resultater du hører, oppgis i pips — og et antall pips sier ingenting før du vet lot-størrelsen bak.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","En tidel av en pip. Noen plattformer oppgir points i stedet.","«+500 points» på EUR/USD er 50 pips. Ved 0,01 lot er det $5, ikke $500.","Dette er forvekslingen som får et nøkternt resultat til å se ti ganger større ut. Sjekk enheten før du sammenligner tallene dine med andres.","pips = points ÷ 10",""],["Spread","Avstanden mellom kjøpsprisen og salgsprisen. Du betaler den idet du går inn.","Kjøp 1,08515, salg 1,08500 er 1,5 pips. Ved 0,01 lot er det $0,15 per handel.","Hver handel starter i minus med spreaden, enten den ender i gevinst eller tap. Ti handler om dagen på en liten konto er en reell kostnad.","spread cost = spread in pips × pip value","spread"],["Lot size","Hvor mye du handler. Det avgjør hva én bevegelse er verdt — og det er ikke samme tall på alle instrumenter.","EUR/USD: 1,00 lot ≈ $10 per pip, 0,01 ≈ $0,10. Gull (XAUUSD): 1,00 lot = 100 unser, så en bevegelse på $1 er $100.","Dette er det ene tallet som avgjør om en helt vanlig bevegelse er en irritasjon eller slutten på kontoen — og tallet er ulikt fra instrument til instrument. I Sonics egen historikk handles gull, ikke et valutapar. Før du bestemmer størrelsen på noe, sjekk den faktiske verdien: åpne symbolets Specification i MT5 (på en datamaskin høyreklikker du symbolet).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage (giring) er hvor stor posisjon du får holde. Margin er den delen av pengene dine som er låst mens den står åpen.","En posisjon på 0,01 lot EUR/USD er rundt $1 085 i valuta. Ved 1:300 binder det omtrent $3,60 av dine.","Høyere leverage reduserer ikke risiko. Den frigjør bare margin, så du får lov til å åpne mer.","margin = lots × 100 000 × pris ÷ leverage",""],["Balance and equity","Balance er penger fra handler som alt er lukket. Equity er det, pluss eller minus alt som fortsatt står åpent.","Balance $100, én handel 40 pips i minus ved 0,01 lot (−$4) → equity $96.","Balance er historie. Equity er der du faktisk står. Et flytende tap er et ekte tap som ennå ikke er bokført.","equity = balance + open profit − open loss",""],["Margin call and stop out","Når equity faller langt nok i forhold til marginen handlene dine krever, lukker megleren dem for deg.","En konto på $100 med $60 i flytende tap har $40 igjen i equity.","Ved et stop out velger ikke du utgangen. Tapet låses der og da, ofte på det verste punktet.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","En stående ordre om å lukke på en pris du valgte på forhånd, så tapet slutter å vokse.","Kjøp på 1,0850 med stopp på 1,0830 er 20 pips. Ved 0,01 lot er $2 i risiko — bestemt før du gikk inn.","Uten den avgjøres tapets størrelse av hvor lenge du orker å se på det.","risk = stop in pips × pip value",""],["Limit and stop orders","En limit venter på en bedre pris. En stop utløses først når prisen bryter gjennom et nivå.","Pris 1,0850. Buy Limit 1,0830 blir utført hvis prisen faller. Buy Stop 1,0870 blir utført hvis den stiger.","Signaler legges ut med denne kortformen: Buy Limit, Buy Stop, Sell Limit, Sell Stop. Velger du feil av de fire, blir ordren enten aldri utløst, eller den åpner handelen din på feil tidspunkt."],["Risk per trade","Pengene — ikke pipsene — du godtar å tape på én handel.","Konto $100, 0,01 lot, 20 pips stopp = $2 i risiko. Det er 2 prosent.","På en $100-konto risikerer den minste handelbare størrelsen alt flere prosent per handel. Rådet om «risiker 1 prosent» passer ikke ennå.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Hvor langt equity har falt fra toppen, i prosent.","$100 ned til $60 er 40 prosent ned. Tilbake til $100 krever 67 prosent opp, ikke 40.","Tap og gjenhenting er ikke symmetriske. En rekke små tap kan gjøre at du trenger en avkastning du aldri har oppnådd.","gain needed = loss ÷ (1 − loss)   →   40 % tap krever 67 % tilbake","dd"],["Compounding","Å la gevinsten stå, så posisjonsstørrelsen vokser med saldoen i stedet for å stå fast.","$100 med 5 prosent i måneden, med gevinsten stående i kontoen, er rundt $180 etter et år i stedet for $160.","Det er det ærlige argumentet for tålmodighet på en liten konto — og motoren i alle de urealistiske planene du kommer til å få se.","final = start × (1 + rate)^periods",""]],"hi":[["Pip","वह unit जिसमें price ऊपर-नीचे होती है — ज़्यादातर pairs में दशमलव के बाद चौथा अंक।","EUR/USD पर 1.0850 → 1.0851 एक pip है। 0.01 lot पर यह $0.10 है।","हर target और result pips में बताया जाता है — और pips की गिनती का कोई मतलब नहीं जब तक पीछे का lot size न पता हो।","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","Pip का दसवाँ हिस्सा। कुछ platforms points में बताते हैं।","EUR/USD पर «+500 points» यानी 50 pips। 0.01 lot पर $5, $500 नहीं।","यही गड़बड़ है जो एक मामूली result को दस गुना बड़ा दिखाती है। किसी से तुलना करने से पहले unit देखें।","pips = points ÷ 10",""],["Spread","ख़रीद और बिक्री के दाम का फ़र्क़। यह आप trade खोलते ही चुकाते हैं।","Buy 1.08515, sell 1.08500 यानी 1.5 pips। 0.01 lot पर $0.15 प्रति trade।","हर trade spread जितना पीछे से शुरू होती है, चाहे फ़ायदा हो या नुक़सान। छोटे account पर दिन में दस trades का मतलब असली ख़र्च है।","spread cost = spread in pips × pip value","spread"],["Lot size","आप कितना trade करते हैं। यही तय करता है कि एक हरकत कितने की है — और यह हर instrument पर एक ही संख्या नहीं होती।","EUR/USD: 1.00 lot ≈ $10 प्रति pip, 0.01 ≈ $0.10। सोना (XAUUSD): 1.00 lot = 100 औंस, यानी $1 की हरकत $100।","यही वह एक नंबर है जो तय करता है कि आम हरकत खीझ है या account का अंत — और यह हर instrument पर अलग है। Sonic का अपना record सोने में है, किसी currency pair में नहीं। size तय करने से पहले असली मान देखें: MT5 में symbol का Specification खोलें (computer पर symbol पर right-click करके)।","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage यानी कितनी बड़ी position रख सकते हैं। Margin यानी आपका वह पैसा जो खुली रहने तक रुका रहता है।","0.01 lot EUR/USD की position लगभग $1,085 की है। 1:300 पर इसमें आपके क़रीब $3.60 रुकते हैं।","ज़्यादा leverage risk कम नहीं करती। वह सिर्फ़ margin खाली करती है ताकि आप और खोल सकें।","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance बंद हो चुकी trades का पैसा है। Equity वही balance है, जिसमें अब भी खुली trades का फ़ायदा जोड़ा या नुक़सान घटाया जाता है।","Balance $100, एक trade 0.01 lot पर 40 pips घाटे में (−$4) → equity $96।","Balance इतिहास है। Equity बताती है आप असल में कहाँ हैं। खुला घाटा असली घाटा है, बस लिखा नहीं गया।","equity = balance + open profit − open loss",""],["Margin call and stop out","जब equity उस margin के मुक़ाबले काफ़ी गिर जाए जो आपकी trades माँगती हैं, broker उन्हें ख़ुद बंद कर देता है।","$100 के account पर $60 का खुला घाटा हो, तो $40 equity बचती है।","Stop out पर exit आप नहीं चुनते। घाटा उसी वक़्त पक्का हो जाता है, अक्सर सबसे बुरे मोड़ पर।","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","एक तयशुदा आदेश, जो trade को आपके पहले से चुने दाम पर बंद कर देता है, ताकि घाटा और न बढ़े।","1.0850 पर buy और 1.0830 पर stop यानी 20 pips। 0.01 lot पर $2 का risk — trade खोलने से पहले ही तय।","इसके बिना घाटे का आकार इस बात से तय होता है कि आप उसे कितनी देर तक देखते रहना बर्दाश्त कर सकते हैं।","risk = stop in pips × pip value",""],["Limit and stop orders","Limit बेहतर दाम का इंतज़ार करती है। Stop तभी चलती है जब price किसी level को पार करे।","Price 1.0850। Buy Limit 1.0830 तब भरेगी जब दाम गिरे। Buy Stop 1.0870 तब जब चढ़े।","Signals इसी शॉर्टहैंड में आते हैं: Buy Limit, Buy Stop, Sell Limit, Sell Stop। चारों में से ग़लत वाला चुना, तो वह या तो कभी चलता ही नहीं, या आपकी trade ग़लत समय पर खोल देता है।"],["Risk per trade","वह पैसा — pips नहीं — जो आप एक trade पर खोना मंज़ूर करते हैं।","$100 account, 0.01 lot, 20 pips stop = $2 risk। यानी 2 प्रतिशत।","$100 के account पर सबसे छोटी size भी हर trade पर कई प्रतिशत जोखिम में डालती है। «1 प्रतिशत risk» वाली सलाह अभी फिट नहीं बैठती।","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Equity अपने सबसे ऊँचे बिंदु से कितनी गिरी, प्रतिशत में।","$100 से $60 यानी 40 प्रतिशत नीचे। वापस $100 पर आने के लिए 67 प्रतिशत चाहिए, 40 नहीं।","घाटा और भरपाई बराबर नहीं होते। छोटे-छोटे घाटों की एक लड़ी आपसे ऐसे return की माँग कर सकती है जो आपने कभी कमाया ही नहीं।","gain needed = loss ÷ (1 − loss)   →   40 % नुक़सान के बाद 67 % वापसी चाहिए","dd"],["Compounding","फ़ायदा account में छोड़ना, ताकि position size एक जैसा न रहे, बल्कि balance के साथ बढ़े।","$100 पर महीने के 5 प्रतिशत, फ़ायदा छोड़ा हुआ, साल भर में क़रीब $180 — $160 नहीं।","छोटे account पर सब्र का ईमानदार तर्क यही है — और हर ग़ैर-हक़ीक़ी plan का इंजन भी यही है।","final = start × (1 + rate)^periods",""]],"ur":[["Pip","وہ unit جس میں price حرکت کرتی ہے — زیادہ تر pairs میں اعشاریہ کے بعد چوتھا ہندسہ۔","EUR/USD پر 1.0850 سے 1.0851 تک جانا ایک pip ہے۔ 0.01 lot پر یہ $0.10 بنتا ہے۔","ہر target اور نتیجہ pips میں بتایا جاتا ہے — اور pips کی تعداد کا کوئی مطلب نہیں جب تک پیچھے کا lot size معلوم نہ ہو۔","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","Pip کا دسواں حصہ۔ کچھ platforms points میں بتاتے ہیں۔","EUR/USD پر «+500 points» یعنی 50 pips۔ 0.01 lot پر $5، $500 نہیں۔","یہی گڑبڑ ہے جو ایک معمولی نتیجے کو دس گنا بڑا دکھاتی ہے۔ کسی سے موازنہ کرنے سے پہلے unit دیکھ لیں۔","pips = points ÷ 10",""],["Spread","خریدنے اور بیچنے کی قیمت کا فرق۔ یہ آپ trade کھولتے ہی ادا کرتے ہیں۔","Buy 1.08515، sell 1.08500 یعنی 1.5 pips۔ 0.01 lot پر ہر trade پر $0.15۔","ہر trade spread جتنی پیچھے سے شروع ہوتی ہے، چلے یا نہ چلے۔ چھوٹے account پر دن میں دس trades اصل خرچ ہے۔","spread cost = spread in pips × pip value","spread"],["Lot size","آپ کتنا trade کرتے ہیں۔ یہی طے کرتا ہے کہ ایک حرکت کتنے کی ہے — اور یہ ہر instrument پر ایک ہی عدد نہیں ہوتا۔","EUR/USD: 1.00 lot ≈ $10 فی pip، 0.01 ≈ $0.10۔ سونا (XAUUSD): 1.00 lot = 100 اونس، یعنی $1 کی حرکت $100۔","یہی وہ ایک عدد ہے جو طے کرتا ہے کہ ایک عام حرکت بس تھوڑی پریشانی ہے یا account کا خاتمہ — اور یہ ہر instrument پر الگ ہے۔ Sonic کا اپنا record سونے میں ہے، کسی currency pair میں نہیں۔ size طے کرنے سے پہلے اصل value دیکھیں: MT5 میں symbol کی Specification کھولیں (computer پر symbol پر right-click کر کے)۔","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage یعنی آپ کتنی بڑی position رکھ سکتے ہیں۔ Margin آپ کا وہ پیسہ ہے جو position کھلی رہنے تک رُکا رہتا ہے۔","0.01 lot EUR/USD کی position تقریباً $1,085 کی ہے۔ 1:300 پر اس میں آپ کے تقریباً $3.60 رُکتے ہیں۔","زیادہ leverage خطرہ کم نہیں کرتی۔ وہ صرف margin خالی کرتی ہے تاکہ آپ مزید کھول سکیں۔","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Balance بند ہو چکی trades کا پیسہ ہے۔ Equity وہی balance ہے، جس میں ابھی کھلی trades کا نفع یا نقصان بھی شامل ہو۔","Balance $100، ایک trade 0.01 lot پر 40 pips نقصان میں (−$4)، یعنی equity $96۔","Balance گزرا ہوا حساب ہے۔ Equity بتاتی ہے آپ اصل میں کہاں کھڑے ہیں۔ کھلا نقصان اصلی نقصان ہے، بس ابھی لکھا نہیں گیا۔","equity = balance + open profit − open loss",""],["Margin call and stop out","جب equity اُس margin کے مقابلے کافی گر جائے جو آپ کی trades مانگتی ہیں، broker اُنہیں خود بند کر دیتا ہے۔","$100 کے account پر $60 کا کھلا نقصان ہو تو $40 equity بچتی ہے۔","Stop out پر نکلنے کا وقت آپ نہیں چنتے۔ نقصان اُسی لمحے پکا ہو جاتا ہے، اکثر بدترین موڑ پر۔","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","پہلے سے لگایا ہوا order کہ trade آپ کی چُنی ہوئی قیمت پر بند ہو جائے، تاکہ نقصان بڑھنا رُک جائے۔","1.0850 پر buy اور 1.0830 پر stop یعنی 20 pips۔ 0.01 lot پر $2 خطرے میں — داخل ہونے سے پہلے طے۔","اس کے بغیر نقصان کا حجم اس بات سے طے ہوتا ہے کہ آپ اُسے کتنی دیر دیکھ سکتے ہیں۔","risk = stop in pips × pip value",""],["Limit and stop orders","Limit بہتر قیمت کا انتظار کرتی ہے۔ Stop تبھی چلتی ہے جب price کوئی level پار کرے۔","Price 1.0850۔ Buy Limit 1.0830 تب چلے گی جب قیمت گرے۔ Buy Stop 1.0870 تب چلے گی جب قیمت چڑھے۔","Signals اسی مختصر شکل میں آتے ہیں: Buy Limit، Buy Stop، Sell Limit، Sell Stop۔ چار میں سے غلط والا چُنا تو یا تو وہ کبھی چلتا نہیں، یا آپ کی trade غلط وقت پر کھول دیتا ہے۔"],["Risk per trade","وہ رقم — pips نہیں — جو آپ ایک trade پر کھونا قبول کرتے ہیں۔","$100 account، 0.01 lot، 20 pips stop = $2 خطرہ۔ یعنی 2 فیصد۔","$100 کے account پر سب سے چھوٹی size بھی ہر trade پر کئی فیصد خطرے میں ڈالتی ہے۔ «1 فیصد خطرہ» والا مشورہ ابھی ٹھیک نہیں بیٹھتا۔","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Equity اپنی بلند ترین سطح سے کتنی گری، فیصد میں۔","$100 سے $60 یعنی 40 فیصد نیچے۔ واپس $100 پر آنے کے لیے 67 فیصد چاہیے، 40 نہیں۔","نقصان اور بھرپائی برابر نہیں ہوتے۔ لگاتار چھوٹے نقصانات کے بعد آپ کو اِتنے return کی ضرورت پڑ سکتی ہے جتنا آپ نے کبھی کمایا ہی نہیں۔","gain needed = loss ÷ (1 − loss)   →   40 % نقصان کے بعد 67 % واپسی درکار","dd"],["Compounding","نفع account میں چھوڑنا، تاکہ position size balance کے ساتھ بڑھے، ایک جگہ کھڑی نہ رہے۔","$100 پر مہینے کے 5 فیصد، نفع چھوڑا ہوا، سال بھر میں تقریباً $180 — $160 نہیں۔","چھوٹے account پر صبر کی ایماندار دلیل یہی ہے — اور آپ کو جو بھی غیر حقیقی plan دکھایا جائے گا، اُسے بھی یہی چلاتا ہے۔","final = start × (1 + rate)^periods",""]],"ar":[["Pip","الوحدة التي يتحرّك بها السعر — الخانة العشرية الرابعة في معظم الأزواج.","على EUR/USD، 1.0850 ← 1.0851 تساوي pip واحدة. وعند 0.01 lot تساوي $0.10.","كل هدف ونتيجة تسمعها تُذكر بالـ pips — وعدد الـ pips لا يعني شيئاً حتى تعرف الـ lot size خلفه.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","عُشر الـ pip. وبعض المنصّات تعرض الـ points بدلاً منها.","«+500 points» على EUR/USD تعني 50 pips. وعند 0.01 lot فهي $5، لا $500.","هذا هو الخلط الذي يجعل نتيجة متواضعة تبدو أكبر عشر مرات. تحقّق من الوحدة قبل أن تقارن أرقامك بأرقام أي شخص آخر.","pips = points ÷ 10",""],["Spread","الفارق بين سعر الشراء وسعر البيع. تدفعه لحظة الدخول.","شراء 1.08515 وبيع 1.08500 يساوي 1.5 pip. وعند 0.01 lot فذلك $0.15 لكل صفقة.","كل صفقة تبدأ متأخرة بمقدار الـ spread، ربحت أم خسرت. وعشر صفقات يومياً على حساب صغير تكلفة حقيقية.","spread cost = spread in pips × pip value","spread"],["Lot size","حجم ما تتداوله. وهو يحدّد قيمة الحركة الواحدة — وليس الرقم نفسه على كل أداة.","EUR/USD: ‏1.00 lot ≈ $10 لكل pip، و0.01 ≈ $0.10. والذهب (XAUUSD): ‏1.00 lot = 100 أونصة، فحركة بـ $1 تساوي $100.","هو الرقم الوحيد الذي يقرّر إن كانت حركة عادية مجرّد إزعاج أم نهاية الحساب — وهو يختلف بين أداة وأخرى. وسجل Sonic نفسه على الذهب، لا على زوج عملات. فقبل أن تحدّد الحجم، تحقّق من القيمة الحقيقية: في MT5 افتح Specification الخاصة بالرمز (على الكمبيوتر: اضغط بالزر الأيمن على الرمز).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","الـ leverage هو حجم الصفقة المسموح لك بفتحها. والـ margin هو الجزء المحجوز من مالك ما دامت مفتوحة.","صفقة 0.01 lot على EUR/USD تساوي نحو $1,085. وعند 1:300 يُحجز لها نحو $3.60 من مالك.","الـ leverage الأعلى لا يقلّل الخطر. كل ما يفعله أنه يحرّر جزءاً من الـ margin، فيُسمح لك بفتح المزيد.","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","الـ balance مال الصفقات المغلقة. والـ equity هو ذلك، زائداً أو ناقصاً كل ما زال مفتوحاً.","Balance ‏$100، وصفقة واحدة خاسرة 40 pip عند 0.01 lot (−$4) ← equity ‏$96.","الـ balance هو الماضي. والـ equity هو موقعك الفعلي الآن. والخسارة العائمة خسارة حقيقية لم تُقيَّد بعد.","equity = balance + open profit − open loss",""],["Margin call and stop out","حين يهبط الـ equity بما يكفي مقارنةً بالـ margin الذي تتطلّبه صفقاتك، يغلقها الـ broker نيابةً عنك.","حساب بـ $100 يحمل خسارة عائمة $60 يتبقّى له $40 من الـ equity.","عند الـ stop out لا تختار أنت لحظة الخروج. تُثبَّت الخسارة حينها، وغالباً عند أسوأ نقطة.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","أمر قائم بالإغلاق عند سعر اخترته مسبقاً، فتتوقّف الخسارة عن النمو.","شراء عند 1.0850 مع stop عند 1.0830 يساوي 20 pip. وعند 0.01 lot فذلك $2 تخاطر بها — قرّرتها قبل الدخول.","من دونه يتحدّد حجم خسارتك بمقدار ما تحتمل النظر إليها.","risk = stop in pips × pip value",""],["Limit and stop orders","الـ limit ينتظر سعراً أفضل. والـ stop لا يُنفَّذ إلا بعد أن يخترق السعر مستوى معيّناً.","السعر 1.0850. Buy Limit عند 1.0830 يُنفَّذ إن هبط السعر. وBuy Stop عند 1.0870 يُنفَّذ إن صعد.","الإشارات تُنشر بهذا الاختصار: Buy Limit وBuy Stop وSell Limit وSell Stop. واختيار النوع الخاطئ من بين الأربعة يعني إمّا ألّا يُنفَّذ الأمر أبداً، وإمّا أن تُفتح صفقتك في اللحظة الخاطئة."],["Risk per trade","المبلغ — لا الـ pips — الذي تقبل خسارته في صفقة واحدة.","حساب $100، و0.01 lot، وstop بـ 20 pip = $2 تخاطر بها. أي 2 بالمئة.","على حساب بـ $100 فإن أصغر حجم قابل للتداول يخاطر أصلاً بعدّة بالمئة في الصفقة. ونصيحة «خاطر بواحد بالمئة» لا تناسب بعد.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","مقدار هبوط الـ equity عن أعلى نقطة بلغها، بالنسبة المئوية.","من $100 إلى $60 هبوط 40 بالمئة. والعودة إلى $100 تحتاج ربحاً 67 بالمئة، لا 40.","الخسارة والتعويض ليسا متناظرين. وسلسلة من الخسائر الصغيرة قد تتركك بحاجة إلى عائد لم تحقّقه يوماً.","gain needed = loss ÷ (1 − loss)   →   خسارة 40 % تحتاج إلى استرداد 67 %","dd"],["Compounding","ترك الأرباح في الحساب، فينمو حجم الصفقة مع الرصيد بدل أن يبقى ثابتاً.","‏$100 بنسبة 5 بالمئة شهرياً مع ترك الربح تصير نحو $180 بعد سنة، لا $160.","هي الحجّة الصادقة للصبر على حساب صغير — وهي أيضاً محرّك كل خطة غير واقعية ستُعرض عليك.","final = start × (1 + rate)^periods",""]],"ar_rm":[["Pip","Al-wahda allati yataharrak biha al-si3r — al-khana al-3ushriya al-rabi3a fi mu3zam al-azwaj.","3ala EUR/USD, 1.0850 → 1.0851 tusawi pip wahida. W 3ind 0.01 lot tusawi $0.10.","Kull hadaf w natija tasma3uha tudhkar bil-pips — w 3adad al-pips la ya3ni shay'an hatta ta3rif al-lot size khalfah.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","3ushr al-pip. W ba3d al-minassat ta3rid al-points badalan minha.","«+500 points» 3ala EUR/USD ta3ni 50 pips. W 3ind 0.01 lot fahiya $5, la $500.","Hadha huwa al-khalt alladhi yaj3al natija mutawadi3a tabdu akbar 3ashr marrat. Tahaqqaq min al-wahda qabl an tuqarin arqamak bi-arqam ayy shakhs akhar.","pips = points ÷ 10",""],["Spread","Al-fariq bayn si3r al-shira' w si3r al-bay3. Tadfa3uh lahzat al-dukhul.","Shira' 1.08515 w bay3 1.08500 yusawi 1.5 pip. W 3ind 0.01 lot fadhalik $0.15 li-kull safqa.","Kull safqa tabda' muta'akhkhira bi-miqdar al-spread, rabihat am khasirat. W 3ashr safaqat yawmiyan 3ala hisab saghir taklifa haqiqiya.","spread cost = spread in pips × pip value","spread"],["Lot size","Hajm ma tatadawaluh. W huwa yuhaddid qimat al-haraka al-wahida — w laysa al-raqm nafsuh 3ala kull adah.","EUR/USD: 1.00 lot ≈ $10 li-kull pip, w 0.01 ≈ $0.10. W al-dhahab (XAUUSD): 1.00 lot = 100 unsa, faharaka bi $1 tusawi $100.","Huwa al-raqm al-wahid alladhi yuqarrir in kanat haraka 3adiya mujarrad iz3aj am nihayat al-hisab — w huwa yakhtalif bayn adah w ukhra. W sijill Sonic nafsuh 3ala al-dhahab, la 3ala zawj 3umlat. Faqabl an tuhaddid al-hajm, tahaqqaq min al-qima al-haqiqiya: fi MT5 iftah Specification al-khassa bil-ramz (3ala al-kumbyutar: idghat bil-zirr al-ayman 3ala al-ramz).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Al-leverage huwa hajm al-safqa al-masmuh lak bi-fathiha. W al-margin huwa al-juz' al-mahjuz min malak ma damat maftuha.","Safqat 0.01 lot 3ala EUR/USD tusawi nahwa $1,085. W 3ind 1:300 yuhjaz laha nahwa $3.60 min malak.","Al-leverage al-a3la la yuqallil al-khatar. Kull ma yaf3aluh annahu yuharrir juz'an min al-margin, fayusmah lak bi-fath al-mazid.","margin = lots × 100,000 × price ÷ leverage",""],["Balance and equity","Al-balance mal al-safaqat al-mughlaqa. W al-equity huwa dhalik, za'idan aw naqisan kull ma zal maftuhan.","Balance $100, w safqa wahida khasira 40 pip 3ind 0.01 lot (−$4) → equity $96.","Al-balance huwa al-madi. W al-equity huwa mawqi3ak al-fi3li al-an. W al-khasara al-3a'ima khasara haqiqiya lam tuqayyad ba3d.","equity = balance + open profit − open loss",""],["Margin call and stop out","Hin yahbit al-equity bima yakfi muqaranatan bil-margin alladhi tatatallabuh safaqatak, yughliquha al-broker niyabatan 3ank.","Hisab bi $100 yahmil khasara 3a'ima $60 yatabaqqa lah $40 min al-equity.","3ind al-stop out la takhtar anta lahzat al-khuruj. Tuthabbat al-khasara hinaha, w ghaliban 3ind aswa' nuqta.","margin level = (equity ÷ used margin) × 100 %",""],["Stop-loss","Amr qa'im bil-ighlaq 3ind si3r ikhtartah musbaqan, fatatawaqqaf al-khasara 3an al-numuw.","Shira' 3ind 1.0850 ma3 stop 3ind 1.0830 yusawi 20 pip. W 3ind 0.01 lot fadhalik $2 tukhatir biha — qarrartaha qabl al-dukhul.","Min dunih yatahaddad hajm khasaratak bi-miqdar ma tahtamil al-nazar ilayha.","risk = stop in pips × pip value",""],["Limit and stop orders","Al-limit yantazir si3ran afdal. W al-stop la yunaffadh illa ba3d an yakhtariq al-si3r mustawan mu3ayyanan.","Al-si3r 1.0850. Buy Limit 3ind 1.0830 yunaffadh in habat al-si3r. W Buy Stop 3ind 1.0870 yunaffadh in sa3id.","Al-isharat tunshar bi-hadha al-ikhtisar: Buy Limit w Buy Stop w Sell Limit w Sell Stop. W ikhtiyar al-naw3 al-khati' min bayn al-arba3a ya3ni imma alla yunaffadh al-amr abadan, w imma an tuftah safqatak fil-lahza al-khati'a."],["Risk per trade","Al-mablagh — la al-pips — alladhi taqbal khasaratah fi safqa wahida.","Hisab $100, w 0.01 lot, w stop bi 20 pip = $2 tukhatir biha. Ay 2 bil-mi'a.","3ala hisab bi $100 fa'inna asghar hajm qabil lil-tadawul yukhatir aslan bi-3iddat bil-mi'a fil-safqa. W nasihat «khatir bi-wahid bil-mi'a» la tunasib ba3d.","lots = risk in $ ÷ (stop in pips × $10)","size"],["Drawdown","Miqdar hubut al-equity 3an a3la nuqta balaghaha, bil-nisba al-mi'awiya.","Min $100 ila $60 hubut 40 bil-mi'a. W al-3awda ila $100 tahtaj ribhan 67 bil-mi'a, la 40.","Al-khasara w al-ta3wid laysa mutanazirayn. W silsila min al-khasa'ir al-saghira qad tatrukak bi-haja ila 3a'id lam tuhaqqiqh yawman.","gain needed = loss ÷ (1 − loss)   →   khasarat 40 % tahtaj ila istirdad 67 %","dd"],["Compounding","Tark al-arbah fil-hisab, fayanmu hajm al-safqa ma3 al-rasid badal an yabqa thabitan.","$100 bi-nisbat 5 bil-mi'a shahriyan ma3 tark al-ribh tasir nahwa $180 ba3d sana, la $160.","Hiya al-hujja al-sadiqa lil-sabr 3ala hisab saghir — w hiya aydan muharrik kull khutta ghayr waqi3iya satu3rad 3alayk.","final = start × (1 + rate)^periods",""]],"ur_rm":[["Pip","Woh unit jis mein price harkat karti hai — zyada tar pairs mein ashariya ke baad chautha hindsa.","EUR/USD par 1.0850 se 1.0851 tak jaana ek pip hai. 0.01 lot par yeh $0.10 banta hai.","Har target aur nateeja pips mein bataya jaata hai — aur pips ki tadaad ka koi matlab nahi jab tak peeche ka lot size maloom na ho.","pip value = lots × $10   (USD-quoted pair)","pip"],["Point","Pip ka daswan hissa. Kuch platforms points mein batate hain.","EUR/USD par «+500 points» yaani 50 pips. 0.01 lot par $5, $500 nahi.","Yahi gadbad hai jo ek maamooli nateeje ko das guna bada dikhati hai. Kisi se muwazna karne se pehle unit dekh lein.","pips = points ÷ 10",""],["Spread","Khareedne aur bechne ki qeemat ka farq. Yeh aap trade kholte hi ada karte hain.","Buy 1.08515, sell 1.08500 yaani 1.5 pips. 0.01 lot par har trade par $0.15.","Har trade spread jitni peeche se shuru hoti hai, chale ya na chale. Chhote account par din mein das trades asal kharcha hai.","spread cost = spread in pips × pip value","spread"],["Lot size","Aap kitna trade karte hain. Yahi tay karta hai keh ek harkat kitne ki hai — aur yeh har instrument par ek hi adad nahi hota.","EUR/USD: 1.00 lot ≈ $10 fi pip, 0.01 ≈ $0.10. Sona (XAUUSD): 1.00 lot = 100 ounce, yaani $1 ki harkat $100.","Yahi woh ek adad hai jo tay karta hai keh ek aam harkat bas thori pareshani hai ya account ka khaatma — aur yeh har instrument par alag hai. Sonic ka apna record sone mein hai, kisi currency pair mein nahi. Size tay karne se pehle asal value dekhein: MT5 mein symbol ki Specification kholein (computer par symbol par right-click kar ke).","pip/point value = lots × contract size × tick     EURUSD → $10 · XAUUSD → $100","lot"],["Leverage and margin","Leverage yaani aap kitni badi position rakh sakte hain. Margin aap ka woh paisa hai jo position khuli rehne tak ruka rehta hai.","0.01 lot EUR/USD ki position taqreeban $1,085 ki hai. 1:300 par is mein aap ke taqreeban $3.60 rukte hain.","Zyada leverage khatra kam nahi karti. Woh sirf margin khaali karti hai taakeh aap mazeed khol sakein.
